{"id":"tremaya","doc":true,"ft":true,"n":"Tren Maya railway (Yucatán Peninsula)","cat":"Ports & transport","region":"North America","country":"Mexico","lat":19.8,"lon":-88.6,"jur":"mx","org":"Government of Mexico","src":{"t":"Peer-reviewed article","y":2025,"cite":"Zambrano, L., Fernandez Vargas, T., González, E. J., Mendoza-Ponce, A., Llano Vazquez Prada, M., Flores Lot, C., Corona-Nuñez, R. O., & Martínez-Meyer, E. (2025). Proximal and distal impacts of a megaproject on ecosystem services in rural territories of the Yucatán Peninsula, Mexico. Frontiers in Environmental Science, 13, 1587777.","url":"https://doi.org/10.3389/fenvs.2025.1587777"},"note":"Open-access full text read. This is an independent ecosystem-services modelling study (InVEST, DINAMICA-EGO), not the official MIA; it comments on the MIA process. The proponent is named here generically; the paper does not name the implementing agency.","loc":"Yucatán Peninsula: Campeche, Yucatán and Quintana Roo, with parts of Tabasco and Chiapas","desc":"A 1,525 km passenger and freight rail loop around the Yucatán Peninsula, built between December 2018 and December 2024. It was cleared along a corridor up to 200 m wide, including sections along the Caribbean coast over karst and cenotes. The study models how the line and the growth it brings change habitat quality, pollination and carbon sequestration to 2050.","need":"Regional development, tourism and connectivity in south-east Mexico.","cap":"1,525 km rail network","sched":"Dec 2018 – Dec 2024","area":"Study area 147,918 km²; 200 m-wide construction corridor","cost":"About US$23 billion","facts":["More than 60 km² deforested, mostly well-conserved tropical rainforest","Dozens of cenotes damaged along the Caribbean coast","The region's population is expected to grow 50% in a decade"],"found":["The environmental assessments were done after construction had started and section by section, looking only at nearby (proximal) impacts.","Distal effects (urban, tourism and farming growth that the train brings) cause steeper declines in all three ecosystem services than the line itself.","Proximal impacts alone cut pollination by up to 21.7% in tropical rainforest.","Habitat loss threatens connectivity for jaguar, white-lipped peccary and tapir, including within Calakmul Biosphere Reserve.","The authors call for megaproject EIAs to include distal impacts, with peninsula-wide protected areas and restoration."],"a":["clear","earth","access","ctraffic","workforce","install",{"n":"Train operation","ph":"O","tags":["noise","traffic","land"]},{"n":"Induced urban and tourism growth near stations","ph":"O","tags":["land","influx","clear"]},"presence","maint"],"c":["climate","terr","fauna","species","gw","geology","land","econ","indig","heritage","landscape"],"s":{"terr":5,"gw":5,"species":4},"hi":{"terr":4,"fauna":4,"species":3,"gw":3,"land":3},"res":["terr","fauna"],"ans":{"t1":"y","l1":"y","l3":"y","l4":"y","l5":"y","l7":"y","l8":"y","l10":"y","c1":"y","c7":"y","i1":"y","i3":"y","i4":"y"},"alts":[["Project as built","Section-by-section MIAs, proximal impacts only"],["Future without the train","The study's baseline scenario"]],"stake":[["Maya rural communities (milpa farmers)","indigenous",5,2],["Federal government","authority",5,5],["Tourism developers on the Caribbean coast","business",4,4],["Conservation scientists","academic",4,2]],"cum":[["Tourism development along the Caribbean coast","Existing",null],["Agricultural and grazing expansion","Existing",null],["Urban growth around stations","Foreseeable",null]]},
{"id":"madeira","doc":true,"ft":true,"n":"Madeira River dams: Santo Antônio and Jirau","cat":"Energy","region":"South America","country":"Brazil","lat":-9,"lon":-64.3,"jur":"br","org":"Santo Antônio and Jirau hydropower consortia","src":{"t":"Peer-reviewed article","y":2014,"cite":"Fearnside, P. M. (2014). Brazil's Madeira River dams: A setback for environmental policy in Amazonian development. Water Alternatives, 7(1), 256–269.","url":"https://www.water-alternatives.org/index.php/alldoc/articles/vol7/v7issue1/244-a7-1-15/file"},"note":"Open-access full text read. A critical analysis of the EIA/RIMA and IBAMA licensing by an INPA researcher. It gives no total reservoir areas (only km²/MW), resettlement numbers or capital costs. The consortia are not named in detail here.","loc":"Madeira River, Rondônia, Brazil; Santo Antônio just above Porto Velho, Jirau 117 km upstream","desc":"Two run-of-river dams with bulb turbines on the Madeira, a major Amazon tributary: Santo Antônio (3,150 MW, 55 m high) and Jirau (3,750 MW, 65 m high). Jirau was given a variable water level (82.5–90.4 m a.s.l.) to limit backwater flooding into Bolivia. They are part of a planned Madeira waterway and dam chain that includes further dams in Bolivia.","need":"Hydropower for Brazil's national grid, sent south by a planned 2,450 km transmission line.","cap":"6,900 MW combined","sched":"EIA/RIMA 2005; preliminary licence 9 Jul 2007; installation licence 13 Aug 2008","area":"Reservoir 0.11 km²/MW (Santo Antônio) and 0.10 km²/MW (Jirau)","cost":"Not stated; variable level raises Jirau generation cost 12% (US$22.76 to 25.50/MWh)","facts":["IBAMA technical staff issued a 221-page opinion opposing the preliminary licence (21 Mar 2007)","Installation licence granted with 33 preliminary-licence conditions unmet","Mean flow at Jirau is 17,686 m³/s, 24% more than the Yangtze at Three Gorges"],"found":["IBAMA staff asked for a new EIA/RIMA; the head of licensing and IBAMA's president were replaced before the licences were issued.","Blocking giant catfish migration (Brachyplatystoma rousseauxii and B. vaillantii) harms fisherfolk in Bolivia and Peru as well as Brazil.","Mercury left in sediments by the 1980s gold rush may be methylated as tributary sediments become anoxic.","Sediment building up at the head of Jirau could raise water levels upstream and flood Bolivia; high methane was measured at Santo Antônio.","Displaced residents and migrants have driven deforestation; the author concludes that the EIA only legalised a decision already taken."],"a":["clear","earth","access","workforce","inwater",{"n":"Dam and reservoir impoundment","ph":"O","tags":["impound","inwater","land"]},{"n":"Blocking of fish migration","ph":"O","tags":["inwater"]},{"n":"Reservoir methane emissions","ph":"O","tags":["ghg","lowcarbon"]},"presence","ojobs",{"n":"Sediment build-up and backwater rise","ph":"O","tags":["inwater","impound"]}],"c":["climate","sw","aquatic","species","terr","health","econ","land","indig","geology"],"s":{"aquatic":5,"sw":5},"hi":{"aquatic":4,"sw":3,"health":3,"terr":3,"climate":3},"res":["aquatic","terr"],"ans":{"t1":"y","l2":"y","l3":"y","l4":"y","l10":"y","c1":"y","c5":"y","c6":"y","c7":"y","i1":"y","i2":"y","i3":"y","i4":"y"},"alts":[["Run-of-river bulb turbines (selected)","Lower impact but, per the author, far from benign"],["Variable Jirau water level","Limits flooding in Bolivia; 12% higher cost"],["Wind, solar and energy conservation","Proposed by the author as options"]],"stake":[["IBAMA technical licensing staff","authority",4,2],["Ministry of Environment / Presidency","authority",5,5],["Fisherfolk in Brazil, Bolivia and Peru","community",5,1],["Government of Bolivia","authority",4,3],["Riverside displaced populations","vulnerable",5,1]],"cum":[["Guajará-Mirim/Cachoeira Ribeirão dam (3,000 MW)","Planned",null],["Cachuela Esperanza dam, Beni River, Bolivia (600–800 MW)","Planned",null],["Madeira soybean waterway","Planned",null],["~30 large dams in Legal Amazonia (2011–2020 plan)","Planned",null]]},
{"id":"hidroaysen","doc":true,"ft":true,"n":"HidroAysén hydroelectric complex (Baker and Pascua rivers)","cat":"Energy","region":"South America","country":"Chile","lat":-47.6,"lon":-72.8,"jur":"cl","org":"HidroAysén S.A.","src":{"t":"Government decision","y":2014,"cite":"Ministerio del Medio Ambiente, Chile (2014, 10 June). Comité de Ministros acoge reclamaciones presentadas por la ciudadanía y decide rechazar proyecto HidroAysén. Santiago: MMA.","url":"https://mma.gob.cl/comite-de-ministros-acoge-reclamaciones-presentadas-por-la-ciudadania-y-decide-rechazar-proyecto-hidroaysen/"},"note":"Official Ministry of the Environment statement read in full. Project data come from the proponent's 2008 CIGRE seminar presentation, also read in full: the 18,090 GWh/yr figure there belongs to the earlier 2004–05 four-plant design (2,430 MW, 9,300 ha); the assessed five-plant design is 2,750 MW and 18,430 GWh/yr. The Santiago Environmental Court upheld the rejection on 31 Oct 2017 (R-40-2014). The SEIA file itself could not be opened. Verified against the full text in the browser on 30 September 2026.","loc":"Baker and Pascua rivers, communes of Cochrane, Tortel and O'Higgins, Aysén Region, Patagonia","desc":"Five hydropower plants: Baker 1 (660 MW, 710 ha reservoir), Baker 2 (360 MW, 3,600 ha), Pascua 1 (460 MW, 500 ha), Pascua 2.1 (770 MW, 990 ha) and Pascua 2.2 (500 MW), with reservoirs covering 5,910 ha in total. The power was to be sent to central Chile by a separate ~2,000 km HVDC line.","need":"Supply the central interconnected grid (SIC).","cap":"2,750 MW; 18,430 GWh/yr","sched":"EIA filed Aug 2008; RCA approved 13 May 2011; rejected by the Committee of Ministers 10 Jun 2014","area":"Reservoirs 5,910 ha (earlier 2004–05 designs 9,300 ha)","cost":"Not stated in the sources opened","facts":["35 appeals against the RCA (34 from citizen groups, 1 from the proponent) and 993 contested observations (landscape and tourism 308; human environment and heritage 225; procedure 153; hydrology 132; terrestrial ecosystems 124; aquatic and marine 51)","39 families to be resettled","Average daily workforce about 2,200 (camps of 700, 350 and 1,150), peaking at 4,000–5,000"],"found":["The resettlement plan for 39 families was inadequate: no receiving sites and no carrying-capacity studies were presented.","The flood risk from a glacial lake outburst (about 3,500 m³/s) at the Baker–Colonia confluence was not properly modelled.","The effects downstream of daily peaking flow changes of up to 1,275 m³/s were not assessed.","The baseline data on carnivores and amphibians was deficient, and displacement from flooding and works was not analysed.","The Committee upheld all the appeals and cancelled the favourable RCA; the court later confirmed the rejection."],"a":["clear","earth","access","ctraffic","workforce","inwater",{"n":"Reservoir impoundment","ph":"O","tags":["impound","land","inwater"]},{"n":"Hydropeaking flow releases","ph":"O","tags":["inwater"]},"presence","ojobs",{"n":"Glacial lake outburst flood","ph":"U","tags":["accident","inwater"]}],"c":["sw","aquatic","terr","fauna","species","landscape","land","econ","health","infra"],"s":{"sw":5,"landscape":5},"hi":{"sw":4,"fauna":3,"land":3,"aquatic":3},"res":["sw","fauna","land"],"ans":{"t1":"y","l2":"y","l3":"y","l4":"u","l10":"y","c1":"y","c4":"y","c6":"y","i1":"y","i3":"y","i4":"y"},"alts":[["Five-dam scheme, 5,910 ha (assessed)","Rejected in 2014"],["Earlier 2004–05 design, 9,300 ha","Reduced before the EIA"]],"stake":[["Resettled families (39)","vulnerable",5,1],["Citizen organisations (34 appellants)","ngo",5,3],["Committee of Ministers (Environment Minister chair)","authority",4,5],["HidroAysén S.A. (Endesa Chile group)","business",5,4],["Communes of Cochrane, Tortel and O'Higgins","authority",4,2]],"cum":[["HVDC transmission line to the SIC (~2,000 km)","Planned",null]]},
{"id":"conga","doc":true,"ft":true,"n":"Conga gold–copper mine","cat":"Mining","region":"South America","country":"Peru","lat":-6.93,"lon":-78.37,"jur":"pe","org":"Minera Yanacocha S.R.L. (Newmont, Buenaventura, IFC)","src":{"t":"Government-commissioned expert review","y":2012,"cite":"Fernández Rubio, R., López García, L., & Martins Carvalho, J. (2012). Dictamen pericial internacional: Componente hídrico del Estudio de Impacto Ambiental del Proyecto Minero Conga (Cajamarca, Perú). Report to the Presidencia del Consejo de Ministros, 17 April 2012. Lima: SINIA/MINAM.","url":"https://sinia.minam.gob.pe/documentos/dictamen-pericial-internacional-componente-hidrico-estudio-impacto"},"note":"The international expert review of the water component of the EIA (Dictamen Pericial, April 2012), 263 scanned pages, read in full through text extraction in the browser. It covers only the water component, not wetland ecology. Ownership, reserves, spending and the Chailhuagón reservoir volume come from Newmont's Conga fact sheet (s24.q4cdn.com), which was not re-checked. Verified against the full text in the browser on 30 September 2026.","loc":"High Andes about 24 km north-east of the Yanacocha operations, Cajamarca, Peru","desc":"Open-pit gold–copper mine with the Perol and Chailhuagón pits, waste-rock dumps and a tailings facility. Four lakes (Perol, Azul, Chica and Mala) and 103 ha of bofedales would be lost; three reservoirs would replace the affected flows and a fourth would be shared with the mine until closure. The EIA was approved on 27 Oct 2010; construction was suspended in Nov 2011 after protests.","need":"Gold and copper production.","cap":"6.5 Moz gold and 1.7 billion lb copper in reserves (Dec 2012)","sched":"EIA approved Oct 2010; suspended Nov 2011; expert review Apr 2012","area":"Concession 34,000 ha plus 6,000 ha of surface rights","cost":"US$440 million spent in 2012–2013 (fact sheet)","facts":["Loss of four lakes and 103 ha of bofedales (high-Andean wetlands)","Jerez Jadibamba irrigation canal serves 687 ha and 280 users","Three flow-replacement reservoirs plus a fourth shared with the mine"],"found":["The experts judged the EIA's assessment of surface-water effects sound and the proposed mitigation correct; stored wet-season water would keep dry-season flows downstream at least at current levels.","Losing four lakes and 103 ha of bofedales was judged of low significance for surface-water quantity, because the area is small relative to the catchments. The review did not assess wetland ecology.","They recommended studying the relocation of the Perol waste rock so that it does not bury Azul and Chica lakes, and increasing reservoir capacity where possible (enlarging Chailhuagón looked difficult).","Monitoring had gaps: the three continuous gauging stations installed in 2004 were destroyed by vandalism by 2007, and the EIA did not consider climate change.","They proposed recalibrating the groundwater model every four years and a monitoring committee attached to a trusted, neutral institution."],"a":["clear","earth","access","workforce",{"n":"Draining lakes and open-pit mining","ph":"C","tags":["dewater","land","clear"]},{"n":"Waste-rock dumps over lakes","ph":"O","tags":["waste","land"]},{"n":"Tailings storage","ph":"O","tags":["waste","haz"]},{"n":"Compensation reservoirs","ph":"O","tags":["impound","abstr"]},"efflu","ojobs","rehab","failure"],"c":["sw","gw","wetland","aquatic","landscape","land","econ","health","infra"],"s":{"sw":5,"wetland":5,"gw":4},"hi":{"sw":3,"wetland":3,"land":3},"res":[],"ans":{"t1":"y","l2":"y","l5":"y","l10":"y","c1":"y","c2":"y","c3":"y","c4":"y","i1":"y","i3":"y","i4":"u"},"alts":[["EIA design (lakes replaced by reservoirs)","Approved 2010"],["Relocate Perol waste rock","Recommended for study to save Azul and Chica lakes"],["Increase reservoir capacity","Recommended where feasible"]],"stake":[["Downstream irrigators (e.g. Jerez Jadibamba canal, 280 users)","community",5,3],["Cajamarca communities and regional government","community",5,4],["Presidency of the Council of Ministers","authority",4,5],["Ministry of Energy and Mines (EIA approver)","authority",4,5],["Minera Yanacocha","business",5,4],["Cajamarca universities (proposed monitors)","academic",3,2]],"cum":[["Yanacocha gold mine","Existing",24]]},
{"id":"ituango","doc":true,"ft":true,"n":"Hidroituango (Pescadero-Ituango) hydroelectric project: 2018 contingency","cat":"Energy","region":"South America","country":"Colombia","lat":7.14,"lon":-75.65,"jur":"co","org":"Hidroeléctrica Ituango S.A. E.S.P.","src":{"t":"Government regulatory resolution","y":2018,"cite":"Autoridad Nacional de Licencias Ambientales (ANLA) (2018). Resolución 00820 de 1 de junio de 2018, por la cual se impone una medida preventiva [Proyecto Hidroeléctrico Pescadero-Ituango]. Bogotá: ANLA.","url":"https://gestornormativo.creg.gov.co/gestor/entorno/docs/resolucion_anla_0820_2018.htm"},"note":"Full resolution read (CREG normative repository copy). It is a regulatory enforcement act, not the original EIA. The reservoir volume printed in the extracted text looked wrong and has been left out. The operator EPM is not named in the text used here.","loc":"Cauca River canyon, Antioquia, Colombia (Ituango, Briceño, Valdivia and eight other municipalities)","desc":"A 225 m high dam on the Cauca River with a 2,400 MW underground powerhouse, licensed in 2009 and modified twelve times. In April–May 2018 the auxiliary diversion gallery (GAD) collapsed and blocked, followed by landslides. This forced emergency evacuations downstream and ANLA's precautionary suspension of works.","need":"Electricity supply; average generation of 13,930 GWh/yr.","cap":"2,400 MW","sched":"Licence Resolución 0155, 30 Jan 2009; GAD collapse 28 Apr 2018; suspension 1 Jun 2018","area":"11 municipalities in Antioquia","cost":"Not stated in the resolution","facts":["More than 100,000 people downstream affected","1,500 workers evacuated on 29 May 2018","Licence modified 12 times between 2009 and 2018"],"found":["ANLA suspended construction and reservoir-filling work not needed for the emergency, citing the precautionary and prevention principles.","Orobajo and Barbacoas were evacuated; Puerto Valdivia, Puerto Antioquia, Cáceres and Tarazá were placed on red alert with preventive evacuation.","Recorded effects include the collapse of three pedestrian bridges, damage to a vehicle bridge and a school, and risks to fish, sediment transport and channel form down to the Nechí confluence.","ANLA required a high-consequence area study, failure-mode modelling, daily bathymetry, weekly stability reports and downstream water-quality and hydrobiological monitoring."],"a":["clear","earth","access","workforce","inwater",{"n":"River diversion tunnels (GAD)","ph":"C","tags":["inwater","earth"]},{"n":"Reservoir filling","ph":"C","tags":["impound","inwater"]},"presence","ojobs","failure",{"n":"Tunnel collapse and uncontrolled flow","ph":"U","tags":["accident","inwater"]}],"c":["sw","aquatic","geology","terr","health","land","infra","econ","work"],"s":{"health":5,"sw":5},"hi":{"health":4,"infra":4,"sw":4,"aquatic":3,"geology":3},"res":["health","sw"],"ans":{"t1":"y","l2":"y","l6":"y","l10":"y","c1":"y","c4":"y","c5":"y","c6":"y","i1":"y","i3":"y","i4":"y"},"alts":[["Continue under a preventive measure","Only works needed for the contingency allowed"]],"stake":[["Downstream riverside communities (Puerto Valdivia, Cáceres, Tarazá)","vulnerable",5,2],["Evacuated villages Orobajo and Barbacoas","community",5,1],["ANLA","authority",5,5],["Hidroeléctrica Ituango S.A. E.S.P.","business",5,4],["Construction workers","workers",4,2]],"cum":[]},
{"id":"nicacanal","doc":true,"ft":true,"n":"Nicaragua Interoceanic Grand Canal: West Segment","cat":"Ports & transport","region":"Central America & Caribbean","country":"Nicaragua","lat":11.35,"lon":-85.97,"jur":"generic","org":"HKND Group (Hong Kong Nicaragua Canal Development)","src":{"t":"Peer-reviewed article","y":2018,"cite":"Muñoz Ardila, A., Rebscher, A., & Hack, J. (2018). An open-data based assessment of expected changes in land use and water availability as a result of the construction of the West Segment of the Nicaragua Interoceanic Canal. Environments, 5(1), 14.","url":"https://doi.org/10.3390/environments5010014"},"note":"Open-access full text read. It independently re-checks the 2015 ERM ESIA for the West Segment only, using open data (Landsat 7 from Jan 2000, WorldClim, SCS Curve Number); the authors flag data and calibration limits. The canal has not been built.","loc":"Rivas department, Pacific coast at Brito to Lake Nicaragua (Cocibolca)","desc":"Proposed canal granted to HKND under Law No. 840 (June 2013), with an official construction start declared in December 2014. The West Segment runs 25.9 km: 12.5 km from the Pacific to Brito Lock and 13.4 km from the lock to Lake Nicaragua. The channel is at least 26.9 m deep with a bottom width of at least 230 m; project-wide excavation is about 5,000 million m³.","need":"Interoceanic shipping route.","cap":"Channel ≥26.9 m deep, ≥230 m bottom width","sched":"Concession 2013; ESIA 2015; 15-year construction plan","area":"West Canal Zone; Brito (271.4 km²) and Las Lajas (106.8 km²) catchments","cost":"About US$40 billion","facts":["About 16,500 residents directly affected in the West Canal Zone","175.8 km of roads affected, and the Pan-American Highway interrupted","Local discharge (7.1 m³/s) covers only about 20% of Brito Lock demand (36.5 m³/s in 2050)"],"found":["Forest affected is 53.7 km² more than the ESIA reported; mangroves about 290 ha against 103 ha in the ESIA.","The ESIA is internally inconsistent: forest cover given as 3% and 30% for the same area (about 6,500 ha apart), and precipitation figures conflict.","Local rivers cannot supply the Brito Lock, and it is unclear whether water would come from the planned artificial Lake Atlanta.","The route crosses the Marina Isla La Anciana reserve and its mangroves; it avoids the Nahoa Indigenous territory a few km north.","The authors call for an independent, transparent review, long-term climate data and protection of the Brito estuary and dry forest."],"a":["clear","earth","access","workforce","inwater",{"n":"Excavation and dredging of the canal","ph":"C","tags":["earth","inwater","marine","waste"]},{"n":"Lock water supply","ph":"O","tags":["abstr"]},{"n":"Ship transit","ph":"O","tags":["traffic","marine"]},"presence",{"n":"Resettlement and road severance","ph":"C","tags":["land","traffic"]}],"c":["sw","wetland","coast","terr","fauna","land","infra","econ","indig","landscape"],"s":{"wetland":5,"sw":4},"hi":{"terr":4,"wetland":4,"sw":4,"land":4,"infra":3},"res":["terr","wetland"],"ans":{"t1":"y","l1":"y","l2":"y","l3":"y","l5":"y","l6":"u","l8":"u","l10":"y","c1":"y","c2":"y","c6":"y","i1":"y","i3":"y","i4":"y"},"alts":[["Proposed route via Brito (ESIA)","Avoids the Nahoa territory to the north"]],"stake":[["West Canal Zone residents (~16,500)","community",5,1],["HKND Group","business",5,5],["Government of Nicaragua","authority",5,5],["Academy of Sciences of Nicaragua","academic",4,2],["Nahoa Indigenous community","indigenous",3,1]],"cum":[["Pan-American Highway","Existing",0],["Canal East Segment and Lake Nicaragua crossing","Planned",null]]},
{"id":"au_snowy2","doc":true,"ft":true,"n":"Snowy 2.0 Main Works pumped-hydro scheme","cat":"Energy","region":"Oceania & Pacific","country":"Australia","lat":-35.77,"lon":148.47,"jur":"au","org":"Snowy Hydro Limited","src":{"t":"Government report","y":2020,"cite":"NSW Department of Planning, Industry and Environment. (2020). Snowy 2.0 Main Works (SSI 9687): Assessment report. NSW Government.","url":"https://www.snowyhydro.com.au/wp-content/uploads/2026/02/CSSI-Assessment-Report_MW.pdf"},"note":"The state planning department's assessment of the proponent's EIS (Critical State Significant Infrastructure), 273 pages, read in full through text extraction in the browser. The copy is hosted on Snowy Hydro's website. Verified against the full text in the browser on 30 September 2026.","loc":"Northern Kosciuszko National Park between Cooma and Tumut, NSW, linking Tantangara and Talbingo reservoirs","desc":"Pumped-hydro expansion of the existing Snowy Mountains Scheme. About 29.7 km of concrete-lined underground tunnels link Tantangara (upper) and Talbingo (lower) reservoirs through an underground power station. After design changes, 8.9 million m³ (banked) of spoil is placed mainly in landforms on land rather than in the reservoirs.","need":"Energy security and reliability for NSW and the National Electricity Market (firming and storage)","cap":"2,000 MW generating capacity; 350 GWh storage","sched":"About 6 years of construction (estimated 2020–2026)","area":"504 ha disturbed during construction (plus 126 ha under exploratory works); 92 ha operational footprint","cost":"$4.6 billion capital investment","facts":["2,000 MW / 350 GWh of storage through 29.7 km of tunnels","Maximum 593 ha of surface disturbance, about 0.09% of Kosciuszko National Park","222 submissions on the EIS: 73% objected, 5% supported, 22% commented"],"found":["The department judged the project critical for NSW energy security and recommended approval with strict conditions.","The main aquatic risk is moving pest fish (redfin perch, eastern gambusia, climbing galaxias) and disease from Talbingo to Tantangara; large fish screens protect Macquarie perch downstream and a barrier on Tantangara Creek protects the only remaining population of the critically endangered stocky galaxias.","The EIS put about 12 million m³ banked (18 million m³ bulked) of spoil mostly into the reservoirs; after concerns about water quality, acid-forming rock and naturally occurring asbestos, design changes cut it to 8.9 million m³ banked (11 million m³ bulked), placed in four landforms in the park and one outside it.","Offsets and compensation: up to $73.8 million to the National Parks and Wildlife Service (plus $8.49 million already paid), $5 million over 5 years for captive breeding of threatened fish and $5 million over 5 years to restock salmonids for recreational fishing.","No Aboriginal site in the footprint was judged significant enough to require avoidance; items are to be recorded, test-excavated or salvaged, and a significant rock shelter nearby is protected."],"a":["clear","earth","access","ctraffic","workforce","inwater","install","presence","ojobs","maint","rehab",{"n":"Spoil placement in reservoirs","ph":"C","tags":["waste","inwater","disch"]},{"n":"Pump-generate water transfer between reservoirs (pest fish transfer)","ph":"O","tags":["inwater","abstr","lowcarbon"]}],"c":["climate","terr","fauna","aquatic","species","sw","landscape","heritage","econ","infra","work"],"s":{"species":5,"aquatic":5,"terr":4},"hi":{"aquatic":4,"species":4,"terr":3,"sw":3},"res":["aquatic","species"],"ans":{"l1":"y","l2":"y","l3":"y","l4":"y","l5":"n","l6":"n","l7":"y","l8":"u","l9":"n","l10":"n","c1":"y","c2":"y","c3":"y","c4":"u","c5":"n","c6":"n","c7":"y","i1":"u","i2":"n","i3":"y","i4":"y","t1":"y","t2":"u","t3":"u","t4":"u"},"alts":[["Revised spoil strategy (selected)","Reservoir placement minimised; spoil formed into landforms on land"],["EIS spoil strategy","Most spoil placed in Talbingo and Tantangara reservoirs"],["Fish screens and barriers","Required to limit pest fish and disease spread"]],"stake":[["Snowy Hydro Limited","business",5,5],["NSW Department of Planning, Industry and Environment","authority",4,5],["NSW National Parks and Wildlife Service","authority",5,4],["Conservation groups (e.g. National Parks Association of NSW)","ngo",5,3],["Park users and recreational anglers","community",4,2],["Aboriginal heritage stakeholders","indigenous",4,2]],"cum":[["Existing Snowy Mountains Scheme (Tantangara and Talbingo reservoirs)","Existing",0],["Snowy 2.0 Exploratory Works","Approved",0]]},
{"id":"sb_tina","doc":true,"ft":true,"n":"Tina River Hydropower Development Project","cat":"Energy","region":"Oceania & Pacific","country":"Solomon Islands","lat":-9.55,"lon":160.18,"jur":"wb","org":"Solomon Islands Government, Ministry of Mines, Energy and Rural Electrification (TRHDP Project Office)","src":{"t":"Lender-disclosed ESIA","y":2019,"cite":"Solomon Islands Ministry of Mines, Energy and Rural Electrification. (2019). Environmental impact statement (updated from ESIA 2017) for Tina River Hydropower Development Project, Solomon Islands: Executive summary (Additional Financing ESIA). World Bank.","url":"https://documents1.worldbank.org/curated/en/865651576006486073/txt/Solomon-Islands-Tina-River-Hydropower-Development-Project-Additional-Financing-Environmental-and-Social-Impact-Assessment-Executive-Summary.txt"},"note":"The World Bank-disclosed executive summary (November 2019) was read in full; the full ESIA with annexes was not. Workforce size is not stated. Development consent was granted by the environment ministry (MECDM) on 29 July 2019. Verified against the full text in the browser on 30 September 2026.","loc":"Tina River, Malango Ward, Bahomea area, Guadalcanal, about 30 km south-east of Honiara","desc":"A 53 m roller-compacted concrete dam creates a 2.5 km, 30.5 ha reservoir (7 Mm³). A 3.3 km tunnel feeds a 3 × 5 MW Francis powerhouse. A 5.6 km access road to the dam and a 23 km, 33 kV line to Honiara complete the scheme.","need":"Replace costly diesel generation serving Honiara with lower-cost renewable power","cap":"15 MW","sched":"3-year construction","area":"About 115.5 ha of natural vegetation cleared; core land acquired from customary owners in 2014","cost":"US$140.2 million (2017)","facts":["Net GHG reduction of about 49,500 tCO₂e per year","The 5.7 km bypassed reach is kept at an environmental flow of 1 m³/s (mean flow at the dam 11.5 m³/s)","No households physically relocated; about 1,800 people in 362 households in the project area"],"found":["About 115.5 ha of natural vegetation is cleared, including about 50 ha of disturbed forest and 9.5 ha of undisturbed forest (0.3% of all forest in the catchment); the Biodiversity Management Plan targets no net loss and an upper-catchment protected area.","59 fish species were recorded (34 gobioids); migratory fish and eels are handled by trap-and-haul at the dam, intake screens, spillway releases and the 1 m³/s environmental flow, with residual reliance on adaptive management.","The 1,098 people living in villages that use the river get an alternative clean supply before construction; villages on the bypassed reach still depend on the environmental flow.","Option 7c was chosen from ten alternatives; the site was set far enough upstream that no homes need to be relocated, so a land-acquisition and livelihood-restoration plan replaced a resettlement plan.","The land was acquired in 2014 and is held by the Tina Core Land Company, a joint venture of customary landowners and government; sacred (tambu) sites are managed under a cultural-heritage protocol, and cumulative risk is high if logging or mining expand."],"a":["clear","earth","access","ctraffic","workforce","inwater","install","presence","ojobs","maint","lighting",{"n":"Reservoir impoundment and 5.7 km bypassed reach","ph":"O","tags":["impound","inwater","abstr","lowcarbon"]},"failure"],"c":["climate","sw","aquatic","terr","fauna","species","land","indig","heritage","health","gender","econ","infra"],"s":{"aquatic":5,"indig":5,"heritage":4},"hi":{"aquatic":4,"sw":3,"indig":3,"terr":3},"res":["aquatic","sw"],"ans":{"l1":"n","l2":"y","l3":"y","l4":"u","l5":"y","l6":"n","l7":"y","l8":"y","l9":"n","l10":"y","c1":"n","c2":"n","c3":"n","c4":"y","c5":"n","c6":"n","c7":"y","i1":"u","i2":"n","i3":"y","i4":"u","t1":"y","t2":"y","t3":"u","t4":"u"},"alts":[["Other energy sources","Diesel, solar, wind, geothermal and others considered; hydro selected"],["Ten site and layout options","Option 7c chosen; no homes relocated"],["Environmental flow of 1 m³/s","Keeps the bypassed reach alive at some energy cost"]],"stake":[["Bahomea and Malango customary land-owning tribes","indigenous",5,4],["Tina Core Land Company","business",5,3],["Bypassed-reach and river-water-user villages","community",5,2],["Women (dam-safety concerns)","vulnerable",4,2],["Ministry of Mines, Energy and Rural Electrification","authority",5,5],["World Bank and co-financiers","authority",3,5]],"cum":[["Lungga diesel power station","Existing",30],["Logging in the catchment","Foreseeable",null],["Mining expansion","Foreseeable",null]]},
{"id":"id_sarulla","doc":true,"ft":true,"n":"Sarulla 330 MW geothermal field and power plant (ANDAL)","cat":"Energy","region":"Southeast Asia","country":"Indonesia","lat":1.83,"lon":99.05,"jur":"id","org":"Sarulla Operations Ltd. (Medco, Ormat, Itochu and Kyuden consortium)","src":{"t":"Environmental Impact Statement","y":2009,"cite":"PT ERM Indonesia. (2009). Environmental impact statement (ANDAL): Development of Sarulla geothermal field and power plant of 330 MW capacity. Prepared for Sarulla Operations Ltd. Disclosed by the Asian Development Bank.","url":"https://www.adb.org/sites/default/files/project-documents/42916-01-ino-eia-02.pdf"},"note":"English version of the Indonesian AMDAL/ANDAL disclosed by ADB, 425 pages, read through text extraction in the browser. Section 2.2.4 states that locations and technology were already fixed, so no alternatives were assessed. Cost is not stated. Verified against the full text in the browser on 30 September 2026.","loc":"Pahae Julu and Pahae Jae districts, North Tapanuli, North Sumatra, about 40 km south of Tarutung","desc":"Geothermal steam-field development with three 110 MW units, one at Silangkitang (SIL) and two at Namora-I-Langit (NIL). It includes 35 production and reinjection wells, brine reinjection pipelines and a 15 km, 150 kV line. The ANDAL revises PLN's 2005 AMDAL to add well drilling, air-cooled condensers and a new proponent.","need":"Baseload renewable electricity for the Sumatra grid","cap":"330 MW (3 × 110 MW)","sched":"About 4 years of construction, SIL first and then NIL","area":"117.4 ha in total (power plant sites about 19 ha)","cost":"","facts":["35 wells (10 at SIL, 25 at NIL), each using about 400 m³ of Batang Toru river water to drill","About 2,300 construction workers in total (field 100–150, power plant peak 1,400, line about 300); 250 permanent operating jobs","Plant noise designed to ≤55 dB about 250 m from the fence"],"found":["Air-cooled condensers mean no make-up water is needed; condensate and brine are reinjected.","Non-condensable gases are about 2–2.8% of the steam by weight; H₂S effects on air quality were concluded significant, and an H₂S treatment and dispersion design was included.","Noise was concluded significant for equipment mobilisation, well drilling and testing, plant construction and plant operation.","Land acquisition (117.4 ha, by direct negotiation) was a significant negative impact on land ownership and a source of community unrest; unrest was also significant from recruitment, drilling and the transmission line.","Jobs, business and income were significant positive impacts; releasing about 250 workers at closure is a significant negative impact on income."],"a":["clear","earth","access","ctraffic","workforce","abstr","install","owaste","ohaz","presence","ojobs","maint","rehab",{"n":"Geothermal well drilling and brine reinjection","ph":"C","tags":["noise","waste","haz","dewater"]},{"n":"H₂S and non-condensable gas release","ph":"O","tags":["emis","odour","lowcarbon"]},"spill","upset"],"c":["air","noise","gw","sw","terr","fauna","land","health","work","econ","infra"],"s":{"health":4,"land":4},"hi":{"air":3,"noise":3,"land":3},"res":[],"ans":{"l1":"u","l2":"y","l3":"y","l4":"y","l5":"u","l6":"y","l7":"n","l8":"n","l9":"n","l10":"y","c1":"y","c2":"n","c3":"y","c4":"y","c5":"y","c6":"n","c7":"u","i1":"n","i2":"n","i3":"u","i4":"n","t1":"y","t2":"u","t3":"u","t4":"u"},"alts":[["Proposed project (no alternatives assessed)","The ANDAL says locations and technology were already fixed"]],"stake":[["Sarulla Operations Ltd.","business",5,5],["Landowners in Pahae Julu and Pahae Jae","community",5,3],["North Tapanuli government agencies","authority",4,5],["PT PLN (Persero)","business",4,4],["Workers","workers",3,2],["ADB and lenders","authority",3,4]],"cum":[["Trans-Sumatera Highway","Existing",0]]},
{"id":"la_xayaburi","doc":true,"ft":true,"n":"Xayaburi Dam, Mekong mainstream (MRC prior consultation review)","cat":"Energy","region":"Southeast Asia","country":"Laos","lat":19.25,"lon":101.81,"jur":"generic","org":"Government of Lao PDR (developer: Xayaburi Power Company)","src":{"t":"Government report","y":2011,"cite":"Mekong River Commission Secretariat. (2011, March 24). Prior consultation project review report: Proposed Xayaburi dam project – Mekong River. Vientiane: MRC Secretariat.","url":"https://www.riverresourcehub.org/wp-content/uploads/files/attached-files/mrc_technical_review_of_xayaburi_march_2011.pdf"},"note":"An intergovernmental technical review under the MRC prior-consultation procedure, not the developer's EIA; 109 pages read in full through text extraction in the browser (copy hosted by River Resource Hub). Resettlement and local social impacts were outside the review's scope. The fisheries and livelihood figures refer to the cascade of six proposed dams upstream of Vientiane. A transboundary case: Laos's own EIA rules are not among the tool's frameworks, so the generic framework is used. Verified against the full text in the browser on 30 September 2026.","loc":"Mekong mainstream about 100 km downstream of Luang Prabang, Lao PDR","desc":"Run-of-river mainstream dam, 820 m long and 32.6 m high, whose reservoir (about 1.3 km³) reaches about 100 km upstream to Luang Prabang. Seven 175 MW units serve export to Thailand and one 60 MW unit serves Laos.","need":"Hydropower export to Thailand and domestic supply for Laos","cap":"1,285 MW (1,225 MW for export + 60 MW for Laos)","sched":"Construction 7 years 9 months","area":"Reservoir about 100 km long","cost":"","facts":["Could affect 23 to 100 migratory fish species, five of them on the IUCN Red List","The six-dam cascade would block about 39% of accessible habitat for migratory fish; a loss of about 6% of the 2.5 Mt/yr basin catch","The reservoir could lose about 60% of its capacity to sediment within 30 years (about 30% with flushing)"],"found":["The proposed fish ladder was judged ineffective, with a strong possibility of extinction of the Mekong giant catfish.","The design did not yet reflect MRC design guidance or international practice on sediment, fish passage and water quality; flow velocity would drop from about 1 m/s to 0.1 m/s.","The livelihoods of about 450,000 people were at some risk from cascade fishery losses, and transboundary compensation might be needed.","An independent dam safety panel and dam-break analysis (including upstream Chinese dams) were recommended.","The cumulative effects of mainstream and tributary dams were judged significant, with further study of the Tonle Sap and Mekong Delta recommended."],"a":["clear","earth","ctraffic","workforce","inwater","install","presence","ojobs","maint",{"n":"Mainstream impoundment and barrier to fish migration","ph":"O","tags":["impound","inwater","lowcarbon"]},{"n":"Sediment trapping and flushing","ph":"O","tags":["inwater","disch"]},"failure"],"c":["aquatic","species","sw","geology","wetland","nav","econ","land","health"],"s":{"aquatic":5,"species":5,"econ":5},"hi":{"aquatic":4,"species":4,"sw":4,"econ":4},"res":["aquatic","species","econ"],"ans":{"l1":"n","l2":"y","l3":"y","l4":"y","l5":"y","l6":"u","l7":"u","l8":"u","l9":"n","l10":"y","c1":"y","c2":"y","c3":"n","c4":"y","c5":"n","c6":"u","c7":"y","i1":"y","i2":"y","i3":"y","i4":"y","t1":"y","t2":"y","t3":"u","t4":"u"},"alts":[["Best-practice fish passage","Redesign as the expert group proposed"],["Adaptive sediment management","Modified spillway and flushing cut the capacity loss from about 60% to 30%"]],"stake":[["Government of Lao PDR","authority",5,5],["Downstream states (Thailand, Cambodia, Viet Nam)","authority",5,4],["Mekong River Commission Secretariat","authority",4,3],["Fisheries-dependent communities (about 450,000 at risk)","vulnerable",5,1],["Thai power purchaser","business",4,4],["Conservation NGOs","ngo",5,3]],"cum":[["Other proposed Lower Mekong mainstream dams (cascade of six)","Planned",null],["Upstream mainstream dams in China","Existing",null],["Tributary dams","Existing",null]]},
{"id":"bd_padma","doc":true,"ft":true,"n":"Padma Multipurpose Bridge","cat":"Ports & transport","region":"South Asia","country":"Bangladesh","lat":23.45,"lon":90.26,"jur":"bd","org":"Bangladesh Bridge Authority (BBA)","src":{"t":"Lender-disclosed ESIA","y":2010,"cite":"Bangladesh Bridge Authority. (2010). Bangladesh: Padma Multipurpose Bridge Project – Draft environmental impact assessment. Asian Development Bank.","url":"https://www.adb.org/sites/default/files/linked-documents/35049-01-ban-eiaab.pdf"},"note":"ADB-disclosed draft EIA (July 2010), 616 pages, read through text extraction in the browser. Land figures quote a 2006 BBA study; an earlier 2005 JICA study gives different figures (616 ha, ~3,000 households, 41 cultural sites). The bridge was later built with domestic finance and opened in 2022, so the financing and schedule here are out of date. The ECR 2023 framework is shown for teaching; the 2010 EIA was prepared under ECR 1997. Verified against the full text in the browser on 30 September 2026.","loc":"Padma River between Mawa (Munshiganj) and Janjira (Shariatpur/Madaripur), south-central Bangladesh","desc":"A 6.15 km road-rail bridge over the Padma with river training works, about 2.3 km of approach road at Mawa and 12.8 km at Janjira. Also 6 bridges, 14 culverts, 7 underpasses, 2 toll plazas, service areas and a lower-deck railway provision.","need":"A fixed link to replace ferries between south-west Bangladesh and Dhaka","cap":"6.15 km main bridge, road and rail","sched":"Detailed design in 2010","area":"755 ha acquired and 163 ha requisitioned","cost":"About US$2.4 billion","facts":["3,280 households affected by land acquisition","177,676 trees removed; 482,430 to be replanted","EMP cost about US$7.6 million"],"found":["The Padma is a key hilsa migration route and secondary habitat for two endangered species, the Ganges river dolphin and the gharial; construction is phased around hilsa migration, and fish production losses were estimated at about 7 t/yr.","Piers obstruct about 1% of the waterway and raise water levels about 0.10 m, so regional flooding, erosion and char impacts were judged minimal.","Farm output losses of about 5,943 t/yr; 54 cultural sites (schools, mosques, graveyards, cremation grounds) affected; ferry-based livelihoods lost.","Noise and vibration during construction were the significant pollution issue.","With the EMP, 11 environmental components would still see negative impacts and 17 neutral to positive; the Mawa–Janjira site was preferred over Paturia–Goalundo."],"a":["clear","earth","access","ctraffic","cmat","workforce","inwater","install","presence","otraffic","ojobs","maint",{"n":"River training works and dredging","ph":"C","tags":["inwater","marine","noise","earth"]},{"n":"Loss of ferry services","ph":"O","tags":["employ","land"]}],"c":["aquatic","species","sw","noise","air","terr","land","econ","heritage","infra","nav","health"],"s":{"aquatic":5,"species":5,"land":5},"hi":{"land":4,"aquatic":3,"econ":3,"noise":3,"terr":3},"res":["land"],"ans":{"l1":"n","l2":"y","l3":"n","l4":"y","l5":"y","l6":"y","l7":"y","l8":"n","l9":"u","l10":"y","c1":"y","c2":"y","c3":"y","c4":"u","c5":"n","c6":"y","c7":"u","i1":"u","i2":"n","i3":"y","i4":"n","t1":"y","t2":"y","t3":"u","t4":"u"},"alts":[["Mawa–Janjira crossing (selected)","Preferred alignment"],["Paturia–Goalundo crossing","Not selected"],["River training designs","Revetment, guide bunds or hard points"]],"stake":[["Bangladesh Bridge Authority","authority",5,5],["Households losing land (3,280)","community",5,2],["Char dwellers","vulnerable",4,1],["Ferry workers","workers",5,1],["Farmers and traders","community",4,2],["ADB and co-financiers","authority",3,5]],"cum":[["Existing Mawa–Janjira ferry service","Existing",0]]},
{"id":"in_nh7","doc":true,"ft":true,"n":"Char Dham highway widening: landslides on NH-7, Uttarakhand","cat":"Ports & transport","region":"South Asia","country":"India","lat":30.22,"lon":78.78,"jur":"in","org":"Government of India (Char Dham highway project)","src":{"t":"Peer-reviewed article","y":2024,"cite":"Mey, J., Guntu, R. K., Plakias, A., Silva de Almeida, I., & Schwanghart, W. (2024). More than one landslide per road kilometer – surveying and modeling mass movements along the Rishikesh–Joshimath (NH-7) highway, Uttarakhand, India. Natural Hazards and Earth System Sciences, 24(9), 3207–3223.","url":"https://doi.org/10.5194/nhess-24-3207-2024"},"note":"An open-access study of impacts after construction, not a formal EIA; the paper does not discuss the clearance process. The final published version (17 pages) was read in full through text extraction in the browser. Cost and area are not given. Verified against the full text in the browser on 30 September 2026.","loc":"NH-7 between Rishikesh and Joshimath, Garhwal Himalaya, Uttarakhand","desc":"All-weather widening of Himalayan pilgrimage highways under the Char Dham project. The study mapped road-blocking landslides along 247 km of NH-7 after the extreme rain of September–October 2022, and modelled landslide density against slope, rainfall, road widening and rock type.","need":"All-weather road access to the Char Dham pilgrimage sites and border areas","cap":"247 km of highway studied","sched":"Survey after the extreme rain of September–October 2022","area":"","cost":"","facts":["309 road-blocking landslides along 247 km: 1.25 per km","80% of them (250) occurred after January 2022, and about 30% of those were probably reactivated","Model performance: AUC 0.79"],"found":["With other factors held constant, landslide density was about twice as high on widened road sections.","Slope, rainfall, rock type and road widening were the main controls on where landslides occurred.","Phyllite and shale were 2–6 times more susceptible than quartzite and igneous rocks under the same slope and rainfall.","The authors point to the 125 km Rishikesh–Karnprayag railway under construction as a way to break the cycle of rising hazard and exposure, and to the model's use in planning road maintenance."],"a":["clear","earth","access","ctraffic","presence","otraffic","maint",{"n":"Hillslope cutting for road widening","ph":"C","tags":["clear","earth","drain","accident"]},{"n":"Slope failures and landslides onto the road","ph":"U","tags":["accident","earth","closure"]}],"c":["geology","terr","sw","infra","health","landscape","climate"],"s":{"geology":5,"infra":4},"hi":{"geology":4,"infra":4,"health":3},"res":["geology","infra"],"ans":{"l1":"u","l2":"y","l3":"y","l4":"u","l5":"u","l6":"u","l7":"y","l8":"n","l9":"n","l10":"u","c1":"y","c2":"n","c3":"n","c4":"y","c5":"y","c6":"n","c7":"y","i1":"y","i2":"n","i3":"y","i4":"u","t1":"u","t2":"u","t3":"u","t4":"u"},"alts":[["Rishikesh–Karnprayag railway (125 km)","Reduces dependence on the highway"],["Geotechnical assessment before widening","Retaining walls, drainage and slope stabilisation"],["Alternative routes","To be considered before widening"]],"stake":[["Pilgrims and road users","community",5,2],["Highway authorities","authority",4,5],["Valley residents","community",5,2],["Geoscience researchers","academic",4,2]],"cum":[["Other widened sections of the Char Dham project","Existing",null],["Rishikesh–Karnprayag railway","Planned",null]]},
{"id":"mn_oyutolgoi","doc":true,"ft":true,"n":"Oyu Tolgoi copper-gold mine ESIA","cat":"Mining","region":"East Asia","country":"Mongolia","lat":43,"lon":106.85,"jur":"ifc","org":"Oyu Tolgoi LLC (Rio Tinto-managed; Government of Mongolia 34%)","src":{"t":"Lender-disclosed ESIA","y":2012,"cite":"Oyu Tolgoi LLC. (2012). Oyu Tolgoi Project: Environmental and social impact assessment – Non-technical summary. European Bank for Reconstruction and Development.","url":"https://www.ebrd.com/english/pages/project/eia/41158.pdf"},"note":"The non-technical summary of the 2012 ESIA, disclosed by EBRD, 94 pages, read in full through text extraction in the browser; the full multi-volume ESIA was not read. Oyu Tolgoi was then 34% Government of Mongolia and 66% Ivanhoe Mines (Rio Tinto-managed). Assessed against lender standards (IFC and EBRD), so the IFC framework is used. Verified against the full text in the browser on 30 September 2026.","loc":"Khanbogd soum, Ömnögovi aimag, South Gobi; about 600 km south of Ulaanbaatar and 80 km north of the China border","desc":"Open-pit and underground block-cave copper-gold mine on six deposits, with a concentrator. Water comes from the deep Gunii Hooloi aquifer 40–70 km away, power initially by a 220 kV line from China, and a 105 km sealed road runs to the border.","need":"Copper-gold production; national revenue and jobs for Mongolia","cap":"100,000 t/day of ore initially, expandable to 160,000 t/day","sched":"First production expected 2013; 27-year approved life","area":"85 km² mine licence area; about 140 km² land requirement","cost":"About US$6 billion","facts":["Water demand about 696 L/s from a permitted 810 L/s; 83% of process water recycled","Construction workforce peaked at about 14,800; about 3,500 in operation","Power demand over 200 MW, rising to about 310 MW"],"found":["Less than 20% of the available Gunii Hooloi groundwater would be used, but drawdown affecting herders' wells remains a residual risk; monitoring is done jointly with herders.","Diverting the Undai River leaves 6.8 km dry and removes the sacred Bor Ovoo spring; a replacement spring, a buried pipe for subsurface flow and deconsecration ceremonies are planned.","10 herder households (61 people) were relocated from the exclusion zone; less than 2% of Khanbogd grazing land is lost permanently, and relocated families reported equal or better living standards.","Rio Tinto committed to a net positive impact on biodiversity.","A macroeconomic residual effect: the real exchange rate could rise about 15% by 2020, hurting other Mongolian industries."],"a":["clear","earth","access","ctraffic","workforce","abstr","install","proc","owaste","ohaz","otraffic","presence","ojobs","lighting","rehab",{"n":"Undai River diversion","ph":"C","tags":["inwater","drain","land"]},{"n":"Open-pit and block-cave mining","ph":"O","tags":["earth","emis","noise","dewater","waste"]},"failure"],"c":["gw","sw","air","terr","fauna","species","land","heritage","econ","infra","work","health","climate"],"s":{"gw":5,"land":4,"heritage":4},"hi":{"gw":4,"sw":3,"land":3,"heritage":3,"econ":3},"res":["gw","econ","heritage"],"ans":{"l1":"n","l2":"y","l3":"y","l4":"y","l5":"y","l6":"n","l7":"y","l8":"u","l9":"n","l10":"y","c1":"y","c2":"y","c3":"y","c4":"y","c5":"u","c6":"y","c7":"y","i1":"y","i2":"y","i3":"y","i4":"u","t1":"y","t2":"y","t3":"u","t4":"u"},"alts":[["Gunii Hooloi deep aquifer (selected)","Judged the best water source"],["Block-cave underground mining","Most cost-effective underground method"],["Power imported from China, then a domestic plant","Transition within four years"]],"stake":[["Herder households in Khanbogd soum","community",5,2],["Relocated herder families","vulnerable",5,1],["Government of Mongolia (34% owner)","authority",5,5],["Rio Tinto","business",5,5],["Ministry of Nature, Environment and Tourism","authority",4,4],["EBRD, ADB and IFC","authority",3,4]],"cum":[["Oyu Tolgoi–Gashuun Sukhait road (about 105 km)","Approved",null],["220 kV power line from China","Existing",null],["New domestic coal-fired power plant","Planned",null]]},
{"id":"medupi","doc":true,"ft":true,"n":"Medupi coal-fired power station (4,800 MW)","cat":"Energy","region":"Southern Africa","country":"South Africa","lat":-23.71,"lon":27.56,"jur":"za","org":"Eskom Holdings Limited","src":{"t":"Lender-disclosed ESIA summary","y":2009,"cite":"African Development Bank. (2009). South Africa: Environmental impact assessment for the Medupi Power Plant Project of Eskom – ESIA executive summary (revised final, 1 July 2009). AfDB.","url":"https://www.afdb.org/sites/default/files/documents/environmental-and-social-assessments/esia_ex_summary_of_medupi_coal_power_plant_july_1_revised_final-ram-1.pdf"},"note":"ESIA executive summary (23 pages) read in full through text extraction in the browser. It summarises the national EIA (draft scoping Oct 2005, final EIR May 2006, DEAT Record of Decision 4 May 2007 after appeals); the full EIR was not opened. No project cost is stated. Verified against the full text in the browser on 30 September 2026.","loc":"Lephalale (formerly Ellisras), Waterberg, Limpopo Province, next to the existing Matimba Power Station","desc":"Dry-cooled coal-fired power station of six units of about 800 MW each with supercritical boilers and a stack about 220 m high, fed from local coalfields via the Grootegeluk mine. The plant site covers about 700 ha, with 500–1,000 ha for ancillary services and about 1,000 ha estimated for surface ash disposal.","need":"Additional base-load generating capacity for the national grid.","cap":"~4,800 MW (6 × 800 MW)","sched":"EIA 2005–2006; authorised May 2007; first unit expected 2012 (original target 2010)","area":"~700 ha plant plus 500–1,000 ha of ancillary services including ash disposal","cost":"","facts":["CO₂ about 29,895 kt/yr (30,001 kt CO₂-eq/yr), stated as a 7.3% increase in the country's contribution to global warming","Dry cooling cuts water use from about 2.0 to 0.1–0.2 L/kWh sent out","FGD-ready design: retrofit decided later from air monitoring, regulations and water availability; zero liquid effluent; particulates <50 mg/Sm³"],"found":["CALPUFF modelling predicted that local and international SO₂ limits would be exceeded for hourly and daily averages within the zone of maximum impact; PM10 exceeded SANS and EC limits next to the Zwartwater ash dump.","The potential for infrequent mild respiratory effects in Marapong (about 6,000 people) was rated moderate.","Dry cooling was chosen because South Africa is water-scarce; in the Mokolo catchment (8,387 km²), 87% of water use is agricultural.","Supercritical technology cuts coal use and emissions by about 5%.","No environmental fatal flaws were found if mitigation is implemented; monitoring and compliance cost about R14 million a year, with monthly reports and six-monthly independent audits."],"a":["clear","earth","ctraffic","workforce","install",{"n":"Coal combustion and stack emissions","ph":"O","tags":["emis","ghg"]},{"n":"Dry-cooled operation and raw water use","ph":"O","tags":["abstr"]},{"n":"Surface ash disposal","ph":"O","tags":["waste","land"]},"otraffic","presence","ojobs","maint","demol"],"c":["climate","air","health","sw","gw","land","landscape","econ","infra","noise","terr"],"s":{"air":4,"sw":5,"health":4},"hi":{"air":4,"climate":4,"health":3},"res":["climate","air"],"ans":{"l5":"n","l6":"y","l9":"u","c1":"y","c2":"y","c3":"y","c5":"y","c7":"y","i2":"y","i3":"y","t1":"y"},"alts":[["Supercritical, dry-cooled, FGD-ready (preferred)","Less coal and much less water used"],["Wet cooling","Rejected: water scarcity"],["Site next to Matimba","Identified as the most favoured feasible site"]],"stake":[["Marapong and Onverwacht residents","community",4,2],["Farm owners","community",4,2],["Lephalale Local Municipality","authority",4,3],["National DEAT","authority",4,5],["Exxaro (Grootegeluk mine)","business",4,3],["Environmental organisations","ngo",4,2]],"cum":[["Matimba Power Station","Existing",null],["Grootegeluk coal mine","Existing",null],["New mines and power stations in the Mokolo catchment","Foreseeable",null]]},
{"id":"eacoptz","doc":true,"ft":true,"n":"East African Crude Oil Pipeline (EACOP), Tanzania section","cat":"Pipelines","region":"East Africa","country":"Tanzania","lat":-4.9,"lon":34.5,"jur":"generic","org":"Total East Africa Midstream (TEAM) B.V. (shareholders include TPDC and UNOC)","src":{"t":"Environmental and Social Impact Assessment (executive summary)","y":2019,"cite":"Total East Africa Midstream B.V. (2019). EACOP Project Tanzania ESIA: Executive summary (August 2019). EACOP.","url":"https://totalenergies.com/sites/g/files/nytnzq121/files/documents/2021-03/Eacop_esia_executive-summary-Tanzania.pdf"},"note":"Executive summary (53 pages) read in full through text extraction in the browser; the full ESIA volumes were not opened. Land take, displacement numbers, capacity and cost are not given in the summary. The project remains contested. Verified against the full text in the browser on 30 September 2026.","loc":"Eight regions of Tanzania, from the Uganda border (Kagera) to the Chongoleani Peninsula near Tanga; approximate centroid shown","desc":"A 24-inch, insulated, electrically trace-heated buried crude oil pipeline, 1,147 km long in Tanzania (part of a 1,443 km system from Uganda). It includes four pumping stations (PS3–PS6), a marine storage terminal at Chongoleani, and an offshore load-out facility with a 1.9 km trestle and loading platform.","need":"Export route for Ugandan crude oil to the Indian Ocean.","cap":"1,147 km in Tanzania; 4 pumping stations","area":"8 regions, 24 districts, 116 wards, about 231 villages and hamlets","facts":["Direct operational emissions in Tanzania of 201–282 ktCO₂e/yr over a 25-year life (about 0.2–0.3% of Tanzania's 2030 total)","73 ha of habitat loss in the Burigi–Biharamulo Game Reserve","Three corridors compared: Kenya North, Kenya South and Tanzania"],"found":["Significant residual loss of 73 ha of habitat, including 7.9 ha of old-growth forest, in the Burigi–Biharamulo Game Reserve and KBA: breeding and foraging habitat of the critically endangered white-backed vulture and the endangered steppe eagle and ashy red colobus.","In-migration along new access roads remains a significant pressure on species of conservation importance in the Talamai Open Area and Kitwai GCA; habitat loss in the East African Coastal Forest hotspot is also a significant residual.","Marine works are predicted to smother coral on Kwawa Reef, and underwater noise to injure fish including the Napoleon wrasse, affecting the integrity of the Tanga Coelacanth Marine Park.","Loss of grazing land, access to artisanal mining and fishing grounds (marine exclusion zone) were assessed and mitigated, and are not listed among the significant residual impacts.","No significant residual transboundary impact. One cumulative impact stays significant: fauna in the Talamai area, from EACOP access roads combined with the TANROADS Handeni–Singida road upgrade."],"a":["clear","earth","access","ctraffic","workforce","inwater","install",{"n":"Marine terminal and jetty construction","ph":"C","tags":["marine","inwater","noise"]},{"n":"Heated crude oil transport and pumping","ph":"O","tags":["ghg","emis"]},"presence","maint","spill","rehab"],"c":["climate","terr","fauna","species","marine","aquatic","sw","land","econ","health","work","infra","coast","heritage"],"s":{"species":5,"marine":5,"terr":4},"hi":{"species":4,"marine":4,"land":3,"terr":4},"res":["species","marine","terr"],"ans":{"l1":"y","l2":"y","l3":"y","l4":"y","l10":"y","c1":"y","c4":"y","c6":"y","c7":"y","i1":"y","i2":"y","i3":"y","t1":"y"},"alts":[["Tanzania corridor to Tanga (selected)",""],["Kenya North corridor","Compared at corridor stage"],["Kenya South corridor","Compared at corridor stage"],["Four candidate terminal sites","Chongoleani selected"],["HDD vs open-cut water crossings","Construction-method alternative"]],"stake":[["Project-affected communities","community",5,2],["Artisanal miners and fishers","vulnerable",5,1],["Tanzania wildlife and marine park authorities","authority",4,4],["TPDC / Government of Tanzania","authority",5,5],["Conservation NGOs","ngo",5,3],["TANROADS","authority",2,3]],"cum":[["TANROADS national road upgrade (Talamai)","Planned",null],["EACOP Uganda section","Approved",null]]},
{"id":"lompangar","doc":true,"ft":true,"n":"Lom Pangar hydroelectric project (regulating dam and 30 MW plant)","cat":"Energy","region":"Central Africa","country":"Cameroon","lat":5.37,"lon":13.51,"jur":"generic","org":"Electricity Development Corporation (EDC), Cameroon","src":{"t":"Lender-disclosed ESIA summary","y":2011,"cite":"African Development Bank. (2011). Cameroon – Lom-Pangar Hydroelectric Project: Summary of the environmental and social impact assessment (Project P-CM-FA0-006). AfDB.","url":"https://www.afdb.org/sites/default/files/documents/environmental-and-social-assessments/2011_lom-pangar_resume_environnemental_et_social_en.pdf"},"note":"AfDB ESIA summary (25 pages) read in full through text extraction in the browser. The summary covers the AfDB-financed plant, 90 kV line and rural electrification as well as the dam. It gives the dam height as 40 m in one place and 46 m in another; both are shown. Co-financed by the World Bank, EIB and AFD. Verified against the full text in the browser on 30 September 2026.","loc":"Confluence of the Lom and Pangar rivers, upper Sanaga basin, East Region, near Deng-Deng; 105 km line to Bertoua","desc":"Regulating dam (40 m high in one part of the summary, 46 m in another) creating a reservoir of about 6 billion m³ over 540 km², with a foot power plant of four 7.5 MW units (guaranteed flow 23 m³/s). It also includes a 105 km, 90 kV line to Bertoua and rural electrification (740 km of MV/LV lines, about 40,000 connections).","need":"Regulate Sanaga flows to firm up downstream hydropower (Edea, Song-Loulou and future plants) and electrify the East Region.","cap":"30 MW plant; 6 billion m³ storage","sched":"Works planned Sept 2012 – Sept 2015","area":"Reservoir 540 km²; 738 ha of forest cleared for the plant and line","cost":"ESMP + RAP CFAF 2.71 billion (ESMP about 2.04 billion)","facts":["Dependable power of Edea and Song-Loulou raised from 450 MW (2010) to 659 MW (2015)","Reservoir GHG about 21 Mt CO₂ over 100 years: more than an equivalent thermal plant for Lom Pangar alone (17 Mt), but about seven times less (21 vs 140 Mt) once the Sanaga's downstream hydropower is developed","Deng-Deng National Park of about 59,000 ha created as an offset; about 200 gorillas and 100 chimpanzees"],"found":["Forest loss of 210 ha at the plant and 528 ha along the line corridor. The line crosses 90% forest and 10% farmland.","No family displaced at the dam, a sparsely populated area. On the line, 16 houses and 6 huts need relocation, 41.35 ha of farmland and about 23,000 trees and perennial crops are lost, and 64 tombs are affected (RAP CFAF 670 million).","Decomposition of flooded vegetation was expected to cause a major oxygen deficit and low pH in the bottom layers of the reservoir. Management of the reservoir and re-oxygenation were proposed.","Key risks: population influx, increased poaching and illegal logging, and communicable diseases including HIV/AIDS among the workforce.","Of the seven line routes (three northern, four southern), the optimum was chosen by multi-criteria analysis. The no-project option was rejected."],"a":["clear","earth","access","ctraffic","workforce","install",{"n":"Reservoir impoundment (540 km²)","ph":"C","tags":["impound","clear","ghg"]},{"n":"Flow regulation of the Sanaga","ph":"O","tags":["impound","drain"]},{"n":"Operation of 90 kV line","ph":"O","tags":["visual","land","accident"]},"presence","ojobs","maint","failure"],"c":["climate","terr","fauna","species","aquatic","sw","land","econ","health","gender","heritage","infra","landscape"],"s":{"species":5,"terr":5,"aquatic":4},"hi":{"terr":4,"species":4,"aquatic":3,"climate":3,"health":3},"res":["terr","climate"],"ans":{"l2":"y","l3":"y","l4":"y","l10":"y","c1":"y","c6":"y","c7":"y","i1":"y","i3":"y","c5":"y","t1":"y"},"alts":[["Lom Pangar regulating dam (selected)",""],["No project","Rejected: blocks development of the Sanaga basin"],["Seven line routes","Optimum selected by multi-criteria analysis"],["Thermal generation","About 140 Mt CO₂ vs 21 Mt over 100 years"]],"stake":[["19 villages along the line (about 8,100 people)","community",4,2],["Households losing crops/houses","vulnerable",5,1],["MINEP, MINFOF, MINEE","authority",4,5],["East Region Governor (CSFA chair)","authority",4,4],["Local NGOs","ngo",3,2],["COTCO (Chad–Cameroon pipeline)","business",3,3]],"cum":[["Edea (224 MW) and Song-Loulou (335 MW) plants","Existing",null],["Mbakaou, Bamendjin, Mape reservoirs","Existing",null],["Nachtigal and other downstream Sanaga plants","Planned",null],["Chad–Cameroon pipeline","Existing",null]]},
{"id":"benban","doc":true,"ft":true,"n":"Benban 1.8 GW solar PV park (strategic ESIA)","cat":"Energy","region":"North Africa","country":"Egypt","lat":24.45,"lon":32.73,"jur":"eg","org":"New and Renewable Energy Authority (NREA); 41 private developers","src":{"t":"Lender-disclosed strategic environmental and social assessment","y":2016,"cite":"EcoConServ Environmental Solutions. (2016). Benban 1.8 GW PV solar park, Egypt: Strategic environmental & social assessment – final report (February 2016). Prepared for NREA with EBRD support.","url":"https://www.eib.org/attachments/registers/65771943.pdf"},"note":"Strategic ESIA, 220 pages, read in full through text extraction in the browser, including the water-demand table (Table 33) and the significance tables (Tables 34–37). The bird findings reuse the Kom Ombo ESIA baseline. Individual plots have their own ESIAs. Verified against the full text in the browser on 30 September 2026.","loc":"Western desert near Benban village, about 40 km north-west of Aswan and about 15 km west of the Nile, Aswan Governorate","desc":"Strategic ESIA for a 37.2 km² park of 41 separate PV projects (1.8 GW in total) on government desert land. It includes four on-site substations linked to a 220 kV line about 12 km away, a nearby 2 × 500 kV corridor and a possible 16 km water pipeline from the Nile.","need":"Address electricity supply deficits with large-scale renewables under the feed-in tariff programme.","cap":"1.8 GW (41 projects)","sched":"About 8 months of construction per project","area":"37.2 km²","facts":["250–300 workers per project, peaking at around 500–600","Benban village about 26,200 people (~12 km east); Fares about 11,000 (~25 km north-east)","Worst case for panel cleaning: about 28,800 m³ per cleaning cycle for the whole park (1,920 m³/day, 57,600 m³/month)"],"found":["Cumulative impacts of all 41 projects must be managed jointly: traffic, workforce, water for panel cleaning and site security.","After mitigation, construction traffic on the Aswan–Luxor highway stays a major negative impact, and construction noise and air quality a medium one.","All other negative impacts are minor or negligible after mitigation: landscape, soil and groundwater (about 240 m deep), biodiversity, heritage, waste, water, worker influx and community health and safety.","Birds recorded in the reused Kom Ombo baseline were common, none rare or endangered, though a white stork migration route crosses the area.","Construction jobs and the electricity supplied are major and medium positive impacts; cumulative effects are to be monitored through a Benban developers' association."],"a":["clear","earth","ctraffic","workforce","install",{"n":"PV panel cleaning water use","ph":"O","tags":["abstr"]},{"n":"PV park in operation","ph":"O","tags":["visual","land","lowcarbon"]},"otraffic","owaste","ojobs","maint","demol"],"c":["air","noise","infra","sw","fauna","landscape","econ","work","health","land","climate","heritage"],"s":{"infra":3,"sw":3},"hi":{"infra":3,"air":3,"noise":3},"res":["infra"],"ans":{"l1":"n","l6":"n","l7":"u","c1":"y","c2":"u","c7":"y","i3":"n","t1":"y"},"alts":[["No action","Rejected: electricity deficit"],["Wind energy","Judged less suitable here than solar"],["Solar PV at Benban (selected)","Large unused government land"],["Wet vs dry panel cleaning","Left to developers"]],"stake":[["Benban and Fares villages","community",3,2],["41 PV developers / Developers Association","business",5,4],["NREA","authority",5,5],["EEAA","authority",4,4],["Ministry of Irrigation","authority",3,4],["EBRD and other lenders","business",4,4]],"cum":[["41 PV projects inside the park","Approved",0],["Kom Ombo CSP project","Planned",null],["220 kV and 500 kV transmission lines","Existing",1]],"cost":"US$3.5–4 billion (all 41 projects)"},
{"id":"sakarya","doc":true,"ft":true,"n":"Sakarya gas field development, Phase 1 (Filyos)","cat":"Energy","region":"Middle East","country":"Türkiye","lat":41.56,"lon":32.03,"jur":"tr","org":"Turkish Petroleum Corporation (TPAO) / TP-OTC","src":{"t":"Lender-disclosed ESIA (non-technical summary)","y":2022,"cite":"WSP Golder Associates Turkey. (2022). Sakarya Gas Field Development Project: Environmental and social impact assessment report – non-technical summary (Rev. 03, 25 October 2022). Turkish Petroleum Corporation.","url":"https://www.tpao.gov.tr/file/2210/sakarya-gas-field-development-project-non-technica-1062635810a6d7ca9.pdf"},"note":"NTS (51 pages) read in full through text extraction in the browser. Prepared to IFC PS, World Bank ESF and Equator Principles. Region set to Middle East for the tool; the site is on the Black Sea coast. Verified against the full text in the browser on 30 September 2026.","loc":"Offshore field 165 km off Filyos in the western Black Sea (about 2,200 m water depth); onshore processing facility at Filyos, Çaycuma, Zonguldak","desc":"Deep-water subsea gas development with 10 production wells (40 in Phase 2), a 16-inch export pipeline, a MEG line and an umbilical to an onshore processing facility at Filyos. Phase 1 capacity is up to 10 million Sm³/day (40 million in Phase 2). Associated facilities are a BOTAŞ metering station with about 36 km of onshore pipeline and Filyos Port.","need":"Cut dependence on imported gas.","cap":"10 million Sm³/day (Phase 1)","sched":"Construction from Dec 2021; first gas planned 2023; 25–40 year life","area":"Footprint 78.5% already modified land, 16% natural habitat","facts":["Direct operational GHG 146 kt CO₂e/yr (maximum operating scenario)","Peak workforce of 1,900 offshore and up to 6,500 onshore; 120 in Phase 1 operation","Construction noise exceeded the 3 dBA criterion at 6 of 13 receptors (4 of 13 in operation)"],"found":["Construction NO₂, SO₂ and PM₁₀ may exceed project standards at some sensitive receptors at peak times. In operation, NO₂ exceeds the standard only during abnormal operation.","Seawater quality stays a medium impact after mitigation (wastewater discharge, minor leaks); benthic impacts fall to low with mitigation, and the new structures may later act as reefs. Low-frequency cetaceans (baleen whales) are absent from the Black Sea.","Sewage, backwash and pre-commissioning water and monovalent-salt brine are discharged to the Filyos River; most effects on freshwater fauna are low, but onshore traffic and possible alien species are medium.","Land take is limited (little expropriation needed); plants of the dune habitat at the landfall were translocated before construction.","Employment and local economic benefits are high to very high positives; influx, local inflation and land-price rises are managed as negatives."],"a":["clear","earth","ctraffic","workforce","inwater","install",{"n":"Offshore drilling and subsea installation","ph":"C","tags":["marine","noise","disch"]},"proc","efflu",{"n":"Flaring and gas engines","ph":"O","tags":["emis","ghg"]},"otraffic","ojobs","maint","fire","spill"],"c":["air","noise","climate","marine","aquatic","sw","terr","fauna","land","econ","infra","work","health","coast"],"s":{"marine":3,"aquatic":3,"noise":3},"hi":{"noise":3,"air":3,"marine":3},"res":["marine"],"ans":{"l1":"n","l2":"y","l6":"y","c1":"y","c3":"y","c4":"y","c7":"y","i3":"u","t1":"y"},"alts":[["Landfall in designated industrial area (selected)","Already affected by other projects"],["Second landfall area","Not selected"],["Gas turbines","Reciprocating engines chosen"],["No project","Import dependence continues"]],"stake":[["Filyos-area villages","community",4,2],["Fishers","community",3,2],["TPAO / Government","authority",5,5],["BOTAŞ","business",4,4],["Workers and contractors","workers",4,2]],"cum":[["Filyos Port / Industrial Zone","Approved",null],["BOTAŞ onshore pipeline (~36 km)","Approved",null]]},
{"id":"waadwind","doc":true,"ft":true,"n":"Waad Al Shammal wind IPP (500 MW)","cat":"Energy","region":"Middle East","country":"Saudi Arabia","lat":31.5,"lon":38.9,"jur":"sa","org":"Project company not named in the NTS (developed under Saudi Arabia's renewable IPP programme)","src":{"t":"Lender-disclosed ESIA (non-technical summary)","y":2022,"cite":"WSP. (n.d., c. 2022). 500MW Waad Al Shammal Wind Independent Power Plant: Environmental and social impact assessment – non-technical summary. [Amended from Worley (2021) ESIA.]","url":"https://www.axia-power.com/portfolio/pdf/documents_04.pdf"},"note":"NTS (21 pages) read in full through text extraction in the browser. It cites the NCEC environmental permit of 9 Aug 2022 (valid to 28 May 2025) and WSP's review of the Worley (2021) ESIA. The original 798 MW / 190-turbine design was later revised with fewer, larger turbines; the final turbine count is not given. The NTS prints the original design's output as '2,787 MWh per year', almost certainly meaning GWh. Verified against the full text in the browser on 30 September 2026.","loc":"About 30 km south-east of Turaif, Northern Borders Province; 25 km south of Waad Al Shammal industrial city","desc":"Onshore wind farm over about 88.1 km² of desert. Originally 190 turbines (798 MW) with a 131 m hub height; revised to a 500 MW design with fewer, larger turbines.","need":"Diversify the Saudi energy supply towards the national renewable target (58.7 GW by 2030).","cap":"500 MW (originally 798 MW; output printed as '2,787 MWh per year' for the original design, likely GWh)","area":"~88.1 km²","facts":["Hub-height wind speed 8.0–8.4 m/s","Groundwater at 160–350 m depth and highly saline; no permanent surface water","Days above 45 °C may rise from about 5 to as many as 39 per year by mid-century"],"found":["Conservative collision-risk modelling predicted major impacts on key raptors (steppe buzzard, honey buzzard, black kite and the endangered steppe eagle), with multiple collisions a year on a significant migratory flyway.","Bats, especially migratory species such as Kuhl's pipistrelle and the Egyptian free-tailed bat, face collision risk. Mitigation: low-wind-speed curtailment, bird surveys and carcass counts, and at least five years of bat monitoring.","Operational noise at off-site receptors was 16–18.3 dB(A), below 20 dB(A). Only temporary livestock camps are on site and there are no dwellings.","Extreme heat (above 45 °C) is a direct risk to worker safety. Dust from nearby phosphate mining adds to cumulative air-quality concerns.","Ruins of a possible mosque were identified and need assessment before construction. Overall the impact was judged relatively low if the management plan is implemented."],"a":["clear","earth","access","ctraffic","workforce","install",{"n":"Wind turbines in operation","ph":"O","tags":["turbine","visual","lowcarbon","noise"]},"presence","maint","lighting","demol"],"c":["fauna","species","terr","air","noise","landscape","heritage","work","land","climate","econ"],"s":{"fauna":5,"species":4,"work":4},"hi":{"fauna":4,"species":4,"work":3},"res":["fauna"],"ans":{"l1":"n","l4":"y","l7":"y","l10":"u","c1":"y","c7":"y","i3":"n","i4":"u","t1":"y"},"alts":[["Original 190-turbine, 798 MW layout","Replaced"],["Revised 500 MW layout with fewer, larger turbines (selected)",""]],"stake":[["Livestock herders (temporary camps)","community",3,1],["NCEC","authority",4,5],["National Centre for Wildlife","authority",5,4],["Heritage Commission","authority",3,3],["Turaif residents","community",2,2],["Construction workers","workers",4,1]],"cum":[["Waad Al Shammal Phosphate Industrial Complex / Ma'aden mines","Existing",25],["Northern Region Cement Company","Existing",7.5],["Waad Al Shammal power project","Existing",12.5]]},
{"id":"ns2","doc":true,"ft":true,"n":"Nord Stream 2 offshore gas pipeline (Espoo report)","cat":"Pipelines","region":"Russia & Central Asia","country":"Russia","lat":59.65,"lon":28.2,"jur":"ru","org":"Nord Stream 2 AG","src":{"t":"Transboundary EIA (Espoo report, non-technical summary)","y":2017,"cite":"Nord Stream 2 AG & Ramboll. (2017). Nord Stream 2 Espoo report: Non-technical summary (W-PE-EIA-POF-REP-805-040100EN, April 2017). Nord Stream 2 AG.","url":"https://kliimaministeerium.ee/sites/default/files/documents/2022-11/KMH%20aruande%20kokkuv%C3%B5te%20inglise%20keeles.pdf"},"note":"Espoo NTS (28 pages) read in full through text extraction in the browser. The pipeline crosses the waters of Russia, Finland, Sweden, Denmark and Germany, and each state ran its own EIA. The location shown is the Russian landfall. The pipeline was built but later damaged (2022) and has not operated as assessed; that is outside the source. Verified against the full text in the browser on 30 September 2026.","loc":"Baltic Sea, from the Narva Bay landfall (Kurgalsky Peninsula, Leningrad Oblast, Russia) to Lubmin near Greifswald, Germany","desc":"Twin 48-inch subsea gas pipelines about 1,200 km long, made from about 100,000 concrete-coated 24-tonne pipes. They have about 4 km of buried onshore pipe at the Russian landfall and 0.4 km of micro-tunnels at Lubmin. Coating plants and pipe yards are in Finland, Sweden and Germany.","need":"Gas supply from Russia to the EU (stated as enough for 26 million households).","cap":"55 bcm/yr","sched":"Pipe-laying 2018–2019; testing end of 2019","facts":["55 bcm/yr through two 1,153 mm lines about 1,200 km long","The route crosses five Natura 2000 sites and four IBAs; the preferred Danish/Swedish route stays more than 10 km from Natura 2000 and Bornholm","Lubmin: forest clearance about 190 × 190 m; groundwater drawn down 0.5 m below the pit for about 9 months"],"found":["Most impacts were negligible to minor because they are short and local. Only unde /* ---------- Screening ---------- */
function screening(){

  for(const t of J.trig) if(A[t[0]]==="u") unsure++;

  if(trigFull.length){ cat=0; why="A mandatory trigger applies: "+trigFull.map(t=>t[1].split("?")[0]).join("; ")+"."; }

    if(x.imp.dir>0){ ben++; continue; }
    pre[r0.lvl]++; post[r1.lvl]++; if(r0.sig) sigPre++; if(r1.sig) sigPost++;
    if(x.imp.mit.length) withMit++; if(r0.sig&&!x.imp.mit.length) sigNoMit++; if(r1.sig&&!x.imp.mon.length) sigNoMon++; }

}
function worstByComp(){
  const out={}; for(const x of scoped()){ if(x.imp.dir>0) continue; const r0=sigOf(x.imp,false), r1=sigOf(x.imp,true);
    const o=out[x.c.id]||(out[x.c.id]={c:x.c,pre:0,post:0,n:0}); o.pre=Math.max(o.pre,r0.lvl); o.post=Math.max(o.post,r1.lvl); o.n++; }

}
function altScores(){
  const W=M.alt.crit.reduce((a,c)=>a+(+c.w||0),0)||1;

    if(!x.imp.mit.length&&!x.imp.mon.length) continue; rows.push({x,r0,r1}); } return rows;
}
function esmpCost(){ let t=0; for(const x of scoped()){ x.imp.mit.forEach(m=>t+=parseFloat(String(m.cost).replace(/[^0-9.]/g,""))||0); x.imp.mon.forEach(m=>t+=parseFloat(String(m.cost).replace(/[^0-9.]/g,""))||0); } return t; }
