<script>
/* ============================================================
   GLOBAL COVERAGE (September 2026): 25 more national EIA frameworks.
   Each was checked against current government, law-firm or NGO
   sources on 30 September 2026. "(not verified)" marks details that
   could not be confirmed against a primary text.
   ============================================================ */
"use strict";
Object.assign(JUR,{
au:{n:"Australia — EPBC Act (Commonwealth)",law:"Environment Protection and Biodiversity Conservation Act 1999, heavily amended by the Environment Protection Reform Act 2025 and related Acts, including the National Environmental Protection Agency Act 2025 (royal assent Dec 2025). National Environmental Standards provisions commenced 2 Dec 2025; the main approval changes and the National EPA commenced 1 July 2026. The reforms add a revised 'unacceptable impacts' test, legally binding National Environmental Standards (the MNES and offsets standards were still drafts in 2026) and restoration contributions as an offset option",report:"Environmental Impact Statement (EIS); also preliminary documentation or streamlined assessment information",auth:"Federal Environment Minister, who may delegate referral and approval decisions to the National Environmental Protection Agency (NEPA); states through accredited or bilateral processes",cats:["Controlled action: assessed by EIS or public inquiry (significant or complex impacts on MNES)","Controlled action: streamlined assessment, preliminary documentation or accredited state process","Not a controlled action: no EPBC approval needed"],stages:["Referral of proposed action","Controlled action decision and choice of assessment pathway","Assessment (streamlined / preliminary documentation / EIS / public inquiry / accredited)","Public comment on assessment documents","Recommendation report","Approval decision with conditions (Minister or NEPA delegate)","Compliance and enforcement by NEPA"],part:"Referrals are published for public comment, and draft assessment documents are open for comment. Periods commonly cited are 10 business days (referral, preliminary documentation) and at least 20 business days (draft EIS) (not verified after the reform).",trig:[["t1","Is the action likely to have a significant impact on a Matter of National Environmental Significance (World Heritage, listed threatened species, Ramsar wetlands, nuclear actions, water trigger)?","full"],["t2","Is the action of moderate complexity, with enough information at referral for a streamlined or preliminary documentation assessment?","case"],["t3","Would the action be on or affect Commonwealth land, or be taken by a Commonwealth agency?","case"]],note:"Status checked September 2026. The reforms are new and still rolling out: the streamlined pathway replaced 'referral information' and 'public environment report' assessments and is not available for fossil fuel actions."},
nz:{n:"New Zealand — RMA (in transition) and Fast-track Approvals Act",law:"Resource Management Act 1991 (still governs consent applications in Sept 2026). Fast-track Approvals Act 2024, amended with changes in force 31 March 2026. RMA replacement: the Planning Bill and Natural Environment Bill passed third reading on 23 Sept 2026 and were awaiting royal assent. Transition from about Oct 2026; RMA repeal expected about 2030",report:"Assessment of Environmental Effects (AEE) with the resource consent application; substantive application for fast-track",auth:"Regional, district or unitary councils; for fast-track projects the EPA administers and an expert panel decides",cats:["Publicly notified consent (full AEE, submissions, possible hearing)","Limited notification to affected persons (case by case)","Non-notified consent, or permitted activity (no consent needed)"],stages:["Check plan rules and activity status","Pre-application consultation","Prepare application and AEE (RMA Schedule 4)","Notification decision","Submissions and hearing if required","Decision with conditions","Appeals to the Environment Court","Monitoring and compliance"],part:"Public notification allows submissions (20 working days under the RMA, not verified). Fast-track after 31 Mar 2026: invited comments within 20 working days, councils within 15; panel decides within 90 working days by default; no open public submissions.",trig:[["t1","Does the plan classify the activity as discretionary or non-complying with significant effects, so that public notification is required?","full"],["t2","Are there adversely affected persons (limited notification) or special circumstances?","case"],["t3","Is the project listed in, or referred into, the Fast-track Approvals Act regime?","case"]],note:"Status checked September 2026. Royal assent for the new Planning and Natural Environment Acts was pending. Applications lodged during the transition are processed under the RMA as in force when lodged."},
br:{n:"Brazil — Environmental Licensing (Law 15.190/2025 and CONAMA)",law:"Law 6.938/1981; CONAMA Res. 001/1986 (EIA/RIMA) and 237/1997 (LP/LI/LO licensing). General Environmental Licensing Law 15.190/2025 (in force 4 Feb 2026, after Congress overturned 52 presidential vetoes, restoring the LAC self-declaration licence). Law 15.300/2025 created the Special Environmental Licence (LAE) for strategic projects. Constitutional challenges (ADIs 7913, 7916, 7919) are pending at the STF",report:"EIA/RIMA (Estudo de Impacto Ambiental / Relatório de Impacto Ambiental); simplified studies for lower-impact activities",auth:"IBAMA (federal), state environmental agencies (OEMAs) or municipal agencies depending on scope (LC 140/2011)",cats:["Significant degradation: EIA/RIMA and three-phase licensing (LP, LI, LO), or LAE for strategic projects","Medium or lower impact: simplified routes such as LAC (adhesion and commitment)","Exempt activities listed in the law: no licence"],stages:["Screening or classification by the licensing agency","Terms of reference","EIA/RIMA preparation","Public hearing (audiência pública)","Technical analysis","Preliminary Licence (LP)","Installation Licence (LI)","Operation Licence (LO) and monitoring"],part:"The RIMA is made public; public hearings under CONAMA 009/1987 when requested by civil society, the Public Prosecutor or 50+ citizens (not verified). Consultation of Indigenous and traditional communities is contested under the new law.",trig:[["t1","Could the activity cause significant environmental degradation (e.g. CONAMA 001 list: roads, dams, mining, ports, large industry)?","full"],["t2","Is it a medium-impact activity eligible for simplified or LAC licensing, or a designated strategic project (LAE)?","case"],["t3","Does it affect protected areas, Indigenous lands or quilombola territories?","case"]],note:"Status checked September 2026. Law 15.190/2025 is being challenged at the STF; details may change."},
cl:{n:"Chile — SEIA (Law 19.300)",law:"Law 19.300 (1994), amended by Law 20.417 (2010). SEIA Regulation DS 40/2012, amended by DS 17/2026 (21 Jan 2026: new entry thresholds, sectoral permits, project modifications). Law 21.770 (2025) Framework Law on Sectoral Authorizations. The 'Evaluación Ambiental 2.0' reform bill was still in Congress in mid-2026",report:"Estudio de Impacto Ambiental (EIA) or Declaración de Impacto Ambiental (DIA)",auth:"Servicio de Evaluación Ambiental (SEA); Regional Evaluation Commissions or the SEA Executive Director issue the RCA; appeals to the Committee of Ministers and Environmental Courts",cats:["EIA required (Art. 11 effects present)","DIA (listed project without Art. 11 effects)","Not listed in Art. 10 / below DS 40 thresholds: no SEIA entry"],stages:["Check Art. 10 list and thresholds (optional pertinence query)","Submit DIA or EIA to the SEA","Admissibility","Sectoral review and information requests (ICSARA)","Addenda from the proponent","Citizen participation (PAC) and Indigenous consultation if applicable","Consolidated Evaluation Report (ICE)","RCA decision, appeals and SMA oversight"],part:"EIA: 60 business days for public observations. DIA: 20 days of participation if requested by 2+ organisations or 10+ directly affected persons. ILO 169 Indigenous consultation where applicable.",trig:[["t1","Is the project on the Art. 10 list above DS 40 thresholds and does it generate Art. 11 effects (health risk, significant effects on resources, resettlement, protected areas, landscape, heritage)?","full"],["t2","Is it listed under Art. 10 but without Art. 11 effects?","case"],["t3","Is it near protected areas, Indigenous communities or glaciers?","case"]],note:"Status checked September 2026. The 'Evaluación Ambiental 2.0' bill may change the process."},
mx:{n:"Mexico — LGEEPA Environmental Impact Assessment",law:"General Law of Ecological Balance and Environmental Protection (LGEEPA, 1988; latest reform 19 Jan 2026), Arts. 28–35 bis; EIA Regulation (2000, as amended). A new LGEEPA was under public hearings in the Chamber of Deputies in Sept 2026, not enacted",report:"Manifestación de Impacto Ambiental (MIA), regional or particular; Informe Preventivo for some cases",auth:"SEMARNAT (DGIRA) for federal works; ASEA for hydrocarbon projects; states and municipalities for local works",cats:["MIA regional (large or regional-scale projects)","MIA particular or Informe Preventivo (case by case)","Activities not listed in Art. 28: no federal EIA"],stages:["Check Art. 28 list and Regulation Art. 5","Prepare MIA or Informe Preventivo","Submission and publication in the Gaceta Ecológica","Optional public consultation","Technical evaluation (information requests)","Resolution: authorise, authorise with conditions, or deny","Compliance monitoring by PROFEPA"],part:"Public consultation (Art. 34) at the request of a community member: request within 10 days of publication, comments within 20 days, possible public information meeting (not verified). Resolution normally within 60 days (not verified).",trig:[["t1","Is the work listed in LGEEPA Art. 28 (oil, mining, hazardous waste, forestry, tourism in coastal ecosystems, wetlands)?","full"],["t2","Is it covered by an official standard or partial plan, so that an Informe Preventivo is enough?","case"],["t3","Is it in a natural protected area or coastal wetland?","case"]],note:"Status checked September 2026. A comprehensive new LGEEPA (adding strategic environmental assessment) is under discussion."},
pe:{n:"Peru — SEIA (Law 27446)",law:"Law 27446 (2001) National EIA System and Regulation DS 019-2009-MINAM. Law 29968 (2012) created SENACE, which is taking over functions sector by sector (e.g. DS 006-2026-MINAM, May 2026, transport-sector EIA-sd)",report:"Environmental certification based on DIA (Cat. I), EIA-sd (Cat. II) or EIA-d (Cat. III)",auth:"SENACE for EIA-d and transferred EIA-sd; sectoral ministries or regional governments for the rest; MINAM as governing body; OEFA for enforcement",cats:["Category III: detailed EIA (EIA-d)","Category II: semi-detailed EIA (EIA-sd)","Category I: Environmental Impact Declaration (DIA)"],stages:["Application with preliminary environmental evaluation","Classification (category)","Terms of reference and baseline","Study with citizen participation plan","Evaluation by the competent authority","Resolution granting or denying environmental certification","Monitoring and control (OEFA)"],part:"Formal participation for Categories II and III, including public hearings for Category III; prior consultation with Indigenous peoples where applicable.",trig:[["t1","Is the project likely to cause significant negative impacts needing in-depth analysis (Category III)?","full"],["t2","Are impacts moderate and mitigable with readily applicable measures (Category II)?","case"],["t3","Is it in or near a natural protected area or Indigenous territory?","case"]],note:"Status checked September 2026. Comment periods vary by sector (not verified)."},
co:{n:"Colombia — Environmental Licence (ANLA)",law:"Law 99/1993; Decree 1076/2015 (Sole Regulatory Decree, Title 2.2.2.3 on environmental licensing). Recent amendments include Decree 1033/2025 (optimised solar licence, 10–100 MW) and a similar wind-licence decree",report:"Estudio de Impacto Ambiental (EIA), preceded where required by a Diagnóstico Ambiental de Alternativas (DAA)",auth:"ANLA for national-scale projects; Regional Autonomous Corporations (CARs) and urban authorities for others",cats:["Environmental licence required (EIA; DAA where applicable)","Management plan or specific permits for smaller or unlisted works","No licence: activity not listed in Decree 1076"],stages:["Check if the activity is listed (ANLA or CAR)","Terms of reference and DAA if required","EIA with community socialisation","Application filing and site visit","Additional information request","Public hearing and prior consultation if applicable","Licence decision","Monitoring and appeals"],part:"A public environmental hearing can be requested by governors or mayors, the Procurador or Defensor, 3+ non-profit entities or 100+ citizens. Third-party intervention (Law 99 Art. 69). Consulta previa with ethnic communities.",trig:[["t1","Is the project on the Decree 1076 licensing list (hydrocarbons, large mining, energy >100 MW, ports, highways)?","full"],["t2","Is it a smaller activity under CAR competence or needing only specific permits?","case"],["t3","Does it affect ethnic communities (consulta previa), protected areas or forest reserves?","case"]],note:"Status checked September 2026. Statutory evaluation time (about 90 business days) not verified."},
za:{n:"South Africa — NEMA EIA Regulations",law:"National Environmental Management Act 107 of 1998 (s24); EIA Regulations 2014 (GN R982) and Listing Notices 1–3 (GN R983–985), amended 2017 and later. A DFFE discussion document on a risk-based 'flexible EIA framework' (Aug 2025) is draft only",report:"Basic Assessment Report (BAR), or Scoping Report plus Environmental Impact Assessment Report (EIAR), with an EMPr",auth:"DFFE (national), provincial environmental departments, or the minerals department for mining",cats:["Listing Notice 2: Scoping and EIR","Listing Notice 1, or 3 in sensitive areas: Basic Assessment","Not listed: no environmental authorisation"],stages:["Screening (listed activities, national screening tool)","Pre-application","Application","Basic Assessment or Scoping","EIR and EMPr","Public participation on reports","Decision (environmental authorisation)","Appeal to the Minister or MEC"],part:"Registered interested and affected parties; comment periods of at least 30 days on reports (not verified).",trig:[["t1","Is the activity in Listing Notice 2 (large industry, mining, major infrastructure)?","full"],["t2","Is it in Listing Notice 1, or in Listing Notice 3 within a specified sensitive area?","case"],["t3","Does the screening tool flag high environmental sensitivity?","case"]],note:"Status checked September 2026. The 2014 regime still applies; the proposed risk-based reform is a draft."},
ke:{n:"Kenya — EMCA Environmental Impact Assessment",law:"Environmental Management and Co-ordination Act 1999 (amended 2015). Environmental (Impact Assessment and Audit) Regulations 2003, amended 2019 (Second Schedule grouped into low, medium and high risk)",report:"Summary or comprehensive Project Report; Environmental (and Social) Impact Assessment Study Report",auth:"National Environment Management Authority (NEMA), which issues the EIA Licence",cats:["High risk: full EIA study","Medium risk: comprehensive project report (NEMA may require a full study)","Low risk: summary project report"],stages:["Screening against the Second Schedule","Submit project report","NEMA decides whether a full study is needed","Terms of reference and EIA study","Public participation (3+ public meetings, notices)","Submit study report; public comment","NEMA decision and EIA licence","Environmental audit and monitoring"],part:"During the study: site posters, newspaper and radio notices, at least 3 public meetings. After submission: 30 days for comments, extendable to 60 (EMCA s59). NEMA decides within 3 months; appeal to the National Environment Tribunal within 60 days.",trig:[["t1","Is the project in the high-risk list of the Second Schedule?","full"],["t2","Is it medium risk, or does the project report show significant impacts?","case"],["t3","Is it in a sensitive area (wetland, forest, coast)?","case"]],note:"Status checked September 2026. Any EMCA amendments after 2023 were not verified."},
gh:{n:"Ghana — Environmental Protection Act 2025",law:"Environmental Protection Act 2025 (Act 1124), enacted 6 Jan 2025, repealing Act 490 (1994); the EPA becomes the Environmental Protection Authority. The Authority cites Environmental Assessment Regulations 2025 (L.I. 2504), apparently replacing LI 1652 (1999) (not verified)",report:"Environmental Impact Statement (EIS) or Preliminary Environmental Report (PER), leading to an environmental permit",auth:"Environmental Protection Authority (EPA)",cats:["Full EIA / EIS (mandatory-list undertakings)","Preliminary Environmental Report (case by case)","Registration only, then permit without further assessment"],stages:["Registration of the undertaking","Screening","Scoping and terms of reference","EIS or PER","Public review and possible public hearing","EPA review","Environmental permit","Certificate, monitoring and audits"],part:"Under LI 1652: draft EIS open for 21-day public comment; public hearing where impacts are extensive, there is adverse public reaction, or relocation. Rules under L.I. 2504 not verified.",trig:[["t1","Is the undertaking on the mandatory-EIA schedule (large mining, oil and gas, large dams, major industry)?","full"],["t2","Does screening of a registrable undertaking show significant impacts?","case"],["t3","Is it in an environmentally sensitive area?","case"]],note:"Status checked September 2026. Act 1124 is confirmed; L.I. 2504 is known only from an EPA notice."},
eg:{n:"Egypt — Environment Law 4/1994 EIA",law:"Environment Law 4/1994, amended by Law 9/2009; Executive Regulations (as amended); EEAA EIA Guidelines 2009",report:"EIA report (Form A, Form B, or full EIA for Category C)",auth:"Egyptian Environmental Affairs Agency (EEAA) reviews; the Competent Administrative Authority (sector licensing body) receives applications and issues licences",cats:["Category C: full EIA report","Category B: Form B with preliminary impact analysis","Category A (white list): Form A only"],stages:["Screening by project list","Submission through the Competent Administrative Authority","Scoping (Category C)","EIA preparation","Public consultation (Category C)","EEAA review","Decision: approval with conditions, or objection","Appeal and follow-up"],part:"Public consultation is mandatory only for Category C, during scoping and on the draft EIA, with documented hearings.",trig:[["t1","Is the project on the Category C list (high potential impact)?","full"],["t2","Is it Category B, or near a sensitive area needing preliminary analysis?","case"],["t3","Is it on the Category A white list?","case"]],note:"Status checked September 2026. Procedure from the 2009 guidelines; EEAA review time (30 or 60 days) not verified."},
in:{n:"India — EIA Notification 2006 (Environmental Clearance)",law:"Environment (Protection) Act 1986; EIA Notification 2006 (S.O. 1533(E)), amended many times. The Draft EIA Notification 2020 was never adopted. A 2026 amendment extends expert committee tenure and creates standby authorities (SAEIA/SCEIA) for when state authorities are not functioning (gazette number not verified)",report:"EIA/EMP report (Environmental Clearance application through PARIVESH)",auth:"MoEFCC on Expert Appraisal Committee (EAC) advice for Category A; State Environment Impact Assessment Authority (SEIAA) on SEAC advice for Category B",cats:["Category A or B1: EIA report, public consultation and appraisal","Category B2 (decided by SEAC): appraisal without EIA report or public consultation","Not in the Schedule: no prior Environmental Clearance"],stages:["Application with Form 1 (screening for Category B)","Scoping: Terms of Reference issued","EIA report","Public consultation (public hearing plus written responses)","Final EIA/EMP","Appraisal by EAC/SEAC","Decision by MoEFCC/SEIAA","Six-monthly compliance reporting"],part:"Public hearing run by the State Pollution Control Board, with at least 30 days' notice and completion within 45 days of the request; written comments also invited. Amendments exempt some expansions and linear projects from the hearing.",trig:[["t1","Is the project listed in the Schedule at or above the Category A threshold (or B1)?","full"],["t2","Is it a Category B project near protected areas or interstate or international boundaries (which moves it to Category A)?","case"],["t3","Is it an expansion or modernisation above the notified limits?","case"]],note:"Status checked September 2026. The 2020 draft remains unadopted."},
cn:{n:"China — EIA under the Ecological and Environmental Code",law:"The Ecological and Environmental Code was adopted by the NPC on 12 Mar 2026 and took effect on 15 Aug 2026, repealing the EIA Law 2002 and nine other environmental laws; the EIA rules are now in the Code. Supporting rules: Classification List for Construction Project EIA (2021) and EIA Public Participation Measures (2018); their continuation under the Code is not verified",report:"EIA report book (报告书), EIA report form (报告表) or registration form (登记表)",auth:"Ecological environment authorities: MEE or provincial and municipal bureaux, by level",cats:["Significant impact: EIA report book, submitted for approval","Light impact: EIA report form, submitted for approval","Very small impact: registration form filed online (no approval)"],stages:["Classify the project using the Classification List","Commission the EIA","First public disclosure (report book only)","Disclose the draft report for comment","Submit report and public participation explanation","Technical review","Pre-approval publicity, then decision","Completion acceptance by the proponent"],part:"Report-book projects: first disclosure within 7 working days of commissioning the EIA; draft report open for comment at least 10 working days online, in newspapers and on site; the authority publishes its intended decision for at least 10 working days.",trig:[["t1","Does the Classification List require a report book (or report form) for this project type and scale?","full"],["t2","Is the project in an environmentally sensitive area as defined in the List?","case"],["t3","Is it a sectoral plan that needs a planning EIA?","case"]],note:"Status checked September 2026. The EIA Law was repealed on 15 Aug 2026 and its content moved into the Code."},
id:{n:"Indonesia — AMDAL / UKL-UPL (Environmental Approval)",law:"Law 32/2009 on Environmental Protection and Management, amended by the Job Creation Law (Law 6/2023). GR 22/2021; MoEF Reg. 4/2021 (lists). GR 28/2025 on risk-based business licensing keeps the tiers: high risk AMDAL, medium risk UKL-UPL, low risk SPPL, through OSS-RBA",report:"AMDAL (ANDAL + RKL-RPL), UKL-UPL form or SPPL",auth:"Ministry of Environment for national-strategic, cross-provincial or major projects; governor or regent/mayor otherwise; an independent feasibility test team reviews",cats:["High risk: AMDAL, then Environmental Feasibility Decision (SKKL)","Medium risk: UKL-UPL, then approval of the management commitment (PKPLH)","Low risk: SPPL self-declaration"],stages:["Register the business plan in OSS; risk screening","Announcement and public consultation","ANDAL scoping (Formulir KA)","Prepare ANDAL and RKL-RPL","Feasibility test (Tim Uji Kelayakan)","SKKL issued and folded into the business licence","Implementation and RKL-RPL reporting"],part:"Public involvement is limited to directly affected communities since the Job Creation Law. Announcement and comment period of 10 working days (not verified).",trig:[["t1","Is the activity on the mandatory AMDAL list (high risk) at or above the threshold?","full"],["t2","Is it in or next to a protected or sensitive area, which may require AMDAL below the threshold?","case"],["t3","Is it a medium-risk activity that needs UKL-UPL?","case"]],note:"Status checked September 2026. How GR 28/2025 interacts with GR 22/2021 in detail was not verified."},
ph:{n:"Philippines — Philippine EIS System (PEISS)",law:"PD 1586 (1978) and Proclamation 2146 (1981) on environmentally critical projects (ECPs) and areas (ECAs); DAO 2003-30 and Revised Procedural Manual; DAO 2017-15 (public participation). Later DENR orders include DAO 2025-20 (floating solar). A new Environmental Assessment System bill had not been enacted (not verified)",report:"Environmental Impact Statement (EIS); IEE Report or Checklist; Project Description",auth:"DENR Environmental Management Bureau: Central Office for ECPs, Regional Offices for Category B",cats:["Category A (ECP) or major B: EIS, then Environmental Compliance Certificate (ECC) or denial","Category B in an ECA: IEE or checklist, then ECC","Category C or D: Certificate of Non-Coverage (CNC)"],stages:["Screening (category)","Scoping (technical and public)","EIS or IEE","Public consultation or hearing","EIA Review Committee","ECC or CNC decision","Monitoring by the Multipartite Monitoring Team"],part:"Public scoping is mandatory for EIS projects; public consultation or hearing under DAO 2017-15. Day counts not verified.",trig:[["t1","Is the project an environmentally critical project type at or above the threshold?","full"],["t2","Is it in an environmentally critical area (protected area, flood-prone area, prime agricultural land)?","case"],["t3","Is it an expansion of a project that already has an ECC?","case"]],note:"Status checked September 2026. PD 1586 is still in force."},
vn:{n:"Vietnam — EIA under the Law on Environmental Protection 2020",law:"Law on Environmental Protection 2020 (No. 72/2020/QH14), amended by Law 146/2025/QH15 (in force 1 Jan 2026), which removed double-cropped paddy land from the sensitivity factors and dropped the mandatory-consultant rule. Decree 08/2022/ND-CP, amended by Decree 05/2025/ND-CP",report:"EIA report (báo cáo ĐTM); then an environmental licence or environmental registration",auth:"Ministry of Agriculture and Environment (merged 2025) for listed projects; Provincial People's Committees for the rest",cats:["Group I (and specified Group II): EIA report and appraisal decision","Group II or III: no EIA but an environmental licence","Group IV: environmental registration only, or exempt"],stages:["Classify the project into Group I–IV","Preliminary environmental assessment (Group I)","EIA alongside the feasibility study","Community consultation","Appraisal","Decision approving the EIA appraisal","Environmental licence before operation"],part:"Consultation with affected communities, commune authorities and relevant bodies, and online posting. Exact days not verified.",trig:[["t1","Is it a Group I project (high pollution risk, or large land or water use)?","full"],["t2","Does it involve sensitive factors (protected areas, forest, heritage, resettlement)?","case"],["t3","Is it a Group II project that the law lists as needing EIA?","case"]],note:"Status checked September 2026. Whether a new decree fully replaces Decree 08/2022 was not verified."},
bd:{n:"Bangladesh — Environmental Clearance (ECR 2023)",law:"Bangladesh Environment Conservation Act 1995 (amended); Environmental Conservation Rules 2023 (SRO 53/2023), replacing ECR 1997, with four categories: Green, Yellow, Orange, Red",report:"IEE or EIA report (with EMP), leading to Location Clearance and an Environmental Clearance Certificate",auth:"Department of Environment (DOE)",cats:["Red: full EIA (after IEE and ToR), then location and environmental clearance","Yellow or Orange: IEE/EMP, then clearance","Green: environmental clearance only"],stages:["Categorise the project","Apply for location clearance","IEE and ToR approval (Red)","EIA/EMP","DOE review","Environmental Clearance Certificate","Periodic renewal"],part:"Stakeholder consultation for Red and Orange projects (secondary sources); statutory days not verified.",trig:[["t1","Is the project listed as Red?","full"],["t2","Is it Orange or Yellow, or in an ecologically critical area?","case"],["t3","Is it in an EPZ, economic zone or industrial estate?","case"]],note:"Status checked September 2026. Category-to-document mapping from secondary sources, not the Gazette."},
pk:{n:"Pakistan — IEE/EIA under federal and provincial EPAs",law:"Pakistan Environmental Protection Act 1997 (s.12) and the IEE/EIA Review Regulations 2000 (federal). Since the 18th Amendment (2010) each province has its own regime, e.g. Sindh EPA Act 2014, KP EPA Act 2014, Punjab EPA 1997 (amended 2012) with Punjab IEE/EIA Regulations 2022, Balochistan EPA 2012",report:"Initial Environmental Examination (IEE) or Environmental Impact Assessment (EIA)",auth:"Federal EPA or the provincial EPA",cats:["Schedule II or sensitive area: EIA","Schedule I: IEE (may be escalated to EIA)","Not scheduled: no IEE/EIA"],stages:["Screening against the schedules","Scoping","IEE/EIA","Submission and completeness check","Public hearing (EIA)","Review and decision","Confirmation of compliance before operation"],part:"2000 Regulations: EIA hearing notice in a national newspaper at least 30 days ahead; review within 45 days (IEE) or 90 days (EIA); approval valid 3 years.",trig:[["t1","Is the project on Schedule II (EIA)?","full"],["t2","Is it in an environmentally sensitive area?","full"],["t3","Is it a Schedule I project needing an IEE?","case"]],note:"Status checked September 2026. Provincial rules differ."},
jp:{n:"Japan — Environmental Impact Assessment Act",law:"Environmental Impact Assessment Act 1997 (in force 1999); 2011 amendment added a primary consideration stage and post-project reports; amended again 20 June 2025 (continuous online publication from April 2026; streamlined procedure for repowering projects by June 2027). Local EIA ordinances cover smaller projects",report:"Primary consideration document, scoping document, draft EIS, final EIS, post-project report",auth:"The licensing authority (ministry or prefecture), with opinions from the Minister of the Environment and prefectural governors",cats:["Class 1 project: EIA required","Class 2 project: screening case by case","Below Class 2: no EIA under the Act (local ordinance may apply)"],stages:["Primary environmental impact consideration","Screening (Class 2)","Scoping document with public comment","Draft EIS with public comment","Final EIS with the Environment Minister's opinion","Reflection in the licensing decision","Post-project report"],part:"Scoping document and draft EIS on public inspection for 1 month; written opinions until 2 weeks after; explanatory meetings on the draft EIS.",trig:[["t1","Is it a Class 1 project type and scale (roads, dams, power plants, reclamation)?","full"],["t2","Is it a Class 2 project where screening finds significant impact?","case"],["t3","Is it a replacement project eligible for the 2025 streamlined procedure?","case"]],note:"Status checked September 2026. The 2025 amendment is being phased in."},
kr:{n:"South Korea — Environmental Impact Assessment Act",law:"Environmental Impact Assessment Act (fully revised 2011, amended since): strategic EA, EIA and small-scale EIA; Climate Change Impact Assessment since Sept 2022. From 1 Oct 2025 the Ministry of Environment became the Ministry of Climate, Energy and Environment",report:"Environmental Impact Statement (draft and final); small-scale EIA report",auth:"The approving agency, after consulting the Ministry of Climate, Energy and Environment",cats:["Listed project at or above threshold: full EIA","Small-scale EIA in conservation or planning areas","Below thresholds: no assessment"],stages:["Scoping (assessment items council)","Draft EIS","Public inspection and residents' explanation meeting","Public hearing if requested","Final EIS","Consultation with the Ministry","Approval decision","Post-EIA monitoring"],part:"Draft EIS on inspection for 20–40 days; explanatory meeting announced at least 7 days ahead; public hearing if 30 or more residents request one.",trig:[["t1","Is the project listed for full EIA at or above the threshold?","full"],["t2","Is it a smaller project in a conservation or management area (small-scale EIA)?","case"],["t3","Is it an administrative plan needing strategic EA?","case"]],note:"Status checked September 2026. The outcome of 2025 subordinate-rule amendments was not verified."},
tr:{n:"Türkiye — ÇED (EIA) Regulation",law:"Environment Law 2872 (Art. 10); EIA Regulation of 29 July 2022 (OG 31907). Amendment of 5 Mar 2026 (OG 33187) removed the 'EIA Not Required' decision, moved deadlines to calendar days and revised Annex I/II thresholds (e.g. land-based solar ≥25 ha in Annex I)",report:"EIA Report (ÇED Raporu); Project Introduction File (PTD) for Annex II",auth:"Ministry of Environment, Urbanisation and Climate Change (Annex I); Provincial Directorates (Annex II)",cats:["Annex I: EIA report, then 'ÇED Olumlu' (positive) or 'ÇED Olumsuz' (negative)","Annex II: PTD screening, then 'ÇED Olumlu' or 'EIA report required'","Outside the Annexes: not subject to the Regulation"],stages:["Application (EIA file or PTD)","Public participation meeting (Annex I)","Scoping by the commission","EIA report","Review and Evaluation Commission","Final report displayed for comment","Ministry decision","Monitoring and progress reports"],part:"Public participation meeting for Annex I projects; stakeholder engagement plan required; draft and final reports displayed for comment. Exact day counts not verified.",trig:[["t1","Is the project listed in Annex I at or above the threshold?","full"],["t2","Is it listed in Annex II, or in a sensitive area (Annex V)?","case"],["t3","Is it an expansion that crosses the thresholds?","case"]],note:"Status checked September 2026. The March 2026 amendment is confirmed."},
sa:{n:"Saudi Arabia — Environmental Permitting and EIA (Environmental Law 2020)",law:"Environmental Law (Royal Decree M/165, 2020) and the Executive Regulation for Environmental Permits. The National Center for Environmental Compliance (NCEC) issues permits outside the Royal Commission industrial cities, where RCJY applies its own regulations",report:"Environmental Impact Assessment study with an Environmental Management Plan",auth:"NCEC under the Ministry of Environment, Water and Agriculture; RCJY in Jubail and Yanbu",cats:["High impact: full EIA, then permit to construct (not verified)","Medium impact: scoping or limited study (not verified)","Low impact: environmental checklist (not verified)"],stages:["Classify the activity on the NCEC portal","Scoping","EIA study (high impact)","Public consultation (not verified)","NCEC review","EIA/EMP approval and permit to construct","Permit to operate and compliance monitoring"],part:"Not stated in the Environmental Law; a 30-day consultation for high-impact projects is reported only by a consultant (not verified).",trig:[["t1","Is the activity in the highest impact category?","full"],["t2","Is it medium impact, or near sensitive receptors?","case"],["t3","Is it in an RCJY industrial city (separate regulator)?","case"]],note:"Status checked September 2026. The official Executive Regulation could not be opened; category details are from secondary sources."},
ae:{n:"United Arab Emirates — Federal Law 24/1999 and emirate regimes",law:"Federal Law 24/1999 on the Protection and Development of the Environment (EIA before licensing). Emirate regimes: Abu Dhabi Law 16/2005 and EAD Technical Guidance on EIA (rev. 2014); Dubai Law 11/2024 created the Dubai Environment and Climate Change Authority (EIA role not verified). Federal Decree-Law 11/2024 on climate change is separate",report:"Preliminary Environmental Review (PER) or EIA report (Abu Dhabi)",auth:"Emirate authorities, e.g. the Environment Agency – Abu Dhabi (EAD); MOCCAE federally",cats:["Significant impacts: full EIA, then environmental permit","Moderate or uncertain: Preliminary Environmental Review (Abu Dhabi)","Minor: no EIA (not verified)"],stages:["Screening","Scoping","EIA by an approved consultant","Submission","Review","Approval; statement of commitments becomes binding","Construction EMP and monitoring"],part:"No explicit public consultation duty found in the federal law or EAD guidance (not verified).",trig:[["t1","Is it a major project in a listed sector (industry, energy, infrastructure)?","full"],["t2","Is it near a protected or sensitive coastal or marine habitat?","case"],["t3","Is it a strategic plan needing SEA (Abu Dhabi)?","case"]],note:"Status checked September 2026. Practice varies by emirate; only Abu Dhabi was checked in detail."},
ru:{n:"Russia — State Ecological Expertise and OVOS",law:"Federal Law 174-FZ on Ecological Expertise (1995, amended); Federal Law 7-FZ on Environmental Protection. The OVOS (EIA) procedure is set by Government Decree 1644 of 28 Nov 2024 (in force 1 Mar 2025), replacing Ministry Order 999 (2020)",report:"OVOS (EIA) materials as part of the project documentation",auth:"Rosprirodnadzor (federal ecological expertise) or regional authorities; OVOS organised by the proponent",cats:["Object of state ecological expertise: OVOS plus expertise, then positive or negative conclusion","Other activity with possible impact: OVOS without expertise (not verified)","Neither: no OVOS"],stages:["Notice to authorities and publication","Preliminary OVOS materials","Public access to materials","Public discussions (hearing or other form)","Protocol of comments and responses","Final OVOS materials","State ecological expertise conclusion"],part:"Materials available to the public for at least 30 days; public discussion by hearing or other agreed form; a protocol records comments and responses.",trig:[["t1","Is it an object of federal or regional state ecological expertise (174-FZ Arts 11–12)?","full"],["t2","Is it in specially protected areas, the Baikal zone, or marine or shelf areas?","full"],["t3","Is it another planned activity that may affect the environment?","case"]],note:"Status checked September 2026. Day counts under Decree 1644 beyond the 30-day access period not verified."},
