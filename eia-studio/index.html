function matrixHTML(mode){
  const phs=Object.keys(PHASES).filter(p=>M.acts.some(a=>a.ph===p)); const acts=phs.flatMap(p=>M.acts.filter(a=>a.ph===p));
  if(!acts.length||!M.comps.length) return `<p class="muted">Add activities (Project step) and components to build the matrix.</p>`;
  let h=`<div class="mx-wrap"><table class="mx"><thead><tr class="ph"><th class="rh corner" rowspan="2" style="vertical-align:bottom">Component ↓ &nbsp; Activity →</th>${phs.map(p=>`<th colspan="${M.acts.filter(a=>a.ph===p).length}">${PHASES[p]}</th>`).join("")}${mode==="sig"?`<th rowspan="2" style="vertical-align:bottom;padding:4px">Worst</th>`:""}</tr>
    <tr class="ac">${acts.map(a=>`<th title="${esc(a.n)}"><span class="vt">${esc(a.n)}</span></th>`).join("")}</tr></thead><tbody>`;
  for(const g of GROUPS){ const cs=M.comps.filter(c=>c.g===g); if(!cs.length) continue;
    h+=`<tr class="grp"><th colspan="${acts.length+1+(mode==="sig"?1:0)}">${g}</th></tr>`;
    for(const c of cs){ let worst=-1, wdir=-1;
      h+=`<tr><th class="rh" title="${esc(c.n)}">${esc(c.n)}</th>`+acts.map(a=>{ const k=cellKey(a,c), on=!!M.scope.cells[k]; const has=pathways(a,c).length>0;
        if(mode==="scope") return `<td class="${on?"on":""}"><button data-act="cell" data-k="${k}" data-a="${a.id}" data-c="${c.id}" aria-pressed="${on}" title="${esc(a.n)} → ${esc(c.n)}${has?" (library pathway)":""}" aria-label="${esc(a.n)} affects ${esc(c.n)}">${on?"●":has?"<span style='opacity:.3'>·</span>":""}</button></td>`;
        if(!on||!M.imp[k]) return `<td></td>`;
        const imp=M.imp[k], r=sigOf(imp,UI.mxRes); if(imp.dir<0&&r.lvl>worst){ worst=r.lvl; } if(imp.dir>0&&worst<0){ wdir=1; }
        const lab=imp.dir>0?"+":(methodFor(imp)==="leopold"&&r.M!=null?String(r.score):r.lvl);
        return `<td><button class="${lvClass(r.lvl,imp.dir)}" data-act="openImp" data-k="${k}" title="${esc(a.n)} → ${esc(c.n)}: ${esc(lvName(r.lvl,imp.dir))} (${esc(r.txt)})">${esc(lab)}</button></td>`; }).join("");
      if(mode==="sig") h+=`<td>${worst>=0?`<span class="sig ${lvClass(worst,-1)}" style="margin:0 4px">${LVL[worst]}</span>`:wdir>0?`<span class="sig bv2" style="margin:0 4px">Benefit</span>`:""}</td>`;
      h+=`</tr>`; } }
  return h+`</tbody></table></div>`;
}

function draftNTS(){
  const s=stats(), J=JUR[M.proj.jur]||JUR.generic, S=screening(); const W=worstByComp();
  const sigPost=W.filter(w=>w.post>=2).map(w=>w.c.n.toLowerCase()), sigPre=W.filter(w=>w.pre>=2).map(w=>w.c.n.toLowerCase());
  const bens=scoped().filter(x=>x.imp.dir>0).map(x=>x.c.n.toLowerCase());
  const alts=altScores(), ch=M.alt.opts.find(o=>o.id===M.alt.chosen);
  const p=[];
  p.push(`${M.org||"The proponent"} proposes the project “${M.title}”${M.proj.loc?" ("+M.proj.loc+")":""}. ${M.proj.desc}`);
  if(M.proj.need) p.push(`The project is needed to ${M.proj.need.charAt(0).toLowerCase()+M.proj.need.slice(1)}`);
  p.push(`This assessment follows ${J.n}. The screening outcome was “${S.label}”. ${M.acts.length} project activities across ${[...new Set(M.acts.map(a=>PHASES[a.ph].toLowerCase()))].join(", ")} were checked against ${M.comps.length} environmental and social components, and ${s.n} possible interactions were assessed using the ${METHODS[M.method].n.toLowerCase()}.`);
  p.push(sigPre.length?`Before mitigation, the assessment found ${s.sigPre} significant adverse effects, mainly on ${sigPre.slice(0,5).join(", ")}.`:"No significant adverse effects were found before mitigation.");
  const nMit=scoped().reduce((a,x)=>a+x.imp.mit.length,0);
  p.push(`${nMit} mitigation measures are proposed, following the order avoid, minimise, restore and offset. `+(sigPost.length?`After mitigation, ${s.sigPost} effects remain significant, on ${sigPost.join(", ")}; these need particular attention by the decision maker.`:`After mitigation, no significant adverse effects remain.`));
  if(bens.length) p.push(`The project is also expected to bring benefits to ${[...new Set(bens)].join(", ")}.`);
  if(ch) p.push(`${M.alt.opts.length} options were compared, including the no-project option; ${ch.n.toLowerCase()} was preferred${M.alt.why?" because "+M.alt.why.charAt(0).toLowerCase()+M.alt.why.slice(1):""}.`);
  if(M.eng.length) p.push(`${M.eng.length} stakeholder groups were identified and engaged. Their concerns and the responses are recorded in the report. A grievance mechanism will remain open throughout the project.`);
  p.push(`An environmental and social management plan sets out who will carry out each measure, when, and how it will be monitored.`);
  return p.join("\n\n");
}

  sources:`<h3>Using the sources</h3><ul><li>Search to find what backs a method, a framework or a case study.</li><li>The case-study documents are the best place to compare your ratings with the original assessors'.</li><li>Your study's own reference list is added to the EIS automatically.</li></ul>`,
  start:`<h3>How to use EIA Studio</h3><p>Open a documented case study to work through a real assessment and compare your judgement with the original, pick a teaching example, or start your own. Your work is kept in this browser; use <b>Save project file</b> to keep a copy or move it to another computer.</p><ul><li><b>Learn</b> shows a lesson and quiz at each step.</li><li><b>Guided</b> shows help text.</li><li><b>Expert</b> hides the help.</li></ul><p class="small muted">Built-in values are general guidance. Check the law and standards that apply to your project.</p>`,

  screen:`<h3>Screening tips</h3><ul><li>Answer the legal triggers from the text of the regulation, not from memory.</li><li>Weight-2 criteria (protected areas, Indigenous lands, displacement, major accidents) carry more weight.</li><li>If the authority has issued a screening decision, record it with <b>Override</b>.</li></ul>`,

  base:`<h3>Baseline tips</h3><ul><li>The value/sensitivity rating drives significance in most methods. Justify it.</li><li>Record data gaps honestly; they become limitations in the report.</li><li>Keep methods standard so monitoring can repeat them.</li></ul>`,
  impacts:`<h3>Rating impacts</h3><ul><li>Rate each interaction once with the descriptors; the tool shows the result under all six methods.</li><li>Unplanned events always use the risk matrix.</li><li>Write a one-line reason and <b>Confirm</b> each rating.</li><li>The <b>Significance matrix</b> tab gives the classic colour-coded overview.</li></ul>`,
  mitig:`<h3>Mitigation tips</h3><ul><li>Work down the hierarchy: avoid, minimise, restore, offset.</li><li>Make each measure specific, with an owner and cost.</li><li><b>Suggest from measures</b> gives a starting residual rating; adjust it with judgement.</li></ul>`,

function applyChange(ch){
  if(ch.type==="desc"){ M.imp[ch.key].d[ch.field]=+ch.v; logEv(`Claude suggestion applied: ${ch.label}`); }
  if(ch.type==="mit"){ M.imp[ch.key].mit.push({id:uid(),h:ch.h,t:ch.t,resp:"",when:phaseOf(M.imp[ch.key]),cost:""}); logEv("Measure added from Claude: "+ch.t); }
  if(ch.type==="sens"){ M.comps.find(c=>c.id===ch.c).sens=+ch.v; logEv(`Claude suggestion applied: ${ch.label}`); }
  if(ch.type==="asm"){ M.asm.push({id:uid(),t:ch.t,st:"pending"}); }
  store();
}
function showGloss(){
  $("#modalRoot").innerHTML=`<div class="modal-bg" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Glossary"><header><h3 style="flex:1">Glossary</h3><button class="btn sm" data-act="closeModal">Close</button></header><div class="body"><dl class="gl">${GLOSS.map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join("")}</dl></div></div></div>`;
}

/* ---------- Actions ---------- */
function rescopeAct(a){ for(const c of M.comps) if(pathways(a,c).length){ M.scope.cells[cellKey(a,c)]=1; ensureImpact(a,c); } }
function rescopeComp(c){ for(const a of M.acts) if(pathways(a,c).length){ M.scope.cells[cellKey(a,c)]=1; ensureImpact(a,c); } }
function dropWhere(pred){ for(const k of Object.keys(M.imp)) if(pred(k)){ delete M.imp[k]; delete M.scope.cells[k]; } }
async function act(el){
  const A=el.dataset.act, d=el.dataset; const imp=d.k&&M?M.imp[d.k]:null;
  switch(A){
    case "tpl": M=fromTpl(TPL.find(t=>t.id===d.id)); UI.open={}; UI.chat=[]; UI.discussion=""; go("project"); return;
    case "blank": { M=blankModel(); M.title=($("#newTitle").value.trim()||"New assessment"); M.proj.jur=$("#newJur").value;
      M.comps=["climate","air","noise","geology","sw","gw","terr","fauna","econ","land","health","work","heritage"].map(k=>mkComp(k));
      M.alt.opts=[{id:"o0",n:"Proposed project",desc:""},{id:"o1",n:"No project",desc:"The environment continues on its current trend"}];
      M.asm=[{id:uid(),t:"The project description is as stated; changes may alter the conclusions.",st:"pending"}];
      M.log=[{t:"Blank study started.",at:new Date().toISOString()}]; UI.open={}; UI.chat=[]; go("project"); return; }
    case "aiStart": { const t=($("#aiText").value||"").trim(); if(!t){ toast("Describe the project first."); return; } const st=$("#aiStatus"); el.disabled=true; st.innerHTML=`<span class="spin"></span> Claude is drafting the structure (this can take a minute)…`;
      try{ M=await AI.decompose(t); UI.open={}; UI.chat=[]; go("project"); toast("Draft ready. Review each step."); }catch(e){ st.textContent=e.code==="not_granted"?"Claude access was declined.":"Could not draft: "+(e.message||e.code); el.disabled=false; } return; }
    case "gloss": showGloss(); return;
    case "closeModal": $("#modalRoot").innerHTML=""; return;
    case "quiz": M.quiz[d.q]=+d.j; break;
    case "ans": M.screen.ans[d.q]=M.screen.ans[d.q]===d.v?undefined:d.v; if(M.screen.ans[d.q]===undefined) delete M.screen.ans[d.q]; break;
    case "untag": { const a=M.acts[+d.i]; a.tags=a.tags.filter(t=>t!==d.t); break; }
    case "delAct": { const a=M.acts[+d.i]; M.acts.splice(+d.i,1); dropWhere(k=>k.startsWith(a.id+"|")); logEv("Activity removed: "+a.n); break; }
    case "addActLib": { const a=mkAct($("#addActLib").value); M.acts.push(a); rescopeAct(a); logEv("Activity added: "+a.n); toast("Added, with "+M.comps.filter(c=>pathways(a,c).length).length+" interactions scoped in."); break; }
    case "addActCustom": M.acts.push({id:uid(),k:"custom",n:"New activity",ph:"C",tags:[],note:""}); break;
    case "cell": { const a=M.acts.find(x=>x.id===d.a), c=M.comps.find(x=>x.id===d.c); if(M.scope.cells[d.k]) delete M.scope.cells[d.k]; else { M.scope.cells[d.k]=1; ensureImpact(a,c); } break; }
    case "autoscope": { let n=0; for(const a of M.acts) for(const c of M.comps) if(pathways(a,c).length&&!M.scope.cells[cellKey(a,c)]){ M.scope.cells[cellKey(a,c)]=1; ensureImpact(a,c); n++; } toast(n+" interactions added."); break; }
    case "clearscope": M.scope.cells={}; toast("Matrix cleared. Ratings are kept if you tick cells again."); break;
    case "delComp": { const c=M.comps[+d.i]; M.comps.splice(+d.i,1); dropWhere(k=>k.endsWith("|"+c.id)); break; }
    case "addCompLib": { const c=mkComp($("#addCompLib").value); M.comps.push(c); rescopeComp(c); break; }
    case "addCompCustom": { const n=$("#addCompName").value.trim(); if(!n){ toast("Enter a name."); return; } M.comps.push(mkComp({n,g:$("#addCompG").value,sens:3})); break; }
    case "addOut": M.scope.out.push({t:"",why:""}); break;
    case "delOut": M.scope.out.splice(+d.i,1); break;
    case "addData": M.comps[+d.i].base.data.push({id:uid(),n:"",v:"",u:"",src:""}); break;
    case "delData": M.comps[+d.i].base.data.splice(+d.j,1); break;
    case "libData": { const c=M.comps[+d.i]; c.base.data=(COMP[c.k].base||[]).map(b=>({id:uid(),n:b[0],v:"",u:b[1],src:b[2]})); break; }
    case "toggle": UI.open[d.k]=!UI.open[d.k]; break;
    case "openImp": UI.view="list"; UI.fComp=""; UI.fSig=false; UI.fPend=false; UI.open[d.k]=true; render(); { const e=document.getElementById("imp-"+d.k.replace("|","-")); if(e) e.scrollIntoView({block:"center"}); } return;
    case "dir": imp.dir=+d.v; break;
    case "confirm": imp.st=imp.st==="ok"?"pending":"ok"; break;
    case "scopeOut": delete M.scope.cells[d.k]; toast("Scoped out. Tick the cell in Scoping to bring it back."); break;
    case "view": UI.view=d.v; break;
    case "expandAll": impFiltered().forEach(x=>UI.open[x.imp.key]=true); break;
    case "expandAllM": impFiltered().forEach(x=>UI.open["m"+x.imp.key]=true); break;
    case "collapseAll": UI.open={}; break;
    case "confirmShown": impFiltered().forEach(x=>x.imp.st="ok"); logEv("Ratings confirmed in bulk."); break;
    case "addMit": imp.mit.push({id:uid(),h:"minimise",t:"",resp:"",when:phaseOf(imp),cost:""}); break;
    case "delMit": imp.mit.splice(+d.j,1); break;
    case "addSug": { const s=suggestions(imp).m.filter(m=>!imp.mit.some(x=>x.t===m[1]))[+d.j]; if(s) imp.mit.push({id:uid(),h:s[0],t:s[1],resp:"",when:phaseOf(imp),cost:""}); break; }
    case "sugRes": imp.res=suggestResidual(imp); toast("Residual suggested. Check it."); break;
    case "sugAll": { let n=0; for(const x of scoped()){ if(x.imp.dir<0&&sigOf(x.imp,false).sig&&!x.imp.mit.length){ suggestions(x.imp).m.forEach(s=>x.imp.mit.push({id:uid(),h:s[0],t:s[1],resp:"",when:phaseOf(x.imp),cost:""})); x.imp.res=suggestResidual(x.imp); n++; } } toast(n?`Measures added to ${n} effects.`:"Every significant effect already has measures."); break; }
    case "addCum": M.cum.projs.push({id:uid(),n:"",status:"Existing",dist:0,comps:[]}); break;
    case "delCum": M.cum.projs.splice(+d.i,1); break;
    case "addOpt": M.alt.opts.push({id:"o"+uid(),n:"New option",desc:""}); break;
    case "delOpt": M.alt.opts.splice(+d.i,1); break;
    case "addCrit": M.alt.crit.push({id:"c"+uid(),n:"New criterion",w:10}); break;
    case "delCrit": M.alt.crit.splice(+d.i,1); break;
    case "addEng": M.eng.push({id:uid(),n:"",type:"community",int:3,inf:3,meth:"",date:"",issues:"",resp:""}); break;
    case "delEng": M.eng.splice(+d.i,1); break;
    case "addMon": imp.mon.push({id:uid(),ind:"",thr:"",freq:"",loc:"",resp:"",cost:"",act:""}); break;
    case "delMon": imp.mon.splice(+d.j,1); break;
    case "addMonSug": { const s=suggestions(imp).mon.filter(m=>!imp.mon.some(y=>y.ind===m[0]))[+d.j]; if(s) imp.mon.push({id:uid(),ind:s[0],thr:s[1],freq:s[2],loc:"",resp:"",cost:"",act:""}); break; }
    case "addAsm": M.asm.push({id:uid(),t:"",st:"pending"}); break;
    case "delAsm": M.asm.splice(+d.i,1); break;
    case "ntsDraft": M.nts=draftNTS(); logEv("Non-technical summary drafted from the assessment."); break;
    case "ntsAI": { const st=$("#ntsStatus"); el.disabled=true; st.innerHTML=`<span class="spin"></span> Claude is drafting…`; try{ M.nts=await AI.nts(); logEv("Non-technical summary drafted by Claude."); store(); render(); toast("Draft ready. Edit it into your own words."); }catch(e){ st.textContent="Could not draft ("+(e.code||e.message)+")."; el.disabled=false; } return; }
    case "pdf": case "docx": makeReport(A); return;
    case "apply": { const ch=UI.chat[+d.i].changes[+d.j]; applyChange(ch); ch.done=true; break; }
    case "chatClear": UI.chat=[]; renderChat(); return;
    case "covReg": UI.cReg=UI.cReg===d.v?"":d.v; store(); render(); { const n=document.getElementById("caseList"); if(n) n.scrollIntoView({behavior:"smooth",block:"start"}); } return;
    case "srcCopy": copyText(sourcesText()); return;
    case "srcCopyStudy": copyText(studySources().map((r,i)=>(i+1)+". "+r).join("\n")); return;
    case "srcDl": { const ok=await saveBlob(new Blob([sourcesText()],{type:"text/plain"}),"EIA-Studio-sources.txt"); if(ok) toast("Reference list saved."); return; }
    default: return;
  }
  store(); render();
}
function actChange(el){
  const A=el.dataset.actChange, d=el.dataset;
  switch(A){
    case "tag": if(el.value){ const a=M.acts[+d.i]; a.tags.push(el.value); const before=scoped().length; rescopeAct(a); const n=scoped().length-before; if(n) toast(n+" new interactions scoped in."); } break;
    case "meth": M.method=el.value; logEv("Significance method: "+METHODS[el.value].n); break;
    case "iemaLow": M.opt.iemaLow=el.checked; break;
    case "fComp": UI.fComp=el.value; break;
    case "cSec": UI.cSec=el.value; break;
    case "cReg": UI.cReg=el.value; break;
    case "cSrc": UI.cSrc=el.value; break;
    case "fSig": UI.fSig=el.checked; break;
    case "fPend": UI.fPend=el.checked; break;
    case "mxRes": UI.mxRes=el.checked; break;
    case "cumComp": { const p=M.cum.projs[+d.i]; p.comps=el.checked?[...new Set(p.comps.concat(el.value))]:p.comps.filter(x=>x!==el.value); break; }
    case "cumLvl": { const n=M.cum.notes[d.c]=M.cum.notes[d.c]||{lvl:"",txt:""}; n.lvl=el.value; break; }
    case "altSc": if(el.value==="") delete M.alt.sc[d.k]; else M.alt.sc[d.k]=+el.value; break;
    default: return;
  }
  store(); render();
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g&&!g.disabled){ go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(a&&!a.disabled){ if(a.tagName==="SELECT"||a.tagName==="INPUT") return; if(a.dataset.act==="closeModal"&&a.classList.contains("modal-bg")&&e.target!==a) return; act(a); }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches("header[data-act]")){ e.preventDefault(); act(e.target); } if(e.key==="Escape"&&$("#modalRoot").innerHTML) $("#modalRoot").innerHTML=""; });
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset&&el.dataset.b&&M){ let v=el.type==="checkbox"?el.checked:el.value; if(el.dataset.t==="n") v=v===""?"":+v; setPath(M,el.dataset.b,v); if(el.dataset.b==="title") $("#studyName").textContent=M.title; clearTimeout(window.__st); window.__st=setTimeout(store,300); }
  if(el.dataset&&el.dataset.actInput==="srcQ"){ UI.srcQ=el.value; const pos=el.selectionStart; render(); const n=$("#srcQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  if(el.dataset&&el.dataset.actInput==="cumTxt"){ const n=M.cum.notes[el.dataset.c]=M.cum.notes[el.dataset.c]||{lvl:"",txt:""}; n.txt=el.value; clearTimeout(window.__st); window.__st=setTimeout(store,300); }
});
document.addEventListener("change",e=>{ const el=e.target;
  if(el.dataset&&el.dataset.actChange){ actChange(el); return; }
  if(el.dataset&&el.dataset.b&&el.hasAttribute("data-rr")){ store(); render(); }
});

/* ---------- Files ---------- */
async function claudeUse(name){ if(!window.claude||typeof window.claude.use!=="function") return null;
  try{ return await Promise.race([window.claude.use(name),new Promise(r=>setTimeout(()=>r(null),11000))]); }catch(e){ return null; } }
async function saveBlob(blob,filename){
  const dl=await claudeUse("downloads");
  if(dl){ try{ await dl.save({filename,data:blob}); return true; }catch(e){ if(e&&(e.code==="cancelled"||e.code==="declined")) return false; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}
function boot(){
  restore();
  const setMode=m=>{ UI.mode=m; store(); render(); };
  $("#mLearn").onclick=()=>setMode("learn"); $("#mGuided").onclick=()=>setMode("guided"); $("#mExpert").onclick=()=>setMode("expert");
  $("#btnGloss").onclick=()=>showGloss(); $("#btnSearch").onclick=()=>openSearch();
  $("#btnNew").onclick=()=>{ M=null; UI.chat=[]; UI.open={}; UI.discussion=""; try{ localStorage.removeItem("eia.project"); }catch(e){} go("start"); };
  $("#btnSave").onclick=async()=>{ if(!M){ toast("Start a study first."); return; } const ok=await saveBlob(new Blob([JSON.stringify(M,null,1)],{type:"application/json"}),slug(M.title)+".eia.json"); if(ok) toast("Project file saved."); };
  $("#btnOpen").onclick=()=>$("#fileOpen").click();
  $("#fileOpen").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o||o.app!=="eia-studio"||!Array.isArray(o.acts)) throw new Error("not an EIA Studio project"); M=Object.assign(blankModel(),o); UI.open={}; go("project"); toast("Project opened."); }catch(err){ toast("Could not open: "+err.message); } }; r.readAsText(f); e.target.value=""; };
  let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(M&&["mitig","cumalt","engage"].includes(UI.step)) afterRender(); },250); });
  const mq=window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener&&mq.addEventListener("change",()=>afterRender());
  new MutationObserver(()=>{ if(M) afterRender(); }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  if(!M&&!FREE_PAGES.includes(UI.step)) UI.step="start";
  if(!applyHash()) render();
  AI.init().then(()=>{ renderChat(); if(UI.step==="start") renderAIStart(); if(UI.step==="report") render(); });
}
</script>
<script>
/* ============================================================
   SOURCES & REFERENCES — every source the tool's content relies on
   ============================================================ */
"use strict";
/* Checks of the current legal status (September 2026) */
const STATUS_SRC=[
  {c:"Council on Environmental Quality (2026). Removal of National Environmental Policy Act Implementing Regulations. Federal Register, 8 January 2026.",u:"https://www.federalregister.gov/documents/2026/01/08/2026-00178/removal-of-national-environmental-policy-act-implementing-regulations",use:"United States — NEPA framework"},
  {c:"Venable LLP (2026). CEQ Formally Rescinds Its NEPA Implementing Regulations.",u:"https://www.venable.com/insights/publications/2026/01/ceq-formally-rescinds-its-nepa-implementing",use:"United States — NEPA framework"},
  {c:"Impact Assessment Act, S.C. 2019, c. 28, s. 1. Justice Laws Website, Government of Canada.",u:"https://laws.justice.gc.ca/eng/acts/i-2.75/index.html",use:"Canada — federal framework"},
  {c:"Bennett Jones LLP (2026). Government of Canada Reduces the Scope of the Project List under the Impact Assessment Act. September 2026.",u:"https://www.bennettjones.com/Insights/Blogs/2026/09/Government-of-Canada-Reduces-the-Scope-of-the-Project-List-under-the-Impact-Assessment",use:"Canada — federal framework"},
  {c:"Legislative Assembly of British Columbia (2025). Bill 15 – Infrastructure Projects Act.",u:"https://www.bclaws.gov.bc.ca/civix/document/id/bills/billsprevious/gov15-1_43rd1st",use:"Canada — British Columbia framework"},
  {c:"Levelling-up and Regeneration Act 2023, Part 6: Environmental outcomes reports. legislation.gov.uk.",u:"https://www.legislation.gov.uk/ukpga/2023/55/part/6/2023-12-26/data.html",use:"United Kingdom framework"},
  {c:"Herbert Smith Freehills Kramer (2026). Environmental Outcomes Reports – an update.",u:"https://www.hsfkramer.com/notes/energy-and-infra-consenting/2026-posts/environmental-outcomes-reports-an-update",use:"United Kingdom framework"},
  {c:"World Bank. Environmental and Social Standards (ESS1–ESS10).",u:"https://projects.worldbank.org/en/projects-operations/environmental-and-social-framework/brief/environmental-and-social-standards",use:"World Bank ESF framework"},
  {c:"ISEP (2025). A new world: future-proofing the IFC Performance Standards.",u:"https://www.isepglobal.org/engage/transform/features/a-new-world-future-proofing-the-ifc-performance-standards/",use:"IFC Performance Standards (review status)"},
  {c:"Lawal, A. (2024). Environmental impact assessment in Nigeria 30 years after: challenges. IAIA24 conference presentation.",u:"https://2024.iaia.org/presentations/111_Lawal_EIA_in_Nigeria_30years.pdf",use:"Nigeria framework"}
];
STATUS_SRC.push(...JUR_SRC);
const SRC_GROUPS=["Documented case studies","Research on EIA practice","Legal frameworks and their current status","Significance methods","EIA textbooks and good-practice guidance","Baseline and technical guidance by component"];
function allSources(){
  const out=[]; const add=(g,c,u,use,extra)=>{ if(!c) return; const k=g+"|"+c; if(out.some(x=>x.k===k)) return; out.push({k,g,c,u:u||"",use:use||"",extra:extra||""}); };
  TPL.filter(t=>t.doc).forEach(t=>add(SRC_GROUPS[0],t.src.cite,t.src.url,"Case study: "+t.n,t.src.t+(t.src.wos?" · checked in Web of Science":"")+(t.src.scopus?" · found in Scopus":"")+(t.ft?" · full text read":"")));
  (typeof EVIDENCE!=="undefined"?EVIDENCE:[]).forEach(e=>add(SRC_GROUPS[1],e.c,e.u,e.use,"Peer-reviewed · found in Scopus"));
  Object.values(JUR).forEach(j=>add(SRC_GROUPS[2],j.law,"",j.n,"Law and guidance"));
  STATUS_SRC.forEach(s=>add(SRC_GROUPS[2],s.c,s.u,s.use,"Status check, September 2026"));
  Object.values(METHODS).forEach(m=>m.ref.split("; ").forEach(r=>add(SRC_GROUPS[3],r,/Pastakia/.test(r)?"https://doi.org/10.1016/S0195-9255(98)00018-3":"",m.n,/Pastakia/.test(r)?"Checked via Crossref":"")));
  REFS_BASE.forEach(r=>add(SRC_GROUPS[4],r,"","General EIA practice"));
  add(SRC_GROUPS[4],"Lee, N. & Colley, R. (1992). Reviewing the Quality of Environmental Statements. Occasional Paper 24, EIA Centre, University of Manchester.","","Quality review checklist (Review & report step)");
  add(SRC_GROUPS[4],"Dee, N., Baker, J. et al. (1973). Environmental evaluation system for water resource planning. Water Resources Research, 9(3), 523–535.","","Alternatives: Battelle Environmental Evaluation System","Checked in Web of Science");
  const byRef={}; Object.values(COMP).forEach(c=>c.src.split("; ").forEach(r=>{ (byRef[r]=byRef[r]||[]).push(c.n); }));
  Object.entries(byRef).forEach(([r,ns])=>add(SRC_GROUPS[5],r,"",ns.join(", ")));
  return out;
}
function studySources(){ if(!M) return [];
  const J=JUR[M.proj.jur]||JUR.generic; const s=new Set(); if(M.case) s.add(M.case.cite+(M.case.url?" "+M.case.url:""));
  s.add(J.law); METHODS[M.method].ref.split("; ").forEach(r=>s.add(r)); if(M.acts.some(a=>a.ph==="U")) METHODS.risk.ref.split("; ").forEach(r=>s.add(r));
  M.comps.forEach(c=>{ if(COMP[c.k]) COMP[c.k].src.split("; ").forEach(r=>s.add(r)); }); REFS_BASE.forEach(r=>s.add(r));
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function renderSources(){
  const all=allSources(); const q=(UI.srcQ||"").toLowerCase().trim();
  const hit=x=>!q||(x.c+" "+x.use+" "+x.extra).toLowerCase().includes(q);
  const groups=SRC_GROUPS.map(g=>{ const xs=all.filter(x=>x.g===g&&hit(x)).sort((a,b)=>a.c.localeCompare(b.c)); if(!xs.length) return "";
    return `<section class="card stack"><div class="row" style="justify-content:space-between"><h2>${esc(g)}</h2><span class="chip">${xs.length}</span></div>
      <ol class="refs" style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px">${xs.map(x=>`<li><span>${esc(x.c)}</span>${x.u?` <a href="${esc(x.u)}" target="_blank" rel="noopener" style="overflow-wrap:anywhere">${esc(x.u)}</a>`:""}<div class="small muted">${x.extra?`<span class="chip" style="margin-right:6px">${esc(x.extra)}</span>`:""}Used for: ${esc(x.use)}</div></li>`).join("")}</ol></section>`; }).join("");
  const ss=studySources();
  return `<section class="card stack"><div class="eyebrow">Sources & references</div><h1 style="font-size:clamp(1.6rem,3.4vw,2.2rem)">Where the content of EIA Studio comes from</h1>
    <p class="lead">Every case study, legal framework, significance method and piece of baseline guidance in the tool is listed here with what it is used for. Links go to the original documents where a verified link is available.</p>
    <div class="banner small">Peer-reviewed case studies were found and verified in the Web of Science Core Collection and Scopus (September 2026); those marked “full text read” were read in full through institutional access. Legal frameworks were last checked in September 2026. Laws and guidance change; confirm the current position with the competent authority before relying on it. Impact pathways, default ratings and suggested measures are general practice compiled for this tool, not taken from a single source.</div>
    <div class="row"><input type="text" id="srcQ" data-act-input="srcQ" value="${esc(UI.srcQ||"")}" placeholder="Search sources, e.g. RIAM, Nigeria, noise" style="max-width:360px" aria-label="Search sources"><span class="small muted">${all.filter(hit).length} of ${all.length} sources</span>
      <button class="btn sm" data-act="srcCopy">Copy full list</button><button class="btn sm" data-act="srcDl">Download reference list</button></div></section>
  ${M?`<section class="card stack"><div class="row" style="justify-content:space-between"><div><h2>References for your current study</h2><p class="small muted" style="margin:0">${esc(M.title)} — these go into the References section of your EIS.</p></div><button class="btn sm" data-act="srcCopyStudy">Copy</button></div>

/* ---------- World map of documented cases ---------- */
function neProj(lon,lat){ const l=lon*Math.PI/180, p=lat*Math.PI/180, p2=p*p, p4=p2*p2;
  const x=l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4))), y=p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)));
  return [WORLD.tx+WORLD.k*x, WORLD.ty-WORLD.k*y]; }
function worldMap(docs){
  const shown=docs.filter(t=>t.lat!=null);
  const pins=shown.map(t=>{ const [x,y]=neProj(t.lon,t.lat); const on=UI.pin===t.id, dim=UI.cReg&&t.region!==UI.cReg;
    return `<g class="pin${on?" on":""}${dim?" dim":""}" data-act="pin" data-id="${t.id}" tabindex="0" role="button" aria-label="${esc(t.n)}, ${esc(t.country||t.region)}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?7:5}"></circle><title>${esc(t.n)} — ${esc(t.country||t.region)}</title></g>`; }).join("");
  const P=UI.pin&&TPL.find(t=>t.id===UI.pin);
  return `<div class="wmap"><svg viewBox="0 0 960 500" role="img" aria-label="World map of documented case studies"><path class="sph" d="${WORLD.sph}"></path><path class="land" d="${WORLD.d}"></path>${pins}</svg></div>

/* ---------- Quick significance calculator ---------- */
function renderCalc(){

  const dsel=k=>`<label class="f">${esc(DESC[k].n)}<select data-act-change="calcD" data-k="${k}">${DESC[k].o.map((o,i)=>o==null?"":`<option value="${i}" ${+d[k]===i?"selected":""}>${esc(o)}</option>`).join("")}</select><span class="h">${esc(DESC[k].h)}</span></label>`;
  return `<section class="card stack"><div><div class="eyebrow">Tool</div><h1>Quick significance calculator</h1><p class="lead">Describe one effect and see how each of the six methods in this tool would rate it. Useful for learning, and for checking a single judgement before you open a full study.</p></div>
    <div class="grid2"><label class="f">Method<select data-act-change="calcM">${Object.entries(METHODS).map(([k,m])=>`<option value="${k}" ${c.m===k?"selected":""}>${esc(m.n)}</option>`).join("")}</select></label>
      <label class="f">Direction<select data-act-change="calcDir"><option value="-1" ${c.dir<0?"selected":""}>Adverse</option><option value="1" ${c.dir>0?"selected":""}>Beneficial</option></select></label>
      <label class="f">Receptor sensitivity<select data-act-change="calcS">${[1,2,3,4,5].map(i=>`<option value="${i}" ${c.s===i?"selected":""}>${esc(SENS[i].n)}</option>`).join("")}</select><span class="h">${esc(SENS[c.s].h)}</span></label></div>
    <div class="grid3">${DKEYS.map(dsel).join("")}</div></section>
  <section class="card stack"><div class="kpis"><div class="kpi"><div class="u">${esc(Mt.n)}</div><div class="v" style="font-size:1.25rem">${esc(r.txt)}</div><div class="u">${r.sig?(c.dir>0?"Significant benefit":"Significant effect"):"Not significant"}</div></div></div>

}

  const st=$("#repStatus"); const name=($("#repName").value.trim()||"EIS").replace(/[\\/:*?"<>|]+/g,"-");
  if(kind==="pdf"&&!(window.jspdf&&window.jspdf.jsPDF)){ st.textContent="The PDF library did not load. Check your connection and reload the page."; return; }
  if(kind==="docx"&&!window.docx){ st.textContent="The Word library did not load. Check your connection and reload the page."; return; }
  const wantAI=$("#repAI")&&$("#repAI").checked;
  try{
    if(wantAI&&!UI.discussion){ st.innerHTML=`<span class="spin"></span> Claude is drafting the discussion…`; try{ UI.discussion=await AI.discussion(); }catch(e){ UI.discussion=""; } }
    if(!wantAI) UI.discussion="";
    st.innerHTML=`<span class="spin"></span> Building the ${kind==="pdf"?"PDF":"Word"} report…`; await new Promise(r=>setTimeout(r,30));
    const blocks=await buildReport(); const blob=kind==="pdf"?renderPDF(blocks):await renderDOCX(blocks);
    window.__lastReport=blob;
    const ok=await saveBlob(blob,name+"."+kind); logEv(`${kind.toUpperCase()} report generated.`); store();
    st.textContent=ok?`Report ready (${Math.round(blob.size/1024)} KB).`:"Download cancelled.";
  }catch(e){ console.error(e); st.textContent="Could not build the report: "+e.message; }
}
boot();
</script>

</body>
</html>
