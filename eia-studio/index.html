<html lang="en">

<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324594A'/%3E%3Cpath d='M18 44c18 2 30-10 28-28-18-2-30 10-28 28zm0 0l16-16' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script data-goatcounter="https://shagbaor.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

<script src="/assets/traction.js" defer></script>
</head>
<body>
<style>
/* Layout: a field assessor's workbook — step rail across the top, the Leopold-style interaction matrix as the centrepiece, a lesson/assistant column on the right. Sibling of Lifecycle Studio and Techno-Economic Studio: same type system, pine and ochre. */
:root{
  --bg:#EEF1EE; --panel:#FFFFFF; --panel-2:#F4F6F3; --ink:#18231E; --ink-2:#56645C; --line:#D2DAD4; --grid:#E6ECE7;
  --accent:#24594A; --accent-ink:#FFFFFF; --accent-soft:#DCEAE3; --ochre:#9A6A14; --ochre-soft:#F6EEDC;
  --good:#2F7D4F; --warn:#9A6412; --crit:#B23B3B; --warn-soft:#FBF1DF; --good-soft:#E3F1E8; --crit-soft:#F8E5E5;
  --s0:#EEF0EE; --s1:#F4E9B8; --s2:#F2C27A; --s3:#E0805A; --s4:#B8383A; --s0i:#56645C; --s1i:#4F4410; --s2i:#4A300A; --s3i:#3D1508; --s4i:#FFFFFF;
  --b1:#D6EBF0; --b2:#A9D3DF; --b3:#5FA9BE; --b4:#2A7690; --b1i:#153540; --b4i:#FFFFFF;
  --c1:#24594A; --c2:#9A6A14; --c3:#3F7F8C; --c4:#8A4B7E; --c5:#B23B3B; --c6:#7A6555; --c7:#5B6B8C; --c8:#6F8F3A;
  --f-disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --panel:#161E1A; --panel-2:#1B2520; --ink:#E2EAE5; --ink-2:#9DADA4; --line:#2B3831; --grid:#222D27;
  --accent:#7CC2A6; --accent-ink:#0C1612; --accent-soft:#1B3029; --ochre:#D9A84E; --ochre-soft:#33291A;
  --good:#6CC08F; --warn:#E0A94F; --crit:#EC7A7A; --warn-soft:#33291A; --good-soft:#1A3025; --crit-soft:#3A1F22;
  --s0:#232D28; --s1:#4A4420; --s2:#6E4E1C; --s3:#8A3A24; --s4:#C24444; --s0i:#9DADA4; --s1i:#F1E6B4; --s2i:#FBDDB0; --s3i:#FFE1D6; --s4i:#FFFFFF;
  --b1:#1C3740; --b2:#24505E; --b3:#2F7389; --b4:#4FA3BD; --b1i:#CBE7EF; --b4i:#0B1A1F;
  --c1:#7CC2A6; --c2:#D9A84E; --c3:#6FC0CC; --c4:#C68AC0; --c5:#EC7A7A; --c6:#B79E86; --c7:#A3B2D6; --c8:#A9C76B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#161E1A; --panel-2:#1B2520; --ink:#E2EAE5; --ink-2:#9DADA4; --line:#2B3831; --grid:#222D27;
  --accent:#7CC2A6; --accent-ink:#0C1612; --accent-soft:#1B3029; --ochre:#D9A84E; --ochre-soft:#33291A;
  --good:#6CC08F; --warn:#E0A94F; --crit:#EC7A7A; --warn-soft:#33291A; --good-soft:#1A3025; --crit-soft:#3A1F22;
  --s0:#232D28; --s1:#4A4420; --s2:#6E4E1C; --s3:#8A3A24; --s4:#C24444; --s0i:#9DADA4; --s1i:#F1E6B4; --s2i:#FBDDB0; --s3i:#FFE1D6; --s4i:#FFFFFF;
  --b1:#1C3740; --b2:#24505E; --b3:#2F7389; --b4:#4FA3BD; --b1i:#CBE7EF; --b4i:#0B1A1F;
  --c1:#7CC2A6; --c2:#D9A84E; --c3:#6FC0CC; --c4:#C68AC0; --c5:#EC7A7A; --c6:#B79E86; --c7:#A3B2D6; --c8:#A9C76B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1} h2{font-size:1.45rem} h3{font-size:1.08rem} h4{font-size:.98rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.875rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:.4em 0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-disp);font-size:1.22rem;white-space:nowrap}
.brand b i{font-style:normal;color:var(--ochre)}
.brand span{color:var(--ink-2);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:.86rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.rail{display:flex;overflow-x:auto;padding:0 16px;border-top:1px solid var(--line)}
.rail button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 11px 8px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;color:var(--ink-2);font-size:.95rem}
.rail button .n{font-family:var(--f-mono);font-size:.74rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.rail button.done .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail button:disabled{opacity:.45;cursor:not-allowed}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;padding:18px 16px 60px;max-width:1500px;margin:0 auto}
@media (max-width:1080px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:72ch}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--crit);background:var(--crit-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400}
label.f .h{font-weight:400;color:var(--ink-2);font-size:.82rem}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-family:var(--f-mono);font-size:.9rem}
details>summary{cursor:pointer;color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:normal;overflow-wrap:anywhere;max-width:100%}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.crit{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.ochre{border-color:var(--ochre);color:var(--ochre);background:var(--ochre-soft)}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.banner.ok{border-color:var(--good);background:var(--good-soft)} .banner.info{border-color:var(--accent);background:var(--accent-soft)} .banner.crit{border-color:var(--crit);background:var(--crit-soft)}

/* Start */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:780px){.hero{grid-template-columns:minmax(0,1fr)}}
.flow{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:12px 14px;display:grid;gap:3px}
.flow div{display:flex;gap:10px;align-items:baseline}
.flow b{color:var(--accent);min-width:1.6em}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.lib-item{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.lib-item:hover{border-color:var(--accent)}
.cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cov{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit}
.cov:hover{border-color:var(--accent)}
.cov.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cov.empty{opacity:.6}
.cov .cov-n{font-size:.82rem;color:var(--accent);font-weight:600}
.cov .small{font-size:.8rem;color:var(--ink-2)}
.lib-item b{font-weight:700}
.lib-item .chip{white-space:normal;max-width:100%;text-align:left}
.lib-item span{font-size:.86rem;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--panel)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{display:block} .opt span{font-size:.86rem;color:var(--ink-2)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num{white-space:nowrap;font-family:var(--f-mono);font-size:.86rem;text-align:right}
table.t input,table.t select,table.t textarea{padding:4px 6px;font-size:.86rem}
table.t textarea{min-height:40px}
table.edit{min-width:760px}

/* Interaction matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:72vh;background:var(--panel)}
table.mx{border-collapse:separate;border-spacing:0;font-size:.82rem}
table.mx th,table.mx td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}
table.mx thead th{position:sticky;top:0;background:var(--panel-2);z-index:2;vertical-align:bottom;padding:6px 4px;font-weight:600}
table.mx thead tr.ph th{top:0;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:4px 8px}
table.mx thead tr.ac th{top:26px;height:150px}
table.mx thead th .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;max-height:140px;overflow:hidden;text-overflow:ellipsis;display:inline-block;font-size:.8rem}
table.mx th.rh{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:4px 10px;font-weight:600;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
table.mx thead th.corner{left:0;z-index:3}
table.mx tr.grp th{background:var(--panel-2);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:4px 10px;position:sticky;left:0}
table.mx td{width:34px;min-width:34px;height:30px;text-align:center;padding:0}
table.mx td button{width:100%;height:30px;border:0;background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
table.mx td button:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.mx td.on button{background:var(--accent-soft);color:var(--accent)}
.lv0{background:var(--s0)!important;color:var(--s0i)!important}.lv1{background:var(--s1)!important;color:var(--s1i)!important}.lv2{background:var(--s2)!important;color:var(--s2i)!important}.lv3{background:var(--s3)!important;color:var(--s3i)!important}.lv4{background:var(--s4)!important;color:var(--s4i)!important}
.bv1{background:var(--b1)!important;color:var(--b1i)!important}.bv2{background:var(--b2)!important;color:var(--b1i)!important}.bv3{background:var(--b3)!important;color:var(--b4i)!important}.bv4{background:var(--b4)!important;color:var(--b4i)!important}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px}
.sig{display:inline-block;padding:1px 8px;border-radius:4px;font-size:.8rem;font-weight:600;white-space:nowrap}

/* Impact cards */
.imp{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.imp>header{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.imp>header .t{flex:1;min-width:200px;font-weight:600}
.imp.ok{border-left:4px solid var(--good)} .imp.pending{border-left:4px solid var(--warn)}
.imp .bd{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--grid)}
.desc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.dirsel{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dirsel button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-size:.86rem}
.dirsel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.methcmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.methcmp div{border:1px solid var(--grid);border-radius:6px;padding:6px 8px;font-size:.8rem;min-width:0}
.methcmp div.cur{border-color:var(--accent)}
.mit{display:grid;grid-template-columns:130px minmax(0,1fr) 150px 110px 30px;gap:6px;align-items:start}
@media (max-width:760px){.mit{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sugg{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.sugg button{text-align:left;border:1px dashed var(--line);background:var(--panel-2);border-radius:6px;padding:5px 8px;cursor:pointer;font:inherit;font-size:.86rem}
.sugg button:hover{border-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);min-width:0}
.kpi .v{font-family:var(--f-disp);font-size:1.6rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.kpi .u{font-size:.84rem;color:var(--ink-2)}
.progress{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);min-width:0;overflow-x:auto}
.chartbox canvas{display:block;max-width:none}

/* Lesson */
.lesson{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.lesson h3{color:var(--accent)}
.lesson p,.lesson li{max-width:80ch}
.lesson ul{padding-left:20px;margin:.3em 0}
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .q{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel)}
.quiz .q button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 10px;margin-top:6px;cursor:pointer;font:inherit;font-size:.92rem}
.quiz .q button.right{border-color:var(--good);background:var(--good-soft)}
.quiz .q button.wrong{border-color:var(--crit);background:var(--crit-soft)}
.fb{font-size:.88rem;margin-top:6px}

aside{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 120px);overflow:auto}
@media (max-width:1080px){.side{position:static;max-height:none}}
.guide p,.guide li{font-size:.93rem}
.guide ul{padding-left:18px;margin:.4em 0}
.chat{display:flex;flex-direction:column;gap:8px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.msg{padding:8px 10px;border-radius:8px;font-size:.92rem;white-space:pre-wrap}
.msg.u{background:var(--accent-soft);align-self:flex-end;max-width:90%}
.msg.a{background:var(--panel-2);border:1px solid var(--line)}
.chg{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;font-size:.86rem}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .body{padding:12px 16px;overflow:auto}
.gl dt{font-weight:700;margin-top:10px} .gl dd{margin:2px 0 0;color:var(--ink-2);font-size:.93rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:60;font-size:.92rem}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.expert-hide{} body.expert .expert-hide{display:none}
.learn-only{display:none} body.learn .learn-only{display:revert}
.expert-only{display:none} body.expert .expert-only{display:revert}
@media (max-width:700px){.top{position:static}.brand span{display:none}}

.wmap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.wmap svg{display:block;width:100%;height:auto}
.wmap .sph{fill:color-mix(in srgb,var(--accent) 6%,transparent);stroke:var(--line)}
.wmap .land{fill:color-mix(in srgb,var(--ink-2) 18%,transparent);stroke:var(--panel);stroke-width:.4}
.wmap .pin circle{fill:var(--ochre);stroke:var(--panel);stroke-width:1.5;cursor:pointer}
.wmap .pin:hover circle,.wmap .pin:focus circle{fill:var(--accent);outline:none}
.wmap .pin.on circle{fill:var(--accent);stroke-width:2.5}
.wmap .pin.dim circle{opacity:.25}
.modal.search .body{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.sr{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid transparent;background:none;border-radius:var(--r);padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
.sr>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.sr.on,.sr:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sr .chip{flex:none;min-width:84px;justify-content:center}
kbd{font:600 .72rem/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;margin-left:4px;color:var(--ink-2)}
.fw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.fw-item{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel);cursor:pointer;text-decoration:none;color:inherit}
.fw-item>span{display:flex;flex-direction:column;gap:2px}
.fw-item:hover{border-color:var(--accent)}
table.fwc td,table.fwc th{vertical-align:top}
table.fwc ul,table.fwc ol{margin:0;padding-left:18px}
tr.on td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
dt.hl{background:color-mix(in srgb,var(--ochre) 25%,transparent);border-radius:4px}
.foot{max-width:1500px;margin:8px auto 24px;padding:0 16px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--ink-2)}
@media (max-width:700px){#btnSearch kbd{display:none}}
.foot .row{gap:14px}.foot a,.linkbtn{color:var(--accent);font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

<script>
/* ============================================================
   EIA STUDIO — KNOWLEDGE BASE
   Valued components, project activities, impact pathways,
   baseline guidance, legal frameworks, significance methods,
   lessons, quizzes and glossary.
   Built-in content is general guidance for learning and screening-level
   work. Always check the current law and guidance of your jurisdiction.
   ============================================================ */
"use strict";
const GROUPS = ["Physical","Biological","Social & economic","Health, culture & rights"];

/* ---------- Valued components (VCs / receptors) ---------- */
const COMP = {
  climate:{n:"Climate (GHG emissions & resilience)",g:"Physical",s:4,
    what:"Greenhouse gas emissions from the project and the project's exposure to a changing climate (floods, heat, drought).",
    base:[["Annual GHG emissions, current land use","t CO₂e/yr","IPCC 2006/2019 Guidelines; GHG Protocol"],["Climate normals (temperature, precipitation)","°C, mm","30-year normals from national met service"],["Climate projections for project life","—","CMIP6 / national climate atlas"],["Flood and extreme-event history","—","Hydromet records, hazard maps"]],
    how:"Desk study. Quantify project emissions with an LCA or GHG inventory (Lifecycle Studio can do this). Screen climate risks against downscaled projections.",
    src:"IEMA (2022) Assessing GHG emissions and evaluating their significance; IPCC AR6."},
  air:{n:"Air quality & odour",g:"Physical",s:3,
    what:"Concentrations of dust (PM10, PM2.5), NO₂, SO₂, CO, VOCs and odour at homes, schools and sensitive habitats.",
    base:[["PM10 / PM2.5 (24-h and annual)","µg/m³","Gravimetric or BAM monitor; ≥ 3 months, ideally 1 year"],["NO₂","µg/m³","Diffusion tubes, monthly for ≥ 6 months"],["SO₂, CO, VOCs (if relevant)","µg/m³","Continuous analysers or passive samplers"],["Odour complaints / sensitive receptors","—","Receptor survey, complaint records"],["Meteorology (wind rose)","—","Nearest met station, ≥ 1 year"]],
    how:"Map sensitive receptors within ~1 km (dust) and further for stacks. Measure existing levels; compare with WHO 2021 guidelines and national standards; model with AERMOD/ADMS for stacks.",
    src:"WHO (2021) Global Air Quality Guidelines; IAQM (2024) dust guidance; national ambient standards."},
  noise:{n:"Noise & vibration",g:"Physical",s:3,
    what:"Sound and ground vibration at homes, schools, hospitals and wildlife areas.",
    base:[["LAeq day / night at nearest receptors","dB(A)","Class 1 sound meter, ISO 1996; ≥ 24 h per location"],["LA90 background","dB(A)","As above"],["Existing vibration sources","mm/s PPV","Only if piling/blasting near structures"]],
    how:"Measure day and night at the nearest receptors. Compare predicted levels with IFC/WHO limits (55 dB(A) day, 45 dB(A) night at homes) or national limits.",
    src:"IFC (2007) EHS General Guidelines 1.7; WHO (2018) Environmental Noise Guidelines; BS 5228."},
  geology:{n:"Geology, soils & land contamination",g:"Physical",s:2,
    what:"Soil quality, erosion risk, agricultural land value, geological hazards and existing contamination.",
    base:[["Soil type, texture, depth","—","Soil survey, national soil maps"],["Soil chemistry (pH, OC, metals, hydrocarbons)","mg/kg","Grid sampling; ISO 18400"],["Erosion risk (slope, rainfall erosivity)","—","RUSLE, slope map"],["Seismic / landslide hazard","—","Geological survey maps"]],
    how:"Desk review then trial pits and sampling across the footprint. Record contaminated land from past uses.",
    src:"FAO soil classification; national soil guideline values."},
  sw:{n:"Surface water (quality & hydrology)",g:"Physical",s:4,
    what:"Rivers, lakes and drainage: flows, flood regime and water quality used by people and ecosystems.",
    base:[["Flow / discharge (low, mean, flood)","m³/s","Gauge records or flow measurement"],["pH, temperature, DO, conductivity","—","Field meter, monthly"],["BOD, COD, TSS, turbidity","mg/L","APHA Standard Methods; wet and dry season"],["Nutrients (N, P), metals, coliforms","mg/L, CFU","Lab analysis"],["Downstream water users","—","Community and licence survey"]],
    how:"Sample upstream and downstream of each discharge or crossing, in wet and dry seasons (or all four seasons in cold climates). Map flood zones.",
    src:"APHA Standard Methods; national water quality guidelines (e.g. CCME in Canada, NESREA in Nigeria)."},
  gw:{n:"Groundwater",g:"Physical",s:3,

    how:"Survey existing wells, sample representative ones, and install monitoring boreholes up- and down-gradient for waste or storage facilities.",

  landscape:{n:"Landscape & visual amenity",g:"Physical",s:2,
    what:"Landscape character and the views people have from homes, roads and viewpoints.",
    base:[["Landscape character areas","—","Landscape character assessment"],["Zone of theoretical visibility (ZTV)","km²","GIS viewshed from structure heights"],["Representative viewpoints","—","Photographs, fixed viewpoints"],["Night-time lighting baseline","—","Site visit"]],
    how:"Map the ZTV, choose viewpoints with the public, photograph them and prepare photomontages for key views.",
    src:"Landscape Institute & IEMA (2013) GLVIA3."},
  terr:{n:"Terrestrial vegetation & habitats",g:"Biological",s:3,
    what:"Forests, grasslands, farmland habitats and their condition.",
    base:[["Habitat map and areas","ha","Phase 1 habitat survey / remote sensing"],["Vegetation plots (species, cover)","—","Quadrats or transects, growing season"],["Natural vs modified habitat","—","IFC PS6 classification"],["Invasive species","—","Walkover survey"]],
    how:"Map habitats from imagery, verify in the field in the growing season, and classify as modified, natural or critical habitat.",

  fauna:{n:"Wildlife & birds",g:"Biological",s:3,
    what:"Mammals, birds, reptiles, amphibians and insects using the site and its surroundings.",

  wetland:{n:"Wetlands",g:"Biological",s:4,
    what:"Marshes, swamps, peatlands, floodplains and riparian zones and the services they provide.",
    base:[["Wetland extent and type","ha","Delineation (vegetation, soils, hydrology)"],["Hydroperiod","—","Water level loggers"],["Functions (flood storage, filtration, habitat)","—","Wetland function assessment"]],

    how:"Map land use with the community. If any physical or economic displacement is possible, run a census and asset inventory and set a cut-off date.",
    src:"IFC (2012) Performance Standard 5; World Bank ESS5."},
  infra:{n:"Traffic, infrastructure & services",g:"Social & economic",s:2,
    what:"Roads, traffic, water supply, power, health and school services used by communities.",
    base:[["Traffic counts on access roads","veh/day","Classified counts, 7 days"],["Road condition and accident history","—","Road authority, police data"],["Capacity of water, power, health, schools","—","Service provider data"]],
    how:"Count traffic on haul routes, record accident hot spots and ask service providers about spare capacity.",

  health:{n:"Community health, safety & security",g:"Health, culture & rights",s:4,
    what:"Disease, injuries, exposure to pollution, road safety, security forces and emergency risks for nearby people.",
    base:[["Disease burden (water-borne, vector-borne, respiratory, HIV/STI)","—","Health facility records, DHIS2"],["Vulnerable receptors (schools, clinics)","—","Receptor mapping"],["Existing community safety and security issues","—","Interviews, police data"]],
    how:"Gather health statistics and map sensitive receptors; interview health workers and community leaders.",

  work:{n:"Worker health, safety & labour conditions",g:"Health, culture & rights",s:3,
    what:"Occupational safety, working conditions, accommodation and labour rights of the project workforce and contractors.",
    base:[["National labour and OHS law","—","Legal review"],["Contractor OHS capacity","—","Pre-qualification audits"],["Supply-chain labour risks","—","Supplier risk screening"]],
    how:"Review labour law, contractor systems and supply-chain risks (forced or child labour).",
    src:"IFC (2012) Performance Standard 2; ILO core conventions; ISO 45001."},
  indig:{n:"Indigenous peoples & rights",g:"Health, culture & rights",s:5,
    what:"Rights, lands, resources, culture and traditional use of Indigenous peoples and local communities.",
    base:[["Indigenous nations and communities with rights or interests","—","Government records, the nations themselves"],["Traditional land and resource use","—","Traditional knowledge and land-use studies led by the nation"],["Treaty and title considerations","—","Legal review"]],
    how:"Engage early and let each nation lead or co-design studies of its own knowledge and rights. Seek free, prior and informed consent where required.",
    src:"UNDRIP; IFC (2012) PS7; Impact Assessment Act (Canada); BC Declaration on the Rights of Indigenous Peoples Act (2019)."},
  heritage:{n:"Cultural heritage & archaeology",g:"Health, culture & rights",s:4,
    what:"Archaeological sites, historic buildings, graves, shrines and intangible heritage.",
    base:[["Recorded heritage sites","—","Heritage registers"],["Archaeological potential","—","Desk assessment, walkover"],["Sacred and community sites","—","Community mapping"]],
    how:"Search registers, walk the footprint with an archaeologist and community members, and dig test pits in high-potential areas.",
    src:"IFC (2012) PS8; national heritage acts."},
  gender:{n:"Gender & vulnerable groups",g:"Health, culture & rights",s:4,
    what:"Effects on women, youth, elderly, disabled people, the poor and other groups who may be affected differently.",
    base:[["Sex-disaggregated livelihood and employment data","—","Household survey"],["Vulnerable households","no.","Census, social mapping"],["Risks of gender-based violence","—","Specialist assessment, service mapping"]],
    how:"Disaggregate every social survey by sex, age and vulnerability. Hold separate meetings with women and vulnerable groups.",
    src:"World Bank (2020) GBV Good Practice Note; IAIA SIA guidance."}
};

/* ---------- Activity library (by phase) with tags ---------- */

const TAGS = {
  clear:"Vegetation clearing",earth:"Earthworks & excavation",traffic:"Traffic & haulage",emis:"Air emissions (combustion, process)",

/* ---------- Impact pathways: tag → component ----------
   p: pathway text; dir: -1 adverse, +1 beneficial;
   d: default descriptors [magnitude 0–4, extent 1–4, duration 1–4, reversibility 1–3, likelihood 1–5, frequency 1–4, cumulative 1–2, direct 1/0];
   m: suggested mitigation [hierarchy, measure]; mon: [indicator, threshold/standard, frequency]. */
const PW = {
 clear:{
  terr:{p:"Loss and fragmentation of vegetation and habitat in the footprint",d:[3,1,3,2,5,1,2,1],m:[["avoid","Re-align the layout to avoid mature woodland, riparian strips and critical habitat"],["minimise","Clear only the marked footprint; fence no-go areas before work starts"],["restore","Replant temporary work areas with native species within one growing season"],["offset","Offset any residual loss of natural habitat to achieve no net loss"]],mon:["Area cleared vs. approved footprint","≤ approved footprint","Monthly during construction"]},
  fauna:{p:"Loss of breeding and foraging habitat; mortality and disturbance of animals during clearing",d:[3,2,2,2,4,1,2,1],m:[["avoid","Time clearing outside the breeding/nesting season"],["minimise","Pre-clearance sweep by an ecologist; relocate slow-moving animals"],["minimise","Clear towards remaining habitat so animals can escape"]],mon:["Pre-clearance survey records; animal mortalities","Zero mortality of listed species","Before and during clearing"]},
  species:{p:"Direct loss of individuals or habitat of listed species",d:[3,2,4,3,3,1,2,1],m:[["avoid","Buffer zones around known listed-species locations"],["minimise","Species management plan with the wildlife authority"],["offset","Biodiversity offset designed for net gain for affected listed species"]],mon:["Listed-species presence in buffers","No incursions into buffers","Seasonal"]},
  geology:{p:"Exposed soil erodes; loss of topsoil",d:[2,1,2,2,4,2,1,1],m:[["minimise","Strip and stockpile topsoil (≤ 2 m high) for reuse"],["minimise","Erosion and sediment control plan: silt fences, check dams, staged clearing"],["restore","Revegetate exposed slopes promptly"]],mon:["Erosion rills, sediment fence condition","No uncontrolled erosion","Weekly and after heavy rain"]},
  sw:{p:"Sediment-laden runoff raises turbidity and suspended solids in nearby streams",d:[2,2,1,1,4,2,1,0],m:[["minimise","Sediment ponds and silt fences before bulk clearing"],["minimise","Keep a vegetated buffer (≥ 30 m) along watercourses"]],mon:["Turbidity / TSS upstream vs downstream","Increase ≤ 25 mg/L TSS over background (CCME short-term)","Weekly and during rain events"]},
  climate:{p:"Release of carbon stored in vegetation and soils",d:[1,4,4,3,5,1,2,1],m:[["minimise","Minimise cleared area; chip and reuse biomass instead of burning"],["offset","Replant or restore an equivalent carbon stock"]],mon:["Cleared area and biomass fate","As approved","At completion"]},
  landscape:{p:"Removal of screening vegetation changes landscape character",d:[2,2,3,2,4,1,1,1],m:[["minimise","Retain perimeter trees and hedgerows as screening"]],mon:["Retained screening vegetation","As per landscape plan","Annually"]},
  heritage:{p:"Chance finds of buried archaeology or graves disturbed",d:[2,1,4,3,2,1,1,1],m:[["minimise","Chance-finds procedure: stop work, protect and report"],["avoid","Archaeologist watching brief in high-potential areas"]],mon:["Chance finds reported and handled","100% compliance with procedure","During groundworks"]}
 },
 earth:{
  geology:{p:"Soil compaction, erosion and loss of soil structure; disturbance of contaminated ground",d:[2,1,2,2,5,2,1,1],m:[["minimise","Soil management plan; work in dry conditions where possible"],["minimise","Test and segregate any contaminated soil"],["restore","Decompact and reinstate soils after works"]],mon:["Soil stockpile condition; contaminated soil records","As per soil management plan","Weekly"]},
  sw:{p:"Runoff from excavations and stockpiles carries sediment to watercourses",d:[2,2,1,1,4,2,1,0],m:[["minimise","Cover or seed stockpiles; place them ≥ 50 m from watercourses"],["minimise","Settlement ponds for pumped water"]],mon:["Turbidity / TSS at discharge points","Within discharge permit","Daily when discharging"]},
  air:{p:"Dust from excavation, stockpiles and unpaved surfaces at nearby homes",d:[2,2,1,1,4,3,1,1],m:[["minimise","Water spraying of haul roads and stockpiles in dry weather"],["minimise","Cover loads; limit speeds on unpaved roads to 20 km/h"],["minimise","Stop dusty work in high winds"]],mon:["Dust deposition / PM10 at nearest receptors","PM10 ≤ 45 µg/m³ 24-h (WHO 2021) or national limit","Continuous or weekly"]},

<script>
"use strict";
/* ---------- Lessons (Learn mode), guide notes and quizzes per step ---------- */
const LESSON = {
  project:{t:"Describing the project",
    b:`<p>Every EIA starts with a clear description of <b>what will be built, where, how and for how long</b>. Assessors cannot predict effects of activities that are not described.</p>
<ul><li><b>Purpose and need</b>: why the project is proposed. Decision makers weigh effects against this.</li><li><b>Phases</b>: construction, operation, decommissioning, and unplanned events (accidents). Each has different activities.</li><li><b>Activities</b> are the causes of impacts: clearing, excavation, discharges, traffic, jobs. Break the project into activities small enough to link to specific effects.</li><li><b>Legal framework</b>: the law decides whether an EIA is needed, what the report must contain, and who decides.</li></ul>`,
    tip:"A common failure in real EIAs is a vague project description (\"a treatment plant will be built\"). Give capacities, footprints, schedules, workforce numbers and inputs/outputs."},
  screen:{t:"Screening: does this project need an EIA?",
    b:`<p><b>Screening</b> decides whether a full EIA, a limited one, or none is needed. Two approaches are combined in most laws:</p>
<ul><li><b>Lists and thresholds</b> (e.g. EU Annex I, Nigeria's Mandatory Study List, Canada's Project List): above a size, an EIA is automatic.</li><li><b>Case-by-case criteria</b> (EU Annex III): the characteristics of the project, the sensitivity of the location and the nature of the likely effects.</li></ul>
<p>The outcome is recorded as a <b>screening decision</b> with reasons. Lenders use categories (IFC A/B/C; World Bank High to Low risk).</p>`,
    tip:"Sensitivity of location matters as much as size. A small project next to a wetland used for drinking water may need a full EIA."},
  scope:{t:"Scoping: focus on what matters",
    b:`<p><b>Scoping</b> identifies which effects are likely to be significant and must be studied in depth, and which can be <b>scoped out</b> with a reason.</p>
<ul><li><b>Valued components (VCs)</b>, also called receptors: parts of the environment people care about, such as air, fish, groundwater, livelihoods and heritage.</li><li>An <b>interaction matrix</b> (after Leopold, 1971) crosses activities with components. Each ticked cell is a potential impact pathway.</li><li><b>Boundaries</b>: spatial (study areas per component) and temporal (which years and seasons).</li><li>Scoping should involve the public, Indigenous nations and authorities, and ends with <b>terms of reference</b>.</li></ul>`,
    tip:"Scope in by default when unsure; scope out only with evidence and a written reason."},
  base:{t:"Baseline: the environment without the project",
    b:`<p>The <b>baseline</b> describes each scoped-in component now, and how it would change without the project (the <b>future baseline</b>). Impacts are measured against it.</p>
<ul><li>Start with a <b>desk study</b> (existing data, maps, records), then <b>field surveys</b> where gaps remain.</li><li>Capture <b>seasonality</b>: wet/dry seasons, breeding and migration seasons, winter low flows.</li><li>Use standard methods so results can be repeated for monitoring.</li><li>Rate each component's <b>value / sensitivity</b>: how important it is and how easily it absorbs change.</li></ul>`,
    tip:"Baseline surveys drive the EIA schedule. Plan them early; one year of seasonal data is common for ecology and water."},
  impacts:{t:"Predicting impacts and judging significance",
    b:`<p>For each interaction, <b>predict</b> the change (qualitatively, or with models: dispersion, noise propagation, hydrological, habitat loss in hectares) and then <b>evaluate</b> its significance.</p>
<ul><li>Describe each impact by <b>nature</b> (adverse/beneficial), <b>magnitude</b>, <b>extent</b>, <b>duration</b>, <b>reversibility</b>, <b>likelihood</b>, <b>frequency</b> and whether it is <b>direct or cumulative</b>.</li><li>Significance combines these with the <b>value/sensitivity</b> of the receptor. Methods differ; the key is to state the criteria and apply them consistently.</li><li>Rate <b>before</b> mitigation here; residual effects come after mitigation.</li></ul>
<p>This tool lets you rate once in plain terms and see the result under six established methods.</p>`,
    tip:"Significance is a judgement, not only a number. Always write one sentence explaining why."},
  mitig:{t:"Mitigation and residual effects",
    b:`<p>Apply the <b>mitigation hierarchy</b> in order:</p>
<ol><li><b>Avoid</b>: change the design, site or timing so the effect does not occur.</li><li><b>Minimise</b>: reduce duration, intensity or extent.</li><li><b>Restore</b>: rehabilitate affected areas.</li><li><b>Offset</b>: compensate for what remains (e.g. biodiversity offsets for no net loss).</li></ol>
<p>Then re-rate the <b>residual effect</b>. Beneficial effects can be <b>enhanced</b>. Every measure needs an owner, timing and cost so it can go into the ESMP.</p>`,
    tip:"Mitigation must be specific and enforceable. \"Best practice will be followed\" is not a measure."},
  cumalt:{t:"Cumulative effects and alternatives",
    b:`<p><b>Cumulative effects</b> result from the project combined with other past, present and reasonably foreseeable projects on the same component (e.g. several discharges to one river).</p>
<ul><li>Focus on components where the project has a residual effect.</li><li>Define a wider study area and time frame for each.</li></ul>
<p><b>Alternatives</b>: most laws require an outline of reasonable alternatives considered (sites, technologies, layouts, scale, timing) and the <b>no-project</b> option, with the reasons for the choice. A weighted multi-criteria comparison makes the reasoning transparent.</p>`,
    tip:"The strongest EIAs show that alternatives shaped the design, not that they were written up afterwards to justify it."},
  engage:{t:"Public participation and engagement",
    b:`<p>Engagement improves the EIA and is a legal requirement almost everywhere.</p>
<ul><li>Identify stakeholders: affected communities, Indigenous nations, authorities, NGOs, businesses, vulnerable groups.</li><li>Map them by <b>interest</b> and <b>influence</b> to plan how to engage each.</li><li>Record every issue raised and <b>how the EIA responded</b>.</li><li>Set up a <b>grievance mechanism</b> that works in local languages.</li><li>Where Indigenous rights are affected, follow the applicable duty to consult and FPIC standards.</li></ul>`,
    tip:"Engage before decisions are fixed. Consultation on a finished report is disclosure, not participation."},
  esmp:{t:"Environmental and social management plan (ESMP)",
    b:`<p>The <b>ESMP</b> turns commitments into action. For each impact it lists the mitigation measures, who does them, when, what they cost, and how success is <b>monitored</b>: indicator, threshold or standard, location and frequency.</p>
<ul><li>Monitoring checks <b>compliance</b> (were measures done?) and <b>effects</b> (did predictions hold?).</li><li>Include <b>adaptive management</b>: what happens if a threshold is exceeded.</li><li>The ESMP usually becomes a condition of the approval.</li></ul>`,
    tip:"A monitoring indicator without a threshold cannot trigger action."},
  report:{t:"Review, report and decision",
    b:`<p>The <b>Environmental Impact Statement</b> (also EIS, ES, EIAR or ESIA) presents the whole assessment. It must include a <b>non-technical summary</b> for the public.</p>
<p>Authorities and independent reviewers check quality. The review criteria here follow the widely used Lee & Colley review package: project and baseline, impacts, alternatives and mitigation, communication. After approval, <b>follow-up</b> (monitoring, auditing, adaptive management) closes the loop.</p>`,
    tip:"Write the non-technical summary last and test it on someone outside the project."}
};

LESSON.impacts.b+=`<p class="small"><b>Research evidence.</b> A review of ten recent environmental impact statements in British Columbia found a median of 281 impacts per statement, but significant findings were very rare. Thresholds were used for only about 10% of valued components, and 31 predicted threshold exceedances (66%) were all argued down to “not significant”. The reasons given were scale, an already-exceeded baseline, model uncertainty, or swapping in a weaker threshold (Murray et al., 2018). The lesson: state your thresholds, and do not reason exceedances away.</p>`;
LESSON.esmp.b+=`<p class="small"><b>Research evidence.</b> Twelve oil and gas projects in Bayelsa and Rivers States scored an average of only 46.3% against 18 follow-up best-practice indicators. Half were “inadequate” and none were “excellent” (Hemba & Phil-Eze, 2021). An ESMP only protects the environment if someone checks that it is carried out.</p>`;

 {id:"kolo",doc:true,ft:true,n:"Kolo Creek trunk line replacement and Niger Delta EMP follow-up",cat:"Pipelines",region:"Nigeria",jur:"ng",org:"Shell Petroleum Development Company (SPDC)",
  src:{t:"Peer-reviewed article",y:2021,scopus:true,cite:"Hemba, S. & Phil-Eze, P.O. (2021). Implementation of EMP in EIA Follow-Up of Oil and Gas Projects in the Niger Delta Region of Nigeria: A Case of Bayelsa and Rivers States. Environmental Research, Engineering and Management, 77(1), 96–108.",url:"https://doi.org/10.5755/j01.erem.77.1.23960"},

 {id:"beijing",doc:true,ft:true,n:"New Beijing (Daxing) Airport: public participation",cat:"Ports & transport",region:"East Asia",jur:"generic",org:"Capital Airports Holding",
  src:{t:"Peer-reviewed article",y:2017,scopus:true,cite:"Brombal, D., Moriggi, A. & Marcomini, A. (2017). Evaluating public participation in Chinese EIA. An integrated Public Participation Index and its application to the case of the New Beijing Airport. Environmental Impact Assessment Review, 62, 49–60.",url:"https://doi.org/10.1016/j.eiar.2016.07.001"},
  note:"Full text read. EIA by Beijing Guohuan Tiandi Environmental Technological Development Center, submitted to the Ministry of Environmental Protection in April 2014 and approved in June 2014; construction started December 2014.",
  loc:"Southern Daxing District, Beijing, on the border with Hebei Province, 46 km south of downtown Beijing, China",
  desc:"New international airport on 30.32 km², designed to handle 70 million passengers a year by 2025. Estimated investment RMB 86 billion, of which RMB 4.5 billion is for environmental protection. Construction reroutes the Tiantang River and takes 9 water wells.",
  need:"Airport capacity for Beijing.",cap:"70 million passengers/yr by 2025",sched:"Construction from December 2014",area:"30.32 km²",cost:"RMB 86 billion",
  facts:["At least 52 villages (~20,000 people) relocated","Consultation lasted 27 days; 7,956 individuals and 562 organisations surveyed, but women were only 21% of the sample","Public participation filled 23 of the EIA report's 586 pages"],
  found:["Noise is the main impact: 11 villages above 80 dB (to be relocated), 24 villages at 70–80 dB (insulation), 23 schools above 70 dB, and 7 schools and 1 hospital above 75 dB.","Air quality already exceeded national standards; added aircraft emissions were judged not significant.","Public Participation Index 0.429: participation was ‘instrumental’, aimed at a smooth approval rather than influence.","Participation started after the assessment was under way; no project alternatives were offered; NGOs, independent experts and vulnerable groups were not specifically consulted.","The report highlighted over 99% support while giving little space to concerns about relocation, compensation and noise mitigation."],
  a:[{n:"Land acquisition and relocation of 52 villages",ph:"C",tags:["land","influx"]},"clear","earth",{n:"Rerouting of the Tiantang River",ph:"C",tags:["inwater","drain"]},"ctraffic","workforce",{n:"Aircraft operations",ph:"O",tags:["noise","emis","ghg"]},{n:"Fuel depots",ph:"O",tags:["haz"]},{n:"Airport presence and water-well loss",ph:"O",tags:["land","abstr"]},"ojobs",{n:"Fuel leak or explosion",ph:"U",tags:["accident","haz"]}],
