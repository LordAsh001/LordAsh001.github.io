  --g0:#929a10; --g1:#0c9690; --g2:#d95926; --g3:#3987e5; --g4:#d55181; --g5:#9085e9; --g6:#b38a00;
  --bar:#5cb377; --bar2:#2f5c3c; --loss:#f07b5c; color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand .sub{font-size:12px;color:var(--muted)}
.mark{width:28px;height:28px;flex:none}
nav.views{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.views a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:8px}
nav.views a:hover{background:var(--chip);color:var(--ink)}
nav.views a[aria-current="page"]{background:var(--ink);color:var(--panel)}
main{min-height:0;position:relative}
.view{height:100%;overflow:auto}
.view[hidden]{display:none!important}
#v-map{display:grid;grid-template-columns:minmax(300px,370px) 1fr;overflow:hidden}
aside.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.filters{padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative;display:block}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;cursor:pointer;user-select:none}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=text],input[type=date],input[type=url],textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.resbar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);gap:8px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
.listwrap{overflow:auto;flex:1;min-height:0}
ul.list{list-style:none;margin:0;padding:0}
ul.list li button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 16px;cursor:pointer}
ul.list li button:hover,ul.list li button.on{background:var(--chip)}
.li-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--c)}
.li-name{font-weight:600;font-size:13.5px;line-height:1.3}
.li-meta{font-size:12px;color:var(--muted)}
.li-tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:2px;text-align:right}
.lv{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px;color:var(--muted)}
.lv.A{color:var(--good);border-color:currentColor}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.more{display:block;margin:12px auto 18px}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.maptools{position:absolute;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 70px)}
.seg{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.note{max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;bottom:22px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);font-size:11.5px;display:grid;grid-template-columns:auto auto;gap:3px 14px;max-width:calc(100% - 24px)}
.legend .t,.legend .sm{grid-column:1/-1}
.legend .t{font-family:var(--f-display);font-weight:700;font-size:13px;margin-bottom:2px}
.legend .k{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend .sm{font-size:11px;color:var(--muted);margin-top:4px;max-width:300px}
.leaflet-tooltip.tip{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--f-body);font-size:12px;padding:4px 8px;border-radius:6px}
.leaflet-tooltip.tip:before{display:none}
.st-label{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land);pointer-events:none}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;max-width:70%}
.leaflet-control-attribution a{color:var(--accent)!important}
/* profile sheet */
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:1050;display:flex;flex-direction:column;transition:transform .25s ease}
.sheet[hidden]{display:flex!important;transform:translateX(105%);visibility:hidden}
.sheet-h{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}
.sheet-h h2{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.12;margin:4px 0 0;text-wrap:balance}
.sheet-h .alt{font-size:12px;color:var(--muted);margin-top:4px}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.x{background:var(--chip);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sheet-b{overflow:auto;padding:14px 18px 28px;display:flex;flex-direction:column;gap:16px}
.sheet-b>*{flex-shrink:0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.fact{background:var(--panel);padding:8px 10px;min-width:0}
.fact dt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fact dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact.w{grid-column:1/-1}
.mono{font-family:var(--f-mono);font-size:12.5px}
.desigs{display:flex;flex-wrap:wrap;gap:6px}
.desigs span{font-size:11px;font-weight:600;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.sec h3{font-family:var(--f-display);font-size:14.5px;font-weight:700;margin:0 0 4px}
.sec p{margin:0;max-width:65ch}
.verif{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.verif b.lvl{font-family:var(--f-display);font-size:24px;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--muted);color:var(--muted)}
.verif b.lvl.A{border-color:var(--good);color:var(--good)}
.verif b.lvl.B{border-color:var(--accent);color:var(--accent)}
.verif b.lvl.D{border-color:var(--warn);color:var(--warn)}
.verif div{font-size:12.5px}
.photo{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.photo img{display:block;width:100%;height:220px;object-fit:cover}
.photo figcaption{font-size:11.5px;color:var(--muted);padding:6px 10px}
.photo.off{padding:10px 12px;font-size:12.5px}
.galrow{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto}
.galrow button{flex:0 0 64px;height:48px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--panel);cursor:pointer;opacity:.7}
.galrow button.on,.galrow button:hover{border-color:var(--accent,#007a4d);opacity:1}
.galrow button img{width:100%;height:100%;object-fit:cover;display:block}
.box.unesco{border-color:color-mix(in srgb,#2a78d6 45%,var(--line));background:color-mix(in srgb,#2a78d6 7%,var(--bg))}
.box.unesco h3{color:#2a78d6}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.box h3{font-family:var(--f-display);font-size:14.5px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h3 small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.box dl{margin:0;display:grid;gap:6px}
.box dt{font-weight:600;font-size:12px}
.box dd{margin:0;font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kv b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.kv span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.splist{list-style:none;margin:0;padding:0;font-size:12.5px;display:grid;gap:3px}
.splist li{display:flex;justify-content:space-between;gap:8px}
.splist i{color:var(--ink)}
.iucn{font-family:var(--f-mono);font-size:10px;font-weight:600;border-radius:3px;padding:0 4px;color:#fff}
.iucn.CR{background:#b3261e}.iucn.EN{background:#c2560c}.iucn.VU{background:#9a7b00}.iucn.NT{background:#5c6e2e}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs a{display:block;text-decoration:none;color:var(--muted);font-size:10.5px;line-height:1.25}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:var(--chip)}
.zone .zt{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.zone h4{font-family:var(--f-display);margin:2px 0 6px;font-size:15px}
.zone{border-style:dashed}
.gap{font-size:12.5px;color:var(--warn);border-left:3px solid var(--warn);padding:2px 0 2px 10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.links a:hover{border-color:var(--accent)}
.srcs{font-size:12px;margin:0;padding-left:18px;color:var(--muted);overflow-wrap:anywhere}
.cite{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px}
.wx div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 2px}
.wx b{display:block;font-size:12.5px;font-variant-numeric:tabular-nums}
.loading{color:var(--muted);font-size:12.5px}
/* page views */
.page{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
.page h2.title{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,38px);margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
.page .lede{color:var(--muted);max-width:72ch;margin:0 0 20px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px}
.kpi{background:var(--panel);padding:14px 16px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi small{display:block;font-size:10.5px;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:11.5px;color:var(--muted)}
.card .foot .acts{display:flex;gap:6px}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lab{fill:var(--ink)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.vtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.tbl-wrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line)}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tbody tr.click{cursor:pointer}
table.dt tbody tr.click:hover{background:var(--chip)}
.commit{display:grid;gap:10px}
.commit div{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.commit b{display:block}
.commit span{font-size:13px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vcard .ph{height:150px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,var(--panel)));position:relative}
.vcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .ph .ready{position:absolute;left:10px;top:10px}
.vcard .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.vcard h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.vcard .meta{font-size:12.5px;color:var(--muted)}
.vcard p{margin:0;font-size:13px}
.vcard .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.ready{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.ready.Established{color:var(--good);border-color:currentColor}
.ready.Limited,.ready.Closed{color:var(--bad);border-color:currentColor}
.safety{font-size:12px;color:var(--bad)}
.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filterbar>div{min-width:160px;flex:1;max-width:260px}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;font-weight:600}
textarea{min-height:90px;resize:vertical}
.feed{display:grid;gap:10px}
.rep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.rep .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.rep b{font-size:14px;color:var(--ink)}
.rep p{margin:6px 0 0;font-size:13px}
.typechip{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--chip);border-radius:4px;padding:1px 6px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;z-index:2000;font-size:13px;box-shadow:var(--shadow)}
.srctbl td:first-child{font-weight:600}
.prose p,.prose li{max-width:75ch}
.prose h3{font-family:var(--f-display);font-size:18px;margin:22px 0 6px}
.gaplist{font-size:12.5px}
.gaplist b{display:block;margin-top:6px}
.legbtn{display:none}
@media (max-width:860px){
  html,body{height:auto}
  .app{display:block}
  .view{height:auto;overflow:visible}
  #v-map{display:flex;flex-direction:column}
  .mapwrap{height:62vh;min-height:360px;order:1}
  aside.rail{order:2;border-right:0;border-top:1px solid var(--line)}
  .listwrap{overflow:visible}
  nav.views{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .sheet{position:fixed;top:auto;left:0;right:0;bottom:0;width:100%;height:80vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet[hidden]{transform:translateY(105%)}
  .legend{display:none}
  .legend.open{display:grid}
  .legbtn{display:inline-block}
  .form .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
/* decorative forest backdrop: static, low contrast, behind content; off for high-contrast / reduced-transparency / forced colours, or by the header switch */
.forestbg{position:fixed;left:0;right:0;bottom:0;height:min(46vh,440px);z-index:0;pointer-events:none;color:var(--forest);opacity:var(--forest-op)}
.forestbg svg{width:100%;height:100%;display:block}
:root{--forest:#1d6b3c;--forest-op:.075}
:root[data-theme="dark"]{--forest:#6fbf8a;--forest-op:.085}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--forest:#6fbf8a;--forest-op:.085}}
.app{position:relative;z-index:1}
#v-map{position:relative}
html.nobg .forestbg{display:none}
@media (prefers-contrast:more),(forced-colors:active),(prefers-reduced-transparency:reduce){.forestbg{display:none}}
@media print{.forestbg{display:none}}
header.top{background:color-mix(in srgb,var(--panel) 90%,transparent)}
aside.rail{background:color-mix(in srgb,var(--panel) 93%,transparent)}

    const list=Object.values(sp).sort((a,b)=>({CR:0,EN:1,VU:2,NT:3}[a.iu]??9)-({CR:0,EN:1,VU:2,NT:3}[b.iu]??9)||b.c-a.c).slice(0,14);

  }catch(e){$('#bio-live').innerHTML='<p class="loading" style="margin:0">GBIF did not respond. Try the link below.</p>'}})();
  if(f.la!=null)(async()=>{try{
    const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${f.la}&longitude=${f.lo}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Africa%2FLagos`);

    $('#wx').className='wx';$('#wx').innerHTML=d.time.map((t,i)=>`<div><span>${new Date(t).toLocaleDateString('en-GB',{weekday:'short'})}</span><b>${Math.round(d.temperature_2m_max[i])}°</b><span>${Math.round(d.temperature_2m_min[i])}°</span><br><span title="Chance of rain">${d.precipitation_probability_max[i]??'–'}% ☂</span></div>`).join('');
  }catch(e){$('#wx').textContent='Forecast unavailable.'}})();
  if(b)(async()=>{try{
    const [inat,com]=await Promise.allSettled([
      jget(`https://api.inaturalist.org/v1/observations/species_counts?swlat=${b[1]}&swlng=${b[0]}&nelat=${b[3]}&nelng=${b[2]}&quality_grade=research&per_page=8`),
      f.la!=null?jget(`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${f.la}|${f.lo}&ggsradius=10000&ggsnamespace=6&ggslimit=12&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=320&format=json&origin=*`):Promise.reject()]);
    if(state.sel!==me)return;let h='';
    if(inat.status==='fulfilled'&&inat.value.results.length){h+=`<div class="box"><h3>Species photographed here <small>iNaturalist research-grade</small></h3><div class="thumbs">${inat.value.results.filter(r=>r.taxon.default_photo).map(r=>`<a href="https://www.inaturalist.org/taxa/${r.taxon.id}" target="_blank" rel="noopener" title="${esc(r.taxon.default_photo.attribution)}"><img src="${esc(r.taxon.default_photo.square_url.replace('square','small'))}" alt="${esc(r.taxon.preferred_common_name||r.taxon.name)}" loading="lazy" onerror="this.style.visibility='hidden'">${esc(r.taxon.preferred_common_name||r.taxon.name)}</a>`).join('')}</div><p style="margin:6px 0 0;font-size:11px;color:var(--muted)">Photos © their observers on iNaturalist; hover for licence.</p></div>`}
    if(com.status==='fulfilled'&&com.value.query){const pics=Object.values(com.value.query.pages).filter(p=>p.imageinfo&&/\.(jpe?g|png)$/i.test(p.title)&&!/ISS0|Earth|map|Map|svg|flag/.test(p.title)).slice(0,8);
      if(pics.length)h+=`<div class="box"><h3>Photos taken nearby <small>Wikimedia Commons, within 10 km</small></h3><div class="thumbs">${pics.map(p=>{const i=p.imageinfo[0],m=i.extmetadata||{};const by=(m.Artist?m.Artist.value:'').replace(/<[^>]+>/g,'').trim();return`<a href="${esc(i.descriptionurl)}" target="_blank" rel="noopener" title="${esc(by)} · ${esc(m.LicenseShortName?m.LicenseShortName.value:'')}"><img src="${esc(i.thumburl)}" alt="${esc(p.title.slice(5))}" loading="lazy" onerror="this.style.visibility='hidden'">${esc(p.title.slice(5,40).replace(/\.\w+$/,''))}</a>`}).join('')}</div></div>`}
    $('#photos-live').innerHTML=h;
  }catch(e){}})();
}

/* ---------- charts ---------- */
let tipEl=null;
function tip(el,html,x,y){if(!tipEl){tipEl=document.createElement('div');tipEl.className='vtip'}el.appendChild(tipEl);tipEl.innerHTML=html;tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.hidden=false}
function hideTip(){if(tipEl)tipEl.hidden=true}
function hbar(el,rows,o={}){
  const W=560,lw=o.lw||140,rh=o.rh||20,H=rows.length*rh+8,max=Math.max(...rows.map(r=>r.v))||1,iw=W-lw-58;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">${rows.map((r,i)=>{const w=Math.max(1,r.v/max*iw),y=i*rh+4;return`<g data-i="${i}" ${r.id?`style="cursor:pointer"`:''}><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lw-8}" y="${y+rh/2+2}" text-anchor="end" class="lab">${esc(r.l)}</text><rect x="${lw}" y="${y+3}" width="${w}" height="${rh-8}" rx="3" fill="${r.c||'var(--bar)'}"/><text x="${lw+w+5}" y="${y+rh/2+2}">${o.f?o.f(r.v):fmt.format(r.v)}</text></g>`}).join('')}</svg>`;
  el.querySelectorAll('g[data-i]').forEach(g=>{const r=rows[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(r.l)}</b> · ${o.f?o.f(r.v):fmt.format(r.v)}${r.t?'<br>'+r.t:''}`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip;if(r.on)g.onclick=r.on});
}
function cols(el,pts,o={}){
  const W=560,H=220,pl=46,pb=24,pt=10,iw=W-pl-10,ih=H-pb-pt,max=o.max||Math.max(...pts.map(p=>p.v))*1.08,bw=iw/pts.length;
  const ticks=niceTicks(0,max,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  ticks.forEach(t=>{const y=pt+ih-t/max*ih;s+=`<line class="gridl" x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${o.tf?o.tf(t):fmt.format(t)}</text>`});
  pts.forEach((p,i)=>{const h=p.v/max*ih,x=pl+i*bw;s+=`<g data-i="${i}"><rect x="${x}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/><rect x="${x+bw*.15}" y="${pt+ih-h}" width="${bw*.7}" height="${Math.max(0,h)}" rx="2" fill="${p.c||o.c||'var(--bar)'}"/></g>`;
    if(pts.length<=12||i%Math.ceil(pts.length/8)===0||i===pts.length-1)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(p.l)}</text>`});
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('g[data-i]').forEach(g=>{const p=pts[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(p.l)}</b> · ${o.f?o.f(p.v):fmt.format(p.v)}`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip});
}
function line(el,pts,o={}){
  const W=560,H=220,pl=52,pb=24,pt=12,iw=W-pl-16,ih=H-pb-pt;const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  const lo=o.min??0,hi=o.max??Math.max(...pts.map(p=>p.v))*1.08;const X=x=>pl+(x-x0)/(x1-x0||1)*iw,Y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  niceTicks(lo,hi,4).forEach(t=>{s+=`<line class="gridl" x1="${pl}" x2="${W-16}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):fmt.format(t)}</text>`});
  pts.forEach(p=>{s+=`<text x="${X(p.x)}" y="${H-6}" text-anchor="middle">${p.x}</text>`});
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.x)+' '+Y(p.v)).join(' ');
  s+=`<path d="${d} L${X(x1)} ${Y(lo)} L${X(x0)} ${Y(lo)} Z" fill="var(--bar)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--bar)" stroke-width="2"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="var(--bar)" stroke="var(--panel)" stroke-width="2" data-i="${i}"/>`});
  const l=pts[pts.length-1];s+=`<text x="${X(l.x)-8}" y="${Y(l.v)-10}" text-anchor="end" class="lab">${o.f?o.f(l.v):fmt.format(l.v)}</text>`;
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('circle[data-i]').forEach(c=>{const p=pts[+c.dataset.i];c.style.cursor='default';c.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${p.x}</b> · ${o.f?o.f(p.v):fmt.format(p.v)}`,e.clientX-bb.left,e.clientY-bb.top)};c.onmouseleave=hideTip});
}
function niceTicks(lo,hi,n){const span=hi-lo,step0=span/n,mag=10**Math.floor(Math.log10(step0)),st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out}
function card(o){
  const id='ch'+Math.random().toString(36).slice(2,8);
  return{html:`<article class="card" id="${id}"><div><h3>${o.t}</h3>${o.s?`<div class="sub">${o.s}</div>`:''}</div><div class="chart"></div><div class="tbl-wrap" hidden></div><div class="foot"><span>Source: ${o.src}</span><span class="acts"><button class="btn sm" data-a="tbl" type="button">Table</button><button class="btn sm" data-a="csv" type="button">CSV</button><button class="btn sm" data-a="cite" type="button">Cite</button></span></div></article>`,
    mount(){const el=$('#'+id);o.draw(el.querySelector('.chart'));const tw=el.querySelector('.tbl-wrap');
      el.querySelector('[data-a=tbl]').onclick=e=>{tw.hidden=!tw.hidden;e.target.textContent=tw.hidden?'Table':'Chart only';if(!tw.innerHTML){const r=o.rows();const k=Object.keys(r[0]||{});tw.innerHTML=`<table class="dt"><thead><tr>${k.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${k.map(c=>`<td class="${typeof x[c]==='number'?'n':''}">${typeof x[c]==='number'?fmt1.format(x[c]):esc(x[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}};
      el.querySelector('[data-a=csv]').onclick=()=>saveFile(o.file+'.csv',toCSV(o.rows()),'text/csv');
      el.querySelector('[data-a=cite]').onclick=()=>copy(`${o.t.replace(/<[^>]+>/g,'')}. ${o.src.replace(/<[^>]+>/g,'')}. In: Nigeria Forest Reserves Atlas (2026), version ${DATA.meta.version}. ${CONFIG.siteUrl}#stats (accessed ${today}).`)}};
}

/* ---------- statistics view ---------- */
function buildStats(){
  const NS=DATA.ns||{series:[],figures:[],commitments:[]};const S=id=>(NS.series||[]).find(s=>s.id===id);
  const fr=F.filter(f=>f.c===4),frArea=fr.reduce((a,f)=>a+(f.a||0),0)/100;
  const fra=S('fra2025_forest_area'),loss=S('gfw_tree_cover_loss'),pct=S('fra2025_forest_pct_land'),pa=S('wdpa_terrestrial_pa_pct');
  const lossTot=loss?loss.data.reduce((a,d)=>a+d[1],0):0;const last=a=>a&&a.data[a.data.length-1];
  const kp=[[fmt.format(F.length),'protected and reserved sites in this atlas','Compiled from WDPA and cited sources'],[fmt.format(fr.length),'forest reserves','WDPA, FAO 1998 and state lists'],[fmt.format(Math.round(frArea)),'km² of forest reserve inside mapped boundaries','Calculated from WDPA polygons'],
    fra?[fmt.format(Math.round(last(fra)[1]/1000*10)/10)+' M ha','forest area in '+last(fra)[0],'FAO FRA 2025 (SDG 15.1.1)']:null,

  const byState=STATES.map(s=>{const fs=F.filter(f=>f.st.includes(s)),st=DATA.st.find(x=>x.n===s);const frkm=fs.filter(f=>f.c===4).reduce((a,f)=>a+(f.a||0)/100,0);return{s,n:fs.length,fr:fs.filter(f=>f.c===4).length,frkm,pct:st?frkm/st.km2*100:0,doc:fs.filter(f=>'AB'.includes(f.v)).length,land:st?st.km2:0}});

  if(loss)cards.push(card({t:'Annual tree cover loss',s:'Hectares per year, all tree cover above 30% canopy density.',src:`<a href="${esc(loss.url)}" target="_blank" rel="noopener">${esc(loss.source)}</a>`,file:'tree_cover_loss_gfw',
    draw:el=>cols(el,loss.data.map(d=>({l:String(d[0]),v:d[1]})),{c:'var(--loss)',f:v=>fmt.format(Math.round(v))+' ha',tf:v=>fmt.format(v/1000)+'k'}),rows:()=>loss.data.map(d=>({year:d[0],tree_cover_loss_ha:d[1]}))}));
  const sb=[...byState].sort((a,b)=>b.n-a.n);

  const sp=[...byState].sort((a,b)=>b.pct-a.pct);
  cards.push(card({t:'Share of each state’s land inside forest reserves',s:'Mapped forest-reserve area as % of state land area (boundaries from WDPA and geoBoundaries).',src:'Calculated from WDPA polygons and geoBoundaries ADM1',file:'forest_reserve_share_by_state',
    draw:el=>hbar(el,sp.map(r=>({l:r.s,v:+r.pct.toFixed(1),t:`${fmt.format(Math.round(r.frkm))} of ${fmt.format(r.land)} km²`})),{rh:17,f:v=>fmt1.format(v)+'%'}),rows:()=>sp.map(r=>({state:r.s,forest_reserve_km2:Math.round(r.frkm),state_land_km2:r.land,share_pct:+r.pct.toFixed(2)}))}));
  const gcount=GROUPS.map((g,i)=>({l:g,v:F.filter(f=>f.gp===i).length,c:`var(--g${i})`}));

  const bins=[[0,1],[1,5],[5,10],[10,50],[50,100],[100,500],[500,1000],[1000,1e9]];const blab=['<1','1–5','5–10','10–50','50–100','100–500','500–1,000','>1,000'];
  const hist=bins.map((b,i)=>({l:blab[i],v:fr.filter(f=>f.a&&f.a/100>=b[0]&&f.a/100<b[1]).length}));
  cards.push(card({t:'How big are Nigeria’s forest reserves?',s:'Number of forest reserves by mapped area (km²). Most are small; a few dozen hold most of the area.',src:'Calculated from WDPA polygons',file:'forest_reserve_size_distribution',draw:el=>cols(el,hist,{}),rows:()=>hist.map(r=>({area_km2:r.l,forest_reserves:r.v}))}));

  cards.push(card({t:'When sites were gazetted or designated',s:`Sites with a recorded year (${fmt.format(F.filter(f=>f.y).length)} of ${fmt.format(F.length)}), by decade.`,src:'WDPA status year and cited sources',file:'gazettement_by_decade',draw:el=>cols(el,dpts,{}),rows:()=>dpts.map(r=>({decade:r.l,sites:r.v}))}));

  cards.push(card({t:'Sites by ecological zone',s:'Zone inferred from each site’s location.',src:'Atlas zoning from latitude, longitude and highland blocks',file:'sites_by_zone',draw:el=>hbar(el,zr.map(r=>({l:r.l,v:r.v,t:`${fmt.format(r.a)} km² mapped`})),{lw:170}),rows:()=>zr.map(r=>({zone:r.l,sites:r.v,mapped_area_km2:r.a}))}));
  const top=F.filter(f=>f.gb&&f.gb[0]).sort((a,b)=>b.gb[1]-a.gb[1]).slice(0,15);
  cards.push(card({t:'Best-recorded sites for biodiversity',s:'Distinct species with GBIF occurrence records inside each site’s bounding box. Shows where field data exist, not where diversity is highest.',src:`<a href="https://www.gbif.org" target="_blank" rel="noopener">GBIF.org</a> occurrence API, snapshot ${esc(DATA.meta.gbif_snapshot||'')}`,file:'gbif_species_by_site',
    draw:el=>hbar(el,top.map(f=>({l:f.n.length>26?f.n.slice(0,25)+'…':f.n,v:f.gb[1],t:`${fmt.format(f.gb[0])} records`,c:`var(--g${f.gp})`,on:()=>goSite(f.i)})),{lw:190}),rows:()=>top.map(f=>({site:f.n,state:f.s,gbif_records:f.gb[0],species:f.gb[1],CR_records:f.gb[2],EN_records:f.gb[3],VU_records:f.gb[4]}))}));

  const figs=(NS.figures||[]).filter(x=>!/\[secondary\]/i.test(x.source||''));
  $('#stats').innerHTML=`<h2 class="title">Nigeria’s forests in numbers</h2><p class="lede">Headline indicators for researchers, agencies and journalists. Every chart names its source and can be shown as a table, downloaded as CSV or copied as a citation. Site counts and areas come from this atlas; national indicators come from FAO, UN SDG and Global Forest Watch releases.</p>
  <div class="kpis">${kp.map(([v,l,s])=>`<div class="kpi"><b>${v}</b><span>${l}</span><small>${s}</small></div>`).join('')}</div>

/* ---------- land change: forest loss, desertification, land cover ---------- */
let CHG=/*CHG*/null,chgP=null;

function dzState(n){const s=CHG&&CHG.dz.st[n];if(!s||!s.p)return null;const P=s.p,E=s.pet;const py0=CHG.dz.p0,ey0=CHG.dz.e0;

function lcState(n){const s=CHG&&CHG.lc.st[n];if(!s)return null;return s}
function lcNational(){const out=LC_YEARS.map(()=>LC_CLS.map(()=>0));let tot=0;DATA.st.forEach(st=>{const s=CHG.lc.st[st.n];if(!s)return;tot+=st.km2;s.forEach((row,yi)=>row.slice(0,LC_CLS.length).forEach((v,ci)=>out[yi][ci]+=v/1000*st.km2))});return out.map(r=>r.map(v=>v/tot*100))}
/* charts */
function mline(el,years,series,o={}){
  const W=560,H=230,pl=46,pb=24,pt=10,iw=W-pl-14,ih=H-pb-pt;const all=series.flatMap(s=>s.v.filter(v=>v!=null));const lo=o.min??Math.min(0,...all),hi=o.max??Math.max(...all)*1.1;

  niceTicks(lo,hi,4).forEach(t=>{s+=`<line class="gridl" x1="${pl}" x2="${W-14}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):fmt.format(t)}</text>`});

}
function stack100(el,labels,rows,o={}){/* rows[i] = array of {n,c,v} (percent) */

  rows.forEach((parts,i)=>{let x=lw;const y=i*rh+3;s+=`<text x="${lw-6}" y="${y+rh/2+1}" text-anchor="end" class="lab">${labels[i]}</text>`;const t=sum(parts.map(p=>p.v))||1;
    parts.forEach((p,j)=>{const w=p.v/t*iw;if(w>0)s+=`<rect x="${x}" y="${y+2}" width="${w}" height="${rh-6}" fill="${p.c}" data-i="${i}" data-j="${j}"/>`;x+=w})});

}
function dbar(el,rows,o={}){/* diverging bars around zero */
  const W=560,lw=o.lw||110,rh=o.rh||17,H=rows.length*rh+8,iw=W-lw-70,mx=Math.max(...rows.map(r=>Math.abs(r.v)))||1,z=lw+30+iw/2,sc=(iw/2)/mx;

  rows.forEach((r,i)=>{const y=i*rh+4,w=Math.max(1,Math.abs(r.v)*sc),x=r.v<0?z-w:z;s+=`<g data-i="${i}"><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lw-8}" y="${y+rh/2+2}" text-anchor="end" class="lab">${esc(r.l)}</text><rect x="${x}" y="${y+3}" width="${w}" height="${rh-8}" rx="3" fill="${r.v<0?(o.neg||'#cc4c02'):(o.pos||'#2a78d6')}"/><text x="${r.v<0?x-5:x+w+5}" y="${y+rh/2+2}" text-anchor="${r.v<0?'end':'start'}">${o.f?o.f(r.v):fmt.format(r.v)}</text></g>`});

const lcCache={};
async function siteRings(f){
  if(f.w&&LIVE){try{const u=`https://services9.arcgis.com/IkktFdUAcY3WrH25/arcgis/rest/services/WDPA_Terrestrial_Simplification50/FeatureServer/0/query?where=WDPAID%3D${f.w}&outFields=WDPAID&returnGeometry=true&outSR=4326&geometryPrecision=5&f=json`;const j=await jget(u);const g=j.features&&j.features[0]&&j.features[0].geometry;if(g&&g.rings)return{rings:g.rings,kind:'boundary'}}catch(e){}}

  return null}
async function siteLC(f){

  const ext=Math.max((b[2]-b[0])*111320,(b[3]-b[1])*111320*1.02);const ps=Math.max(10,Math.ceil(ext/2500));
  const one=async y=>{const p=new URLSearchParams({geometry:JSON.stringify({rings:sg.rings,spatialReference:{wkid:4326}}),geometryType:'esriGeometryPolygon',time:String(Date.UTC(y,6,1)),renderingRule:JSON.stringify({rasterFunction:'None'}),pixelSize:JSON.stringify({x:ps,y:ps,spatialReference:{wkid:3857}}),f:'json'});
    for(let t=0;t<3;t++){try{const j=await (await fetch(LC_SVC+'/computeHistograms',{method:'POST',body:p})).json();const h=j.histograms&&j.histograms[0];if(!h)throw new Error('none');const o={};h.counts.forEach((c,i)=>{if(c)o[Math.round(h.min+i+.5)]=c});return o}catch(e){await new Promise(z=>setTimeout(z,800*(t+1)))}}return null};

  return lcCache[f.i]={rows,kind:sg.kind,area,ps}}

function renderDZ(f,el){

  const siteOf=()=>{const v=$('#r-site').value.trim().toLowerCase();return nameIdx[v]?BY[nameIdx[v]]:null};
  const text=()=>{const f=siteOf();return`Field report — ${$('#r-title').value}\nSite: ${f?f.n+' ('+f.s+') ['+f.i+']':$('#r-site').value}\nType: ${$('#r-type').value}\nDate observed: ${$('#r-date').value}\nOrganisation: ${$('#r-org').value||'—'}\nEvidence: ${$('#r-link').value||'—'}\n\n${$('#r-body').value}`};
  $('#r-copy').onclick=()=>copy(text());
  if(reportSite&&BY[reportSite])$('#r-site').value=BY[reportSite].n;
  $('#rform').onsubmit=async e=>{e.preventDefault();const f=siteOf();track('field-report','Submitted a field report');
    if(!f){$('#r-msg').textContent='Pick a site from the list so the report can be placed on the map.';return}
    if(CAP.db){$('#r-submit').disabled=true;try{const uid=CAP.user&&CAP.user.id?await CAP.user.id():null;
        await CAP.db.collection('reports').add({site:f.i,siteName:f.n,state:f.s,type:$('#r-type').value,date:$('#r-date').value,title:$('#r-title').value.slice(0,120),body:$('#r-body').value.slice(0,2000),org:$('#r-org').value.slice(0,120),link:/^https?:\/\//.test($('#r-link').value)?$('#r-link').value:'',author:uid,created:Date.now(),status:'unverified'});
        $('#rform').reset();$('#r-date').value=today;$('#r-msg').textContent='Report published to the shared field log.';toast('Report published')}
      catch(err){$('#r-msg').textContent=err&&err.code==='not_granted'?'You can read the log but not add to it. Ask the atlas owner for contributor access, or copy the report text and send it.':'The report could not be saved. Copy the text and try again later.'}
      $('#r-submit').disabled=false}
    else{const url=`https://github.com/${CONFIG.issuesRepo}/issues/new?labels=field-report&title=${encodeURIComponent('['+$('#r-type').value+'] '+f.n+': '+$('#r-title').value)}&body=${encodeURIComponent(text())}`;
      const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();$('#r-msg').innerHTML=`Your report opens as a GitHub issue for review. If nothing opened, <a href="${esc(url)}" target="_blank" rel="noopener">open it here</a> or copy the report text.`}};
  $('#r-mode').textContent=CAP.db?'Reports are saved to this atlas’s shared log and visible to everyone it is shared with.':'On the public website, reports are filed as GitHub issues so maintainers can verify them before they are added.';
  $('#rf-type').onchange=$('#rf-state').onchange=renderFeed;
  renderFeed();renderWatch();
}
function startReports(){if(unsubR||!CAP.db)return;try{unsubR=CAP.db.collection('reports').orderBy('created','desc').limit(300).onSnapshot(s=>{REPORTS=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed();if(state.sel)renderSiteReports(state.sel);if($('#r-mode'))$('#r-mode').textContent='Reports are saved to this atlas’s shared log and visible to everyone it is shared with.'},()=>{})}catch(e){}}
async function names(ids){const out={};if(!CAP.user||!CAP.user.profiles||!ids.length)return out;try{const p=await CAP.user.profiles(ids);ids.forEach(i=>out[i]=(p[i]&&p[i].name)||'')}catch(e){}return out}
async function renderFeed(){
  const el=$('#feed');if(!el)return;
  if(!CAP.db){el.innerHTML=`<p class="loading" style="margin:0">Submitted reports are reviewed on GitHub: <a href="https://github.com/${CONFIG.issuesRepo}/issues?q=label%3Afield-report" target="_blank" rel="noopener">see the open field reports ↗</a>.</p>`;return}
  const t=$('#rf-type').value,s=$('#rf-state').value;const L=REPORTS.filter(r=>(!t||r.type===t)&&(!s||(r.state||'').includes(s))).slice(0,60);
  const nm=await names([...new Set(L.map(r=>r.author).filter(Boolean))]);
  el.innerHTML=L.length?L.map(r=>`<div class="rep"><div class="h"><span class="typechip">${esc(r.type)}</span><span>${esc(r.date||'')}</span><a href="#${esc(r.site)}">${esc(r.siteName||r.site)}</a><span>${esc(r.state||'')}</span><span>· unverified</span></div><b>${esc(r.title)}</b>${r.body?`<p>${esc(r.body)}</p>`:''}<div class="h" style="margin-top:6px">${nm[r.author]?esc(nm[r.author]):'A contributor'}${r.org?' · '+esc(r.org):''}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">evidence ↗</a>`:''}</div></div>`).join(''):'<p class="loading" style="margin:0">No reports yet. The first one you publish will appear here.</p>';
}
function renderSiteReports(f){const el=$('#sh-reports');if(!el)return;const L=REPORTS.filter(r=>r.site===f.i);el.innerHTML=L.length?`<h3>Field reports (${L.length})</h3>${L.slice(0,5).map(r=>`<div class="rep" style="margin-top:6px"><div class="h"><span class="typechip">${esc(r.type)}</span><span>${esc(r.date||'')}</span><span>· unverified</span></div><b>${esc(r.title)}</b>${r.body?`<p>${esc(r.body.slice(0,300))}</p>`:''}</div>`).join('')}`:''}
function renderWatch(){const el=$('#watch');if(!el)return;const w=watchlist().map(i=>BY[i]).filter(Boolean);
  el.innerHTML=w.length?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Site</th><th>State</th><th>Level</th><th class="n">GBIF species</th></tr></thead><tbody>${w.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td>${esc(f.s)}</td><td>${f.v}</td><td class="n">${f.gb?fmt.format(f.gb[1]):'–'}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:8px"><button class="btn sm" id="dl-watch" type="button">Download watchlist CSV</button></div>`:'<p class="loading" style="margin:0">Open any site on the map and press “Watch” to add it here.</p>';
  $$('#watch tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  if($('#dl-watch'))$('#dl-watch').onclick=()=>saveFile('watchlist.csv',toCSV(w.map(exportRow)),'text/csv');}

/* ---------- data & sources view ---------- */
function exportRow(f){return{id:f.i,wdpa_id:f.w||'',name:f.n,category:CATS[f.c],state:f.s,lga:f.l||'',lat:f.la??'',lon:f.lo??'',area_ha_gis:f.a||'',area_ha_reported:f.ar||'',area_ha_fao1998:f.fh||'',year:f.y||'',iucn:f.u||'',verification_level:f.v,eco_zone_inferred:f.z?ZONES[f.z].n:'',vegetation:f.veg||'',flora:f.flora||'',fauna:f.fauna||'',resources:f.res||'',tourism:f.tour||'',threats:f.thr||'',notes:f.notes||'',gbif_records:f.gb?f.gb[0]:'',gbif_species:f.gb?f.gb[1]:'',visitor_readiness:f.vis?f.vis.visitor_readiness||'':'',sources:(f.src||[]).join(' | ')}}
function buildData(){
  const unm=F.filter(f=>f.la==null);const byS={};unm.forEach(f=>(byS[f.s||'Unknown']=byS[f.s||'Unknown']||[]).push(f.n));
  const dsCite=`Nigeria Forest Reserves Atlas (2026). Nigeria forest reserves and protected areas dataset, version ${DATA.meta.version} [Data set]. ${CONFIG.siteUrl}. Includes data from UNEP-WCMC and IUCN (2026), Protected Planet: The World Database on Protected Areas (WDPA), accessed ${DATA.meta.wdpa_access}, Cambridge, UK: UNEP-WCMC and IUCN, www.protectedplanet.net.`;
  const SRC=[
   ['World Database on Protected Areas (UNEP-WCMC & IUCN)','960 Nigerian records: names, designations, boundaries, IUCN categories, status years','Primary spatial backbone','https://www.protectedplanet.net/country/NGA','Non-commercial use with attribution (WDPA terms)'],
   ['geoBoundaries (William & Mary geoLab)','State (ADM1) and LGA (ADM2) boundaries for assigning sites and computing state areas','All sites','https://www.geoboundaries.org','CC BY 4.0'],
   ['FAO, Forest Resource Situation Assessment of Nigeria (Beak Consultants, 1998), Table 18','Gazetted forest reserves and areas in the high-forest states, with management units','103 reserve entries; areas shown as “FAO 1998”','https://www.fao.org/4/ab578e/AB578E10.htm','FAO document'],
   ['Federal Surveys of Nigeria (1966), “Nigeria: Forest Reserves” map, via ESDAC/EUDASM','Historical national map of reserves at the time of gazettement','Reference for checking names and historic extents; not digitised here','https://esdac.jrc.ec.europa.eu/content/nigeria-forest-reserves','EUDASM archive'],
   ['Royal Museum for Central Africa, “Forest reserves in Northern Nigeria” (1:3,000,000)','Historical general map of northern reserves','Reference only; © RMCA','https://geocatalogue.africamuseum.be/geonetwork/srv/api/records/BE-RMCA-EARTHS-040026','© RMCA'],
   ['“Map of Forest Reserves in Nigeria” (ResearchGate, 2020)','Academic GIS map of reserve locations and land mass','Reference for cross-checking','https://www.researchgate.net/publication/338969530_MAP_OF_FOREST_RESERVES_IN_NIGERIA','Author’s rights'],
   ['Sambus Geospatial Open Data, “Nigeria Forest”','757 polygons. Checked: this is an OpenStreetMap forest-cover extract (landuse=forest), not a reserve register, and carries no licence','Not used for reserve records','https://opendata.sambusgeospatial.com/datasets/nigeria-forest/about','No licence stated'],
   ['Ramsar Sites Information Service; UNESCO Man and the Biosphere; BirdLife / Key Biodiversity Areas','Designations, site descriptions, species and threats','Ramsar, biosphere and KBA sites','https://rsis.ramsar.org','Per source'],
   ['National Park Service of Nigeria and federal announcements','National park list, upgrades approved 2023–2025, visitor information','National parks','https://nigeriaparkservice.gov.ng','Public information'],
   ['State forestry laws and schedules, theses, journal papers, news reports','Reserve names, areas, gazettement years, species, threats','Cited on each profile','#map','Per source'],
   ['GBIF.org occurrence API','Biodiversity record and species counts per site (snapshot) and live species lists','All mapped sites','https://www.gbif.org','Per dataset licence (CC0 / CC BY / CC BY-NC)'],
   ['FAO FRA 2025 / UN SDG Global Database; Global Forest Watch (Hansen/UMD); Protected Planet country statistics','National forest area, tree cover loss, protected-area coverage','Statistics page','https://unstats.un.org/sdgs/dataportal','Per source'],
   ['Hansen et al. (2013), Global Forest Change v1.12 (UMD / Google / USGS / NASA)','30 m tree cover in 2000 and annual stand-replacing loss 2001–2024','Forest-loss profiles: zonal statistics computed by this atlas inside each WDPA boundary, each state and a 3 km radius around published points','https://glad.earthengine.app/view/global-forest-change','CC BY 4.0'],
   ['CHIRPS v2 rainfall (UCSB Climate Hazards Center) via NASA/USAID SERVIR ClimateSERV','Daily rainfall 1991–2024 averaged over each state','Desertification profiles: rainfall, trends, aridity index','https://climateserv.servirglobal.net','Public domain (CHIRPS)'],
   ['NASA POWER (MERRA-2)','Monthly temperature, daily temperature range and top-of-atmosphere radiation 1984–2024','Potential evapotranspiration (Hargreaves method) for the aridity index','https://power.larc.nasa.gov','NASA open data'],
   ['Esri, Impact Observatory and Microsoft, Sentinel-2 10 m Land Use/Land Cover Time Series','Annual 10 m land cover 2017–2025 (water, trees, flooded vegetation, crops, built area, bare ground, rangeland)','Land-cover profiles (live per reserve), state and national shares (computed at 250 m), map overlay','https://www.arcgis.com/home/item.html?id=cfcb7609de5f478eb7666240902d4d3d','CC BY 4.0'],
   ['World Bank Climate Change Knowledge Portal (CRU TS 4.07); UN SDG Global Database; Federal Ministry of Information','National rainfall since 1901; SDG 15.3.1 share of degraded land; Great Green Wall frontline states','Desertification context','https://climateknowledgeportal.worldbank.org/country/nigeria','Per source'],
   ['Sentinel-2 cloudless annual mosaics (EOX IT Services, s2maps.eu); NASA GIBS MODIS Terra corrected reflectance','Satellite images by year in the Time explorer: 10 m cloud-free mosaics for 2016 and 2018–2025, MODIS Terra/Aqua 250 m images for other years (clearest dry-season day, orbit gaps filled from the second satellite)','Time explorer imagery','https://s2maps.eu','CC BY 4.0 (2016) and CC BY-NC-SA 4.0 (2018 onwards); NASA open data'],
   ['Live services on the hosted site','iNaturalist (species photos), Wikimedia Commons (photos), Open-Meteo (weather), CARTO / Esri / OpenTopoMap / NASA GIBS (basemaps), Hansen GFC v1.12 (forest-loss tiles)','On demand','https://www.inaturalist.org','Per service terms']];
  $('#data').innerHTML=`<h2 class="title">Data, sources and method</h2><p class="lede">This atlas joins the official global protected-area register with national inventories, state laws, scientific literature and field reports, and records where every fact came from. It is built to be checked, cited and corrected.</p>
  <h3>Download the dataset</h3><p>${fmt.format(F.length)} records, version ${esc(DATA.meta.version)}, compiled ${esc(DATA.meta.compiled)}. CSV opens in Excel or R; GeoJSON opens in QGIS, ArcGIS and most web maps.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="dl-csv" type="button">Download CSV</button><button class="btn" id="dl-geo" type="button">Download GeoJSON</button><button class="btn" id="dl-cite" type="button">Copy dataset citation</button></div>
  <pre class="cite" style="margin-top:10px">${esc(dsCite)}</pre>
  <h3>Sources</h3><div class="tbl-wrap" style="max-height:none"><table class="dt srctbl"><thead><tr><th>Source</th><th>What it provides</th><th>Used for</th><th>Licence / terms</th></tr></thead><tbody>${SRC.map(s=>`<tr><td><a href="${esc(s[3])}" ${s[3].startsWith('#')?'':'target="_blank" rel="noopener"'}>${esc(s[0])}</a></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td>${esc(s[4])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Verification levels</h3><ul>${Object.entries(LEVELS).map(([k,v])=>`<li><b>Level ${k}</b> (${F.filter(f=>f.v===k).length} records): ${esc(v)}</li>`).join('')}</ul>
  <h3>Method</h3><ul>
   <li>WDPA records were matched to compiled lists by normalised name and distance. Where a national park was created from an existing reserve, the record carries the new designation and notes the old one.</li>
   <li>Each site is assigned to a state and LGA by where the centre of its boundary falls (geoBoundaries). Sites on a boundary are counted in each state named.</li>
   <li>Areas are shown side by side: calculated from the WDPA polygon, as gazetted or reported, and as listed by FAO in 1998. Differences are normal and reflect survey dates and excisions.</li>
   <li>Ecological zones are inferred from location and the main highland blocks. Zone text is labelled as inferred and never replaces site-specific evidence.</li>
   <li>GBIF counts use each site’s bounding box, so they can include records just outside irregular boundaries. They show where data exist, not true species richness.</li>
   <li>Boundaries are simplified to about 1 km for display. Use the WDPA originals for area statistics in publications.</li>
   <li>Forest loss: every 30 m Hansen pixel whose centre falls inside a boundary is counted, with pixel area from its latitude. Tree cover means canopy above 30% in 2000 (the Global Forest Watch default). Boundaries are the WDPA polygons simplified to about 50 m; state totals use simplified geoBoundaries outlines and may differ slightly from Global Forest Watch dashboards.</li>
   <li>Desertification: aridity index = annual CHIRPS rainfall ÷ Hargreaves potential evapotranspiration, classed with UNEP thresholds (hyper-arid &lt; 0.05, arid &lt; 0.20, semi-arid &lt; 0.50, dry sub-humid &lt; 0.65). Trends are ordinary least-squares slopes. These are state-level indicators, shown alongside land-cover signals, not a desertification verdict for any one site.</li>
   <li>Land cover: annual 10 m maps are queried for each reserve when its profile opens; state shares were computed once at 250 m. Clouds are excluded. Two-year averages are used to compare start and end because single-year maps contain classification noise.</li></ul>
  <h3>Updates</h3><p>On the hosted website, species lists, photographs, weather, NASA daily imagery and the forest-loss layer are fetched live each time a profile opens. The core dataset is rebuilt by a scheduled job that re-reads the WDPA and GBIF, and field reports are reviewed before corrections are merged. Each release is versioned; cite the version you used.</p>
  <h3>Known gaps</h3><p>Published counts suggest some states have more reserves than appear here: Benue reports about 52, Nasarawa about 41, Gombe 32 (state committee, 2026) and Enugu about 20. Imo, Abia and Lagos lists are thin. These ${unm.length} names are recorded but not yet located:</p>
  <div class="gaplist">${Object.entries(byS).sort().map(([s,ns])=>`<b>${esc(s)}</b>${ns.map(esc).join(' · ')}`).join('')}</div>
  <h3>Corrections</h3><p>Forestry departments, researchers and rangers can send corrections through the NGO hub (choose “Data correction”) or on <a href="https://github.com/${CONFIG.issuesRepo}/issues" target="_blank" rel="noopener">GitHub</a>. Please include a source.</p>`;
  $('#dl-csv').onclick=()=>saveFile('nigeria_protected_areas.csv',toCSV(F.map(exportRow)),'text/csv');
  $('#dl-geo').onclick=()=>saveFile('nigeria_protected_areas.geojson',JSON.stringify({type:'FeatureCollection',features:F.map(f=>({type:'Feature',properties:exportRow(f),geometry:f.g?{type:'MultiPolygon',coordinates:f.g}:f.la!=null?{type:'Point',coordinates:[f.lo,f.la]}:null}))}),'application/geo+json');
  $('#dl-cite').onclick=()=>copy(dsCite);
}

</script>
