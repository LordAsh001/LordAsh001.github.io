function setBase(k){

function initFilters(){
  $('#state').innerHTML='<option value="">All 36 states + FCT</option>'+STATES.map(s=>`<option>${esc(s)}</option>`).join('');
  $('#zone').innerHTML='<option value="">All zones</option>'+Object.entries(ZONES).map(([k,z])=>`<option value="${k}">${z.n}</option>`).join('');
  let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase();state.limit=120;update()},150)});
  $('#state').onchange=()=>{state.st=$('#state').value;state.limit=120;update();zoomState(state.st)};
  $('#zone').onchange=()=>{state.zone=$('#zone').value;update()};
  $('#lvl').onchange=()=>{state.lvl=$('#lvl').value;update()};
  $('#sort').onchange=()=>{state.sort=$('#sort').value;update()};
  $('#more').onclick=()=>{state.limit+=150;renderList()};
  $('#reset').onclick=()=>{Object.assign(state,{q:'',groups:new Set(GROUPS.map((g,i)=>i)),st:'',zone:'',lvl:'',limit:120});$('#q').value='';$('#state').value='';$('#zone').value='';$('#lvl').value='';update();zoomState('')};
}
function pass(f,ig){
  if(!ig&&!state.groups.has(f.gp))return false;
  if(state.st&&!f.st.includes(state.st))return false;
  if(state.zone&&f.z!==state.zone)return false;
  if(state.lvl&&!state.lvl.includes(f.v))return false;
  if(state.q){for(const t of state.q.split(/\s+/))if(t&&!f.txt.includes(t))return false}
  return true;
}
let current=[];
function update(){
  const s=state.sort;
  current=F.filter(f=>pass(f)).sort(s==='name'?(a,b)=>a.n.localeCompare(b.n):s==='area'?(a,b)=>b.km-a.km:s==='gbif'?(a,b)=>((b.gb||[0])[0]-(a.gb||[0])[0]):(a,b)=>('ABCD'.indexOf(a.v)-'ABCD'.indexOf(b.v))||(a.gp===0)-(b.gp===0)||b.km-a.km);
  siteLayer.clearLayers();
  const order=[...current].sort((a,b)=>(b.gp===0)-(a.gp===0)||b.km-a.km);
  order.forEach(f=>{if(f.poly)siteLayer.addLayer(f.poly)});order.forEach(f=>{if(f.mk)siteLayer.addLayer(f.mk)});
  const counts=GROUPS.map(()=>0);F.forEach(f=>{if(pass(f,true))counts[f.gp]++});
  $('#cats').innerHTML=GROUPS.map((g,i)=>`<button type="button" class="chip" style="--c:var(--g${i})" data-i="${i}" aria-pressed="${state.groups.has(i)}"><span class="dot"></span>${g}<span class="n">${counts[i]}</span></button>`).join('');
  $$('#cats .chip').forEach(b=>b.onclick=e=>{const i=+b.dataset.i;if(e.altKey||e.metaKey)state.groups=new Set([i]);else state.groups.has(i)?state.groups.delete(i):state.groups.add(i);update()});
  const unm=current.filter(f=>f.la==null).length;
  $('#count').textContent=`${fmt.format(current.length)} sites${unm?` · ${unm} not yet located`:''}`;
  renderList();
}
function renderList(){
  const ul=$('#list');
  ul.innerHTML=current.slice(0,state.limit).map(f=>`<li><button type="button" data-id="${f.i}" class="${state.sel===f?'on':''}"><span class="li-dot" style="--c:var(--g${f.gp})"></span><span><span class="li-name">${esc(f.n)}</span><span class="lv ${f.v}" title="Verification level ${f.v}">${f.v}</span><br><span class="li-meta">${esc(CATS[f.c])} · ${esc(f.s||'State unknown')}${f.l?' · '+esc(f.l):''}</span></span><span class="li-tag">${f.km?fmt.format(Math.round(f.km))+' km²':''}${f.gb&&f.gb[0]?'<br>'+fmt.format(f.gb[0])+' rec.':''}</span></button></li>`).join('')||'<li style="padding:18px 16px;color:var(--muted)">No sites match. Clear the search or switch designations back on.</li>';
  ul.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=BY[b.dataset.id];history.replaceState(null,'','#'+f.i);select(f,false)});
  const m=$('#more');m.hidden=current.length<=state.limit;m.textContent=`Show more (${fmt.format(current.length-state.limit)} left)`;
}
function zoomState(n){
  if(hiState){hiState.setStyle(stateStyle(false));hiState=null}
  if(!n){map.flyToBounds([[4.1,2.6],[13.95,14.7]],{duration:.6});return}
  statesLayer.eachLayer(l=>{if(l.feature.properties.n===n){hiState=l;l.setStyle(stateStyle(true));map.flyToBounds(l.getBounds(),{padding:[30,30],duration:.6})}});
}

/* ---------- site profile ---------- */
function bbox(f){
  if(f.g){let a=[999,999,-999,-999];f.g.forEach(p=>p.forEach(r=>r.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y)})));if(a[2]-a[0]<.04){const cx=(a[0]+a[2])/2,cy=(a[1]+a[3])/2;a=[cx-.02,cy-.02,cx+.02,cy+.02]}return a}
  if(f.la==null)return null;const h=Math.max(.02,Math.sqrt(Math.max(4,f.km||4))/111/2);return[f.lo-h,f.la-h,f.lo+h,f.la+h];
}
const wkt=b=>`POLYGON((${b[0]} ${b[1]},${b[2]} ${b[1]},${b[2]} ${b[3]},${b[0]} ${b[3]},${b[0]} ${b[1]}))`;
const ha=v=>fmt.format(Math.round(v))+' ha'+(v>=1000?` (${fmt.format(Math.round(v/100))} km²)`:'');
function citeText(f){return `Nigeria Forest Reserves Atlas (2026). ${f.n}, ${f.s||'Nigeria'} [record ${f.i}${f.w?'; WDPA ID '+f.w:''}]. Version ${DATA.meta.version}. Retrieved ${today}, from ${CONFIG.siteUrl}#${f.i}`}
function watchlist(){return store('watch')||[]}
function toggleWatch(f){let w=watchlist();w=w.includes(f.i)?w.filter(x=>x!==f.i):[...w,f.i];store('watch',w);return w.includes(f.i)}
function select(f,fromMap){
  if(!f)return;
  if($('#v-map').hidden){location.hash=f.i;return}
  const p=state.sel;if(p&&p!==f){if(p.poly)p.poly.setStyle({weight:1.2});if(p.mk)p.mk.setStyle({weight:1,color:css('--panel')})}
  state.sel=f;track('site-opened','Opened a site profile');
  if(f.poly){f.poly.setStyle({weight:3});f.poly.bringToFront()}
  if(f.mk){f.mk.setStyle({weight:3,color:css('--ink')});f.mk.bringToFront()}
  if(!fromMap){if(f.poly)map.flyToBounds(f.poly.getBounds(),{padding:[60,60],maxZoom:11,duration:.7});else if(f.mk)map.flyTo([f.la,f.lo],Math.max(map.getZoom(),9),{duration:.7})}
  else history.replaceState(null,'','#'+f.i);

  const watched=watchlist().includes(f.i);
  $('#sh-act').innerHTML=`<button class="btn sm" id="a-watch" type="button">${watched?'★ Watching':'☆ Watch'}</button><button class="btn sm" id="a-share" type="button">Copy link</button><button class="btn sm" id="a-cite" type="button">Cite</button><button class="btn sm" id="a-report" type="button">Report from the field</button>`;
  $('#a-watch').onclick=()=>{$('#a-watch').textContent=toggleWatch(f)?'★ Watching':'☆ Watch';if(built.ngo)renderWatch()};
  $('#a-share').onclick=()=>copy(CONFIG.siteUrl+'#'+f.i);
  $('#a-cite').onclick=()=>copy(citeText(f));
  $('#a-report').onclick=()=>{reportSite=f.i;location.hash='ngo';setTimeout(()=>{if($('#r-site')){$('#r-site').value=f.n;$('#r-site').dispatchEvent(new Event('change'));$('#r-title').focus()}},120)};
  const z=f.z&&ZONES[f.z];const b=bbox(f);
  const facts=[['State',f.s||'Not established'],['LGA',f.l||'Not recorded'],['Established / gazetted',f.y||'Not recorded'],['IUCN category',f.u||'Not reported'],['Managed by',f.auth||f.gv||'Not recorded',1],
    ['Coordinates',f.la!=null?`<span class="mono">${f.la.toFixed(3)}° N, ${f.lo.toFixed(3)}° E</span> · ${f.q==='wdpa'?'WDPA boundary centre':f.q==='published'?'published point':f.q==='approx_town'?'approximate (nearest town)':'unverified'}`:'Not yet located',1,1]];
  if(f.formerly)facts.push(['Previous WDPA designation',f.formerly,1]);
  let h='';

    if(LIVE){h+=`<figure class="photo" id="gal">${imgTag(P,960,500)}<figcaption id="galcap"></figcaption>${f.pics.length>1?`<div class="galrow">${f.pics.map((p,i)=>`<button type="button" data-g="${i}" class="${i?'':'on'}" aria-label="Show photo ${i+1}">${imgTag(p,250,330,'')}</button>`).join('')}</div>`:''}</figure>`}
    else h+=`<div class="photo off">${f.pics.length} photograph${f.pics.length>1?'s':''} on Wikimedia Commons, e.g. <a href="${pageUrl(P)}" target="_blank" rel="noopener">${esc(capOf(P))}</a> by ${esc(P[2]||'unknown')} (${esc(P[3])}). Photos display on the website.</div>`}
  if(f.unesco){const u=f.unesco;h+=`<div class="box unesco"><h3>UNESCO ${esc(u.list)} <small>${esc(u.year)}</small></h3><p style="margin:0;font-size:13px">${esc(u.name)}${u.criteria?` · criteria ${esc(u.criteria)}`:''}${u.category?` · ${esc(u.category)}`:''} · ref. ${esc(u.ref)}. <a href="${esc(u.url)}" target="_blank" rel="noopener">UNESCO record ↗</a></p></div>`}
  h+=`<div class="verif"><b class="lvl ${f.v}">${f.v}</b><div><b>Verification level ${f.v}.</b> ${LEVELS[f.v]}</div></div>`;
  h+=`<dl class="facts">${facts.map(([k,v,w,raw])=>`<div class="fact${w?' w':''}"><dt>${k}</dt><dd>${raw?v:esc(v)}</dd></div>`).join('')}</dl>`;
  const areas=[];if(f.a)areas.push(['From WDPA boundary (GIS)',ha(f.a)]);if(f.ar)areas.push(['Reported / gazetted',ha(f.ar)]);if(f.fh)areas.push([`FAO 1998 inventory${f.fm?' · '+f.fm:''}`,ha(f.fh)]);
  if(areas.length)h+=`<div class="box"><h3>Area <small>figures differ by source and date</small></h3><dl>${areas.map(([k,v])=>`<dt>${k}</dt><dd class="mono">${v}</dd>`).join('')}</dl></div>`;
  if(f.ds&&f.ds.length)h+=`<div class="desigs">${f.ds.map(d=>`<span>${esc(d)}</span>`).join('')}</div>`;
  const sec=(t,v)=>v?`<div class="sec"><h3>${t}</h3><p>${esc(v)}</p></div>`:'';
  h+=sec('Vegetation',f.veg)+sec('Flora · notable plants',f.flora)+sec('Fauna · notable animals and birds',f.fauna)+sec('Resources',f.res)+sec('Tourism potential',f.tour)+sec('Threats',f.thr)+sec('Notes',f.notes);
  if(f.vis){const v=f.vis;const rows=[['Visitor readiness',v.visitor_readiness],['Nearest city',v.nearest_city],['Getting there',v.access],['Best time',v.best_time],['Facilities',v.facilities],['Activities',v.activities],['Permits and fees',v.permits_fees]].filter(r=>r[1]);
    h+=`<div class="box"><h3>Planning a visit <small>check locally before travelling</small></h3>${v.safety_note?`<p class="safety" style="margin:0 0 8px">${esc(v.safety_note)}</p>`:''}<dl>${rows.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>${v.official_site?`<p style="margin:8px 0 0;font-size:12.5px"><a href="${esc(v.official_site)}" target="_blank" rel="noopener">Official website ↗</a></p>`:''}</div>`}
  // biodiversity
  const gb=f.gb;const gbifUrl=b?`https://www.gbif.org/occurrence/search?geometry=${encodeURIComponent(wkt(b))}`:null;
  const inatUrl=b?`https://www.inaturalist.org/observations?swlat=${b[1]}&swlng=${b[0]}&nelat=${b[3]}&nelng=${b[2]}`:null;
  if(b){h+=`<div class="box" id="bio"><h3>Recorded biodiversity <small>GBIF, within the reserve’s bounding box</small></h3>${gb?`<div class="kv"><div><b>${fmt.format(gb[0])}</b><span>records</span></div><div><b>${fmt.format(gb[1])}</b><span>species</span></div><div><b>${fmt.format(gb[2]+gb[3]+gb[4])}</b><span>threatened-species records</span></div></div>`:''}<div id="bio-live">${LIVE?'<p class="loading">Loading live species records…</p>':`<p class="loading" style="margin:0">Snapshot taken ${esc(DATA.meta.gbif_snapshot||'October 2026')}. Live species lists and photos load on the hosted site.</p>`}</div><div class="links" style="margin-top:8px"><a href="${gbifUrl}" target="_blank" rel="noopener">GBIF records ↗</a><a href="${inatUrl}" target="_blank" rel="noopener">iNaturalist observations ↗</a></div></div>`}
  if(LIVE&&f.la!=null)h+=`<div class="box"><h3>Weather this week <small>Open-Meteo forecast</small></h3><div id="wx" class="loading">Loading…</div></div><div id="photos-live"></div>`;
  if(!f.r)h+=`<div class="gap">No site-specific survey of plants, animals or tourism was found for this reserve. The zone profile below describes what is typical for its ecological setting; conditions on the ground may differ, and many reserves have been logged, farmed or converted to plantations.</div>`;
  if(z)h+=`<div class="box zone"><div class="zt">Ecological zone · inferred from location</div><h4>${z.n}</h4><dl><dt>Setting</dt><dd>${z.v}</dd><dt>Characteristic flora</dt><dd>${z.fl}</dd><dt>Characteristic fauna</dt><dd>${z.fa}</dd><dt>Typical resources</dt><dd>${z.r}</dd><dt>Tourism assets in this zone</dt><dd>${z.t}</dd></dl></div>`;
  const links=[];
  if(f.la!=null){links.push(`<a href="https://www.google.com/maps/@${f.la},${f.lo},${f.km>200?11:13}z/data=!3m1!1e3" target="_blank" rel="noopener">Satellite view ↗</a>`);links.push(`<a href="https://www.google.com/maps/dir/?api=1&destination=${f.la},${f.lo}" target="_blank" rel="noopener">Directions ↗</a>`);links.push(`<a href="https://www.openstreetmap.org/#map=12/${f.la}/${f.lo}" target="_blank" rel="noopener">OpenStreetMap ↗</a>`)}

  h+=`<div class="sec" id="sh-reports"></div>`;
  h+=`<div class="sec"><h3>Sources</h3><ul class="srcs">${f.w?`<li>UNEP-WCMC &amp; IUCN, World Database on Protected Areas, WDPA ID <span class="mono">${f.w}</span> (boundary, area, designation)</li>`:''}${(f.src||[]).map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,80))}</a></li>`).join('')}${!f.w&&!(f.src||[]).length?'<li>Compiled list; no URL recorded</li>':''}</ul></div>`;

  if($('#gal')){setCap(0);$$('#gal .galrow button').forEach(b=>b.onclick=()=>{const i=+b.dataset.g,p=f.pics[i],im=$('#gal>img');if(im){im.dataset.f='';im.dataset.alt=imgUrl(p,500);im.src=imgUrl(p,960)}else{$('#gal').insertAdjacentHTML('afterbegin',imgTag(p,960,500))}setCap(i);$$('#gal .galrow button').forEach(x=>x.classList.toggle('on',x===b))})}

function closeSheet(){$('#sheet').hidden=true;const p=state.sel;if(p){if(p.poly)p.poly.setStyle({weight:1.2});if(p.mk)p.mk.setStyle({weight:1,color:css('--panel')})}state.sel=null;$$('#list button.on').forEach(b=>b.classList.remove('on'));if(location.hash.length>1&&BY[location.hash.slice(1)])history.replaceState(null,'','#map')}

/* ---------- live data (hosted site only) ---------- */
const liveCache={};
async function jget(u){if(liveCache[u])return liveCache[u];const r=await fetch(u);if(!r.ok)throw new Error(r.status);const j=await r.json();liveCache[u]=j;return j}
async function loadLive(f,b){
  const me=f;
  if(b)(async()=>{try{
    const j=await jget(`https://api.gbif.org/v1/occurrence/search?limit=300&hasCoordinate=true&geometry=${encodeURIComponent(wkt(b))}`);
    if(state.sel!==me)return;const sp={};
    j.results.forEach(o=>{if(!o.species)return;const k=o.species;sp[k]=sp[k]||{n:k,cl:o.class||o.kingdom||'',iu:o.iucnRedListCategory,c:0};sp[k].c++});
    const list=Object.values(sp).sort((a,b)=>({CR:0,EN:1,VU:2,NT:3}[a.iu]??9)-({CR:0,EN:1,VU:2,NT:3}[b.iu]??9)||b.c-a.c).slice(0,14);
    $('#bio-live').innerHTML=list.length?`<div class="lbl" style="margin:4px 0">Species in the ${fmt.format(j.results.length)} most recent records (live)</div><ul class="splist">${list.map(s=>`<li><span><i>${esc(s.n)}</i> <span style="color:var(--muted)">${esc(s.cl)}</span></span><span>${['CR','EN','VU','NT'].includes(s.iu)?`<span class="iucn ${s.iu}" title="IUCN Red List">${s.iu}</span> `:''}${s.c}</span></li>`).join('')}</ul>`:'<p class="loading" style="margin:0">No GBIF occurrence records found inside this area yet.</p>';
  }catch(e){$('#bio-live').innerHTML='<p class="loading" style="margin:0">GBIF did not respond. Try the link below.</p>'}})();
  if(f.la!=null)(async()=>{try{
    const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${f.la}&longitude=${f.lo}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Africa%2FLagos`);
    if(state.sel!==me)return;const d=j.daily;
    $('#wx').className='wx';$('#wx').innerHTML=d.time.map((t,i)=>`<div><span>${new Date(t).toLocaleDateString('en-GB',{weekday:'short'})}</span><b>${Math.round(d.temperature_2m_max[i])}°</b><span>${Math.round(d.temperature_2m_min[i])}°</span><br><span title="Chance of rain">${d.precipitation_probability_max[i]??'–'}% ☂</span></div>`).join('');
  }catch(e){$('#wx').textContent='Forecast unavailable.'}})();
  if(b)(async()=>{try{
    const [inat,com]=await Promise.allSettled([
      jget(`https://api.inaturalist.org/v1/observations/species_counts?swlat=${b[1]}&swlng=${b[0]}&nelat=${b[3]}&nelng=${b[2]}&quality_grade=research&per_page=8`),
      f.la!=null?jget(`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${f.la}|${f.lo}&ggsradius=10000&ggsnamespace=6&ggslimit=12&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=320&format=json&origin=*`):Promise.reject()]);
    if(state.sel!==me)return;let h='';
    if(inat.status==='fulfilled'&&inat.value.results.length){h+=`<div class="box"><h3>Species photographed here <small>iNaturalist research-grade</small></h3><div class="thumbs">${inat.value.results.filter(r=>r.taxon.default_photo).map(r=>`<a href="https://www.inaturalist.org/taxa/${r.taxon.id}" target="_blank" rel="noopener" title="${esc(r.taxon.default_photo.attribution)}"><img src="${esc(r.taxon.default_photo.square_url.replace('square','small'))}" alt="${esc(r.taxon.preferred_common_name||r.taxon.name)}" loading="lazy" onerror="this.style.visibility='hidden'">${esc(r.taxon.preferred_common_name||r.taxon.name)}</a>`).join('')}</div><p style="margin:6px 0 0;font-size:11px;color:var(--muted)">Photos © their observers on iNaturalist; hover for licence.</p></div>`}
    if(com.status==='fulfilled'&&com.value.query){const pics=Object.values(com.value.query.pages).filter(p=>p.imageinfo&&/\.(jpe?g|png)$/i.test(p.title)&&!/ISS0|Earth|map|Map|svg|flag/.test(p.title)).slice(0,8);
      if(pics.length)h+=`<div class="box"><h3>Photos taken nearby <small>Wikimedia Commons, within 10 km</small></h3><div class="thumbs">${pics.map(p=>{const i=p.imageinfo[0],m=i.extmetadata||{};const by=(m.Artist?m.Artist.value:'').replace(/<[^>]+>/g,'').trim();return`<a href="${esc(i.descriptionurl)}" target="_blank" rel="noopener" title="${esc(by)} · ${esc(m.LicenseShortName?m.LicenseShortName.value:'')}"><img src="${esc(i.thumburl)}" alt="${esc(p.title.slice(5))}" loading="lazy" onerror="this.style.visibility='hidden'">${esc(p.title.slice(5,40).replace(/\.\w+$/,''))}</a>`}).join('')}</div></div>`}
    $('#photos-live').innerHTML=h;
  }catch(e){}})();
}

/* ---------- charts ---------- */
let tipEl=null;
function tip(el,html,x,y){if(!tipEl){tipEl=document.createElement('div');tipEl.className='vtip'}el.appendChild(tipEl);tipEl.innerHTML=html;tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.hidden=false}
function hideTip(){if(tipEl)tipEl.hidden=true}
function hbar(el,rows,o={}){
  const W=560,lw=o.lw||140,rh=o.rh||20,H=rows.length*rh+8,max=Math.max(...rows.map(r=>r.v))||1,iw=W-lw-58;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">${rows.map((r,i)=>{const w=Math.max(1,r.v/max*iw),y=i*rh+4;return`<g data-i="${i}" ${r.id?`style="cursor:pointer"`:''}><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lw-8}" y="${y+rh/2+2}" text-anchor="end" class="lab">${esc(r.l)}</text><rect x="${lw}" y="${y+3}" width="${w}" height="${rh-8}" rx="3" fill="${r.c||'var(--bar)'}"/><text x="${lw+w+5}" y="${y+rh/2+2}">${o.f?o.f(r.v):fmt.format(r.v)}</text></g>`}).join('')}</svg>`;

function cols(el,pts,o={}){
  const W=560,H=220,pl=46,pb=24,pt=10,iw=W-pl-10,ih=H-pb-pt,max=o.max||Math.max(...pts.map(p=>p.v))*1.08,bw=iw/pts.length;

  pts.forEach(p=>{s+=`<text x="${X(p.x)}" y="${H-6}" text-anchor="middle">${p.x}</text>`});

  s+=`<path d="${d} L${X(x1)} ${Y(lo)} L${X(x0)} ${Y(lo)} Z" fill="var(--bar)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--bar)" stroke-width="2"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="var(--bar)" stroke="var(--panel)" stroke-width="2" data-i="${i}"/>`});
  const l=pts[pts.length-1];s+=`<text x="${X(l.x)-8}" y="${Y(l.v)-10}" text-anchor="end" class="lab">${o.f?o.f(l.v):fmt.format(l.v)}</text>`;

function niceTicks(lo,hi,n){const span=hi-lo,step0=span/n,mag=10**Math.floor(Math.log10(step0)),st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out}

  <div><div class="lbl">Readiness</div><select id="vf-r"><option value="">All</option><option>Established</option><option>Basic</option><option>Limited</option><option value="none">Not yet rated</option></select></div>
  <div><div class="lbl">Landscape</div><select id="vf-z"><option value="">All zones</option>${Object.entries(ZONES).map(([k,z])=>`<option value="${k}">${z.n}</option>`).join('')}</select></div>

    let L=sites.filter(f=>(!r||(r==='none'?!f.vis:(f.vis&&f.vis.visitor_readiness||'').startsWith(r)))&&(!z||f.z===z)&&(!onlyP||f.pics.length)&&(!q||(f.txt+' '+JSON.stringify(f.vis||'')).toLowerCase().includes(q)));
    L.forEach(f=>f._d=from?km(CITIES[from],[f.la,f.lo]):null);

  const hot=F.filter(f=>f.gb&&(f.gb[2]+f.gb[3]+f.gb[4])>0).sort((a,b)=>(b.gb[2]*3+b.gb[3]*2+b.gb[4])-(a.gb[2]*3+a.gb[3]*2+a.gb[4])).slice(0,15);
  const gapsites=F.filter(f=>f.c===4&&f.v==='C'&&f.a).sort((a,b)=>b.a-a.a).slice(0,15);
  $('#ngo').innerHTML=`<h2 class="title">NGO and community hub</h2><p class="lede">Tools for conservation organisations, researchers and community monitors: log what you see on the ground, keep a watchlist, and find the reserves that most need attention or study. Reports are shown as submitted and marked unverified until checked.</p>
  <div class="grid2">
   <article class="card"><h3>Report from the field</h3><div class="sub" id="r-mode"></div>
    <form class="form" id="rform"><label>Site<input type="text" id="r-site" list="r-sites" placeholder="Start typing a reserve name" required></label><datalist id="r-sites">${F.map(f=>`<option value="${esc(f.n)}">${esc(f.s)}</option>`).join('')}</datalist>
     <div class="two"><label>What did you observe?<select id="r-type">${RTYPES.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Date observed<input type="date" id="r-date" value="${today}"></label></div>
     <label>Short title<input type="text" id="r-title" maxlength="120" required placeholder="e.g. New farm clearings on the northern boundary"></label>
     <label>Details<textarea id="r-body" maxlength="2000" placeholder="What, where (landmark or GPS), how large, who is affected. Avoid naming private individuals."></textarea></label>
     <div class="two"><label>Organisation (optional)<input type="text" id="r-org" maxlength="120"></label><label>Evidence link (optional)<input type="url" id="r-link" placeholder="https://"></label></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" id="r-submit">Publish report</button><button class="btn" type="button" id="r-copy">Copy report text</button></div>
     <p id="r-msg" class="loading" style="margin:0"></p></form></article>
   <article class="card"><h3>Shared field log</h3><div class="sub">Most recent reports from all contributors.</div><div class="row2"><select id="rf-type"><option value="">All report types</option>${RTYPES.map(t=>`<option>${t}</option>`).join('')}</select><select id="rf-state"><option value="">All states</option>${STATES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="feed" id="feed"></div></article>
   <article class="card"><h3>My watchlist</h3><div class="sub">Sites you starred in their profiles. Saved in this browser only.</div><div id="watch"></div></article>
   <article class="card"><h3>Sites with documented threats</h3><div class="sub">${threats.length} sites where a cited source records encroachment, logging, grazing, fire, mining or insecurity.</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Site</th><th>State</th><th>Recorded threats</th></tr></thead><tbody>${threats.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td>${esc(f.s)}</td><td>${esc(f.thr.slice(0,140))}</td></tr>`).join('')}</tbody></table></div><div class="foot"><span>Sources cited on each profile</span><span class="acts"><button class="btn sm" id="dl-thr" type="button">CSV</button></span></div></article>
   <article class="card"><h3>Threatened-species hotspots</h3><div class="sub">Sites with the most GBIF records of species listed as Critically Endangered, Endangered or Vulnerable.</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Site</th><th class="n">CR</th><th class="n">EN</th><th class="n">VU</th></tr></thead><tbody>${hot.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td class="n">${fmt.format(f.gb[2])}</td><td class="n">${fmt.format(f.gb[3])}</td><td class="n">${fmt.format(f.gb[4])}</td></tr>`).join('')}</tbody></table></div><div class="foot"><span>GBIF occurrence records (counts are records, not individuals)</span></div></article>
   <article class="card"><h3>Large reserves with no published profile</h3><div class="sub">Research and survey gaps: the biggest mapped forest reserves where no site-specific study was found.</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Site</th><th>State</th><th class="n">km²</th></tr></thead><tbody>${gapsites.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td>${esc(f.s)}</td><td class="n">${fmt.format(Math.round(f.a/100))}</td></tr>`).join('')}</tbody></table></div><div class="foot"><span>Have data on one of these? Send it as a “Data correction” report.</span></div></article>
  </div>`;
  $$('#ngo tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  $('#dl-thr').onclick=()=>saveFile('sites_with_documented_threats.csv',toCSV(threats.map(f=>({id:f.i,site:f.n,state:f.s,threats:f.thr,sources:(f.src||[]).join(' | ')}))),'text/csv');
  const siteOf=()=>{const v=$('#r-site').value.trim().toLowerCase();return nameIdx[v]?BY[nameIdx[v]]:null};
  const text=()=>{const f=siteOf();return`Field report — ${$('#r-title').value}\nSite: ${f?f.n+' ('+f.s+') ['+f.i+']':$('#r-site').value}\nType: ${$('#r-type').value}\nDate observed: ${$('#r-date').value}\nOrganisation: ${$('#r-org').value||'—'}\nEvidence: ${$('#r-link').value||'—'}\n\n${$('#r-body').value}`};
  $('#r-copy').onclick=()=>copy(text());
  if(reportSite&&BY[reportSite])$('#r-site').value=BY[reportSite].n;
  $('#rform').onsubmit=async e=>{e.preventDefault();const f=siteOf();track('field-report','Submitted a field report');
    if(!f){$('#r-msg').textContent='Pick a site from the list so the report can be placed on the map.';return}
    if(CAP.db){$('#r-submit').disabled=true;try{const uid=CAP.user&&CAP.user.id?await CAP.user.id():null;
        await CAP.db.collection('reports').add({site:f.i,siteName:f.n,state:f.s,type:$('#r-type').value,date:$('#r-date').value,title:$('#r-title').value.slice(0,120),body:$('#r-body').value.slice(0,2000),org:$('#r-org').value.slice(0,120),link:/^https?:\/\//.test($('#r-link').value)?$('#r-link').value:'',author:uid,created:Date.now(),status:'unverified'});
        $('#rform').reset();$('#r-date').value=today;$('#r-msg').textContent='Report published to the shared field log.';toast('Report published')}
      catch(err){$('#r-msg').textContent=err&&err.code==='not_granted'?'You can read the log but not add to it. Ask the atlas owner for contributor access, or copy the report text and send it.':'The report could not be saved. Copy the text and try again later.'}
      $('#r-submit').disabled=false}
    else{const url=`https://github.com/${CONFIG.issuesRepo}/issues/new?labels=field-report&title=${encodeURIComponent('['+$('#r-type').value+'] '+f.n+': '+$('#r-title').value)}&body=${encodeURIComponent(text())}`;
      const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();$('#r-msg').innerHTML=`Your report opens as a GitHub issue for review. If nothing opened, <a href="${esc(url)}" target="_blank" rel="noopener">open it here</a> or copy the report text.`}};
  $('#r-mode').textContent=CAP.db?'Reports are saved to this atlas’s shared log and visible to everyone it is shared with.':'On the public website, reports are filed as GitHub issues so maintainers can verify them before they are added.';
  $('#rf-type').onchange=$('#rf-state').onchange=renderFeed;
  renderFeed();renderWatch();
}
function startReports(){if(unsubR||!CAP.db)return;try{unsubR=CAP.db.collection('reports').orderBy('created','desc').limit(300).onSnapshot(s=>{REPORTS=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed();if(state.sel)renderSiteReports(state.sel);if($('#r-mode'))$('#r-mode').textContent='Reports are saved to this atlas’s shared log and visible to everyone it is shared with.'},()=>{})}catch(e){}}
async function names(ids){const out={};if(!CAP.user||!CAP.user.profiles||!ids.length)return out;try{const p=await CAP.user.profiles(ids);ids.forEach(i=>out[i]=(p[i]&&p[i].name)||'')}catch(e){}return out}
async function renderFeed(){
  const el=$('#feed');if(!el)return;
  if(!CAP.db){el.innerHTML=`<p class="loading" style="margin:0">Submitted reports are reviewed on GitHub: <a href="https://github.com/${CONFIG.issuesRepo}/issues?q=label%3Afield-report" target="_blank" rel="noopener">see the open field reports ↗</a>.</p>`;return}
  const t=$('#rf-type').value,s=$('#rf-state').value;const L=REPORTS.filter(r=>(!t||r.type===t)&&(!s||(r.state||'').includes(s))).slice(0,60);
  const nm=await names([...new Set(L.map(r=>r.author).filter(Boolean))]);
  el.innerHTML=L.length?L.map(r=>`<div class="rep"><div class="h"><span class="typechip">${esc(r.type)}</span><span>${esc(r.date||'')}</span><a href="#${esc(r.site)}">${esc(r.siteName||r.site)}</a><span>${esc(r.state||'')}</span><span>· unverified</span></div><b>${esc(r.title)}</b>${r.body?`<p>${esc(r.body)}</p>`:''}<div class="h" style="margin-top:6px">${nm[r.author]?esc(nm[r.author]):'A contributor'}${r.org?' · '+esc(r.org):''}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">evidence ↗</a>`:''}</div></div>`).join(''):'<p class="loading" style="margin:0">No reports yet. The first one you publish will appear here.</p>';
}
function renderSiteReports(f){const el=$('#sh-reports');if(!el)return;const L=REPORTS.filter(r=>r.site===f.i);el.innerHTML=L.length?`<h3>Field reports (${L.length})</h3>${L.slice(0,5).map(r=>`<div class="rep" style="margin-top:6px"><div class="h"><span class="typechip">${esc(r.type)}</span><span>${esc(r.date||'')}</span><span>· unverified</span></div><b>${esc(r.title)}</b>${r.body?`<p>${esc(r.body.slice(0,300))}</p>`:''}</div>`).join('')}`:''}
function renderWatch(){const el=$('#watch');if(!el)return;const w=watchlist().map(i=>BY[i]).filter(Boolean);
  el.innerHTML=w.length?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Site</th><th>State</th><th>Level</th><th class="n">GBIF species</th></tr></thead><tbody>${w.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td>${esc(f.s)}</td><td>${f.v}</td><td class="n">${f.gb?fmt.format(f.gb[1]):'–'}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:8px"><button class="btn sm" id="dl-watch" type="button">Download watchlist CSV</button></div>`:'<p class="loading" style="margin:0">Open any site on the map and press “Watch” to add it here.</p>';
  $$('#watch tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  if($('#dl-watch'))$('#dl-watch').onclick=()=>saveFile('watchlist.csv',toCSV(w.map(exportRow)),'text/csv');}

/* ---------- data & sources view ---------- */
function exportRow(f){return{id:f.i,wdpa_id:f.w||'',name:f.n,category:CATS[f.c],state:f.s,lga:f.l||'',lat:f.la??'',lon:f.lo??'',area_ha_gis:f.a||'',area_ha_reported:f.ar||'',area_ha_fao1998:f.fh||'',year:f.y||'',iucn:f.u||'',verification_level:f.v,eco_zone_inferred:f.z?ZONES[f.z].n:'',vegetation:f.veg||'',flora:f.flora||'',fauna:f.fauna||'',resources:f.res||'',tourism:f.tour||'',threats:f.thr||'',notes:f.notes||'',gbif_records:f.gb?f.gb[0]:'',gbif_species:f.gb?f.gb[1]:'',visitor_readiness:f.vis?f.vis.visitor_readiness||'':'',sources:(f.src||[]).join(' | ')}}
function buildData(){
  const unm=F.filter(f=>f.la==null);const byS={};unm.forEach(f=>(byS[f.s||'Unknown']=byS[f.s||'Unknown']||[]).push(f.n));
  const dsCite=`Nigeria Forest Reserves Atlas (2026). Nigeria forest reserves and protected areas dataset, version ${DATA.meta.version} [Data set]. ${CONFIG.siteUrl}. Includes data from UNEP-WCMC and IUCN (2026), Protected Planet: The World Database on Protected Areas (WDPA), accessed ${DATA.meta.wdpa_access}, Cambridge, UK: UNEP-WCMC and IUCN, www.protectedplanet.net.`;
  const SRC=[
   ['World Database on Protected Areas (UNEP-WCMC & IUCN)','960 Nigerian records: names, designations, boundaries, IUCN categories, status years','Primary spatial backbone','https://www.protectedplanet.net/country/NGA','Non-commercial use with attribution (WDPA terms)'],
   ['geoBoundaries (William & Mary geoLab)','State (ADM1) and LGA (ADM2) boundaries for assigning sites and computing state areas','All sites','https://www.geoboundaries.org','CC BY 4.0'],
   ['FAO, Forest Resource Situation Assessment of Nigeria (Beak Consultants, 1998), Table 18','Gazetted forest reserves and areas in the high-forest states, with management units','103 reserve entries; areas shown as “FAO 1998”','https://www.fao.org/4/ab578e/AB578E10.htm','FAO document'],
   ['Federal Surveys of Nigeria (1966), “Nigeria: Forest Reserves” map, via ESDAC/EUDASM','Historical national map of reserves at the time of gazettement','Reference for checking names and historic extents; not digitised here','https://esdac.jrc.ec.europa.eu/content/nigeria-forest-reserves','EUDASM archive'],
   ['Royal Museum for Central Africa, “Forest reserves in Northern Nigeria” (1:3,000,000)','Historical general map of northern reserves','Reference only; © RMCA','https://geocatalogue.africamuseum.be/geonetwork/srv/api/records/BE-RMCA-EARTHS-040026','© RMCA'],
   ['“Map of Forest Reserves in Nigeria” (ResearchGate, 2020)','Academic GIS map of reserve locations and land mass','Reference for cross-checking','https://www.researchgate.net/publication/338969530_MAP_OF_FOREST_RESERVES_IN_NIGERIA','Author’s rights'],
   ['Sambus Geospatial Open Data, “Nigeria Forest”','757 polygons. Checked: this is an OpenStreetMap forest-cover extract (landuse=forest), not a reserve register, and carries no licence','Not used for reserve records','https://opendata.sambusgeospatial.com/datasets/nigeria-forest/about','No licence stated'],
   ['Ramsar Sites Information Service; UNESCO Man and the Biosphere; BirdLife / Key Biodiversity Areas','Designations, site descriptions, species and threats','Ramsar, biosphere and KBA sites','https://rsis.ramsar.org','Per source'],
   ['National Park Service of Nigeria and federal announcements','National park list, upgrades approved 2023–2025, visitor information','National parks','https://nigeriaparkservice.gov.ng','Public information'],
   ['State forestry laws and schedules, theses, journal papers, news reports','Reserve names, areas, gazettement years, species, threats','Cited on each profile','#map','Per source'],
   ['GBIF.org occurrence API','Biodiversity record and species counts per site (snapshot) and live species lists','All mapped sites','https://www.gbif.org','Per dataset licence (CC0 / CC BY / CC BY-NC)'],
   ['FAO FRA 2025 / UN SDG Global Database; Global Forest Watch (Hansen/UMD); Protected Planet country statistics','National forest area, tree cover loss, protected-area coverage','Statistics page','https://unstats.un.org/sdgs/dataportal','Per source'],
   ['Live services on the hosted site','iNaturalist (species photos), Wikimedia Commons (photos), Open-Meteo (weather), CARTO / Esri / OpenTopoMap / NASA GIBS (basemaps), Hansen GFC v1.12 (forest-loss tiles)','On demand','https://www.inaturalist.org','Per service terms']];
  $('#data').innerHTML=`<h2 class="title">Data, sources and method</h2><p class="lede">This atlas joins the official global protected-area register with national inventories, state laws, scientific literature and field reports, and records where every fact came from. It is built to be checked, cited and corrected.</p>
  <h3>Download the dataset</h3><p>${fmt.format(F.length)} records, version ${esc(DATA.meta.version)}, compiled ${esc(DATA.meta.compiled)}. CSV opens in Excel or R; GeoJSON opens in QGIS, ArcGIS and most web maps.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="dl-csv" type="button">Download CSV</button><button class="btn" id="dl-geo" type="button">Download GeoJSON</button><button class="btn" id="dl-cite" type="button">Copy dataset citation</button></div>
  <pre class="cite" style="margin-top:10px">${esc(dsCite)}</pre>
  <h3>Sources</h3><div class="tbl-wrap" style="max-height:none"><table class="dt srctbl"><thead><tr><th>Source</th><th>What it provides</th><th>Used for</th><th>Licence / terms</th></tr></thead><tbody>${SRC.map(s=>`<tr><td><a href="${esc(s[3])}" ${s[3].startsWith('#')?'':'target="_blank" rel="noopener"'}>${esc(s[0])}</a></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td>${esc(s[4])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Verification levels</h3><ul>${Object.entries(LEVELS).map(([k,v])=>`<li><b>Level ${k}</b> (${F.filter(f=>f.v===k).length} records): ${esc(v)}</li>`).join('')}</ul>
  <h3>Method</h3><ul>
   <li>WDPA records were matched to compiled lists by normalised name and distance. Where a national park was created from an existing reserve, the record carries the new designation and notes the old one.</li>
   <li>Each site is assigned to a state and LGA by where the centre of its boundary falls (geoBoundaries). Sites on a boundary are counted in each state named.</li>
   <li>Areas are shown side by side: calculated from the WDPA polygon, as gazetted or reported, and as listed by FAO in 1998. Differences are normal and reflect survey dates and excisions.</li>
   <li>Ecological zones are inferred from location and the main highland blocks. Zone text is labelled as inferred and never replaces site-specific evidence.</li>
   <li>GBIF counts use each site’s bounding box, so they can include records just outside irregular boundaries. They show where data exist, not true species richness.</li>
   <li>Boundaries are simplified to about 1 km for display. Use the WDPA originals for area statistics in publications.</li></ul>
  <h3>Updates</h3><p>On the hosted website, species lists, photographs, weather, NASA daily imagery and the forest-loss layer are fetched live each time a profile opens. The core dataset is rebuilt by a scheduled job that re-reads the WDPA and GBIF, and field reports are reviewed before corrections are merged. Each release is versioned; cite the version you used.</p>
  <h3>Known gaps</h3><p>Published counts suggest some states have more reserves than appear here: Benue reports about 52, Nasarawa about 41, Gombe 32 (state committee, 2026) and Enugu about 20. Imo, Abia and Lagos lists are thin. These ${unm.length} names are recorded but not yet located:</p>
  <div class="gaplist">${Object.entries(byS).sort().map(([s,ns])=>`<b>${esc(s)}</b>${ns.map(esc).join(' · ')}`).join('')}</div>
  <h3>Corrections</h3><p>Forestry departments, researchers and rangers can send corrections through the NGO hub (choose “Data correction”) or on <a href="https://github.com/${CONFIG.issuesRepo}/issues" target="_blank" rel="noopener">GitHub</a>. Please include a source.</p>`;
  $('#dl-csv').onclick=()=>saveFile('nigeria_protected_areas.csv',toCSV(F.map(exportRow)),'text/csv');
  $('#dl-geo').onclick=()=>saveFile('nigeria_protected_areas.geojson',JSON.stringify({type:'FeatureCollection',features:F.map(f=>({type:'Feature',properties:exportRow(f),geometry:f.g?{type:'MultiPolygon',coordinates:f.g}:f.la!=null?{type:'Point',coordinates:[f.lo,f.la]}:null}))}),'application/geo+json');
  $('#dl-cite').onclick=()=>copy(dsCite);
}

</script>
</body>
</html>
