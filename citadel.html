<title>Citadel: academic writing, made clear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400;1,7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#15302D; --ink2:#4B605C; --line:#D3DCD8;
  --accent:#1D5C55; --accent-ink:#FFFFFF; --hl:#F6DC4A; --hl-ink:#1B1A0C; --red:#B3322A; --ok:#2B7A4B;
  --soft:#E6EDEA; --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111918; --surface:#182321; --ink:#E4EDEA; --ink2:#9DB1AC; --line:#2B3B38;
    --accent:#6DBFB2; --accent-ink:#0E1B19; --hl:#E2C73A; --hl-ink:#1B1A0C; --red:#E26A5E; --ok:#62BD86; --soft:#1F2D2A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111918; --surface:#182321; --ink:#E4EDEA; --ink2:#9DB1AC; --line:#2B3B38;
  --accent:#6DBFB2; --accent-ink:#0E1B19; --hl:#E2C73A; --hl-ink:#1B1A0C; --red:#E26A5E; --ok:#62BD86; --soft:#1F2D2A;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
img{max-width:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5rem}
h2{font-size:1.6rem;font-weight:600;margin-top:2.5rem}
h3{font-size:1.15rem;font-weight:600}
p{margin:.4rem 0 .8rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-top:.7rem;padding-bottom:.7rem;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;font-size:1.35rem;display:flex;align-items:baseline;gap:.35rem;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.brand sup{font-family:var(--sans);font-size:.7rem;background:var(--hl);color:var(--hl-ink);padding:0 .3rem;border-radius:3px;font-weight:700}
.stat{display:flex;align-items:center;gap:.6rem;margin-left:auto;font-size:.92rem}
.xpbar{width:130px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--hl);transition:width .5s}
.pill{border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;white-space:nowrap}
.theme{background:none;border:1px solid var(--line);border-radius:6px;padding:.2rem .5rem;cursor:pointer}
nav.tabs{border-bottom:1px solid var(--line);background:var(--paper)}
nav.tabs .wrap{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.7rem .8rem;cursor:pointer;white-space:nowrap;color:var(--ink2)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding-bottom:4rem}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem 1rem;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:.3rem .65rem;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:2rem;padding:2.5rem 0 1rem;align-items:end}
.hero h1{font-size:clamp(2.3rem,5.5vw,4rem);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.hero h1 .cite{display:none;font-family:var(--sans);font-size:.32em;vertical-align:super;background:var(--hl);color:var(--hl-ink);padding:.05em .35em;border-radius:3px;font-weight:700;letter-spacing:0}
.hero p.lede{max-width:56ch;color:var(--ink2);font-size:1.1rem}
.rank{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:1.2rem}
.rank .name{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.rank .meta{color:var(--ink2);font-size:.95rem}

/* reference-list path */
ol.path{list-style:none;padding:0;margin:1rem 0;border-top:1px solid var(--line)}
ol.path li{display:grid;grid-template-columns:3.4rem 1fr auto;gap:.8rem;padding:1rem 0;border-bottom:1px solid var(--line);align-items:start}
ol.path .n{font-family:var(--serif);font-weight:600;color:var(--ink2);font-size:1.1rem}
ol.path .entry{font-family:var(--serif);font-size:1.08rem;line-height:1.6}
ol.path .entry b{font-weight:600}
ol.path .entry .desc{display:block;font-family:var(--sans);color:var(--ink2);font-size:.95rem;margin-top:.2rem}
ol.path li.locked .entry{opacity:.5}
.stars{letter-spacing:.1em;color:var(--ink2);font-size:1.05rem;white-space:nowrap}
.stars .on{color:#C99A06}
:root[data-theme="dark"] .stars .on{color:var(--hl)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars .on{color:var(--hl)}}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.badge{border:1px dashed var(--line);border-radius:10px;padding:.8rem;color:var(--ink2);font-size:.92rem}
.badge b{display:block;font-family:var(--serif);color:var(--ink);font-size:1rem}
.badge.got{border-style:solid;border-color:var(--accent);background:var(--surface)}
.badge.got b::before{content:"✦ ";color:var(--accent)}

/* play */
.play{max-width:760px;margin:0 auto;padding-top:1.5rem}
.playbar{display:flex;gap:1rem;align-items:center}
.prog{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .4s}
.count{color:var(--ink2);font-size:.9rem;white-space:nowrap}
.lvltitle{margin-top:1.5rem;font-size:1.25rem;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.q{font-family:var(--serif);font-size:1.2rem;line-height:1.5;margin-top:0}
.opts{display:grid;gap:.6rem}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:.8rem 1rem;cursor:pointer;line-height:1.45}
.opt:hover{border-color:var(--ink2)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--red)}
.item{font-family:var(--serif);font-size:1.3rem;padding:1.2rem;border-left:5px solid var(--hl);background:var(--paper);border-radius:0 8px 8px 0;margin:1rem 0}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.answer,.pool{min-height:3.2rem;display:flex;flex-wrap:wrap;gap:.45rem;padding:.6rem;border-radius:10px}
.answer{border:2px dashed var(--line);margin-bottom:.8rem;font-family:var(--serif)}
.answer .ph{color:var(--ink2);font-style:italic;font-family:var(--sans)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:.35rem .6rem;cursor:pointer;font-family:var(--serif);font-size:1rem;line-height:1.35}
.answer .chip{background:var(--soft)}
.sentence{font-family:var(--serif);font-size:1.25rem;line-height:2.4;display:flex;flex-wrap:wrap;align-items:center}
.gap{width:1.1rem;height:1.9rem;border:0;background:transparent;cursor:pointer;position:relative;padding:0;margin:0 .05rem}
.gap::after{content:"";position:absolute;left:50%;top:15%;bottom:15%;border-left:2px dotted var(--line)}
.gap:hover::after{border-left-color:var(--accent)}
.gap.sel{width:auto;padding:0 .4rem}
.gap.sel::after{display:none}
.gap .ins{font-family:var(--sans);font-size:.95rem;background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:.1rem .35rem;white-space:nowrap}
.gap.good .ins{background:var(--ok);color:#fff}
.src{border-left:4px solid var(--accent);padding:.6rem 1rem;background:var(--paper);font-family:var(--serif);border-radius:0 8px 8px 0}
.src small{display:block;font-family:var(--sans);color:var(--ink2);margin-top:.4rem}
textarea,input[type=text],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .7rem}
textarea{min-height:8rem;resize:vertical;line-height:1.55}
label{display:block;font-size:.9rem;color:var(--ink2);margin:.6rem 0 .2rem}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.8rem 0}
.meter div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.6rem}
.meter b{font-family:var(--serif);font-size:1.4rem;display:block}
.meter span{font-size:.85rem;color:var(--ink2)}
.meter .bad b{color:var(--red)} .meter .good b{color:var(--ok)}
.seg{display:inline;background:none;border:0;padding:.1rem .15rem;font-family:var(--serif);font-size:1.12rem;line-height:1.9;text-align:left;cursor:pointer;border-radius:4px}
.seg:hover{background:var(--soft)}
.seg.sel{background:var(--hl);color:var(--hl-ink)}
.seg.miss{box-shadow:inset 0 -3px 0 var(--red)}
.seg.lines{display:block;width:100%;padding:.5rem .6rem;padding-left:2.5rem;text-indent:-2rem;margin-bottom:.2rem}
.fb{margin-top:1rem;padding:1rem 1.2rem;border-radius:10px;border-left:5px solid var(--ok);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fb.no{border-left-color:var(--red)}
.fb strong{font-family:var(--serif);font-size:1.15rem}
.fb.no strong{color:var(--red)} .fb.ok strong{color:var(--ok)}
.fb .why{font-family:var(--serif);font-style:italic}
.fb ul{margin:.4rem 0;padding-left:1.2rem}
.actions{display:flex;justify-content:flex-end;margin-top:1rem}
.result{text-align:center;padding:2.5rem 1rem}
.result .big{font-size:3rem;letter-spacing:.15em}

/* panels */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.25rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.reflist{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}
.reflist li{border-bottom:1px solid var(--line)}
.reflist button{display:block;width:100%;text-align:left;background:none;border:0;padding:.7rem .5rem;cursor:pointer;border-radius:6px}
.reflist button:hover{background:var(--soft)}
.reflist button[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.reflist .t{font-family:var(--serif);font-weight:600;display:block}
.reflist .m{font-size:.85rem;color:var(--ink2)}
.flag{font-size:.75rem;border-radius:4px;padding:0 .35rem;margin-left:.3rem;background:var(--red);color:#fff;white-space:nowrap}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-right:.25rem;white-space:nowrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
.formgrid .full{grid-column:1/-1}
.bib{font-family:var(--serif);line-height:1.7}
.bib p{padding-left:2rem;text-indent:-2rem;margin:.3rem 0 .6rem}
.health{list-style:none;padding:0;margin:.5rem 0;font-size:.92rem}
.health li{padding:.25rem 0 .25rem 1.3rem;position:relative}
.health li::before{content:"✎";position:absolute;left:0;color:var(--red)}
.health li.okk::before{content:"✓";color:var(--ok)}
.empty{padding:2rem 1rem;text-align:center;color:var(--ink2)}
.preview{font-family:var(--serif);line-height:1.75;font-size:1.05rem}
.preview mark.claim{background:transparent;box-shadow:inset 0 -2px 0 var(--red);color:inherit;cursor:help}
.preview .cit{background:var(--soft);border-radius:3px;padding:0 .15rem}
.preview .missing{color:var(--red);font-weight:700}
.notes{font-size:.92rem;color:var(--ink2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--serif);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.linklist{list-style:none;padding:0;margin:0}
.linklist li{padding:.5rem 0;border-bottom:1px solid var(--line)}
.linklist a{font-weight:700}
.linklist span{display:block;font-size:.92rem;color:var(--ink2)}
.tips{counter-reset:t;list-style:none;padding:0}
.tips li{counter-increment:t;padding:.7rem 0 .7rem 2.6rem;position:relative;border-bottom:1px solid var(--line)}
.tips li::before{content:"[" counter(t) "]";position:absolute;left:0;font-family:var(--serif);color:var(--ink2)}
.stylebox{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem;background:var(--surface)}
.stylebox h3{font-size:1rem;margin-bottom:.2rem}
.stylebox .bib p{margin:.2rem 0}
.stylebox .it{font-size:.92rem;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:10px;transition:transform .3s;z-index:50;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:640px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.howto{background:var(--soft);border-radius:8px;padding:.5rem .8rem;font-size:.93rem;color:var(--ink2);margin:.4rem 0 .8rem}
.howto-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;margin:.6rem 0 1rem;max-width:80ch}
.howto-box summary{cursor:pointer;font-weight:700}
.howto-box p{color:var(--ink2);font-size:.95rem}
.opt .key{display:inline-block;min-width:1.5rem;margin-right:.5rem;font-size:.8rem;color:var(--ink2);border:1px solid var(--line);border-radius:4px;text-align:center}
.lesson{border-left:6px solid var(--hl);padding:1.8rem}
.lesson h3{font-size:1.6rem}
.lesson p{font-family:var(--serif);font-size:1.2rem;line-height:1.6;max-width:60ch}
.flashcard{width:100%;min-height:15rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.6rem;cursor:pointer;font-family:var(--serif);font-size:1.15rem;margin-top:.5rem}
.flashcard h3{font-size:1.6rem}
.flashcard p{max-width:52ch;line-height:1.6}
.hub .panel{display:flex;flex-direction:column;align-items:flex-start}
.hub .panel .btn{margin-top:auto}
#daily{display:inline-flex;align-items:center;gap:.3rem}
.preview mark.qnote{background:transparent;color:inherit;text-decoration:underline wavy #C99A06;text-underline-offset:4px;cursor:help}
.revnotes{list-style:none;padding:0;margin:.4rem 0;font-size:.92rem}
.revnotes li{padding:.35rem 0 .35rem 1.4rem;position:relative;border-bottom:1px solid var(--line)}
.revnotes li::before{content:"✎";position:absolute;left:0;color:#C99A06}
.revnotes .snip{display:block;color:var(--ink2);font-family:var(--serif);font-style:italic}
.phr{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.phr button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.2rem .65rem;cursor:pointer;font-size:.9rem}
.phr button:hover{border-color:var(--accent)}
table.matrix td{min-width:10rem}
.matrix .cell{min-height:2.6rem;padding:.35rem;border:1px dashed var(--line);border-radius:6px;font-size:.92rem}
.matrix .cell:focus{border-style:solid;border-color:var(--accent);outline:none}
dialog{max-height:90vh;overflow:auto}
.checklist label{display:flex;gap:.6rem;align-items:flex-start;color:var(--ink);font-size:.95rem;margin:.35rem 0}
.checklist input{margin-top:.3rem}
.cert{border:3px double var(--accent);border-radius:6px;padding:2rem 1.5rem;text-align:center;background:var(--surface);font-family:var(--serif);max-width:640px;margin:1rem auto}
.gl{border-bottom:2px dotted var(--accent);cursor:help}
.gl:focus-visible{outline:3px solid var(--hl)}
.confrow{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.confrow .notes{margin-right:.2rem}
.calib{background:var(--soft);border-radius:8px;padding:.6rem .9rem;margin:.8rem auto;max-width:52ch;font-size:.95rem}
.cert .nm{font-size:1.8rem;border-bottom:1px solid var(--line);display:inline-block;padding:0 1.2rem;margin:.8rem 0}
@media (max-width:820px){
  .stat{flex-wrap:wrap;margin-left:0}
  .confrow{justify-content:flex-start}
  .hero,.split{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .xpbar{width:80px}
  .bins{grid-template-columns:1fr}
  .meter{grid-template-columns:1fr 1fr 1fr}
  ol.path li{grid-template-columns:2.6rem 1fr}
  ol.path li .go{grid-column:2}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sitefoot{border-top:1px solid var(--line);margin-top:2rem;padding:1.5rem 0 2.5rem;color:var(--ink2);font-size:.92rem}
.sitefoot .wrap{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between}
.sitefoot p{margin:.2rem 0}
.hero h1{max-width:18ch}
.eyebrow{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 .4rem}
.brand-sub{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink2);letter-spacing:0}
#destSel{width:auto;max-width:12rem;padding:.25rem .5rem;font-size:.9rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rb{margin:.7rem 0}.rb span{display:block;font-size:.9rem;color:var(--ink2)}.rb b{font-family:var(--serif);font-size:1.15rem}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:.3rem}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
ol.journey{list-style:none;padding:0;margin:1rem 0;display:grid;gap:.8rem}
ol.journey li{display:grid;grid-template-columns:2.6rem 1fr;gap:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
ol.journey h3{margin:.1rem 0 .3rem;font-size:1.15rem}.when{font-family:var(--sans);font-weight:400;font-size:.85rem;color:var(--ink2);margin-left:.4rem;white-space:nowrap}
ol.journey p{margin:.2rem 0 .6rem;color:var(--ink2);max-width:70ch}
.jn{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--serif)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.seg{display:inline-flex;gap:.3rem;flex-wrap:wrap;margin:.4rem 0}
.wrapseg{display:flex}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.92rem}

<script type="application/json" id="rdata">{"checked": "2026-10-07", "modules": [{"id": "teaching", "title": "How postgraduate teaching works", "goals": ["Describe the jobs that lectures, seminars, tutorials and labs do in UK, Canadian, US and Australian universities.", "Turn credits and contact hours into a realistic weekly study plan.", "Handle long reading lists without trying to read every word.", "Use office hours and participation to your advantage instead of fearing them."], "lessons": [{"t": "From the front of the room to the middle of the table", "b": "In many universities in Nigeria, Ghana, Kenya, India or Pakistan, the lecturer is the main source of knowledge. You copy the notes, learn them well and reproduce them in the exam. Postgraduate teaching in the UK, Canada, the US and Australia works differently. A lecture gives you a map of the topic, and the real learning happens in what you do before and after it: reading, discussion, writing and asking questions. Tutors expect you to come to class already prepared and to form your own view. Nobody will check every week that you did the reading, but you will feel it in seminars and in your marks if you did not. This is not a sign that teachers care less. It is a different idea of what a postgraduate is: a junior colleague, not a pupil."}, {"t": "Lectures, seminars, tutorials and labs", "b": "Each teaching format has a different purpose. In a lecture, an academic introduces new ideas to a large group. UCL describes lectures of 20 to 350 students. Seminars are smaller, around 5 to 30 students, and are built around discussion of readings you prepared in advance. Tutorials can be one-to-one or very small groups. Labs, studios and field trips are where you practise methods. In the US and Canada, a \"seminar\" course may be the whole class, meeting once a week for three hours around readings. In Australia, the small-group class is usually called a tutorial. Whatever the name, ask yourself one question before each session: \"What am I supposed to bring?\" For a lecture it may be nothing. For a seminar it is usually notes on the readings and one or two points you want to raise."}, {"t": "Few contact hours does not mean a light week", "b": "Many students are surprised by how empty their timetable looks. Prospects, the UK graduate careers service, says a UK master's often has fewer than ten hours of contact time a week, with at least 30 to 35 hours of independent study expected on top. If you are used to 25 hours of classes at home, ten hours can feel like a holiday. It is not. Independent study means reading, writing notes, doing problem sets, preparing seminar points, planning assignments and working on your dissertation. Treat your degree like a full-time job. A useful habit is to block your week: classes in one colour, fixed reading and writing time in another, paid work and rest in a third. If the \"study\" blocks keep disappearing, that is your early warning."}, {"t": "Reading credits like a timetable", "b": "Credits tell you how much work a course is expected to take. In the UK, a master's degree is normally 180 credits. Aberystwyth University explains that a 10-credit module carries a notional workload of about 100 hours, including teaching, independent study and assessment, so a full master's is roughly 1,800 hours of work. In the US, EducationUSA explains that each course is given a credit value based on how many hours a week the class meets. Canadian universities usually use a similar course-credit model, and Australian universities use credit points or units of credit. The numbers differ, but the logic is the same. Look at your programme handbook, find the credit value of each course, and multiply. If a 15-credit UK module suggests about 150 hours, and you have spent 30 by week six, you are behind."}, {"t": "Handling the reading list", "b": "Postgraduate reading lists can be long, and few people read every item from start to finish. Check whether the list marks items as \"essential\", \"core\" or \"recommended\". Read essential items properly. For the rest, skim first: read the abstract, introduction, headings and conclusion, then decide whether the source deserves a full reading. Curtin University's reading guidance calls this moving from skimming to scanning to intensive reading. Keep short notes for every reading: the main argument, the evidence, one strength, one weakness and how it links to your course. These notes become the raw material for seminars and essays. If English is your second or third language, reading speed will improve with practice. Text-to-speech tools and reading the figures and tables first can help in the early weeks."}, {"t": "Office hours: the free tutorial most students skip", "b": "Office hours are times when lecturers or teaching assistants are available to meet students outside class. McGill University describes them as a chance to ask about concepts, assignments and anything not answered in class. Some instructors run drop-in hours, while others ask you to book by email. Many international students avoid them because at home a visit to a lecturer's office might mean you are in trouble, or because they worry about wasting a senior person's time. In these systems, staff expect students to come. Prepare a short list of questions, bring your draft or notes, and arrive on time. A question like \"I am planning to argue X in my essay. Does this answer the question?\" is ideal. Go early in the term, not the night before a deadline."}, {"t": "Participation is part of the grade", "b": "In many courses, talking in class is not optional. EducationUSA notes that US course grades can include class participation alongside attendance, quizzes, exams, papers and projects. UK and Australian seminars may not always carry marks, but tutors notice who contributes, and some courses assess presentations or discussion. Murdoch University describes Australian classrooms as places where students are treated as equals and encouraged to question ideas, even their teacher's. For students raised to respect elders and not challenge a teacher in public, this can feel uncomfortable. Remember that disagreeing with an argument is not disrespecting a person. Good participation also includes listening, building on a classmate's point and asking a clear question. Module 7 gives practical phrases you can use."}, {"t": "Course outlines, taught degrees and research degrees", "b": "Every course has a syllabus, course outline or module handbook. Treat it as a contract. It lists learning outcomes, weekly topics, readings, assessment weights, deadlines, late-work rules and the rules on generative AI. Read it in week one and put every deadline into your calendar. Also know what kind of degree you are on. A UK taught master's usually lasts one year and ends with a dissertation. EducationUSA notes that US master's programmes are often about two years and US doctorates about five to eight years. In Canada, many master's programmes come in thesis-based and course-based versions, and the expectations for independence and supervision are quite different. Australian research degrees are mainly supervised research with little coursework. Knowing your degree type tells you where your time should go."}], "checks": [{"q": "A UK master's has fewer than ten contact hours a week. What does this usually mean?", "o": ["The course is part-time", "Attendance is optional", "You are expected to do a large amount of independent study", "Exams will be easy"], "a": 2, "why": "UK guidance expects roughly 30 to 35 hours of independent study a week on top of contact time."}, {"q": "Roughly how many hours of work does a 10-credit UK module represent?", "o": ["10 hours", "About 100 hours", "About 30 hours", "About 1,000 hours"], "a": 1, "why": "UK credit frameworks use about 10 notional hours per credit, including teaching, study and assessment."}, {"q": "What is the main purpose of a seminar?", "o": ["To discuss readings you prepared in advance", "To sit a short test", "To copy notes from the lecturer", "To collect handouts"], "a": 0, "why": "Seminars are small-group discussions based on preparation done beforehand."}, {"q": "Your lecturer lists office hours on the syllabus. What is the best use of them?", "o": ["Only go if you are in trouble", "Avoid them because staff are too busy", "Ask the lecturer to write your essay plan", "Bring prepared questions about concepts or your assignment plan"], "a": 3, "why": "Office hours are meant for students to get help; preparation makes the time useful."}, {"q": "Where should you first look for deadlines, assessment weights and AI rules for a course?", "o": ["WhatsApp group of classmates", "The university homepage", "The course syllabus, outline or handbook", "Your sponsor"], "a": 2, "why": "The course outline is the official statement of how the course runs and is assessed."}, {"q": "A reading list has 40 items. What is a sensible strategy?", "o": ["Read every item word by word", "Read essential items fully and skim the rest to decide what deserves a full read", "Read nothing until the exam", "Only read items published in your home country"], "a": 1, "why": "Skimming, then scanning, then intensive reading saves time without losing key ideas."}], "checklist": ["Download every course outline and highlight learning outcomes, assessments and deadlines.", "Put all deadlines into one calendar with reminders one week and two days before.", "Work out the expected hours for each course from its credit value.", "Block fixed independent study time in your weekly timetable.", "Find each instructor's office hours and booking method.", "Visit at least one office hour in the first four weeks.", "Start a reading log: argument, evidence, strength, weakness, link to course."], "links": [{"t": "Prospects: What is a Masters degree? (UK credits, contact and study hours)", "u": "https://www.prospects.ac.uk/postgraduate-study/masters-degrees/what-is-a-masters-degree"}, {"t": "UCL: Things you need to know about studying in the UK for the first time", "u": "https://www.ucl.ac.uk/students/news/2020/dec/things-you-need-know-about-studying-uk-first-time"}, {"t": "EducationUSA: U.S. educational system FAQs", "u": "https://educationusa.state.gov/experience-studying-usa/us-educational-system/frequently-asked-questions-faqs"}, {"t": "McGill University: Office hours", "u": "https://www.mcgill.ca/student-learning-resources/build-academic-connections/office-hours"}, {"t": "Murdoch University: Australian academic culture", "u": "https://www.murdoch.edu.au/news/blogs/blog-posts/making-the-move-to-murdoch-and-perth/australian-academic-culture"}, {"t": "Curtin University: Reading strategies", "u": "https://uniskills.library.curtin.edu.au/academic-writing/reading-and-note-taking/reading-strategies/"}]}, {"id": "grading", "title": "Grading and assessment", "goals": ["Read UK, US, Canadian and Australian marks correctly and know what counts as good.", "Use rubrics and feedback to improve your next assignment.", "Know what to do if illness or a crisis affects an assessment.", "Understand resits, incompletes and appeals before you ever need them."], "lessons": [{"t": "UK: Distinction, Merit, Pass", "b": "UK taught master's degrees are usually classified on the overall average mark. At the University of Bristol, for example, 70 or above is a Distinction, 60 to 69 a Merit, 50 to 59 a Pass, and below 50 a Fail. The average is weighted by credits, so a 60-credit dissertation counts much more than a 15-credit module. Students from systems where 70 percent is an ordinary score are often shocked to learn that 70 is excellent in the UK. In many essay-based subjects, marks above 80 are given only for outstanding work. A 65 is a solid, respectable mark, not a failure. Do not compare UK percentages directly with marks from home. Instead, read the marking criteria for each band and aim at the descriptions, not the number. Always check your own university's regulations, because rules on compensation and borderlines vary."}, {"t": "US: letter grades and GPA", "b": "US universities use letter grades that convert to grade points. EducationUSA lists A as 4.0, B as 3.0, C as 2.0, D as 1.0 and F as 0, and many schools also use plus and minus grades. Your grade point average, or GPA, is the credit-weighted average of these points. At graduate level, the bar is higher than for undergraduates. The University of Hawai'i at Manoa, for example, requires graduate students to keep a cumulative GPA of at least 3.0. Falling below it leads to academic probation, and failing to recover can end enrolment. Some programmes also say that grades below B or B- do not count towards the degree. So in a US graduate programme, a C is not a comfortable pass. It is a warning sign that should send you to the instructor quickly."}, {"t": "Canada: percentages, letters and different scales", "b": "Canada has no single national grading scale. Universities use percentages, letter grades, or 4.0, 4.3 or 9-point scales, and the rules for graduate students are stricter than for undergraduates. At the University of Toronto, a B- (70 percent) is the minimum passing grade for a graduate course. At the University of British Columbia, a master's student needs 60 percent to pass a course, but only 6 credits at that level can count towards the degree. All other courses need at least 68 percent, and too many marks between 60 and 67 can lead to required withdrawal. The lesson is simple. Find your own school of graduate studies' rules in week one, and learn the minimum grade for your programme. A mark that looks like a pass at home may not keep you in good standing."}, {"t": "Australia: HD, D, CR, P", "b": "Most Australian universities use a band system. At the University of Sydney, High Distinction is 85 to 100, Distinction 75 to 84, Credit 65 to 74, Pass 50 to 64, and Fail below 50. Universities also calculate a Weighted Average Mark, or WAM, across your units, and some use a Grade Point Average as well. A Credit is a good mark, and High Distinctions are reserved for exceptional work. Scholarships, honours-style research pathways and some employers look at your WAM, so it is worth understanding how it is calculated at your university. Like the UK, Australian marking is criteria-based. Each band describes the standard expected, so reading the descriptor for HD and D tells you what lecturers are looking for. Check your unit outline for the exact scale, because faculties sometimes add their own rules."}, {"t": "Essays, exams, dissertations and rubrics", "b": "Postgraduate assessment uses many formats: essays, reports, exams, presentations, group projects, lab work, reflective logs and a dissertation or thesis. Each comes with marking criteria or a rubric, a grid that describes what work looks like at each level. Use the rubric before you write, not after. For example, if the top band says \"critically evaluates a wide range of sources\", a descriptive summary of three textbooks will not reach it however well you write. Underline the instruction words in the question, such as \"evaluate\" or \"compare\". A good habit is to mark your own draft against the rubric two days before the deadline and fix the weakest area. Dissertations are marked on similar criteria plus method, structure and originality. Ask your supervisor which criteria students most often miss."}, {"t": "Using feedback", "b": "Written feedback is one of the most valuable things you pay for, but many students only look at the number. Read every comment and sort it into three groups: content (ideas and evidence), structure (organisation and argument), and presentation (referencing, grammar, format). Then choose two or three actions for your next assignment. If a comment is unclear, such as \"too descriptive\" or \"needs more criticality\", book an office hour and ask for an example from your own text. Do not argue about the mark in that meeting. Ask how to improve. Keep a single document with all your feedback across courses. Patterns appear quickly. A student from Pakistan might notice, for example, that three different tutors mention long quotations. That is a clear target to work on, and Module 3 shows how."}, {"t": "Extensions and extenuating circumstances", "b": "Illness, bereavement, a family emergency or a crisis back home can affect your studies. Universities have formal processes for this, called extenuating or mitigating circumstances in the UK, special consideration in Australia, and often an \"incomplete\" grade or an accommodation in North America. The rules are strict about timing and evidence. UNSW, for example, asks students to apply within three working days of the due date, with documents showing what happened and how it affected them. Overseas medical documents need certified English translations. At Boston University, an incomplete grade requires agreement with the instructor before grades are submitted and normally must be finished within a year. Apply as soon as a problem starts, keep copies of every document, and never submit falsified evidence. That is treated as serious misconduct."}, {"t": "Late work, resits and appeals", "b": "Late submission is usually penalised. At Cardiff University, work up to 24 hours late is capped at the pass mark, and work later than that receives zero. If you fail a module, you may get a resit. In many UK universities a resit mark for postgraduates is capped at the pass mark of 50, unless your extenuating circumstances were accepted, in which case the next attempt may count as a first attempt. Some programmes limit how many credits can be resat. An academic appeal is different from a complaint about your mark. In most systems, you can appeal because of a procedural error, unknown circumstances or bias, but not simply because you disagree with the examiner's academic judgement. Appeal deadlines are short. If you are unsure, talk to your students' union advice service early."}], "checks": [{"q": "A UK master's student has a final average of 64. What is the classification at a university using the common 70/60/50 bands?", "o": ["Merit", "Distinction", "Pass", "Fail"], "a": 0, "why": "60 to 69 is a Merit under the common UK postgraduate scheme."}, {"q": "At the University of Toronto, what is the minimum passing grade for a graduate course?", "o": ["D (50%)", "C (60%)", "A- (80%)", "B- (70%)"], "a": 3, "why": "U of T graduate courses require at least B- (70%)."}, {"q": "What usually happens if a US graduate student's cumulative GPA drops below 3.0?", "o": ["Nothing", "Automatic scholarship", "Academic probation, with dismissal possible if not corrected", "Immediate graduation"], "a": 2, "why": "Graduate schools such as UH Manoa place students below 3.0 on probation and may end enrolment."}, {"q": "At the University of Sydney, which band is a mark of 78?", "o": ["High Distinction", "Distinction", "Credit", "Pass"], "a": 1, "why": "Distinction covers 75 to 84 at Sydney."}, {"q": "You are ill on the day of an assessment in Australia. What should you do?", "o": ["Apply for special consideration quickly with medical evidence", "Wait until results are released and then explain", "Ask a friend to submit for you", "Do nothing; illness is never accepted"], "a": 0, "why": "Special consideration has short deadlines, such as three working days at UNSW, and needs evidence."}, {"q": "Which is usually NOT a valid ground for a UK academic appeal?", "o": ["A procedural error", "Circumstances you could not report in time", "Evidence of bias", "Simply disagreeing with the examiner's academic judgement"], "a": 3, "why": "Appeals generally cannot challenge academic judgement itself."}, {"q": "When is the best time to use the marking rubric?", "o": ["Only after you get your mark", "Never; it is for staff only", "Before and while you write, to plan and self-check", "Only for exams"], "a": 2, "why": "Rubrics describe the standard needed, so they guide planning and self-review."}], "checklist": ["Find your programme's grading scale and minimum passing grade in the regulations.", "Note how much each assessment and the dissertation weigh in the final result.", "Download the marking criteria or rubric for every assignment.", "Self-mark each draft against the rubric before submission.", "Keep one running feedback log with actions for next time.", "Save the extenuating circumstances or special consideration procedure and its deadline.", "Know where your students' union or advice service is in case of an appeal."], "links": [{"t": "University of Bristol: Awards and classification, taught postgraduate", "u": "https://www.bristol.ac.uk/academic-quality/assessment/regulations-and-code-of-practice-for-taught-programmes/awards-pgt"}, {"t": "University of Sydney: Guide to grades", "u": "https://www.sydney.edu.au/students/guide-to-grades.html"}, {"t": "UBC Graduate School: Satisfactory progress for master's students", "u": "https://www.grad.ubc.ca/current-students/managing-your-program/satisfactory-progress-masters-students"}, {"t": "University of Hawai'i at Manoa: Graduate academic progress", "u": "https://manoa.hawaii.edu/graduate/academic-progress/index.php"}, {"t": "UNSW: Special consideration and short extensions", "u": "https://www.unsw.edu.au/student/managing-your-studies/academic-life/special-consideration"}, {"t": "Cardiff Students' Union: Extenuating circumstances remedies", "u": "https://cardiffstudents.com/advice/academic/extenuatingcircumstances/remedies"}]}, {"id": "critical", "title": "Critical thinking and argument in academic writing", "goals": ["Explain what lecturers mean when they ask for 'critical' or 'analytical' writing.", "Turn descriptive paragraphs into analytical ones.", "Combine evidence from several sources to support your own argument.", "Use hedging to state claims at the right level of certainty."], "lessons": [{"t": "What 'critical' really means", "b": "When a lecturer writes \"be more critical\", they do not mean \"be negative\". The University of York's library guide explains that descriptive writing shows what you know, while critical writing analyses and evaluates information and uses it to build your own argument. The University of Leeds adds that critical writing shows your interpretation of the evidence and your position in a debate. In practice, being critical means asking questions of every source. Is the evidence strong? Does it apply to this context? What did the author leave out? Who disagrees and why? This can feel strange if your previous education rewarded faithful reproduction of a respected author's words. In postgraduate work, a well-reasoned disagreement with a famous scholar often earns more marks than a perfect summary of them."}, {"t": "Description versus analysis: before and after", "b": "Before (descriptive): \"Mobile money was launched in Kenya in 2007. It allows people to send money by phone. Many people now use it, and several studies have been written about it.\" After (analytical): \"Mobile money spread rapidly in Kenya after 2007, but its benefits were uneven. Studies of household resilience suggest that access helped families absorb shocks, yet these gains depended on agent networks that were thinner in rural areas. This suggests that technology alone did not drive inclusion; infrastructure and regulation mattered as much.\" The first version reports facts. The second explains significance, notices a limitation and draws a conclusion. Leeds describes this move as going from saying what happened to explaining why it matters. Some description is still needed, but keep it short and always follow it with \"so what?\""}, {"t": "Building an argument", "b": "An academic argument is a position supported by reasons and evidence, which also deals with objections. A simple structure for a paragraph is: claim, reason, evidence, evaluation, link. For example: \"Flood risk in Lagos is mainly a planning problem rather than a rainfall problem (claim). Drainage channels have been built over by informal construction (reason). Several urban studies document blocked drains in the worst-affected areas (evidence). However, most of these studies are small case studies, so the scale of the effect is uncertain (evaluation). This points to enforcement, not only engineering, as a policy priority (link).\" Your essay as a whole should have a clear thesis statement in the introduction, and each paragraph should move that thesis forward. If a paragraph could be deleted without weakening your argument, it is probably description."}, {"t": "Using evidence: synthesise, do not list", "b": "Before: \"Smith (2019) studied rice farmers in Ghana. Patel (2021) studied wheat farmers in Punjab. Okoro (2022) studied cassava farmers in Nigeria.\" After: \"Studies across Ghana, Punjab and Nigeria agree that access to credit raises adoption of improved seed (Smith, 2019; Patel, 2021; Okoro, 2022). They disagree, however, on whether extension services matter once credit is available: Patel finds a strong effect, while Okoro finds none, possibly because of differences in crop type.\" York's guide advises bringing several sources together into a single picture and asking what the evidence means as a whole and for your argument. Organise paragraphs by idea, not by author. A table with sources in rows and themes in columns can help you see agreements and gaps before you write."}, {"t": "Evaluating sources", "b": "The University of Manchester's Academic Phrasebank says that academic writers should not accept sources just because they are published. They should point out weaknesses in arguments or methods and, where possible, suggest how the work could be improved. Useful questions are: How big and how representative was the sample? Was the study done in a context like the one you are writing about? Is the author's conclusion supported by their own data? Is the source peer-reviewed, recent, and from a credible publisher? Before: \"According to Brown (2015), microfinance reduces poverty.\" After: \"Brown (2015) reports that microfinance reduced poverty, but the study followed only 60 borrowers for one year, which limits how far its findings can be generalised to national programmes.\""}, {"t": "Hedging: claiming the right amount", "b": "Hedging means using cautious language to show how certain you are. Mount Saint Vincent University's writing guide lists common hedging tools: modal verbs (may, might, could), verbs such as suggest, indicate and appear, adjectives such as likely and possible, adverbs such as perhaps and probably, and approximations such as about or generally. Before: \"This proves that school feeding programmes increase attendance in India.\" After: \"These findings suggest that school feeding programmes are likely to increase attendance, at least in the states studied.\" Overconfident claims are a common reason for lost marks. But do not hedge everything, or your writing will sound as if you believe nothing. Facts that are well established can be stated directly. Hedge your interpretations and generalisations, not basic facts."}, {"t": "Finding your own voice", "b": "Many students are told at home that their own opinion does not matter until they are an expert. In postgraduate writing, your voice is expected, but it appears through how you select, compare and judge evidence, not through personal feelings. Phrases such as \"This essay argues that\", \"A more convincing explanation is\", or \"The evidence therefore supports\" signal your position clearly. York's guide also points to instruction words. \"Define\", \"outline\" and \"explain\" ask mainly for description. \"Analyse\", \"evaluate\", \"discuss\" and \"justify\" ask you to judge. Check the verbs in your question before planning. Whether you may write \"I\" depends on the discipline, so look at published articles in your field and ask your tutor. Your experience from home can be a real strength, if you connect it to evidence."}, {"t": "Habits to unlearn", "b": "A few habits that earn praise in some systems lose marks in these ones. Long, decorative introductions that start with \"Since the dawn of time\" waste words. Get to your question in the first two sentences. Long quotations show that you found a source, not that you understood it. Paraphrase and analyse instead, and quote only when the exact wording matters. Reverent language such as \"the great scholar clearly proved\" weakens your argument. Evaluate the work, whoever wrote it. Listing everything you know about a topic is not an answer. Select what is relevant to the question. Finally, ending with a moral lesson or proverb is not a conclusion. Summarise your argument, state its implications and note its limits. These are style differences, not signs of weak intelligence."}], "checks": [{"q": "What does a lecturer usually mean by 'be more critical'?", "o": ["Be more negative about every source", "Analyse and evaluate sources to build your own argument", "Use more quotations", "Write longer paragraphs"], "a": 1, "why": "Critical writing goes beyond description to analysis, evaluation and your own position."}, {"q": "Which sentence is the most analytical?", "o": ["The policy reduced costs in cities, but rural uptake stayed low, suggesting access was the real barrier.", "The policy has five main parts.", "The policy was introduced in 2015.", "Many authors have written about the policy."], "a": 0, "why": "It explains significance and draws a reasoned conclusion from evidence."}, {"q": "What is the best way to organise a literature-based paragraph?", "o": ["One author per paragraph in date order", "By length of the source", "By country of the author", "By theme or idea, comparing several sources"], "a": 3, "why": "Synthesis groups sources around ideas and shows agreement and disagreement."}, {"q": "Which is a good hedged version of 'This proves the drug works'?", "o": ["This definitely proves the drug works", "The drug works", "These results suggest the drug may be effective in this population", "Nobody can know anything about the drug"], "a": 2, "why": "It signals appropriate caution without refusing to make a claim."}, {"q": "The question says 'Evaluate'. What is expected?", "o": ["A list of definitions", "A judgement about strengths, weaknesses and value, supported by evidence", "A summary of one textbook", "Your personal feelings"], "a": 1, "why": "Evaluate is a critical instruction word asking for reasoned judgement."}, {"q": "Which habit is most likely to lose marks?", "o": ["Starting with a long decorative introduction and many long quotations", "Paraphrasing and analysing sources", "Stating your thesis early", "Noting limitations of studies"], "a": 0, "why": "Decorative openings and heavy quoting add words without adding analysis."}], "checklist": ["Underline the instruction words in every assignment question.", "Write a one-sentence thesis before you start drafting.", "Check each paragraph has a claim, evidence and your evaluation.", "Replace author-by-author paragraphs with theme-based synthesis.", "Add at least one limitation or counter-argument per major section.", "Review strong verbs such as 'proves' and hedge where needed.", "Cut long quotations to the few words that really matter."], "links": [{"t": "University of York Library: Criticality in academic writing", "u": "https://subjectguides.york.ac.uk/academic-writing/criticality"}, {"t": "University of Leeds Library: Critical writing", "u": "https://library.leeds.ac.uk/info/1401/academic-skills/105/critical-thinking/5"}, {"t": "University of Manchester Academic Phrasebank: Being critical", "u": "https://www.phrasebank.manchester.ac.uk/being-critical/"}, {"t": "Mount Saint Vincent University: Hedging language in academic writing (PDF)", "u": "https://msvu.ca/wp-content/uploads/2021/11/Hedging-Language-in-Academic-Writing.pdf"}]}, {"id": "integrity", "title": "Academic integrity and generative AI", "goals": ["Recognise plagiarism, collusion, contract cheating and self-plagiarism.", "Understand how misconduct cases are handled and how they can affect your visa.", "Compare how universities in each country treat generative AI.", "Use AI tools, where allowed, in a way you can declare and defend."], "lessons": [{"t": "Why integrity is taken so seriously", "b": "Academic integrity means that the work you submit honestly shows your own learning, and that you give credit to everyone whose ideas, words or data you used. Universities treat it as the foundation of trust in their degrees. Your degree certificate tells employers and governments that you did the work yourself. In some education systems, copying from a textbook, sharing answers or paying for help is tolerated or common. In the UK, Canada, the US and Australia, these practices can end your studies. Many cases involving international students are not about deliberate cheating. They come from unfamiliar rules, such as how to paraphrase, or from pressure: a deadline, a part-time job, family worries. Learning the rules early and asking for help before a crisis are the best protection you have."}, {"t": "Plagiarism comes in several forms", "b": "The University of Oxford lists many forms of plagiarism. They include copying words without quotation marks and a reference, copying from the internet, and close paraphrasing, which means changing a few words or keeping the original sentence structure without acknowledgement. They also include citing sources you never read, failing to acknowledge help that changed your work, and using ghost-written material. Oxford also counts unauthorised use of AI as plagiarism. Plagiarism can be intentional or accidental, but accidental plagiarism can still be penalised. To paraphrase properly, read the passage, close it, write the idea in your own words and structure, then check against the original and add the citation. If you find you cannot explain an idea without the author's words, you probably have not understood it yet."}, {"t": "Collaboration versus collusion", "b": "Studying together is encouraged. Discussing readings, explaining concepts to each other and testing each other before exams are all good practice. Collusion is different. It means working together on something that should be your individual work, such as sharing your essay draft, splitting the questions of an individual assignment, or letting a friend copy your code. Oxford lists unauthorised collaboration and breaking group-work rules as forms of plagiarism. UNSW warns that sharing notes before an exam can lead to similar answers and suspicion of collusion. The safe rule: discuss ideas together, but write alone, and never send your work file to anyone. If you are not sure where the line is for a specific assignment, ask the instructor in writing and keep the reply."}, {"t": "Contract cheating: illegal, risky and traceable", "b": "Contract cheating means getting someone else to do assessed work for you, whether paid or not. It includes essay mills, \"tutors\" who write assignments, and people who sit online exams for you. In England, the Skills and Post-16 Education Act made it a criminal offence to provide or advertise essay-writing services for payment, as QAA explains. In Australia these services are also illegal. Monash University reports students being blackmailed by providers who threaten to report them to the university, demand more money or ask them to recruit friends. UNSW warns that such services often advertise on social media as \"proofreading\" or \"study help\" and ask for student login details. The consequences include failing, exclusion, losing your degree even after graduation, and losing your visa. Never share your university password with anyone."}, {"t": "Self-plagiarism and recycling your own work", "b": "Many students are surprised that you can plagiarise yourself. Oxford calls it auto-plagiarism: submitting work, in whole or in part, that has already been submitted for assessment, or reusing your own earlier work without citing it. UNSW lists resubmitting your earlier work without referencing it as a form of plagiarism too. This matters for students who wrote a final-year project at home on a similar topic, or who are turning a master's dissertation into a PhD proposal. Building on your earlier work is fine and often sensible. You simply need to cite it and, where the assessment requires new work, write new text. If you want to develop a topic from your previous degree, tell your supervisor and agree what is acceptable. The same principle applies when you publish from your thesis."}, {"t": "How misconduct cases are handled", "b": "Each university has its own procedure, but most follow similar steps. A marker raises a concern, perhaps after similarity software flags matching text or a writing style changes suddenly. You are contacted, given the evidence and invited to respond, often in a meeting where you can bring a support person from the students' union. A panel decides whether misconduct happened and what penalty is fair. Oxford describes penalties ranging from mark deductions to failure of the degree or expulsion. At UNSW, students who come forward about contract cheating receive a default penalty of zero for that assessment, while repeat cases are treated more severely. If you receive an allegation, do not ignore it, do not panic and do not invent explanations. Get advice from your students' union immediately and answer honestly."}, {"t": "Misconduct and your visa", "b": "Your study visa depends on being enrolled and making progress. A serious misconduct outcome can therefore affect your immigration status. In the UK, the University of Exeter explains that it must withdraw visa sponsorship if a student is required to withdraw for disciplinary or academic reasons, after any appeal, and that UK Visas and Immigration then shortens the visa. In the US, a student who is suspended can no longer maintain status, and their SEVIS record may be terminated with no grace period. UNSW lists losing your visa among the possible outcomes of cheating. In Canada, study permit holders must remain enrolled and actively pursue their studies. Every case is different, so if you face an allegation, speak to both the students' union and your international student adviser before the outcome, not after."}, {"t": "How universities treat generative AI", "b": "Rules differ by country, university and even by assignment. The Russell Group of UK universities agreed in 2023 to support AI literacy while protecting academic integrity. UCL uses three categories: AI not allowed (such as in-person exams), AI in an assistive role, and AI as an integral part of the task, with use acknowledged. The University of Sydney uses a \"two-lane\" approach: secure assessments with no AI, and open assessments where AI is allowed but must be acknowledged. In Canada, the University of Toronto says AI is not allowed unless the instructor explicitly permits it, while UNBC guidance says students may assume use is not restricted if the course is silent, but must still disclose. In the US, Stanford treats AI use as help from another person unless the instructor says otherwise."}, {"t": "Using AI safely when it is allowed", "b": "First, check the rules for that specific assessment, not just the university. If the course outline is unclear, email the instructor and keep the reply. Second, if AI is allowed, follow the required acknowledgement method. UCL asks students to acknowledge, not cite, AI use. UNBC asks students to disclose it in the way the course specifies. Some instructors want your prompts and outputs in an appendix. Third, keep records: save prompts, drafts and version history so you can show how your work developed. Fourth, verify everything. AI tools can invent references and facts, and submitting a fake reference is misconduct even if a machine produced it. Finally, remember that paraphrasing apps and AI grammar tools may count as AI. The University of Toronto warns that some courses restrict them."}], "checks": [{"q": "You change a few words in a paragraph from an article and add a citation, but keep the author's sentence structure. What is this?", "o": ["Good paraphrasing", "Contract cheating", "Self-plagiarism", "Close paraphrasing, a form of plagiarism"], "a": 3, "why": "Keeping the original structure with minor word changes is close paraphrasing."}, {"q": "A friend asks to see your finished individual essay 'just for ideas'. What is the safest response?", "o": ["Send it as a PDF", "Send only half", "Discuss ideas verbally but do not share your file", "Post it in the class group"], "a": 2, "why": "Sharing your work file risks collusion for both of you."}, {"q": "In England, what did the Skills and Post-16 Education Act do?", "o": ["Banned all tutoring", "Made providing or advertising paid essay-writing services a criminal offence", "Allowed essay mills for international students", "Required AI detectors"], "a": 1, "why": "QAA explains the Act criminalised paid essay-writing services and their advertising in England."}, {"q": "You want to reuse part of your undergraduate project in a master's essay. What should you do?", "o": ["Cite your earlier work and check with the instructor what reuse is allowed", "Paste it in without comment", "Translate it so software cannot detect it", "Ask a friend to rewrite it"], "a": 0, "why": "Reusing your own work without citation is self-plagiarism."}, {"q": "At the University of Toronto, if a course outline says nothing about generative AI, what is the default?", "o": ["AI is allowed for everything", "AI is allowed in exams", "Only paid AI tools are allowed", "AI is not allowed unless the instructor explicitly permits it"], "a": 3, "why": "U of T's student guidance says AI is not permitted unless the instructor allows it."}, {"q": "Under the University of Sydney's two-lane approach, what is an 'open' assessment?", "o": ["One where AI is banned", "One without a deadline", "One where AI and other tools may be used, with acknowledgement", "An exam held in a large hall"], "a": 2, "why": "Open-lane assessments allow AI but require original work and acknowledgement."}, {"q": "Why can a serious misconduct finding affect a UK Student visa?", "o": ["It cannot", "If you must withdraw, the university withdraws sponsorship and the visa is shortened", "The university cancels your passport", "You are automatically banned for 10 years"], "a": 1, "why": "Exeter explains that sponsorship is withdrawn for required withdrawal, after which UKVI curtails the visa."}, {"q": "An AI tool gives you five references for your essay. What must you do?", "o": ["Check that each source exists and says what is claimed before citing it", "Use them as given", "Cite the AI tool instead", "Delete the reference list"], "a": 0, "why": "AI can invent sources; citing a fake reference is still your responsibility."}], "checklist": ["Read your university's academic integrity policy and the AI rules in each course outline.", "Learn your required referencing style and practise paraphrasing.", "Never share your login details or your assignment files.", "Ignore 'assignment help' offers on WhatsApp, Telegram, Instagram or email.", "Ask the instructor in writing when AI rules are unclear, and keep the reply.", "Keep prompts, drafts and version history for any AI-assisted work.", "Verify every reference you cite exists and supports your point.", "If you receive an allegation, contact the students' union and international adviser immediately."], "links": [{"t": "QAA: Contracting to cheat in higher education (3rd edition)", "u": "https://www.qaa.ac.uk/news-events/news/contracting-to-cheat-in-higher-education-updated-3rd-edition-of-contract-cheating-guidance-now-available"}, {"t": "Russell Group: Principles on the use of generative AI tools in education", "u": "https://russellgroup.ac.uk/policy/policy-briefings/principles-use-generative-ai-tools-education"}, {"t": "UCL: Three categories of GenAI use in assessment", "u": "https://www.ucl.ac.uk/teaching-learning/generative-ai-hub/three-categories-genai-use-assessment"}, {"t": "University of Sydney: AI assessment policy (two lanes)", "u": "https://www.sydney.edu.au/news-opinion/news/2024/11/27/university-of-sydney-ai-assessment-policy.html"}, {"t": "University of Toronto Mississauga: Generative AI and academic integrity", "u": "https://www.utm.utoronto.ca/academic-integrity/students/generative-ai"}, {"t": "Stanford Office of Community Standards: Generative AI policy guidance", "u": "https://communitystandards.stanford.edu/generative-ai-policy-guidance"}]}, {"id": "supervisors", "title": "Working with supervisors and professors", "goals": ["Write clear, polite emails to academic staff in the right tone.", "Run productive supervision meetings and keep records.", "Know what to expect from master's and PhD supervision.", "Find and approach a potential supervisor before applying."], "lessons": [{"t": "Names, titles and tone", "b": "Start formally and let the other person set the tone. In a first email, use \"Dear Dr Mensah\" or \"Dear Professor Sharma\", not \"Dear Sir\", \"Hi\" or \"Hey\". North Carolina State University's graduate school advises a personal, respectful greeting with a title. Many academics in the UK, Canada and Australia will reply signing only their first name, such as \"Best, Ama\". That is an invitation to use their first name next time. In the US, practice varies more, so follow what they do and what classmates in your department do. Avoid phrases that sound overly humble or pleading in English, such as \"I humbly beg your kind consideration\" or \"Kindly do the needful\". They can sound unusual to readers. Plain, polite and direct writing reads as most professional."}, {"t": "Anatomy of a good academic email", "b": "A good email is short, specific and easy to answer. Use a clear subject line that says what you want and who you are, for example \"Meeting request: dissertation topic - Chidi Okeke, MSc Public Health\". NC State gives a similar example and warns against vague subjects such as \"Hello!\". Open with who you are and how you are connected, such as your course. State your request in one or two sentences, giving the information needed to decide. Do not ask questions the syllabus already answers. Mention any deadline. Close with thanks and a full signature: name, programme, student number if relevant, and email. Attach files and mention them in the text. Before sending, read it aloud. If it is longer than about 200 words, ask whether a meeting would be better."}, {"t": "A bad email and why it fails", "b": "Subject: \"Pls help\" \"Good day sir, I am a student from Pakistan in your class. Please I need to see you urgently about my assignment, I don't understand anything. Kindly reply ASAP. Regards.\" This email is hard to act on. The subject line says nothing. \"Sir\" may be the wrong title and gender, and the lecturer has to guess who is writing, which course, and which assignment. \"I don't understand anything\" gives no starting point. \"ASAP\" sounds like a demand, and there is no suggested time to meet. Nothing shows the student has tried to solve the problem first, for example by re-reading the brief. The writer is clearly worried, and the lecturer would want to help, but the email makes that harder. The next lesson rewrites it."}, {"t": "A good email in practice", "b": "Subject: \"Question about Assignment 2 brief - ENV7012\" \"Dear Dr Clarke, I am an MSc Environmental Management student in your ENV7012 module. I am planning Assignment 2 and am unsure whether the 'case study' must be in the UK or can be from another country. I would like to use flood management in Accra, Ghana. Is this acceptable? If it is easier to discuss in person, I could come to your office hours on Thursday at 2pm. Thank you for your time. Kind regards, Ayesha Khan MSc Environmental Management, Student ID 2412345\" This works because the subject names the course, the question is specific, the student shows initiative with a concrete proposal, and the lecturer can answer in one line."}, {"t": "Making supervision meetings work", "b": "You lead your supervision meetings. Before each one, send a short agenda and any draft two or three working days ahead, so your supervisor has time to read it. Bring specific questions, such as \"Is my sample size defensible?\" rather than \"Is my work okay?\" During the meeting, take notes. Afterwards, email a short summary: what was discussed, what was agreed and what you will do by the next meeting. The University of Sheffield says written records are essential for every formal supervisory meeting, can be brief bullet points, and are often led by the student. These records protect both of you. If your supervisor misses meetings or feedback is slow, raise it politely first, then with the programme director or graduate tutor. Universities have formal routes for supervision problems."}, {"t": "Master's dissertation supervision", "b": "On a taught master's, your dissertation supervisor typically gives a limited number of meetings over a few months. You are expected to choose and shape the topic, plan the work and write independently, with your supervisor advising rather than directing. Do not expect them to correct every page of your draft, and check your programme's rules on how much draft feedback is allowed. Agree a timeline early, including ethics approval if you will collect data from people, which can take weeks. If you plan fieldwork in your home country, such as interviews in Nairobi, discuss travel, ethics, insurance and visa absence rules before booking anything. Bring your supervisor decisions to react to, not blank pages. \"I have three possible research questions; which is most feasible in 12 weeks?\" is a good opening."}, {"t": "PhD supervision and the relationship", "b": "PhD supervision is a long professional relationship. Many universities assign a team. At Sheffield, every research student has at least two supervisors and a personal tutor for pastoral support, and full-time students meet their primary supervisor formally at least every four weeks. Expectations differ by country. In North America, your supervisor may also fund you through a research or teaching assistantship. In the UK and Australia, a PhD often has little or no coursework and you start research immediately. Agree expectations early: how often you will meet, how quickly drafts are returned, authorship on papers, conference attendance and working hours. Most universities publish a code of practice for research degrees. Read it. If the relationship breaks down, the code explains who to talk to and how to change supervisor."}, {"t": "Finding a supervisor before you apply", "b": "First, check whether your programme needs a supervisor before you apply. The University of Saskatchewan advises this, because some programmes assign supervisors after admission. Then build a shortlist from department pages and recent publications. Read two or three of each person's recent papers. UCL's Global Health team warns that staff ignore generic emails unrelated to their work. A cold email should be short. Saskatchewan suggests about three paragraphs and no more than 250 words. Include a brief introduction, evidence that you meet admission requirements, a specific link between your interests and their research, and a clear question, such as \"Would you consider supervising a PhD starting in September 2027?\" Attach a CV and, if appropriate, a short research proposal, and say how you plan to fund your studies. If there is no reply after two weeks, send one polite follow-up."}], "checks": [{"q": "How should you address a lecturer in a first email?", "o": ["Hey", "Dear Sir/Ma", "Yo Prof", "Dear Dr Mensah"], "a": 3, "why": "Use their title and surname until they invite you to use their first name."}, {"q": "Which subject line is best?", "o": ["Hello!", "URGENT", "Question about Assignment 2 brief - ENV7012", "Pls reply"], "a": 2, "why": "It tells the reader exactly what the email is about."}, {"q": "A lecturer replies signing only 'Best, Tom'. What does this usually signal?", "o": ["You must still call him Sir", "You can probably use his first name", "He is angry", "He is a student"], "a": 1, "why": "Signing with a first name usually invites first-name use."}, {"q": "Who usually leads PhD supervision meetings, including notes and actions?", "o": ["The student", "The head of department", "The international office", "No one"], "a": 0, "why": "Sheffield notes students often lead on meeting records."}, {"q": "What is the recommended maximum length for a cold email to a potential supervisor (University of Saskatchewan)?", "o": ["50 words", "Length does not matter", "1,000 words", "About 250 words"], "a": 3, "why": "Saskatchewan suggests about three paragraphs, no more than 250 words."}, {"q": "Which cold email is most likely to get a reply?", "o": ["The same template sent to 200 professors", "An email asking them to find you funding first", "A tailored email linking your interests to their recent papers, with CV attached", "A long life story"], "a": 2, "why": "Tailored, specific emails show genuine fit."}, {"q": "You plan interviews in your home country for a master's dissertation. When should you discuss ethics and travel with your supervisor?", "o": ["After collecting data", "Before booking or starting anything", "Never", "After submitting"], "a": 1, "why": "Ethics approval and travel rules must be settled before data collection."}], "checklist": ["Save an email template with a clear subject, greeting and full signature.", "Send an agenda and drafts 2-3 working days before each supervision meeting.", "Email a short summary of agreed actions after every meeting.", "Read your university's code of practice for supervision.", "Agree meeting frequency and feedback turnaround in the first month.", "For PhD applications, shortlist supervisors and read their recent papers before emailing.", "Keep cold emails under 250 words and tailor each one."], "links": [{"t": "NC State Graduate School: How to email your professor", "u": "https://grad.ncsu.edu/news/2020/02/how-to-email-your-professor/"}, {"t": "University of Saskatchewan: Tips for finding a supervisor", "u": "https://grad.usask.ca/admissions/tips-for-finding-a-supervisor.php"}, {"t": "UCL Global Health: Guidance on contacting potential supervisors", "u": "https://www.ucl.ac.uk/global-health/study/postgraduate-research/guidance-contacting-potential-supervisors"}, {"t": "University of Sheffield: About PGR supervision", "u": "https://sheffield.ac.uk/rpi/pgr/supervision/about"}]}, {"id": "research", "title": "Research skills for postgraduates", "goals": ["Search for literature systematically using Google Scholar and library databases.", "Read research papers quickly and take useful notes.", "Write a literature review that synthesises rather than summarises.", "Manage references, ethics approval and research data properly."], "lessons": [{"t": "Plan your search before you search", "b": "Good searching starts on paper. Break your question into key concepts, then list synonyms and related terms for each. For a question on \"plastic waste recycling in West African cities\", concepts might be plastic, recycling, and urban West Africa, with synonyms such as \"solid waste\", \"circular economy\", Lagos, Accra and Dakar. Combine terms with AND to narrow a search and OR to widen it, and use quotation marks for exact phrases, such as \"informal recycling\". Keep a search log: database, date, search string and number of results. This saves time and you will need it if you write a systematic review. Expect to refine your search several times. Too many results usually means your terms are too broad. Too few may mean you need synonyms or a different database."}, {"t": "Using Google Scholar well", "b": "Google Scholar is a good starting point, but use its features. Google Scholar's help pages explain that on a campus network, results show links to your library's subscriptions, so you can read paywalled articles free. Off campus, you can set your library in Scholar settings or log in through your library's proxy. \"Cited by\" shows newer papers that cite an article, which is the fastest way to move from an older classic paper to current research. \"All versions\" can lead to a free copy. You can set an email alert for a search or for new citations of a key paper, so new work comes to you. Scholar's weakness is that it mixes peer-reviewed work with theses, reports and less reliable material, so check where each item was published."}, {"t": "Library databases, Scopus and Web of Science", "b": "Your university library pays for databases that are more precise than Google Scholar. Scopus and Web of Science cover many disciplines and let you filter by year, subject, document type and citation count. Subject databases go deeper. Examples include PubMed for health, ERIC for education, IEEE Xplore for engineering, and EconLit for economics. Many students from developing countries had limited database access at home, so take the library's induction or book a session with your subject librarian. It is free and can save weeks. Learn to use subject headings, filters and saved searches. Most databases can also export references directly into Zotero or Mendeley. Remember that your access usually ends when you graduate, so download and organise key papers for your dissertation while you still can."}, {"t": "Reading papers efficiently", "b": "You do not have to read every paper from the first word to the last. Curtin University recommends reading the abstract first and stopping if it does not fit your question. If it does fit, read the introduction and conclusion together for a quick summary. Then decide which sections matter. Methods tell you whether the study is trustworthy. Results and discussion tell you what was found and what it means. The reference list leads you to related work. Look at figures and tables early. They often explain the study faster than the text. For each useful paper, write a short note in your own words covering the question, method, sample and context, key findings, limitations, and how it relates to your project. These notes make writing much faster later."}, {"t": "Writing a literature review", "b": "A literature review is not a list of summaries. It is an argument about what is known, what is disputed and what is missing, which then justifies your own research. Organise it by themes, debates or methods, not by author. For each theme, show where studies agree, where they conflict and why, for example different contexts, samples or methods. Then identify the gap your project fills. Be specific: \"few studies have examined X in sub-Saharan cities using longitudinal data\" is a stronger gap than \"little research has been done\". A synthesis table with papers in rows and themes or variables in columns helps you see patterns. Keep your own voice visible through evaluation and linking sentences, as practised in Module 3."}, {"t": "Reference managers: Zotero and Mendeley", "b": "A reference manager stores your sources, PDFs and notes, and inserts citations and bibliographies into your document in any style. Zotero describes itself as a free, open-source tool developed by an independent non-profit. Mendeley, owned by Elsevier, also has a free account. Douglas College's library notes that Zotero gives 300 MB of free cloud storage, Mendeley gives 2 GB, and both plug-ins work with desktop Microsoft Word. Choose one in your first week and use it from the start. Adding 200 references by hand the week before submission is painful and creates errors. Use the browser connector to save articles in one click, check the imported details because metadata can be wrong, and back up your library. Ask your library whether it supports or teaches a particular tool."}, {"t": "Research ethics approval", "b": "If your research involves people, such as s
