 ]},
{id:'critic',title:'Source critic',sub:'Critical thinking about evidence',desc:'A citation is only as strong as the source behind it. Judge quality, spot predatory outlets, and read claims sceptically.',take:8,
 learn:[
  {h:`Evaluate before you cite`,b:`Ask who wrote it, what evidence they use, who published it, when, and why it exists. Citing a source lends it your credibility.`},
  {h:`Strength of evidence`,b:`Systematic reviews and well-designed trials generally outrank single studies, which outrank expert opinion, which outranks anecdote.`},
  {h:`Read laterally`,b:`Check what independent sources say about a source and its author before trusting it.`},
  {h:`Red flags`,b:`Predatory journals, retractions, undisclosed conflicts of interest, tiny samples, correlation presented as causation, and claims no one can trace.`},
  {h:`SIFT in four moves`,b:`Stop. Investigate the source. Find better coverage. Trace claims, quotes and media to their original context. The method comes from digital literacy researcher Mike Caulfield and pairs with lateral reading, the habit Stanford researchers observed in professional fact-checkers.`}],
 pool:[
 {t:'mcq',q:`Which source gives the strongest support for a claim that a treatment works?`,opts:[`A popular health blog`,`A single case report`,`A systematic review and meta-analysis of randomised trials`,`A press release from the manufacturer`],a:2,why:`Systematic reviews of well-designed trials rank highest. Still check the review’s own quality and date.`},
 {t:'mcq',q:`A journal emails you: “Publish in 72 hours, fee applies, indexed everywhere.” What is your first move?`,opts:[`Submit quickly before the offer ends`,`Check it against DOAJ, the Think. Check. Submit. checklist and its real indexing`,`Cite its papers to be safe`,`Ask a friend to submit first`],a:1,why:`Unrealistic speed, vague indexing claims and aggressive solicitation are warning signs of predatory publishing.`},
 {t:'mcq',q:`A paper you planned to cite has been retracted. What should you do?`,opts:[`Cite it anyway; it was peer reviewed`,`Don’t use it as evidence; if you discuss it, cite it and state that it was retracted`,`Cite the retraction notice only`,`Remove the DOI so no one notices`],a:1,why:`Check key sources in the Retraction Watch Database and on the publisher’s page before you submit.`},
 {t:'mcq',q:`A headline reads “Study proves coffee prevents cancer.” What should you cite?`,opts:[`The news article`,`The original study, after checking its design, sample and whether it shows causation`,`A second news article that agrees`,`Nothing, it is common knowledge`],a:1,why:`Go to the primary source. Observational studies show association, not proof.`},
 {t:'mcq',q:`How should you use Wikipedia in academic work?`,opts:[`Cite it as your main evidence`,`Never read it`,`Use it for orientation, then read and cite the sources it points to`,`Copy its reference list into yours`],a:2,why:`Wikipedia is a good map and a weak citation.`},
 {t:'mcq',q:`You want to cite a preprint. Which is correct?`,opts:[`Present it as peer-reviewed work`,`You cannot cite preprints`,`Cite it and make clear it has not been peer reviewed; check later for a published version`,`Cite it only if it has a DOI`],a:2,why:`Preprints are citable, but readers need to know their status.`},
 {t:'mcq',q:`What is lateral reading?`,opts:[`Reading a source slowly from start to finish`,`Leaving the source to check what other trusted sources say about it and its author`,`Reading only abstracts`,`Reading two papers side by side`],a:1,why:`Professional fact-checkers judge a source by what others say about it.`},
 {t:'mcq',q:`A study finds that towns with more ice-cream sales have more drownings. What is the best conclusion?`,opts:[`Ice cream causes drowning`,`Both probably rise with a third factor, hot weather; correlation is not causation`,`Drowning causes ice-cream sales`,`The study is fraudulent`],a:1,why:`Look for confounding variables before accepting a causal claim.`},
 {t:'mcq',q:`A paper reports big effects from a study of 12 participants and generalises to all adults. How should you cite it?`,opts:[`As strong proof`,`Cautiously, noting the small sample as a limitation`,`Never`,`Only in the introduction`],a:1,why:`Small samples give unstable estimates. Say so when you use the finding.`},
 {t:'mcq',q:`A study on a sweetener’s safety was funded by its manufacturer. What does this mean?`,opts:[`The findings are false`,`Check the conflict-of-interest statement and look for independent studies before relying on it`,`It is more trustworthy because the company knows the product`,`Nothing, funding never matters`],a:1,why:`Funding is not proof of bias, but it is a reason for closer scrutiny and corroboration.`},
 {t:'mcq',q:`Does a high journal impact factor guarantee a paper is correct?`,opts:[`Yes`,`No, metrics describe journals on average, not individual papers`,`Only in medicine`,`Only after five years`],a:1,why:`Judge each paper on its methods and evidence. High-impact journals retract papers too.`},
 {t:'mcq',q:`Is a government report acceptable in academic work?`,opts:[`Never, it is not peer reviewed`,`Often yes: grey literature can be authoritative, but evaluate the issuer, methods and purpose`,`Only if it is under a year old`,`Only in politics`],a:1,why:`Official statistics and policy reports are key sources in many fields.`},
 {t:'mcq',q:`Your key source is from 1995. Is that a problem?`,opts:[`Always, sources must be under five years old`,`It depends: foundational works are fine, but check whether newer evidence has changed the picture`,`Never`,`Only in engineering`],a:1,why:`Cite classics for ideas, and recent studies for the current state of evidence.`},
 {t:'mcq',q:`You cite only studies that support your hypothesis and ignore those that don’t. What is this?`,opts:[`Focused writing`,`Cherry-picking, which misrepresents the evidence`,`Efficient referencing`,`Standard practice`],a:1,why:`Credible writing acknowledges counter-evidence and explains why you weigh it as you do.`},
 {t:'mcq',q:`Many papers repeat a striking statistic, each citing another. You cannot find the original. What now?`,opts:[`Cite the most recent paper`,`Trace the chain; if no original data exists, don’t use it`,`Cite all of them`,`Round the number and use it`],a:1,why:`Citation chains can launder errors into “facts”. Trace claims to their origin.`},
 {t:'mcq',q:`What does the final move of SIFT ask you to do?`,opts:[`Share the source if it looks professional`,`Trace claims, quotes and media back to their original context`,`Translate the source into your own words`,`Tally how many sites repeat the claim`],a:1,why:`Claims are often stripped of context as they are copied. Find where they first appeared before you cite them.`},
 {t:'mcq',q:`You land on a polished “institute” website with a .org address that supports your argument. What do fact-checkers do first?`,opts:[`Read its About page closely`,`Leave the site and check what independent sources say about the organisation`,`Trust it because .org sites are non-profit`,`Judge it by the quality of its design`],a:1,why:`In Stanford studies, fact-checkers read laterally and outperformed historians and students, who stayed on the page and were fooled by logos and domains.`},
 {t:'mcq',q:`A striking chart is circulating with no source attached. What should you do before using it?`,opts:[`Cite the social media post`,`Redraw it and call it your own`,`Find the original data or report it came from, and cite that`,`Use it without citation because charts are data`],a:2,why:`Charts need a traceable origin. If you cannot find the data, leave the chart out.`}
 ]},
{id:'sources',title:'How sources work',sub:'Source roles, synthesis and originality',desc:'Learn the four jobs a source can do in your writing, put sources in conversation, and find your own original contribution.',take:9,
 learn:[
  {h:`Four jobs a source can do`,b:`Background (facts and context), Exhibit (the data, text or object you analyse), Argument (scholarly views you engage with) and Method (a theory or approach you borrow). This BEAM vocabulary comes from the writing scholar Joseph Bizup and is taught widely in university libraries.`},
  {h:`Primary or secondary depends on the field`,b:`For a historian, a 1920s letter is primary. For a psychologist, an empirical journal article can be primary. For most fields, review articles and textbooks are secondary. Ask what counts as raw material in your discipline.`},
  {h:`Put sources in conversation`,b:`Strong writing does not march through sources one at a time. It shows where they agree, disagree, extend or complicate each other, and then adds your position.`},
  {h:`Where originality lives`,b:`You rarely need a brand-new idea. Original work can ask a new question, bring new data or a new setting to an old question, connect ideas no one has connected, or argue for one answer among competing ones.`}],
 pool:[
 ...[
  [`In a paper on river pollution, you cite a government atlas for the river’s length and course.`,0,`Background: accepted facts that set the scene.`],

  [`You disagree with a scholar who claims rural broadband has no effect on schooling.`,2,`Argument: you are engaging a scholarly position.`],
  [`You apply a published framework for managing shared resources to a village water scheme.`,3,`Method: you borrow a theory or lens to analyse your case.`],
  [`You present and interpret data from the survey you ran.`,1,`Exhibit: your own data is the evidence you analyse.`],

  [`You summarise three studies whose conclusions you go on to challenge.`,2,`Argument: these are the views you are responding to.`],
  [`You examine archive photographs as evidence of how a city centre changed.`,1,`Exhibit: the photographs are the objects you analyse.`],
  [`You adopt a scholar’s definition of “circular economy” as the lens for your whole analysis.`,3,`Method: a borrowed concept that frames your analysis.`],

 ].map(([item,a,why])=>({t:'bin',q:`What job is this source doing in the writing?`,item,bins:[`Background`,`Exhibit`,`Argument`,`Method`],a,why})),
 {t:'mcq',q:`Your analytical essay cites 15 sources, all encyclopedias and textbooks. What is most likely missing?`,opts:[`Nothing, the sources are reliable`,`Argument sources: scholarly views to agree with, dispute or extend`,`More encyclopedias`,`A longer reference list`],a:1,why:`Background sources inform; analysis needs a debate to enter. Aim for a balance of source roles.`},
 {t:'mcq',q:`Which sentence puts two sources in conversation?`,opts:[`Chen (2019) studied filtration. Lopez (2021) studied pricing.`,`Where Chen (2019) sees filtration as the answer, Lopez (2021) argues that pricing matters more; both overlook maintenance.`,`Many studies exist on this topic (Chen, 2019; Lopez, 2021).`,`According to Chen (2019), filtration works.`],a:1,why:`It compares the positions and then adds the writer’s own observation. That is synthesis.`},

 {t:'mcq',q:`Is a literature review article a primary source for your new psychology study?`,opts:[`Yes, always`,`No, it is a secondary source that synthesises other studies`,`Only if it is recent`,`Only if it is peer reviewed`],a:1,why:`Reviews analyse other people’s findings. Cite the original studies for specific results.`},

 {t:'mcq',q:`What is a synthesis matrix?`,opts:[`A citation style`,`A table of sources against themes that reveals agreements, contradictions and gaps`,`A plagiarism score`,`A list of keywords`],a:1,why:`Library guides recommend it for literature reviews. Citadel’s library has one built in.`}

 {t:'mcq',q:`You cite two papers by Singh, both from 2020. How does APA tell them apart?`,opts:[`(Singh, 2020, first)`,`(Singh, 2020a) and (Singh, 2020b), lettered by title order in the list`,`Cite only one`,`Add the month`],a:1,why:`Letters after the year distinguish same-author, same-year works.`},

{id:'boss',title:'The integrity audit',sub:'Final assessment',desc:'You are the examiner. Find every problem in real-looking paragraphs and reference lists, and judge tricky cases.',take:5,gens:[{g:'auditPara',n:1},{g:'auditList',n:1}],

const inv=(n)=>n.org||`${n.family}, ${initials(n.given)}`;
function joinList(arr,sep,last){if(arr.length<2)return arr.join('');return arr.slice(0,-1).join(sep)+last+arr[arr.length-1]}
function authorsFor(style,list){

   case'apa':{let a=list.map(inv);if(a.length>20)a=[...a.slice(0,19),'. . .',a[a.length-1]];if(a.length===1)return a[0];if(list.length>20)return a.slice(0,-1).join(', ')+' '+a[a.length-1];return a.slice(0,-1).join(', ')+', & '+a[a.length-1]}
   case'mla':{const f=n=>n.org||`${n.family}, ${n.given}`;if(list.length===1)return f(list[0]);if(list.length===2)return`${f(list[0])}, and ${list[1].org||(list[1].given+' '+list[1].family)}`;return f(list[0])+', et al'}
   case'chicago':{const a=list.slice(0,10).map((n,i)=>n.org||(i===0?`${n.family}, ${n.given}`:`${n.given} ${n.family}`));if(a.length===1)return a[0];if(a.length===2)return a[0]+', and '+a[1];return joinList(a,', ',', and ')}
   case'harvard':return joinList(list.map(inv),', ',' and ');
   case'ieee':{const a=list.map(n=>n.org||`${initials(n.given)} ${n.family}`);if(a.length>6)return a[0]+' et al.';if(a.length===2)return a.join(' and ');return joinList(a,', ',', and ')}
   case'vancouver':{const a=list.map(n=>n.org||`${n.family} ${initials(n.given,false,false)}`);return a.length>6?a.slice(0,6).join(', ')+', et al':a.join(', ')}
  }

function editorsFor(style,list){

  for(let i=1;i<=o.length;i++){let diag=0;for(let j=1;j<=m.length;j++){const tmp=prev[j];prev[j]=o[i-1]===m[j-1]&&!kw(o[i-1])?diag+1:0;if(prev[j]>run)run=prev[j];diag=tmp}}
  const phrases=[];let cur=[];m.forEach((w,i)=>{if(flag[i])cur.push(w);else{if(cur.length)phrases.push(cur.join(' '));cur=[]}});if(cur.length)phrases.push(cur.join(' '));
  const hasCite=/\([^)]*\b(1[5-9]|20)\d{2}[a-z]?\b[^)]*\)|\[\d+\]|\b[A-Z][a-z]+ \((1[5-9]|20)\d{2}\)/.test(mine);
  return{overlap:total?shared/total:0,run,phrases,hasCite,count:words(mine).length,origCount:o.length}}
function paraVerdict(M){const issues=[];
  if(M.count<12)issues.push('Write at least a full sentence or two so the meaning comes across.');
  if(M.run>=5)issues.push(`You kept a run of ${M.run} identical words. Either rephrase it or put it in quotation marks with a page number.`);
  if(M.overlap>0.2)issues.push(`${Math.round(M.overlap*100)}% of your three-word phrases also appear in the source. That is patchwriting territory; aim for under 20%. Key technical terms don’t count against you, so keep those and change the structure around them.`);
  if(!M.hasCite)issues.push('Add an in-text citation such as (Author, Year). A paraphrase still needs one.');
  return{pass:!issues.length,issues}}
function meterHTML(M){const ov=Math.round(M.overlap*100);
  return`<div class="meter"><div class="${ov>20?'bad':'good'}"><b>${ov}%</b><span>shared phrasing</span></div><div class="${M.run>=5?'bad':'good'}"><b>${M.run}</b><span>longest identical run</span></div><div class="${M.hasCite?'good':'bad'}"><b>${M.hasCite?'Yes':'No'}</b><span>citation included</span></div></div>
  ${M.phrases.length?`<p class="notes">Phrases shared with the source: ${M.phrases.slice(0,6).map(p=>`<mark style="background:var(--hl);color:var(--hl-ink)">${esc(p)}</mark>`).join(', ')}</p>`:''}`}

const GLOSS={'plagiarism':'Presenting someone else’s words, ideas or work as your own.','plagiarise':'To present someone else’s words, ideas or work as your own.','paraphrase':'A specific passage restated in your own words and sentence structure, with a citation.','patchwriting':'Copying a source’s sentence structure while swapping in a few synonyms. Not a real paraphrase.','citation':'A short note in your text that points readers to a source.','reference list':'The full list of the sources you cited, at the end of your work.','common knowledge':'Facts widely known and undisputed among your readers, which need no citation.','claim':'A statement a reader could question or ask you to support.','evidence':'Data, examples, quotations or findings that support a claim.','reasoning':'Your explanation of why the evidence supports the claim.','peer review':'Checking of research by other experts before it is published.','DOI':'Digital Object Identifier: a permanent link to an article, book or dataset.','secondary source':'A source that discusses or analyses other sources.','primary source':'Original material: data, documents, or the first report of a study.','synthesis':'Combining several sources to show how they agree, differ or connect.','signal phrase':'Words that introduce a source, such as “Okafor argues that”.','quotation':'A source’s exact words, placed in quotation marks.','summary':'The main ideas of a longer text, shortened and in your own words.','summarise':'To give the main ideas of a longer text, shortened and in your own words.','misconduct':'Breaking the rules of honest academic work.','collusion':'Working together on work that is meant to be done alone.','fabrication':'Inventing data, results or references.','fabricated':'Invented; made up rather than real.','in-text citation':'The short citation inside a sentence, such as (Okafor, 2021).','literature review':'A survey of what research has already said on a topic.','contract cheating':'Getting someone else, paid or not, to do assessed work for you.','scholarly':'Written by researchers for researchers, usually checked by experts.','acknowledgement':'A statement that credits someone’s help or work.','conventions':'The usual, agreed ways of doing something in a community.','verbatim':'Word for word, exactly as written.','interpretation':'Your explanation of what something means.','arguable':'Something reasonable people could disagree about.','credibility':'How far readers trust you and your work.','annotated bibliography':'A list of sources, each with a short note on its content and value.'};
const GTERMS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function glossify(root){if(!S.l2||!root)return;const done=new Set();
  const walk=node=>{if(node.nodeType===3){let t=node.nodeValue;for(const term of GTERMS){if(done.has(term))continue;const re=new RegExp('\\b('+term.replace(/[-]/g,'\\-')+')(s|es)?\\b','i');const m=re.exec(t);if(!m)continue;
        done.add(term);const pre=document.createTextNode(t.slice(0,m.index)),post=document.createTextNode(t.slice(m.index+m[0].length));const s=document.createElement('span');s.className='gl';s.tabIndex=0;s.setAttribute('role','button');s.dataset.t=term;s.title=GLOSS[term];s.textContent=m[0];
        node.parentNode.insertBefore(pre,node);node.parentNode.insertBefore(s,node);node.parentNode.insertBefore(post,node);node.parentNode.removeChild(node);walk(post);return}}
      else if(node.nodeType===1&&!node.classList.contains('gl')&&!/^(BUTTON|TEXTAREA|INPUT|SELECT)$/.test(node.tagName))[...node.childNodes].forEach(walk)};
  walk(root)}

const CLAIM=/(\b\d+(\.\d+)?\s?(%|per ?cent)|\b(studies|research|evidence|data)\s+(show|shows|suggest|suggests|indicate|indicates|demonstrate|demonstrates|have shown|has shown|prove|proves)\b|\baccording to\b|\bit (is|has been) (estimated|reported|shown|found|argued)\b|\b(researchers|scientists|experts|scholars)\s+(have|found|argue|report|agree|believe)\b|\b(million|billion)\b|“[^”]{8,}”|"[^"]{8,}"|\b(first|widely) (proposed|described|reported)\b)/i;
function renderDoc(text,style){const map=new Map(S.lib.map(r=>[r.key,r]));const order=[];const numOf=k=>{if(!order.includes(k))order.push(k);return order.indexOf(k)+1};
  const markers=[];const body=text.replace(/\[(@[^\]]+)\]/g,(m,inner)=>{markers.push(inner);return`\u0000${markers.length-1}\u0000`});
  let claims=0,cites=0,qWords=0,allWords=0;const missing=new Set(),notes=[];
  const renderMarker=i=>{const parts=markers[i].split(';').map(p=>p.trim()).filter(Boolean);const out=[];
    parts.forEach(p=>{const m=p.match(/^@([\w-]+)\s*,?\s*(.*)$/);if(!m)return;const r=map.get(m[1]);if(!r){missing.add(m[1]);out.push(`<span class="missing" title="No reference with this key">?${esc(m[1])}</span>`);return}cites++;out.push(esc(inText(r,style,numOf(m[1]),m[2])))});
    if(!out.length)return`<span class="missing">[${esc(markers[i])}]</span>`;
    const inner=out.join(style==='ieee'||style==='vancouver'?', ':'; ');return`<span class="cit">${style==='ieee'?`[${inner}]`:`(${inner})`}</span>`};
  const QRE=/[“"][^”"]{12,}[”"]/;
  const paras=body.split(/\n\s*\n/).filter(p=>p.trim()).map(par=>{const sents=par.trim().split(/(?<=[.!?”"])\s+(?=[A-Z“"(\[])/);
    return'<p>'+sents.map((s,si)=>{const plain=s.replace(/\u0000\d+\u0000/g,'');allWords+=words(plain).length;(plain.match(/[“"][^”"]+[”"]/g)||[]).forEach(q=>qWords+=words(q).length);
      const h=esc(s).replace(/\u0000(\d+)\u0000/g,(m,i)=>renderMarker(+i));const ms=[...s.matchAll(/\u0000(\d+)\u0000/g)].map(m=>markers[+m[1]]);
      if(!ms.length&&CLAIM.test(plain)){claims++;return`<mark class="claim" title="This looks like a claim, number or quotation that needs a source.">${h}</mark>`}
      if(QRE.test(plain)){const why=[];
        if(ms.length&&!ms.some(x=>/@[\w-]+\s*,\s*\S/.test(x)))why.push('Add a page or paragraph number to this quotation, e.g. [@key, p. 12].');
        if(/^\s*[“"]/.test(plain))why.push('Dropped quotation: lead into it by saying who is speaking and why it matters.');
        if(si===sents.length-1&&sents.length>1)why.push('This paragraph ends on a quotation. Add a sentence explaining what it shows for your argument.');
        if(why.length){why.forEach(w=>notes.push({w,snip:plain.trim().slice(0,80)}));return`<mark class="qnote" title="${esc(why.join(' '))}">${h}</mark>`}}
      return h}).join(' ')+'</p>'}).join('');
  if(allWords>80&&qWords/allWords>.25)notes.push({w:`About ${Math.round(qWords/allWords*100)}% of your draft is quotation. Paraphrase more and add your own analysis.`,snip:''});
  const refs=(style==='ieee'||style==='vancouver')?order.map(k=>map.get(k)):order.map(k=>map.get(k)).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
  const bib=refs.map((r,i)=>`<p>${formatRef(r,style,i+1)}</p>`).join('');
  return{html:paras,bib,claims,cites,missing:[...missing],used:order.length,notes,words:allWords}}

 'Report neutrally':['X describes','X notes that','X reports that','X observes that','X outlines','X points out that'],
 'Report with confidence':['X demonstrates that','X establishes that','X provides strong evidence that','X confirms that','X shows convincingly that'],
 'Report cautiously':['X suggests that','X proposes that','X speculates that','X tentatively concludes that','X implies that'],
 'Report critically':['X claims, without direct evidence, that','X overlooks','X’s argument rests on the assumption that','However, X does not account for','X’s small sample limits how far the findings apply to'],
 'Put sources in conversation':['Where X sees ___, Y argues that','X and Y agree that ___, but differ on','Y extends X’s finding by showing that','Y challenges X’s claim that','Building on X, Y','Unlike X, Y'],
 'Explain after a quote':['In other words,','This suggests that','X’s point is that','This matters because','Put simply, X is claiming that','This supports my argument that'],
 'Hedge your own claim':['This may indicate that','It seems likely that','These results suggest, rather than prove, that','One possible explanation is that','To some extent,'],

    $('#wprev').innerHTML=(R2.html||'<p class="notes">Your formatted text will appear here.</p>')+(R2.bib?`<h3 style="margin-top:1.5rem">${LISTNAME[S.style]}</h3><div class="bib">${R2.bib}</div>`:'');

  el.innerHTML=`<div class="tablewrap"><table class="mtx"><thead><tr><th>Objective</th>${MCOL.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${p.obj.map((o,i)=>`<tr><td>${i+1}. ${esc(o.text||'(empty)')}</td>${MCOL.map(([k,l])=>`<td><textarea data-mx="${i}" data-k="${k}" aria-label="${l} for objective ${i+1}">${esc(o[k]||'')}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div><div id="mtxW"></div>`;
  const warn=()=>{const w=[];p.obj.forEach((o,i)=>{const miss=MCOL.filter(([k])=>!(o[k]||'').trim()).map(c=>c[1].toLowerCase());if(o.text&&miss.length)w.push(`Objective ${i+1} has no ${miss.join(', ')} yet.`);const t=(o.text||'').toLowerCase(),m=(o.method||'').toLowerCase()+' '+(o.analysis||'').toLowerCase();
   if(/\b(effect|impact|cause|relationship|correlat|predict)/.test(t)&&/\b(interview|focus group|thematic)/.test(m)&&!/\b(survey|experiment|regression|statistic|model|measure)/.test(m))w.push(`Objective ${i+1} asks about effects or relationships, but its method is only qualitative. Check that the method can answer it, or reword the objective.`);
   if(/\b(experience|perception|meaning|how do .* make sense)/.test(t)&&/\b(experiment|regression|anova|t-test)/.test(m)&&!/\b(interview|focus|qualitative|open)/.test(m))w.push(`Objective ${i+1} is about experiences or meanings, but its method is only statistical. Consider interviews or open questions.`)});
   $('#mtxW').innerHTML=w.length?`<div class="fb warnbox"><b>Check these</b><ul>${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<p class="notes">✓ Every objective has a question, method, data, analysis and chapter.</p>'};
  $$('[data-mx]',el).forEach(t=>t.oninput=()=>{p.obj[t.dataset.mx][t.dataset.k]=t.value;save();warn()});warn()}
function drawBud(){const el=$('#bud');if(!el)return;const p=S.proj,b=BUDGET[p.type]||BUDGET.dissertation,w=num(p.words);

function milestones(){const p=S.proj;if(!p.start||!p.end)return null;const s=new Date(p.start+'T12:00:00'),e=new Date(p.end+'T12:00:00'),d=Math.round((e-s)/864e5);if(d<7)return[];const b=BUDGET[p.type]||BUDGET.dissertation;
  const steps=[['Agree topic, questions and objectives with your supervisor',8],['Submit ethics application, if needed',12],['Draft the literature review',25]].concat(p.type==='essay'?[]:[['Finish data collection',50],['Finish data analysis',62]]).concat([['Full first draft of all sections',80],['Revise using feedback',90],['Final proofread, references and formatting',96],['Submit',100]]);
  return steps.map(([t,pc])=>({t,date:addDays(s,Math.round(d*pc/100))}))}
function drawMil(){const el=$('#mil');if(!el)return;const m=milestones();if(!m){el.innerHTML='<p class="notes">Enter start and submission dates.</p>';return}if(!m.length){el.innerHTML='<div class="fb no">The submission date must be at least a week after the start.</div>';return}
  el.innerHTML=`<ol class="tl">${m.map(x=>`<li><span><b>${x.t}</b><span class="tlm">by ${dstr(x.date)}</span></span></li>`).join('')}</ol><button class="btn small" id="milI">Add to my calendar (.ics)</button><p class="notes">Proportions follow common supervisor advice: start writing early, and leave at least 20% of the time for revision.</p>`;

function projDoc(html){const p=S.proj,e=s=>html?esc(s).replace(/\n/g,'<br>'):s;const H=(t)=>html?`<h2>${esc(t)}</h2>`:`\n\n${t.toUpperCase()}\n`;
  let out=(html?`<html><head><meta charset="utf-8"><title>${esc(p.title||'Research project')}</title><style>body{font-family:Calibri,Arial,sans-serif;line-height:1.5;max-width:780px;margin:auto}h1{font-size:20pt}h2{font-size:14pt;margin-top:18pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4pt;vertical-align:top;font-size:10pt}</style></head><body><h1>${esc(p.title||'Working title')}</h1><p>${esc(PTYPE[p.type]||'')}${p.field?' · '+esc(p.field):''}${p.words?' · '+esc(p.words)+' words':''}</p>`:`${p.title||'Working title'}\n${PTYPE[p.type]||''}${p.field?' · '+p.field:''}`);
  PF.forEach(([g,fs])=>fs.forEach(f=>{if(f[0]==='title')return;out+=H(f[1])+(html?`<p>${e(p[f[0]]||'[to write]')}</p>`:(p[f[0]]||'[to write]'));if(f[0]==='aim'){out+=H('Objectives')+(html?'<ol>'+p.obj.map(o=>`<li>${e(o.text||'')}</li>`).join('')+'</ol>':p.obj.map((o,i)=>`${i+1}. ${o.text||''}`).join('\n'))}}));
  out+=H('Alignment matrix')+(html?`<table><tr><th>Objective</th>${MCOL.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${p.obj.map(o=>`<tr><td>${e(o.text||'')}</td>${MCOL.map(([k])=>`<td>${e(o[k]||'')}</td>`).join('')}</tr>`).join('')}</table>`:p.obj.map((o,i)=>`${i+1}. ${o.text||''}\n   `+MCOL.map(([k,l])=>`${l}: ${o[k]||''}`).join('\n   ')).join('\n'));
  const m=milestones();if(m&&m.length)out+=H('Timeline')+(html?'<ul>'+m.map(x=>`<li>${esc(dstr(x.date))}: ${esc(x.t)}</li>`).join('')+'</ul>':m.map(x=>`${dstr(x.date)}: ${x.t}`).join('\n'));
  if(S.lib.length)out+=H('References')+(html?bibHTML(S.lib,S.libStyle):strip(bibHTML(S.lib,S.libStyle).replace(/<\/p>/g,'\n')));
  return out+(html?'<p style="color:#777;font-size:9pt;margin-top:24pt">Drafted in Citadel (shagbaor.com/citadel.html).</p></body></html>':'\n')}

  <div class="panel"><h3 style="margin-top:0">Your draft</h3><div class="draft" id="bOut"></div><p class="notes" id="bWc"></p><div class="row"><button class="btn" id="bCopy">Copy</button>${onSave?`<button class="btn primary" id="bSave">${onSave[0]}</button>`:''}</div>${extra||''}</div></div>`);

TOOL_FN.topicnar=()=>builder('topicnar','tn',[['interest','1. Your broad interest','For example: water pollution; women in agriculture; mobile banking.',2],['narrow','2. Narrow it: which aspect, which people or materials, where and when?','For example: arsenic in borehole water used by rural schools in one state, 2020–2025.',3],['what','3. “I am studying…”','Your narrowed topic, in a phrase.',1],['why','4. “…because I want to find out…”','The question you want answered (how, why, whether, to what extent).',2],['so','5. “…in order to help my reader understand…”','Why the answer matters, and to whom.',2],['feas','6. Feasibility check','Can you get the data, in the time, with your skills, access, budget and ethics approval? Note any risks.',3]],
 d=>[d.what||d.why||d.so?`I am studying ${d.what||'…'} because I want to find out ${d.why||'…'} in order to help my reader understand ${d.so||'…'}.`:'',d.feas?'\nFeasibility notes: '+d.feas:''].join('').trim(),
 '<h4>Tips</h4><ul class="todo"><li>A topic you can state in one sentence, with a place, a group or material, and a time, is usually narrow enough for a master’s.</li><li>Search Google Scholar for your narrowed topic. Thousands of identical studies mean you need a sharper angle; none at all may mean data are hard to get.</li><li>This three-step sentence follows the approach in Booth et al., <i>The Craft of Research</i>.</li></ul>',['Save as my topic statement',t=>toProj('topic',t,'topic statement')]);

TOOL_FN.rqcheck=()=>{S.rqc=S.rqc||{q:''};toolShell('rqcheck',`<label for="rqIn">Your research question</label><textarea id="rqIn" style="min-height:4rem">${esc(S.rqc.q)}</textarea><div id="rqOut" class="panel" style="margin-top:1rem" aria-live="polite"></div>
  <div class="panel" style="margin-top:1rem"><h3 style="margin-top:0">FINER self-check</h3><p class="notes">A widely used test from clinical research (Hulley, Cummings and colleagues) that works in any field.</p><div class="checklist">${[['F','Feasible: I can answer it with the time, data, skills, access and money I have.'],['I','Interesting: it matters to me, my supervisor and my field.'],['N','Novel: it adds something; I have checked the literature.'],['E','Ethical: it can be done without unacceptable risk, and will get approval.'],['R','Relevant: the answer would change thinking, practice or policy.']].map(([k,t])=>`<label><input type="checkbox" data-fn="${k}" ${S.rqc[k]?'checked':''}> <b>${k}</b> · ${t}</label>`).join('')}</div></div>
  <div class="row" style="margin-top:1rem"><button class="btn primary" id="rqSave">Add to my project</button><button class="btn small ghost" data-unit="rq">Unit: research questions</button></div>`);
  const draw=()=>{const q=$('#rqIn').value.trim();S.rqc.q=q;save();const o=$('#rqOut');if(!q){o.innerHTML='<p class="notes">Type a question to get feedback.</p>';return}const lo=q.toLowerCase(),f=[],g=[];
   const type=/^(to what extent|how far)\b/.test(lo)?'Evaluative (degree)':/\b(effect|impact|influence|cause|lead to|result in)\b/.test(lo)?'Causal or explanatory':/\b(relationship|associat|correlat|differ|compare|between)\b/.test(lo)?'Relational or comparative':/^(how do|how does|what are the experiences|what do|in what ways|why do|why does)\b/.test(lo)?'Exploratory or interpretive (often qualitative)':/^(what is|what are|how many|how much|what proportion|which)\b/.test(lo)?'Descriptive':'Unclear: start with a question word that shows what you want to know';
   if(/^(is|are|does|do|did|can|will|should|has|have|was|were)\b/.test(lo))f.push('It can be answered yes or no. Rephrase with “to what extent”, “how” or “what factors” to ask for analysis.');
   if(/\b(should|ought|good|bad|better|worse|failure|success)\b/.test(lo))f.push('It contains a value judgement. Name what you will measure or explore instead of judging in advance.');
   if(!/\?$/.test(q))f.push('Research questions end with a question mark.');
   const n=wc(q);if(n<8)f.push('Very short: it probably lacks the population, setting, variables or time frame.');if(n>40)f.push('Very long: split it into a main question and sub-questions.');
   if(/\b(and|as well as)\b.*\b(and|as well as)\b/.test(lo))f.push('It may combine several questions. One main question, with sub-questions, is easier to answer and assess.');
   if(/\b(things|stuff|issues|aspects|factors)\b/.test(lo)&&!/\bwhat factors\b/.test(lo))f.push('Vague nouns such as “issues” or “aspects” hide what you will actually study. Name them.');
   if(/\b(in|among|amongst|for)\b/.test(lo))g.push('Names a population or setting.');else f.push('Say who or where: a population, setting or case.');
   if(/\b(19|20)\d\d\b|\bsince\b|\bduring\b|\bbetween \d/.test(lo))g.push('Has a time frame.');
   o.innerHTML=`<p><b>Type:</b> ${type}</p>${g.length?`<ul class="why">${g.map(x=>`<li>✓ ${x}</li>`).join('')}</ul>`:''}${f.length?`<div class="fb warnbox"><b>Consider</b><ul>${f.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'<p class="notes">No common wording problems found. Now test it against FINER, and with your supervisor.</p>'}<p class="notes">These checks look at wording only. Whether a question is good depends on your problem, your literature and your methods.</p>`};
  $('#rqIn').oninput=draw;$$('[data-fn]').forEach(b=>b.onchange=()=>{S.rqc[b.dataset.fn]=b.checked;save()});draw();
  $('#rqSave').onclick=()=>{const q=$('#rqIn').value.trim();if(!q)return;S.proj=S.proj||{type:'dissertation',obj:[]};S.proj.rqs=((S.proj.rqs||'').trim()+'\n'+q).trim();save();toast('Added to your research questions')}};

TOOL_FN.aims=()=>{S.ao=S.ao||{aim:'',obj:['','','']};const a=S.ao;toolShell('aims',`<div class="split"><div class="panel"><label for="aoAim">Aim: the overall purpose, in one sentence</label><textarea id="aoAim" style="min-height:3.5rem" placeholder="This study aims to…">${esc(a.aim)}</textarea>

   $$('[data-ao]').forEach(t=>t.oninput=()=>{a.obj[t.dataset.ao]=t.value;save();chk()});$$('[data-aod]').forEach(b=>b.onclick=()=>{a.obj.splice(+b.dataset.aod,1);save();drawL();chk()})};
  const chk=()=>{a.aim=$('#aoAim').value;save();const w=[],ob=a.obj.filter(x=>x.trim());if(!a.aim.trim())w.push('Write the aim first.');else if(wc(a.aim)>45)w.push('The aim is long. One clear sentence is enough; move details into objectives.');

   $('#aoChk').innerHTML=w.length?`<ul class="why">${w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="notes">✓ No problems found. Check each objective is Specific, Measurable, Achievable, Relevant and Time-bound.</p>'};
  drawL();chk();$('#aoAim').oninput=chk;$('#aoAdd').onclick=()=>{a.obj.push('');save();drawL();chk()};

const ONION=[['phil','Research philosophy',[['positivism','Positivism','Reality exists independently and can be measured objectively; aims for law-like generalisations.'],['critical realism','Critical realism','Reality exists but we see it through layers; explains the underlying mechanisms behind what we observe.'],['interpretivism','Interpretivism','Reality is understood through people’s meanings and experiences; aims for rich, contextual understanding.'],['postmodernism','Postmodernism','Questions dominant accounts and the power behind knowledge.'],['pragmatism','Pragmatism','Chooses whatever methods best answer the practical question.']]],
 ['appr','Approach to theory',[['deductive','Deductive','Start from theory, form hypotheses, test them with data.'],['inductive','Inductive','Start from data, build patterns and theory from it.'],['abductive','Abductive','Move back and forth between surprising data and the best explanation.']]],
 ['choice','Methodological choice',[['quantitative','Quantitative','Numerical data and statistical analysis.'],['qualitative','Qualitative','Words, images and meanings, analysed interpretively.'],['mixed','Mixed methods','Combines both, with a planned way of integrating them.']]],
 ['strat','Strategy',[['experiment','Experiment','Manipulate a variable under control and measure the effect.'],['survey','Survey','Standardised questions to a sample, often for generalisation.'],['case study','Case study','In-depth study of one or a few cases in their real context.'],['ethnography','Ethnography','Immersion in a group or setting over time.'],['grounded theory','Grounded theory','Building theory systematically from data.'],['action research','Action research','Changing practice in cycles with participants.'],['archival','Archival or documentary','Analysing existing records, documents or datasets.'],['modelling','Modelling and simulation','Building and testing computational or physical models.']]],
 ['time','Time horizon',[['cross-sectional','Cross-sectional','One point in time.'],['longitudinal','Longitudinal','Change over time.']]],
 ['tech','Techniques',[['questionnaire','Questionnaire',''],['structured interviews','Structured interviews',''],['semi-structured interviews','Semi-structured interviews',''],['focus groups','Focus groups',''],['observation','Observation',''],['measurements','Laboratory or field measurements',''],['secondary data','Secondary data','']]]];
function onionWarn(o){const w=[],has=(k,v)=>(o[k]||[]).includes(v);
  if(has('phil','positivism')&&has('choice','qualitative')&&!has('choice','mixed'))w.push('Positivism with a purely qualitative choice is unusual. Justify it carefully, or reconsider.');
  if(has('phil','interpretivism')&&has('appr','deductive'))w.push('Interpretivism usually goes with an inductive or abductive approach.');
  if(has('phil','positivism')&&has('appr','inductive'))w.push('Positivism usually goes with a deductive approach.');
  if(has('choice','quantitative')&&['grounded theory','ethnography'].some(s=>has('strat',s)))w.push('Grounded theory and ethnography are mostly qualitative strategies.');
  if(has('choice','qualitative')&&['experiment'].some(s=>has('strat',s)))w.push('Experiments are mostly quantitative.');
  if(has('choice','qualitative')&&has('tech','questionnaire')&&!has('tech','semi-structured interviews'))w.push('Closed questionnaires produce quantitative data. If your choice is qualitative, use open questions or interviews.');
  if(has('choice','mixed')&&!has('phil','pragmatism')&&!has('phil','critical realism'))w.push('Mixed methods are most often justified through pragmatism or critical realism.');
  return w}
TOOL_FN.onion=()=>{S.on=S.on||{};const o=S.on;toolShell('onion',`<p class="notes" style="max-width:72ch">Based on the “research onion” of Saunders, Lewis and Thornhill (<i>Research Methods for Business Students</i>), and widely used beyond business. Work from the outer layer inwards. Many lab and engineering theses do not include a philosophy section: ask your supervisor what your field expects.</p>
  <div class="onion">${ONION.map(([k,l,opts],i)=>`<div class="panel layer"><h4 style="margin-top:0"><span class="jn sm">${i+1}</span> ${l}</h4><div class="seg wrapseg">${opts.map(([v,n,d])=>`<button class="segb ${(o[k]||[]).includes(v)?'on':''}" data-on="${k}" data-v="${v}" title="${esc(d)}">${n}</button>`).join('')}</div><p class="notes" id="od_${k}"></p></div>`).join('')}</div>
  <div class="panel" style="margin-top:1rem"><h3 style="margin-top:0">Consistency and justification</h3><div id="onW"></div><h4>Justification scaffold</h4><div class="draft" id="onOut"></div><div class="row"><button class="btn" id="onCp">Copy</button><button class="btn primary" id="onSave">Save to my project</button><button class="btn small ghost" data-unit="philosophy">Unit: research philosophy</button></div></div>`);
  const multi=['strat','tech','choice'];
  const draw=()=>{ONION.forEach(([k,,opts])=>{const s=(o[k]||[]).map(v=>opts.find(x=>x[0]===v)).filter(Boolean);$('#od_'+k).textContent=s.map(x=>x[1]+(x[2]?': '+x[2]:'')).join(' ')});
   const w=onionWarn(o);$('#onW').innerHTML=w.length?`<div class="fb warnbox"><ul>${w.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'<p class="notes">✓ No obvious mismatches. You still need to justify each choice from your research questions.</p>';
   const j=(k)=>(o[k]||[]).join(' and ')||'[choose]';
   $('#onOut').textContent=`This study adopts a ${j('phil')} philosophy because [explain how it fits your view of the reality you are studying and how knowledge about it can be gained]. Consistent with this, it follows a ${j('appr')} approach, [explain the role of theory]. A ${j('choice')} methodological choice was made because the research questions ask [what kind of questions]. The strategy is ${j('strat')}, which suits [reason], and the study is ${j('time')}. Data are collected through ${j('tech')}. [Cite methodological sources, for example Saunders et al. or Creswell and Creswell, for each choice.]`};
  $$('[data-on]').forEach(b=>b.onclick=()=>{const k=b.dataset.on,v=b.dataset.v;let a=o[k]||[];if(multi.includes(k))a=a.includes(v)?a.filter(x=>x!==v):a.concat(v);else a=a.includes(v)?[]:[v];o[k]=a;save();$$(`[data-on="${k}"]`).forEach(x=>x.classList.toggle('on',a.includes(x.dataset.v)));draw()});draw();
  $('#onCp').onclick=async()=>toast(await copyText($('#onOut').textContent)?'Copied':'Select and copy the text');$('#onSave').onclick=()=>toProj('philosophy',$('#onOut').textContent,'philosophy and approach')};

TOOL_FN.annot=()=>{S.an=S.an||{};const lib=S.lib;toolShell('annot',`<p class="notes" style="max-width:72ch">An annotation is a short paragraph after each reference. Descriptive annotations summarise; evaluative (critical) annotations also judge quality and say how the source helps your work, which is what most postgraduate tasks expect.</p>
  ${lib.length?'':'<div class="fb warnbox">Your library is empty. <button class="btn small" data-go="lib">Add sources in the Library</button> first; they appear here automatically.</div>'}
  <div class="row"><label for="anStyle" style="margin:0">Reference style</label><select id="anStyle" style="width:auto">${Object.entries(STYLES).map(([k,v])=>`<option value="${k}" ${S.libStyle===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div id="anL"></div><div class="row" style="margin-top:1rem"><button class="btn primary" id="anDl">Download annotated bibliography (Word)</button><button class="btn small ghost" data-unit="annot">Unit: annotated bibliographies</button></div>`);
  const P=[['sum','Summary','What is the source about? Question, method, main findings or argument.'],['eval','Evaluation','How strong is it? Methods, sample, evidence, bias, currency, author’s expertise.'],['use','Relevance to my work','How will you use it? What does it add, support or challenge?']];
  const draw=()=>{$('#anL').innerHTML=lib.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b))).map(r=>{const a=S.an[r.id]||{};const n=P.reduce((x,[k])=>x+wc(a[k]||''),0);return`<div class="panel gsq"><p class="ref">${formatRef(r,S.libStyle,1)}</p>${P.map(([k,l,h])=>`<label>${l}</label><textarea data-an="${r.id}" data-k="${k}" placeholder="${h}" style="min-height:3rem">${esc(a[k]||'')}</textarea>`).join('')}<p class="wc">${n} words · aim for 100–200</p></div>`}).join('');
   $$('[data-an]').forEach(t=>t.oninput=()=>{const id=t.dataset.an;S.an[id]=S.an[id]||{};S.an[id][t.dataset.k]=t.value;save()})};draw();
  $('#anStyle').onchange=e=>{S.libStyle=e.target.value;save();draw()};
  $('#anDl').onclick=()=>{if(!lib.length){toast('Add sources to your library first.');return}const L=lib.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));saveFile('annotated-bibliography.doc',`<html><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif;line-height:1.5}p.r{margin:14pt 0 4pt;padding-left:2em;text-indent:-2em}p.a{margin:0 0 0 2em}</style></head><body><h1>Annotated bibliography</h1>${L.map(r=>{const a=S.an[r.id]||{};return`<p class="r">${formatRef(r,S.libStyle,1)}</p><p class="a">${esc(P.map(([k])=>(a[k]||'').trim()).filter(Boolean).join(' '))}</p>`}).join('')}</body></html>`)}};

const RV=[['Neutral: reporting what a source says','states, describes, reports, notes, observes, explains, outlines','Okoro (2021) reports that yields fell by a third in drought years.'],['Arguing a position','argues, claims, contends, maintains, asserts, proposes, suggests','Mensah (2019) argues that subsidies distort fertiliser markets.'],['Showing the source found something','found, showed, demonstrated, established, confirmed, revealed','Patel and Rao (2022) found a strong association between distance to clinic and missed appointments.'],['Tentative claims','suggests, implies, speculates, hypothesises, indicates','The pattern suggests that tariff changes affect rural users first (Ahmed, 2020).'],['Agreeing or building on','supports, extends, builds on, echoes, corroborates','This finding extends earlier work on smallholder credit (Bello, 2018).'],['Disagreeing or critical','challenges, questions, disputes, refutes, criticises, overlooks','Wanjiru (2023) challenges this view, noting that the samples were urban only.'],['Synthesising several sources','Several studies agree that…; While X emphasises…, Y focuses on…; Evidence is mixed: …','While Okafor (2020) stresses cost, Lindqvist (2021) points to trust as the main barrier.']];
TOOL_FN.verbs=()=>toolShell('verbs',`<p class="notes" style="max-width:72ch">The verb you choose tells the reader what kind of claim a source makes and what you think of it. “Shows” and “proves” are strong; “suggests” is cautious; “claims” can signal doubt. The example sentences are written for Citadel and use invented citations.</p>
 <div class="tablewrap panel"><table><thead><tr><th>Function</th><th>Verbs and patterns</th><th>Example</th></tr></thead><tbody>${RV.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><i>${r[2]}</i></td></tr>`).join('')}</tbody></table></div>
 <h3>Tense</h3><ul class="todo"><li><b>Present</b> for what a source argues or what is generally accepted: “Swales describes…”.</li><li><b>Past</b> for what a specific study did or found: “Bello (2018) surveyed 300 farmers”.</li><li><b>Present perfect</b> for a body of research up to now: “Several studies have examined…”.</li></ul>
 <p><a class="btn small ghost" href="https://www.phrasebank.manchester.ac.uk/referring-to-sources/" target="_blank" rel="noopener">Manchester Academic Phrasebank: referring to sources ↗</a> <button class="btn small ghost" data-go="write">Phrase bank in the Writing desk</button></p>`);

TOOL_FN.outline=()=>{S.ol=S.ol||{type:'article',words:''};const o=S.ol;const D={article:'Journal article (IMRaD): Introduction, Methods, Results and Discussion. The introduction narrows from the field to your question, methods and results report, and the discussion widens back out to meaning and implications: the “hourglass” shape.',dissertation:'Master’s dissertation: usually five or six chapters. Some fields combine results and discussion; some use thematic chapters.',thesis:'PhD thesis: a traditional monograph has the chapters below. A thesis by publication instead links three to five papers with an introduction and a synthesis chapter.',proposal:'Research proposal: argues that the study is needed, well designed and feasible.',essay:'Essay: an introduction with a thesis statement, body paragraphs that develop one argument, and a conclusion.'};
  toolShell('outline',`<div class="panel"><div class="grid3"><div><label for="olT">Type</label><select id="olT">${Object.entries(PTYPE).map(([k,v])=>`<option value="${k}" ${o.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="olW">Word limit</label><input type="text" inputmode="numeric" id="olW" value="${esc(o.words)}" placeholder="8000"></div></div><p id="olD"></p><div id="olB"></div></div>
  <div class="row" style="margin-top:1rem"><button class="btn small ghost" data-unit="imrad">Unit: IMRaD</button><button class="btn small ghost" data-unit="thesis">Unit: dissertations and theses</button><button class="btn small ghost" data-unit="genres">Unit: academic genres</button></div>`);
  const draw=()=>{o.type=$('#olT').value;o.words=$('#olW').value;save();const w=num(o.words);$('#olD').textContent=D[o.type];$('#olB').innerHTML=`<table class="ftab"><tbody>${BUDGET[o.type].map(([s,p])=>`<tr><td>${s}</td><td>${p}%</td><td>${w?Math.round(w*p/100).toLocaleString()+' words':''}</td></tr>`).join('')}</tbody></table><p class="notes">A typical starting split. Your handbook, supervisor or journal guidelines always come first.</p>`};
  $('#olT').onchange=draw;$('#olW').oninput=draw;draw()};
TOOL_FN.cars=()=>builder('cars','cars',[['t1','Move 1a: Establish the territory','Show the topic is important or active. Example pattern: “X has become central to…”',3],['t2','Move 1b: Review what is known','Summarise key research, with citations.',4],['n1','Move 2: Establish the niche','Show what is missing, contested or problematic. Patterns: “However, little is known about…”; “Few studies have…”',3],['o1','Move 3a: Occupy the niche: your aim','“This study aims to…” or “This paper examines…”',2],['o2','Move 3b: Questions, approach or main finding','Your research questions, and, for articles in some fields, the main finding.',2],['o3','Move 3c: Value and structure','Why it matters, and how the rest of the work is organised.',3]],
 d=>[[d.t1,d.t2].map(sent).filter(Boolean).join(' '),sent(d.n1),[d.o1,d.o2,d.o3].map(sent).filter(Boolean).join(' ')].filter(Boolean).join('\n\n'),
 '<p class="notes">Based on John Swales’ Create a Research Space (CARS) model, taught in Swales and Feak, <i>Academic Writing for Graduate Students</i>.</p><button class="btn small ghost" data-unit="intro">Unit: writing introductions</button>');
TOOL_FN.abstract=()=>{S.ab=S.ab||{limit:'250'};const a=S.ab;const M=[['bg','Background','Why the topic matters, in one or two sentences.'],['aim','Aim','What the study set out to do.'],['meth','Methods','Design, sample or materials, and analysis.'],['res','Results','The main findings, with key numbers where relevant.'],['con','Conclusion and implications','What the findings mean, and for whom.']];
  toolShell('abstract',`<div class="split"><div class="panel"><label for="abL">Word limit</label><input type="text" inputmode="numeric" id="abL" value="${esc(a.limit)}" style="max-width:8rem">${M.map(([k,l,h])=>`<label for="ab_${k}">${l}</label><p class="notes" style="margin:.1rem 0 .3rem">${h}</p><textarea id="ab_${k}" data-ab="${k}" style="min-height:3.5rem">${esc(a[k]||'')}</textarea>`).join('')}<label><input type="checkbox" id="abS" ${a.struct?'checked':''}> Structured abstract (with headings)</label></div>
  <div class="panel"><h3 style="margin-top:0">Your abstract</h3><div class="draft" id="abO"></div><p class="wc" id="abW"></p><div id="abM"></div><button class="btn" id="abC">Copy</button><h4>Checklist</h4><ul class="todo"><li>No citations, abbreviations you do not define, or claims not in the paper.</li><li>Results take the most space; methods are specific.</li><li>Past tense for what you did and found; present for conclusions.</li></ul><button class="btn small ghost" data-unit="abstract">Unit: abstracts and titles</button></div></div>`);
  const draw=()=>{$$('[data-ab]').forEach(t=>a[t.dataset.ab]=t.value);a.limit=$('#abL').value;a.struct=$('#abS').checked;save();const txt=a.struct?M.filter(([k])=>(a[k]||'').trim()).map(([k,l])=>l+': '+a[k].trim()).join('\n'):M.map(([k])=>(a[k]||'').trim()).filter(Boolean).join(' ');
   const n=wc(txt),L=num(a.limit);$('#abO').textContent=txt||'Start writing each move on the left.';const W=$('#abW');W.textContent=n+(L?' of '+L:'')+' words';W.classList.toggle('over',L&&n>L);
   $('#abM').innerHTML='<p class="notes">'+M.map(([k,l])=>`${l}: ${wc(a[k]||'')}`).join(' · ')+'</p>';return txt};
  $$('[data-ab],#abL').forEach(t=>t.oninput=draw);$('#abS').onchange=draw;draw();$('#abC').onclick=async()=>toast(await copyText(draw())?'Copied':'Select and copy the text')};
TOOL_FN.titlehelp=()=>{S.th=S.th||{t:'',k:''};toolShell('titlehelp',`<label for="thT">Title</label><input type="text" id="thT" value="${esc(S.th.t)}"><div id="thO" class="panel" style="margin-top:.8rem"></div>
  <label for="thK">Keywords (separate with semicolons)</label><input type="text" id="thK" value="${esc(S.th.k)}"><div id="thKO"></div>
  <h4>Title patterns</h4><ul class="todo"><li><b>Descriptive:</b> what was studied, where and how. “Arsenic in school borehole water in [state]: a cross-sectional survey”.</li><li><b>Declarative:</b> states the main finding. Common in some sciences.</li><li><b>Question:</b> asks the research question. Use sparingly.</li><li><b>Two-part:</b> an engaging phrase, a colon, then a precise description.</li></ul><button class="btn small" id="thSave">Save title to my project</button>`);
  const draw=()=>{const t=$('#thT').value.trim(),k=$('#thK').value;S.th={t,k};save();const f=[],g=[],n=wc(t),lo=t.toLowerCase();
   if(!t){$('#thO').innerHTML='<p class="notes">Type a title for feedback.</p>'}else{if(n<6)f.push('Short titles are often too general to be found or understood.');else if(n>20)f.push('Long titles are harder to read. Many journals prefer under about 15 to 20 words.');else g.push(n+' words.');
    if(/^(a |an )?(study|investigation|analysis|research) (of|on|into)\b/.test(lo))f.push('“A study of…” adds no information. Start with the key term instead.');
    if(/\b[A-Z]{2,}\b/.test(t))f.push('Spell out abbreviations, unless universally known (DNA, HIV).');
    if(/\?$/.test(t))g.push('Question title: make sure the paper answers it clearly.');
    if(/:/.test(t))g.push('Two-part title.');
    $('#thO').innerHTML=(g.length?`<p class="notes">${g.join(' ')}</p>`:'')+(f.length?`<ul class="why">${f.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="notes">✓ No common problems found. Does it name the topic, the setting or population, and the method or main finding?</p>')}
   const ks=k.split(';').map(x=>x.trim()).filter(Boolean),inT=ks.filter(x=>lo.includes(x.toLowerCase()));$('#thKO').innerHTML=ks.length?`<p class="notes">${ks.length} keywords. ${inT.length?`Already in the title: ${inT.map(esc).join(', ')}. Keywords usually add terms that are not in the title.`:'Good: they add terms beyond the title.'} Use the words people in your field actually search for, including synonyms.</p>`:''};
  $('#thT').oninput=draw;$('#thK').oninput=draw;draw();$('#thSave').onclick=()=>toProj('title',$('#thT').value.trim(),'title')};
TOOL_FN.peel=()=>builder('peel','pe',[['p','Point: the topic sentence','The paragraph’s one claim, linked to your argument.',2],['e','Evidence','Data, examples or sources, with citations.',4],['x','Explanation and analysis','What the evidence means, how strong it is, and why it supports your point.',4],['l','Link','Back to your argument, or forward to the next paragraph.',2]],
 d=>['p','e','x','l'].map(k=>sent(d[k])).filter(Boolean).join(' '),
 '<h4>Check</h4><ul class="todo"><li>Does the explanation take at least as much space as the evidence? That is where your marks are.</li><li>One main point per paragraph. Usually 150–250 words.</li></ul><button class="btn small ghost" data-unit="paragraph">Unit: sentences, paragraphs and flow</button>');

/* --- style checker --- */
const INF={"a lot of":"many / much / a large number of","lots of":"many / considerable","really":"(delete) / considerably","very":"(delete, or choose a stronger word)","pretty":"fairly / relatively","stuff":"material / items / factors","things":"factors / aspects / elements (name them)","get":"obtain / become / receive","got":"obtained / became","big":"large / substantial","huge":"considerable / substantial","kind of":"somewhat / rather","sort of":"somewhat / rather","nowadays":"currently / at present","basically":"(delete)","totally":"completely / entirely","okay":"acceptable / satisfactory","ok":"acceptable","anyway":"(delete) / in any case","so much":"considerably","bad":"poor / adverse / negative","good":"effective / beneficial / strong","like":"such as / for example (when giving examples)","etc.":"(finish the list, or use “such as”)","and so on":"(finish the list)","til":"until","gonna":"going to","wanna":"want to","maybe":"perhaps / possibly","cool":"(choose a precise word)","amazing":"notable / remarkable","awesome":"(choose a precise word)","figure out":"determine / establish","find out":"discover / determine","look into":"investigate / examine","come up with":"develop / propose","point out":"note / observe","go up":"increase / rise","go down":"decrease / fall","talk about":"discuss / examine","deal with":"address / manage","in today's world":"currently / at present","since the dawn of time":"(delete)","it goes without saying":"(delete)"};
const BOOST=['prove','proves','proved','definitely','undoubtedly','always','never','clearly','obviously','certainly','without doubt','it is clear that','everyone knows','all researchers','no one'];
const HEDGE=['may','might','could','suggest','suggests','appears','seems','likely','possibly','tend','indicate','indicates','perhaps','to some extent'];
TOOL_FN.stylecheck=()=>{S.sc=S.sc||'';toolShell('stylecheck',`<p class="notes" style="max-width:72ch">Paste a paragraph or a section. Citadel flags common features of informal writing and gives a quick profile. Treat flags as prompts, not rules: some fields use “I” and the active voice by design, and a few informal words are fine in quotations.</p><label for="scIn">Your text</label><textarea id="scIn" style="min-height:12rem">${esc(S.sc)}</textarea><div id="scS" class="cols" style="margin-top:1rem"></div><div id="scO" class="panel" style="margin-top:1rem"></div><button class="btn small ghost" data-unit="style">Unit: academic style and voice</button>`);
  const draw=()=>{const t=$('#scIn').value;S.sc=t;save();if(!t.trim()){$('#scS').innerHTML='';$('#scO').innerHTML='<p class="notes">Paste text above to check it.</p>';return}
   const sents=t.replace(/\b(e\.g|i\.e|et al|etc|vs|cf|Dr|Prof|Fig|No)\./g,'$1').split(/(?<=[.?!])\s+/).filter(s=>wc(s)>2),words=wc(t),avg=sents.length?Math.round(words/sents.length):0,long=sents.filter(s=>wc(s)>35);
   const issues=[];const lo=' '+t.toLowerCase()+' ';
   const contr=t.match(/\b\w+(n't|'re|'ve|'ll|'d|'m)\b|\b(it's|that's|there's|let's|what's)\b/gi)||[];if(contr.length)issues.push(['Contractions',`Write them in full in academic prose: ${[...new Set(contr.map(x=>x.toLowerCase()))].slice(0,8).join(', ')}.`]);
   Object.entries(INF).forEach(([w,r])=>{const re=new RegExp('(^|[^a-z])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[^a-z]|$)','i');if(re.test(lo))issues.push([`“${w}”`,'Informal or vague. Consider: '+r])});
   const b=BOOST.filter(w=>new RegExp('\\b'+w+'\\b','i').test(t)),h=HEDGE.filter(w=>new RegExp('\\b'+w+'\\b','i').test(t));if(b.length)issues.push(['Strong claims',`“${b.join('”, “')}” may overclaim. Is the evidence that certain? Research rarely proves; it supports or suggests.`]);
   const fp=(t.match(/\b(I|me|my|we|our|us)\b/g)||[]).length,you=(t.match(/\b(you|your)\b/gi)||[]).length;if(you)issues.push(['Addressing the reader',`“you” appears ${you} time${you>1?'s':''}. Academic writing rarely addresses the reader directly; use “researchers”, “one” or a passive.`]);
   const q=(t.match(/\?/g)||[]).length;if(q>1)issues.push(['Questions',`${q} questions. Rhetorical questions are used sparingly in most academic writing; consider statements.`]);
   const ex=(t.match(/!/g)||[]).length;if(ex)issues.push(['Exclamation marks','Avoid them in academic prose.']);
   if(long.length)issues.push(['Long sentences',`${long.length} sentence${long.length>1?'s':''} over 35 words. Long sentences are harder to follow; consider splitting: “${esc(long[0].slice(0,90))}…”`]);
   const nom=(t.match(/\b\w{4,}(tion|ment|ness|ity|ance|ence)s?\b/gi)||[]).length;if(words>60&&nom/words>.09)issues.push(['Heavy nouns',`Many abstract nouns (${nom}). Turn some back into verbs: “make an assessment of” → “assess”.`]);
   const pas=(t.match(/\b(is|are|was|were|be|been|being)\s+(\w+ly\s+)?\w+(ed|en)\b/gi)||[]).length;
   const cites=(t.match(/\([A-Z][^()]*\d{4}[a-z]?[^()]*\)|\[\d+(?:[,–-]\d+)*\]|[A-Z][a-z]+ (?:et al\. )?\(\d{4}\)/g)||[]).length;
   if(words>120&&!cites)issues.push(['No citations found','A passage this long usually contains claims that need sources.']);
   $('#scS').innerHTML=[['Words',words],['Sentences',sents.length],['Average sentence',avg+' words'],['Possible passives',pas],['First person',fp],['Hedges / strong claims',h.length+' / '+b.length],['Citations found',cites]].map(([k,v])=>`<div class="panel stat2"><span>${k}</span><b>${v}</b></div>`).join('');
   $('#scO').innerHTML=issues.length?`<h3 style="margin-top:0">${issues.length} thing${issues.length>1?'s':''} to look at</h3><ul class="why">${issues.map(([k,v])=>`<li><b>${k}.</b> ${v}</li>`).join('')}</ul>`:'<p>✓ No common informal features found. Now read it aloud: does every sentence say exactly what you mean?</p>'};
  $('#scIn').oninput=draw;draw()};
TOOL_FN.reverse=()=>{S.ro=S.ro||'';toolShell('reverse',`<p class="notes" style="max-width:72ch">Reverse outlining: write down what each paragraph actually says, then check that the order makes an argument. Citadel lists the first sentence of every paragraph (separate paragraphs with a blank line). If the list does not read like a summary of your argument, revise the topic sentences or the order.</p><textarea id="roIn" style="min-height:12rem">${esc(S.ro)}</textarea><div id="roO" class="panel" style="margin-top:1rem"></div><button class="btn small ghost" data-unit="revise">Unit: revising and editing</button>`);

/* --- assignment decoder --- */
const TW={analyse:'Break the topic into parts and explain how they relate and why. More than describing.',assess:'Weigh up strengths and weaknesses or importance, and reach a judgement.',compare:'Show similarities and differences, and say which matter most.',contrast:'Focus on the differences, and why they matter.','critically evaluate':'Judge the strengths, weaknesses and evidence of ideas or research, and reach a supported conclusion.','critically analyse':'Examine the parts and assumptions in depth, question the evidence, and reach your own position.',critique:'Give a reasoned judgement of the quality of a work, with evidence, not just criticism.',define:'Give the precise meaning, often with how sources differ.',describe:'Say what something is like or how it happened. Usually only the first step.',discuss:'Explore different views and evidence, then reach a reasoned conclusion of your own.',evaluate:'Judge the value or success of something against criteria, using evidence.',examine:'Look closely at the topic, its details and its assumptions.',explain:'Make clear how or why something happens, with reasons.',illustrate:'Use examples to make a point clear.',interpret:'Explain the meaning of evidence or data and what it suggests.',justify:'Give good reasons and evidence for a decision or conclusion, and answer obvious objections.',outline:'Give the main points briefly, without detail.',propose:'Put forward a solution or plan, and show why it would work.',reflect:'Think about your own experience, what it means and what you will do differently, linked to theory.',review:'Survey and judge what has been done or written, identifying gaps.',summarise:'Give the main points concisely, without your own commentary.',synthesise:'Combine ideas from several sources into a new whole, showing how they connect.','to what extent':'Make a judgement about how far something is true, considering evidence on both sides.',identify:'Point out and name the key features.',apply:'Use a theory or method on a specific case.',recommend:'Advise on a course of action, with reasons.',investigate:'Research the question systematically and report what you find.'};
TOOL_FN.decoder=()=>{toolShell('decoder',`<label for="dcIn">Paste your assignment question</label><textarea id="dcIn" placeholder="Critically evaluate the claim that...">${esc(S.dc||'')}</textarea><div id="dcOut" class="panel" style="margin-top:1rem" aria-live="polite"></div>
  <details style="margin-top:1rem"><summary>All task words</summary><dl class="gl">${Object.entries(TW).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></details>`);
  const keys=Object.keys(TW).sort((a,b)=>b.length-a.length);
  const draw=()=>{const s=$('#dcIn').value;S.dc=s;save();if(!s.trim()){$('#dcOut').innerHTML='<p class="notes">Task words will be highlighted here, with what each one asks you to do.</p>';return}
   let h=esc(s);const found=[];keys.forEach(k=>{const re=new RegExp('\\b('+k.replace(/ /g,'\\s+')+')(s|es|d|ing)?\\b','gi');if(re.test(h)&&!found.some(f=>f.includes(k))){found.push(k);h=h.replace(re,m=>`<mark>${m}</mark>`)}});
   $('#dcOut').innerHTML=`<p class="decoded">${h}</p>${found.length?`<h4>What you are being asked to do</h4><dl class="gl">${found.map(k=>`<dt>${k}</dt><dd>${TW[k]}</dd>`).join('')}</dl><p class="notes">Next: underline the topic words and any limits (dates, places, theories, word count). Then check the marking criteria, and ask your tutor if anything is unclear.</p>`:'<p class="notes">No task words found. Look for the verb that tells you what to do, or ask your tutor.</p>'}`};
  $('#dcIn').oninput=draw;draw()};

TOOL_FN.planner=()=>{S.ap=S.ap||{type:'essay',start:new Date().toISOString().slice(0,10),due:''};const a=S.ap;
  toolShell('planner',`<div class="panel"><div class="grid3"><div><label for="apT">Assignment type</label><select id="apT">${Object.entries(APN).map(([k,v])=>`<option value="${k}" ${a.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="apS">Start date</label><input type="date" id="apS" value="${esc(a.start)}"></div><div><label for="apD">Due date</label><input type="date" id="apD" value="${esc(a.due)}"></div></div></div><div id="apO"></div>`);
  const steps=()=>{if(!a.start||!a.due)return null;const s=new Date(a.start+'T12:00:00'),d=new Date(a.due+'T12:00:00'),days=Math.round((d-s)/864e5);if(days<1)return[];let acc=0;return APL[a.type].map(([t,p,u])=>{acc+=p;return{t,u,date:addDays(s,Math.max(0,Math.round(days*acc/100)-(acc===100?0:0)))}})};

   if(!st){$('#apO').innerHTML='<p class="notes">Enter a start and a due date.</p>';return}if(!st.length){$('#apO').innerHTML='<div class="fb no">The due date must be after the start date.</div>';return}
   $('#apO').innerHTML=`<ol class="tl">${st.map(x=>`<li><span><b>${x.t}</b><span class="tlm">finish by ${dstr(x.date)}</span>${x.u?(x.u==='decoder'?' <button class="btn small ghost" data-tool="decoder">Decoder</button>':LEVELS.find(l=>l.id===x.u)?` <button class="btn small ghost" data-unit="${x.u}">Unit: ${LEVELS.find(l=>l.id===x.u).title}</button>`:''):''}</span></li>`).join('')}</ol><div class="row"><button class="btn" id="apI">Add to my calendar (.ics)</button></div><p class="notes">Based on the step-by-step approach of university assignment calculators. Leave a buffer: aim to finish two days early.</p>`;
   $('#apI').onclick=()=>icsFile('assignment-plan.ics',st.map(x=>({date:x.date,title:APN[a.type]+': '+x.t})))};

   <div class="panel"><h3>Timed citation check</h3><p class="notes">60 seconds to name citation styles and choose correct in-text citations. Useful before an assignment deadline. Best so far: ${S.sprintBest||0}.</p><button class="btn" id="pSprint">Start</button></div>

function startSprint(){let score=0,wrong=0,t=60,q;current='practice';setTabs();P=null;
  view.innerHTML=`<section class="play"><div class="playbar"><button class="btn small ghost" id="exit">Stop</button><div class="prog"><span id="tbar" style="width:100%"></span></div><span class="count" id="tleft">60 s</span></div>
  <h2 class="lvltitle">Timed citation check: <span id="sc">0</span> correct</h2><p class="howto">Answer as many as you can. Your choice counts immediately; keys 1–4 work too.</p><div class="card" id="ch"></div><div id="flash" class="notes" style="min-height:1.6rem;margin-top:.6rem" aria-live="polite"></div></section>`;
  const next=()=>{q=Math.random()<.5?GEN.style():GEN.intext();$('#ch').innerHTML=`<div class="q">${q.q}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${k+1}</span>${o}</button>`).join('')}</div>`;
    $$('#ch .opt').forEach(b=>b.onclick=()=>{if(+b.dataset.k===q.a){score++;$('#sc').textContent=score;$('#flash').innerHTML='<span style="color:var(--ok)">Correct</span>'}else{wrong++;$('#flash').innerHTML=`<span style="color:var(--red)">It was: ${strip(q.opts[q.a])}</span>`}next()})};
  const end=()=>{const best=score>(S.sprintBest||0);if(best)S.sprintBest=score;save();
    view.innerHTML=`<section class="play"><div class="card result"><h2 style="margin-top:0">Time</h2><div class="big">${score}</div><p>${score} correct, ${wrong} wrong.${best&&score?' Your best so far.':` Your best is ${S.sprintBest||0}.`}</p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Go again</button><button class="btn ghost" data-go="practice">Done</button></div></div></section>`;$('#again').onclick=startSprint};
  const tick=setInterval(()=>{if(!$('#tleft')){clearInterval(tick);return}t--;$('#tleft').textContent=t+' s';$('#tbar').style.width=t/60*100+'%';if(t<=0){clearInterval(tick);end()}},1000);
  $('#exit').onclick=()=>{clearInterval(tick);go('practice')};next()}
function renderCards(){const deck=shuffle(LEVELS.flatMap(l=>l.learn.map(c=>Object.assign({lv:l.title},c))));let k=0,flip=false;current='practice';setTabs();

   <div class="actions row" style="justify-content:space-between"><button class="btn" id="fp" ${k?'':'disabled'}>Previous</button><button class="btn primary" id="fn">${k<deck.length-1?'Next card':'Start over'}</button></div></section>`;
