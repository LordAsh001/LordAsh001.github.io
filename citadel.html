   <h3 class="track">Free writing centres and guides</h3><div class="cols"><div class="panel"><ul class="linklist">
   ${L('https://www.phrasebank.manchester.ac.uk/','Manchester Academic Phrasebank','Phrases organised by section and by what you want to do.')}
   ${L('https://writingcenter.unc.edu/tips-and-tools/','UNC Writing Center handouts','Clear guides on every part of academic writing.')}
   ${L('https://owl.purdue.edu/owl/purdue_owl.html','Purdue OWL','Writing, research and citation guides.')}</ul></div><div class="panel"><ul class="linklist">
   ${L('https://www.equator-network.org/','EQUATOR Network','Reporting guidelines for health research (CONSORT, STROBE, PRISMA, COREQ).')}
   ${L('https://thinkchecksubmit.org/','Think. Check. Submit.','Check a journal is trustworthy before you submit.')}
   ${L('https://publicationethics.org/','COPE','Publication ethics guidance.')}</ul></div><div class="panel"><ul class="linklist">
   ${L('https://www.research4life.org/','Research4Life','Free or low-cost access to journals for institutions in many lower-income countries.')}
   ${L('https://www.ajol.org/','African Journals OnLine (AJOL)','Peer-reviewed journals published in Africa.')}
   ${L('https://doaj.org/','DOAJ','Directory of reputable open-access journals.')}</ul></div></div><h3 class="track">Referencing and research</h3>`);
  $('#bkq').oninput=e=>{const q=e.target.value.toLowerCase().trim();$$('#bkL li').forEach(li=>li.hidden=q&&!li.dataset.s.includes(q))}}

/* ============ guide & tour ============ */
const TOUR=[
 ['Welcome to Citadel','Citadel teaches academic writing from the building blocks up: topics, research questions, aims and objectives, research philosophy, methodology, literature reviews, IMRaD, referencing and publishing. It is free and needs no account.'],
 ['Follow the pathway','The Start page sets out seven stages that every dissertation, thesis and paper passes through, each linked to a unit and a tool. A short self-check tells you where to begin.'],
 ['Learn from short units','Courses has '+LEVELS.length+' units in six tracks. Each has lesson cards, weak-versus-strong worked examples, a task for your own project, textbook reading, and questions from a larger bank. Score 70% to complete a unit.'],
 ['Build your own project as you learn','My research project collects your topic, problem, questions, objectives, framework and methods, checks their alignment, and exports a proposal outline. Writing tools help you draft each part.'],
 ['Write and cite with integrity','Keep sources in the Library, write in the Writing desk with live citations in six styles, check your style, and declare any AI use honestly.'],
 ['Reading and language support','Is English not your first academic language? Language support underlines key terms you can tap for a plain definition, and opens paraphrasing tips. Every lesson also has a Listen button.','l2']];
function showTour(k=0){const d=$('#dlg');const[h,b,x]=TOUR[k];
  d.innerHTML=`<p class="notes">Step ${k+1} of ${TOUR.length}</p><h3 style="font-size:1.4rem">${h}</h3><p>${b}</p>
  ${x==='l2'?`<div class="row"><button class="btn ${S.l2?'primary':''}" id="tL2">${S.l2?'Language support is on':'Turn on language support'}</button></div>`:''}
  <div class="row" style="justify-content:space-between;margin-top:1.2rem"><button class="btn ghost" id="tSkip">${k===TOUR.length-1?'Close':'Skip tour'}</button><div class="row">${k?'<button class="btn" id="tBack">Back</button>':''}<button class="btn primary" id="tNext">${k===TOUR.length-1?'Get started':'Next'}</button></div></div>`;
  if(!d.open)d.showModal();
  const close=()=>{S.seenTour=true;save();d.close();renderHeader();go(current)};
  $('#tL2')&&($('#tL2').onclick=()=>{S.l2=!S.l2;save();showTour(k)});
  $('#tSkip').onclick=close;$('#tBack')&&($('#tBack').onclick=()=>showTour(k-1));$('#tNext').onclick=()=>k===TOUR.length-1?close():showTour(k+1);$('#tNext').focus()}
function renderGuide(){
  view.innerHTML=`<h2>Guide</h2><p class="notes" style="max-width:66ch">How to get the most from Citadel. New here? <button class="btn small" id="gTour">Take the two-minute tour</button></p>
  <div class="split"><div class="panel"><h3>Quick start</h3><ol class="tips">
    <li><b>Take the self-check</b> on the Start page to see which units to do first.</li>
    <li><b>Work through a unit:</b> read the cards and examples, do the “Your turn” task on your own work, then answer the questions.</li>
    <li><b>Build your project</b> in My research project as you go: topic, problem, questions, objectives, design.</li>
    <li><b>Use the writing tools</b> to draft each part, then send it to your project.</li>
    <li><b>Collect sources</b> in the Library, annotate them, and build a synthesis matrix for your literature review.</li>
    <li><b>Draft in the Writing desk,</b> run the style checker, and use the submission check before you hand in.</li>
    <li><b>Read the recommended textbook</b> for each unit; the Bookshelf in Resources lists them all.</li></ol></div>
   <div class="panel"><h3>Your settings</h3>
    <label style="margin-top:0">Language support</label><p class="notes">Underlines key terms you can tap for a plain definition, and opens paraphrasing tips and sentence starters.</p><button class="btn small ${S.l2?'primary':''}" id="gL2">${S.l2?'On: turn off':'Off: turn on'}</button>
    <label style="margin-top:1rem">Your data</label><p class="notes">Everything is stored only in this browser: course progress, your project, drafts and your library. Back it up before clearing browser data or switching devices.</p>
    <div class="row"><button class="btn small" id="gBack">Back up everything</button><button class="btn small" id="gRest">Restore a backup</button><button class="btn small ghost" id="gReset">Reset course progress</button></div>
    <h3 style="margin-top:1.2rem">How progress works</h3><p class="notes">Each unit shows your best score. 70% or more completes it. Questions you miss, or answer correctly while guessing, come back on spaced days until you know them.</p>
    <h3>How sure are you?</h3><p class="notes">Before an answer is checked you say whether you are guessing, fairly sure or certain. Confident mistakes are flagged as misconceptions worth extra attention.</p>
    <h3>Keyboard</h3><p class="notes">1–4 choose an answer, Enter checks as “Fairly sure” and continues, Space turns a flashcard.</p>
    <h3>Your own judgement comes first</h3><p class="notes">Conventions differ by field, university and journal. Your handbook, supervisor and the journal’s author guidelines always override general advice, including Citadel’s.</p></div></div>
  <h2>What each section is for</h2><div class="tablewrap panel"><table><thead><tr><th>Section</th><th>Use it to</th><th>Tip</th></tr></thead><tbody>
   <tr><td>Start here</td><td>See the research writing pathway and take the self-check</td><td>Retake the self-check every few weeks.</td></tr>
   <tr><td>Courses</td><td>Learn every building block, basic to advanced</td><td>Do the “Your turn” task before the questions.</td></tr>
   <tr><td>My research project</td><td>Draft and align your topic, questions, objectives and design</td><td>Fill the alignment matrix before you meet your supervisor.</td></tr>
   <tr><td>Writing tools</td><td>Builders and checkers for each part of a paper or thesis</td><td>Send drafts straight into your project.</td></tr>
   <tr><td>Practice</td><td>Find your starting point, review missed questions, earn a certificate</td><td>Clear due questions first.</td></tr>
   <tr><td>Paraphrase lab</td><td>Practise paraphrasing any passage, including your own readings</td><td>Hide the source and write from memory.</td></tr>
   <tr><td>Library</td><td>Store sources, annotate them, build a synthesis matrix</td><td>Import from Zotero, Mendeley or EndNote.</td></tr>
   <tr><td>Writing desk</td><td>Draft with live citations, a claim checker and an AI-use declaration</td><td>Red underlines are prompts, not verdicts.</td></tr>
   <tr><td>Style guide and Resources</td><td>Compare referencing styles; find the textbooks and free guides</td><td>Your department’s style always wins.</td></tr></tbody></table></div>
  <h2>The best of many platforms, in one free place</h2><p class="notes" style="max-width:72ch">Citadel brings together what works in textbooks, university writing centres and learning tools, built for writers who were never explicitly taught these conventions.</p>
  <div class="tablewrap panel"><table><thead><tr><th>Idea</th><th>Where it comes from</th><th>How Citadel uses it</th></tr></thead><tbody>
   <tr><td>Topic → question → significance</td><td>Booth et al., <i>The Craft of Research</i></td><td>Topic unit and narrowing worksheet</td></tr>
   <tr><td>The research onion</td><td>Saunders, Lewis and Thornhill</td><td>Philosophy and design units, and an interactive onion builder with consistency checks</td></tr>
   <tr><td>Research questions, purpose statements, hypotheses</td><td>Creswell and Creswell, <i>Research Design</i>; FINER (Hulley and colleagues)</td><td>Research question checker and the RQ unit</td></tr>
   <tr><td>Aims, objectives and alignment</td><td>University research-methods teaching; Punch on proposals</td><td>Aims builder and the alignment matrix in My research project</td></tr>
   <tr><td>Create a Research Space (CARS) and genre moves</td><td>Swales and Feak</td><td>Introduction builder; introduction and abstract units</td></tr>
   <tr><td>Science writing for non-native speakers</td><td>Glasman-Deal</td><td>IMRaD, methods, results and discussion units</td></tr>
   <tr><td>Critical reading and literature reviews</td><td>Wallace and Wray; Ridley; Hart</td><td>Annotated bibliography builder, synthesis matrix, literature review unit</td></tr>
   <tr><td>Academic phrases by function</td><td>Manchester Academic Phrasebank</td><td>Reporting verbs tool and phrase bank (original examples; links to the Phrasebank)</td></tr>
   <tr><td>Style feedback while drafting</td><td>Grammar and style checkers</td><td>Academic style checker focused on register, hedging and clarity</td></tr>
   <tr><td>Reverse outlining and revision in layers</td><td>University writing centres</td><td>Reverse outliner and the revising unit</td></tr>
   <tr><td>Point-by-point responses to reviewers</td><td>Journal guidance; Thomson and Kamler; Belcher</td><td>Response-to-reviewers table and the publishing unit</td></tr>
   <tr><td>Assignment calculators and task words</td><td>UBC Assignment Calculator; UNSW academic skills</td><td>Assignment planner and question decoder</td></tr>
   <tr><td>Reference management and synthesis matrix</td><td>Zotero, Mendeley, EndNote; library guides</td><td>Library with BibTeX/RIS, annotations and a synthesis matrix</td></tr>
   <tr><td>Short lessons, worked examples, spaced review</td><td>Khan Academy, Anki, Quizlet; research on worked examples and retrieval practice</td><td>Lesson cards, weak-versus-strong examples, question banks and missed-question review</td></tr>
   <tr><td>Certainty-based marking</td><td>Tony Gardner-Medwin, UCL</td><td>A confidence rating on every answer</td></tr>
   <tr><td>Declaring AI use</td><td>Cambridge, UCL and Monash guidance</td><td>An AI-use declaration builder in the Writing desk</td></tr></tbody></table></div>`;
  $('#gTour').onclick=()=>showTour(0);$('#gL2').onclick=()=>{S.l2=!S.l2;save();renderGuide()};
  $('#gBack').onclick=()=>saveFile('citadel-backup.json',JSON.stringify(S,null,1));
  $('#gRest').onclick=()=>{const d=$('#dlg');d.innerHTML=`<h3>Restore a backup</h3><p class="notes">This replaces everything currently saved in this browser.</p><input type="file" id="rf" accept=".json,.txt"><label for="rt">Or paste the backup text</label><textarea id="rt"></textarea><div class="row" style="justify-content:flex-end;margin-top:.8rem"><button class="btn ghost" id="rc">Cancel</button><button class="btn primary" id="rg">Restore</button></div>`;d.showModal();
    $('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rt').value=r.result};r.readAsText(f)};$('#rc').onclick=()=>d.close();
    $('#rg').onclick=()=>{try{const o=JSON.parse($('#rt').value);if(typeof o!=='object'||!('levels' in o))throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();d.close();renderHeader();toast('Backup restored');go('path')}catch(e){toast('That is not a Citadel backup.')}}};
  $('#gReset').onclick=()=>askConfirm('Reset course progress?','Your unit scores, missed-question review and certificate attempts will be cleared. Your project, library and drafts are kept.','Reset',()=>{Object.assign(S,{xp:0,levels:{},solved:{},badges:[],mistakes:{},placedIds:[],calib:{n:0,cert:0,certRight:0},streak:{count:0,last:null},daily:{date:'',xp:0},sprintBest:0,reviewed:0,paraDone:{},diag:{}});save();renderHeader();toast('Progress reset')})}

/* ============ boot ============ */
renderHeader();{const h=(location.hash||'').slice(1);go(TABS.some(t=>t[0]===h)?h:'path')}if(!S.seenTour)setTimeout(()=>showTour(0),400);

</script>
