e largely passive.\n• Reflective writing: 'I' is required.\n\nThe passive voice ('The samples were filtered') is not wrong. It is useful when the action matters more than who did it, as in many methods sections. It becomes a problem when it hides responsibility or makes sentences long and vague: 'It was decided that the data would be excluded' (by whom? why?).\n\nUse the active voice when the actor is important or when the passive makes the sentence awkward. Use 'I' or 'we' for your own decisions, arguments and contributions, if your field allows it. Avoid 'you' and 'one' in formal writing.\n\nWhen unsure, check your module handbook, your supervisor's preferences and recent articles in your target journal."}, {"t": "Removing informal and spoken features", "b": "Spoken English and academic English follow different rules. Features that are natural in conversation weaken academic writing.\n\nCommon informal features and formal alternatives:\n• Contractions: don't, it's, can't (do not, it is, cannot)\n• Phrasal verbs where a single verb exists: look into (investigate), find out (determine), go up (increase), cut down on (reduce). Some phrasal verbs, such as 'carry out', are acceptable.\n• Direct address: 'As you can see' (As Table 2 shows)\n• Rhetorical questions in place of claims: 'So why does this matter?' (This matters because...)\n• Vague endings: 'and so on', 'etc.', 'and many more'\n• Intensifiers and emotion: really, totally, amazing, terrible, sadly\n• Idioms and clichés: 'at the end of the day', 'a double-edged sword', 'in a nutshell'\n• Starting sentences with 'And' or 'But' (use 'In addition' or 'However', though some fields now accept 'But')\n\nAlso watch for formal-sounding phrases from office letters or exam training that sound odd in research writing: 'the said policy', 'herein', 'in this contemporary era', 'kindly note', 'as earlier stated'. They are not wrong everywhere, but they are not standard in international academic prose.\n\nA quick test: if a sentence sounds like something you would say aloud in a meeting or a sermon, rewrite it."}, {"t": "Tense choices in academic writing", "b": "English tense choices in research writing follow fairly stable patterns. They are not just about time; they signal how you position information.\n\n• Present simple: established facts and general truths ('Nitrogen fixation increases soil fertility'); what your paper does ('This chapter examines...'); what tables show ('Figure 3 shows...'); and reporting a source's ongoing argument ('Okafor (2021) argues that...').\n• Past simple: what you did and found in your study ('We interviewed 24 teachers'; 'Yields fell by 18%'); and a specific past study's actions ('Mensah et al. (2019) surveyed 400 households').\n• Present perfect: research activity up to now, often in literature reviews ('Several studies have examined...'; 'Little attention has been paid to...').\n• Future or present: in proposals for planned work ('This study will use...').\n\nTypical pattern by section: introduction mostly present and present perfect; methods and results mostly past; discussion moves between past (your findings) and present (what they mean).\n\nCiting practices differ: some fields prefer present tense for all reporting verbs; others use past for a specific finding. Pick one pattern per context and keep it consistent within a paragraph.\n\nThe most common error is switching tense mid-paragraph without a reason. Check each paragraph in your final edit."}, {"t": "Practical tips for multilingual writers", "b": "Writing in an additional language is a strength, not a deficit; you can see English structures that monolingual writers miss. These habits help most.\n\n• Learn the uncountable nouns: research, evidence, equipment, information, knowledge, feedback, advice. Write 'studies' or 'pieces of evidence', never 'researches' or 'evidences'.\n• Check articles (a, an, the). Use 'the' when the reader knows which one you mean; use no article for general plural or uncountable ideas ('Water quality affects health').\n• Build your own phrase bank. When a sentence in a published paper does a job well (introducing a gap, comparing results), copy the pattern, not the content, into a notebook with blanks: 'Although X has been widely studied, little is known about Y in Z.'\n• Avoid translating word by word from your first language. Write the idea simply in English first, then refine it.\n• Use useful reporting verbs precisely: argue, claim, report, find, propose, demonstrate, question, acknowledge. They are not interchangeable.\n• Read your draft aloud slowly. Missing words and run-on sentences become audible.\n• Use grammar and AI tools as a checker, not an author. Check your university's policy, keep your own voice, and never accept a change you do not understand.\n\nAsk your writing centre whether it offers one-to-one sessions for multilingual writers; most do."}], "examples": [{"label": "From spoken to academic register", "weak": "Nowadays a lot of people in Lagos are going for solar panels because NEPA light is really bad, and this has a big impact on businesses and so on.", "strong": "Since 2015, small businesses in Lagos have increasingly installed rooftop solar systems in response to frequent grid outages (Adeyemi, 2022). These outages raise operating costs, particularly for firms that rely on refrigeration.", "why": "Vague time words, informal phrases, local slang and 'and so on' are replaced with a specific period, a defined group, a cited claim and a stated mechanism. The second sentence says exactly how businesses are affected. (The citation is invented for illustration.)"}, {"label": "Untangling stacked nominalisations", "weak": "The conduct of an assessment of the effectiveness of the training programme was carried out through the utilisation of a questionnaire for the collection of data from participants.", "strong": "We assessed how effective the training programme was by asking participants to complete a questionnaire.", "why": "Six abstract nouns ('conduct', 'assessment', 'effectiveness', 'utilisation', 'collection') hid the actors and actions. Turning them back into verbs and naming who acted cuts the sentence by half and makes it easier to read."}, {"label": "Calibrating a claim to the evidence", "weak": "This study proves that school feeding programmes improve exam performance in Kenya.", "strong": "In the 30 schools studied, pupils in schools with feeding programmes scored higher on national exams on average, which suggests that school meals may contribute to better performance.", "why": "A single observational study cannot 'prove' a causal effect for a whole country. The revision limits the claim to the sample, reports what was observed and uses 'suggests' and 'may' to signal interpretation."}], "checks": [{"q": "Which sentence is written in the most appropriate academic register?", "o": ["Basically, the results were pretty disappointing for the team.", "The results did not support the second hypothesis.", "You can see that the results weren't what we hoped for.", "So, were the results good? Not really."], "a": 1, "why": "It is formal, specific and neutral. The others use informal intensifiers, contractions, direct address or rhetorical questions."}, {"q": "Which revision of 'Due to the fact that funding was limited, the study was carried out in only a small number of districts' is most concise without losing meaning?", "o": ["Due to limited funding issues, the study was only carried out in a small number of districts.", "It should be noted that funding was limited, so the study was conducted in few districts.", "Because funding was limited, the study covered only three districts.", "Funding was limited."], "a": 2, "why": "It replaces 'due to the fact that' with 'because' and gives a precise number. Option D is shorter but loses the key information about the study."}, {"q": "A student writes 'Mobile phones have a big effect on farmers.' What is the main weakness?", "o": ["It uses the present tense", "It is too short", "It does not use the passive voice", "It is imprecise about which farmers, what effect and how big"], "a": 3, "why": "Precision is the issue: 'big effect' and 'farmers' are vague. Tense and sentence length are acceptable here, and passive voice would not fix vagueness."}, {"q": "Your regression shows a moderate correlation between hours of tutoring and test scores in one school. Which sentence is best calibrated?", "o": ["Tutoring hours were positively associated with test scores in this school.", "Tutoring clearly causes higher test scores.", "This proves the value of tutoring for all learners.", "It might perhaps be possible that tutoring could possibly matter."], "a": 0, "why": "It reports the relationship without claiming causation and limits it to the sample. Option D is over-hedged and says almost nothing."}, {"q": "When is the passive voice usually the best choice?", "o": ["Whenever you want to sound more formal", "When the action matters more than who performed it, as in many methods descriptions", "When you want to avoid saying who made a decision you are unsure about", "Never; it is always considered poor style"], "a": 1, "why": "The passive suits sentences where the actor is obvious or unimportant ('Samples were stored at 4 °C'). Using it to hide responsibility is a misuse, and it is not banned."}, {"q": "Which sentence uses nominalisation in a helpful way?", "o": ["An examination of the implementation of the policy was undertaken.", "The making of a decision was done by the committee.", "Fertiliser prices doubled in 2022. This increase reduced planting on marginal land.", "The utilisation of the equipment was achieved by the technicians."], "a": 2, "why": "'This increase' packages the previous sentence into a noun that becomes the subject of a new claim, which improves flow. The other options bury the action in abstract nouns."}, {"q": "You are writing your methods section. Which tense is normally used to describe what you did?", "o": ["Present perfect: 'We have collected samples...'", "Future: 'We will collect samples...'", "Present continuous: 'We are collecting samples...'", "Past simple: 'We collected samples...'"], "a": 3, "why": "Completed procedures in a finished study are reported in the past simple. The future is used in a proposal for work not yet done."}, {"q": "Which is correct in standard academic English?", "o": ["Many researches have shown that...", "Several studies have shown that...", "There are many evidences that...", "The equipments were calibrated..."], "a": 1, "why": "'Research', 'evidence' and 'equipment' are uncountable and do not take a plural -s. Use 'studies', 'pieces of evidence' or 'items of equipment'."}, {"q": "A literature review sentence reads: 'Few studies examined this problem in East Africa.' Which tense change would best signal that the gap still exists today?", "o": ["Few studies have examined this problem in East Africa.", "Few studies will examine this problem in East Africa.", "Few studies had examined this problem in East Africa.", "Few studies are examining this problem in East Africa."], "a": 0, "why": "The present perfect connects past research to the present, which is exactly what a gap statement needs to say."}, {"q": "Your supervisor in sociology says your thesis may use 'I'. Which use is most appropriate?", "o": ["I think maybe the data shows something interesting.", "I feel that poverty is very sad.", "In this chapter I argue that informal savings groups function as social insurance.", "As you can see, I am right."], "a": 2, "why": "'I argue' states the writer's position clearly and formally. The others use 'I' with vague, emotional or informal language."}, {"q": "Which phrase is most likely to sound out of place in an international academic article?", "o": ["As Table 4 shows,", "In contrast,", "These findings suggest that", "In this contemporary era, the said policy"], "a": 3, "why": "'In this contemporary era' is redundant and 'the said policy' belongs to legal or administrative letters. The other three are standard academic phrases."}, {"q": "In a thesis, you define 'food insecurity' using a specific scale. Later you want variety. What should you do?", "o": ["Alternate between 'hunger', 'poverty' and 'food insecurity'", "Keep using 'food insecurity' consistently", "Use a different synonym in each chapter", "Avoid the term after the introduction"], "a": 1, "why": "In academic writing, changing the term signals a different concept. Consistent terminology is a feature of precision, not repetition to be avoided."}], "checklist": ["Search your draft for contractions, 'you', 'etc.', 'a lot', 'things' and 'nowadays' and replace each one", "Highlight every 'it is important to note', 'due to the fact that' and 'in order to' and cut or shorten them", "Find sentences with 'carry out', 'make' or 'undertake' plus an '-tion' noun and try turning the noun into the verb", "Read your discussion and mark each claim as fact, finding or interpretation; check that hedges match", "Check three recent articles in your target journal to see how they use 'I', 'we' and the passive", "Check the tense in each paragraph of your methods and results for consistency", "Start a personal phrase bank of ten useful sentence patterns from papers in your field"], "practice": "Take one paragraph of 150 to 200 words from your current draft. Rewrite it to remove informal features, cut at least 15% of the words, and adjust every claim so that its confidence matches your evidence. Compare the two versions and note which change helped most.", "reading": [{"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "The opening unit on an approach to academic writing covers audience, style, vocabulary shifts and positioning, with tasks designed for graduate students who use English as an additional language."}, {"book": "Sword, H. (2012) Stylish Academic Writing. Harvard University Press.", "why": "A readable, evidence-based argument for clear academic prose; the discussion of abstract nouns and active verbs is especially useful when you over-nominalise."}, {"book": "Bailey, S. (2025) Academic Writing: A Handbook for International Students. 6th edn. Routledge.", "why": "Short, practical sections on academic style, hedging, formality and common grammar problems, written specifically for international students."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "For science and engineering writers: shows the tense, verb and hedging patterns used in each section of a research article, with vocabulary lists you can reuse."}], "links": [{"t": "Academic Phrasebank: Being cautious (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/using-cautious-language/"}, {"t": "Writing Concisely (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/conciseness-handout/"}, {"t": "Passive Voice (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/passive-voice/"}, {"t": "Should I Use 'I'? (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/should-i-use-i/"}]}, {"id": "thesis", "title": "Planning and writing a dissertation or thesis", "sub": "From chapter plan to defence", "goals": ["Distinguish what examiners expect from a master's dissertation and from a PhD thesis", "Build a chapter plan with word budgets and a realistic timeline of milestones", "Set up a sustainable writing routine, a version system and a reference library from the start", "Use supervisor feedback on chapters effectively and prepare confidently for the viva or defence"], "lessons": [{"t": "Dissertation or thesis: what is the difference?", "b": "The words are used differently by country. In the UK, a master's project is usually a 'dissertation' and a doctoral project a 'thesis'. In the USA and Canada it is often the reverse: a master's 'thesis' and a doctoral 'dissertation'. Check what your university calls it and use that word.\n\nWhat matters more is the level expected.\n\n• A taught master's dissertation (often 10,000 to 20,000 words, done in a few months) must show you can plan and carry out a focused piece of research, use the literature critically and apply suitable methods. It does not need to change the field.\n• A research master's thesis (often 25,000 to 50,000 words) is longer and expects a more original contribution.\n• A PhD thesis (commonly 70,000 to 100,000 words in the UK and many Commonwealth systems, though limits vary widely) must make an original contribution to knowledge, show mastery of the field and be, in principle, publishable in part.\n\nSome universities allow a 'thesis by publication', where chapters are papers linked by an introduction and a discussion. Read your own regulations early: word limit, what counts in it, format, and submission rules."}, {"t": "The chapter plan and word budgets", "b": "A chapter plan is a one-page map of the whole thesis. Make it in your first months and update it often.\n\nThe classic structure for empirical work is: Introduction, Literature review, Methodology, Results (or Findings), Discussion, Conclusion. Many theses use variations: several results chapters, a theory chapter, or combined results and discussion. Look at five recent theses from your department in the library repository to see what is normal.\n\nGive each chapter a word budget. A sample budget for an 80,000-word PhD:\n\n• Introduction: 6,000\n• Literature review: 15,000\n• Methodology: 10,000\n• Three results chapters: 12,000 each, 36,000 total\n• Discussion: 9,000\n• Conclusion: 4,000\n\nFor a 15,000-word master's dissertation, the same proportions shrink: around 1,500 for introduction, 4,000 for literature, 2,500 for method, 3,500 for findings, 2,500 for discussion and 1,000 for conclusion.\n\nBudgets stop one chapter from swallowing the thesis. A literature review that grows to half the word count is a common problem. For each chapter, also write one sentence saying what job it does in the whole argument."}, {"t": "Write from day one", "b": "Many students think writing comes after research. In practice, writing is how you do research: it shows you what you understand and what you do not. Dunleavy and Murray both argue for writing early and often.\n\nThings you can write from the first month:\n\n• A two-page summary of your research problem, aim and questions.\n• Notes on each key source in full sentences, not just highlights.\n• A methods log: what you did, when, and why you made each decision. This becomes your methodology chapter.\n• Short 'memos' after supervision meetings or fieldwork days.\n\nThese are not wasted words even if they never appear in the final thesis. They save you from trying to remember decisions months later.\n\nA useful rule: aim to have a rough draft of something every month. Rough is fine. A 'zero draft' is a first attempt you write fast without stopping to polish. You will revise it later.\n\nIf English is your additional language, early writing matters even more. It gives you time to build fluency and to get feedback on language before the stakes are high."}, {"t": "Timelines and milestones", "b": "Work backwards from your submission date. Mark the fixed points first: progress reviews, ethics approval, fieldwork seasons, funding end dates, conference deadlines.\n\nA sample plan for a 12-month taught master's dissertation phase (about 4 months):\n\n• Weeks 1 to 2: confirm question, chapter plan and ethics.\n• Weeks 3 to 6: literature review draft and method set-up.\n• Weeks 7 to 10: data collection and analysis; write method chapter as you go.\n• Weeks 11 to 13: findings and discussion drafts.\n• Weeks 14 to 15: introduction, conclusion, abstract, full revision.\n• Week 16: proofreading, formatting, submission.\n\nFor a three- to four-year PhD, think in phases: year 1 proposal, literature and pilot; year 2 main data collection and first results chapters; year 3 remaining chapters, discussion and full draft; final months revision and submission. Many students also submit papers during these years.\n\nTips:\n• Build in buffer time of at least 10 to 20 per cent. Data, equipment and approvals are often late.\n• Use a simple Gantt chart (a bar chart of tasks against time) or a spreadsheet.\n• Share the plan with your supervisor and agree deadlines for chapter drafts."}, {"t": "Writing routines that work", "b": "A thesis is written in many small sessions, not in a few heroic weekends. Research by writing scholars such as Murray suggests regular, short writing beats waiting for long free days.\n\nRoutines to try:\n\n• Short daily writing: 30 to 60 minutes at the same time each day, before email. Even 300 words a day adds up to a draft chapter in a month or two.\n• Pomodoro technique: work for 25 minutes with full focus, then take a 5-minute break. After four rounds, take a longer break. A timer keeps you honest.\n• Writing goals by task, not hours: 'draft the section on sampling' is better than 'work on thesis'.\n• Writing retreats or 'shut up and write' groups: people meet, in person or online, and write quietly together. Many universities run them.\n• Separate writing from editing: draft first, fix later. Editing while drafting slows you down.\n\nKeep a simple log of words written or tasks finished each day. It shows progress on days that feel unproductive.\n\nLook after your health. Sleep, food and movement affect writing. If you are struggling, talk to your supervisor or student support services early."}, {"t": "Drafts, versions and files", "b": "Losing a chapter to a broken laptop is a real and common disaster. Protect your work from the first day.\n\nBackups:\n• Keep at least three copies in two different places, for example laptop, university cloud storage (OneDrive, Google Drive or similar) and an external drive.\n• Use storage that syncs automatically so you do not have to remember.\n\nVersions:\n• Save a new version for each major revision and name files clearly with dates: 'Ch3_Methods_v04_2026-03-12.docx'. Avoid names like 'final_final2.docx'.\n• Keep one master file per chapter. Merge chapters into a single file only near the end, or use your software's master-document or LaTeX include features.\n\nOrganisation:\n• Use one folder structure: 01_Admin, 02_Literature, 03_Data, 04_Analysis, 05_Chapters, 06_Figures.\n• Keep raw data untouched in a separate folder. Work on copies.\n• Record where each figure came from (script or file) so you can redraw it.\n\nReferences:\n• Use a reference manager such as Zotero (free), Mendeley or EndNote from the first source you read. Insert citations with its word-processor plugin, never by hand. Changing style later then takes seconds."}, {"t": "Working with supervisor feedback on chapters", "b": "Your supervisor's comments are the most valuable resource you have. Use them well.\n\nBefore sending a draft:\n• Say what stage it is (rough draft or near final) and what kind of feedback you want: 'Please focus on whether the argument in section 2 holds together.'\n• Send a chapter, not the whole thesis at once, unless it is the final read.\n• Agree how long they need. Two to four weeks is common for a chapter.\n\nWhen comments come back:\n• Read them all once, then wait a day before reacting.\n• Sort them into big (argument, structure, missing analysis) and small (wording, references). Fix big ones first.\n• Keep a feedback log: comment, your action, and where you changed the text.\n• If a comment is unclear, ask. 'When you wrote ‘needs more depth’ on page 12, do you mean more sources or more analysis of the ones I have?'\n• If you disagree, explain your reasoning politely with evidence. Supervisors expect independent thinking, especially at PhD level.\n\nCultural note: in many systems, students are taught not to question teachers. In UK, North American and Australian universities, respectful discussion with your supervisor is expected and welcomed."}, {"t": "The examination, viva or defence", "b": "How theses are examined differs by country.\n\n• UK and many Commonwealth systems: a 'viva voce' (oral examination), usually closed, with an internal and an external examiner. It often lasts one to three hours.\n• USA and Canada: a 'defence' before a committee, sometimes with a public presentation first.\n• Australia: often examined in writing by external examiners, with no oral exam.\n• Some European systems: a public defence after the thesis has already been approved.\n• Master's dissertations are usually marked in writing, sometimes with a short presentation.\n\nCommon outcomes include pass, pass with minor corrections, major corrections, resubmission, or (rarely) fail. Minor corrections are the most common result in many UK systems.\n\nExaminers usually look for: a clear contribution, awareness of limitations, understanding of how your work relates to the literature, and the ability to justify your methods."}, {"t": "Preparing for the viva or defence", "b": "Preparation turns a frightening event into a professional conversation about your work.\n\nIn the weeks before:\n• Re-read the whole thesis slowly. Note typos in a list for corrections, but do not panic about them.\n• Write a one-page summary: your question, contribution, key findings and main limitations.\n• Prepare answers to common questions: 'Summarise your thesis in five minutes.' 'What is your original contribution?' 'Why did you choose this method over others?' 'What would you do differently?' 'What are the limitations?' 'What next?'\n• Read recent papers by your examiners and any new papers in your area.\n• Arrange a mock viva with your supervisor or colleagues.\n\nOn the day:\n• Bring a clean copy of your thesis with the same page numbers as the submitted version, with tabs on key sections.\n• Take time to think before answering. It is fine to say 'That is a good question; let me think.'\n• Answer the question asked. If you do not understand, ask for clarification.\n• Admit genuine weaknesses calmly, then explain how you dealt with them or how future work could.\n\nUseful sentence: 'That is a fair point. In this study I chose X because..., but I agree that Y would strengthen future work.'"}], "examples": [{"label": "A chapter plan without and with purpose and budgets", "weak": "Chapter 1 Introduction. Chapter 2 Literature Review. Chapter 3 Methodology. Chapter 4 Results. Chapter 5 Discussion. Chapter 6 Conclusion.", "strong": "Ch1 Introduction (1,500 words): why rural electrification projects in Kenya stall and the aim of the study. Ch2 Literature (4,000): what is known about community ownership of mini-grids and the gap on maintenance funding. Ch3 Method (2,500): case study of three mini-grids, 24 interviews, thematic analysis. Ch4 Findings (3,500): three themes on tariffs, trust and technical skills. Ch5 Discussion (2,500): how findings extend ownership models. Ch6 Conclusion (1,000): contribution, limits, policy actions. Total 15,000.", "why": "The strong plan gives each chapter a job in the argument and a word budget. It acts as a contract with yourself and your supervisor, and makes it easy to see if a chapter is growing too large."}, {"label": "Asking a supervisor for feedback", "weak": "Dear Prof, please find attached my chapter. Kindly check it. Thanks.", "strong": "Dear Dr Okafor, attached is a full first draft of Chapter 3 (Methodology, 9,800 words). I would value your view mainly on two things: whether section 3.4 justifies the sample size convincingly, and whether the ethics section is detailed enough for the committee. Language is still rough in places, so please do not spend time on wording. Would feedback by 20 March be possible? I plan to revise it before starting Chapter 4.", "why": "The strong message states the stage, length and specific questions, and proposes a date. The supervisor can focus their time, and the student gets the feedback they actually need."}, {"label": "Answering a difficult viva question", "weak": "Examiner: Why only two hospitals? Student: Because that was what I could manage. It is fine.", "strong": "Examiner: Why only two hospitals? Student: I chose depth over breadth. My question was about how nurses make triage decisions, so I needed long observation in each site. Two hospitals, one urban and one rural, let me compare contexts while observing 140 hours in total. I acknowledge this limits generalisation, and in Chapter 7 I suggest a multi-site survey to test the patterns more widely.", "why": "The strong answer links the choice to the research question, gives concrete detail, admits the limitation calmly and points to future work. This is exactly what examiners want to see."}], "checks": [{"q": "Which statement best describes the main extra expectation of a PhD thesis compared with a taught master's dissertation?", "o": ["It must make an original contribution to knowledge in the field", "It must use more references in the bibliography", "It must always use quantitative methods", "It must be written in the passive voice"], "a": 0, "why": "The defining feature of a PhD is an original contribution. A master's dissertation shows competence in research; the number of references or the choice of methods is not the key difference."}, {"q": "Your 80,000-word thesis plan has a 38,000-word literature review. What is the most likely problem?", "o": ["Nothing; a long review shows you have read widely", "The literature review should be removed completely", "The review is taking space that your own data, analysis and discussion need", "You should move half of it into the abstract"], "a": 2, "why": "Almost half the thesis on other people's work leaves too little room for your contribution. Word budgets help catch this early; a focused, critical review is better than a long one."}, {"q": "Which writing habit is most likely to produce steady progress on a thesis?", "o": ["Waiting until all data are collected and then writing everything in one month", "Writing only when you feel inspired", "Editing each sentence to perfection before moving to the next", "Writing for a short, fixed period most days, with a specific task for each session"], "a": 3, "why": "Short, regular sessions with clear tasks build drafts steadily and keep ideas fresh. Waiting for inspiration or perfecting each sentence while drafting slows most writers down."}, {"q": "In the Pomodoro technique, what do you typically do?", "o": ["Write for three hours without a break", "Work in focused blocks of about 25 minutes separated by short breaks", "Only write after midnight", "Alternate writing with checking email every five minutes"], "a": 1, "why": "Pomodoro uses short timed blocks of full focus with brief breaks, and a longer break after several rounds. Constant email checking is the opposite of what it aims for."}, {"q": "Which file name is the best practice for version control?", "o": ["thesis_final_FINAL_new.docx", "chapter.docx", "Ch4_Results_v06_2026-05-18.docx", "mywork(2).docx"], "a": 2, "why": "Option C shows chapter, content, version and date, so you can always find the latest file and go back to an earlier one. The others become confusing very quickly."}, {"q": "You receive 60 comments from your supervisor on a chapter. What should you do first?", "o": ["Sort them into major issues (argument, structure, analysis) and minor ones, and deal with the major ones first", "Fix all the typos first because they are quick", "Reply explaining why each comment is wrong", "Ignore comments you do not understand"], "a": 0, "why": "Big changes may rewrite whole sections, so fixing typos first can waste effort. Unclear comments should be clarified, not ignored, and disagreement should be reasoned, not automatic."}, {"q": "A supervisor writes 'too descriptive' beside your literature review. What is the best response?", "o": ["Add more summaries of more papers", "Delete the section", "Change all verbs to the passive voice", "Revise to compare, evaluate and connect sources to your own research question, and ask for clarification if unsure"], "a": 3, "why": "'Too descriptive' usually means summarising without analysis. The fix is to evaluate and synthesise. Adding more summaries makes the problem worse."}, {"q": "Why should you use a reference manager such as Zotero from the start?", "o": ["It writes the literature review for you", "It stores your sources and formats citations automatically, so changing style or adding sources later is quick and accurate", "Universities require Zotero specifically", "It checks your thesis for plagiarism"], "a": 1, "why": "A reference manager saves hours and prevents mismatched citations and reference lists. It does not write or check your thesis, and universities rarely require one particular tool."}, {"q": "In a viva, the examiner points out a real limitation in your sampling. What is the best approach?", "o": ["Deny there is any limitation", "Blame your supervisor for the design", "Acknowledge it, explain why you made the choice, and say how it affects the conclusions or could be addressed in future work", "Change the subject to your strongest results"], "a": 2, "why": "Examiners expect you to know your limitations and discuss them maturely. Denying, blaming or avoiding the issue looks less competent than honest discussion."}, {"q": "In which country is a PhD most often examined only in writing by external examiners, with no oral exam?", "o": ["United Kingdom", "United States", "Canada", "Australia"], "a": 3, "why": "Australian PhDs are commonly examined through written reports by external examiners. The UK uses a viva, and the USA and Canada use a defence before a committee. Always check your own university's rules."}, {"q": "Which plan for a four-month master's dissertation is most realistic?", "o": ["Collect data in month 4 and write everything in the last week", "Agree question and ethics early, write the literature and method chapters while setting up data collection, analyse in month 3, and leave the last weeks for revision and proofreading", "Spend three months on the literature review and one week on everything else", "Start writing only after receiving the final mark for coursework"], "a": 1, "why": "Option B overlaps writing with research and keeps time for revision. The others leave no buffer, which is risky when data or approvals arrive late."}, {"q": "What is the best preparation for the question 'What is your original contribution?'", "o": ["Prepare a clear two- or three-sentence answer that names what is new and how it adds to existing work", "Plan to read the abstract aloud", "Say that all research is original", "Explain the background of the topic in detail"], "a": 0, "why": "This question comes up in almost every viva. A short, prepared, specific answer shows you understand your own work and the field."}], "checklist": ["Download your university's thesis or dissertation regulations and note the word limit, what counts towards it, formatting rules and submission steps.", "Look at three to five recent theses from your department to see typical chapter structures and lengths.", "Write a one-page chapter plan with a one-sentence purpose and a word budget for each chapter.", "Create a timeline that works backwards from submission, with chapter deadlines and at least 10 per cent buffer, and share it with your supervisor.", "Set a daily writing slot of 30 to 60 minutes and keep a simple log of what you wrote.", "Set up automatic backups in two places, a clear folder structure and a reference manager this week.", "Start a feedback log for supervisor comments and a list of likely viva questions that you update as you write."], "practice": "Draft a one-page chapter plan for your dissertation or thesis. For each chapter write its title, a one-sentence statement of what it contributes to your overall argument, and a word budget that adds up to your university's limit.", "reading": [{"book": "Dunleavy, P. (2003) Authoring a PhD: How to Plan, Draft, Write and Finish a Doctoral Thesis or Dissertation. Palgrave Macmillan.", "why": "Read the early chapters on envisioning the whole thesis and planning its structure, and the later ones on drafting and finishing. Strong on seeing the thesis as one argument and on getting chapters written."}, {"book": "Murray, R. (2025) How to Write a Thesis. 5th edn. Open University Press / McGraw Hill.", "why": "Practical advice on writing habits, short regular writing, generating text early, working with supervisors and preparing the final draft. Useful at both master's and doctoral level."}, {"book": "Phillips, E. M. and Johnson, C. (2022) How to Get a PhD: A Handbook for Students and Their Supervisors. 7th edn. Open University Press / McGraw Hill.", "why": "Read the parts on managing your supervisor, the form of a PhD thesis and the examination process. Helpful for understanding what UK-style examiners expect."}], "links": [{"t": "UNSW Academic Skills: How to write an honours thesis", "u": "https://www.unsw.edu.au/student/managing-your-studies/academic-skills-support/toolkit/honours-postgraduate"}, {"t": "UCL Doctoral School: Viva examinations guidance", "u": "https://www.ucl.ac.uk/study/doctoral-school/regulations/essential-procedures-and-policies/viva-examinations-guidance"}, {"t": "Zotero: free reference manager", "u": "https://www.zotero.org/"}]}, {"id": "topic", "title": "Developing a research topic", "sub": "From interest to researchable problem", "goals": ["Move an interest step by step into a topic, a question and a research problem", "Find topic ideas in literature gaps, practice problems, supervisors' projects and calls", "Narrow or broaden a topic and test its feasibility against time, data, skills, access and ethics", "Check a topic's novelty in the literature and write a clear one-paragraph topic statement"], "lessons": [{"t": "The ladder: interest, topic, question, problem", "b": "Most students begin with an interest, not a research project. 'I care about water' is an interest. It is a good start, but you cannot research it yet.\n\nBooth and colleagues in The Craft of Research describe a path with clear steps:\n• Interest: a broad area you care about (water supply).\n• Topic: a specific part of that area, limited in place, time or group (household water storage in peri-urban Kano).\n• Question: what you do not know about that topic (How do storage practices affect bacterial contamination between collection and use?).\n• Problem: why the answer matters to a reader (Without this, water projects that treat water at the source may not protect children at home).\n\nEach step narrows and sharpens. A topic tells readers what you are looking at. A question tells them what you want to find out. A problem tells them why they should care.\n\nMany weak proposals stop at the topic. They describe an area in detail but never ask a question that needs an answer. Supervisors and examiners will keep asking 'So what?' until you reach the problem level. Climb the ladder deliberately, and write each step down in one sentence."}, {"t": "Where good topics come from", "b": "Good topics rarely appear from nowhere. They usually come from one of these sources:\n\n• Gaps in the literature. Read recent review articles and the 'limitations' and 'future research' sections of papers. Authors often say exactly what is still unknown.\n• Problems in practice. Your work as an engineer, teacher, nurse, farmer adviser or manager may have shown you something that does not work. A recurring failure is a strong starting point.\n• Your supervisor's projects. Many PhD and some master's students join a funded project. The broad topic is set; your job is to carve out a distinct piece you can own. This is normal, especially in science and engineering.\n• Calls. Funders, journals (special issues) and governments publish calls that name priority problems. Reading them shows what others think matters now.\n• Data and access you already have. A dataset, a field site or a professional network can make a topic possible.\n\nDo not choose only by passion or only by convenience. The best topics sit where your interest, a real need and your practical access overlap. Talk to your supervisor early. Bring two or three options, not one fixed idea."}, {"t": "Turning a topic into questions", "b": "A topic is a noun phrase: 'solar mini-grids in rural Kenya'. To make progress, turn it into questions. Ask many before choosing one.\n\nTry these prompts:\n• Who is involved, affected or excluded?\n• What happens, and what are its parts or types?\n• When and where does it change?\n• How does it work, or how is it done?\n• Why does it happen, or why does it differ between places?\n• What if a factor changed?\n\nFor mini-grids you might write: Why do some community mini-grids keep running after donor funding ends while others fail? How do tariff structures affect household connection rates? What do women entrepreneurs use mini-grid power for?\n\nWrite at least ten questions in fifteen minutes. Do not judge them yet. Then mark the ones that make you curious, that need evidence (not opinion) to answer, and that you cannot answer with a quick search.\n\nHow and why questions usually lead to deeper research than what or whether questions. You will refine the final wording later, in the research questions unit."}, {"t": "From question to problem: the 'so what' test", "b": "Booth and colleagues suggest a three-part sentence to test whether your question has become a problem. In your own words, it runs like this:\n\n'I am studying [topic], because I want to find out [question], so that I can help readers understand [why it matters].'\n\nExample: I am studying how secondary schools in Lahore use teaching assistants, because I want to find out which tasks assistants actually perform in class, so that I can help policymakers judge whether the new assistant programme supports learning or only reduces teacher workload.\n\nThe third part is the hardest, and the most important. It turns private curiosity into a research problem that others share.\n\nBooth's team also separate two kinds of problem:\n• A practical problem is a situation in the world that causes harm or cost (crops fail, patients wait too long). Solving it needs action.\n• A conceptual (research) problem is a gap in understanding. Solving it needs knowledge.\n\nMost academic research addresses a conceptual problem whose answer may later help with a practical one. Be clear about which you are claiming to solve."}, {"t": "Narrowing a topic that is too broad", "b": "A topic is too broad when the literature seems endless, every source looks relevant, and you cannot imagine finishing in the time you have. 'Climate change and agriculture in Africa' is a field, not a thesis.\n\nNarrow along one or more of these dimensions:\n• Place: one country, region, city or site.\n• Time: one period, season or policy era.\n• Population: one group (smallholder maize farmers, first-year nursing students).\n• Variable or aspect: one outcome or factor (yield variability, adoption of drought-tolerant seed).\n• Method or data: one dataset, one experiment type.\n• Theory or lens: one framework you will apply.\n\nExample of step-by-step narrowing:\nClimate change and agriculture in Africa\n→ drought adaptation by smallholders in Ghana\n→ adoption of drought-tolerant maize in the Upper East Region\n→ how access to extension services affects adoption among women farmers, 2018 to 2024.\n\nNarrow until you could explain the study, its data and its likely chapters in two minutes. Narrowing is not making the work smaller in value. A focused study answers its question properly; a broad one usually answers nothing well."}, {"t": "Broadening a topic that is too narrow", "b": "Sometimes the opposite happens. You search and find almost nothing. This can mean you have found a true gap. More often it means the topic is too narrow, too new or described with the wrong words.\n\nSigns your topic may be too narrow:\n• It concerns one very small case with no link to wider debates.\n• The answer would be one fact or number.\n• Nobody beyond a tiny group would read the result.\n\nWays to broaden:\n• Search with synonyms and related terms (for example 'informal settlements', 'slums' and 'unplanned housing').\n• Look at the same issue in comparable settings or countries.\n• Move up one level of abstraction (from one brand of solar lamp to off-grid lighting adoption).\n• Extend the time period or population.\n• Connect your case to a theory, so it speaks to a bigger question.\n\nA narrow case study can still be excellent research if you clearly show what it is a case of. A study of one brewery's wastewater, for example, can address a wider question about industrial effluents of that type. Always ask: what larger conversation does my small case contribute to?"}, {"t": "Feasibility: can you actually do it?", "b": "An interesting topic is useless if you cannot complete it. Before you commit, test it against five questions:\n\n• Time. How many months do you have for data collection and analysis? A one-year master's leaves perhaps three months for fieldwork. Longitudinal designs rarely fit.\n• Data. Does the data exist, and can you get it? Is it of usable quality? Government statistics may be incomplete or delayed.\n• Skills. Do you have, or can you learn in time, the methods needed (statistics, interviewing, laboratory techniques, modelling)?\n• Access. Will organisations, communities, labs or archives let you in? Do you need permits, a gatekeeper or travel funds? If you have moved abroad to study, can you reach your home-country site?\n• Ethics. Does the work involve people, vulnerable groups, animals, sensitive data or risk? Ethics approval takes time and may limit what you can do.\n\nAlso think about money and equipment.\n\nWrite a short risk list: what could go wrong, how likely it is, and your plan B. For example, if a company withdraws access, can you use published or secondary data instead? Supervisors are more confident in a topic when you have already thought about its risks."}, {"t": "Checking novelty in the literature", "b": "Before committing, check whether your question has already been answered. This protects you from repeating work and helps you describe your contribution.\n\nA practical routine:\n• Search two or three major databases (for example Scopus, Web of Science, PubMed, IEEE Xplore, or ERIC, depending on field) and Google Scholar, using your key terms and synonyms.\n• Look for recent systematic or narrative reviews first. They summarise what is known.\n• Search thesis repositories, because students elsewhere may have done similar work.\n• In health and social care, check registries of planned reviews such as PROSPERO.\n• Note the five to ten most similar studies and what each one did not do.\n\nNovelty does not have to mean 'never studied anywhere'. Valid contributions include a new setting, a new population, a new method, a new combination of variables, newer data, or testing a theory where it has not been tested.\n\nBe careful with the claim 'no study has been done in my country'. Location alone is a weak gap unless you explain why the setting could change the answer, for instance different climate, regulations, culture or infrastructure."}, {"t": "Writing a topic statement", "b": "A topic statement is a short paragraph (about 100 to 200 words) that you can show your supervisor. It is not yet a full proposal, but it should contain:\n\n• The topic, stated specifically (place, population, time if relevant).\n• The main question you want to answer.\n• The problem: why the answer matters and to whom.\n• A sentence on what is already known and what is missing.\n• A first idea of the approach and data.\n\nAdd a working title. Many good titles name the main variables or phenomenon and the setting, for example: 'Extension access and adoption of drought-tolerant maize among women smallholders in northern Ghana'.\n\nUseful sentence patterns:\n• 'This study examines … in … .'\n• 'Although … is well documented, little is known about … .'\n• 'The study will ask … .'\n• 'Answering this question will help … to … .'\n\nExpect to revise the statement many times. Topics change as you read. That is normal and healthy. Keep each version with a date, so you can see how your thinking developed and explain the changes to your supervisor."}], "examples": [{"label": "Moving from an interest to a researchable topic", "weak": "My research topic is renewable energy in Nigeria.", "strong": "My research examines why households in Kaduna that bought solar home systems through pay-as-you-go schemes between 2020 and 2024 stop making payments, in order to help providers and regulators design schemes that keep low-income users connected.", "why": "The weak version names a whole field. The strong version limits place, population, technology and time, asks a clear question (why payments stop) and states who would use the answer."}, {"label": "Adding the 'so what' to a question", "weak": "I want to find out how many nurses in Nairobi public hospitals use hand sanitiser.", "strong": "I want to find out what prevents nurses in Nairobi public hospitals from following hand hygiene guidelines during night shifts, so that infection-control teams can target the barriers that matter most.", "why": "The weak version would produce one number with no explanation. The strong version asks a 'what prevents' question that needs analysis, and links the answer to a practical use."}, {"label": "A topic statement that shows feasibility and novelty", "weak": "I will study the impact of mobile money on small businesses. Mobile money is very important and there are no studies on it in my area. I will collect data from many businesses.", "strong": "This study examines how the use of mobile money for supplier payments affects stock-outs among small grocery retailers in Dhaka. Previous studies have measured mobile money's effect on household savings, but few have examined its role in retail supply chains, where delayed payments can interrupt stock. Using a survey of about 150 retailers in two markets, accessed through a traders' association, the study will compare stock-out frequency between frequent and infrequent users.", "why": "The strong version names the specific effect and setting, describes what existing studies covered and what they missed instead of claiming 'no studies', and shows realistic access and sample size."}], "checks": [{"q": "Which of these is a research topic rather than a broad interest?", "o": ["Public health in South Asia", "Uptake of the HPV vaccine among secondary-school girls in Karnataka after the 2023 school programme", "Why vaccines are important", "Education and technology"], "a": 1, "why": "Option B limits the population, place, intervention and time. The others are whole fields or opinions. 'Why vaccines are important' sounds like a question but would lead to a general essay, not research."}, {"q": "In the Booth et al. approach, what turns a research question into a research problem?", "o": ["Adding more variables to the question", "Choosing a quantitative method", "Explaining why the answer matters to readers beyond yourself", "Making the question narrower"], "a": 2, "why": "A problem is a question whose answer others need. Narrowing (D) improves a topic, but it does not by itself show significance."}, {"q": "A student's literature search returns over 200,000 results and almost every paper seems relevant. What is the best next step?", "o": ["Narrow the topic by place, population, time or a specific variable", "Read as many papers as possible before deciding anything", "Switch to a completely different field", "Keep the topic and plan a longer thesis"], "a": 0, "why": "Endless relevant results are the classic sign of an over-broad topic. Reading everything (B) is impossible and delays the real decision."}, {"q": "Which claim of novelty is strongest?", "o": ["No study has ever been done on this topic in my country.", "This topic is very important and interesting.", "Few studies exist, so any study is useful.", "Existing studies of greywater reuse come from arid regions with low rainfall; none has tested whether the same treatment performs in high-rainfall tropical cities, where dilution and storm flows differ."], "a": 3, "why": "Option D names what earlier studies did and explains why the new setting could change the result. A location-only claim (A) is weak unless the reason the setting matters is given."}, {"q": "A one-year MSc student plans to follow 500 farmers over three growing seasons. Which feasibility issue is most serious?", "o": ["Ethics", "Time", "Novelty", "Writing style"], "a": 1, "why": "Three seasons cannot fit in a one-year degree with a few months for fieldwork. Ethics matters too, but time makes this design impossible as stated."}, {"q": "Your search on a narrow topic finds almost nothing. What should you try first?", "o": ["Conclude you have found a major gap and start data collection", "Abandon the topic immediately", "Search again with synonyms and related terms, and look at comparable settings", "Ask a friend to write the literature review"], "a": 2, "why": "Few results often mean the search terms or scope are too narrow. Only after a careful search with synonyms can you claim a real gap (A)."}, {"q": "You join your supervisor's funded project on urban flooding. What is the best way to develop your own topic?", "o": ["Identify a distinct question within the project that you can own, and agree it with your supervisor", "Ignore the project and choose an unrelated topic", "Study the whole project's scope yourself", "Wait for the supervisor to write your research questions"], "a": 0, "why": "Joining a project is common. Your contribution must still be distinct and clearly yours. Taking on the whole scope (C) is not feasible."}, {"q": "Which is a conceptual (research) problem rather than a practical problem?", "o": ["Many rural clinics run out of essential drugs every month.", "Factory wastewater is polluting a river.", "Teachers in the district are leaving the profession.", "We do not know whether stock-outs in rural clinics are caused mainly by ordering practices or by supplier delays."], "a": 3, "why": "A conceptual problem is a gap in understanding. Options A to C describe harmful situations (practical problems); D states what we do not know about one of them."}, {"q": "Which source is most likely to show you exactly what other researchers think is still unknown?", "o": ["The 'limitations' and 'future research' sections of recent papers and reviews", "Newspaper headlines", "The abstract of a single highly cited old paper", "A general textbook introduction"], "a": 0, "why": "Authors often name open questions in these sections, and recent reviews summarise them across many studies."}, {"q": "A student wants to interview survivors of gender-based violence in a refugee camp for a six-month master's project. Which feasibility issue should be raised first?", "o": ["Whether the topic is interesting", "The citation style", "Ethics and access: risk to participants, approval time and gatekeepers", "The number of chapters"], "a": 2, "why": "Research with highly vulnerable people needs careful ethical review, safeguarding and trusted access, which may not fit a short project. Interest (A) is not the issue."}, {"q": "Which working title is most informative?", "o": ["A study of water", "Water: problems and prospects", "Household storage practices and E. coli contamination of drinking water in peri-urban Kano", "An investigation into some aspects of water quality issues"], "a": 2, "why": "Option C names the factor, outcome, and setting. The others are vague and could describe hundreds of studies."}], "checklist": ["Write your interest, topic, question and problem as four separate one-sentence lines.", "Complete the three-part sentence: I am studying …, because I want to find out …, so that readers can understand … .", "List at least ten questions about your topic, then circle the two that need evidence and analysis to answer.", "Narrow (or broaden) your topic along at least two dimensions: place, time, population, variable, method or theory.", "Score your topic for time, data, skills, access and ethics, and write a plan B for the biggest risk.", "Search two databases, Google Scholar and a thesis repository; record the five most similar studies and what each did not do.", "Draft a 150-word topic statement with a working title and send it to your supervisor."], "practice": "Write the three-part Booth-style sentence for your current project: topic, question and why it matters. Then list the five feasibility factors (time, data, skills, access, ethics) and give each a score from 1 to 5. Revise the topic until no factor scores below 3.", "reading": [{"book": "Booth, W.C., Colomb, G.G., Williams, J.M., Bizup, J. and FitzGerald, W.T. (2024) The Craft of Research. 5th edn. University of Chicago Press.", "why": "Read the opening chapters 'From Topics to Questions' and 'From Questions to a Problem'. They are the backbone of this unit and explain the topic-question-significance sentence in depth."}, {"book": "Kumar, R. (2019) Research Methodology: A Step-by-Step Guide for Beginners. 5th edn. SAGE.", "why": "Read the chapter on formulating a research problem in the 'research problem' step. It gives a practical routine for dissecting a broad area into subareas and testing each against feasibility. A 6th edition is announced for late 2026."}, {"book": "Punch, K.F. (2016) Developing Effective Research Proposals. 3rd edn. SAGE.", "why": "Read the chapter on developing a general framework for proposals, which shows how topic, questions and methods fit together before you write a proposal."}], "links": [{"t": "Princeton: The 'magic research statement' (Booth's formula explained)", "u": "https://pcur.princeton.edu/2016/10/the-magic-research-statement-turning-a-topic-into-a-research-question"}, {"t": "Brandeis Writing Program: Articulating your research project", "u": "https://www.brandeis.edu/writing-program/resources/students/academic/articulating-your-research.html"}, {"t": "Lehigh University Libraries: Refine a topic (too broad or too narrow)", "u": "https://libraryguides.lehigh.edu/researchprocess/step1e"}, {"t": "Texas State University Libraries: Choosing a research problem", "u": "https://guides.library.txstate.edu/socialscienceresearch/choosing-a-research-problem"}]}]}</script>
<script>
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
const view=$('#view');
/* in-page dialogs (browser pop-ups are blocked in some viewers) */
function askConfirm(title,msg,okLabel,onOk){const d=$('#dlg');d.innerHTML=`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn ghost" id="acNo">Cancel</button><button class="btn primary" id="acYes">${esc(okLabel)}</button></div>`;if(!d.open)d.showModal();$('#acNo').onclick=()=>d.close();$('#acYes').onclick=()=>{d.close();onOk()};$('#acNo').focus()}
function askText(title,label,okLabel,onOk){const d=$('#dlg');d.innerHTML=`<h3>${esc(title)}</h3><label for="atIn">${esc(label)}</label><input type="text" id="atIn"><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn ghost" id="atNo">Cancel</button><button class="btn primary" id="atYes">${esc(okLabel)}</button></div>`;if(!d.open)d.showModal();const go=()=>{const v=$('#atIn').value.trim();if(!v){$('#atIn').focus();return}d.close();onOk(v)};$('#atNo').onclick=()=>d.close();$('#atYes').onclick=go;$('#atIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};$('#atIn').focus()}


/* ============ storage (private to each learner's browser) ============ */
const KEY='citadel-v1';
const DEF={xp:0,levels:{},solved:{},badges:[],streak:{count:0,last:null},lib:[],cols:['Thesis','Reading pile'],doc:'',style:'apa',libStyle:'apa',unlockAll:false,paraDone:{},theme:'',mistakes:{},daily:{date:'',xp:0},goal:50,seenTour:false,sprintBest:0,reviewed:0};
let S;
try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=JSON.parse(JSON.stringify(DEF))}

/* downloads capability (optional) */
let DL=null;
try{ if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{}) } }catch(e){}
async function copyText(plain,html){
  try{ if(html&&window.ClipboardItem){ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]); return true } }catch(e){}
  try{ await navigator.clipboard.writeText(plain); return true }catch(e){}
  try{ const t=document.createElement('textarea');t.value=plain;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok }catch(e){ return false }
}
async function saveFile(name,text){
  if(DL){ try{ await DL.save({filename:name,data:text}); toast('Saved '+name); return }catch(e){ if(e&&e.code==='declined'){toast('Download cancelled');return} } }
  try{ const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove() }catch(e){}
  const ok=await copyText(text); toast(ok?'Copied '+name+' contents to your clipboard':'Could not save; select and copy the text manually');
}

/* ============ progression ============ */
const RANKS=[[0,'Curious reader'],[80,'Apprentice citer'],[200,'Source scout'],[360,'Paraphrase artisan'],[560,'Style strategist'],[800,'Evidence critic'],[1100,'Integrity guardian'],[1500,'Master scholar']];
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k});return i}
const BADGES={
  first:{n:'First source',d:'Add your first reference to the library.'},
  clean:{n:'Clean sweep',d:'Earn three stars on any level.'},
  artisan:{n:'Own words',d:'Pass a paraphrase with under 10% shared phrasing.'},
  polyglot:{n:'Style polyglot',d:'Three stars in Style detective.'},
  critic:{n:'Sceptic',d:'Three stars in Source critic.'},
  guardian:{n:'Integrity guardian',d:'Pass the final audit.'},
  librarian:{n:'Librarian',d:'Keep ten references in your library.'},
  author:{n:'Author',d:'Write a draft with three or more citations and no unsupported claims.'},
  streak3:{n:'Habit forming',d:'Practise three days in a row.'},
  graduate:{n:'Graduate',d:'Earn at least one star on every level.'},
  goal:{n:'Goal getter',d:'Reach your daily XP goal.'},
  sprinter:{n:'Sprinter',d:'Ten or more correct in one citation sprint.'},
  reviewer:{n:'Comeback',d:'Master ten reviewed mistakes.'},
  certified:{n:'Certified',d:'Pass the integrity certificate exam with 80% or more.'}
};
const today=()=>new Date().toISOString().slice(0,10);
function touchStreak(){const t=today();if(S.streak.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak.count=S.streak.last===y?S.streak.count+1:1;S.streak.last=t;if(S.streak.count>=3)badge('streak3')}
function addXP(n){if(!n)return;S.xp=(S.xp||0)+n;touchStreak();save()}
function badge(id){if(S.badges.includes(id))return;S.badges.push(id);save()}
function renderHeaderOld(){}

/* ============ curriculum ============ */
/* Each level: learn (lesson cards), pool (hand-written bank), gens (generated challenges), take (per round). */
const PASSAGES=[
 {cite:`(Adeyemi & Holt, 2023)`,keep:['citation', 'references', 'plagiarism'],label:`Adeyemi, T., & Holt, R. (2023). Practice source.`,text:`Students often treat citation as a formality to be completed after the writing is finished. However, when references are gathered at the end, the link between each claim and its evidence is easily lost, and accidental plagiarism becomes far more likely.`},
 {cite:`(Brennan, 2020)`,keep:['wetlands', 'vegetation', 'microorganisms', 'pollutants', 'particles', 'roots', 'water'],label:`Brennan, K. (2020). Practice source.`,text:`Wetlands act as natural filters. As water moves slowly through dense vegetation, suspended particles settle out and microorganisms living on plant roots break down many dissolved pollutants.`},
 {cite:`(Castillo, 2018)`,keep:['peer', 'review', 'reviewers', 'raw', 'data', 'publication', 'studies'],label:`Castillo, R. M. (2018). Practice source.`,text:`Peer review is not a guarantee of truth. It is a filter that catches many errors, but reviewers rarely have access to raw data, and flawed studies still reach publication.`},
 {cite:`(Nwosu & Park, 2024)`,keep:['wastewater', 'phosphorus', 'bioplastics', 'biopolymers', 'treatment', 'energy', 'chemicals'],label:`Nwosu, C., & Park, J. (2024). Practice source.`,text:`Recovering valuable materials from wastewater changes the economics of treatment. A plant that once only consumed energy and chemicals can become a source of phosphorus, bioplastics and biopolymers.`},
 {cite:`(Mensah, 2019)`,keep:['students', 'plagiarise', 'sources', 'notes'],label:`Mensah, A. (2019). Practice source.`,text:`Most students who plagiarise do not set out to cheat. They run out of time, lose track of their notes, or were never shown how to integrate sources, which is why teaching the skill works better than punishing the lapse.`},
 {cite:`(Laurent, 2017)`,keep:['citation', 'disciplines', 'historians', 'archival', 'documents', 'scientists', 'evidence', 'referencing'],label:`Laurent, J. (2017). Practice source.`,text:`Citation practices differ between disciplines because each field values different kinds of evidence. Historians prize archival documents, whereas experimental scientists prize replicable measurements, and their referencing systems reflect those priorities.`},
 {cite:`(Haddad, 2022)`,keep:['urban', 'trees', 'temperatures', 'water', 'vapour', 'neighbourhoods'],label:`Haddad, S. (2022). Practice source.`,text:`Urban trees reduce summer temperatures by shading surfaces and releasing water vapour. The cooling effect is strongest in dense neighbourhoods, where paved areas otherwise absorb heat during the day and radiate it late into the evening.`},
 {cite:`(Okoro & Bello, 2021)`,keep:['open', 'access', 'publishing', 'journals', 'researchers', 'institutions', 'fee', 'waivers'],label:`Okoro, P., & Bello, K. (2021). Practice source.`,text:`Open access publishing removes price barriers for readers, but it can shift costs onto authors. Without fee waivers, researchers from poorly funded institutions may find it harder to publish in prominent journals.`}
];
const AUDITS=[
 {q:`Click every sentence with a citation problem, then check. This paper uses APA 7.`,segs:[
  {s:`Plastic pollution in freshwater systems has grown rapidly over the past two decades (Haddad & Moreau, 2022).`,err:false},
  {s:`One survey found microplastics in 83% of tap-water samples tested worldwide.`,err:true,why:`A specific statistic with no source.`},
  {s:`As Chen (2019) argues, “filtration alone cannot solve a problem that begins upstream” (p. 44).`,err:false},
  {s:`Water is essential for all known forms of life.`,err:false},
  {s:`Lindqvist describes microplastics as “a silent tide in every glass we drink.”`,err:true,why:`A direct quotation with no year or page number.`},
  {s:`Treatment plants concentrate these particles in sludge that is later spread on farmland (Okoro et al., 2021, as cited in Wikipedia).`,err:true,why:`Wikipedia is not a scholarly source to cite through. Read and cite Okoro et al. directly.`},
  {s:`Later studies confirmed the trend (Haddad and Moreau 2022).`,err:true,why:`Mixed styles: this is Chicago format inside an APA paper. APA uses (Haddad & Moreau, 2022).`}]},
 {q:`Audit this paragraph on online learning. It uses APA 7. Click every sentence with a problem.`,segs:[
  {s:`Online learning expanded rapidly after 2020 (Lopez & Grant, 2022).`,err:false},
  {s:`Completion rates for open online courses are only 15%.`,err:true,why:`A statistic with no source.`},
  {s:`Kaur (2021) found that students value flexibility above all other course features.`,err:false},
  {s:`Online learning is instruction delivered over the internet.`,err:false},
  {s:`However, “students who study alone disengage faster than those in cohorts” (Duval, 2019).`,err:true,why:`A direct quotation needs a page or paragraph number: (Duval, 2019, p. 12).`},

  {s:`Kaur’s results therefore prove that cohort-based courses always outperform self-paced ones.`,err:true,why:`Overclaiming: Kaur studied student preferences, not outcomes, and one study cannot prove “always”.`}]},
 {q:`Audit this paragraph on physical activity. It uses APA 7. Click every sentence with a problem.`,segs:[

const TELLS={
 apa:`APA: initials, “&” before the last author, the year in brackets after the authors, a sentence-case title, and an italic journal and volume.`,
 mla:`MLA: full first names, the title in quotation marks and title case, “vol.”, “no.” and “pp.” labels, and the year near the end.`,
 chicago:`Chicago author-date: full names, the year straight after the authors without brackets, title case, and a volume (issue): pages pattern.`,
 harvard:`Harvard: initials, “and” rather than “&”, the year in brackets with no full stop after it, single quotation marks and “pp.”.`,
 ieee:`IEEE: a bracketed number first, initials before surnames, the title in double quotation marks, and “vol.”, “no.” and “pp.” labels.`,
 vancouver:`Vancouver: a leading number, surnames followed by unpunctuated initials, no italics, and a compact year;volume(issue):pages string.`
};
const LEVELS=[
{id:'why',title:'Why we cite',sub:'Joining the scholarly conversation',desc:'Academic writing is a conversation. Learn what citation does for your readers, for the people whose work you build on, and for your own voice.',take:8,
 learn:[
  {h:`Academic writing is a conversation`,b:`Every paper joins a discussion that started before you arrived. Citations show who said what, so readers can follow that discussion and see where your voice comes in.`},
  {h:`Three jobs of a citation`,b:`A citation gives credit to the people whose words, ideas and data you use. It lets readers check your evidence. And it makes your own contribution visible by marking where other people’s work ends.`},
  {h:`Ideas about authorship differ`,b:`In some educational traditions, repeating an authority’s words shows respect and mastery. Most English-language universities expect you to show that respect by naming the source every time. Neither view is foolish, but you need to know which rules apply where you study.`},
  {h:`You are becoming a scholar`,b:`Citing well is how scholars earn trust, not just how students avoid penalties. Each citation says: I did the reading, and you can check.`},

{id:'where',title:'Placement precision',sub:'Where exactly the citation goes',desc:'Click the spot in each sentence where the citation belongs. Placement tells readers precisely which claim is supported.',take:8,

  {h:`Punctuation`,b:`In APA, Harvard, IEEE and Vancouver the citation sits before the full stop. For quotations it comes after the closing quotation mark.`},

 {t:'mcq',q:`You paraphrase one source across four consecutive sentences. What is good practice in APA?`,opts:[`Cite after every sentence`,`Cite at first mention and keep it clear with signal phrases; cite again if another source intervenes`,`Cite only at the end of the paragraph`,`No citation is needed after the first paragraph`],a:1,why:`Clarity is the goal: readers must always know whose idea they are reading.`},
