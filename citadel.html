er's hobbies", "Expected statistical results", "A backup plan if a partner company withdraws access to its site", "The abstract"], "a": 2, "why": "Risk sections list what could go wrong and how you will respond. Showing a backup plan strengthens feasibility."}, {"q": "Which of these is the clearest problem statement?", "o": ["Girls' secondary enrolment in rural Sindh has risen, but completion rates remain low and the school-level factors behind dropout are poorly understood", "Education in Pakistan is important", "Many students drop out everywhere", "This study is about schools"], "a": 0, "why": "It names a place, a population, a measured change and a specific unknown. That gives the study a clear direction."}, {"q": "Who is LEAST likely to be a main audience for a research proposal?", "o": ["A funding panel", "An admissions committee", "An ethics committee", "The general readership of a newspaper"], "a": 3, "why": "Proposals are written for specialist decision makers. A lay summary may be required, but newspaper readers are not the audience."}], "checklist": ["Find the template, word limit and assessment criteria for your proposal, and copy the headings into your draft", "Write your aim in one sentence, then list three to five objectives that start with measurable verbs", "Build an alignment table: objective, research question, data, collection method, analysis method", "Write a problem statement that names the setting, gives evidence, states the gap and explains why it matters", "Draw a Gantt chart with phases, milestones and buffer time for delays", "List your resources and costs, and note which ones you already have", "Ask one person outside your field to read your summary and tell you, in their own words, what you will do"], "practice": "Write your aim and three objectives for your own project. Then build a five-column alignment table (objective, research question, data needed, collection method, analysis method). Any empty cell shows where your proposal needs work.", "reading": [{"book": "Punch, K.F. (2016) Developing Effective Research Proposals. 3rd edn. SAGE.", "why": "The most direct guide to the task. Read the chapters on what reviewers expect and on a general framework for proposals, then the worked example proposals at the end."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "Read the chapters on the introduction, purpose statement, and research questions and hypotheses. They show how to write and align these parts across qualitative, quantitative and mixed methods designs, with proposal outlines."}, {"book": "Clark, T., Foster, L., Sloan, L. and Bryman, A. (2021) Bryman's Social Research Methods. 6th edn. Oxford University Press.", "why": "The early chapters on planning a research project and formulating research questions help social science students narrow a topic into a feasible design."}], "links": [{"t": "How to write a good postgraduate research proposal (University of Edinburgh, PDF)", "u": "https://edwebcontent.ed.ac.uk/sites/default/files/atoms/files/howtowriteproposal2024_0.pdf"}, {"t": "How to write a research proposal (University of Liverpool)", "u": "https://www.liverpool.ac.uk/postgraduate-research/how-to-apply/research-proposal/"}, {"t": "Writing a research proposal (University of Huddersfield)", "u": "https://www.hud.ac.uk/postgraduate/research/writing-a-research-proposal/"}, {"t": "Academic Phrasebank (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/"}]}, {"id": "publish", "title": "Publishing your research", "sub": "From manuscript to published paper", "goals": ["Choose a suitable, trustworthy journal by checking scope, audience, indexing, open access options and fees", "Agree authorship fairly using ICMJE criteria and describe contributions with CRediT", "Write a cover letter and respond to reviewers point by point in a professional way", "Handle rejection, resubmission, preprints and conference papers in line with COPE ethics basics"], "lessons": [{"t": "Why and what to publish", "b": "Publishing shares your findings, builds your reputation and is often expected for PhD students, especially in the sciences, engineering and health. Many scholarships and academic jobs ask for a publication record.\n\nCommon types of publication:\n\n• Original research article: reports new data or analysis. The main currency in most fields.\n• Review article: synthesises existing studies. Systematic reviews follow strict, reported methods.\n• Short communication or letter: a brief, focused finding.\n• Conference paper or abstract: shared at a meeting. In computer science and some engineering fields, full conference papers are highly valued; in many other fields, journals count more.\n• Book chapter: invited contribution to an edited book.\n\nWhere does the paper come from? Often from a master's dissertation or a thesis chapter. A thesis chapter is not a paper yet: it usually needs a sharper single question, much less background, a shorter literature review and a focused discussion. Expect to cut a 15,000-word chapter to a 6,000 to 8,000-word article.\n\nTalk to your supervisor early about which parts of your work could become papers, in what order, and who will be an author."}, {"t": "Choosing a journal", "b": "Choose the journal before you finish writing, because it shapes length, structure, style and reference format.\n\nQuestions to ask:\n\n• Scope: Does the journal's 'aims and scope' page cover your topic and method? Have they published similar papers in the last two or three years?\n• Audience: Who reads it? A specialist audience (for example, wastewater engineers) or a broad one (environmental scientists in general)? Write for that reader.\n• Indexing: Is it indexed in major databases such as Scopus, Web of Science, PubMed (for health) or the Directory of Open Access Journals (DOAJ) for open access titles? Indexing affects who finds your work and whether your university counts it.\n• Reputation and speed: Ask your supervisor. Look at time to first decision if the journal publishes it.\n• Article type and length limits.\n• Open access and fees (see next lesson).\n\nA practical method: list the journals that appear most often in your own reference list. They already publish the conversation you are joining. Make a shortlist of three, ranked, so you know where to go next if rejected.\n\nAvoid choosing only by impact factor. A good fit with a respected journal beats a poor fit with a famous one."}, {"t": "Open access, APCs and waivers", "b": "Open access (OA) means anyone can read your paper free online. There are several routes:\n\n• Gold OA: the journal makes the article free on publication. Often funded by an article processing charge (APC) paid by the author, funder or institution. APCs can range from a few hundred to several thousand US dollars.\n• Diamond (or platinum) OA: free to read and free to publish. Funded by institutions or societies. Many good diamond OA journals exist, including in Africa, Asia and Latin America.\n• Green OA: you publish in a subscription journal and place an accepted version in a repository, following the publisher's policy.\n• Hybrid: a subscription journal that lets you pay to make one article open.\n\nIf you cannot pay an APC:\n\n• Check whether your university or funder has an agreement with the publisher that covers fees. Many UK, Canadian and European universities do.\n• Look for a waiver policy. Many publishers waive or reduce APCs for authors in lower- and middle-income countries, often following Research4Life eligibility lists. Check where the corresponding author's institution is based, since that often decides eligibility.\n• Ask before submitting. Do not assume a waiver will be granted after acceptance.\n\nA journal that asks for payment before review, or hides its fees, is a warning sign."}, {"t": "Predatory journals and Think. Check. Submit.", "b": "Predatory journals take fees but do not provide real peer review, editing or long-term preservation. Publishing in one can harm your reputation, and your work may become hard to find or be lost.\n\nWarning signs:\n• Flattering emails inviting you to submit, often to a journal outside your field.\n• Promises of very fast review or guaranteed acceptance.\n• A very broad scope ('Journal of Science, Engineering and Social Studies').\n• Fees that are unclear, or requested before review.\n• Editorial board members you cannot verify, or who do not know they are listed.\n• Claims of fake metrics or of indexing you cannot confirm on the indexer's own website.\n• Poor-quality published papers and many spelling errors on the website.\n\nUse the Think. Check. Submit. checklist before any submission. It asks you to confirm, for example, that you know the journal, can contact the publisher, understand the peer review process and fees, and can verify claimed indexing and memberships (such as COPE, DOAJ or OASPA membership). Regional platforms such as African Journals Online (AJOL), SciELO and others can also help confirm a journal is real.\n\nIf in doubt, ask your supervisor or a librarian. Never submit just because a journal accepted you quickly."}, {"t": "Authorship: who is an author and in what order", "b": "Authorship gives credit and also responsibility. Agree it early, ideally before writing, and revisit it if roles change.\n\nThe ICMJE (International Committee of Medical Journal Editors) criteria are widely used beyond medicine. An author should meet all four:\n\n• A substantial contribution to the idea or design, or to collecting, analysing or interpreting data.\n• Drafting the work or critically revising it for important content.\n• Approving the final version to be published.\n• Agreeing to be accountable for all parts of the work.\n\nPeople who helped but do not meet the criteria, such as a technician, a translator or a colleague who gave advice, should be thanked in the acknowledgements. Being head of department, or providing funding alone, does not usually make someone an author. 'Gift' authorship (adding someone who did not contribute) and 'ghost' authorship (leaving out someone who did) are both unethical.\n\nAuthor order conventions differ by field. In many sciences the first author did most of the work and the last author is the senior supervisor. In economics and some mathematics, alphabetical order is common. For a paper from your thesis, you are usually first author.\n\nMany journals now ask you to describe each person's role using CRediT, explained in the next lesson."}, {"t": "CRediT and the corresponding author", "b": "CRediT (Contributor Roles Taxonomy) is a standard list of 14 roles that describes who did what. Journals that use it ask you to tag each author with one or more roles.\n\nThe roles are: Conceptualization, Data curation, Formal analysis, Funding acquisition, Investigation, Methodology, Project administration, Resources, Software, Supervision, Validation, Visualization, Writing – original draft, and Writing – review & editing.\n\nA sample statement for a thesis paper:\n'Amina Bello: Conceptualization, Methodology, Investigation, Formal analysis, Writing – original draft. Rahul Mehta: Supervision, Conceptualization, Writing – review & editing. Grace Owusu: Software, Visualization.'\n\nCRediT describes contributions; it does not decide authorship by itself. Use ICMJE-type criteria, or your field's norms, to decide who is an author, and CRediT to describe what they did.\n\nThe corresponding author handles submission and communication with the journal and answers readers' questions after publication. It may be you or your supervisor. Use an institutional email address that will still work in a few years, and register for an ORCID iD, a free identifier that links all your publications even if your name appears in different forms or you change institutions."}, {"t": "Submitting: the cover letter", "b": "Most journals ask for a short cover letter to the editor. The editor reads it to decide quickly whether the paper fits the journal and deserves review.\n\nA good cover letter (usually under one page):\n\n• Addresses the editor by name if known.\n• Gives the title and article type.\n• States in two or three sentences what the study did and found.\n• Explains why it fits this journal and its readers, ideally linking to the journal's scope or recent papers.\n• Confirms ethics: the work is original, not under consideration elsewhere, all authors approved it, and conflicts of interest and funding are declared.\n• Optionally suggests reviewers (independent experts without conflicts) if the journal asks.\n\nAvoid:\n• Repeating the abstract word for word.\n• Over-claiming ('This paper will revolutionise the field').\n• A generic letter that could go to any journal.\n\nUseful sentence patterns:\n'This study is, to our knowledge, the first to...'\n'These findings will interest readers of [journal] because...'\n'The manuscript has not been published and is not under consideration elsewhere.'\n\nAlso follow the author guidelines exactly: word limits, reference style, figure formats, data availability statement and reporting checklists (for health research, see the EQUATOR Network)."}, {"t": "Peer review and responding to reviewers", "b": "After submission, the editor first checks fit and quality. Many papers are 'desk rejected' at this stage without review. If the paper goes out, usually two or three reviewers assess it. Review can be single-anonymous (reviewers know authors), double-anonymous (neither knows) or open.\n\nPossible decisions: accept (rare at first round), minor revision, major revision, reject and resubmit, or reject.\n\nResponding to reviewers:\n\n• Read the comments, then wait a day before replying.\n• Write a response letter that copies each comment, then your reply, then the change made and where (page and line).\n• Respond to every comment, even small ones.\n• Thank reviewers briefly, without flattery.\n• If you agree, make the change and show the new text.\n• If you disagree, explain politely with evidence or references. 'We considered this but retained our approach because...'\n• If a reviewer asks for something impossible (for example new fieldwork), explain why and discuss it as a limitation.\n• Mark changes in the manuscript with tracked changes or colour, as the journal asks.\n\nA misunderstanding by a reviewer usually means the text was unclear. Fix the text, not just the letter."}, {"t": "Rejection, preprints, conferences and ethics", "b": "Rejection is normal. Many well-known researchers have had papers rejected several times. When it happens:\n• Read the reasons. Was it fit, quality, or novelty?\n• Improve the paper using any reviewer comments, even if the journal said no.\n• Reformat for the next journal on your list. Do not send the same paper to two journals at once; that is duplicate submission and is unethical.\n\nPreprints are versions posted publicly before or during peer review, on servers such as arXiv, bioRxiv, medRxiv, SSRN or AfricArXiv. They share findings quickly and establish priority. Most journals accept preprinted papers, but check the journal's policy first.\n\nConference papers can lead to journal articles. If you later publish an extended version, follow the journal's rules on prior publication and cite the conference paper.\n\nCOPE (Committee on Publication Ethics) provides guidance that most reputable journals follow. Key points for authors:\n• No fabrication, falsification or plagiarism, including self-plagiarism (reusing your own published text without citing it).\n• Declare funding and conflicts of interest.\n• Have ethics approval and consent where required.\n• Report errors you discover after publication so they can be corrected."}], "examples": [{"label": "Cover letter opening", "weak": "Dear Sir/Madam, I am pleased to submit my paper for publication in your esteemed and prestigious journal. This research is very important and novel. I hope you will accept it.", "strong": "Dear Dr Ramirez, please consider our original article 'Constructed wetlands for treating cassava-processing wastewater in southern Nigeria: a two-year field evaluation' for publication in the journal. We show that a low-cost horizontal-flow wetland removed 78% of chemical oxygen demand year-round, with no loss of performance in the dry season. This addresses the journal's interest in decentralised treatment for small industries and complements recent work in the journal on agro-industrial effluents.", "why": "The strong version names the editor and article, states the key finding with a number and explains fit with the journal. The weak one uses empty praise and gives the editor no reason to send the paper for review."}, {"label": "Responding to a reviewer you partly disagree with", "weak": "Reviewer 2 says our sample is too small. We disagree. Our sample is fine.", "strong": "Comment 2.3: The sample of 48 schools may be too small for the regression model.\nResponse: Thank you for raising this. A power analysis (now reported in Section 3.2, lines 210 to 216) shows that 48 schools give 80% power to detect a medium effect. We agree, however, that smaller effects may be missed, and have added this to the limitations (Section 5.3, lines 512 to 518).", "why": "The strong response restates the comment, gives evidence, shows exactly where the manuscript changed, and concedes what is fair. It is polite, specific and easy for the editor to check."}, {"label": "Agreeing authorship", "weak": "The head of department is added as second author because it is customary, and the field assistant who collected all the data is not mentioned.", "strong": "Authors are the student (design, data collection, analysis, drafting), the supervisor (design, critical revision) and a co-supervisor who ran the statistical modelling and revised the text. The head of department, who gave general support, and the field assistant, who helped collect data under supervision, are thanked in the acknowledgements, unless the assistant also meets the authorship criteria.", "why": "The strong version applies clear criteria: authors made substantial contributions and revised the work. Honorary authorship is avoided, and everyone who helped receives appropriate credit."}], "checks": [{"q": "You receive an email: 'Dear Esteemed Researcher, submit to our International Journal of Advanced Multidisciplinary Research. Acceptance in 72 hours. Fee only USD 99.' What is the best response?", "o": ["Submit quickly, since the fee is low", "Treat it as a likely predatory journal and check it with Think. Check. Submit. before considering it", "Reply asking for a discount", "Submit a short version to test them"], "a": 1, "why": "Flattering invitations, very broad scope and guaranteed fast acceptance are classic warning signs. Check the journal carefully; most such journals fail the checklist."}, {"q": "Which is the best first step to build a journal shortlist for a paper on groundwater arsenic in Bangladesh?", "o": ["Pick the journal with the highest impact factor in science", "Choose any journal that accepts papers quickly", "Look at which journals appear most often in your own reference list and check their aims and scope", "Choose the journal your friend published in, regardless of topic"], "a": 2, "why": "Journals already publishing the work you cite are likely to fit your topic and audience. Impact factor or speed alone does not ensure fit."}, {"q": "Under ICMJE criteria, which person should normally be an author?", "o": ["A colleague who helped design the study, interpreted the data, critically revised the draft, approved the final version and accepts accountability", "A department head who approved the student's leave", "A funder who paid for the laboratory analysis", "A friend who proofread the English"], "a": 0, "why": "ICMJE requires all four criteria: substantial contribution, drafting or critical revision, final approval and accountability. The others should be acknowledged, not listed as authors."}, {"q": "What is the purpose of the CRediT taxonomy?", "o": ["To rank authors by importance", "To calculate a journal's impact factor", "To decide which journals are predatory", "To describe each contributor's specific roles in a standard way"], "a": 3, "why": "CRediT lists 14 standard roles, such as Methodology or Formal analysis, so readers can see who did what. It does not rank authors or rate journals."}, {"q": "Your paper receives 'major revision'. Which response letter format is best?", "o": ["A short note saying 'All comments addressed'", "Each comment copied, followed by your reply and the exact location of any change in the manuscript", "A new cover letter explaining why the reviewers misunderstood", "Only replies to the comments you agree with"], "a": 1, "why": "A point-by-point response that shows where changes were made lets editors and reviewers check quickly. Every comment needs a reply, including those you disagree with."}, {"q": "A reviewer misunderstood your sampling method. What is the most effective response?", "o": ["Explain in the letter that the reviewer did not read carefully", "Ignore the comment because it is wrong", "Ask the editor to remove the reviewer", "Clarify the method in the manuscript itself, and explain the clarification politely in the response"], "a": 3, "why": "If an expert reviewer misunderstood, other readers may too. Improving the text solves the problem for everyone, and a polite reply keeps the editor on your side."}, {"q": "Your paper was rejected by Journal A. You want to send it to Journal B. What should you do?", "o": ["Use any useful reviewer comments to improve it, reformat it to Journal B's guidelines, then submit", "Send it to Journals B, C and D at the same time to save time", "Send exactly the same file without changes", "Publish it on your blog and stop"], "a": 0, "why": "Improving and reformatting increases your chances. Submitting to several journals at once is duplicate submission, which COPE-following journals treat as misconduct."}, {"q": "You cannot afford a USD 2,500 APC for a gold OA journal. Which option is most appropriate?", "o": ["Abandon the paper", "Choose a predatory journal with a lower fee", "Check for waivers or institutional agreements, consider diamond OA or subscription journals, and ask before submitting", "Pay the fee from your scholarship living allowance without asking anyone"], "a": 2, "why": "Many publishers offer waivers or discounts, many universities cover fees, and diamond OA and subscription journals charge authors nothing. Checking before you submit avoids surprises."}, {"q": "Which statement about preprints is accurate?", "o": ["Preprints are peer-reviewed final versions", "Posting a preprint is always forbidden by journals", "Preprints can only be posted after acceptance", "A preprint shares work publicly before peer review, and you should check the target journal's preprint policy"], "a": 3, "why": "Preprints are not peer reviewed. Most journals accept preprinted papers, but policies vary, so check before posting."}, {"q": "Which sentence is most suitable in a cover letter?", "o": ["This paper is the most important study ever done on this topic.", "These findings will interest the journal's readers because they provide the first long-term field data on drip irrigation costs for smallholders in East Africa.", "Please accept my paper because I need it to graduate.", "I have also sent this paper to two other journals."], "a": 1, "why": "Option B makes a specific, supportable case for fit and novelty. Over-claiming, personal pressure and simultaneous submission all harm your chances or breach ethics."}, {"q": "You reuse three paragraphs from your own published paper in a new article without citing it. What is this?", "o": ["Acceptable, because you wrote both", "Required, to keep wording consistent", "Self-plagiarism (text recycling), which journals usually treat as an ethics problem unless disclosed and permitted", "Only a problem if a different publisher is involved"], "a": 2, "why": "Reusing published text without citation misleads readers about what is new. Some limited reuse, such as standard method descriptions, may be accepted if cited and permitted by the journal."}, {"q": "What is a 'desk rejection'?", "o": ["A rejection by the editor before the paper is sent to peer review", "A rejection after three rounds of review", "A rejection for missing the conference deadline", "A rejection caused by the online system crashing"], "a": 0, "why": "Editors desk-reject papers that do not fit the scope, do not follow guidelines or seem too weak. A good journal choice and a clear cover letter reduce this risk."}], "checklist": ["List three possible journals for your paper, checking each one's aims and scope, indexing, article types, word limits and fees.", "Run your top choice through the Think. Check. Submit. journal checklist and confirm its claimed indexing on the indexer's own website.", "Agree authorship and author order with your co-authors in writing, using ICMJE-type criteria, and draft a CRediT statement.", "Register for an ORCID iD and use it, with a long-term email address, on every submission.", "Draft a one-page cover letter that states your main finding and explains fit with the journal.", "Set up a response-to-reviewers template: comment, response, change made, page and line.", "Check your target journal's policies on preprints, data sharing, ethics statements and reporting guidelines before you submit."], "practice": "Choose one piece of your own work that could become a paper. Identify a target journal, then write a 150-word cover letter paragraph that states your key finding with a number and gives two specific reasons why it fits that journal's scope and readers.", "reading": [{"book": "Belcher, W. L. (2019) Writing Your Journal Article in Twelve Weeks: A Guide to Academic Publishing Success. 2nd edn. University of Chicago Press.", "why": "A week-by-week workbook for turning a thesis chapter or seminar paper into a submitted article. Especially useful for the weeks on selecting a journal and on revising the argument."}, {"book": "Thomson, P. and Kamler, B. (2013) Writing for Peer Reviewed Journals: Strategies for Getting Published. Routledge.", "why": "Read the parts on joining a scholarly conversation, crafting the contribution, and dealing with reviewers. Strong on the identity side of becoming a published author."}, {"book": "Gastel, B. and Day, R. A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Use the parts on choosing a journal, submission, peer review, the review process and publication ethics. Clear and practical for science, engineering and health researchers."}], "links": [{"t": "Think. Check. Submit. journal checklist", "u": "https://thinkchecksubmit.org/journals/"}, {"t": "ICMJE: defining the role of authors and contributors", "u": "https://www.icmje.org/recommendations/browse/roles-and-responsibilities/defining-the-role-of-authors-and-contributors.html"}, {"t": "CRediT: Contributor Roles Taxonomy", "u": "https://credit.niso.org/"}, {"t": "COPE: Committee on Publication Ethics", "u": "https://publicationethics.org/"}, {"t": "Frontiers: how to respond to reviewer comments", "u": "https://www.frontiersin.org/for-authors/submitting-research/how-to-respond-reviewer-comments"}, {"t": "Research4Life: best practices for APC waivers", "u": "https://research4life.org/apc-waivers"}]}, {"id": "revise", "title": "Revising, editing and using feedback", "sub": "Turning a draft into finished work", "goals": ["Revise a draft in the right order, from argument and structure down to sentences and proofreading", "Use reverse outlining, reading aloud and checklists to find problems in your own writing", "Turn feedback, marking rubrics and supervisor comments into a clear revision plan", "Decide what editing help, language tools and AI use are allowed under your university's integrity rules"], "lessons": [{"t": "Revising is not the same as proofreading", "b": "Many students 'revise' by correcting spelling and commas. That is proofreading, the last and smallest step. Real revision means re-seeing the draft: checking whether the argument works and whether the reader can follow it.\n\nThink of four levels, from large to small:\n\n• Global: Is the argument clear? Does the piece answer the question or achieve its aim? Is the structure logical? Is anything missing or irrelevant?\n• Paragraph: Does each paragraph have one main point, stated clearly near the start? Does it link to the paragraphs before and after?\n• Sentence: Is each sentence clear, concise and correct? Are terms used consistently?\n• Proofreading: spelling, punctuation, formatting, reference style, figure numbers.\n\nWork from top to bottom. If you polish sentences first and then discover a section must be cut, you have wasted that effort.\n\nLeave time between drafting and revising, ideally a few days. Distance helps you read what is actually on the page rather than what you meant to write. Plan your deadline so there is room for at least two full revision passes."}, {"t": "Global revision: argument and structure", "b": "Start by asking big questions of the whole draft.\n\n• Can you state your main argument or finding in one or two sentences? If not, your reader will not be able to either.\n• Does the introduction promise what the rest delivers? Check that the aims or questions in the introduction are actually answered in the results and conclusion.\n• Is the order logical for the reader, not just the order in which you did things?\n• Is every section needed? Cut material that is interesting but does not serve the argument.\n• Is the balance right? A two-page background and a half-page discussion usually signals a problem.\n• Is there enough evidence and analysis, or mostly description?\n\nA useful exercise: write the argument of your paper as a list of five to eight claims, one per line, in the order you want the reader to accept them. Then check whether your sections follow that order.\n\nGlobal revision can feel painful because it may mean moving or deleting large sections. Keep a 'cuttings' file where removed text goes. Knowing it is saved makes it easier to cut boldly."}, {"t": "Reverse outlining", "b": "A reverse outline is an outline you make after writing, from the draft itself. It shows the structure you actually wrote, which is often different from the one you planned.\n\nHow to do it:\n\n• Number every paragraph in your draft.\n• For each paragraph, write one short sentence in the margin or a separate list: what is the main point?\n• Next to it, note what job the paragraph does: introduces, defines, gives evidence, compares, critiques, concludes.\n\nThen read only the list and look for problems:\n\n• Paragraphs with no clear main point, or with two or three points. Split or rewrite them.\n• Two paragraphs making the same point in different places. Merge them.\n• Points in an illogical order. Move them.\n• Gaps: a step in the argument the reader needs but is missing.\n• Points that do not connect to your aim. Cut them.\n\nReverse outlining works well for literature reviews, which often drift into summaries of one source after another. If your list reads 'Smith says... Patel says... Mensah says...', reorganise around themes or debates instead of authors."}, {"t": "Paragraph and sentence revision", "b": "Once the structure is sound, improve paragraphs and sentences.\n\nParagraphs:\n• Open with a topic sentence that states the main point.\n• Follow with evidence, explanation and your own analysis.\n• End by linking the point back to your argument or forward to the next idea.\n• As a rough guide, most academic paragraphs run between 100 and 250 words. A one-sentence paragraph or a page-long one usually needs work.\n\nSentences:\n• Put the main subject and verb early. 'The committee approved the plan' is easier than 'Approval of the plan was given by the committee'.\n• Prefer strong verbs to nouns made from verbs: 'we analysed' rather than 'an analysis was performed'. Helen Sword has called these heavy nouns 'zombie nouns'.\n• Cut empty phrases: 'it is important to note that', 'in order to', 'due to the fact that' (use 'because').\n• Keep one idea per sentence where possible. Split sentences longer than about 35 words.\n• Use key terms consistently. If you call it 'household income' in one place, do not switch to 'family earnings' later; readers may think it is a different variable.\n\nTip for multilingual writers: keep a personal list of your common errors (for example articles, verb agreement, prepositions) and check for them specifically."}, {"t": "Reading aloud and other self-checking tricks", "b": "Your eyes skip errors in your own writing because your brain knows what you meant. These tricks help you see the page as a reader does.\n\n• Read aloud slowly. You will hear missing words, sentences that run out of breath, and repeated words. If you stumble, the reader will too.\n• Use text-to-speech. Word and most browsers can read your text to you. Listening to a neutral voice exposes awkward phrasing.\n• Change the look. Print it, change the font, or read it on a phone. A new format makes familiar text look new.\n• Read backwards for spelling. Start at the last sentence and work up. This breaks the flow of meaning so you focus on words.\n• Do one pass per problem. One pass for references, one for figure and table numbers, one for your personal error list.\n• Use search. Search for your weak spots: 'very', 'this shows', 'it is', double spaces, and words you often misspell.\n\nA checklist turns these into a routine. Make your own from your feedback history: the comments you receive again and again are the ones to check every time."}, {"t": "Using feedback and marking rubrics", "b": "A rubric (marking criteria or marking scheme) is the table markers use to grade work. It usually lists criteria such as argument, use of literature, method, analysis, structure and presentation, with descriptions for each grade band.\n\nUse it before and after writing:\n\n• Before: read the description of the top band for each criterion. Turn each into a question about your draft. For example, 'Critical evaluation of a wide range of sources' becomes 'Do I evaluate sources, or only describe them?'\n• After: mark your own draft against the rubric honestly. Where would you place yourself, and why?\n\nWhen you get feedback on marked work:\n\n• Read it fully, including comments in the margins.\n• Separate comments about this piece from comments that apply to all your writing. The second kind are the most valuable.\n• Turn each piece of feedback into an action: 'needs more critical analysis' becomes 'for each source, add one sentence on its strengths or limits'.\n• Keep a feedback file across modules so you can see patterns.\n\nGrading systems differ across countries. In the UK, 70 per cent and above is often a distinction-level mark, which can surprise students used to higher numbers. A lower number does not always mean worse work."}, {"t": "Responding to supervisor comments", "b": "Supervisor comments on drafts are a conversation, not a verdict.\n\nA practical process:\n\n• Make a table with three columns: comment, my action, location of change. This is your response log.\n• Respond to every comment, even if only with 'done' or 'kept, because...'.\n• For comments you agree with, make the change and note it.\n• For unclear comments, ask: 'Could you say a little more about what you mean by ‘tighten the framing’?'\n• For comments you disagree with, explain your reasoning with evidence. A good supervisor respects a reasoned view.\n• When comments from two supervisors conflict, do not choose silently. Raise it with both and agree a way forward.\n\nWhen you send the revision, include the response log and a clean copy, plus a version with tracked changes if your supervisor prefers. This saves them from re-reading everything.\n\nWatch your emotional response. Many comments on a page can feel like criticism of you. They are not; they are investment in your work. Read, wait a day, then act. If you notice the same comment coming back on several chapters, add it to your personal checklist."}, {"t": "What editing help is allowed?", "b": "Universities have rules about how much help others may give with assessed work. Rules differ, so read your own institution's proofreading policy and any module guidance.\n\nMany UK policies, such as Oxford's policy on third-party proofreaders, follow a similar pattern.\n\nA proofreader may usually:\n• Point out spelling, punctuation and grammar errors.\n• Flag unclear sentences or wording.\n• Note formatting problems and minor inconsistencies in references.\n\nA proofreader may usually not:\n• Rewrite your sentences or arguments.\n• Add, cut or reorder content.\n• Correct facts, data or calculations.\n• Translate your work into English.\n\nNotice the word 'flag'. Often the proofreader identifies a problem and you fix it yourself. The work must remain yours.\n\nFor a PhD thesis, many universities allow limited professional editing for language if your supervisor agrees and it is acknowledged. For journal papers, paid language editing is normal and widely accepted.\n\nWriting centres are a safe, free option. Staff at university writing or academic skills centres help you improve your own writing through one-to-one sessions and workshops, without doing the writing for you. Book early before deadlines."}, {"t": "Language tools, AI and their limits", "b": "Tools can help, but they can also mislead you or break integrity rules.\n\n• Spelling and grammar checkers (Word, Grammarly basic features): good for typos and simple errors. They often miss subject-specific terms, mistake correct sentences for errors, and suggest changes that alter meaning. Treat suggestions as questions, not commands.\n• Dictionaries and corpus tools: learner dictionaries and phrase banks (such as the Manchester Academic Phrasebank) help you find standard academic phrases. Use them as models and build your own sentences.\n• Translation tools: can help you understand sources. Translating whole sections of your own assessed work is often not allowed.\n• Generative AI (ChatGPT, Claude and similar): university rules vary widely and change often. Some allow AI to flag errors or explain grammar; many forbid using it to rewrite or generate assessed text. For example, the University of Sussex's student guidance treats submitting AI-generated content as your own as misconduct.\n\nSafe habits:\n• Check your module guidance and university policy before using any AI tool.\n• If allowed, keep a record of what you used and how, and declare it as instructed.\n• Never paste confidential data, participants' details or unpublished results into public AI tools.\n• Never accept references from AI without finding and reading the real source; AI tools can invent citations."}], "examples": [{"label": "A paragraph that summarises sources instead of building a point", "weak": "Adeyemi (2019) studied mobile banking in Lagos. He found that trust was important. Sharma (2020) looked at mobile banking in Delhi. She found that cost was the main factor. Ochieng (2021) studied M-Pesa in Kenya and found that agent networks mattered.", "strong": "Studies of mobile banking adoption disagree on what matters most. Some find that trust is decisive, as Adeyemi (2019) showed among Lagos traders, while others point to cost, as Sharma (2020) reported in Delhi. Ochieng's (2021) Kenyan study suggests a third factor, the density of agent networks, which may explain why adoption differs even where trust and cost are similar. However, all three studies are urban, leaving rural users largely unexamined.", "why": "The weak paragraph lists one source per sentence. The strong one opens with a topic sentence, compares the sources, adds the writer's interpretation and ends by identifying a gap, which is what markers mean by 'critical'."}, {"label": "Sentence-level revision", "weak": "It is important to note that in order to carry out an evaluation of the effectiveness of the training programme, an analysis of the test scores was performed by the researcher due to the fact that this was considered to be the most appropriate method.", "strong": "To evaluate the training programme, I analysed test scores, because they gave the most direct measure of learning.", "why": "The revision cuts empty phrases, turns nouns ('evaluation', 'analysis') back into verbs, and gives a clear reason. It halves the length and keeps the meaning."}, {"label": "Responding to a supervisor comment", "weak": "Comment: 'Methods unclear: how were participants selected?' Student response: 'OK.' (No change is made in the text.)", "strong": "Comment: 'Methods unclear: how were participants selected?' Response log: 'Added a paragraph to 3.3 (p. 41) explaining purposive sampling of 18 head teachers from public and private schools in two districts, with inclusion criteria and how they were contacted.'", "why": "The strong response shows what changed and where, so the supervisor can check quickly. A reply without a change in the text wastes their time and leaves the problem in the thesis."}], "checks": [{"q": "You have one week left before submitting a 5,000-word essay. In what order should you revise?", "o": ["Spelling, then sentences, then paragraphs, then argument", "Argument and structure, then paragraphs, then sentences, then proofreading", "Only proofreading, because the ideas are already written", "References first, then everything else at the same time"], "a": 1, "why": "Big changes can delete or move whole sections, so do them first. Polishing sentences you later cut wastes time."}, {"q": "You make a reverse outline and notice that paragraphs 4 and 11 both explain why the sample was small. What should you do?", "o": ["Leave both, since repetition helps readers remember", "Delete both", "Change the wording of one so it does not look repeated", "Merge them into one paragraph in the most logical place"], "a": 3, "why": "Reverse outlining exposes repetition. Merging keeps the point once, in the place where the reader needs it."}, {"q": "A reverse outline of your literature review reads: 'Ali says... Brown says... Chen says... Diallo says...'. What does this most likely show?", "o": ["The review is organised by author rather than by theme, and probably lacks synthesis", "The review is excellent because it covers many authors", "The references are in alphabetical order, which is required", "The paragraphs are too short"], "a": 0, "why": "A source-by-source list is a sign of description without synthesis. Reorganising around themes, debates or findings makes the review critical."}, {"q": "Which revision of 'An investigation into the causes of flooding was conducted by the team' is clearest?", "o": ["An investigation was conducted into causes of flooding by the team", "It is the case that the team conducted an investigation of flooding causes", "The team investigated the causes of flooding", "Flooding causes were the subject of investigation"], "a": 2, "why": "Option C puts the subject and a strong verb first and removes the heavy noun 'investigation'. The others keep the wordy structure."}, {"q": "Under a typical UK university proofreading policy, which action by a paid proofreader is allowed?", "o": ["Rewriting your discussion section so the argument is stronger", "Translating your Urdu draft into English", "Cutting 1,000 words so you meet the word limit", "Highlighting sentences that contain grammar errors so you can correct them"], "a": 3, "why": "Proofreaders may usually identify errors and unclear wording. Rewriting arguments, translating or cutting content changes the authorship of the work and is normally not allowed."}, {"q": "A marker writes 'too descriptive, more critical analysis needed'. Which action best responds?", "o": ["Add five more sources with summaries", "For each key source, add evaluation of its strengths, limits or relevance, and compare sources with each other", "Use more advanced vocabulary", "Make the paragraphs longer"], "a": 1, "why": "Critical analysis means evaluating and comparing, not adding more description or fancier words."}, {"q": "How should you use a marking rubric before submitting?", "o": ["Turn the top-band descriptions into questions and check your draft against each one", "Ignore it, since it is only for markers", "Copy its wording into your essay", "Read it only after you get your mark"], "a": 0, "why": "Rubrics tell you exactly what markers reward. Using them as a self-check before submission is one of the most effective revision strategies."}, {"q": "Your two supervisors give conflicting advice: one says merge results and discussion, the other says keep them separate. What should you do?", "o": ["Follow whichever supervisor is more senior without telling the other", "Do both in different versions and send whichever they like", "Raise the conflict openly with both and agree a single approach", "Ignore both and keep the current structure"], "a": 2, "why": "Conflicting advice is normal. Bringing it into the open lets supervisors resolve it and avoids wasted work or later surprises."}, {"q": "A grammar checker suggests changing 'The samples were digested anaerobically' to 'The samples were digested aerobically'. What is the best response?", "o": ["Accept, because the tool knows English better", "Accept all suggestions to save time", "Turn off spellcheck completely", "Reject it, because the tool does not understand your technical meaning"], "a": 3, "why": "Language tools often misread technical terms. Treat suggestions as questions and check that the meaning stays correct."}, {"q": "Which use of generative AI is most likely to be a breach of academic integrity at many universities?", "o": ["Asking it to explain the difference between 'affect' and 'effect' for your own learning", "Having it rewrite your whole literature review and submitting the result as your own work", "Using it to suggest search terms for a library database, where your course allows this", "Asking it to point out sentences that may contain errors, where permitted and declared"], "a": 1, "why": "Submitting AI-rewritten or AI-generated text as your own is treated as misconduct by many universities. Learning support or permitted, declared error-flagging is often allowed, but always check your own rules."}, {"q": "An AI tool gives you a reference that fits your argument perfectly. What should you do before citing it?", "o": ["Find the actual source, check it exists and read the relevant part yourself", "Cite it, since AI tools draw on real databases", "Cite it with '(AI)' after the author's name", "Ask the AI if the reference is real and trust the answer"], "a": 0, "why": "AI tools can produce plausible but non-existent references. Citing a source you have not read, or one that does not exist, is a serious integrity problem."}, {"q": "Which self-check is most likely to catch a missing word in your own draft?", "o": ["Reading silently at normal speed", "Checking the word count", "Reading it aloud slowly or listening with text-to-speech", "Looking only at headings"], "a": 2, "why": "When you read silently your brain fills in what you meant. Reading aloud or listening forces you to process every word."}], "checklist": ["Find and save your university's proofreading policy and any guidance on AI tools for your course or thesis.", "Make a reverse outline of your current draft and fix any paragraph with no clear point, two points, or a point that repeats another.", "Write your main argument in one or two sentences and check that your introduction and conclusion both match it.", "Turn the top-band descriptions in your marking rubric into a self-check list and assess your draft against it.", "Create a response log table for the latest supervisor or marker feedback, with an action for every comment.", "Build a personal error checklist from past feedback and run one search or reading pass for each item.", "Read your final draft aloud or with text-to-speech before submitting, and book a writing centre appointment for your next major piece."], "practice": "Take one section of 800 to 1,500 words from your current work and make a reverse outline: one line per paragraph stating its main point and its job. Then write three specific changes you will make to the structure, and make them before you touch any sentence-level edits.", "reading": [{"book": "Sword, H. (2012) Stylish Academic Writing. Harvard University Press.", "why": "Read the parts on choosing strong verbs, sentence structure and engaging openings. It shows, with examples from many disciplines, how clear, lively prose is possible in academic writing."}, {"book": "Bailey, S. (2025) Academic Writing: A Handbook for International Students. 6th edn. Routledge.", "why": "Written for international students. Use the sections on the writing process, proofreading and common language problems as a practical reference while you revise."}, {"book": "Murray, R. (2025) How to Write a Thesis. 5th edn. Open University Press / McGraw Hill.", "why": "The parts on revising drafts and working with supervisor feedback give realistic strategies for turning early chapters into a finished thesis."}], "links": [{"t": "UNC Writing Center: Revising drafts", "u": "https://writingcenter.unc.edu/tips-and-tools/revising-drafts/"}, {"t": "University of Oxford: policy on third-party proofreaders", "u": "https://www.ox.ac.uk/about/how-we-are-run/policies-and-statements/policy-hub/third-party-proof-readers"}, {"t": "University of Sussex: using generative AI in your assessments", "u": "https://www.sussex.ac.uk/skills-hub/writing-and-assessments/ai"}, {"t": "Manchester Academic Phrasebank", "u": "https://www.phrasebank.manchester.ac.uk/"}]}, {"id": "rq", "title": "Research questions and hypotheses", "sub": "Asking questions research can answer", "goals": ["Classify research questions as descriptive, relational, causal or exploratory and match each to a suitable design", "Write a main question with sub-questions and test them against the FINER criteria", "Structure questions with PICO, PEO or SPIDER and write null, alternative and directional hypotheses", "Diagnose and fix questions that are too broad, yes/no, value-laden or unanswerable"], "lessons": [{"t": "What a research question does", "b": "Your research question is the steering wheel of your study. It decides what you read, what data you collect, how you analyse it, and what counts as a finished answer.\n\nA good research question is:\n• Clear: a reader understands exactly what you want to know.\n• Focused: it can be answered within your time, word limit and resources.\n• Researchable: it can be answered with evidence, not only opinion or belief.\n• Significant: the answer matters to someone, linked to your research problem.\n• Analytical: it needs more than a single fact or a quick search to answer.\n\nCompare: 'What is malaria?' (answered by a textbook) with 'How do bed-net distribution methods affect consistent net use among pregnant women in rural Uganda?' (needs data and analysis).\n\nYour question is not fixed on day one. You will revise it as you read the literature and pilot your methods. Many supervisors expect five or more versions before the question stabilises. But by the time you finish your proposal, the question should be precise enough that someone else could judge whether your study answered it."}, {"t": "Four types of research questions", "b": "Research questions fall into broad types. Knowing the type helps you choose a design.\n\n• Descriptive: what is happening, how much, how often? 'What proportion of small-scale miners in Ghana's Western Region use mercury in gold processing?' Typically answered with surveys, measurements or document analysis.\n• Relational or comparative: is there a relationship or difference between variables or groups? 'Is household income associated with mercury use?' or 'Do licensed and unlicensed miners differ in mercury use?' Typically answered with correlational or comparative statistics.\n• Causal: does one factor produce a change in another? 'Does a retort-training programme reduce mercury emissions?' Needs designs that support causal claims, such as experiments, quasi-experiments or careful longitudinal analysis.\n• Exploratory or qualitative: how do people experience, understand or make sense of something; how does a process unfold? 'How do women miners describe the health risks of mercury work?' Typically answered with interviews, focus groups, observation or case studies.\n\nThe question word matters. 'What' and 'how much' suit description. 'Is there a relationship' suits correlation. 'Does X cause' suits experiments. 'How' and 'why' often suit qualitative work, although 'how much' and 'why' can also be quantitative. Make the wording match the claim you can actually support."}, {"t": "Main questions and sub-questions", "b": "Most theses have one main (overarching) research question and two to five sub-questions. The main question states the central puzzle. The sub-questions break it into answerable parts.\n\nExample\nMain question: How can greywater be safely reused for urban vegetable gardening in Hyderabad?\nSub-questions:\n1. What are the physical, chemical and microbial characteristics of household greywater in the study area?\n2. How effective is a low-cost sand-and-charcoal filter in reducing these contaminants?\n3. What are gardeners' perceptions of and willingness to adopt greywater reuse?\n\nRules for sub-questions:\n• Together, their answers should answer the main question. If you answer all of them and the main question is still open, something is missing.\n• Each should be distinct. Avoid two sub-questions that ask the same thing in different words.\n• Each should need its own data or analysis. Often each sub-question becomes a results chapter or section.\n• Keep the number manageable. More sub-questions mean more data, more analysis and more pages.\n\nIn some fields, particularly experimental sciences, students write hypotheses or objectives instead of sub-questions. The logic is the same: one central aim broken into parts."}, {"t": "Testing questions with FINER", "b": "The FINER criteria come from clinical research (Hulley, Cummings and colleagues, in Designing Clinical Research), but they work well in any field. A good question is:\n\n• Feasible: you have enough participants or samples, time, money, skills and access. A question needing 2,000 patients is not feasible for a one-year master's.\n• Interesting: to you, your supervisor and the research community. Interest keeps you going when the work gets hard.\n• Novel: it confirms, refutes or extends earlier findings, or provides new findings. Replicating a study in a new setting can count, if you justify it.\n• Ethical: it can be studied without unacceptable risk to participants, communities or the environment, and it can pass ethics review.\n• Relevant: the answer matters for science, policy, practice or future research.\n\nUse FINER as a scoring tool. Rate your draft question from 1 to 5 on each criterion. A low score on Feasible or Ethical usually means you must change the question. A low score on Novel or Relevant means you need to reread the literature or sharpen your problem statement.\n\nFINER is a check, not a formula. It tells you where a question is weak, but you still have to rewrite it yourself."}, {"t": "Structuring questions: PICO, PEO and SPIDER", "b": "Frameworks help you include all the key parts of a question. They are widely used in health and evidence reviews, and useful elsewhere.\n\nPICO (intervention and effect questions):\n• P Population: adults with type 2 diabetes in urban Pune\n• I Intervention: SMS medication reminders\n• C Comparison: usual care\n• O Outcome: blood glucose control after six months\nQuestion: In adults with type 2 diabetes in urban Pune, do SMS reminders, compared with usual care, improve blood glucose control after six months?\n\nPEO (exposure and association questions, often qualitative or observational):\n• P Population: market traders in Accra\n• E Exposure: daily traffic air pollution\n• O Outcome: respiratory symptoms\n\nSPIDER (qualitative and mixed-methods questions): Sample, Phenomenon of Interest, Design, Evaluation, Research type. For example: young nurses (S), experience of night-shift work (PI), interviews (D), perceived wellbeing (E), qualitative (R).\n\nOther frameworks exist, such as SPICE for service evaluation. Choose the framework that fits your question type. Then use its elements as your search terms in the literature review."}, {"t": "Writing hypotheses", "b": "A hypothesis is a testable prediction about the relationship between variables. Hypotheses belong mainly to quantitative, deductive research, where you test a theory or expectation with data. Most qualitative studies use open questions instead.\n\nIn statistical testing you write a pair:\n• Null hypothesis (H0): there is no effect, difference or relationship. 'There is no difference in maize yield between plots treated with biochar and untreated plots.'\n• Alternative hypothesis (H1): there is an effect, difference or relationship. 'There is a difference in maize yield between biochar-treated and untreated plots.'\n\nAn alternative hypothesis can be:\n• Non-directional (two-tailed): predicts a difference without saying which way, as above.\n• Directional (one-tailed): predicts the direction. 'Biochar-treated plots will produce higher maize yield than untreated plots.'\n\nUse a directional hypothesis only when theory or previous evidence gives a clear reason to expect that direction.\n\nGood hypotheses:\n• Name the variables and the population.\n• Can be shown to be false by data.\n• Follow from the literature, not from guesswork.\n\nIn the thesis text, many authors state only the research hypothesis in words. Check your field and supervisor's preference for whether to list H0 and H1 formally."}, {"t": "Aligning questions with methods", "b": "Your question and your method must fit each other. A mismatch is one of the most common reasons examiners criticise a thesis.\n\nPairs that fit:\n• 'What is the prevalence of …?' → survey or measurement with a representative sample.\n• 'Is X associated with Y?' → correlational or cross-sectional data, regression analysis.\n• 'Does X cause Y?' → experiment, randomised trial, quasi-experiment or strong longitudinal design.\n• 'How do people experience …?' → interviews, focus groups, ethnography.\n• 'How and why did this process unfold in this case?' → case study using several data sources.\n• 'How well does this design perform?' → laboratory testing, modelling or simulation.\n\nPairs that do not fit:\n• Asking 'Does training cause higher yields?' but using a one-time survey with no comparison group. You can only report association.\n• Asking 'How do teachers experience the new curriculum?' but using a closed questionnaire with five-point scales. You will get ratings, not experiences.\n\nCreswell and Creswell show how question wording itself differs across qualitative, quantitative and mixed methods designs. Read your question aloud and ask: what kind of evidence would answer this? If your planned data cannot give that evidence, change the question or the method."}, {"t": "Common mistakes and how to fix them", "b": "• Too broad: 'How does climate change affect Africa?' Fix: narrow the place, population, variable and time.\n• Yes/no: 'Does social media affect students?' The answer 'yes' ends the study. Fix: ask how, to what extent, or under what conditions.\n• Value-laden: 'Why is the new tax policy unfair to traders?' This assumes your conclusion. Fix: 'How has the new tax policy affected the incomes and record-keeping of market traders?'\n• Unanswerable: 'Will Nigeria achieve universal electricity access by 2050?' No data can answer a prediction about the far future. Fix: ask about current drivers, scenarios or model projections, and say so.\n• Too many questions joined together: 'What are the causes, effects and solutions of flooding?' Fix: choose one focus or split into sub-questions.\n• Undefined terms: 'How does quality education affect development?' Fix: define each concept so it can be measured or observed.\n• A question that is really an objective or a task: 'To review the literature on …' is not a question.\n\nA quick self-test: can you imagine the table, figure or theme that would answer your question? If not, the question is probably still too vague."}, {"t": "Language tips for writing questions", "b": "Question wording is precise work, especially in an additional language. These patterns help.\n\nUseful openings:\n• 'To what extent does … influence …?' (degree; avoids yes/no)\n• 'What is the relationship between … and … among …?'\n• 'How do … differ between … and …?'\n• 'What factors are associated with … in …?'\n• 'How do … perceive / experience / make sense of …?'\n• 'How effective is … in reducing … under … conditions?'\n\nGrammar points:\n• A direct question has inverted word order and a question mark: 'How do farmers decide …?'\n• An indirect question, used inside a sentence, keeps normal order and no question mark: 'This study asks how farmers decide …'. Do not write 'This study asks how do farmers decide'.\n• Use the present tense for questions in a proposal and thesis.\n• Prefer specific verbs (reduce, predict, differ, explain) to general ones (affect, impact) where you can.\n\nKeep each question to one sentence, ideally under about 30 words. If it needs two lines of explanation, move the explanation into the text and keep the question clean."}], "examples": [{"label": "Fixing a yes/no, value-laden question", "weak": "Is the government's free school meals programme a failure?", "strong": "To what extent has the free school meals programme changed attendance and mid-day concentration among primary pupils in two districts of Kwara State since 2022?", "why": "The weak version invites a one-word answer and assumes a judgement ('failure'). The strong version asks about degree, names measurable outcomes, place, population and time."}, {"label": "Building a question with PICO", "weak": "Do mobile apps help patients?", "strong": "Among adults with hypertension attending public clinics in Karachi (P), does a pharmacist-led WhatsApp follow-up (I), compared with standard clinic visits (C), improve medication adherence at three months (O)?", "why": "Each PICO element is now explicit, so the question indicates the sample, comparison, outcome measure and timeframe, and supplies search terms for the review."}, {"label": "Writing a hypothesis pair", "weak": "Hypothesis: Fertiliser is good for crops.", "strong": "H0: There is no difference in mean cassava root yield between plots receiving NPK fertiliser and unfertilised plots in the study farms. H1 (directional): Plots receiving NPK fertiliser will produce a higher mean cassava root yield than unfertilised plots.", "why": "The strong version names the variables, crop, comparison and measure, and states the expected direction, so the data can show it to be false. 'Good' in the weak version cannot be tested."}, {"label": "Main question with aligned sub-questions", "weak": "Main question: What about e-learning in Kenyan universities? Sub-questions: What is e-learning? Is e-learning good? What are the problems and solutions?", "strong": "Main question: What factors influence lecturers' continued use of the learning management system in two public universities in Kenya? Sub-questions: (1) How frequently and for which tasks do lecturers use the system? (2) Which institutional and personal factors are associated with frequent use? (3) How do lecturers explain their decisions to continue or stop using it?", "why": "The strong set has a focused main question, and each sub-question needs different data (usage logs or survey, statistics, interviews) and together they answer the main question."}], "checks": [{"q": "Which research question is most researchable for a one-year master's project?", "o": ["How does globalisation affect developing countries?", "Is social media bad for young people?", "What factors are associated with the use of improved cookstoves among households in two rural districts of Malawi?", "Will Africa be food secure in 2080?"], "a": 2, "why": "C is focused on a specific behaviour, population and place, and can be answered with a survey. A is far too broad, B is yes/no and value-laden, D cannot be answered with data."}, {"q": "'Does a peer tutoring programme cause higher maths scores among Year 9 pupils?' What type of question is this?", "o": ["Causal", "Descriptive", "Exploratory", "Relational only"], "a": 0, "why": "It asks whether one factor produces a change in another. Answering it requires a design that supports causal claims, such as an experiment or quasi-experiment."}, {"q": "A student asks, 'How do midwives experience working in rural clinics without electricity?' Which method fits best?", "o": ["A randomised controlled trial", "Analysis of national electricity statistics", "A laboratory experiment", "In-depth interviews with midwives"], "a": 3, "why": "'How do people experience' calls for qualitative data about meanings and accounts. Statistics (B) can describe the context but not experiences."}, {"q": "In PICO, what does the C stand for?", "o": ["Context", "Comparison", "Cost", "Concept"], "a": 1, "why": "C is the comparison or control (for example usual care or no treatment). 'Context' appears in other frameworks, which makes A a tempting but wrong choice."}, {"q": "Which is a directional alternative hypothesis?", "o": ["There is no relationship between study hours and exam score.", "There is a relationship between study hours and exam score.", "Students who study more hours will achieve higher exam scores.", "What is the relationship between study hours and exam score?"], "a": 2, "why": "C predicts the direction (more hours, higher scores). A is a null hypothesis, B is non-directional and D is a question, not a hypothesis."}, {"q": "A student plans a single cross-sectional survey but asks, 'Does microcredit cause women's businesses to grow?' What is the main problem?", "o": ["The question is too narrow", "Surveys can never be used in research", "The question has too few words", "The design can show association, not causation, so the question and method are misaligned"], "a": 3, "why": "A one-time survey without a comparison or time dimension cannot support a causal claim. Either reword the question (association) or change the design."}, {"q": "Which FINER criterion is most clearly failed by a question that needs 3,000 hospital patients for a six-month MSc dissertation?", "o": ["Feasible", "Interesting", "Novel", "Relevant"], "a": 0, "why": "The question may be interesting and relevant, but the sample is not achievable in the time available."}, {"q": "Which framework is designed especially for qualitative and mixed-methods questions?", "o": ["PICO", "SMART", "SPIDER", "FINER"], "a": 2, "why": "SPIDER (Sample, Phenomenon of Interest, Design, Evaluation, Research type) was developed for qualitative and mixed-methods searching. SMART is for objectives; FINER evaluates questions."}, {"q": "Which sentence is grammatically correct as an indirect question?", "o": ["This study asks how do engineers choose suppliers?", "This study asks how engineers choose suppliers.", "This study asks how engineers do choose suppliers?", "This study asks, how engineers choose suppliers?"], "a": 1, "why": "Indirect questions keep normal statement word order (subject before verb) and end with a full stop. Option A uses direct question order inside a statement, a very common error."}, {"q": "Your main question is about the safety of greywater reuse. Your sub-questions cover greywater quality and filter performance only. What is missing?", "o": ["Nothing; two sub-questions are always enough", "A hypothesis for each sub-question", "More background chapters", "A sub-question covering an element the main question needs, such as health risk to users or crop contamination"], "a": 3, "why": "Answering all sub-questions should answer the main question. If 'safety' for users or crops is not addressed, the main question stays partly open."}, {"q": "Which revision best fixes the value-laden question 'Why are private schools better than public schools in Lagos?'", "o": ["How do learning outcomes and teaching conditions differ between private and public secondary schools in Lagos?", "Why are public schools worse than private schools in Lagos?", "Are private schools better?", "Why are private schools in Lagos so much better?"], "a": 0, "why": "A asks about differences without assuming which is better, and names what will be compared. The other options keep or strengthen the built-in judgement."}, {"q": "When are formal null and alternative hypotheses usually most appropriate?", "o": ["In every qualitative interview study", "In a literature review", "In quantitative studies that test an expected relationship or difference statistically", "Only in the conclusion chapter"], "a": 2, "why": "Hypotheses are tested with data in deductive, quantitative designs. Qualitative studies usually use open research questions instead."}], "checklist": ["Write your main research question as a single sentence of no more than about 30 words.", "Label it descriptive, relational, causal or exploratory, and check your planned design can support that type of claim.", "Write two to five sub-questions and confirm that answering all of them answers the main question.", "Score your question from 1 to 5 on each FINER criterion and revise anything scoring below 3.", "Break your question into PICO, PEO or SPIDER elements and use them as literature search terms.", "If your study is quantitative, write a null and an alternative hypothesis for each relationship you will test.", "Check for yes/no wording, built-in judgements and undefined terms, and rewrite them."], "practice": "Take your current research question and rewrite it three ways: once as a descriptive, once as a relational, and once as an exploratory question. Choose the version that best fits your problem and the data you can realistically collect, and write two sentences explaining your choice.", "reading": [{"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "Read the chapter 'Research Questions and Hypotheses' for model wording of qualitative questions, quantitative questions and hypotheses, and mixed methods questions, and the chapter on the purpose statement that precedes it."}, {"book": "Browner, W.S., Newman, T.B., Cummings, S.R., Grady, D.G., Huang, A.J., Kanaya, A.M. and Pletcher, M.J. (2022) Designing Clinical Research. 5th edn. Wolters Kluwer / Lippincott Williams & Wilkins.", "why": "Read the early chapter on conceiving the research question, where the FINER criteria are explained. Useful well beyond medicine."}, {"book": "Kumar, R. (2019) Research Methodology: A Step-by-Step Guide for Beginners. 5th edn. SAGE.", "why": "Read the chapters on identifying variables and constructing hypotheses for a beginner-friendly explanation of variables, hypothesis types and how they connect to questions."}], "links": [{"t": "George Mason University Writing Center: How to write a research question", "u": "https://writingcenter.gmu.edu/guides/how-to-write-a-research-question"}, {"t": "Utah State University Libraries: The research question (focused, feasible, complex)", "u": "https://libguides.usu.edu/writingcenter/researchquestion"}, {"t": "UNC Chapel Hill Libraries: PEO, SPIDER, SPICE and other question frameworks", "u": "https://guides.lib.unc.edu/pico/frameworks"}, {"t": "USC Libraries: The research problem/question", "u": "https://libguides.usc.edu/writingguide/introduction/researchproblem"}]}, {"id": "style", "title": "Academic style and voice", "sub": "Formal, precise, confident, and readable", "goals": ["Recognise the features of formal academic register and rewrite informal or spoken sentences into it", "Make sentences more precise and concise by replacing vague words and cutting empty phrases", "Calibrate claims with hedges and boosters so that confidence matches the strength of the evidence", "Choose first person, passive voice and tense deliberately according to your discipline and section"], "lessons": [{"t": "What 'academic register' means", "b": "Register is the level of formality and the set of choices a writer makes for a particular audience and purpose. You already switch register every day: you speak differently to a friend, a grandparent and a bank manager. Academic register is the variety used to report and argue about knowledge for expert readers.\n\nIts main features are:\n• Precise, field-specific vocabulary, with key terms defined once and then used consistently\n• Claims supported by evidence and citations, not by personal authority\n• A measured tone: confident where the evidence is strong, cautious where it is not\n• Complete, grammatical sentences organised into clear paragraphs\n• Few emotional words, idioms, slang or jokes\n\nFormal does not mean complicated. The best academic writing is formal and plain at the same time. Many students from strong school systems were taught that long words and long sentences show intelligence. Examiners in the UK, Canada, the USA and Australia usually reward the opposite: the clearest sentence that is still exact.\n\nRegister also varies by field. A history essay may use a personal, narrative voice; a chemistry paper is compressed and impersonal; a nursing reflection uses 'I' throughout. Before you write, read three or four good papers in your target journal or past high-scoring assignments and notice how they sound."}, {"t": "Precision: say exactly what you mean", "b": "Precision means a reader cannot misunderstand you. Vague words force the reader to guess, and examiners read guessing as weak understanding.\n\nCommon vague words and what to do with them:\n• 'things', 'stuff', 'aspects', 'issues': name the actual thing (costs, nitrate levels, attendance rates)\n• 'a lot', 'many', 'huge', 'very big': give a number or a comparison (rose from 12% to 31%; three times the national average)\n• 'recently', 'nowadays', 'in today's world': give a period (since 2015; between 2018 and 2023)\n• 'affect', 'impact', 'relate to': state the direction (increased, reduced, delayed, predicted)\n• 'society', 'people', 'developing countries': say which group (smallholder rice farmers in Kano State; first-year nursing students in Ontario)\n\nPrecision also means consistency. If you define 'food insecurity' using the FAO scale in your introduction, do not switch to 'hunger' or 'poverty' later as if they were synonyms. In academic English, a new word signals a new concept, so changing words for variety confuses readers.\n\nA useful test: underline every noun and verb in a paragraph. Could each one be replaced by a more specific word? If so, replace it."}, {"t": "Concision: cut words that do no work", "b": "Concise writing uses the fewest words needed to be exact. It is not about being brief at any cost; it is about removing words that carry no meaning.\n\nCommon sources of wordiness:\n• Empty openers: 'It is important to note that', 'It should be mentioned that', 'In this regard'\n• Redundant pairs: 'each and every', 'final outcome', 'past history', 'completely eliminate'\n• Wordy phrases: 'due to the fact that' (because), 'in order to' (to), 'a large number of' (many), 'at this point in time' (now), 'has the ability to' (can)\n• Throat-clearing paragraphs that repeat the question before answering it\n• Saying the same point twice in different words because you are not sure the first version was clear\n\nCompare: 'It is worth noting that, due to the fact that the majority of respondents were female, the findings may possibly not be generalisable.' (27 words) with 'Because most respondents were female, the findings may not generalise.' (10 words). Nothing of value was lost.\n\nWord limits make concision a practical skill. A 3,000-word assignment that wastes 10% on filler has 300 fewer words for analysis. Edit in a separate pass: first get ideas down, then hunt for cuts."}, {"t": "Nominalisation: useful tool, easy to overuse", "b": "Nominalisation means turning a verb or adjective into a noun: 'analyse' becomes 'analysis', 'fail' becomes 'failure', 'available' becomes 'availability'. It is a defining feature of academic English because it lets you package a whole process into one noun and then say something about it.\n\nGood uses:\n• Referring back to an idea: 'Water prices rose sharply in 2022. This increase reduced household consumption.'\n• Naming a concept you will discuss: 'Urbanisation has changed diets in West Africa.'\n• Compressing information in titles and abstracts\n\nThe danger is stacking nominalisations until no one is doing anything. Helen Sword calls these abstract nouns 'zombie nouns' because they drain life from sentences. Compare:\n\nWeak: 'The implementation of the evaluation of the intervention was undertaken by the team.'\nBetter: 'The team evaluated the intervention.'\n\nA practical rule: if a sentence has a weak verb (make, do, have, give, undertake, carry out) plus an '-tion' noun, try turning the noun back into the main verb. 'Carry out an investigation of' becomes 'investigate'. 'Make a comparison' becomes 'compare'.\n\nKeep the nominalisation when it refers back to something already mentioned or names a recognised concept. Cut it when it hides who did what."}, {"t": "Hedging and boosting: matching confidence to evidence", "b": "Hedges soften a claim; boosters strengthen it. Academic readers expect your confidence to match your evidence exactly. Overclaiming looks naive; underclaiming everything looks unsure.\n\nHedging devices:\n• Modal verbs: may, might, could\n• Verbs: suggest, indicate, appear to, tend to\n• Adverbs: possibly, probably, likely, generally, partly\n• Limiting phrases: in this sample, under these conditions, to some extent\n\nBoosting devices:\n• clearly, consistently, strongly, demonstrate, confirm, it is well established that\n\nWhen to hedge: interpreting results, explaining causes, generalising beyond your sample, making predictions and recommendations. When to boost (carefully): stating well-established facts, reporting results that are large and replicated.\n\nCompare three versions:\n• Overclaim: 'This study proves that mobile money reduces poverty.'\n• Overhedged: 'It could perhaps possibly be suggested that mobile money might have some effect.'\n• Calibrated: 'These results suggest that mobile money access is associated with lower poverty rates among rural households in this region.'\n\nAvoid 'prove' in most empirical writing; one study rarely proves anything. Do not stack hedges in a single clause. And remember that 'associated with' is the correct phrase when your design shows correlation, not cause."}, {"t": "First person and passive voice: norms by discipline", "b": "Many students were taught never to use 'I' or 'we'. This rule is out of date in much of the English-speaking academic world, but conventions still differ by field.\n\n• Humanities and much of social science: 'I argue that...' and 'In this essay I examine...' are common and often preferred.\n• Health sciences, education and business: 'we' is common in co-authored articles; 'I' is increasingly accepted in theses, especially in qualitative work where the researcher's role matters.\n• Natural sciences and engineering: articles often use 'we' for decisions ('We selected...'), while methods may still b
