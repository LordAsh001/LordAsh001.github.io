 Explanatory sequential: quantitative first, then qualitative to explain the results. Example: a survey shows that female students in an engineering faculty in Pakistan drop a course more often; interviews then explore why.\n\n• Exploratory sequential: qualitative first, then quantitative. Example: focus groups with dairy farmers identify local concerns about a vaccine, which are turned into survey items tested with a larger sample.\n\nMixed methods takes more time and skill. Use it when one kind of data would clearly leave part of the question unanswered, and plan explicitly where and how integration will happen (for example, a joint display table)."}, {"t": "Experimental and quasi-experimental designs", "b": "An experiment tests cause and effect. The researcher changes one factor (the independent variable or treatment) and measures the effect on an outcome (the dependent variable), while controlling other influences.\n\nIn a true experiment, units (people, plots, schools, samples) are randomly assigned to treatment and control groups. Randomisation means that, on average, the groups differ only in the treatment, so differences in outcome can be attributed to it. Randomised controlled trials in health and field trials in agriculture are examples. Laboratory experiments in engineering and chemistry also control conditions tightly, often with replicates.\n\nA quasi-experiment has a treatment and a comparison but no random assignment, often because randomisation is impossible or unethical. Example: comparing literacy in districts that started a mother-tongue reading programme with similar districts that did not. Common designs include before-and-after with a comparison group and interrupted time series.\n\nQuasi-experiments are useful and common in policy and education research, but they are more vulnerable to confounding: other differences between the groups that could explain the result. Strong write-ups name these threats and explain how they were reduced, for example by matching groups or measuring baseline differences."}, {"t": "Surveys and correlational designs", "b": "A survey design collects standardised information from a sample, usually with a questionnaire, to describe a population or examine relationships. It is efficient for reaching many people and estimating how common something is: the share of households using clean cooking fuel, or nurses' average job satisfaction.\n\nA correlational design examines whether variables move together, without manipulating anything. Does study time relate to exam scores? Is distance to a clinic associated with immunisation rates? Regression analysis extends this to several variables at once.\n\nThe key limitation: correlation is not causation. Higher fertiliser use may be associated with higher yields, but wealthier farmers may both buy more fertiliser and have better land. Without an experimental design, causal language must be careful.\n\nUseful phrasing:\n• 'X was positively associated with Y.'\n• 'Households further from a clinic were less likely to...'\n• 'After controlling for income, the relationship remained significant.'\n\nAvoid 'X causes Y' or 'X leads to Y' unless your design supports it.\n\nSurvey quality depends on sampling (who you reach) and measurement (whether your questions capture what you intend). The methods unit covers both."}, {"t": "Case study research", "b": "A case study examines one or a small number of cases in depth, in their real-life context. A case can be an organisation, a community, a programme, a policy, an event, or even an engineered system. Robert Yin's widely used book treats case study as especially suited to 'how' and 'why' questions about current events the researcher cannot control.\n\nKey features:\n• Clear boundaries: what is and is not part of the case (which hospital, which years)\n• Multiple sources of evidence: interviews, documents, observation, records, sometimes survey data\n• Analytic, not statistical, generalisation: you generalise to theory, not to a population\n\nCases can be single (one unusual or revealing case) or multiple (several cases compared, for example three cooperatives with different outcomes). Case selection must be justified: why this case?\n\nExample: a study of how a Nigerian state water agency adopted prepaid meters, using policy documents, interviews with staff and customers, and billing data.\n\nA common weakness is calling any small study a 'case study' without defining the case or using more than one source. If you only interview eight people, call it a qualitative interview study, unless the case is clearly defined and examined from several angles."}, {"t": "Ethnography, grounded theory and phenomenology", "b": "These three qualitative designs have different aims.\n\n• Ethnography: understanding a group's culture and everyday practices by spending extended time with them, often through participant observation, field notes and informal conversation. Example: several months observing how traders in an open-air market in Kumasi organise credit among themselves. Digital ethnography studies online communities in a similar way.\n\n• Grounded theory: building a theory from data, especially when existing theory is weak. Data collection and analysis happen together; the researcher codes early interviews, compares cases constantly and chooses later participants to develop emerging concepts (theoretical sampling). The result should be an explanatory model, not just a list of themes. Example: developing a theory of how young graduates in Chennai navigate informal job referrals.\n\n• Phenomenology: describing the lived experience of a particular phenomenon and its essential meaning for those who live it. Usually in-depth interviews with a small number of people who share the experience. Example: the lived experience of farmers who lost their harvest to floods.\n\nOnly name a specific design if you follow its procedures. Many students say 'grounded theory' when they mean general thematic coding. Examiners will check."}, {"t": "Action research and systematic review", "b": "Action research combines research and change. The researcher, often an insider such as a teacher, nurse or manager, works with participants in cycles: plan, act, observe, reflect, then plan again. The aim is both practical improvement and new knowledge.\n\nExample: a lecturer at a polytechnic introduces peer feedback in a design course, collects student work and reflections, adjusts the approach, and runs a second cycle the next term. Strong action research documents each cycle, explains how the researcher managed insider bias, and addresses ethics carefully, since participants may be one's own students or staff.\n\nA systematic review is a design in which the 'participants' are studies. It answers a focused question by finding, appraising and synthesising all relevant research using a transparent, reproducible protocol: defined search strings, databases, inclusion and exclusion criteria, screening by more than one person where possible, and quality appraisal. Meta-analysis statistically combines results when studies are similar enough.\n\nSystematic reviews are common in health, education and environmental science. The PRISMA 2020 statement sets reporting standards. A systematic review is more than a long literature review; if you call your review 'systematic', your method must be reproducible."}, {"t": "Design science, modelling and simulation", "b": "Engineering and computing research often asks not 'what is?' but 'what could work?' Design science research addresses this. The aim is to build and evaluate an artefact, such as a device, algorithm, software tool, process or framework, that solves a defined problem, and to learn something general from it.\n\nA typical structure:\n• Identify the problem and its requirements\n• Design and build the artefact\n• Demonstrate it in a realistic setting\n• Evaluate it against clear criteria (performance, cost, usability)\n• Communicate design principles that others can reuse\n\nModelling and simulation studies represent a real system mathematically or computationally, then run scenarios. Examples: a hydrological model of the Niger basin under different rainfall projections; a process simulation of a biogas plant; an agent-based model of how a disease spreads in a crowded settlement.\n\nGood modelling research explains:\n• Model assumptions and boundaries\n• Data sources and parameter values\n• Calibration (fitting to observed data) and validation (testing against data not used for fitting)\n• Sensitivity analysis: how much results change when uncertain inputs change\n\nExaminers want to know how much to trust a model. Without validation and sensitivity analysis, a simulation is only an illustration."}, {"t": "Time horizon and choosing your design", "b": "Time matters in design.\n\n• Cross-sectional: data collected at one point in time, like a snapshot. Quick and cheaper; shows patterns and associations but cannot show change or sequence well. Most master's surveys are cross-sectional.\n\n• Longitudinal: data collected from the same units over time, such as a panel of households surveyed each year, or soil measurements across three seasons. Shows change and helps establish what came first, but needs time, funding and effort to retain participants.\n\nSome studies use repeated cross-sections (new samples each time) or existing longitudinal datasets, such as national household panels, which give longitudinal insight within a short degree.\n\nTo choose a design, ask five questions:\n1. What does my question ask: extent, effect, relationship, meaning, process or solution?\n2. Do I need to show cause, or is association enough?\n3. Do I need breadth (many units) or depth (few units, rich data)?\n4. What can I realistically access in my time frame and budget?\n5. What will my examiners expect in this field?\n\nThen write a short justification: state the design, link it to the question, and name one alternative you rejected and why."}], "examples": [{"label": "Justifying a design rather than just naming it", "weak": "This study used a case study design because case studies are good for research.", "strong": "A single-case design was chosen because the study asks how and why one Kenyan county health department integrated community health volunteers into its digital reporting system between 2020 and 2024. The case is bounded by the department, its volunteers and this period. Documents, 18 interviews and reporting data will be combined to trace the process. A multi-county survey was rejected because it could show how widespread integration is but not how it unfolded.", "why": "The strong version links the design to a how/why question, defines the case's boundaries, names multiple evidence sources, and explains why an alternative was rejected."}, {"label": "Avoiding causal claims from a correlational design", "weak": "The survey of 250 SMEs in Lahore proved that social media marketing causes higher sales.", "strong": "In the cross-sectional survey of 250 SMEs in Lahore, more frequent social media marketing was associated with higher reported sales, even after controlling for firm size and sector. Because the design is cross-sectional, it cannot establish whether marketing raised sales or whether more successful firms invested more in marketing.", "why": "A one-time survey shows association, not causation. The strong version uses accurate language and names the alternative explanation, which shows design awareness."}, {"label": "Making a mixed methods design genuinely integrated", "weak": "Chapter 4 presents the questionnaire results. Chapter 5 presents the interview results. Chapter 6 concludes.", "strong": "The study uses an explanatory sequential design. Survey results on household water treatment in Dhaka slums (n = 320) identify which groups treat water least often; 16 interviews are then purposively drawn from those groups to explain why. A joint display table in Chapter 6 places each survey finding beside the interview themes that explain or challenge it.", "why": "The strong version names the specific mixed methods design, shows how the first phase shapes the second, and explains where integration happens. The weak version is two separate studies placed side by side."}], "checks": [{"q": "Which research question is best answered with a qualitative design?", "o": ["What percentage of Ugandan secondary schools have functioning science labs?", "Is there a relationship between class size and test scores in Punjab primary schools?", "How do newly qualified teachers in rural Uganda experience their first year in post?", "Does a phonics programme raise reading scores compared with standard teaching?"], "a": 2, "why": "The question about how teachers experience their first year asks about meaning and experience, which suits qualitative interviews or phenomenology. The others ask for percentages, relationships or effects, which suit quantitative designs."}, {"q": "A study randomly assigns 40 farms to receive a new pest-control method and 40 to continue usual practice, then compares losses. This is:", "o": ["A true experiment", "A quasi-experiment", "A correlational study", "A case study"], "a": 0, "why": "Random assignment to treatment and control groups is the defining feature of a true experiment. Without randomisation it would be quasi-experimental."}, {"q": "A ministry introduced free school meals in some districts. A researcher compares attendance in those districts with similar districts that did not get meals. What is the main threat to the conclusion?", "o": ["The sample is too qualitative", "Other differences between the districts, not the meals, may explain attendance differences", "Attendance cannot be measured", "Comparison groups are never allowed in education research"], "a": 1, "why": "Without random assignment, districts may differ in ways (wealth, roads, leadership) that also affect attendance. This is confounding, the main weakness of quasi-experiments."}, {"q": "Which design first uses focus groups to identify issues and then builds and tests a questionnaire with a larger sample?", "o": ["Convergent design", "Explanatory sequential design", "Ethnography", "Exploratory sequential design"], "a": 3, "why": "Exploratory sequential designs begin with qualitative work to explore and then test or measure with quantitative data. Explanatory sequential is the reverse order."}, {"q": "A student interviewed ten bank employees about customer service and calls it 'grounded theory'. What would an examiner most likely look for to accept this label?", "o": ["A sample of at least 500", "Simultaneous data collection and analysis, constant comparison, theoretical sampling and a resulting explanatory theory", "A hypothesis stated before data collection", "Use of secondary data only"], "a": 1, "why": "Grounded theory has specific procedures that build a theory from data. Without them, the study is better described as a qualitative interview study with thematic analysis."}, {"q": "A civil engineering student designs a low-cost sensor to detect pipe leaks, builds it, tests it in a pilot network and evaluates accuracy and cost. Which design label fits best?", "o": ["Phenomenology", "Ethnography", "Design science research", "Systematic review"], "a": 2, "why": "Design science research builds and evaluates an artefact to solve a defined problem. The study's core is creating and testing the sensor."}, {"q": "A modelling study of urban flooding in Lagos reports results but no comparison with observed flood data and no test of how results change with uncertain inputs. What is missing?", "o": ["Validation and sensitivity analysis", "A research onion diagram", "Interview data", "A larger literature review"], "a": 0, "why": "Validation shows the model reproduces reality; sensitivity analysis shows how robust results are. Without them, readers cannot judge how much to trust the model."}, {"q": "A researcher wants to know whether household income changes after families join a savings group. Which design is most suitable?", "o": ["A single cross-sectional survey of members", "A longitudinal design measuring the same households before and after joining, ideally with a comparison group", "A phenomenological interview study", "A content analysis of newspaper articles"], "a": 1, "why": "Change over time requires measuring the same units at more than one point. A comparison group strengthens the claim that joining the group, not something else, explains the change."}, {"q": "Which statement about case studies is most accurate?", "o": ["They are only for business research", "They must use questionnaires", "They cannot be used with more than one case", "They examine bounded cases in context, using multiple sources of evidence, and generalise to theory rather than to a population"], "a": 3, "why": "Case studies are used across many fields, can include one or several cases, and draw on varied evidence. Their generalisation is analytic (to theory), not statistical."}, {"q": "A teacher at a Kenyan college runs a new group-project approach, gathers student feedback, revises the approach and repeats it next term. Which design is this?", "o": ["Action research", "Systematic review", "Correlational design", "Phenomenology"], "a": 0, "why": "Action research uses repeated cycles of planning, acting, observing and reflecting, usually led by an insider who aims to improve practice."}, {"q": "A student calls a review 'systematic' but does not report databases, search terms or inclusion criteria. What is the main problem?", "o": ["Systematic reviews must contain primary data", "The review is not reproducible, so it does not meet the standard for a systematic review", "Only medical topics can be reviewed systematically", "Systematic reviews never use criteria"], "a": 1, "why": "The defining feature of a systematic review is a transparent, reproducible method, typically reported following PRISMA 2020. Without it, the review is narrative, not systematic."}], "checklist": ["Rewrite your research question and underline the words that signal the design (how many, effect of, relationship, how, why, what is it like).", "Name your design precisely (for example, explanatory sequential mixed methods, quasi-experiment, multiple-case study) and check that you follow its key procedures.", "Decide whether your question needs cross-sectional or longitudinal data, and write one sentence justifying the choice.", "If you claim cause and effect, check that your design can support it; if not, change the language to association.", "If you use mixed methods, state where and how the two strands will be integrated.", "If you use modelling or simulation, plan calibration, validation and sensitivity analysis from the start.", "Write two sentences explaining one alternative design you considered and why you rejected it."], "practice": "Write a 150-word design statement for your project: name the design, link it to your research question, say whether it is cross-sectional or longitudinal, and explain one alternative you rejected. Then ask: if a classmate read only this paragraph, could they predict what your results chapter will contain?", "reading": [{"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. Thousand Oaks, CA: SAGE.", "why": "Read the chapters on quantitative, qualitative and mixed methods procedures. They explain the main designs in each approach and describe the convergent, explanatory sequential and exploratory sequential mixed methods designs clearly."}, {"book": "Yin, R.K. (2018) Case Study Research and Applications: Design and Methods. 6th edn. Thousand Oaks, CA: SAGE.", "why": "Read the early chapters on when to use a case study and how to design one: defining the case, single versus multiple cases, and the logic of analytic generalisation. Essential if you plan any case study."}, {"book": "Saunders, M.N.K., Lewis, P. and Thornhill, A. (2023) Research Methods for Business Students. 9th edn. Harlow: Pearson.", "why": "Read the chapter on formulating the research design, which covers methodological choice, research strategies and time horizons, with worked examples from business and management."}], "links": [{"t": "Research Methods Knowledge Base: Research design", "u": "https://conjointly.com/kb/research-design/"}, {"t": "Scribbr: Mixed methods research designs with examples", "u": "https://www.scribbr.com/methodology/mixed-methods-research/"}, {"t": "PRISMA 2020 statement for reporting systematic reviews", "u": "https://www.prisma-statement.org/prisma-2020"}, {"t": "EQUATOR Network: reporting guidelines for many study designs", "u": "https://www.equator-network.org/"}, {"t": "Oklahoma State University open textbook: Paradigmatic methods", "u": "https://open.library.okstate.edu/gognresearchmethods/part/paradigmatic-methods/"}]}, {"id": "discuss", "title": "Discussion and conclusions", "sub": "Saying what your findings mean", "goals": ["Structure a discussion using its typical moves, from restating the aim to suggesting future research", "Interpret findings by comparing them with existing literature and explaining unexpected results", "Write honest limitations and specific implications, recommendations and conclusions", "Use hedging language to match the strength of your claims to the strength of your evidence"], "lessons": [{"t": "What the discussion is for", "b": "The Results section says what you found. The Discussion says what it means. It is where you answer the research question, show how your study changes or confirms what the field knows, and explain why that matters.\n\nThis is often the hardest section to write, and the one where examiners and reviewers look most closely for critical thinking. Common weaknesses include:\n• repeating the results in more words, with no interpretation\n• discussing literature that has nothing to do with your findings\n• ignoring results that did not fit the hypothesis\n• claiming far more than the data can support.\n\nThink of the Discussion as the bottom half of the hourglass. You start with your specific findings and widen out: to other studies, to theory, then to practice, policy and future research.\n\nA good Discussion also closes the loop with the Introduction. The gap you identified there should now be addressed directly: 'Earlier work had not examined X in low-income settings. Our findings show that...'. If a reader could swap your Discussion into a different paper on the same topic, it is not specific enough. Every paragraph should be about your results."}, {"t": "The moves of a discussion", "b": "Studies of published discussions, including those taught by Swales and Feak, show a common set of moves. Not every paper uses all of them, and some cycle through them once per key finding, but this order is a reliable starting plan.\n\n1. Restate the aim or question briefly, as a reminder (one or two sentences).\n2. Summarise the key findings, especially the answer to the main question. Do not repeat all the numbers.\n3. Interpret: say what the findings mean and offer possible explanations.\n4. Compare with literature: show where your results agree or disagree with earlier studies, and why that might be.\n5. Explain unexpected or contradictory results.\n6. Acknowledge limitations and how they might affect the conclusions.\n7. State implications for theory, practice or policy.\n8. Suggest future research that follows from your findings and limitations.\n\nMoves 3 to 5 usually form the bulk of the section. For a paper with three main findings, a common pattern is one or two paragraphs per finding, each moving through interpret, compare and explain, followed by shared paragraphs on limitations, implications and future work.\n\nOpen with your most important finding, not the least. Readers who stop after one paragraph should leave with your main message."}, {"t": "Interpreting and comparing with the literature", "b": "Interpretation means going beyond 'X increased' to 'what does this tell us?'. Useful questions to ask of each finding:\n• Does it answer the research question? Fully or partly?\n• What mechanism, process or reason might explain it?\n• Does it support, extend, qualify or contradict existing theory?\n• Is it consistent with earlier studies? If not, what differs: setting, population, method, time?\n\nWhen comparing with literature, be precise. Not 'this agrees with other studies' but 'This finding is consistent with an earlier study (Author, year), which reported a similar decline in Ogun State, but contrasts with another (Author, year), which found no change in Tamil Nadu, possibly because irrigation was more widespread in that sample.'\n\nUse the same key studies you introduced in your Introduction or literature review. New, unrelated literature appearing for the first time in the Discussion is a warning sign.\n\nWhen you offer explanations, show they are explanations, not proven facts: 'One possible reason is...', 'This may reflect...'. Where you can, give evidence for your explanation from your own data or from other studies.\n\nPhrases written for this unit:\n• 'This result supports the view that ...'\n• 'In contrast to earlier findings, ...'\n• 'A plausible explanation is that ...'"}, {"t": "Explaining unexpected results", "b": "Unexpected or negative results are normal, and they are often the most interesting part of a study. Do not hide them, and do not apologise for them. Examiners respect a candid, thoughtful explanation far more than silence.\n\nA useful approach:\n• State the result plainly: 'Contrary to our hypothesis, training did not improve adherence.'\n• Consider methodological explanations: sample size and statistical power, measurement problems, timing, sampling bias, or a change in conditions during the study.\n• Consider substantive explanations: perhaps the theory does not hold in this context, or another factor is at work.\n• Compare with any studies that also reported unexpected results.\n• Say what further work would distinguish between the explanations.\n\nBe careful with non-significant results. A non-significant test does not prove there is no effect; it means your study did not detect one. If your confidence interval is wide, say the study may have been too small to detect a meaningful difference. If it is narrow and centred near zero, you can more confidently say any effect is likely small.\n\nPattern: 'One explanation for this unexpected result may be ... . Alternatively, ... . Distinguishing between these explanations would require ... .'"}, {"t": "Writing limitations honestly and usefully", "b": "Every study has limitations. Stating them shows you understand your design, and it protects you from reviewers raising them first. The skill is to be honest without undermining your whole study.\n\nA strong limitation statement has three parts:\n• What the limitation is (e.g. a cross-sectional design, a single site, self-reported data).\n• How it might affect the results or their interpretation (e.g. it prevents conclusions about cause and effect; responses may overstate good practice).\n• What you did to reduce it, or why the findings remain useful (e.g. you triangulated with records; the findings are consistent with other settings).\n\nAvoid two extremes. One is a generic list ('small sample, limited time, limited funds') with no consequences explained. The other is an apology that suggests the findings are worthless.\n\nFocus on limitations that matter for your conclusions. Lack of funding or time is not itself a limitation that readers care about; its consequence is, such as a shorter follow-up period.\n\nPattern: 'Because data were collected at one point in time, the study cannot establish whether ... caused ... . However, the association is consistent with longitudinal findings from ...'\n\nLimitations then lead naturally into future research."}, {"t": "Implications and future research", "b": "Implications answer 'so what?' for different audiences. Be specific about who should do or think what differently.\n\n• Theory: does the study support, extend or challenge a model or framework? 'The findings suggest that the technology acceptance model may need to include ... in low-connectivity settings.'\n• Practice: what might practitioners (teachers, engineers, clinicians, farmers, managers) do differently? 'Extension officers could schedule visits to coincide with ...'\n• Policy: what might decision-makers consider? Only make policy claims your evidence can support.\n\nTie each implication to a finding. An implication with no link to your results is an opinion.\n\nFuture research should follow directly from your findings and limitations, not be a generic call for 'more research'. Weak: 'More research is needed on this topic.' Strong: 'A longitudinal study following the same households through two cropping seasons would show whether the association between forecast use and yield persists in drought years.'\n\nGood future research suggestions name a question, a design or a context. They also show examiners you can see where your work fits in a longer research programme, which matters at PhD level.\n\nPatterns: 'These findings have implications for ...'; 'Future work could test whether ...'; 'It would be valuable to examine ...'."}, {"t": "Conclusions versus discussion, and recommendations", "b": "The Discussion explores and argues. The Conclusion closes. They overlap, but they are not the same.\n\nA Conclusion usually:\n• answers the research question or objectives directly and briefly\n• states the main contribution in one or two sentences\n• may summarise key implications\n• ends with a forward-looking sentence.\n\nIt should not introduce new data, new citations (in most fields), or a full repeat of the discussion. In a journal article it may be one short paragraph; in a thesis it is a full chapter that often answers each objective in turn, then sets out contributions, limitations, recommendations and future work.\n\nRecommendations are specific actions for named audiences, drawn from your findings. They are expected in many applied theses, especially in Nigeria, Ghana, Kenya, India and Pakistan, and in reports for government or industry. They are less common in journal articles, where 'implications' is the usual heading.\n\nA good recommendation says who, what and why: 'District health management teams should include follow-up calls in community health worker schedules, since patients contacted within two weeks were more likely to return.' Avoid recommendations that do not come from your data, however sensible they sound. An examiner will ask, 'Where in your results does this come from?'"}, {"t": "Avoiding overclaiming", "b": "Overclaiming means saying more than your evidence allows. It is one of the most common reasons reviewers reject or criticise papers.\n\nTypical forms:\n• Cause from correlation: 'Social media use causes poor grades' from a cross-sectional survey. Say 'was associated with' instead.\n• Overgeneralisation: 'Nigerian farmers prefer...' from 60 farmers in one district. Say 'Farmers in this study...' or 'in the study area...'.\n• Proof language: 'This proves...', 'clearly demonstrates', 'confirms beyond doubt'. A single study rarely proves anything. Use 'supports', 'indicates', 'is consistent with'.\n• First claims: 'This is the first study to...' unless you have searched thoroughly.\n• Inflated importance: 'This will revolutionise...', 'a paradigm shift'.\n\nA simple test: for each claim, ask what design, sample and measure produced it, and whether a sceptical expert would accept the claim from that evidence. Cross-sectional designs support association. Experiments support stronger causal claims within their conditions. Qualitative studies support understanding of experiences and processes in a context, not population percentages.\n\nUnderclaiming is a problem too. If your evidence is strong, say so clearly. The goal is calibration: claims that match your evidence."}, {"t": "Hedging: language for appropriate caution", "b": "Hedging means adjusting how certain a statement sounds. Good hedging is not weakness; it is accuracy. It tells readers how confident you are, and it is a key feature of expert academic English.\n\nTools for hedging (examples written for this unit):\n• Modal verbs: may, might, could. 'Lower temperatures may slow granule formation.'\n• Tentative verbs: suggest, indicate, appear, seem, tend to. 'The results suggest that...'\n• Adverbs: possibly, probably, likely, generally, largely. 'This is likely due to...'\n• Limiting the scope: in this sample, under these conditions, in most cases, some participants.\n• Introductory phrases: 'One possible explanation is...', 'It is possible that...'.\n\nMatch the hedge to the evidence. Strong evidence: 'The results show...'. Moderate: 'The results indicate...'. Weak or speculative: 'It is possible that...'.\n\nDo not over-hedge. 'It might possibly perhaps be suggested that this could indicate...' sounds unsure of everything and hides your point. One hedge per claim is usually enough.\n\nDo not hedge facts. 'The sample may have included 120 participants' is wrong; you know how many there were. Hedge interpretations and generalisations, not your own data.\n\nConventions differ: some fields and cultures prefer more direct claims. Read recent discussions in your field to calibrate."}], "examples": [{"label": "From repeating results to interpreting them", "weak": "The results showed that 62% of respondents used improved seed. Also, 48% used fertiliser. Use of improved seed was higher among farmers with extension contact.", "strong": "Improved seed adoption (62%) was higher than reported in an earlier survey of the same region (Author, year), and it was concentrated among farmers with extension contact. This pattern suggests that extension visits remain an important channel for new varieties, consistent with findings from Ethiopia and Malawi (Author, year; Author, year). It may also reflect better access to credit among these farmers, which this study did not measure.", "why": "The weak version simply repeats Results. The strong version interprets the main finding, compares it with earlier work, offers a hedged explanation and acknowledges an alternative it cannot rule out."}, {"label": "A limitation that is explained, not just listed", "weak": "Limitations: small sample size, time and money constraints, and respondents may not have been honest.", "strong": "The sample of 18 teachers from two schools limits how far the findings can be transferred to other contexts, particularly private schools with different resources. In addition, practices were self-reported, so teachers may have described their intended rather than actual use of assessment. Classroom observation in a subset of lessons partly addressed this, and observed practice was broadly consistent with interview accounts.", "why": "The strong version names each limitation, explains its likely effect on the conclusions, and says what was done to reduce it. Time and money are dropped because only their consequences matter to readers."}, {"label": "Calibrating a claim with hedging", "weak": "This study proves that mobile phone reminders cause better vaccination coverage in all of Kenya.", "strong": "In the two counties studied, children whose caregivers received SMS reminders were more likely to complete the vaccination schedule. Because this was a randomised trial, the difference is likely attributable to the reminders, although effects may differ where phone ownership or network coverage is lower.", "why": "The weak version overclaims both certainty ('proves') and scope ('all of Kenya'). The strong version matches the claim to the design: a trial supports a causal reading, but only within the study setting, with a hedge on generalisation."}], "checks": [{"q": "What should the first paragraph of a discussion usually do?", "o": ["Introduce new data not shown in Results", "Briefly restate the aim and present the most important finding", "List all the limitations", "Repeat the full literature review"], "a": 1, "why": "Opening with the aim and main finding orients the reader and puts your key message first. New data belong in Results, and limitations usually come later."}, {"q": "A cross-sectional survey finds that students who sleep less have lower grades. Which claim is appropriate?", "o": ["'Less sleep causes lower grades.'", "'This proves students must sleep more.'", "'Shorter sleep was associated with lower grades in this sample.'", "'All students everywhere will improve with more sleep.'"], "a": 2, "why": "A cross-sectional design supports association, not causation, and the claim is limited to the sample. The other options overclaim cause or scope."}, {"q": "Which is the most useful future research suggestion?", "o": ["'More research is needed on this topic.'", "'Future researchers should study this area more.'", "'Further studies are recommended.'", "'A study comparing granule stability at three temperatures over six months would show whether the instability observed at 12 °C persists.'"], "a": 3, "why": "It names a specific question, design and condition, and follows directly from a finding. The others are generic and could end any paper."}, {"q": "Which sentence is an example of over-hedging?", "o": ["'It might possibly be suggested that this could perhaps indicate a trend.'", "'The results suggest a seasonal trend.'", "'This trend may reflect rainfall variation.'", "'Yields rose by 20%.'"], "a": 0, "why": "It stacks four hedges on one weak claim, hiding the point. One well-chosen hedge is usually enough."}, {"q": "What is the main difference between a discussion and a conclusion?", "o": ["They are identical and can be swapped", "The conclusion presents new results", "The discussion interprets and argues in depth; the conclusion answers the question briefly and states the contribution", "Only the conclusion may cite literature"], "a": 2, "why": "The Discussion explores meaning, compares with literature and weighs limitations. The Conclusion closes the work concisely without new data or extended argument."}, {"q": "Your intervention showed no significant effect, with a wide confidence interval. What is the most accurate statement?", "o": ["'The intervention has no effect.'", "'The study may have been too small to detect a meaningful effect.'", "'The intervention is harmful.'", "'The result should be left out.'"], "a": 1, "why": "A non-significant result with a wide interval means the data are compatible with no effect and with a meaningful effect. It is inconclusive, not proof of no effect."}, {"q": "Which recommendation is best grounded?", "o": ["'Government should improve education generally.'", "'Everyone should care more about the environment.'", "'Universities should be free.'", "'Because clinics offering evening hours had higher follow-up rates, the county health department could pilot evening sessions in the remaining clinics.'"], "a": 3, "why": "It names an audience and an action and is linked to a specific finding. The others may be reasonable opinions but do not come from the study's results."}, {"q": "Which is the strongest way to write a limitation?", "o": ["'Limitation: time.'", "'This study is weak and should not be trusted.'", "'Data came from one hospital, so patient mix may differ elsewhere; however, the hospital serves both urban and rural catchments.'", "'There were many limitations.'"], "a": 2, "why": "It names the limitation, explains its effect on generalisation, and notes a mitigating factor, without dismissing the whole study."}, {"q": "In your Discussion, you find yourself citing ten new studies that never appeared in your literature review. What does this most likely signal?", "o": ["Your discussion may be drifting away from your own findings, or your review missed key studies", "This is ideal practice", "You should remove all citations from the discussion", "Your methods are wrong"], "a": 0, "why": "The Discussion normally returns to the key literature that framed the study. Many unrelated new sources suggest drift or a gap in the literature review."}, {"q": "Which of these should NOT be hedged?", "o": ["An explanation for an unexpected finding", "A generalisation to other countries", "The number of participants in your own study", "A suggested mechanism behind an association"], "a": 2, "why": "Facts about your own study are known and should be stated directly. Hedging belongs on interpretations, explanations and generalisations."}, {"q": "Your result contradicts a well-known earlier study. What is the best response in the discussion?", "o": ["Ignore the earlier study", "State the contrast and consider differences in setting, population or method that might explain it", "Say the earlier study was wrong", "Change your result to match"], "a": 1, "why": "Contradictions are valuable. Explaining possible reasons respectfully and specifically shows critical engagement and often points to useful future research."}, {"q": "Which sentence best states an implication for theory?", "o": ["'Our findings suggest that the model's assumption of reliable internet access does not hold for rural users, so the model may need an access variable in such settings.'", "'This study was interesting.'", "'Theory is important for research.'", "'Farmers should buy more phones.'"], "a": 0, "why": "It links a finding to a specific assumption in a theory and suggests how the theory might be refined. The last option is a practical recommendation, not a theoretical implication, and is not clearly grounded."}], "checklist": ["Check that your first discussion paragraph restates the aim and gives your most important finding.", "For each key finding, write at least one sentence that interprets it and one that compares it with a named earlier study.", "Find every unexpected or non-significant result and make sure each has a candid explanation.", "Rewrite each limitation so it states what the limitation is, how it affects your conclusions and what reduces its impact.", "Search for 'prove', 'cause', 'clearly', 'first study' and 'all' and check that each claim matches your design and sample.", "Make every implication, recommendation and future-research suggestion point back to a specific finding.", "Read your conclusion alone and confirm it answers each research question without new data."], "practice": "Choose your single most important finding and write one discussion paragraph about it in five sentences: state it, interpret it, compare it with one named study, give a hedged explanation, and state one implication. Then write a one-sentence limitation linked to that finding.", "reading": [{"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "Read the unit on constructing the research paper that covers discussion sections, and the material on qualifying claims. It sets out a move structure for discussions and teaches hedging through practical tasks. A 4th edition is announced for 2027."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "Read the chapter on the discussion and conclusion. It models the stages of a discussion and supplies vocabulary for comparing, explaining and limiting claims."}, {"book": "Gastel, B. and Day, R.A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Read the chapter on writing the discussion for concise advice on interpreting results, relating them to other work and avoiding overstatement."}], "links": [{"t": "Manchester Academic Phrasebank: Discussing findings", "u": "https://www.phrasebank.manchester.ac.uk/discussing-findings/"}, {"t": "Manchester Academic Phrasebank: Writing conclusions", "u": "https://www.phrasebank.manchester.ac.uk/writing-conclusions/"}, {"t": "UNC Writing Center: Hedging in data commentary", "u": "https://writingcenter.unc.edu/writing-data-commentary/"}, {"t": "Chalmers Writing Guide: Discussion (moves and hedging table)", "u": "https://writing.chalmers.se/discussion"}]}, {"id": "ethics", "title": "Research ethics, data and positionality", "sub": "Protect people, data and truth", "goals": ["Explain the core ethical principles and how they shape consent, confidentiality and the right to withdraw", "Prepare an ethics application that a review board can approve, including local permissions for research in your home country", "Draft a data management plan that keeps data secure and, where possible, findable and reusable", "Write an honest positionality statement and recognise the forms of research misconduct"], "lessons": [{"t": "Why ethics comes first", "b": "Research ethics is the set of principles that protects the people, communities, animals and environments your research touches. It also protects the trust that society places in research. Ethics is not a form you fill in at the end. It shapes your question, your sample, your methods and how you report.\n\nMost ethics frameworks rest on three ideas. The US Belmont Report (1979) calls them respect for persons, beneficence and justice. Canada's TCPS 2 uses respect for persons, concern for welfare and justice. The words differ, but the meaning is close:\n\n• Respect: people decide for themselves whether to take part, based on honest information.\n• Beneficence (doing good) and non-maleficence (avoiding harm): the likely benefits must outweigh the risks, and you reduce risks wherever you can.\n• Justice: the burdens and benefits of research are shared fairly. You do not recruit poor or powerless groups simply because they are easy to reach.\n\nThese principles apply in every field. An engineer testing a water filter in a village, a nurse interviewing patients and a business student surveying staff all face the same basic questions: Who could be harmed? Have they freely agreed? Who benefits?"}, {"t": "Informed consent and the right to withdraw", "b": "Informed consent means a person agrees to take part after they understand what the study involves. It has three parts: information, understanding and free choice.\n\nA good participant information sheet explains, in plain language: the purpose of the study; what the person will do and for how long; risks and benefits; how their data will be stored and used; that taking part is voluntary; and who to contact with questions or complaints.\n\nPractical points:\n• Write at the reading level of your participants, and translate into local languages where needed. Have the translation checked.\n• Where literacy is low, oral consent that is recorded or witnessed can be acceptable if your ethics board approves it.\n• Consent is ongoing. In a long study, check that people still agree.\n• Explain the right to withdraw: people can stop at any time without giving a reason and without penalty. Be honest about limits. Once data are anonymised and combined, removing one person's answers may be impossible, so state a withdrawal deadline.\n• Gatekeepers (a chief, head teacher or manager) can give access, but they cannot consent for individuals. Each person must still agree.\n\nAvoid pressure. Large payments, or a supervisor recruiting their own staff, can make \"yes\" less than free."}, {"t": "Confidentiality, anonymity and the law", "b": "These two words are often mixed up.\n\n• Anonymity means no one, not even you, can link the data to a person. An online survey that collects no names or IP addresses can be anonymous.\n• Confidentiality means you know who said what, but you promise not to reveal it. Interviews are usually confidential, not anonymous, because you met the person.\n\nProtect confidentiality by using pseudonyms (invented names or codes), removing identifying details, and storing the key that links codes to names separately from the data. Watch for deductive disclosure: in a small community, a quote such as \"as the only female engineer in the district office\" identifies the speaker even without a name. Combine or blur details when needed.\n\nConfidentiality has limits. If a participant reveals that a child is at risk, you may have a legal duty to report. Say this in the information sheet so no one is surprised.\n\nPersonal data are also controlled by law. Examples include the GDPR in the EU and UK, Canada's federal and provincial privacy laws, Kenya's Data Protection Act 2019, Nigeria's Data Protection Act 2023 and India's Digital Personal Data Protection Act 2023. Your university's data protection office can tell you which laws apply when data cross borders."}, {"t": "Getting ethics approval", "b": "Before you collect any data from people, you normally need approval from a research ethics committee. Names vary by country: an Institutional Review Board (IRB) in the USA, a Research Ethics Board (REB) in Canada, a Research Ethics Committee in the UK, and a Human Research Ethics Committee (HREC) in Australia.\n\nA typical application includes:\n• a short summary of the study and its aims;\n• how you will recruit participants and why this sample;\n• your data collection instruments (survey, interview guide);\n• the information sheet and consent form;\n• risks to participants and to you, and how you will reduce them;\n• data storage, retention and sharing plans.\n\nReviews are often graded by risk. An anonymous survey of adults on a non-sensitive topic may get a light or expedited review. Research with children, patients or sensitive topics usually goes to the full committee.\n\nThree rules students break:\n• Never start recruiting before approval. Approval cannot be given after the fact, and data collected without it may be unusable.\n• If your methods change, submit an amendment.\n• Not all research needs human ethics review, but many projects still need other approvals: animal ethics, biosafety for microbes or chemicals, field or sampling permits, or a declaration that no humans are involved. Ask your supervisor early."}, {"t": "Vulnerable groups and power", "b": "Some people face higher risk in research, or find it harder to refuse. Ethics boards look closely at studies involving:\n\n• children (you usually need a parent's consent and the child's own assent, meaning their agreement in age-appropriate words);\n• patients, especially in clinical settings where they may fear losing care;\n• prisoners, refugees and displaced people;\n• people with cognitive impairments;\n• people in poverty, for whom any payment may feel impossible to refuse;\n• your own students, employees or junior colleagues.\n\nThe last group matters for many readers of this unit. If you are a lecturer studying your own students, they may say yes because they fear your grades. Reduce this pressure: let a colleague recruit, collect data after grades are final, or make responses anonymous.\n\nVulnerability is about situation, not identity. A rural farmer is not automatically vulnerable, and a city professional can be vulnerable after a job loss. Avoid treating whole communities as helpless. Instead, ask what specific risks your study creates and for whom.\n\nCompensation should cover time and travel fairly without being so large that it overrides judgement. Local norms differ, so ask your ethics board and local partners what is appropriate."}, {"t": "Researching in your home country", "b": "Many international students return home for fieldwork. This brings real strengths, such as language, networks and cultural knowledge, but also extra ethical and legal steps.\n\nUsually you need approval from your host university and permission in the country where data are collected. Examples (check current rules, as they change):\n• Nigeria: the National Health Research Ethics Committee or a registered institutional committee for health research;\n• Kenya: a research licence from NACOSTI as well as ethics approval from an accredited committee;\n• Ghana: institutional review boards such as the Ghana Health Service Ethics Review Committee for health studies;\n• India: an institutional ethics committee, guided by ICMR national guidelines for biomedical and health research;\n• Pakistan: the National Bioethics Committee for many health studies.\n\nAlso think about:\n• community entry: permission from local leaders, school boards or company management;\n• sending samples or data abroad, which may need a material transfer or data-sharing agreement;\n• your own safety, and a plan if something goes wrong;\n• giving back: sharing results with participants and local institutions in a usable form.\n\nStart this process months before fieldwork. Local approvals can take longer than university approval, and some boards require the other approval first."}, {"t": "Data management plans and FAIR data", "b": "A data management plan (DMP) is a short document that explains how you will handle data from collection to long-term storage. Many funders and universities now require one. Tools such as DMPonline (UK) guide you through the questions.\n\nA good DMP answers:\n• What data will you create (survey responses, audio, lab measurements, images) and in what formats?\n• How will you name files and record versions?\n• Where will you store data, and how will you back it up? A common rule is three copies, on two types of media, with one off-site, using university-approved storage, not a personal USB stick.\n• Who can access the data, and how is personal information protected (encryption, password control)?\n• How long will you keep data, and how will you destroy them safely?\n• Will you share data, and where?\n\nSharing is increasingly expected. The FAIR principles say data should be Findable (with a persistent identifier and good description), Accessible (clear conditions for access), Interoperable (standard formats and vocabularies) and Reusable (clear licence and documentation). FAIR does not mean fully open. Sensitive interview data may be shared only in anonymised form, or under controlled access. Your consent form must match what you plan: you cannot share data later if participants were promised it would be destroyed."}, {"t": "Reflexivity and positionality", "b": "Reflexivity means thinking critically about how you, the researcher, shape the research. Positionality is where you stand in relation to the topic and the participants: your background, identity, beliefs, experiences and power.\n\nThis matters most in qualitative research, but no research is fully neutral. A Ghanaian midwife studying maternal care, a male researcher interviewing women traders, or an engineer from the company that built a dam will each see, ask and hear different things.\n\nAn insider shares something with participants (language, culture, profession). This can build trust and deepen understanding, but you may miss what seems \"normal\" to you, and participants may assume you already know things. An outsider may notice more, but may misread meaning. Most researchers are partly both.\n\nA positionality statement is a short, honest paragraph, usually in the methodology chapter. It should:\n• name the parts of your position that are relevant to this study, not your whole life story;\n• explain how they might influence access, data and interpretation;\n• say what you did about it, such as keeping a reflexive journal, member checking (asking participants to check your interpretation) or discussing codes with a colleague.\n\nUse \"I\" where your field allows it. Conventions vary: positionality statements are common in education, health and social science, and rarer in laboratory sciences."}, {"t": "Research integrity and misconduct", "b": "Research integrity means doing and reporting research honestly. Three serious forms of misconduct are recognised almost everywhere:\n\n• Fabrication: inventing data or results, for example filling in survey forms yourself when respondents did not return them.\n• Falsification: changing or leaving out data, methods or images so the record is not accurate, for example deleting outliers without reporting it, or editing a gel image.\n• Plagiarism: presenting another person's words, ideas or data as your own.\n\nThere are also questionable research practices that are less dramatic but still damaging: running many analyses and reporting only the significant one; changing your hypothesis after seeing results without saying so; hiding failed experiments; adding authors who did no work; or publishing the same study twice.\n\nProtect yourself with good habits:\n• Keep raw data unchanged and do analysis on copies.\n• Keep a lab notebook or research log with dates.\n• Record every decision about cleaning and excluding data.\n• Declare conflicts of interest and funding.\n• Follow your university and publisher rules on generative AI, and disclose its use where required.\n\nIf you see misconduct, seek confidential advice from your supervisor, graduate school or a research integrity office. Bodies such as COPE (for publication ethics) and UKRIO publish guidance."}], "examples": [{"label": "A consent statement for a farmer survey in rural Kenya", "weak": "By filling this form you agree to participate in this research. Your data will be used for research purposes. Thank you.", "strong": "This study asks how smallholder farmers in Machakos County choose maize seed. The interview takes about 30 minutes. Taking part is your choice. You may skip any question or stop at any time, and this will not affect any services you receive. Your name will not appear in any report. You can ask to remove your answers until 30 June 2027, after which they will be combined with others. Questions? Contact the researcher on [phone] or the ethics office on [email].", "why": "The strong version tells people what, how long, their rights, how privacy is protected and the realistic limit on withdrawal. It also separates the study from services, which reduces pressure to agree."}, {"label": "A positionality statement in an education study", "weak": "As a researcher I was completely objective and did not allow any bias to affect the study.", "strong": "I taught mathematics in a public secondary school in Lahore for six years, and two of the four case schools are in my former district. This helped me gain access and understand the curriculum pressures teachers described. It also meant some teachers saw me as a former colleague or an inspector. To reduce this, I stressed that I had no role in evaluation, kept a reflexive journal after each interview, and asked a colleague with no link to the district to code a sample of transcripts.", "why": "No researcher is fully objective. The strong version names the relevant parts of the researcher's position, explains how they cut both ways, and describes concrete steps taken."}, {"label": "Data storage in a methods section", "weak": "Data were saved on my laptop and will be kept safely.", "strong": "Audio files were transferred on the day of each interview to the university's encrypted cloud storage and deleted from the recorder. Transcripts were pseudonymised, and the key linking codes to names was stored in a separate password-protected folder accessible only to the researcher and supervisor. Anonymised transcripts will be kept for 10 years under university policy and deposited, with participants' consent, in the institutional repository under controlled access.", "why": "The strong version says where, how and for how long, and how identity is protected. It also matches sharing to consent, which reviewers check."}], "checks": [{"q": "A researcher interviews hospital managers and knows exactly who said what, but promises never to reveal names. This is best described as:", "o": ["Anonymity", "Confidentiality", "Informed consent", "Data sharing"], "a": 1, "why": "The researcher can link data to individuals but promises not to reveal them, so this is confidentiality. Anonymity would mean even the researcher cannot identify who said what."}, {"q": "Which practice best protects the right to withdraw in a study where survey data will be anonymised and pooled?", "o": ["Tell participants they can withdraw at any time, even after publication", "Do not mention withdrawal so that the data set stays complete", "Allow withdrawal only with the supervisor's approval", "State a clear deadline after which answers can no longer be removed"], "a": 3, "why": "Once anonymised data are pooled, one person's answers cannot be found. Being honest about a deadline respects the right to withdraw. Promising withdrawal at any time, even after publication, would be a promise you cannot keep."}, {"q": "A lecturer in Accra wants to survey her own final-year students about plagiarism. What is the main ethical concern?", "o": ["Students are too young to consent", "The topic is too simple for research", "Students may feel unable to refuse because she grades them", "Surveys cannot be used in education research"], "a": 2, "why": "The power relationship may make participation less than voluntary. She can reduce this by having a colleague recruit, making responses anonymous, or collecting data after grades are final."}, {"q": "A PhD student at a UK university plans health interviews in Nigeria. Which approval route is most likely needed?", "o": ["Approval from the UK university and from an appropriate Nigerian ethics committee", "Only the UK university's ethics approval", "Only Nigerian approval, because data are collected there", "No approval, because interviews are low risk"], "a": 0, "why": "International fieldwork usually needs approval from the host university and from the relevant body in the country of data collection. Low risk can mean a lighter review, not no review."}, {"q": "A student deletes three survey responses that weaken her result and does not mention it. This is:", "o": ["Fabrication", "Falsification", "Plagiarism", "Acceptable data cleaning"], "a": 1, "why": "Changing or omitting data so the record is inaccurate is falsification. Data cleaning is acceptable only when the rules are justified and reported."}, {"q": "Which statement about FAIR data is correct?", "o": ["FAIR means all data must be openly available to everyone", "FAIR applies only to genetic data", "FAIR replaces the need for informed consent", "FAIR data are findable, accessible, interoperable and reusable, which can include controlled access"], "a": 3, "why": "FAIR is about making data well described and usable. Sensitive data can still be FAIR under controlled access, provided consent allows sharing."}, {"q": "Which quote from a study of a small district office raises the biggest risk of deductive disclosure?", "o": ["\"As the only female engineer here, I am always asked to take notes\"", "\"Workloads have increased this year\"", "\"Meetings are often late\"", "\"Training budgets are limited\""], "a": 0, "why": "Even without a name, the detail 'the only female engineer here' can identify the speaker. Remove or blur such details."}, {"q": "Which of these is the best summary of a good positionality statement?", "o": ["A full life history of the researcher", "A claim that the researcher was neutral", "Relevant aspects of the researcher's position, their likely influence, and steps taken in response", "A list of the researcher's qualifications"], "a": 2, "why": "A positionality statement is selective and practical: what about you matters here, how it might shape the study, and what you did about it."}, {"q": "A student collected interview data in March and applied for ethics approval in May. What is the problem?", "o": ["None, as long as approval is granted", "Ethics approval must come before data collection; the data may be unusable", "Interviews never need approval", "The approval only needs to be mentioned in the appendix"], "a": 1, "why": "Approval cannot be given after the fact. Collecting data first is a serious breach and can make the data unusable in a thesis or paper."}, {"q": "Which is the most appropriate way to get consent from adults with limited literacy in a rural community?", "o": ["Ask the village head to sign for everyone", "Skip consent because the study is helpful", "Give a long English consent form and ask for a thumbprint", "Read the information aloud in the local language and record oral consent, as approved by the ethics board"], "a": 3, "why": "Consent must be individual and understood. Oral consent in the local language, approved in advance, respects both. A gatekeeper can grant access but cannot consent for others."}, {"q": "Which item is LEAST likely to belong in a data management plan?", "o": ["The detailed results you expect to find", "How files will be backed up", "How long data will be retained", "Who will have access to identifiable data"], "a": 0, "why": "A DMP covers how data are handled, stored, protected and shared. Expected results belong in the proposal, not the DMP."}, {"q": "An engineering student is testing a membrane filter in the lab with no human participants. Which statement is most accurate?", "o": ["No approvals of any kind are needed", "A full human ethics review is always required", "Human ethics review is not needed, but biosafety, chemical safety or a no-humans declaration may still be required", "Only the funder needs to approve"], "a": 2, "why": "Ethics is broader than human participants. Many universities require safety approvals or a declaration even for lab-only work."}], "checklist": ["Write down who could be harmed by your study, how, and what you will do to reduce each risk", "Draft a one-page participant information sheet in plain language, and plan translation if needed", "Find your university's ethics application form and deadlines, and list every local permission needed where you will collect data", "Decide where your data will be stored and backed up, and check this matches university policy", "Draft a short data management plan using DMPonline or your university's template", "Write a three-to-five-sentence positionality statement and discuss it with your supervisor", "Start a dated research log that records every decision about data collection, cleaning and analysis"], "practice": "Write a 150-word participant information paragraph for your own study. Include the purpose, what participants will do, how long it takes, how their identity is protected, and a realistic withdrawal deadline. Then underline any word that a non-specialist in your setting might not understand and replace it.", "reading": [{"book": "Israel, M. (2015) Research Ethics and Integrity for Social Scientists: Beyond Regulatory Compliance. 2nd edn. SAGE.", "why": "Read the chapters on informed consent and confidentiality, and the discussion of research across national contexts. It is especially useful when ethics rules from different countries seem to clash."}, {"book": "Clark, T., Foster, L., Sloan, L. and Bryman, A. (2021) Bryman's Social Research Methods. 6th edn. Oxford University Press.", "why": "The chapter on ethics and politics in social research gives a clear, balanced overview of harm, consent, privacy and deception, with many short cases."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "The early chapter on ethical considerations walks through ethical issues stage by stage, from choosing a problem to publishing. Its qualitative chapter also discusses researcher reflexivity."}], "links": [{"t": "The Belmont Report (US Office for Human Research Protections)", "u": "https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/index.html"}, {"t": "TCPS 2 (2022): Canada's policy on research involving humans", "u": "https://ethics.gc.ca/eng/policy-politique_tcps2-eptc2_2022.html"}, {"t": "GO FAIR: the FAIR data principles", "u": "https://www.go-fair.org/fair-principles/"}, {"t": "DMPonline: build a data management plan", "u": "https://dmponline.dcc.ac.uk/"}, {"t": "COPE: Committee on Publication Ethics", "u": "https://publicationethics.org/"}, {"t": "UK Research Integrity Office (UKRIO)", "u": "https://ukrio.org/"}]}, {"id": "framework", "title": "Theoretical and conceptual frameworks", "sub": "The lens and map of your study", "goals": ["Explain the difference between a theory, a theoretical framework and a conceptual framework", "Choose and justify a theory or framework that fits your research problem", "Draw a clear conceptual framework diagram with labelled concepts and relationships", "Trace the links from your framework to your research questions, methods and discussion"], "lessons": [{"t": "What a theory is", "b": "In research, a theory is an organised explanation of how and why something happens. It names key concepts (sometimes called constructs) and proposes relationships between them. A good theory lets you explain patterns and, often, predict what will happen under certain conditions.\n\nTheories work at different levels:\n• Grand or broad theories explain very wide areas of social or natural life (for example, structuration theory or general systems theory). They are hard to test directly.\n• Middle-range theories explain a specific type of behaviour or process and can be tested or applied in a study. Examples: the Theory of Planned Behaviour (how attitudes, social norms and perceived control shape intentions), Diffusion of Innovations (how new practices spread), the Health Belief Model, stakeholder theory, and institutional theory.\n• Models and frameworks in applied fields often organise factors without claiming a full causal explanation, such as the Sustainable Livelihoods Framework or the DPSIR (Drivers, Pressures, State, Impact, Response) framework in environmental studies.\n\nIn engineering and natural sciences, 'theory' may mean established physical or chemical principles (mass balance, reaction kinetics) or a mathematical model. In social and health sciences, it usually means a body of ideas about human behaviour, organisations or societies.\n\nWhatever your field, the question is the same: what existing explanation helps you make sense of your problem?"}, {"t": "What a theoretical framework is", "b": "A theoretical framework is the existing theory, or small set of theories, that you use as the lens for your study. You did not invent it; it comes from the literature and has been used and tested by others. Grant and Osanloo compare it to the blueprint of a house: it shapes the whole structure.\n\nA theoretical framework helps you:\n• Decide which concepts matter and which to leave out\n• Define those concepts using established meanings\n• Formulate research questions or hypotheses\n• Choose what data to collect\n• Interpret findings and connect them to wider knowledge\n\nFor example, a study of why smallholder farmers in Uttar Pradesh do or do not adopt solar irrigation pumps could use Diffusion of Innovations. That theory points the researcher towards characteristics of the innovation (relative advantage, compatibility, complexity), communication channels and social systems. Those ideas then guide interview questions and coding.\n\nIn quantitative research, the theoretical framework is usually chosen before data collection and used deductively to generate hypotheses. In qualitative research, theory may be used more loosely as a 'sensitising' lens, or may be built from the data, as in grounded theory.\n\nNot every study needs a named grand theory, but every study needs a clear account of the ideas that shape it."}, {"t": "What a conceptual framework is", "b": "A conceptual framework is your own structured account of the key concepts in your study and how you think they relate. It is often presented as a diagram plus a written explanation. Maxwell puts it as your current understanding of what is going on in the thing you are studying.\n\nA conceptual framework typically draws on:\n• One or more theories\n• Findings from the empirical literature\n• Knowledge of the context (policy, local conditions)\n• Your own experience and assumptions, stated openly\n\nRavitch and Riggan go further and argue that the conceptual framework is the argument for why your study matters and why your methods are rigorous. In that view, it is not only a diagram; it ties together your topic, questions, design and analysis.\n\nExample: a researcher studying maternal health service use in rural Ghana might combine the Andersen model of health service use with literature on distance, cost and trust in clinics, and with knowledge of the national health insurance scheme. The conceptual framework would show predisposing factors (age, education), enabling factors (insurance, distance) and need factors (pregnancy complications) influencing service use, with community norms as a contextual influence.\n\nBecause it is your own construction, a conceptual framework is specific to your study. Two researchers using the same theory might draw quite different conceptual frameworks."}, {"t": "Theoretical versus conceptual: the difference and the overlap", "b": "In simple terms:\n• Theoretical framework: borrowed. An established theory used as a lens. Broad, tested, recognisable to other scholars.\n• Conceptual framework: built. Your own map of the concepts and relationships in your specific study. Narrower, specific to your context, and may combine several theories with empirical findings.\n\nA useful image from Grant and Osanloo: the theoretical framework is like the architect's elevation drawing, and the conceptual framework is like the floor plan for this particular house.\n\nHowever, be aware that usage is not consistent. Some textbooks treat the terms as near-synonyms. Some departments ask for one, some for both, and some use 'theoretical framework' to mean what others call 'conceptual framework'. In engineering and applied sciences, the same function may be served by a 'modelling framework' or simply a clear set of assumptions and governing equations.\n\nPractical advice:\n• Check your programme handbook and what recent successful theses in your department did\n• Ask your supervisor directly: 'Do you expect a named theory, a conceptual framework diagram, or both?'\n• Whatever label you use, define it in one sentence in your own text so the examiner knows what you mean\n\nThe label matters less than the function: showing clearly which ideas shape your study and how."}, {"t": "Choosing a suitable theory or framework", "b": "Students often choose a theory because a supervisor mentioned it, or because it appeared in the first article they read. A better approach is to compare a few candidates against clear criteria.\n\nHow to find candidates:\n• Note which theories are used in the ten to fifteen most relevant studies on your topic\n• Check review articles, which often summarise the main theoretical approaches in a field\n• Look at handbooks or encyclopedias of theory in your discipline\n\nCriteria for choosing:\n• Fit: does it explain the kind of phenomenon in your research question (behaviour, adoption, institutional change, a physical process)?\n• Level: does it work at the right level (individual, household, organisation, nation)?\n• Explanatory power: does it help you see something you would otherwise miss?\n• Use in the field: has it been applied successfully in similar studies or contexts, including low- and middle-income settings?\n• Operationalisation: can its concepts be turned into things you can observe or measure?\n• Known limitations: what does it ignore? For example, some behaviour-change models give little attention to structural constraints such as poverty or infrastructure.\n\nIt is acceptable to combine two complementary theories, but explain why each is needed and how they fit together. Avoid stacking four or five theories for decoration; examiners notice when theories are named in Chapter 2 and never used again."}, {"t": "Justifying your choice in writing", "b": "Examiners expect you to explain why you chose your framework, not just to name it. A justification usually covers four things:\n\n1. What the theory says, briefly, in your own words, with its key concepts defined.\n2. Why it fits your problem and context.\n3. Why you preferred it to obvious alternatives.\n4. Its limitations and how you will deal with them.\n\nSentence patterns you can adapt:\n• 'This study draws on X theory, which explains... through three concepts: A, B and C.'\n• 'X theory is appropriate here because it focuses on..., which is central to the research question.'\n• 'X has been used to study... in comparable settings, including...'\n• 'Y theory was also considered but was not adopted because it...'\n• 'A limitation of X is that it gives little attention to... To address this, the study also considers...'\n\nA short example for an engineering-management thesis: 'This study draws on the Technology Acceptance Model, which explains adoption through perceived usefulness and perceived ease of use. The model suits this research because it focuses on individual users' decisions, and the study asks why site engineers do or do not use a digital inspection tool. The model has limited attention to organisational factors, so the study also examines management support.'\n\nThat is four sentences, and it answers all four questions."}, {"t": "Drawing a conceptual framework diagram", "b": "A diagram makes your framework visible at a glance. It is common in proposals and theses in social science, health, education, business and environmental studies.\n\nBasic conventions:\n• Boxes or ovals represent concepts or variables. Use short, precise labels that match the terms in your text.\n• Arrows represent proposed relationships, usually influence or cause. A one-way arrow means 'A influences B'; a two-way arrow means mutual influence. Label arrows with + or - if you expect a direction.\n• Group related concepts (for example, all 'enabling factors') in a larger box.\n• Show moderators (factors that change the strength of a relationship) with an arrow pointing at another arrow, and mediators (factors that carry an effect) as a box between two others.\n• Show context as an outer frame or background box.\n\nKeep it simple: usually between about five and twelve concepts. If you need a page of tiny boxes, the framework is not yet clear in your mind.\n\nCommon mistakes:\n• Decorative diagrams with no arrows, just a cloud of words\n• Arrows pointing in every direction, so no relationship is claimed\n• Concepts in the diagram that never appear in the questions, methods or analysis\n• Copying a published diagram without adapting it or citing it\n\nAlways explain the diagram in the text. A figure without a paragraph explaining it is incomplete."}, {"t": "From framework to research questions and methods", "b": "A framework is only useful if it shapes the rest of the study. Examiners often trace a line from framework to questions to methods to analysis and check that it is unbroken.\n\nFramework to questions: each main concept or relationship in your framework should connect to a research question or hypothesis. If your diagram shows that perceived cost influences adoption, there should be a question or hypothesis about cost and adoption.\n\nQuestions to methods: the concepts must be operationalised, which means turned into things you can observe or measure.\n• In quantitative studies, each construct becomes one or more variables, measured with validated scales or defined indicators. Your statistical model often mirrors your diagram.\n• In qualitative studies, the concepts guide interview topics, observation focus and initial coding categories. Remain open to themes that the framework did not predict.\n• In engineering or environmental modelling, the framework defines system boundaries, inputs, outputs and the processes linking them.\n\nA simple alignment table is a powerful check
