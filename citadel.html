. Make columns for: concept, research question, data source or instrument, and analysis method. Any concept without a row, or any row with an empty cell, is a gap to fix.\n\nAlso check direction: deductive studies start from the theory and test it; inductive studies use the framework loosely and may revise it from the data."}, {"t": "Returning to your framework in the discussion", "b": "Many theses introduce a framework in Chapter 2 and then forget it. Strong discussions return to it explicitly, because this is where your contribution to theory becomes visible.\n\nIn the discussion, ask:\n• Which relationships in the framework did your findings support?\n• Which were not supported, or were weaker than expected? Why might that be?\n• Did anything important emerge that the framework did not include?\n• What does this mean for the theory? Does it need extending, adapting to your context, or limiting in scope?\n\nThree common types of theoretical contribution:\n• Confirming: showing the theory holds in a new context, such as a population or country where it has not been tested\n• Extending: adding a factor the theory missed, for example showing that mobile-network coverage shapes technology adoption in rural Kenya in ways the original model did not anticipate\n• Challenging: showing a core assumption does not hold under certain conditions\n\nUseful patterns:\n• 'Consistent with X theory, the findings show that...'\n• 'Contrary to what X would predict, ...'\n• 'These findings suggest that X should be extended to include...'\n\nFinally, consider presenting a revised conceptual framework diagram at the end of the discussion or conclusion. It shows clearly how your study has changed understanding."}], "examples": [{"label": "Naming a theory versus justifying it", "weak": "This study uses the Theory of Planned Behaviour. This theory was developed by Ajzen and is very popular. It is used in many studies.", "strong": "This study draws on the Theory of Planned Behaviour, which explains intentions through attitudes, subjective norms and perceived behavioural control. It suits this research because the study asks why university students in Accra intend, or do not intend, to separate recyclable waste, which is a voluntary individual behaviour. The theory has been widely applied to recycling behaviour, but it gives limited attention to infrastructure; this study therefore also examines access to collection points.", "why": "The weak version only names the theory and says it is popular. The strong version defines its concepts, shows why it fits the research question, cites its record in similar studies and acknowledges a limitation with a plan to address it."}, {"label": "From a word cloud to a usable conceptual framework", "weak": "Diagram description: a circle labelled 'Climate change' surrounded by unconnected boxes: 'Farmers', 'Government', 'Rainfall', 'Markets', 'Technology', 'Poverty', 'Food security'.", "strong": "Diagram description: 'Rainfall variability' points to 'Crop yield (-)'. 'Access to improved seed' and 'Access to extension services' point to 'Adoption of adaptation practices', which points to 'Crop yield (+)'. 'Crop yield' points to 'Household food security'. A dashed arrow from 'Household income' points at the adoption-to-yield arrow, showing it as a moderator. The whole diagram sits within a box labelled 'Policy context: national input subsidy programme'.", "why": "The weak diagram lists topics without claiming any relationship. The strong one uses specific concepts, directional arrows, a moderator and a context frame, so each arrow can become a research question or hypothesis."}, {"label": "Linking the framework to the discussion", "weak": "The results show that most teachers did not use the new digital platform. This is a problem and more training is needed.", "strong": "Consistent with the Technology Acceptance Model, teachers who found the platform useful were more likely to use it. Contrary to the model's emphasis on ease of use, however, unreliable electricity was the most frequently cited barrier. This suggests that, in settings with unstable infrastructure, the model should be extended to include facilitating conditions such as power and connectivity.", "why": "The strong version returns to the framework, states which relationships were supported and which were not, and proposes a specific extension of the theory. This is how a study shows its theoretical contribution."}], "checks": [{"q": "Which statement best describes a conceptual framework?", "o": ["A list of all the theories in your field", "The researcher's own structured map of the key concepts in the study and how they are expected to relate", "The reference list of a thesis", "A summary of the methods section"], "a": 1, "why": "A conceptual framework is built by the researcher for a specific study, drawing on theory, literature and context. It is not simply a list of theories."}, {"q": "What is the main difference between a theoretical framework and a conceptual framework, as commonly explained?", "o": ["A theoretical framework is used only in qualitative research", "A conceptual framework must always be quantitative", "A theoretical framework applies an established theory as a lens; a conceptual framework is the researcher's own map for this particular study", "There is no difference in any textbook"], "a": 2, "why": "The usual distinction is borrowed theory versus built, study-specific map. Usage varies, but the difference in function is widely recognised."}, {"q": "A student studying why rural households adopt clean cookstoves needs a theory. Which is the most suitable starting point?", "o": ["Diffusion of Innovations, which explains how new practices spread through social systems", "A theory of planetary motion", "A general theory of literary criticism", "No theory, because adoption cannot be studied"], "a": 0, "why": "Diffusion of Innovations was built to explain adoption of new technologies and practices, so it fits the research problem."}, {"q": "In a conceptual framework diagram, what does an arrow from 'Training' to 'Job performance' normally mean?", "o": ["The two concepts are unrelated", "Job performance causes training", "The researcher has not yet decided", "Training is proposed to influence job performance"], "a": 3, "why": "A one-way arrow represents a proposed influence from the first concept to the second. Two-way arrows show mutual influence."}, {"q": "Which is the strongest justification for choosing a theory?", "o": ["It is the most famous theory in the field", "My supervisor likes it", "Its concepts match the research question, it has been applied in similar contexts, and its limitations can be addressed", "It has the most citations on Google Scholar"], "a": 2, "why": "Fit with the problem, a track record in comparable settings and awareness of limitations are the criteria examiners look for. Popularity alone is not a justification."}, {"q": "Your conceptual framework includes 'social trust', but your survey has no questions about trust. What is the problem?", "o": ["The concept has not been operationalised, so the framework and methods are misaligned", "None; frameworks do not need to link to methods", "The survey is too long", "Trust should be removed from all research"], "a": 0, "why": "Every key concept in the framework should be measured or explored. An alignment table linking concepts to questions and instruments helps catch this gap."}, {"q": "What is a moderator in a conceptual framework?", "o": ["The main outcome variable", "A factor that changes the strength or direction of the relationship between two other concepts", "The person who supervises the study", "A concept that has no effect"], "a": 1, "why": "A moderator affects how strongly one concept influences another. In diagrams it is often shown as an arrow pointing at another arrow."}, {"q": "In a qualitative study, how is a theoretical framework most commonly used?", "o": ["To prove a hypothesis statistically", "It is never used", "To set a fixed questionnaire that cannot change", "As a sensitising lens that guides questions and early coding while staying open to unexpected themes"], "a": 3, "why": "Qualitative researchers often use theory flexibly to focus attention, and may revise or extend it as themes emerge from the data."}, {"q": "Which discussion sentence best shows a theoretical contribution?", "o": ["The results were interesting.", "Further research is needed.", "Contrary to the Health Belief Model, perceived severity did not predict screening uptake, which suggests that cost barriers outweigh risk perception in this setting.", "Many people did not attend screening."], "a": 2, "why": "It names the theory, states which relationship was not supported and proposes an explanation that refines the theory for a specific context."}, {"q": "Your department's handbook uses 'theoretical framework' where your textbook says 'conceptual framework'. What should you do?", "o": ["Follow your department's usage, confirm expectations with your supervisor, and define the term in your text", "Ignore the handbook and follow the textbook", "Avoid using either term", "Include three different frameworks to be safe"], "a": 0, "why": "Terminology varies across fields and institutions. Local expectations and a clear definition in your own text avoid confusion for examiners."}, {"q": "A thesis names five theories in the literature review chapter, but the analysis and discussion mention none of them. What is the main weakness?", "o": ["Five theories is too few", "The theories are decorative; they do not shape the questions, analysis or interpretation", "Theories should only appear in the conclusion", "The theories should have been placed in the appendix"], "a": 1, "why": "A framework must be used throughout the study. Examiners notice when theories are named but never applied."}, {"q": "Which diagram is most likely to be useful in a proposal?", "o": ["Twenty-five boxes with arrows connecting every box to every other box", "A word cloud of key terms with no arrows", "A copied diagram from a published paper, without citation", "Seven clearly labelled concepts with directional arrows, a context frame and an explanation in the text"], "a": 3, "why": "A focused diagram that claims specific relationships, and is explained in the text, can be turned into research questions and tested. The others claim nothing or too much, or raise integrity issues."}], "checklist": ["List the theories used in the ten most relevant studies on your topic and note what each explains", "Compare two or three candidate theories against fit, level, use in similar contexts and limitations", "Write a four-sentence justification: what the theory says, why it fits, why not the alternative, and its limitation", "Draw your conceptual framework with no more than about twelve labelled concepts and directional arrows", "Build an alignment table linking each concept to a research question, a data source and an analysis method", "Ask your supervisor which term and format your department expects, and define it in your text", "Plan one paragraph in your discussion that states which framework relationships your findings support, challenge or extend"], "practice": "Sketch your conceptual framework by hand with boxes and labelled arrows, then write one paragraph explaining it. For each arrow, write the research question or hypothesis it corresponds to; any arrow without a question, or question without an arrow, shows where to revise.", "reading": [{"book": "Ravitch, S.M. and Riggan, M. (2016) Reason & Rigor: How Conceptual Frameworks Guide Research. 2nd edn. SAGE.", "why": "A whole book on conceptual frameworks; the opening chapters explain what they are and why they matter, and later chapters show how they guide fieldwork, analysis and presentation of findings."}, {"book": "Maxwell, J.A. (2012) Qualitative Research Design: An Interactive Approach. 3rd edn. SAGE.", "why": "The chapter on conceptual framework ('what do you think is going on?') explains how to build one from theory, prior research and experience, and introduces concept maps."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "The chapter on the use of theory shows how theory is positioned differently in quantitative, qualitative and mixed methods studies, with model passages."}, {"book": "Clark, T., Foster, L., Sloan, L. and Bryman, A. (2021) Bryman's Social Research Methods. 6th edn. Oxford University Press.", "why": "The early chapter on the nature of social research explains deductive and inductive relationships between theory and research, which helps you decide how your framework will be used."}], "links": [{"t": "Theoretical Framework (USC Libraries research guide)", "u": "https://libguides.usc.edu/writingguide/theoreticalframework"}, {"t": "Grant and Osanloo (2014): Understanding, selecting, and integrating a theoretical framework in dissertation research (full text, PDF)", "u": "https://dc.swosu.edu/cgi/viewcontent.cgi?article=1096&context=aij"}, {"t": "Grant and Osanloo (2014) article page, Administrative Issues Journal", "u": "https://dc.swosu.edu/aij/vol4/iss2/4"}, {"t": "Academic Phrasebank: Defining terms (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/writing-definitions/"}]}, {"id": "genres", "title": "Academic genres and assignment types", "sub": "Know what each task expects", "goals": ["Identify the purpose, audience and typical structure of the main academic genres", "Decode an assignment brief by analysing its task words, scope and limits", "Use a marking rubric to plan, draft and self-assess before submission", "Choose the right structure for essays, reports, reviews, reflections, proposals, theses, articles and abstracts"], "lessons": [{"t": "What a genre is and why it matters", "b": "A genre is a type of text with a recognised purpose, audience and set of conventions. A lab report, a reflective journal and a literature review are all 'academic writing', but they are judged by different rules. Writing an excellent essay when the task asked for a report can cost you a full grade.\n\nEvery genre answers three questions:\n• Purpose: to argue, to inform, to evaluate, to reflect, to propose, or to report new findings?\n• Audience: a tutor, an expert examiner, a manager, a funder, journal reviewers, the public?\n• Form: continuous prose or headed sections? First person or impersonal? Fixed sections such as IMRaD (Introduction, Methods, Results and Discussion)?\n\nResearch on a large corpus of British university assignments, reported by Nesi and Gardner, found that student writing falls into many distinct 'genre families' (essays, critiques, case studies, explanations, design specifications, proposals and more), and that what counts as good writing differs across disciplines.\n\nMany international students arrive having written mainly exam answers or long descriptive essays. Those skills are a foundation, but postgraduate tasks usually demand an explicit argument, critical evaluation of sources and a clear structure that matches the genre. The fastest way to learn a genre is to study two or three high-scoring examples, which many departments and university learning centres publish."}, {"t": "Reading the task: task words and scope", "b": "Before you read a single source, analyse the assignment brief. Underline three things.\n\n1. Task words (the instruction verbs). They tell you what to do with the topic:\n• Describe or outline: give the main features, with little evaluation\n• Explain: say how or why something happens\n• Analyse: break into parts and show how they relate\n• Compare and contrast: identify similarities and differences, and say why they matter\n• Discuss: consider different views and reach a reasoned position\n• Evaluate or assess: judge value, strength or effectiveness using criteria and evidence\n• Critically evaluate or critically discuss: as above, but with explicit attention to assumptions, limitations and quality of evidence\n• To what extent: give a measured answer (fully, partly, hardly) with justification\n\n2. Topic words: the subject and its limits (which country, period, sector or population?).\n\n3. Instructions: word count, format, number and type of sources, referencing style, deadline, whether headings are allowed.\n\nRewrite the task in your own words in one sentence. If you cannot, ask your tutor. Most marks are lost not through poor English but through answering a different question from the one set: describing when asked to evaluate, or writing about Africa in general when the brief said one country."}, {"t": "Using the marking rubric", "b": "A marking rubric (or marking criteria, or grade descriptors) tells you exactly how your work will be judged. Treat it as a checklist, not as small print.\n\nTypical criteria include:\n• Relevance and response to the task\n• Knowledge and understanding of the subject\n• Use of evidence and quality of sources\n• Critical analysis and argument\n• Structure and organisation\n• Academic writing style and referencing\n\nRead the description for the top band, not just the pass band. The difference between a pass and a distinction is usually described in words such as 'critical', 'synthesis', 'original insight' and 'well-justified argument', not in words such as 'more references'.\n\nGrading systems vary. Many UK universities use percentages, and at Master's level 70 or above is commonly a distinction while 50 is often the pass mark. Canadian and US universities usually use letter grades, and Australian universities often use bands such as High Distinction. Check your own institution's scale, because a 65 can mean very different things in different systems.\n\nUse the rubric three times: when planning (what must be included), when drafting (am I meeting the top-band descriptors?), and before submission (grade yourself honestly against each criterion). Also read any feedback on previous work and look for repeated comments."}, {"t": "The academic essay", "b": "An essay presents and defends a position on a question, using evidence and reasoning. It is the most common assignment in the humanities and social sciences and appears in many professional programmes.\n\nTypical structure:\n• Introduction (about 10% of the word count): context, the specific question or problem, your thesis statement (your answer), and a brief outline of how the essay will proceed.\n• Body paragraphs: each develops one point that supports or qualifies the thesis, using evidence and analysis. Strong essays also address counter-arguments.\n• Conclusion (about 10%): restates the answer in light of the discussion, notes implications or limitations, and introduces no new evidence.\n\nEssays usually have no headings, though some departments allow them. They are written in continuous prose, not bullet points.\n\nWhat markers look for:\n• A clear, arguable thesis early, not only in the conclusion\n• An argument that develops logically rather than a list of topics\n• Critical engagement with sources: comparing them, questioning their methods or assumptions\n• Your own voice framing the evidence\n\nA common problem is the 'information dump' essay that shows wide reading but never answers the question. A useful test: could someone summarise your argument in two sentences after reading only your introduction and conclusion?"}, {"t": "Reports: technical, business and research", "b": "A report presents information and analysis to help a specific reader understand a situation or make a decision. Reports are common in engineering, sciences, business, health and environmental programmes.\n\nKey differences from essays:\n• Numbered headings and subheadings that let readers jump to the part they need\n• Tables, figures and sometimes bullet lists are expected\n• An executive summary or abstract at the start, so busy readers get the main findings and recommendations first\n• Often ends with recommendations, not just a conclusion\n\nCommon report structures:\n• Research or lab report: often IMRaD (Introduction, Methods, Results, Discussion), plus abstract, conclusion and references.\n• Business or consultancy report: executive summary, introduction and scope, analysis or findings, conclusions, recommendations, appendices.\n• Technical or design report: problem specification, design criteria, options considered, evaluation, selected design, recommendations.\n\nStyle tips:\n• Write the executive summary last, and make it stand alone\n• Put each finding and its evidence together; put interpretation in the discussion\n• Number every table and figure, give it a clear title and refer to it in the text\n• Make recommendations specific, feasible and linked to the findings\n\nAlways check the brief: some tutors set a specific template, and some 'reports' are really essays with headings."}, {"t": "Critical reviews and literature reviews", "b": "Both genres evaluate other people's work, but at different scales.\n\nA critical review (or article critique) evaluates one text, such as a journal article, book or policy. A typical structure is: introduction with full reference and your overall judgement; brief summary of the text's aims, methods and main claims (keep this short, perhaps a quarter of the word count); evaluation of strengths and weaknesses using clear criteria (relevance, method, evidence, logic, contribution); and a conclusion with your final assessment. 'Critical' does not mean negative; it means balanced, reasoned judgement.\n\nA literature review surveys and synthesises many sources on a topic to show what is known, how it is known, what is debated and what is missing. It can be a stand-alone assignment, a chapter of a thesis, or a section of an article or proposal. Good literature reviews are organised by themes, debates or methods, not by author one after another. Each paragraph should compare and connect sources, not summarise them in turn.\n\nWhat markers look for in both:\n• Your evaluation, not just summary\n• Clear criteria for judgement\n• Synthesis: showing patterns, agreements and contradictions\n• A conclusion that identifies implications or gaps\n\nThe weakest reviews read like an annotated bibliography in paragraph form: 'Smith (2018) found... Jones (2020) found... Ali (2021) found...'."}, {"t": "Reflective writing", "b": "Reflective writing asks you to examine your own experience, such as a placement, project, teaching session or group task, and show what you learned and how you will act differently. It is common in nursing, medicine, education, social work, engineering design and professional development modules.\n\nIt differs from other academic writing in two ways: you use 'I' throughout, and your own experience is legitimate evidence. But it is still academic. You must analyse the experience, connect it to theory or literature, and draw conclusions.\n\nCommon models give structure:\n• Gibbs' reflective cycle: Description, Feelings, Evaluation, Analysis, Conclusion, Action plan\n• 'What? So what? Now what?': what happened, why it matters, what you will do next\n\nA frequent weakness is too much description. A rough guide is to keep description short and spend most of the words on analysis and learning. Another is staying at the level of feelings ('I felt nervous') without asking why, or what the literature says about the situation.\n\nUseful patterns:\n• 'At the time, I interpreted this as... However, on reflection...'\n• 'This experience is consistent with X's argument that...'\n• 'In future, I will...'\n\nUse past tense for what happened, present for what you understand now, and future for your plans."}, {"t": "Research proposals, dissertations and theses", "b": "A research proposal argues that a study is worth doing and can be done. It is written for a supervisor, admissions panel, ethics committee or funder. Typical sections: title; background and problem statement; aim, objectives and research questions; brief literature review showing the gap; theoretical or conceptual framework; methodology and methods; ethical considerations; timeline; resources or budget; expected contribution; references. Proposals are judged on clarity of the question, feasibility and fit between question and method. Use future tense for planned work.\n\nA dissertation or thesis reports a completed, extended piece of independent research. Terms differ: in the UK a Master's 'dissertation' and a PhD 'thesis' are common usage, while in North America the terms are often reversed. A common structure is: abstract; introduction; literature review; methodology; results or findings; discussion; conclusion; references; appendices. Some fields use a 'thesis by publication', made of linked journal articles with framing chapters.\n\nExaminers look for:\n• A clear, focused research question\n• Command of the relevant literature\n• A justified and properly executed method\n• Findings that are analysed, not just reported\n• An honest account of limitations\n• A clearly stated contribution to knowledge (essential at doctoral level)\n\nRead two or three recent theses from your department to see local expectations."}, {"t": "Journal articles, abstracts and posters", "b": "A journal article reports research to expert peers and must pass peer review. In empirical fields it usually follows IMRaD. Articles are shorter and more focused than theses: one clear contribution, tightly argued. Each journal has author guidelines on length, structure, referencing and style; follow them exactly.\n\nAn abstract is a short summary, often 150 to 300 words, that stands alone. Readers, indexing databases and conference reviewers use it to decide whether to read further. A typical informative abstract covers, in order: background (one sentence), aim, methods, key results with numbers, and conclusion or implication. Some journals require structured abstracts with headings. Avoid citations, undefined abbreviations and vague phrases such as 'results will be discussed'.\n\nA research poster communicates a study visually at a conference, often in the few minutes a visitor spends in front of it. Good posters:\n• Have a short, informative title readable from a distance\n• Use more figures and fewer words than a paper\n• Follow a clear reading order, usually in columns\n• State the main finding prominently\n• Include contact details\n\nA useful conference sequence: abstract accepted, then poster or talk, then full paper. Each genre reuses the same research but changes its depth, length and emphasis for a different audience."}], "examples": [{"label": "Interpreting the task word correctly", "weak": "Task: 'Critically evaluate the effectiveness of community health workers in reducing child mortality in sub-Saharan Africa.' Student plan: 1. History of community health workers. 2. Their roles and training. 3. Countries that use them. 4. Conclusion.", "strong": "Plan: 1. Define 'effectiveness' and state criteria (mortality outcomes, coverage, cost). 2. Evidence that CHW programmes reduce child deaths, with study quality assessed. 3. Evidence of limits: attrition, supervision, supply shortages. 4. Weigh the evidence and state a qualified judgement. 5. Conclusion with implications.", "why": "The weak plan describes; the task asks for a judgement. The strong plan sets criteria, weighs evidence on both sides, considers the quality of studies and leads to a reasoned verdict, which is what 'critically evaluate' requires."}, {"label": "Reflective writing that goes beyond description", "weak": "During my placement I taught a Year 9 science class. The lesson was about photosynthesis. I was nervous and the students were noisy. I gave them a worksheet. Some finished it and some did not. Overall it was a good learning experience.", "strong": "When I taught photosynthesis to a Year 9 class, many students lost focus during the worksheet task. At the time I blamed the class's behaviour, but on reflection the task was pitched at a single level and gave faster students nothing further to do. This matches research on differentiated instruction, which links off-task behaviour to poorly matched task difficulty. In my next placement, I will plan an extension task for each activity and check understanding before setting independent work.", "why": "The weak version only describes and ends with a vague verdict. The strong version analyses the cause, revises an initial interpretation, connects to the literature and ends with a specific action plan."}, {"label": "An informative abstract", "weak": "This paper is about water treatment in Nigeria. Water is very important for health. We did some experiments with a new filter. The results are discussed and some recommendations are made.", "strong": "Many rural households in north-central Nigeria rely on untreated surface water. This study tested whether a low-cost ceramic filter made from local clay could reduce bacterial contamination to safe levels. Over eight weeks, 40 households used the filter, and E. coli counts in drinking water were measured weekly. Mean counts fell by 97%, and 85% of filtered samples met WHO guideline values. Locally produced ceramic filters may offer an affordable option for household water treatment in similar settings.", "why": "The strong abstract states the problem, aim, method, key numerical results and implication, so a reader can judge the study without the full paper. The weak version says only that something was done. (The data are invented for illustration.)"}], "checks": [{"q": "An assignment says 'Compare and contrast two approaches to flood management in Bangladesh.' Which plan best fits the task?", "o": ["Describe approach A fully, then approach B fully, with no comparison", "Explain why approach A is the best in the world", "Write a history of floods in Bangladesh", "Organise the essay around criteria such as cost, effectiveness and community impact, comparing both approaches under each"], "a": 3, "why": "Comparing point by point under shared criteria shows similarities and differences directly. Describing each in turn often never reaches an actual comparison."}, {"q": "Which task word most clearly requires you to reach a judgement about value or effectiveness?", "o": ["Outline", "Describe", "Evaluate", "Summarise"], "a": 2, "why": "'Evaluate' asks you to judge, using criteria and evidence. The other three ask mainly for description or condensation."}, {"q": "What is the main difference between a typical essay and a typical report?", "o": ["Reports use numbered headings, often include an executive summary and recommendations, and are designed for readers to navigate quickly", "Essays never use evidence", "Reports never contain argument or analysis", "Essays must always be shorter than reports"], "a": 0, "why": "Reports are structured for navigation and decision-making. Both genres use evidence and analysis, and length depends on the task."}, {"q": "A student's literature review reads: 'Okeke (2017) found X. Patel (2019) found Y. Kimani (2021) found Z.' What is the main weakness?", "o": ["It uses too few sources", "It summarises sources one by one instead of synthesising them around themes", "It uses the past tense", "It cites sources from different countries"], "a": 1, "why": "A literature review should compare and connect sources to show patterns and debates, not list them in turn."}, {"q": "In a reflective assignment based on Gibbs' cycle, where should most of your words go?", "o": ["Describing exactly what happened in great detail", "Listing your feelings", "Copying the theory you studied", "Evaluation, analysis and what you will do differently"], "a": 3, "why": "Reflection earns marks for analysis and learning. Description should be brief and only provide what the analysis needs."}, {"q": "Which element is most essential in a research proposal but not usually in a final journal article?", "o": ["A timeline and plan for work not yet done", "A reference list", "A research question", "A literature review"], "a": 0, "why": "A proposal must show the study is feasible, so it includes a timeline and often a budget. Articles report completed work."}, {"q": "Which sentence would be most out of place in an abstract?", "o": ["Yields increased by 22% under drip irrigation.", "This study compared drip and furrow irrigation on 60 smallholder plots.", "The results of this study will be discussed in detail below.", "Drip irrigation may improve water productivity in semi-arid settings."], "a": 2, "why": "An abstract should state the actual results, not promise that they will be discussed. The other sentences give method, result and implication."}, {"q": "How should you use a marking rubric?", "o": ["Read it only after receiving your grade", "Use it while planning, drafting and self-assessing, focusing on the top-band descriptors", "Ignore it, because tutors mark by impression", "Use it only to check the word count"], "a": 1, "why": "The rubric describes what earns marks. Using it at every stage, and aiming at the highest band, is one of the quickest ways to improve grades."}, {"q": "A tutor writes 'too descriptive' on your essay. What is the most likely fix?", "o": ["Add more background information", "Use more quotations", "Add analysis and evaluation: explain why the evidence matters, compare sources and state your position", "Use longer words"], "a": 2, "why": "'Too descriptive' means the essay reports information without analysing it. More background or quotations would make the problem worse."}, {"q": "What does 'critical' mean in 'critical review'?", "o": ["Pointing out only the weaknesses", "Rewriting the article in your own words", "Agreeing with the author's main argument", "Making a balanced, reasoned judgement of strengths and weaknesses using clear criteria"], "a": 3, "why": "Critical evaluation weighs both strengths and weaknesses. A review that only criticises can be as unbalanced as one that only praises."}, {"q": "Which is the best first step when you receive a new assignment brief?", "o": ["Underline the task words, topic limits and instructions, and rewrite the task in one sentence", "Start searching databases immediately", "Write the introduction", "Ask a classmate what they are writing"], "a": 0, "why": "Analysing the brief first prevents the most costly mistake: answering a different question. Searching without a clear task wastes time."}, {"q": "Your department lets you choose between a traditional thesis and a 'thesis by publication'. What does the second option usually involve?", "o": ["Publishing the thesis as a book before submission", "A set of linked journal articles with introductory and concluding chapters that connect them", "A thesis with no literature review", "Submitting only one published article"], "a": 1, "why": "A thesis by publication combines several papers with framing chapters that explain how they form a coherent contribution. Rules on number and status of papers vary by university."}], "checklist": ["Underline the task words, topic limits and instructions in your current assignment brief and rewrite the task in one sentence", "Find the marking rubric and copy the top-band descriptors into the first page of your draft as a reminder", "Find two high-scoring examples of the same genre from your department or a university learning centre and note their structure", "Check whether your genre expects headings, an executive summary, first person or a specific template", "Count the share of your words spent on description versus analysis and rebalance if description dominates", "Before submitting, grade yourself honestly against each rubric criterion and revise your weakest one"], "practice": "Take your next assignment brief or a past one. Write one sentence stating what the task asks you to do, list the genre's expected sections, and note which rubric criterion you think will be hardest for you and one action to address it.", "reading": [{"book": "Nesi, H. and Gardner, S. (2012) Genres across the Disciplines: Student Writing in Higher Education. Cambridge University Press.", "why": "Based on a large corpus of real British university assignments, it explains the main genre families students are asked to write and how expectations differ across disciplines."}, {"book": "Bailey, S. (2025) Academic Writing: A Handbook for International Students. 6th edn. Routledge.", "why": "The sections on understanding titles and task words, and on writing different types of assignment such as essays, reports and reviews, are practical and concise."}, {"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "The units on writing critiques and on constructing a research paper cover critical reviews, research article sections and the structure of introductions and discussions."}], "links": [{"t": "Understanding Assignments (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/understanding-assignments/"}, {"t": "How to write an essay (Monash University)", "u": "https://www.monash.edu/student-academic-success/excel-at-writing/how-to-write/essay"}, {"t": "How to write a report (Monash University)", "u": "https://www.monash.edu/student-academic-success/excel-at-writing/how-to-write/report"}, {"t": "Reflection (Monash University)", "u": "https://www.monash.edu/student-academic-success/excel-at-writing/how-to-write/reflection"}, {"t": "How to reflect in an academic context (University of Sheffield)", "u": "https://www.sheffield.ac.uk/academic-skills/study-skills-online/reflective-practice"}, {"t": "Excel at writing: guides to abstracts, posters, proposals and more (Monash University)", "u": "https://www.monash.edu/student-academic-success/excel-at-writing"}]}, {"id": "imrad", "title": "IMRaD and the shape of research writing", "sub": "Where everything in a paper goes", "goals": ["Explain what belongs in the Introduction, Methods, Results and Discussion of a research report", "Use the hourglass shape to move from broad context to your own study and back out again", "Choose a suitable structure for your field and for a monograph thesis or a thesis by publication", "Identify the reporting guideline (such as CONSORT, STROBE, PRISMA or COREQ) that applies to your study"], "lessons": [{"t": "What IMRaD is and why it exists", "b": "IMRaD stands for Introduction, Methods, Results and Discussion. It is the standard shape of an empirical research article, meaning an article that reports a study in which data were collected or analysed. Most journals in science, engineering, medicine, public health, agriculture and much of the social sciences expect it.\n\nEach section answers one question for the reader:\n• Introduction: Why did you do this study, and what exactly did you ask?\n• Methods: How did you do it?\n• Results: What did you find?\n• Discussion: What does it mean, and why does it matter?\n\nThe structure exists because readers rarely read a paper from start to finish. A busy examiner may read the abstract, jump to a figure, then check the methods. A practitioner may read only the discussion. IMRaD lets every reader find what they need quickly because every paper puts the same things in the same places.\n\nFor you as a writer, IMRaD is also a thinking tool. If you cannot say clearly what goes in each section, you may not yet be clear about your question, your method or your main finding. Many writers start drafting with Methods, because it is the most concrete, and write the Introduction last, once they know what the paper actually shows."}, {"t": "The hourglass shape", "b": "Picture an hourglass: wide at the top, narrow in the middle, wide again at the bottom. A good research paper has the same shape.\n\n• Top (Introduction): you start broad, with a real-world or disciplinary problem, then narrow down through what is known to the specific gap and your precise aim.\n• Middle (Methods and Results): this is the narrowest part. You describe only your study: what you did and what you found, in specific, concrete terms.\n• Bottom (Discussion and Conclusion): you widen out again. You connect your findings to earlier studies, to theory, and finally to practice, policy or future research.\n\nThe shape helps you avoid two common problems. The first is starting too narrow, for example opening with 'This study used a questionnaire' before the reader knows why the topic matters. The second is ending too narrow, for example finishing with a list of numbers and no statement of what they mean beyond your sample.\n\nA useful check: the first paragraph of your Introduction and the last paragraph of your Discussion should speak about the same big issue. If your paper opens with water insecurity in peri-urban Kenya, it should close by saying what your findings mean for that problem."}, {"t": "What goes where", "b": "Misplaced content is one of the most common reasons examiners and reviewers ask for revisions. Use this as a sorting guide.\n\n• Introduction: background and context, a short review of key literature (in articles), the gap or problem, your aim, research questions or hypotheses, and often a one-line preview of the approach.\n• Methods: design, setting, participants or materials, sampling, instruments, procedures, data analysis, ethics approval and consent. Justify key choices briefly.\n• Results: what you found, in a logical order, with tables and figures. Numbers, themes and quotes go here. Interpretation does not.\n• Discussion: what the results mean, how they compare with other studies, possible explanations, limitations, and implications.\n• Conclusion: a short answer to the research question, the main contribution, and (if expected) recommendations.\n\nTwo quick tests help. If a sentence contains a new finding, it belongs in Results, not Discussion. If a sentence explains why something happened, or compares with another author, it usually belongs in Discussion, not Results.\n\nThe abstract mirrors the whole structure in miniature: one or two sentences each for background, aim, method, key results and main conclusion. Write it last."}, {"t": "Common variants of IMRaD", "b": "IMRaD is a family of structures, not one fixed template. Check the author guidelines of your target journal, or your department's handbook, before you decide.\n\nCommon variants:\n• IMRaD plus Conclusion. Many engineering, environmental and business journals add a separate short Conclusion section after the Discussion.\n• Combined Results and Discussion. Common in chemistry, materials science and some engineering fields. Each result is presented and then immediately interpreted. This works well when results are many and each needs short comment, but you must still keep facts and interpretation clearly signalled within each paragraph.\n• Extra sections. Many papers add a Literature Review or Theoretical Framework between Introduction and Methods, especially in management, education and social science. Some add a Materials section, a Study Area section (common in agriculture and environmental science), or a Case Description.\n• Methods at the end. A few journals, such as some high-profile science titles, place Methods after the Discussion or in online supplements.\n\nWhatever the variant, the underlying logic stays the same: context and question, then approach, then findings, then meaning. A reader should never meet a result before knowing how it was produced."}, {"t": "Structures in the humanities and social sciences", "b": "Not all academic writing is IMRaD. In history, philosophy, literature, law and much theoretical or interpretive social science, papers are usually organised by argument rather than by research stage.\n\nA typical argument-led structure looks like this:\n• Introduction: context, the question or debate, and your thesis statement (your main claim).\n• Body sections with descriptive headings, each advancing one step of the argument, for example 'Land tenure under colonial rule' then 'Post-independence reforms'.\n• Conclusion: what the argument has shown and why it matters.\n\nMethods may appear as a short paragraph or be woven into the introduction. Evidence (archival documents, texts, cases, interviews) is discussed and interpreted together, so there is no separate Results section.\n\nQualitative social science often sits in between. A study of teachers' experiences in rural Pakistan might use Introduction, Literature Review, Methodology, Findings, Discussion and Conclusion. The Findings section may be organised by theme, with headings that name each theme.\n\nIf you are moving between disciplines, for example from engineering into development studies, do not assume your old structure will be accepted. Read three to five recent papers in your target journal and note their headings. Copy the pattern, not the words."}, {"t": "The traditional (monograph) thesis", "b": "A traditional thesis, sometimes called a monograph or 'big book' thesis, is one long, connected document. It usually stretches the IMRaD logic across chapters:\n\n• Chapter 1, Introduction: background, problem statement, aims and objectives, research questions, significance, scope, and an outline of the thesis.\n• Chapter 2, Literature review: a critical synthesis that builds the case for your study and identifies the gap.\n• Chapter 3, Methodology: philosophy or approach where relevant, design, data collection, analysis, ethics and quality criteria.\n• Chapters 4 to 6, Results or Findings: often one chapter per objective or study.\n• Chapter 7, Discussion: findings interpreted against the literature.\n• Chapter 8, Conclusion: answers to the research questions, contributions, limitations, recommendations and future work.\n\nThis is a common pattern, not a rule. Some theses combine results and discussion in each empirical chapter and end with a general discussion. Some fields add a separate theory chapter.\n\nConventions vary by country. Many Nigerian, Ghanaian, Kenyan and Indian universities expect a fixed five-chapter master's format. UK, Canadian and Australian universities usually allow more freedom, but your supervisor and the graduate school regulations decide. Ask early, and ask for two or three recent theses from your group to use as models."}, {"t": "Thesis by publication (integrated articles)", "b": "In a thesis by publication, also called a manuscript-based thesis, thesis by compilation or integrated-article thesis, the core chapters are journal papers that are published, submitted or ready to submit. This format is common in science and engineering in Canada, Australia, Scandinavia and increasingly the UK.\n\nA typical structure:\n• General introduction: the overall problem, aims, and how the papers fit together.\n• Literature review (sometimes itself a published review paper).\n• Paper chapters, each in its own IMRaD form.\n• Linking text before each paper, explaining how it follows from the previous one.\n• General discussion: what the papers show together, beyond what any single paper says.\n• Conclusion, limitations and future work.\n\nThe biggest risk is a 'stapled' thesis: separate papers with no common thread. Examiners want one coherent contribution. Write the general introduction and discussion so they synthesise, not just summarise.\n\nOther practical points: universities set rules on how many papers are needed, whether they must be published, how co-authored work is declared (usually a statement of your contribution), copyright permission from publishers, and how to handle repetition across chapters. Read your own university's rules before you plan your first paper, not after."}, {"t": "Reporting guidelines, explained simply", "b": "A reporting guideline is a checklist that tells you what information a report of a particular study type must include, so readers can judge and repeat the work. Guidelines do not tell you how to do the study. They tell you what to report. The EQUATOR Network is an international library that collects them.\n\nThe ones you will meet most often:\n• CONSORT: randomised controlled trials, such as a trial testing a new malaria education programme against usual care. The current version is CONSORT 2025.\n• STROBE: observational studies (cohort, case-control and cross-sectional), such as a survey of hypertension prevalence in Lagos.\n• PRISMA: systematic reviews and meta-analyses. PRISMA 2020 includes the well-known flow diagram showing how many records were found, screened and included.\n• COREQ: qualitative studies using interviews or focus groups. It has 32 items, including who did the interviews and how themes were derived.\n\nOthers exist for diagnostic studies, case reports, study protocols, animal research and more.\n\nMany health journals require you to upload a completed checklist with your submission. Even when not required, using one is a quick way to spot gaps in your Methods section. Find the guideline that matches your design before you collect data, so you record everything you will later need to report."}, {"t": "Before you start writing: confirm your structure", "b": "Structure is cheaper to fix at the planning stage than after you have written 60 pages. Before drafting, collect three things.\n\n• The rules. For a thesis, read your graduate school's regulations and your department's handbook. For a paper, read the journal's author guidelines, which state required headings, word limits and whether a reporting checklist is needed.\n• Models. Find three to five recent, well-regarded examples: theses from your research group, or papers from your target journal using a similar design. Write down their headings and how many words each section takes.\n• A skeleton. Draft your headings and, under each, two or three bullet points on what it will contain. Show this to your supervisor. A ten-minute conversation now can save weeks.\n\nA useful habit is a 'reverse outline' after drafting: write one sentence summarising each paragraph, then check that each sentence sits in the right section. Paragraphs that explain or compare in your Results, or that introduce new data in your Discussion, will stand out quickly.\n\nRemember that conventions are not arbitrary. Readers in your field have learned to look for information in particular places. Meeting their expectations makes your work easier to read and to trust."}], "examples": [{"label": "Keeping interpretation out of Results", "weak": "Results: Maize yield was 4.1 t/ha on plots with compost and 2.7 t/ha on control plots. This is because compost improves soil water retention, as another study also found in Ghana (Author, year), which shows that farmers should adopt composting.", "strong": "Results: Mean maize yield was 4.1 t/ha (SD 0.4) on composted plots and 2.7 t/ha (SD 0.5) on control plots (Table 2).\n\nDiscussion: The higher yield on composted plots is consistent with improved soil water retention, a mechanism also reported in northern Ghana (Author, year).", "why": "The weak version mixes a finding, an explanation, a comparison with literature and a recommendation in one place. The strong version reports the fact in Results and moves the explanation and comparison to the Discussion, where readers expect them."}, {"label": "Linking text in a thesis by publication", "weak": "Chapter 4. The following chapter is a paper published in Water Research.", "strong": "Chapter 4. Chapter 3 showed that granule stability fell sharply when organic loading exceeded a threshold, but it did not explain why. This chapter tests whether changes in the microbial community account for that loss of stability. It was published in Water Research; my contribution to the study design, experiments, analysis and writing is stated in the Declaration.", "why": "The strong version tells the examiner how this paper follows from the last one and what question it answers, so the papers read as one connected argument. It also states the candidate's contribution, which most regulations require."}, {"label": "Using a reporting guideline in Methods", "weak": "We reviewed studies on mobile health interventions for diabetes from various databases and selected the relevant ones.", "strong": "We followed the PRISMA 2020 guideline. We searched PubMed, Scopus and African Journals Online from January 2010 to March 2025 using the terms listed in Supplementary Table S1. Two reviewers independently screened titles, abstracts and full texts; disagreements were resolved by discussion. The selection process is shown in Figure 1.", "why": "The strong version names the guideline and reports the details a reader needs to judge and repeat the review: databases, dates, search terms, screening process and a flow diagram."}], "checks": [{"q": "In which section should this sentence appear? 'Response rates were higher among female participants (68%) than male participants (54%).'", "o": ["Introduction", "Methods", "Results", "Discussion"], "a": 2, "why": "It reports a finding from your own data without interpreting it, so it belongs in Results. If you added a reason ('possibly because...'), that reason would go in the Discussion."}, {"q": "What does the 'hourglass' shape of a research paper describe?", "o": ["Moving from broad context to your specific study, then back out to wider meaning", "Writing the longest section in the middle of the paper", "Spending equal time on each IMRaD section", "Placing the most important result at the very end"], "a": 0, "why": "The hourglass narrows from the broad problem to your study (Methods and Results) and widens again as the Discussion relates findings to literature, theory and practice. It is about scope, not section length."}, {"q": "A student writes: 'Our finding agrees with Okafor (2021), probably because both studies used urban samples.' Where does this belong?", "o": ["Methods", "Results", "Introduction", "Discussion"], "a": 3, "why": "Comparing your result with other studies and suggesting an explanation is interpretation, which is the job of the Discussion. Results should report what you found, not why."}, {"q": "Which study needs the STROBE guideline?", "o": ["A randomised trial of two fertiliser treatments in patients", "A cross-sectional survey of anaemia among pregnant women in Kano", "A systematic review of school feeding programmes", "Focus groups with nurses about workplace stress"], "a": 1, "why": "STROBE covers observational designs: cohort, case-control and cross-sectional studies. A trial uses CONSORT, a systematic review uses PRISMA and focus groups fit COREQ."}, {"q": "What is the main purpose of a reporting guideline such as CONSORT or COREQ?", "o": ["To tell you how to design your study", "To list what information must be reported so readers can judge and repeat the work", "To decide whether your paper will be accepted", "To give a standard template of sentences to copy"], "a": 1, "why": "Reporting guidelines are about complete and transparent reporting. They do not prescribe study design, and they do not guarantee acceptance, though many journals require the checklist."}, {"q": "Which is the biggest risk specific to a thesis by publication?", "o": ["The papers read as separate pieces with no shared argument", "It contains too many tables", "It cannot include a literature review", "It must not use IMRaD within chapters"], "a": 0, "why": "Examiners expect one coherent contribution. Linking text, a strong general introduction and a synthesising general discussion prevent a 'stapled' collection of papers. Literature reviews and IMRaD chapters are both normal in this format."}, {"q": "A materials chemistry journal uses a combined 'Results and Discussion' section. What should you still do?", "o": ["Avoid citing other studies in that section", "Put all interpretation in the Introduction instead", "Signal clearly which sentences report findings and which interpret them", "Leave out tables so the text flows"], "a": 2, "why": "Combining sections is normal in some fields, but readers must still be able to tell fact from interpretation. A common pattern is: state the result, point to the figure, then explain it and compare with literature."}, {"q": "You are writing a history paper on cooperative movements in colonial Tanganyika. Which structure is most likely expected?", "o": ["Strict IMRaD with a separate Results section", "Introduction with thesis statement, argument-led body sections, conclusion", "Methods first, then a Discussion", "Results and Discussion only"], "a": 1, "why": "History and most humanities writing is organised by argument. Evidence is presented and interpreted together under descriptive headings, so a separate Results section would be unusual."}, {"q": "Where would you normally report ethics approval and informed consent in an empirical article?", "o": ["Results", "Discussion", "Conclusion", "Methods"], "a": 3, "why": "Ethics approval, the approving body and how consent was obtained are part of how the study was done, so they belong in Methods (some journals also ask for a separate ethics statement)."}, {"q": "Which is the most reliable way to decide the structure of your master's thesis?", "o": ["Use the five-chapter format from your undergraduate project", "Follow a popular online template", "Check your university's regulations and recent theses from your group, then agree a skeleton with your supervisor", "Choose whatever structure lets you write the most"], "a": 2, "why": "Structure is set locally by regulations, discipline and supervisor expectations. A format that was required in one country or programme may not be expected in another."}, {"q": "A paragraph in your Discussion introduces a new table of soil pH values that does not appear anywhere in Results. What is the problem?", "o": ["New findings should be presented in Results first", "Tables are not allowed in any Discussion", "Soil pH should go in the Introduction", "There is no problem"], "a": 0, "why": "The Discussion interprets results already presented. Introducing new data there surprises the reader and breaks the logic of the paper. Move the table to Results, then discuss it."}, {"q": "Which section should usually be written last?", "o": ["Methods", "Abstract", "Results", "Reference list format"], "a": 1, "why": "The abstract summarises the whole paper, so it can only be accurate once the other sections are settled. Many writers also revise the Introduction at the end so that it matches what the paper actually shows."}], "checklist": ["Find your target journal's author guidelines or your thesis regulations and write down the required sections and word limits.", "Collect three to five recent model papers or theses with a similar design and list their headings.", "Draft a skeleton outline with two or three bullet points under each heading and share it with your supervisor.", "Identify the reporting guideline that matches your design on the EQUATOR Network and download its checklist.", "Make a reverse outline of your draft and move any interpretation out of Results and any new data out of Discussion.", "Check that your first Introduction paragraph and last Discussion paragraph address the same big problem.", "If you plan a thesis by publication, read your university's rules on number of papers, co-authorship statements and copyright now."], "practice": "Take your current draft or plan and write one sentence describing what each IMRaD section (or each thesis chapter) will say. Then check each sentence against the 'what goes where' guide and move anything that is in the wrong place.", "reading": [{"book": "Gastel, B. and Day, R.A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Read the early chapters on the structure of a scientific paper and the chapters on each IMRaD section. Clear, practical guidance on what goes where, with advice on tables, figures and journal requirements."}, {"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "Read the two units on constructing a research paper, which walk through methods, results, introductions and discussions with tasks designed for multilingual graduate writers. A 4th edition is announced by the publisher for 2027."}, {"book": "Dunleavy, P. (2003) Authoring a PhD: How to Plan, Draft, Write and Finish a Doctoral Thesis or Dissertation. Palgrave Macmillan.", "why": "Read the early chapters on planning the macro-structure of a thesis. Especially useful for the humanities and social sciences, where chapters are organised around an argument rather than strict IMRaD."}], "links": [{"t": "EQUATOR Network: library of reporting guidelines", "u": "https://www.equator-network.org/reporting-guidelines/"}, {"t": "EQUATOR: CONSORT 2025 for randomised trials", "u": "https://www.equator-network.org/reporting-guidelines/consort/"}, {"t": "EQUATOR: STROBE for observational studies", "u": "https://www.equator-network.org/reporting-guidelines/strobe/"}, {"t": "EQUATOR: PRISMA 2020 for systematic reviews", "u": "https://www.equator-network.org/reporting-guidelines/prisma/"}, {"t": "UNC Writing Center: Scientific reports (IMRaD section by section)", "u": "https://writingcenter.unc.edu/tips-and-tools/scientific-reports/"}, {"t": "ANU Academic Skills: Thesis by compilation", "u": "https://www.anu.edu.au/students/academic-skills/research-writing/thesis-structures/thesis-by-compilation"}]}, {"id": "intro", "title": "Writing introductions", "sub": "Creating a space for your research", "goals": ["Describe the three moves of Swales' Create-a-Research-Space (CARS) model and recognise them in published introductions", "Build a funnel-shaped introduction that leads logically from a broad problem to your specific aim", "Write clear statements of aim, research questions and contribution, plus a short outline of what follows", "Adapt an introduction to the needs of an essay, a journal article or a thesis"], "lessons": [{"t": "What an introduction has to do", "b": "An introduction is not a warm-up. It is an argument. In a few paragraphs it must persuade the reader that your study is worth their time.\n\nTo do that, it answers four questions in order:\n• What is the topic, and why does it matter?\n• What is already known about it?\n• What is missing, uncertain or contested?\n• What does this study do about it?\n\nIf any one of these is missing, the reader is left asking 'so what?' or 'why you?'. A common weakness among new researchers is an introduction full of background facts (statistics, definitions, history) that never reaches a clear gap or aim. Another is the opposite: jumping straight to 'This study aims to...' without showing why that aim is needed.\n\nReviewers and examiners often decide their first impression of a paper from its introduction. A focused, well-argued introduction signals that the author understands the field and knows exactly what they are adding. A wandering one signals that the rest of the paper may also lack focus.\n\nBecause the introduction must match what the paper actually delivers, many experienced writers draft it early to clarify their thinking, then rewrite it at the end."}, {"t": "The CARS model in brief", "b": "John Swales, an applied linguist, studied hundreds of research article introductions and found that most followed a similar pattern. He called it the Create-a-Research-Space (CARS) model, first set out in his 1990 book Genre Analysis and later taught in Swales and Feak's Academic Writing for Graduate Students.\n\nThe key idea: published research competes for attention, like businesses competing for space in a crowded market. Your introduction has to create a space for your study. It does this in three moves. A 'move' is a section of text with one communicative job; it may be one sentence or several paragraphs.\n\n• Move 1, establish a territory: show that the general area is important and summarise what is known.\n• Move 2, establish a niche: show that something in that territory is missing, unresolved or worth extending.\n• Move 3, occupy the niche: show how your study fills that space, by stating its aim, questions, approach and sometimes its main findings and structure.\n\nThe moves usually appear in this order, though long introductions may cycle through Moves 1 and 2 more than once before reaching Move 3. CARS describes what successful writers tend to do. Use it as a planning and checking tool, not as a rigid formula."}, {"t": "Move 1: Establish the territory", "b": "In Move 1 you show the reader that your area matters and that you know the existing work.\n\nThere are two main steps.\n\n• Claim importance. Say why the topic deserves attention. Options include real-world impact ('Post-harvest losses remove an estimated share of food supply each year'), growing research interest, or a long-standing debate. Support the claim with evidence and citations. Avoid empty openers such as 'Since the beginning of time' or 'In today's world'.\n• Review what is known. Summarise the key findings and approaches in the area. In a journal article this is a short, selective review. Group studies by idea, not by author, so you build toward the gap.\n\nUseful sentence patterns (all written for this unit):\n• 'X has become a central concern for ... because ...'\n• 'Over the past decade, researchers have increasingly examined ...'\n• 'Previous studies have shown that ... (Author, year; Author, year).'\n• 'Two main approaches have been used to ...: the first ...; the second ...'\n\nTense tip: use the present simple for accepted facts ('Malaria remains a leading cause of child mortality'), and the present perfect for research activity that continues ('Several studies have examined...')."}, {"t": "Move 2: Establish a niche", "b": "Move 2 is the turning point of the introduction. Having shown what is known, you now show what is not known or not settled. This is where your study earns its place.\n\nCommon ways to establish a niche:\n• Indicate a gap: an area, population, context or variable that has not been studied. ('Few studies have examined ... in secondary schools outside major cities.')\n• Counter-claim: argue that existing work has a weakness, such as small samples, short time frames or an untested assumption.\n• Raise a question: point to a puzzle or conflicting results that need explaining.\n• Continue a tradition: show that a promising line of work could be extended in a useful direction.\n\nSignal the turn clearly with words such as 'however', 'yet', 'despite', 'remains unclear', 'little is known about'.\n\nBe careful with gaps. 'No study has been done in my state' is weak on its own, because a gap is only worth filling if filling it would change what we know or do. Explain why the gap matters: for example, because conditions differ, because policy depends on the answer, or because theory predicts something different.\n\nAlso be accurate. Claiming 'no research exists' when it does is quickly spotted by reviewers. Phrases like 'relatively little attention has been paid to' are safer and often truer."}, {"t": "Move 3: Occupy the niche", "b": "In Move 3 you present your study as the response to the niche you have just created. The link should be direct: if Move 2 says rural women's views are missing, Move 3 should say your study examines rural women's views.\n\nMove 3 can include:\n• The aim or purpose: 'This study aims to...' or 'This paper examines...'.\n• Research questions or hypotheses, often as a short numbered list.\n• A brief note on approach: 'Using household survey data from three districts, we...'.\n• The main finding (common in some sciences and engineering, rare in others).\n• The contribution or significance: what the reader gains.\n• An outline of the structure: 'Section 2 reviews ...; Section 3 describes ...'.\n\nNot every introduction uses every element. Announcing main findings in the introduction is normal in physics, computer science and many engineering journals, but less common in medicine, education and much social science. Look at recent papers in your target journal to check.\n\nSentence patterns:\n• 'To address this gap, this study investigates...'\n• 'The aim of this paper is to...'\n• 'Specifically, we ask: (1)...; (2)...'\n• 'The remainder of the paper is organised as follows.'"}, {"t": "The funnel: shape and proportion", "b": "A strong introduction has a funnel shape. It begins wide and narrows steadily until it reaches your exact aim. Each paragraph should be a little more specific than the last.\n\nAn example for a public health paper:\n1. Non-communicable diseases are rising across sub-Saharan Africa (broad problem).\n2. Hypertension is a major driver, and detection rates are low (narrower).\n3. Community health workers have improved detection in several countries (what is known).\n4. However, little is known about how they manage follow-up in urban informal settlements (niche).\n5. This study explores... (aim).\n\nProportion matters. In a journal article the introduction is often around 10 to 15 percent of the text, typically a few paragraphs, though this varies by field. If yours runs to several pages of general background, the reader will lose the thread. Cut background that does not lead toward the gap.\n\nTwo checks:\n• Read only the first sentence of each paragraph. Do they form a narrowing argument on their own?\n• Count how many paragraphs come before the word 'however' (or its equivalent). If the answer is six, you are probably spending too long in Move 1."}, {"t": "Stating aims and contribution clearly", "b": "Aim and contribution are related but different. The aim says what you set out to do. The contribution says what the reader will know or be able to do afterwards that they could not before.\n\nWeak aims are vague: 'to study climate change and farmers'. Strong aims name the what, who, where and how specifically enough that a reader could tell whether you achieved them: 'to examine how smallholder maize farmers in two districts of Malawi adjusted planting dates in response to seasonal rainfall forecasts between 2018 and 2023'.\n\nIn theses, the aim is often broken into objectives, each a concrete step (to measure, to compare, to identify, to develop). Use action verbs. Avoid 'to understand' or 'to know' as main verbs, since they cannot be checked.\n\nContribution statements answer 'so what?'. Types of contribution include:\n• new evidence from an under-studied context\n• a new method, model or tool\n• a test of a theory under new conditions\n• practical guidance for policy or practice.\n\nPatterns: 'This study contributes to ... by ...'; 'The findings provide the first ... evidence on ...' (only if true); 'These results will be of use to ... who ...'.\n\nKeep claims modest and specific. Promise what your design can deliver."}, {"t": "Language toolkit for introductions", "b": "These patterns are written for Citadel. Adapt them; do not paste them unchanged.\n\nMove 1, importance and background:\n• 'X plays a key role in ...'\n• 'Interest in X has grown considerably since ...'\n• 'It is well established that ... (Author, year).'\n• 'Recent work has focused on ...'\n\nMove 2, the niche:\n• 'However, most studies have concentrated on ..., leaving ... largely unexamined.'\n• 'Despite this progress, it remains unclear whether ...'\n• 'These findings are inconsistent: some studies report ..., whereas others ...'\n• 'Existing models assume ..., an assumption that may not hold in ...'\n\nMove 3, the study:\n• 'This paper addresses this gap by ...'\n• 'The present study therefore asks ...'\n• 'We hypothesise that ...'\n• 'Section 2 outlines ...; Section 3 presents ...; Section 4 discusses ...'\n\nGrammar tips for multilingual writers:\n• Use 'this study' or 'the present study' for your own work, not 'the study' alone, which may be confused with a cited study.\n• Use 'few' (negative: almost none) and 'a few' (positive: some) carefully; they mean different things.\n• Use 'however' at the start of a sentence followed by a comma, or in the middle between commas, not to join two full sentences with a comma."}, {"t": "Essays, papers and theses: different introductions", "b": "The CARS logic applies widely, but length and emphasis change with the genre.\n\n• Coursework essay. Usually one or two paragraphs, about 10 percent of the word count. Give context, define key terms if needed, state your thesis statement (your main argument), and briefly say how the essay is organised. A full literature gap is not usually required; instead, you show which debate you are joining and what position you will take.\n• Journal article. A few tight paragraphs, sometimes with the literature review folded in. The niche must be convincing to experts, and the contribution must be clear. Check whether your target journal expects a separate literature review section.\n• Thesis. A full chapter, often 10 to 20 pages. It typically includes background, problem statement, aim and objectives, research questions or hypotheses, significance, scope and limitations, definitions of key terms, and an outline of chapters. Detailed literature goes in its own chapter; the introduction gives just enough to justify the problem.\n\nConventions also vary by country. Some programmes in Nigeria, Ghana, Kenya, India and Pakistan require fixed sub-headings such as 'Statement of the Problem' and 'Significance of the Study'. Many UK, Canadian and Australian programmes prefer flowing prose with fewer sub-headings. Follow your own programme's guidance."}], "examples": [{"label": "Opening sentence: from empty claim to evidenced importance", "weak": "Since the dawn of civilisation, water has been very important to human beings and the whole world.", "strong": "Access to safely managed drinking water remains uneven across sub-Saharan Africa, with the lowest coverage in rural and peri-urban areas (Author, year).", "why": "The weak sentence is true of everything and says nothing specific. The strong sentence claims importance with a precise, evidenced statement and already points the reader toward a particular setting."}, {"label": "Establishing a niche that matters", "weak": "No research has been done on mobile money use by traders in Enugu, so this study will do it.", "strong": "Studies of mobile money in East Africa have linked adoption to improved household resilience (Author, year). However, relatively little is known about adoption among market traders in West Africa, where cash remains dominant and regulatory frameworks differ. Understanding these traders' choices matters for current efforts to expand digital payments in Nigeria.", "why": "The weak version claims a gap that may not be accurate and gives no reason why it matters. The strong version builds on existing work, names the gap carefully, and explains why filling it would be useful."}, {"label": "Occupying the niche with a clear aim and contribution", "weak": "This study is about teachers and technology and will be very useful to everybody.", "strong": "This study examines how secondary school mathematics teachers in two districts of Punjab, Pakistan, use free mobile applications in lesson preparation. It asks (1) which applications teachers use and why, and (2) what constraints limit their use. By documenting practice in low-resource public schools, it provides evidence to inform teacher training programmes in similar settings.", "why": "The strong version names the population, place and focus, gives answerable research questions, and states a specific, modest contribution instead of an empty claim of usefulness."}], "checks": [{"q": "In the CARS model, what is the main job of Move 2?", "o": ["Show that the general area is important", "Show what is missing, unresolved or open to extension in existing work", "State the research questions", "Outline the structure of the paper"], "a": 1, "why": "Move 2 creates the niche. Claiming importance is Move 1; research questions and the outline belong to Move 3."}, {"q": "Which sentence most clearly signals Move 2?", "o": ["'Soil erosion affects millions of hectares of farmland.'", "'This paper is organised into five sections.'", "'However, the long-term effects of terracing on soil carbon remain unclear.'", "'We collected samples from 40 farms.'"], "a": 2, "why": "'However' plus 'remain unclear' marks a turn from what is known to what is not, which is the core of establishing a niche. The others are Move 1, Move 3 and Methods respectively."}, {"q": "Which is the strongest gap statement?", "o": ["'There is no study on this topic in my country.'", "'Researchers have ignored this important topic.'", "'Many studies exist on this topic, so more research is needed.'", "'Most studies of solar mini-grids have measured technical performance; few have examined how tariff design affects household use in rural areas.'"], "a": 3, "why": "It summarises what has been done, names a specific unexplored aspect, and implies why it matters. The others are vague, possibly inaccurate or illogical."}, {"q": "A reader says your introduction 'never gets to the point'. Which fix is most likely to help?", "o": ["Cut general background that does not lead toward the gap, and state the gap and aim sooner", "Add more statistics in the first paragraph", "Move the research questions to the conclusion", "Add a longer history of the topic"], "a": 0, "why": "A long Move 1 with little narrowing is the usual cause. Trimming background and reaching the niche and aim sooner creates the funnel shape readers expect."}, {"q": "Which aim statement is most specific and checkable?", "o": ["To understand climate change in Africa", "To know more about farmers and rainfall", "To compare maize yields under two irrigation schedules on smallholder farms in Morogoro over two seasons", "To study irrigation generally"], "a": 2, "why": "It names what is compared, under what conditions, where and when, so a reader can tell whether it was achieved. 'Understand' and 'know' are not checkable verbs."}, {"q": "What is the difference between an aim and a contribution?", "o": ["The aim says what you set out to do; the contribution says what the reader gains that was not known or available before", "They are two words for the same thing", "The aim goes in the conclusion and the contribution in the methods", "The contribution lists your data sources"], "a": 0, "why": "An aim describes intended action; a contribution describes the value added to knowledge or practice. Strong introductions usually state both."}, {"q": "In which genre is it most normal to announce your main findings in the introduction?", "o": ["A history essay", "A clinical medicine article", "A qualitative education thesis", "A computer science or engineering conference paper"], "a": 3, "why": "Many computer science, physics and engineering papers state their key results and contributions up front. It is less common in medicine and much social science. Always check recent papers in your target outlet."}, {"q": "Which tense is most suitable for 'Several studies ___ the link between road traffic noise and sleep quality'?", "o": ["have examined", "examine tomorrow", "will examine", "had been examining tomorrow"], "a": 0, "why": "The present perfect ('have examined') is common for describing a body of research that is still relevant now. Simple present suits accepted facts; past simple suits a specific single study."}, {"q": "For a 2,500-word coursework essay, what does the introduction usually need?", "o": ["A full chapter with a problem statement and significance section", "Context, any key definitions, a clear thesis statement and a brief roadmap", "A complete literature review of all sources", "The main findings and statistical results"], "a": 1, "why": "Essay introductions are short, around 10 percent of the word count.
