entences needs a full stop or semicolon before it: 'Costs fell; however, uptake stayed low.'"}, {"t": "Signposting across sections and chapters", "b": "Signposting tells readers where they are, where they have been and where they are going. It is part of what linguists call metadiscourse: writing about your own text. In long assignments, theses and articles, good signposting prevents readers from getting lost.\n\nWhere to signpost:\n• End of the introduction: a brief roadmap of the sections that follow ('Section 2 reviews..., Section 3 describes...').\n• Start of a section or chapter: one or two sentences stating its purpose and how it connects to the previous one.\n• Transitions between major points: 'Having established the economic drivers, this section turns to the social factors.'\n• End of a chapter: a short summary and a pointer to what comes next.\n\nUseful patterns you can adapt:\n• 'This section examines... It first..., and then...'\n• 'The previous chapter showed that... Building on this, the present chapter...'\n• 'Two further factors help explain this pattern.'\n• 'In summary, the evidence reviewed here indicates that...'\n\nDo not over-signpost. A 2,000-word essay needs a short roadmap, not a sentence before every paragraph announcing what the paragraph will do. Conventions also differ: humanities essays often signpost through argument, while engineering reports rely more on numbered headings.\n\nThe Manchester Academic Phrasebank has a full page of transition phrases you can study for patterns."}, {"t": "Coherence: making the whole text hang together", "b": "Cohesion works between sentences; coherence works across the whole text. A text is coherent when every part clearly serves the central purpose and the order of parts makes sense.\n\nTo check coherence, make a reverse outline after you finish a draft:\n1. Number every paragraph.\n2. Write one line for each: its main claim and its job (background, evidence, counter-argument, method, finding).\n3. Read the list alone, without the text.\n\nThen ask:\n• Does each paragraph connect to the research question or thesis?\n• Are related points grouped together, or scattered?\n• Is the order logical: general to specific, chronological, problem to solution, or most to least important?\n• Are there gaps where the reader must make a leap you have not explained?\n• Does the conclusion answer the question the introduction posed?\n\nKey terms help coherence too. If your introduction promises to examine 'access, affordability and quality', those three words should appear as organising ideas in later sections and again in the conclusion. This creates a visible thread that examiners can follow.\n\nMoving paragraphs around in a reverse outline is quicker than rewriting. Fix structure first, then sentences."}, {"t": "Sentence length and clarity", "b": "There is no perfect sentence length, but readers struggle when many sentences in a row are long and complex. A mix works best: mostly medium-length sentences, some short ones for emphasis, and an occasional long one when the idea needs it.\n\nFour habits make sentences clearer:\n• Keep the subject short and close to its verb. 'The effect of rising temperatures on maize yields in the northern savannah zone between 1990 and 2020 was examined' makes the reader wait too long for the verb. Try 'This study examined how rising temperatures affected maize yields...'\n• Make the main actors the grammatical subjects, and the main actions the verbs.\n• Put one main idea in each sentence. If a sentence contains 'and' three times, consider splitting it.\n• Move long lists or conditions to the end of the sentence.\n\nA useful self-check: if you must read a sentence twice to understand it yourself, your reader will need to read it three times.\n\nFor multilingual writers: some languages and educational traditions value long, elaborate sentences as a sign of skill. In English academic writing, a series of 50-word sentences is usually read as hard work. Splitting a long sentence into two is almost always safe, and it reduces grammar errors as well."}, {"t": "Run-ons, comma splices and fragments", "b": "Three sentence-boundary errors are common and easy to fix once you can see them.\n\n• Run-on (fused) sentence: two complete sentences with no punctuation between them. 'The pump failed the system shut down.'\n• Comma splice: two complete sentences joined only by a comma. 'The pump failed, the system shut down.'\n• Fragment: a group of words punctuated as a sentence but missing a subject, a main verb or a complete thought. 'Because the pump failed.' or 'For example, the case of Kisumu County.'\n\nFixes for run-ons and comma splices:\n• Use a full stop: 'The pump failed. The system shut down.'\n• Use a semicolon if the ideas are closely linked: 'The pump failed; the system shut down.'\n• Add a conjunction: 'The pump failed, so the system shut down.' or 'When the pump failed, the system shut down.'\n\nNote that 'however', 'therefore' and 'moreover' are not conjunctions. 'Costs rose, however demand stayed high' is a comma splice. Write 'Costs rose; however, demand stayed high.'\n\nFixes for fragments: attach the fragment to a neighbouring sentence or add the missing part. 'Because the pump failed, the system shut down.'\n\nFragments are sometimes used deliberately in journalism, but avoid them in academic writing."}], "examples": [{"label": "A paragraph with evidence but no analysis", "weak": "Women make up a large part of the agricultural workforce in Ghana. According to FAO data, women provide a substantial share of farm labour. Another study found that women farmers have less access to credit. Moreover, extension services do not reach them.", "strong": "Gender gaps in access to credit help explain why women farmers in Ghana adopt improved seed more slowly than men. Although women provide a substantial share of farm labour (Owusu, 2018), they are less likely to hold land titles that banks accept as collateral (Mensah and Boateng, 2020). Without credit, the higher upfront cost of certified seed becomes a barrier, even where women know its benefits. This suggests that seed programmes which ignore financing are unlikely to close the adoption gap.", "why": "The weak version lists facts with no claim and no explanation. The strong version opens with an arguable topic sentence, uses evidence to support it, explains the mechanism linking credit to adoption, and ends with an implication that links back to the wider argument. (Citations here are invented for illustration.)"}, {"label": "Reordering for given-before-new flow", "weak": "Biochar is a carbon-rich material. Crop residues and wood are heated with little oxygen to produce it. Water retention in sandy soils is improved by this material, according to several field trials.", "strong": "Biochar is a carbon-rich material produced by heating crop residues or wood with little oxygen. When added to sandy soils, it can improve water retention, as several field trials have shown.", "why": "Each sentence now starts with the familiar topic (biochar, it) and ends with the new information. The topic string is consistent, so the reader does not have to re-identify the subject in each sentence."}, {"label": "Fixing a comma splice and an overloaded sentence", "weak": "The survey was distributed to 600 teachers across four districts in Punjab and Sindh in 2023 and the response rate was 41% which is lower than expected, however this is common in online surveys and the sample was still adequate for the planned analysis.", "strong": "In 2023, the survey was distributed to 600 teachers in four districts in Punjab and Sindh. The response rate was 41%, lower than expected but typical for online surveys. The resulting sample was still large enough for the planned analysis.", "why": "One 50-word sentence with a comma splice before 'however' becomes three clear sentences, each with one main idea. The relationship between ideas is now expressed through structure rather than a chain of 'and' and 'which'."}], "checks": [{"q": "Which is the strongest topic sentence for an argument paragraph?", "o": ["This paragraph will talk about microfinance.", "Microfinance exists in many countries.", "Microfinance has reduced household vulnerability in Bangladesh, but its effect on long-term income is contested.", "According to one economist, 'microcredit changes lives.'"], "a": 2, "why": "It names a specific topic and makes an arguable claim that sets the paragraph's direction. Option D begins with a quotation, so the writer's own point is missing."}, {"q": "In a PEEL or MEAL paragraph, which step do students most often leave out?", "o": ["Explanation or analysis of the evidence", "The point or main idea", "The evidence", "The citation"], "a": 0, "why": "Students frequently place evidence and move on without explaining how it supports the point. This step is where critical thinking is shown."}, {"q": "Which pair of sentences follows the given-before-new principle best?", "o": ["Cholera outbreaks often follow floods. Contaminated water supplies are caused by floods.", "Cholera outbreaks often follow floods. Floods can contaminate water supplies with sewage.", "Floods happen. Cholera is a disease.", "Contamination of water by sewage is caused by floods. Cholera outbreaks often follow floods."], "a": 1, "why": "The second sentence begins with 'Floods', which ended the first sentence, and then adds new information. Option A puts the new information first and the known idea last."}, {"q": "Which sentence is a comma splice?", "o": ["Although yields rose, profits fell.", "Yields rose; profits fell.", "Yields rose, but profits fell.", "Yields rose, however profits fell."], "a": 3, "why": "'However' is not a conjunction, so a comma cannot join two sentences with it. Use a semicolon before 'however' and a comma after it."}, {"q": "Which of these is a sentence fragment?", "o": ["Which explains the delay in approval.", "The committee met twice.", "Approval was delayed.", "The delay was caused by missing documents."], "a": 0, "why": "It begins with a relative pronoun and does not express a complete thought on its own. It needs to be attached to a preceding sentence."}, {"q": "A student begins almost every sentence with 'Moreover', 'Furthermore' or 'Additionally'. What is the best advice?", "o": ["Replace them all with 'Also'", "Use transitions only where the logical relationship is not already clear, and choose the one that matches the logic", "Remove all transition words from academic writing", "Use them more, because examiners reward connectors"], "a": 1, "why": "Connectors should signal specific logical relations. Overuse makes writing mechanical, and additive connectors are often wrong when the point is actually a contrast or a result."}, {"q": "What does a reverse outline help you check?", "o": ["Spelling and grammar", "Reference list formatting", "Whether paragraphs are focused, relevant and in a logical order", "Word count"], "a": 2, "why": "Summarising each paragraph in one line lets you see the structure of the whole text and spot repetition, gaps and misplaced points."}, {"q": "Which sentence is clearest?", "o": ["The evaluation of the impact of the school-based deworming programme on attendance in 40 schools in western Kenya over three years was the aim.", "Over three years, the aim was, in 40 schools in western Kenya, evaluating deworming's impact on attendance.", "Attendance, in 40 schools, was what deworming's impact was evaluated on.", "This study evaluated how a school-based deworming programme affected attendance in 40 schools in western Kenya over three years."], "a": 3, "why": "The subject ('This study') is short and immediately followed by the verb, and the action is expressed as a verb rather than a noun. Option A makes the reader wait for the verb until the very end."}, {"q": "The word 'This' at the start of a sentence often causes ambiguity. Which is the best fix?", "o": ["Never start a sentence with 'This'", "Replace 'This' with 'It'", "Add a summary noun after it, such as 'This shortage' or 'This approach'", "Replace 'This' with 'The above'"], "a": 2, "why": "A summary noun tells the reader exactly what 'this' refers to and strengthens cohesion. 'It' is just as ambiguous."}, {"q": "Where is a short roadmap of the following sections most expected in a dissertation chapter or article?", "o": ["At the end of the introduction", "In the middle of the results", "In the reference list", "In every paragraph's first sentence"], "a": 0, "why": "Readers expect a brief preview of structure at the end of the introduction. Announcing the purpose of every paragraph would be over-signposting."}, {"q": "You find that one paragraph in your essay is nearly a full page and covers costs, staff training and patient satisfaction. What should you do?", "o": ["Leave it, because long paragraphs show depth", "Split it into separate paragraphs, each with its own topic sentence", "Add more transition words inside it", "Delete the middle part"], "a": 1, "why": "Three distinct ideas need three paragraphs. Splitting with clear topic sentences makes the structure visible to the reader."}], "checklist": ["Read only the first sentence of each paragraph in one section and check that together they summarise the argument", "For three argument paragraphs, label the Point, Evidence, Explanation and Link and add explanation where it is thin", "Check the first five words of each sentence in a choppy paragraph and reorder so that given information comes first", "Search for 'This' at the start of sentences and add a summary noun where the reference is unclear", "Search for ', however' and ', therefore' and fix any comma splices", "Make a one-line reverse outline of your current chapter or assignment and move any paragraph that does not fit", "Split any sentence longer than about 40 words and reread it aloud"], "practice": "Choose one paragraph from your current draft. Rewrite its topic sentence so that it makes an arguable claim, then check that every following sentence supports that claim and that each sentence begins with information the reader already has.", "reading": [{"book": "Williams, J.M. and Bizup, J. (2017) Style: Lessons in Clarity and Grace. 12th edn. Pearson.", "why": "The lessons on actions and characters, cohesion and coherence explain the given-before-new principle and topic strings more fully than any other textbook."}, {"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "The first unit's sections on flow and organisation, and the later units on general-specific and problem-solution texts, show how graduate-level paragraphs are structured."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "Shows sentence-level patterns and the typical order of information within each section of a science or engineering paper."}], "links": [{"t": "Paragraphs (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/paragraphs/"}, {"t": "Flow: coherence and cohesion (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/flow/"}, {"t": "Writing transitions (Purdue OWL)", "u": "https://owl.purdue.edu/owl/general_writing/mechanics/transitions_and_transitional_devices/index.html"}, {"t": "Academic Phrasebank: Signalling transition (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/signalling-transition/"}]}, {"id": "philosophy", "title": "Research philosophy and paradigms", "sub": "The beliefs behind your methods", "goals": ["Explain ontology, epistemology, axiology and methodology in plain words and connect each to a decision in your own study", "Distinguish positivism, post-positivism, interpretivism, critical realism, pragmatism and critical/transformative paradigms", "Identify whether your study reasons deductively, inductively or abductively, and say why", "Write a short, consistent philosophy justification that matches your question and methods"], "lessons": [{"t": "Why philosophy appears in a methods chapter", "b": "Every study rests on assumptions. You assume something about what exists (is 'student motivation' a real thing you can measure, or a meaning people build together?). You assume something about how we can know it (by measuring, by listening, or both?). These assumptions shape your question, your data and your claims, whether you write them down or not.\n\nA research philosophy section makes those assumptions visible. It tells the examiner: I know why I chose a survey and not interviews, and I know what kind of claim my data can and cannot support.\n\nMany international students meet this section for the first time in the UK, Canada or Australia. If your earlier degree was in engineering or agriculture, you may never have been asked to write it. That is normal. You do not need to become a philosopher. You need to make three or four clear, honest choices and show that your methods follow from them.\n\nThe key test is consistency. A study that claims to explore 'how farmers make sense of drought' but then only counts yes/no answers has a mismatch. A good philosophy section prevents that mismatch before it reaches your examiner."}, {"t": "Four key words: ontology, epistemology, axiology, methodology", "b": "These four words sound difficult, but each answers a simple question.\n\n• Ontology: what is reality like? Does the thing I study exist independently of people (rainfall, soil nitrogen), or is it partly created by people's meanings (a 'good teacher', 'corruption', 'success')? Some researchers say reality is single and objective; others say it is multiple and socially constructed.\n\n• Epistemology: how can we know it, and what counts as good knowledge? Measurement and statistical testing? People's own accounts? A mix?\n\n• Axiology: what role do values play? Can the researcher stay neutral, or do your background, funding and beliefs shape the work? Axiology asks you to be open about this.\n\n• Methodology: given the answers above, what is the overall logic of how I will study it? This is the strategy (for example, experiment, case study, ethnography), not just the tools.\n\nMethods are the specific techniques: a questionnaire, a semi-structured interview, a titration. Students often mix up methodology and methods. Remember: methodology is the reasoning; methods are the tools.\n\nLanguage tip: 'This study adopts the ontological position that...', 'Epistemologically, the study assumes that...'."}, {"t": "Positivism and post-positivism", "b": "Positivism holds that there is one reality, independent of the researcher, that we can observe and measure. Good knowledge comes from careful observation, testing hypotheses and finding regular patterns, often expressed in numbers. The researcher tries to stay neutral and detached.\n\nPost-positivism keeps the idea of an external reality but is more modest. It accepts that all observation is fallible, that theories are never proven, only supported or not yet rejected, and that bias must be controlled rather than assumed absent. Most modern experimental and survey research, including much of public health, engineering and agricultural science, is post-positivist in practice, even when it calls itself positivist.\n\nTypical signs of these positions:\n• Hypotheses stated before data collection\n• Variables defined and measured with instruments\n• Large or carefully controlled samples\n• Statistical testing and generalisation\n\nExample: testing whether a new irrigation schedule raises maize yield across 40 plots in Kaduna State, with control plots, is a classic post-positivist design.\n\nA common mistake is to call a study 'positivist' and then claim to 'prove' something. A better phrase is 'the results support the hypothesis' or 'provide evidence that'."}, {"t": "Interpretivism and constructivism", "b": "Interpretivism starts from a different assumption: the social world is made of meanings. People act according to how they understand situations, and different people understand the same situation differently. So the researcher's task is to understand those meanings from the inside, not only to measure behaviour from outside.\n\nConstructivism (often joined with interpretivism) adds that reality, at least social reality, is constructed by people through language, culture and interaction. There may be several valid realities rather than one.\n\nTypical signs of this position:\n• Open research questions beginning with 'how' or 'what is it like'\n• Interviews, focus groups, observation, documents\n• Smaller, purposefully chosen samples\n• Rich description and themes, not statistical generalisation\n• The researcher's own role is acknowledged\n\nExample: exploring how first-generation Ghanaian women engineers describe belonging in their workplaces fits interpretivism well, because 'belonging' is a meaning, not a fixed measurable object.\n\nInterpretivism does not mean 'anything goes'. It has its own standards of quality, such as credibility and transparency, which you meet in the methods unit."}, {"t": "Critical realism", "b": "Critical realism, linked with the philosopher Roy Bhaskar, sits between positivism and interpretivism. It says there is a real world independent of us, but we can only know it partly and through our concepts and theories.\n\nIt thinks of reality in layers:\n• The empirical: what we observe and experience\n• The actual: events that happen, whether we observe them or not\n• The real: underlying structures and mechanisms that cause events\n\nThe researcher's aim is to explain which mechanisms produce the patterns we see, and under what conditions. Because mechanisms work differently in different contexts, critical realists rarely expect universal laws.\n\nExample: a study finds that a mobile-money savings scheme raised savings in one Kenyan county but not in another. A critical realist would ask what mechanisms (trust in agents, network coverage, gender norms about money) were triggered in one place and blocked in the other.\n\nCritical realism suits mixed data, policy evaluation, management research and environmental studies, where both physical systems and human choices matter. It is a strong choice when you want to explain causes without pretending that context does not matter."}, {"t": "Pragmatism, and critical/transformative paradigms", "b": "Pragmatism, drawn from philosophers such as John Dewey, judges ideas by their practical consequences. A pragmatist asks: what approach will best answer this question and help solve this problem? It is comfortable using both numbers and words, so it is the philosophy most often linked with mixed methods.\n\nPragmatism is not a way to avoid choosing. Examiners dislike 'I am a pragmatist because I used both methods.' A good pragmatist justification explains the practical problem, why one kind of data alone would leave a gap, and how the two kinds of evidence will be joined.\n\nCritical and transformative paradigms start from the view that knowledge is shaped by power, and that research should expose injustice and support change. Feminist, decolonial, participatory and disability-rights research often sit here. Values are openly part of the work, and participants may help design the study.\n\nExample: a project with women's cooperatives in rural Punjab that co-designs questions with members and aims to change access to credit fits a transformative paradigm.\n\nSaunders and colleagues also discuss postmodernism, which questions dominant narratives and the language that sustains them. It is less common in applied postgraduate projects."}, {"t": "The research onion, in plain words", "b": "Saunders, Lewis and Thornhill offer a well-known diagram called the 'research onion'. It pictures research decisions as layers you peel from the outside in. In your own words, the layers ask:\n\n• Philosophy: what do I believe about reality and knowledge?\n• Approach to theory development: am I testing theory, building it, or moving between the two (deduction, induction, abduction)?\n• Methodological choice: one kind of data, several of the same kind, or a mix of quantitative and qualitative?\n• Strategy: experiment, survey, case study, ethnography, action research, grounded theory, archival research and so on\n• Time horizon: one point in time or over a period?\n• Techniques and procedures: the actual sampling, data collection and analysis\n\nThe onion is useful as a checklist and a chapter structure. Many business, management and social science programmes in the UK expect it.\n\nUse it with care. Real research moves back and forth between layers; it is not strictly linear. In laboratory sciences and engineering, examiners may find a full onion section unnecessary. And do not paste the diagram without explaining your own choice at each layer. The value is in your reasons, not the picture."}, {"t": "Deductive, inductive and abductive reasoning", "b": "These three words describe how theory and data relate in your study.\n\n• Deductive: start with theory, derive a hypothesis, collect data to test it. Example: theory says trust raises technology adoption, so you hypothesise that farmers who trust extension officers adopt drought-tolerant seed more often, and test it with a survey.\n\n• Inductive: start with data, look for patterns, build a theory or explanation. Example: interview nurses in Lagos about night-shift work and develop a model of how they manage fatigue.\n\n• Abductive: start with a surprising observation and look for the best explanation, moving back and forth between data and theory. Example: a new water filter works in the lab but households stop using it after two months. You collect data, test explanations (taste, cost, maintenance), return to theory, and refine.\n\nDeduction is often linked with positivism and quantitative work; induction with interpretivism and qualitative work; abduction with critical realism and pragmatism. These links are tendencies, not rules.\n\nLanguage tip: 'The study follows a deductive approach, testing hypotheses derived from...', 'An inductive approach was adopted because existing theory offers little explanation of...'."}, {"t": "Writing your justification, and when it is expected", "b": "A strong philosophy section is short, specific and consistent. In a master's dissertation, 300 to 600 words is often enough; a PhD may need more. A simple structure:\n\n1. State the position in one sentence.\n2. Explain what it assumes about reality and knowledge, in plain terms.\n3. Link it to your research question: why does this question need this position?\n4. Name the reasoning (deductive, inductive, abductive) and the strategy it leads to.\n5. Briefly say why you rejected an obvious alternative.\n6. Acknowledge one limitation or how you handle your own values.\n\nAvoid long lists of every paradigm. The examiner wants your choice, not a textbook summary.\n\nWhen is it expected? Business, management, education, social sciences, nursing and many interdisciplinary or sustainability programmes usually expect an explicit section. Many laboratory sciences, engineering and agricultural science theses do not; the philosophy is implicit in the experimental method. Even there, a sentence or two can help when you combine lab work with interviews, surveys or policy analysis.\n\nAlways check your programme handbook and two or three recent dissertations from your department. Conventions differ by field, university and supervisor."}], "examples": [{"label": "A philosophy justification that is linked to the question", "weak": "This research adopts positivism, interpretivism and pragmatism. Positivism believes in one reality. Interpretivism believes in many realities. Pragmatism uses both. The researcher chose pragmatism because it is the best philosophy.", "strong": "This study adopts a pragmatist position because its question is practical: why do smallholder farmers in Benue State stop using improved storage bags after one season? A survey of 300 households will show how widespread discontinuation is and which factors are associated with it, while 20 follow-up interviews will explain the reasons behind those patterns. Neither data set alone would answer both 'how many' and 'why'. A purely interpretivist design was rejected because the project funder needs prevalence estimates.", "why": "The strong version names one position, ties it to the specific question, explains how the methods follow, and gives a reason for rejecting an alternative. The weak version lists paradigms and makes an unsupported claim of 'best'."}, {"label": "Stating the reasoning approach clearly", "weak": "The study used both deduction and induction to get the best results from the data.", "strong": "The study follows a deductive approach. Drawing on the Technology Acceptance Model, it tests two hypotheses: that perceived usefulness and perceived ease of use each predict nurses' intention to use an electronic health record system in three district hospitals in Uttar Pradesh.", "why": "The strong version names the approach, the theory it starts from, and what will be tested. 'Both, to get the best results' is vague and suggests the writer has not decided how theory and data relate."}, {"label": "Matching philosophy and method", "weak": "Adopting an interpretivist philosophy, this study will measure teacher burnout using a 22-item scale administered to 1,200 teachers and test differences between regions with ANOVA.", "strong": "Adopting a post-positivist position, this study will measure teacher burnout using a validated 22-item scale with 1,200 teachers and test regional differences with ANOVA, treating burnout as a measurable construct while recognising that self-report measures are imperfect.", "why": "Large-sample measurement and statistical testing fit post-positivism, not interpretivism. The strong version also shows post-positivist modesty by acknowledging measurement limits."}], "checks": [{"q": "A student asks: 'Does climate anxiety exist as one fixed thing, or does it mean different things in different communities?' Which philosophical term covers this question?", "o": ["Ontology", "Methodology", "Axiology", "Sampling"], "a": 0, "why": "Ontology is about the nature of reality: what exists and in what form. Methodology is about the logic of how you will study it, which comes later."}, {"q": "Which statement best describes epistemology?", "o": ["The list of instruments used to collect data", "Assumptions about what counts as valid knowledge and how we can obtain it", "The ethical approval process for a study", "The statistical software used for analysis"], "a": 1, "why": "Epistemology concerns knowledge: what counts as good evidence and how we come to know. Instruments and software are methods, not epistemology."}, {"q": "A researcher writes: 'I grew up in a mining community, and I recognise this may shape how I interpret miners' accounts, so I kept a reflexive journal.' This mainly addresses:", "o": ["Ontology", "Deduction", "Axiology", "Time horizon"], "a": 2, "why": "Axiology is about the role of values in research. Acknowledging your background and managing its influence is an axiological move."}, {"q": "Which study is the best fit for an interpretivist position?", "o": ["Measuring the effect of fertiliser dose on rice yield in 60 plots", "Estimating the prevalence of hypertension among adults in Accra", "Exploring how widowed women in rural Kenya describe their land rights after a husband's death", "Testing whether interest rates predict SME loan default using ten years of bank records"], "a": 2, "why": "The widowhood study seeks people's meanings and experiences, which is central to interpretivism. The other three measure variables and test or estimate relationships, which fits post-positivism."}, {"q": "A student says: 'I am a positivist, so my survey proves that mentoring causes higher grades.' What is the main problem?", "o": ["Positivists cannot use surveys", "Even under (post-)positivist assumptions, data support or fail to support a claim; they do not prove it, and a survey alone is weak evidence of causation", "Mentoring cannot be measured", "Positivism requires interviews"], "a": 1, "why": "Modern quantitative research accepts that evidence is fallible. Also, a survey shows association; causal claims need stronger designs such as experiments. Positivists do use surveys, so option A is wrong."}, {"q": "Which philosophy is most concerned with identifying underlying mechanisms that produce events in particular contexts?", "o": ["Positivism", "Critical realism", "Constructivism", "Postmodernism"], "a": 1, "why": "Critical realism looks for real but often unobservable mechanisms and asks under what conditions they operate. Positivism focuses more on observable regularities."}, {"q": "Which justification for pragmatism would an examiner find strongest?", "o": ["Pragmatism allows me to use any method I like.", "I chose pragmatism because it is popular in recent studies.", "My question asks both how common waste-sorting is in Nairobi markets and why traders do or do not sort; a survey alone cannot explain reasons and interviews alone cannot estimate prevalence.", "Pragmatism avoids philosophical debates."], "a": 2, "why": "A good pragmatist justification links the choice to a practical question that needs more than one kind of evidence. The other options treat pragmatism as a way to avoid thinking about philosophy."}, {"q": "An engineer notices that a solar dryer performs well in trials but users abandon it. She gathers data, tests possible explanations, revisits theory and refines her explanation. Her reasoning is mainly:", "o": ["Deductive", "Inductive", "Descriptive", "Abductive"], "a": 3, "why": "Abduction begins with a surprising fact and seeks the best explanation by moving between data and theory. It is not purely deductive (no single prior hypothesis) nor purely inductive (theory is used actively)."}, {"q": "In the research onion, which layer would 'case study' belong to?", "o": ["Philosophy", "Approach to theory development", "Strategy", "Time horizon"], "a": 2, "why": "Case study is a research strategy, alongside experiment, survey, ethnography and others. Philosophy and approach are outer layers that inform the choice of strategy."}, {"q": "A materials science MSc student is unsure whether to write a section on paradigms. What is the best advice?", "o": ["Always write at least 2,000 words on paradigms", "Check the programme handbook and recent dissertations in the department; in many lab sciences the philosophy is implicit, though a short statement may help if social data are also used", "Never mention philosophy in a science thesis", "Copy the research onion diagram to be safe"], "a": 1, "why": "Expectations differ by field and institution. Lab sciences often leave philosophy implicit, but programme rules decide, and mixed projects may benefit from a brief statement."}, {"q": "A study co-designs questions with members of a Dalit women's self-help group and aims to change local credit rules. Which paradigm fits best?", "o": ["Critical/transformative", "Positivism", "Post-positivism", "Pure deduction"], "a": 0, "why": "Transformative research openly addresses power and aims for social change, often with participants as partners. The other options do not centre power or participation."}], "checklist": ["Write one sentence answering each question for your study: what is reality like for my topic, how can I know it, and what role do my values play?", "Choose one main philosophical position and write two sentences linking it directly to your research question.", "Check that your methods match: list your data collection and analysis methods and confirm each fits the position you chose.", "Name your reasoning approach (deductive, inductive or abductive) and the theory or observation it starts from.", "Write one sentence explaining why you rejected the most obvious alternative position.", "Read the methodology chapters of two recent dissertations from your department to see how much philosophy is expected.", "Replace any claim to 'prove' with 'provide evidence for', 'support' or 'suggest'."], "practice": "Write a 150-200 word philosophy justification for your own project using the six-step structure in this unit: position, assumptions, link to question, reasoning approach, rejected alternative, and one limitation. Then underline every sentence that mentions your actual topic; if fewer than half do, revise to make it more specific.", "reading": [{"book": "Saunders, M.N.K., Lewis, P. and Thornhill, A. (2023) Research Methods for Business Students. 9th edn. Harlow: Pearson.", "why": "Read the chapter on understanding research philosophy and approaches to theory development. It introduces the 'research onion', compares the main philosophies side by side, and includes a reflective exercise to help you identify your own position."}, {"book": "Clark, T., Foster, L., Sloan, L. and Bryman, A. (2021) Bryman's Social Research Methods. 6th edn. Oxford: Oxford University Press.", "why": "Read the early chapters on the nature and process of social research, especially the discussion of epistemological and ontological considerations and how theory relates to research. Clear for social science, education and health students."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. Thousand Oaks, CA: SAGE.", "why": "Read the opening chapter on selecting a research approach, which explains philosophical worldviews (post-positivist, constructivist, transformative, pragmatic) and how they connect to designs and methods."}], "links": [{"t": "Research Methods Knowledge Base: Positivism and post-positivism", "u": "https://conjointly.com/kb/positivism-and-post-positivism/"}, {"t": "Research Methods Knowledge Base: Deduction and induction", "u": "https://conjointly.com/kb/deduction-and-induction/"}, {"t": "Oklahoma State University open textbook: Paradigmatic methods", "u": "https://open.library.okstate.edu/gognresearchmethods/part/paradigmatic-methods/"}, {"t": "Grad Coach: How to use Saunders' research onion (includes its limitations)", "u": "https://gradcoach.com/how-do-i-use-the-research-onion/"}, {"t": "Stanford Encyclopedia of Philosophy: Abduction", "u": "https://plato.stanford.edu/entries/abduction/"}, {"t": "Stanford Encyclopedia of Philosophy: Pragmatism", "u": "https://plato.stanford.edu/entries/pragmatism/"}]}, {"id": "problem", "title": "Research problem, gap and rationale", "sub": "Showing why your study matters", "goals": ["Distinguish a research problem from a topic, a practical problem and a research question", "Write a problem statement that moves from context to problem, evidence, consequence and gap", "Identify the type of gap your study fills and describe it honestly", "Write a rationale and significance section that shows who benefits and how"], "lessons": [{"t": "What a research problem is", "b": "A research problem is a gap in knowledge or understanding that matters, which your study sets out to address. It is the reason the study exists.\n\nIt helps to separate four things that students often mix up:\n• Topic: the area you are looking at (antibiotic use in poultry farming in Ghana).\n• Practical problem: a situation in the world that causes harm (antibiotic residues in eggs; resistant bacteria).\n• Research problem: what we do not know that prevents us from understanding or fixing the situation (we do not know why farmers use antibiotics preventively despite training that discourages it).\n• Research question: the precise question your study will answer (What beliefs and market pressures shape preventive antibiotic use among small-scale poultry farmers?).\n\nThe research problem sits between the real-world situation and your question. It explains why your question is worth asking.\n\nIn many fields, especially in the social sciences, the problem statement is a named section of a proposal. In science and engineering papers it is usually built into the introduction rather than headed separately. Either way, examiners look for it, and a thesis without a clear problem feels like a description without a purpose."}, {"t": "Practical and conceptual problems", "b": "Booth and colleagues explain that every problem has two parts: a condition (a situation) and a cost (what bad consequence follows if nothing changes). If you cannot name the cost, readers will not see a problem.\n\nPractical problem\nCondition: power outages in a Nairobi hospital.\nCost: vaccines spoil and surgeries are delayed.\nSolved by: action (install backup systems).\n\nConceptual problem\nCondition: we do not know how often outages exceed the cold-chain safe time.\nCost: we cannot judge which backup option is worth buying, so money may be wasted.\nSolved by: knowledge (your research).\n\nMost theses solve conceptual problems. You may hope your findings help solve a practical problem, but your study itself usually delivers understanding, not the fix. Stating this clearly protects you from over-promising.\n\nA common mistake is to describe the practical problem at length (statistics on outages, quotes from news reports) and never say what is unknown. The reader then asks: if the problem is clear, why not just act? Your answer must be: because a specific piece of knowledge is missing, and here is why that matters."}, {"t": "The structure of a problem statement", "b": "A strong problem statement usually takes one to three paragraphs and follows a logical sequence. One useful structure has five parts:\n\n• Context: the setting and why the area is important. Keep it brief, two or three sentences.\n• Problem: the specific issue or difficulty. Name it directly.\n• Evidence: data and citations that show the problem is real and serious, not your opinion.\n• Consequence: what happens if the problem continues, and who is affected.\n• Gap: what existing research has not yet explained, and why that matters.\n\nMany writers end with a purpose sentence that links the gap to the study: 'This study therefore aims to …'.\n\nThis pattern closely matches how introductions are built in many fields. Swales' CARS model, which you will meet in the introductions unit, describes a similar movement from establishing a territory to showing a niche and then occupying it. Creswell and Creswell describe a related 'deficiencies' approach for introductions.\n\nThe order can vary. Some writers begin with the problem itself for impact. What matters is that all parts are present, and that the gap leads naturally to your aim. If the aim seems to come from nowhere, the problem statement has not done its job."}, {"t": "Evidence: proving the problem is real", "b": "Examiners distrust problem statements built on adjectives such as 'serious', 'alarming' or 'huge' with no support. Evidence turns a claim into a credible problem.\n\nGood kinds of evidence:\n• Statistics from reliable sources: national statistics offices, WHO, World Bank, UN agencies, sector regulators.\n• Peer-reviewed studies that measured the problem.\n• Official reports and policy documents that name the issue as a priority.\n• Your own preliminary data or pilot observations, clearly labelled.\n\nPractical rules:\n• Give the number, the year and the source: 'In 2022, about one in three …'. Avoid 'many people' when you can say how many.\n• Use recent figures when they exist, and say if newer data are not available.\n• Match the evidence to your scale. If your study is in one state or district, national averages may hide local differences; local data are better if they exist.\n• Do not cherry-pick. If some studies show the problem is shrinking, say so and explain why your focus still matters.\n\nIn some contexts, official data are incomplete or delayed. Say this openly. Data scarcity can itself be part of the problem your study addresses."}, {"t": "Types of research gaps", "b": "A gap is a specific thing that existing research has not done, shown or explained. Naming the type of gap helps you describe it precisely. Miles (2017) proposed a widely shared list of seven types, summarised here in plain terms:\n\n• Evidence gap: findings conflict or contradict each other.\n• Knowledge gap: the topic or relationship has hardly been studied.\n• Practical-knowledge conflict: what practitioners do differs from what research recommends.\n• Methodological gap: earlier studies used methods that limit their conclusions (only surveys, small samples, lab conditions).\n• Empirical gap: a claim or theory has not been tested with real data.\n• Theoretical gap: a theory does not explain the phenomenon, or has not been applied to it.\n• Population gap: a group or setting is under-studied, and there is reason to think results may differ there.\n\nSandberg and Alvesson (2011) offer a useful warning. Most researchers build questions by 'gap-spotting' within existing assumptions. They argue that more interesting research sometimes challenges those assumptions instead, which they call problematisation. For a first thesis, a well-argued gap is fine. But ask yourself whether the field's usual assumptions really fit your setting."}, {"t": "Claiming a gap honestly", "b": "Gap claims are where many students lose credibility. 'There are no studies on this topic' is risky: an examiner who knows one such study will doubt the rest of your work.\n\nSafer and more precise ways to claim a gap:\n• Describe what has been done first, then what has not: 'Studies in Europe have measured …; however, none of the studies identified in this review examined … .'\n• Limit the claim to your search: 'In a search of Scopus and Web of Science for 2010 to 2025, no study was found that … .'\n• Use hedging where appropriate: 'little is known about', 'has received limited attention', 'remains unclear'.\n• Explain why the gap matters. A gap is only worth filling if the missing knowledge would change understanding or practice.\n\nA location gap ('not yet studied in Pakistan') becomes convincing when you explain what is different there: climate, regulations, institutions, culture, infrastructure, or prices that could change the result.\n\nUseful language:\n• 'Although X has been widely studied, its relationship with Y in … settings has not been examined.'\n• 'Previous studies have relied mainly on …, which cannot capture … .'\n• 'Findings on … remain inconsistent, with some studies reporting … and others … .'"}, {"t": "Justification and significance", "b": "Justification answers: why should this study be done now? Significance answers: what difference will the results make, and for whom?\n\nThink about significance at several levels:\n• Theoretical: will the study test, extend or challenge a theory or model?\n• Methodological: will it develop or validate a method, tool or measure others can use?\n• Practical and policy: will practitioners, managers, regulators, communities or industries be able to act differently?\n• Empirical: will it provide new data for an under-studied setting or population?\n\nName specific users where you can: 'county water engineers', 'the state primary healthcare board', 'smallholder cooperatives'. Vague claims like 'the study will benefit society and future researchers' add nothing; every study says that.\n\nKeep significance proportional. A master's study of 40 schools will not 'transform education policy in Africa'. It can 'provide evidence that district officers can use when allocating teaching assistants'. Modest, specific claims are more convincing than large, vague ones.\n\nIn US-style theses there is often a section called 'Significance of the study'. UK and Commonwealth proposals often use 'Rationale' or 'Justification'. Engineering and science papers often call it 'motivation'. Check your institution's template."}, {"t": "Writing a rationale", "b": "A rationale is a short argument that connects the problem, the gap and your chosen approach. If the problem statement says 'this is what is wrong and unknown', the rationale says 'this is why this particular study, done this way, is a sensible response'.\n\nA rationale typically covers:\n• Why the problem is important now (a new policy, a crisis, a technology change, new data available).\n• Why the gap matters for the problem.\n• Why your design and setting are suitable for filling the gap.\n• What the study will contribute.\n\nA simple sequence you can follow:\n1. 'X is a growing concern because …'\n2. 'Existing research has shown …, but has not …'\n3. 'This matters because, without it, …'\n4. 'A study that … in … is therefore needed.'\n5. 'Its findings will help … to … .'\n\nKeep the rationale tight: 200 to 400 words in a proposal is common, though this varies by programme. Avoid personal motivation as the main justification ('I have always been interested in …'). Your interest can appear briefly, but the case must rest on evidence and the gap. Some programmes, especially in education and qualitative social research, do welcome a short reflexive note on your position."}, {"t": "Common problems with problem statements", "b": "Check your draft against these frequent weaknesses:\n\n• No problem at all, just background. Pages of description about a sector, with no clear statement of what is wrong or unknown.\n• A solution disguised as a problem. 'The problem is the lack of solar irrigation pumps' assumes the answer. Ask instead what is unknown, for example why adoption is low.\n• Unsupported claims. Strong adjectives without numbers or citations.\n• A gap that does not match the aim. The problem talks about water quality, but the aim is about farmer attitudes to irrigation.\n• Too many problems. Listing six problems leaves readers unsure which one your study addresses. Focus on one central problem.\n• Over-claiming novelty. 'This is the first study ever …' without evidence.\n• Global framing for a local study. Starting with world statistics and never reaching the local setting.\n\nA quick test: ask a classmate to read only your problem statement and tell you, in one sentence, what your study will do. If they can, the statement works. If they guess wrongly, the problem and gap are not yet clear enough."}], "examples": [{"label": "From background to a real problem statement", "weak": "Agriculture is very important to Nigeria's economy. Many people are farmers. Climate change is a big problem all over the world. This study will look at climate change and farmers.", "strong": "Rain-fed rice supplies most of the rice grown in Nigeria's Niger State, yet planting-season rainfall there has become more erratic over the past two decades (cite meteorological data). Farmers who mistime planting can lose a large share of their harvest (cite study), which threatens household food security. Seasonal forecasts are now issued nationally, but studies have mostly examined whether farmers receive them, not whether they act on them. It therefore remains unclear why forecast access has not translated into changed planting dates. This study investigates that gap.", "why": "The strong version moves through context, problem, evidence, consequence and gap, and ends with a link to the study. The weak version stays general and never says what is unknown."}, {"label": "Claiming a gap precisely", "weak": "There is no research on mental health of university students in Kenya.", "strong": "Studies of student mental health in Kenya have focused mainly on prevalence of depression among undergraduates. In a search of PubMed and African Journals Online (2015 to 2025), no study was found that examined how postgraduate students access campus counselling services, although postgraduates face distinct pressures such as funding insecurity and supervisor relationships.", "why": "The strong version acknowledges existing work, limits the claim to a stated search, and explains why the under-studied group might differ."}, {"label": "Specific rather than vague significance", "weak": "This study will be useful to the government, NGOs, students and the whole society. It will also serve as a reference for future researchers.", "strong": "The findings will give the Punjab Agriculture Department evidence on which extension channels (field days, radio or SMS) are associated with adoption of laser land levelling, helping it target its limited extension budget. Methodologically, the study will test a short adoption survey that other provinces could reuse.", "why": "The strong version names a specific user, decision and contribution. The weak list could be pasted into any thesis and so tells the reader nothing."}], "checks": [{"q": "Which statement is a research problem, not a topic or a practical problem?", "o": ["Plastic waste in Lagos lagoons", "Plastic waste is blocking drains and causing floods in Lagos.", "It is not known which sources contribute most to plastic waste entering Lagos lagoons, so clean-up and prevention efforts cannot be targeted.", "How much plastic is in the lagoons?"], "a": 2, "why": "C states what is unknown and why it matters. A is a topic, B a practical problem (a harmful situation), and D is a question without a stated problem."}, {"q": "In Booth et al.'s terms, every problem has a condition and a ...", "o": ["Cost or consequence that follows if nothing changes", "Hypothesis", "Sample size", "Theoretical framework"], "a": 0, "why": "Without a cost, a condition is just a fact. The cost is what makes readers care."}, {"q": "A problem statement contains context, evidence and consequences, but readers still ask 'So what does your study do?'. What is most likely missing?", "o": ["More statistics", "A longer introduction", "The references list", "A clear gap that links the problem to the study's aim"], "a": 3, "why": "The gap explains what is unknown and leads to the aim. More statistics (A) would make the problem more vivid but would not show what the study adds."}, {"q": "'Some studies find microfinance improves women's incomes in Bangladesh, while others find no effect.' Which type of gap does this describe?", "o": ["Population gap", "Evidence gap (conflicting findings)", "Methodological gap", "Theoretical gap"], "a": 1, "why": "Contradictory findings are an evidence gap. A methodological explanation might follow, but the gap as stated is conflicting evidence."}, {"q": "Which gap claim is most credible?", "o": ["This is the first study of its kind in the world.", "Nobody has ever studied this.", "Within the studies identified in a search of three databases, none measured X in low-income housing, where ventilation patterns differ.", "There is a big gap in the literature."], "a": 2, "why": "C limits the claim to a stated search and explains why the setting matters. A and B are absolute claims an examiner can easily disprove."}, {"q": "A student writes: 'The problem is that farmers do not have drip irrigation kits.' What is the weakness?", "o": ["It assumes the solution instead of stating what is unknown", "It is too short", "It uses the word 'farmers'", "It needs a hypothesis"], "a": 0, "why": "This is a solution dressed as a problem. A research problem would ask, for example, why adoption of drip kits remains low where they are available."}, {"q": "Which significance statement is best for a master's study of 60 secondary schools in one Ghanaian region?", "o": ["The study will transform education across Africa.", "The study will be important for everyone.", "The study will help future researchers.", "The findings can help regional education officers decide which schools to prioritise for the science laboratory upgrade programme."], "a": 3, "why": "D names a specific user and decision and is proportional to the study's scale. A over-claims; B and C are generic."}, {"q": "Previous studies of a crop disease used only laboratory trials. Your study will test the same treatment in farmers' fields. This addresses mainly a ...", "o": ["Population gap", "Practical-knowledge conflict", "Methodological gap", "Theoretical gap"], "a": 2, "why": "The limitation lies in how earlier studies were done (lab only), so field testing fills a methodological gap. It may also have empirical value, but method is the main issue."}, {"q": "What is the main difference between a problem statement and a rationale?", "o": ["There is no difference; the terms are always identical", "The problem statement shows what is wrong and unknown; the rationale argues why this particular study and approach are a sensible response", "The rationale lists references only", "The problem statement is written after the results"], "a": 1, "why": "The two overlap and some templates merge them, but the rationale adds the argument for this study and design. They are not always identical (A)."}, {"q": "Your problem statement opens with three paragraphs of global statistics on diabetes and never mentions your setting, a district hospital in Odisha. What should you do?", "o": ["Shorten the global context to a sentence or two and move quickly to evidence from India, Odisha or similar districts", "Add more global statistics", "Remove all statistics", "Move the global statistics to the conclusion"], "a": 0, "why": "Context should be brief and lead to your setting. Evidence at the scale of your study is more convincing than world averages."}, {"q": "According to Sandberg and Alvesson (2011), what is 'problematisation'?", "o": ["Listing as many problems as possible", "Finding a missing population in the literature", "Writing the problem statement last", "Questioning the assumptions that existing research takes for granted, rather than only filling gaps within them"], "a": 3, "why": "They contrast gap-spotting, which accepts existing assumptions, with problematisation, which challenges them. Finding a missing population (B) is gap-spotting."}], "checklist": ["Write one sentence each for your topic, practical problem, research problem and main question, and check they are different.", "Name the condition and the cost of your problem in one line each.", "Find at least three pieces of evidence (with year and source) at the scale of your study.", "Identify which type of gap your study fills, and write the gap sentence using 'Although … , … has not been … .'", "Replace any 'no studies exist' claim with a description of what was searched and what was found.", "List two specific users of your findings and the decision each could make differently.", "Ask someone to read your problem statement and tell you in one sentence what your study will do."], "practice": "Write a five-sentence problem statement for your project: one sentence each for context, problem, evidence (with a cited figure), consequence and gap. End with one sentence beginning 'This study therefore …'. Check that the final sentence follows logically from the gap.", "reading": [{"book": "Booth, W.C., Colomb, G.G., Williams, J.M., Bizup, J. and FitzGerald, W.T. (2024) The Craft of Research. 5th edn. University of Chicago Press.", "why": "Read the chapter 'From Questions to a Problem' for the distinction between practical and conceptual problems and the condition-plus-cost idea, and the chapter on introductions for how to present a problem to readers."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "Read the chapter 'The Introduction', which sets out a model for introducing a research problem by moving from the issue to deficiencies in past research and the audiences who will benefit."}, {"book": "Punch, K.F. (2016) Developing Effective Research Proposals. 3rd edn. SAGE.", "why": "Read the chapters on understanding readers' expectations and on writing the proposal, which explain how reviewers judge the problem, context and justification sections."}], "links": [{"t": "USC Libraries: The research problem/question", "u": "https://libguides.usc.edu/writingguide/introduction/researchproblem"}, {"t": "Manchester Academic Phrasebank: Introducing work (importance, gaps, purpose)", "u": "https://www.phrasebank.manchester.ac.uk/introducing-work/"}, {"t": "University of Manchester Lantern: Types of research gaps (Miles 2017)", "u": "https://lantern.humanities.manchester.ac.uk/?p=11666"}, {"t": "Sandberg and Alvesson (2011): Gap-spotting or problematization? (record)", "u": "https://www.lunduniversity.lu.se/lup/publication/b3784fb2-62b8-4e2a-af84-e18c9cb079b3"}]}, {"id": "proposal", "title": "Writing a research proposal", "sub": "Argue that your study is worth doing", "goals": ["Explain who reads research proposals and what each reader needs to see", "Structure a proposal with aligned aims, objectives, questions and methods", "Plan a realistic timeline, budget and ethics section that show feasibility", "Adapt a proposal to its purpose, from a PhD admission proposal to a full dissertation proposal"], "lessons": [{"t": "What a proposal is, and who reads it", "b": "A research proposal is a plan for a study you have not yet done. But it is more than a plan. It is an argument: this question matters, it has not been answered well, and I can answer it with these methods, in this time, with these resources.\n\nDifferent readers look for different things:\n• Admissions panels and potential supervisors ask: Is this person ready for research? Does the topic fit our expertise? Is the idea clear and original enough?\n• Funders ask: Is this important, and does it match our priorities? Is it value for money? Will it be finished?\n• Ethics committees ask: Are participants and the environment protected?\n• Your supervisor and progression panel ask: Is the design sound? Is the scope manageable? What could go wrong?\n\nSo before you write, find out exactly who will read it and what they will judge it on. Look for a template, word limit or scoring criteria from the university or funder, and follow them exactly. Some funders reject proposals that break formatting rules before anyone reads them.\n\nA proposal is also a tool for you. Writing it forces you to make decisions early, and it becomes the backbone of your first chapters."}, {"t": "The standard structure", "b": "Proposals vary by field and institution, but most contain the same building blocks. Use your template's headings when you have one. If not, this order works for most fields:\n\n• Title: specific and informative, naming the topic, setting and often the approach.\n• Abstract or summary: 150 to 300 words covering problem, aim, methods and expected contribution.\n• Background and problem statement: the context, and the specific problem your study tackles.\n• Aim, objectives and research questions (or hypotheses).\n• Literature review: a focused account of what is known and the gap.\n• Conceptual or theoretical framework: the ideas that guide what you look at.\n• Methodology: design, data, sampling, analysis, validity and limitations.\n• Ethics: risks, consent, data protection, approvals needed.\n• Timeline: often a Gantt chart (a bar chart of tasks over time).\n• Resources and budget: equipment, travel, software, fieldwork costs.\n• Expected contributions: to knowledge, practice or policy.\n• References.\n\nThe sections must connect. Your problem leads to your aim. The aim breaks into objectives. Each objective has a question and a method. The methods produce the expected contributions. Reviewers trace this chain. A break anywhere, such as a question no method answers, is one of the most common weaknesses."}, {"t": "Background and problem statement", "b": "The background moves from broad to narrow, like a funnel. Start with why the general area matters, using a few strong facts with citations. Then narrow to your setting. Then state the specific problem.\n\nA problem statement is not a topic. \"Food waste in Nigeria\" is a topic. A problem shows something wrong, uncertain or unknown, and why it matters. For example: tomato farmers in northern Nigeria lose a large share of their harvest after picking, yet storage studies have tested technologies only in research stations, not in farmers' own conditions. We therefore do not know which low-cost options work in practice.\n\nA strong problem statement:\n• names the specific situation and people or system affected;\n• gives evidence that the problem is real (data, reports, published studies);\n• shows what is not yet known or not yet solved (the gap);\n• hints at the consequence of leaving it unsolved.\n\nKeep it short: often one to three paragraphs in an admission proposal. Avoid emotional claims without evidence and avoid saying \"no research has ever been done\" unless you have searched systematically. \"Few studies have examined\" or \"evidence from West Africa is limited\" is safer and usually more accurate.\n\nUseful pattern: \"Although X is well established, little is known about Y in Z. This matters because...\""}, {"t": "Aims, objectives and research questions", "b": "These three terms are related but not the same.\n\n• The aim is one sentence stating the overall purpose. \"To evaluate the performance of solar-powered cold rooms for smallholder tomato storage in Kano State.\"\n• Objectives are the concrete steps that achieve the aim. Three to five is typical. Start each with an action verb: to measure, to compare, to identify, to assess, to develop. Good objectives are specific and achievable within your time and budget.\n• Research questions turn objectives into questions your data can answer. Some fields, especially experimental sciences and quantitative social science, use testable hypotheses instead of, or as well as, questions.\n\nCheck alignment: each objective should match at least one question, and together they should fully deliver the aim. If an objective has no method in your methodology section, delete it or add the method.\n\nAvoid vague verbs such as \"to understand\", \"to look at\" or \"to explore everything about\". Avoid objectives that are really activities, such as \"to review literature\", unless your template asks for them; reviewing literature is part of every study. Avoid an aim so broad that it would need ten PhDs, such as solving food insecurity in Africa."}, {"t": "Literature and framework in a proposal", "b": "The literature section of a proposal is shorter and more targeted than a thesis literature review. Its job is to show three things: you know the key work in the area, you can judge it critically, and there is a real gap your study will fill.\n\nOrganise it by themes or debates, not by author. For each theme, say what is known, how strong the evidence is, and what is missing. End with a clear statement of the gap and how your study addresses it.\n\nInclude recent work, often from the last five to ten years, plus the classic studies that everyone in your field cites. Use peer-reviewed journals first. Include relevant work from your own region, which shows contextual knowledge and is often overlooked by others.\n\nA conceptual or theoretical framework tells the reader which ideas guide your study. A theoretical framework uses an existing theory, such as the Technology Acceptance Model in information systems or the sustainable livelihoods framework in rural development. A conceptual framework is often your own diagram of the key concepts and how you expect them to relate. In engineering and natural sciences, this section may be replaced by the scientific principles or models you will apply.\n\nExplain briefly why you chose the framework and how it shapes your data collection and analysis."}, {"t": "Methodology: showing how and showing you can", "b": "The methodology section is where many proposals succeed or fail. Reviewers want to see that your methods can really answer your questions.\n\nCover:\n• Research design: experimental, survey, case study, mixed methods, modelling, and so on. Say why this design suits your questions.\n• Setting and sample: where, who or what, how many, and how selected. Justify the sample size, for example with a power calculation for experiments and surveys, or saturation and information power for interviews.\n• Data collection: instruments, measurements, equipment, procedures.\n• Analysis: the specific statistical tests, models or qualitative approach (such as thematic analysis), matched to each question.\n• Quality: validity and reliability in quantitative work; trustworthiness (credibility, dependability) in qualitative work.\n• Limitations and risks, with a plan for each.\n\nA very useful tool is an alignment table with columns for objective, research question, data needed, method of collection and method of analysis. It lets you and your reader check that nothing is missing.\n\nBe specific. \"Data will be analysed using appropriate statistical methods\" tells the reader nothing. \"Differences in weight loss between the three storage methods will be tested using one-way ANOVA with Tukey post-hoc comparisons\" shows you know what you are doing."}, {"t": "Ethics, timeline, resources and risks", "b": "These sections prove feasibility: that you can actually do the study.\n\nEthics: describe the main risks and how you will manage them, the consent process, data protection, and the approvals you will seek, including local permissions if you will collect data in another country. Even non-human studies may need safety or environmental permits.\n\nTimeline: break the project into phases and show them on a Gantt chart. For a three-to-four-year PhD, typical phases are literature and design, ethics approval, pilot study, main data collection, analysis, writing and revision. Build in time for delays such as slow approvals, equipment failure or the rainy season disrupting fieldwork. Show milestones, such as confirmation or candidacy review, and conference or paper targets.\n\nResources and budget: list what you need (lab access, equipment, consumables, software, travel, transcription, participant compensation) and what you already have. Funders want each cost to be justified and realistic. Do not inflate, but do not under-cost to look cheap; reviewers notice both.\n\nRisk management: a small table works well. List each risk (for example, low survey response or access withdrawn by a company), its likelihood and impact, and your backup plan. Showing you have thought about what could go wrong makes reviewers more confident, not less."}, {"t": "Length, purpose and expected contributions", "b": "Length depends on purpose, so always check the rules.\n\n• PhD admission proposals in the UK are often around 1,500 to 3,000 words. Some forms allow only one page. They are judged mainly on clarity, fit and promise, and everyone expects the project to change later.\n• Funding proposals have strict word or page limits and fixed sections. They also need a strong statement of impact and value for money.\n• Dissertation or thesis proposals, written after you start, are much fuller. Depending on the programme, this may be a confirmation or upgrade report in the UK, or a candidacy or comprehensive proposal in North America. It can run to many thousands of words. In many North American programmes it consists of draft introduction, literature review and methods chapters, defended before a committee.\n\nIn all types, end with expected contributions. Be specific and modest:\n• to knowledge (new evidence, a new model, a test of a theory in a new context);\n• to methods (a new instrument or approach);\n• to practice or policy (who could use the findings, and how).\n\nWrite \"this study is expected to provide\" rather than \"this study will prove\". You cannot promise findings before collecting data. Link each contribution back to the gap you identified."}, {"t": "How proposals are judged and common mistakes", "b": "Reviewers usually judge proposals on a small set of questions, whether or not they are written down:\n\n• Significance: does the problem matter, and to whom?\n• Originality: does the study add something new, even if modest?\n• Clarity: can a busy expert understand the plan in one reading?\n• Coherence: do problem, aims, questions and methods fit together?\n• Feasibility: can this person do it with this time, money and access?\n• Fit: does it match the supervisor's expertise, department or funder priorities?\n\nCommon reasons for rejection include: a topic too broad to finish; no clear question; a literature section that only summarises; vague methods; no evidence of access to data or sites; ignoring ethics; and a poor match with the supervisor. Copying a generic proposal from the internet or using AI-generated text without real thought is easy for experienced readers to spot.\n\nLanguage tips for multilingual writers:\n• Use future tense for plans: \"This study will survey 300 households.\"\n• Use hedging for outcomes: \"The findings may help...\"\n• Keep one idea per sentence in the methods section.\n• Read your proposal aloud. If you run out of breath, split the sentence.\n\nFinally, ask someone outside your field to read your summary. If they cannot say what you will do and why, revise."}], "examples": [{"label": "A problem statement in public health (illustrative)", "weak": "Malaria is a very big problem in the world and in India. Many people die from it every year. This research will study malaria.", "strong": "Odisha accounts for a large share of India's reported malaria cases, and many occur in forested tribal districts. Bed-net distribution has expanded, but surveys suggest nets are often not used during the hot season. Few studies have examined why household use drops seasonally in these districts. Without this evidence, distribution campaigns may continue to supply nets that are not used when transmission is highest.", "why": "The weak version names only a topic. The strong version narrows to a place, a population and a behaviour, gives evidence, states what is unknown and explains the consequence. (In a real proposal each claim would carry a citation.)"}, {"label": "Aim and objectives in environmental engineering", "weak": "Aim: To study wastewater. Objectives: 1. To review literature. 2. To understand wastewater treatment. 3. To look at results.", "strong": "Aim: To assess the removal of organic matter and nitrogen from dairy wastewater by a laboratory sequencing batch reactor. Objectives: 1. To characterise the dairy wastewater (COD, nitrogen, phosphorus, pH). 2. To measure removal efficiencies at three organic loading rates. 3. To relate sludge settling properties to treatment performance.", "why": "The strong aim names the system, the process and the outcome. Each objective starts with a measurable verb and maps directly to data the student will collect. 'Review literature' is dropped because it is part of every study."}, {"label": "A methods sentence in business research", "weak": "Data will be collected using questionnaires and analysed with SPSS.", "strong": "A structured questionnaire, adapted from validated scales on job satisfaction and intention to leave, will be administered to nurses in four private hospitals in Nairobi, aiming for 320 responses based on a power calculation. Relationships between satisfaction, workload and intention to leave will be tested using multiple regression in SPSS, controlling for age and years of service.", "why": "The strong version names the instrument and its origin, the setting, the sample size with justification, and the specific analysis linked to the question. Software is a tool, not a method."}], "checks": [{"q": "Which of these research aims is most suitable for a three-year PhD?", "o": ["To solve water scarcity in sub-Saharan Africa", "To evaluate the effect of drip irrigation scheduling on tomato yield and water use in two districts of northern Ghana", "To look at irrigation", "To understand everything about farmers' water use"], "a": 1, "why": "It is specific about intervention, outcomes and setting, and it is achievable. The others are either far too broad or too vague to guide methods."}, {"q": "A reviewer notes that 'Objective 3 has no corresponding method.' What does this mean?", "o": ["The objective is too short", "The literature review is missing", "The objective should be a hypothesis", "The proposal's alignment chain is broken: nothing in the methodology will deliver that objective"], "a": 3, "why": "Every objective needs a method. An alignment table (objective, question, data, collection, analysis) helps you catch this before submission."}, {"q": "Which sentence is the best way to state a gap?", "o": ["No one has ever studied this topic", "This topic is interesting", "Although mobile money adoption is well documented in urban Kenya, evidence on its use by rural women traders remains limited", "There are many problems in this area"], "a": 2, "why": "It states what is known, then what is not, in a specific context. Claiming 'no one has ever studied this' is risky unless you have searched systematically."}, {"q": "What is the main purpose of a Gantt chart in a proposal?", "o": ["To show tasks and phases over time, demonstrating feasibility", "To present expected results", "To list references", "To display the budget"], "a": 0, "why": "A Gantt chart shows when each task happens. Reviewers use it to judge whether the plan is realistic."}, {"q": "For a UK PhD admission proposal, which length is most typical?", "o": ["About 200 words", "At least 20,000 words", "Around 1,500 to 3,000 words, unless the university states otherwise", "Length does not matter"], "a": 2, "why": "Many UK universities ask for roughly 1,500 to 3,000 words. Always check the specific limit; some application forms allow only one page."}, {"q": "Which expected-contribution statement is best?", "o": ["This study will prove that the policy failed", "This study will change the world", "This study will contribute to knowledge", "This study is expected to provide the first field-based evidence on storage losses under farmers' own conditions in Kano State, which extension services could use to target support"], "a": 3, "why": "It is specific about what is new, where, and who could use it, and it uses cautious language. Proposals cannot promise findings in advance."}, {"q": "Which methods statement would a reviewer find most convincing?", "o": ["Twenty semi-structured interviews with secondary-school head teachers in two districts will be analysed using reflexive thematic analysis", "Data will be analysed using appropriate methods", "Interviews will be conducted with relevant people", "Software will be used to analyse data"], "a": 0, "why": "It specifies the method, the participants, the number and the analytic approach. The others are too vague to judge."}, {"q": "A student writes 'To review the literature' as Objective 1. What is the best advice?", "o": ["Keep it, because it is the most important objective", "Remove it or reframe it, because reviewing literature is part of every study, not a research objective", "Make it the aim", "Turn it into a hypothesis"], "a": 1, "why": "Objectives should describe what the study will find out or produce. Literature review is an activity everyone does, unless your template specifically asks for it."}, {"q": "What is the key difference between a PhD admission proposal and a dissertation proposal written in year one?", "o": ["They are identical", "The admission proposal must include results", "Dissertation proposals have no methodology", "The admission proposal is shorter and judged on promise and fit; the dissertation proposal is fuller and tests the detailed design"], "a": 3, "why": "Admission panels expect the project to change. Dissertation proposals, such as confirmation reports or candidacy proposals, are judged on a detailed, workable plan."}, {"q": "Which item belongs in a risk management section?", "o": ["The research
