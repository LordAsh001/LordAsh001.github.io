They show which debate you are joining and what position you will argue, without the full apparatus of a thesis chapter."}, {"q": "Move 2 says little is known about rural women's access to credit. Move 3 says 'This study examines urban youth unemployment.' What is wrong?", "o": ["Move 3 should come first", "Nothing; the moves are independent", "Move 3 must include statistics", "The aim does not fill the niche that was created"], "a": 3, "why": "Move 3 must respond directly to the niche in Move 2. A mismatch makes the reader doubt that the study addresses the stated gap."}, {"q": "Which statement about the CARS model is most accurate?", "o": ["It is a fixed rule every introduction must follow word for word", "It applies only to theses", "It describes a pattern common in successful introductions and is useful for planning and checking", "It was designed for writing conclusions"], "a": 2, "why": "CARS came from analysing real introductions. It describes typical moves, which can repeat or vary, so it works best as a guide rather than a template."}, {"q": "Which opening sentence is best for an engineering paper on bridge inspection?", "o": ["'Bridges have existed since ancient times.'", "'Corrosion of steel reinforcement is a leading cause of deterioration in reinforced concrete bridges, yet visual inspection often detects it late.'", "'In this modern world, technology is everywhere.'", "'This paper uses drones.'"], "a": 1, "why": "It establishes importance with a specific problem and already hints at a niche. The others are empty, too general, or jump to the method without context."}], "checklist": ["Label each paragraph of your introduction as Move 1, Move 2 or Move 3, and check that all three are present in that order.", "Underline the sentence that states your gap and make sure it explains why the gap matters, not only that it exists.", "Check that your aim directly answers the gap you stated.", "Rewrite your aim or objectives using checkable action verbs (measure, compare, identify, develop), not 'understand' or 'know'.", "Add one or two sentences stating your contribution in specific, modest terms.", "Read only the first sentence of each paragraph and confirm they narrow steadily from broad to specific.", "Compare your introduction's length and elements with two recent papers in your target journal or two recent theses from your programme."], "practice": "Write a three-sentence 'mini-introduction' for your own project: one sentence for each CARS move. Then expand each sentence into a short paragraph, adding citations for Moves 1 and 2.", "reading": [{"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "Read the unit on constructing the research paper that covers introductions. It presents the move structure with authentic examples and tasks, and was written for graduate students using English as an additional language. A 4th edition is announced for 2027."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "Read the chapter on writing the introduction. It breaks introductions into a model of stages and gives a bank of vocabulary and grammar for each stage, which is ideal if you write in science or engineering."}, {"book": "Gastel, B. and Day, R.A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Read the chapter on how to write the introduction for concise advice on scope, length and what to include in a journal article."}], "links": [{"t": "Manchester Academic Phrasebank: Introducing work", "u": "https://www.phrasebank.manchester.ac.uk/introducing-work/"}, {"t": "Chalmers Writing Guide: Introduction and the CARS model", "u": "https://writing.chalmers.se/introduction"}, {"t": "UNC Writing Center: Scientific reports (section on introductions)", "u": "https://writingcenter.unc.edu/tips-and-tools/scientific-reports/"}]}, {"id": "litrev", "title": "Writing the literature review", "sub": "From reading to argued synthesis", "goals": ["Choose a suitable review type and search the literature systematically", "Organise sources by theme, method, theory or time, and synthesise rather than summarise", "Evaluate evidence critically and state precise, defensible research gaps", "Structure a literature review chapter that leads logically to your own study"], "lessons": [{"t": "What a literature review is for", "b": "A literature review is a critical, organised account of what is already known about your topic. In a thesis or dissertation it is usually a chapter of its own. In a journal article it is often part of the introduction.\n\nIt has several jobs:\n• to show the reader the state of knowledge, including key debates;\n• to show that you know the field well enough to contribute to it;\n• to evaluate the quality of existing evidence;\n• to identify a gap, problem or unresolved question;\n• to justify your research questions, methods and framework.\n\nThe most important point: a literature review is an argument, not a list. Its overall message is something like, \"Here is what we know, here is how well we know it, and here is the specific thing we still need to find out, which my study addresses.\" Every paragraph should help build that argument.\n\nWeak reviews read like a queue of summaries: \"Smith (2018) found... Jones (2019) found... Ali (2020) found...\" Strong reviews are built around ideas, and sources appear as evidence for claims the writer makes.\n\nExpectations differ by field. In laboratory sciences the review is often shorter and more focused on recent findings and methods. In social sciences and education it may be a long chapter that also develops a theoretical framework."}, {"t": "Types of review", "b": "Not all reviews are the same. Grant and Booth (2009) described 14 review types. The four you will meet most often are:\n\n• Narrative (traditional) review: the writer selects and discusses the most relevant literature to build an argument. Flexible and common in theses, but open to selection bias, because the search is rarely fully reported.\n• Systematic review: answers a focused question using a pre-planned, documented search, explicit inclusion criteria, quality appraisal and transparent reporting. It aims to find all relevant studies. It may include meta-analysis (statistically combining results). Common in health, increasingly in education, environment and engineering.\n• Scoping review: maps the size and nature of the literature on a broad topic, identifies key concepts and gaps, and usually does not judge the quality of each study in detail. Useful when a field is new or scattered.\n• Integrative review: combines different kinds of evidence, such as experimental and qualitative studies or theory and data, to build a fuller understanding.\n\nA thesis literature review chapter is usually narrative, but it benefits from systematic habits: a clear search strategy, stated criteria and a record of what you found. Some PhDs include a full systematic or scoping review as a separate chapter or paper. Choose the type that fits your question, and name it correctly."}, {"t": "Searching the literature", "b": "Good reviews start with a good search. Plan it and record it.\n\n1. Break your question into key concepts. For \"effect of mobile phone reminders on vaccination uptake in Kenya\", the concepts are mobile reminders, vaccination and Kenya or East Africa.\n\n2. List synonyms for each concept: \"SMS\", \"text message\", \"mHealth\"; \"immunisation\", \"immunization\", \"vaccine uptake\".\n\n3. Combine with Boolean operators: OR within a concept, AND between concepts. Use truncation where the database allows it, for example immuni* to catch immunisation and immunization. Put phrases in quotation marks.\n\n4. Search more than one database. Choose by field: Scopus and Web of Science are broad; PubMed for health; ERIC for education; CAB Abstracts for agriculture; IEEE Xplore for engineering. Google Scholar is useful but hard to search systematically. African Journals Online (AJOL) and regional databases find work that major indexes miss.\n\n5. Chase citations: check the reference lists of key papers (backward) and who has cited them since (forward).\n\n6. Keep a search log: date, database, exact search string, filters and number of results. This lets you repeat the search and report it honestly.\n\nAsk your subject librarian for help. They are experts in search strategy, and the service is free."}, {"t": "Screening and the PRISMA idea", "b": "A search may return hundreds or thousands of records. Screening is how you decide which to keep.\n\nFirst, set inclusion and exclusion criteria before you screen. Common criteria are topic, population, setting, study type, publication years, and language. Write down the reason for each one. For example, you might include studies from 2010 onwards because mobile phone ownership expanded rapidly after then.\n\nThen screen in stages:\n• Remove duplicates (a reference manager helps).\n• Screen titles and abstracts against the criteria.\n• Read the full text of those that pass, and record the reason for each exclusion.\n\nPRISMA (Preferred Reporting Items for Systematic reviews and Meta-Analyses) is a reporting guideline for systematic reviews. Its current main version is PRISMA 2020, and there are extensions such as PRISMA-ScR for scoping reviews. It includes a flow diagram showing how many records were identified, screened, excluded (with reasons) and included.\n\nEven if you are writing a narrative thesis review, borrowing this idea is useful. A short paragraph, or a simple flow diagram in an appendix, showing how you searched and selected makes your review more transparent and more convincing. For a formal systematic review, follow PRISMA in full and consider registering your protocol in advance."}, {"t": "Organising the review", "b": "Before you write, decide how to organise your material. There are four common ways:\n\n• Thematic: by topic or issue, such as barriers to adoption, effects on yield, and gender differences. This is the most common and usually the most useful, because it supports synthesis.\n• Chronological: by time, showing how thinking developed. Useful when the history of an idea matters, but it can easily become a list.\n• Methodological: by type of study, such as laboratory, field and modelling studies, or quantitative and qualitative. Useful when methods explain why results differ.\n• Theoretical: by theory or school of thought. Useful when competing frameworks explain your topic differently.\n\nMany reviews mix these. For example, the main sections might be thematic, with a chronological thread inside one section.\n\nPractical steps:\n• Write your main argument in two or three sentences first.\n• List the themes that argument needs, in a logical order, often from broad context to the specific area closest to your study.\n• Turn the themes into headings and subheadings.\n• Under each heading, list the sources and the point each one supports.\n\nA good outline means each section answers a question your reader needs answered before they can accept your study. If a section does not support your argument, cut it, however interesting it is."}, {"t": "Synthesis, not summary, and the synthesis matrix", "b": "Summary reports one source at a time. Synthesis combines sources to make a new point that no single source makes alone. Synthesis is what turns a list into a review.\n\nSynthesis means showing:\n• agreement: several studies point the same way;\n• disagreement: results conflict, and you suggest why (different contexts, samples, methods);\n• patterns: for example, positive results come mostly from small pilot studies;\n• development: how understanding has changed;\n• silence: what nobody has studied.\n\nA synthesis matrix makes this easier. Create a table where each row is a source and each column is a theme, variable or question. Add columns for method, setting and sample. Fill each cell with a short note. Then read down the columns, not across the rows. Each column becomes a paragraph or section, and patterns jump out.\n\nParagraph pattern for synthesis:\n1. Topic sentence: your claim about the theme.\n2. Evidence from several sources, grouped.\n3. Comparison or contrast, with a possible explanation.\n4. A concluding sentence linking back to your argument or study.\n\nNotice that in this pattern, the paragraph begins with your idea, not with an author's name. Authors appear in brackets or as supporting evidence. This simple change often transforms a weak review."}, {"t": "Critical evaluation", "b": "Being critical does not mean being negative. It means judging how far the evidence can be trusted and how far it applies to your question.\n\nQuestions to ask of the literature as a whole:\n• How strong is the evidence? Are findings based on large, well-designed studies, or on small pilots and opinion pieces?\n• How consistent is it? Do results agree across settings and methods?\n• Where does it come from? If most studies come from high-income countries, do the findings transfer to Ghana, Bangladesh or Peru?\n• How current is it? Has technology, policy or context changed since?\n• What is assumed? Do studies take for granted something your study questions?\n• Which methods dominate? If nearly all studies are cross-sectional surveys, causal claims are weak.\n\nExpress judgement with careful, precise language:\n• \"Evidence for this effect is largely drawn from short-term trials.\"\n• \"These findings should be treated with caution because...\"\n• \"Taken together, the studies suggest...although...\"\n\nHedging (using words like suggests, may, appears) is not weakness. It shows that your claims match the strength of the evidence. Over-claiming (\"this proves\") is a more serious fault in academic writing than careful caution.\n\nCritique ideas and methods, never people. Be fair: note the strengths of studies you criticise."}, {"t": "Identifying gaps and linking to your study", "b": "A research gap is a specific, defensible statement of what is not yet known, or not known well enough. It is the bridge between the literature and your study.\n\nCommon types of gap:\n• Context or population: well studied elsewhere, not in your setting or group.\n• Method: studied only with one method, for example only surveys, or only laboratory tests and not field trials.\n• Theory: not examined through a particular framework, or a theory not tested in a new context.\n• Conflict: studies disagree and the reason is unclear.\n• Time: evidence is outdated after major change.\n• Practice: knowledge exists, but not in a form that practitioners can use.\n\nAvoid claims such as \"no study has ever examined this\" unless your search was systematic. Prefer precise, honest wording: \"Few studies have...\", \"Evidence from...remains limited\", \"The reasons for these conflicting results have not been examined.\"\n\nDo not invent a gap just because a combination has not been tried. A gap must matter: explain why filling it is useful.\n\nEnd the review by stating your gap and leading directly to your aims, questions or hypotheses. The reader should feel that your study is the logical next step. If your research questions could have been written without the review, the link is too weak."}, {"t": "Structure of the chapter and reporting verbs", "b": "A literature review chapter usually has three parts.\n\nIntroduction: state the purpose and scope of the review (topic, period, types of sources), how you searched, and how the chapter is organised. Keep it short.\n\nBody: themed sections with clear headings. Start each section with a sentence telling the reader what it covers and why. End each with a mini-summary that links to the next section or to your study. In longer chapters, a conceptual framework section often comes near the end.\n\nConclusion: summarise the key findings across themes, state the gap, and present your research questions or link to the next chapter.\n\nReporting verbs show your attitude to a source. Choose them carefully:\n• Neutral: states, reports, describes, notes, examines, finds.\n• Strong agreement or strong evidence: demonstrates, shows, establishes, confirms.\n• Tentative: suggests, proposes, implies, speculates.\n• Disagreement or doubt: claims, asserts, questions, challenges.\n\n\"Ahmed (2021) claims\" signals doubt; \"Ahmed (2021) demonstrates\" signals acceptance. Use them deliberately.\n\nTense conventions vary, but a common pattern is: present tense for current knowledge and authors' ideas (\"Recent work suggests...\"); past tense for what a specific study did and found (\"Mwangi (2019) surveyed...\"); present perfect for a body of research (\"Several studies have shown...\")."}], "examples": [{"label": "Summary versus synthesis (agricultural extension)", "weak": "Kamau (2018) studied mobile advice for farmers in Kenya and found it increased yields. Owusu (2020) studied mobile advice in Ghana. He found that farmers did not trust the messages. Rao (2021) studied India and found mixed results.", "strong": "Evidence on mobile phone advisory services for farmers is mixed. Gains in yield have been reported where messages came from known extension officers (Kamau, 2018), whereas trust appeared to limit uptake where messages were automated (Owusu, 2020). Rao's (2021) mixed findings across Indian states are consistent with this pattern, suggesting that the source of advice may matter as much as its content.", "why": "The weak version lists studies one by one. The strong version opens with a claim, groups the evidence, explains the difference and draws a new conclusion. (Names and studies here are illustrative.)"}, {"label": "Stating a research gap (public health)", "weak": "No one has ever studied hand hygiene in Pakistan, so this study will fill the gap.", "strong": "Most studies of hand-hygiene compliance have been conducted in tertiary hospitals, largely in high-income settings. Far less is known about compliance in district-level hospitals in Pakistan, where staffing and water supply differ markedly. This study therefore examines compliance and its barriers in four district hospitals in Punjab.", "why": "The strong version shows what is known, defines the gap precisely, explains why the context matters and links directly to the study. It avoids an unprovable 'never' claim."}, {"label": "Organisation by author versus by theme (education)", "weak": "2.1 Smith (2015)\n2.2 Banda (2017)\n2.3 Chen (2019)\n2.4 Nwosu (2021)", "strong": "2.1 Defining teacher retention\n2.2 Salary and working conditions\n2.3 School leadership and support\n2.4 Rural placement and family factors\n2.5 Gaps in evidence from sub-Saharan Africa", "why": "Author-based headings force summary. Thematic headings organise ideas, allow comparison across sources and build towards the gap in the final section."}, {"label": "Choosing reporting verbs (engineering)", "weak": "Lee (2020) says that the new concrete mix is stronger. Patel (2022) says it cracks in hot weather.", "strong": "Lee (2020) demonstrates a 15% gain in compressive strength under laboratory curing, but Patel (2022) reports early cracking when the same mix was cured at temperatures above 35 °C, suggesting that field performance in hot climates remains uncertain.", "why": "'Says' is vague and repetitive. 'Demonstrates', 'reports' and 'suggesting' show how strong each claim is and how the writer judges them, and the sentence links the two studies."}], "checks": [{"q": "Which paragraph opening best signals synthesis rather than summary?", "o": ["Several studies link irrigation access to higher household income, although the size of the effect varies by crop.", "Smith (2019) conducted a study in Uganda.", "The next study is by Patel.", "I read many articles on this topic."], "a": 0, "why": "It begins with the writer's claim about a pattern across studies. The others start with a single source or say nothing about the literature."}, {"q": "A researcher wants to map what kinds of studies exist on microplastics in African freshwater, without detailed quality appraisal. Which review type fits best?", "o": ["Systematic review with meta-analysis", "Narrative review of three favourite papers", "Scoping review", "Annotated bibliography only"], "a": 2, "why": "Scoping reviews map the extent and nature of a broad or emerging literature and identify gaps, usually without detailed appraisal of each study."}, {"q": "In a database search, how should synonyms for the same concept be combined?", "o": ["With AND", "With OR", "With NOT", "They should not be combined"], "a": 1, "why": "OR widens the search to include any synonym. AND links different concepts and narrows results."}, {"q": "What does a PRISMA flow diagram show?", "o": ["The theoretical framework", "The study's budget", "Reporting verbs to use", "How many records were identified, screened, excluded with reasons and included"], "a": 3, "why": "The PRISMA 2020 flow diagram documents the selection process transparently."}, {"q": "Which gap statement is most defensible?", "o": ["No research has ever been done on this", "This topic has been studied too much", "Evidence on solar irrigation adoption among women farmers in northern Nigeria remains limited", "Everybody agrees on this issue"], "a": 2, "why": "It is specific and cautious. 'Never' claims are risky unless your search was systematic and exhaustive."}, {"q": "A synthesis matrix is most useful because it:", "o": ["Lets you read across sources by theme to see agreement, conflict and gaps", "Formats references automatically", "Replaces the need to read papers", "Counts citations"], "a": 0, "why": "Reading down each theme column reveals patterns across sources, which you then write up as synthesis."}, {"q": "Which reporting verb signals that the writer doubts a source's claim?", "o": ["Demonstrates", "Establishes", "Shows", "Claims"], "a": 3, "why": "'Claims' suggests the assertion is not fully supported. 'Demonstrates', 'establishes' and 'shows' signal acceptance."}, {"q": "Most studies you found are from Europe and North America. What is the best critical comment?", "o": ["These studies are useless for my context", "Findings may not transfer directly to low-income settings, where infrastructure and costs differ", "These studies prove the same results will occur everywhere", "Context does not matter in research"], "a": 1, "why": "Good evaluation questions transferability with a reason, without dismissing the evidence entirely."}, {"q": "Which organising approach is generally best for building a critical argument?", "o": ["Author by author", "Alphabetical", "Thematic", "By publication length"], "a": 2, "why": "Thematic organisation supports comparison and synthesis. Chronological, methodological and theoretical structures are also valid when they serve the argument."}, {"q": "Where should a literature review chapter normally state the research gap and lead into the research questions?", "o": ["In the first sentence of the chapter", "Nowhere; gaps belong in the results", "In the reference list", "In the conclusion of the review"], "a": 3, "why": "The review builds towards the gap, so it is stated at the end, leading logically to your questions or the next chapter."}, {"q": "Which statement about systematic reviews is correct?", "o": ["They use a pre-planned, documented search and explicit inclusion criteria", "They have no stated search strategy", "They include only the author's favourite studies", "They never appraise study quality"], "a": 0, "why": "Transparency and reproducibility are the defining features of systematic reviews."}, {"q": "A student's review covers theory, methods and findings but never mentions how it relates to her own study. What is the main weakness?", "o": ["It is too short", "It does not link the literature to the study's aims and gap", "It uses too many reporting verbs", "It is too critical"], "a": 1, "why": "A review must justify the study. Each section should end by showing how it shapes the research questions, framework or methods."}], "checklist": ["Write your review's main argument in two or three sentences before drafting", "Build a search string with synonyms joined by OR and concepts joined by AND, and keep a search log", "Write inclusion and exclusion criteria with a reason for each", "Create a synthesis matrix with sources as rows and themes, methods and settings as columns", "Rewrite any paragraph that begins with an author's name so it begins with your claim", "Check each section ends with a sentence linking to your study", "State your gap precisely and make sure each research question follows from it"], "practice": "Take three sources on one theme in your project and fill a small synthesis matrix with columns for setting, method and main finding. Then write one 150-word paragraph that opens with your own claim, compares the three sources and ends by linking to your study.", "reading": [{"book": "Ridley, D. (2025) The Literature Review: A Step-by-Step Guide for Students. 3rd edn. SAGE.", "why": "A practical, student-friendly guide. Read the parts on structuring the review, synthesis, and using reporting verbs to show your stance. It also covers systematic approaches."}, {"book": "Hart, C. (2018) Doing a Literature Review: Releasing the Research Imagination. 2nd edn. SAGE.", "why": "Goes deeper into argument analysis, the purposes of reviewing and organising ideas. Good for PhD students who need a more theoretical understanding of the review."}, {"book": "Wallace, M. and Wray, A. (2021) Critical Reading and Writing for Postgraduates. 4th edn. SAGE.", "why": "The guidance on writing critical literature reviews and on evaluating claims helps you move from description to argued evaluation."}], "links": [{"t": "Literature reviews (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/literature-reviews/"}, {"t": "PRISMA statement and checklists", "u": "https://www.prisma-statement.org/"}, {"t": "PRISMA 2020 flow diagram templates", "u": "https://www.prisma-statement.org/prisma-2020-flow-diagram"}, {"t": "Academic Phrasebank: Referring to sources (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/referring-to-sources/"}, {"t": "JBI Scoping Review Network resources", "u": "https://jbi.global/scoping-review-network/resources"}, {"t": "Grant and Booth (2009) A typology of reviews (University of Salford repository)", "u": "https://salford-repository.worktribe.com/output/1454519/a-typology-of-reviews-an-analysis-of-14-review-types-and-associated-methodologies"}]}, {"id": "methods", "title": "Data collection, sampling and analysis", "sub": "From participants to trustworthy findings", "goals": ["Define your population and choose a probability or non-probability sampling strategy you can justify", "Select and pilot data collection instruments that match your research question", "Describe suitable quantitative and qualitative analysis procedures in plain, accurate terms", "Explain how you will establish validity and reliability, or trustworthiness, and state limitations honestly"], "lessons": [{"t": "Population, sampling frame and probability sampling", "b": "Start with three terms.\n\n• Population: everyone or everything your findings are meant to apply to (all registered pharmacists in Ghana; all maize plots in a district).\n• Sampling frame: the actual list you draw from (the pharmacy council register). Gaps in the frame create bias: unregistered pharmacists are invisible.\n• Sample: the units you actually study.\n\nProbability sampling gives every unit in the population a known, non-zero chance of selection. It allows statistical generalisation from sample to population.\n\n• Simple random: every unit has an equal chance, like drawing names by random number.\n• Systematic: choose every k-th unit from a list after a random start.\n• Stratified: divide the population into groups (strata), such as urban and rural, and sample randomly within each, so important groups are represented.\n• Cluster: randomly select groups (villages, schools), then study units within them. Practical when no full list of individuals exists, common in household surveys across Africa and South Asia.\n• Multi-stage: combine these, for example selecting districts, then villages, then households.\n\nIn your write-up, state the frame, the method and how selection was actually done, not just the label."}, {"t": "Non-probability sampling and saturation", "b": "Non-probability sampling selects units by judgement or convenience, not chance. You cannot calculate sampling error or generalise statistically, but it is often the right choice, especially in qualitative research, where the goal is depth and understanding.\n\n• Purposive: choose people who can best inform the question, for example extension officers with at least five years' experience. State your criteria.\n• Maximum variation: a type of purposive sampling that deliberately includes diverse cases to capture a range of views.\n• Snowball: participants refer others. Useful for hidden or hard-to-reach groups such as informal waste pickers, but networks can be narrow.\n• Quota: fill set numbers for groups (for example, 50 men, 50 women) without random selection.\n• Convenience: whoever is available. Easy, but weakest; justify it honestly if you use it.\n\nIn qualitative research, sample size is often guided by saturation: the point where new data stop producing new insights relevant to your question. Saturation depends on how focused the question is, how similar participants are and how rich the interviews are. Do not simply claim 'saturation was reached'. Explain how you judged it, for example by tracking new codes after each interview. Some approaches, such as reflexive thematic analysis, prefer the idea of information power or adequacy over saturation."}, {"t": "Thinking about sample size", "b": "'How many participants do I need?' has no single answer. It depends on the design, the analysis and the precision you need.\n\nFor estimating a proportion in a large population, a standard formula gives about 385 respondents for 95% confidence and a margin of error of plus or minus 5 percentage points, assuming the most cautious case (a true proportion near 50%). A smaller population, a wider margin, or a design effect from cluster sampling will change this number. Always show your calculation and its assumptions.\n\nFor testing differences or relationships, use a power analysis. Power is the chance of detecting an effect that really exists; 80% is a common target. You need the expected effect size (from earlier studies or a pilot), significance level (often 0.05) and test type. Free software such as G*Power can do this.\n\nFor experiments in engineering or agriculture, the question is how many replicates you need to detect a meaningful difference given the variability of measurements.\n\nFor qualitative work, justify size by the depth of data and the aim of the study, not by a magic number.\n\nAlso plan for non-response: if you expect 70% of people to respond, invite more than your target."}, {"t": "Asking people: questionnaires, interviews and focus groups", "b": "Questionnaires collect the same structured information from many people. Use closed questions (multiple choice, rating scales) for easy analysis and a few open questions for detail. Good items are short, ask one thing at a time, avoid leading words and suit the reading level of respondents. Where possible, use validated scales from published studies and say whether you adapted or translated them. Translation should ideally include back-translation and checks with native speakers.\n\nInterviews explore views and experiences in depth.\n• Structured: fixed questions in a fixed order.\n• Semi-structured: a guide of main questions and prompts, with freedom to follow up. Most common in postgraduate research.\n• Unstructured: open conversation around a topic.\nRecord (with consent), transcribe and note the language used. If interviews are in Hausa, Twi, Swahili or Urdu and analysed in English, explain how translation was handled.\n\nFocus groups bring 5 to 10 people together to discuss a topic. They show how views form and differ in interaction, which individual interviews cannot. But dominant voices, power differences (for example, junior and senior staff together) or sensitive topics can silence people. Choose group composition carefully."}, {"t": "Observation, experiments, secondary data and piloting", "b": "Observation records what people actually do, not what they say they do. It can be structured (a checklist counting handwashing events at a clinic) or unstructured (field notes on how a market committee runs meetings). Participant observation means the researcher takes part in the setting.\n\nExperimental measurement in laboratories and fields needs clear protocols: equipment and calibration, sample preparation, number of replicates, controls, and measurement conditions. Report enough detail for someone else to repeat the work.\n\nSecondary and archival data were collected by others: national surveys such as Demographic and Health Surveys, census data, company reports, satellite imagery, hospital records, policy documents. They save time and allow large samples, but you did not control how they were collected. Explain the source, the variables you used, any cleaning, and the limits of the data.\n\nPiloting means testing your instruments and procedures on a small group before the main study. A pilot can reveal confusing questions, translation problems, interviews that run too long or lab steps that do not work. Report what you piloted, with whom, and what you changed. Pilot participants are usually not included in the main analysis. Language tip: 'Following the pilot, three items were reworded and one was removed because...'."}, {"t": "Quantitative analysis in plain terms", "b": "Descriptive statistics summarise your data.\n• Frequencies and percentages: how many said yes.\n• Mean and median: the typical value. Use the median when data are skewed, such as income.\n• Standard deviation or interquartile range: how spread out the values are.\nTables and graphs are part of description.\n\nInferential statistics help you judge whether patterns in a sample are likely to hold in the population or could have arisen by chance.\n• Comparing two groups: t-test, or Mann-Whitney U if data are not normally distributed.\n• Comparing three or more groups: ANOVA, or Kruskal-Wallis.\n• Relationships between categories: chi-square test.\n• Relationships between continuous variables: correlation.\n• Predicting an outcome from several variables: regression (linear for continuous outcomes, logistic for yes/no outcomes).\n\nA p-value tells you how surprising your result would be if there were no real effect. A small p-value (often below 0.05) suggests the effect is unlikely to be chance alone, but it does not tell you how big or important the effect is. Report effect sizes and confidence intervals as well.\n\nState the software (R, SPSS, Stata, Python) and check each test's assumptions. Ask a statistician early if unsure."}, {"t": "Qualitative analysis: thematic and content analysis", "b": "Thematic analysis identifies patterns of meaning (themes) across a data set. Braun and Clarke's widely used reflexive approach moves through six phases:\n1. Familiarise yourself with the data: read and re-read transcripts, make notes.\n2. Code: label segments of data that relate to your question.\n3. Generate initial themes from groups of codes.\n4. Develop and review themes against the coded data and the whole data set.\n5. Refine, define and name each theme.\n6. Write up, using quotations as evidence and interpreting them.\n\nA theme is not just a topic heading such as 'challenges'. It is a central idea that tells the reader something, such as 'Debt as a source of shame rather than a financial problem'.\n\nContent analysis is more systematic and often counts. You define categories, sometimes in advance, then code text such as newspaper articles, policy documents or social media posts and report how often categories occur. Example: analysing 200 news stories on flooding in Pakistan to see how often climate change is mentioned as a cause.\n\nIn both, explain your coding process, whether you used software (NVivo, ATLAS.ti, or a free alternative like Taguette), and how you checked your interpretations. Avoid saying 'themes emerged', which hides your active role; say 'I developed themes'."}, {"t": "Validity and reliability", "b": "In quantitative research, quality is judged mainly by validity and reliability.\n\nValidity asks: are you measuring what you claim to measure, and are your conclusions justified?\n• Content validity: do the items cover the whole concept? Experts can review them.\n• Construct validity: does the measure behave as theory predicts? Factor analysis is one check.\n• Internal validity: in studies of cause and effect, can other explanations be ruled out?\n• External validity: can the findings be generalised to other people, places or times?\n\nReliability asks: is the measurement consistent?\n• Internal consistency: do items in a scale measure the same thing? Cronbach's alpha is commonly reported; values around 0.7 or above are often treated as acceptable, though the threshold depends on context.\n• Test-retest: does the same person score similarly on two occasions?\n• Inter-rater: do two observers or coders agree?\n• In laboratory work: repeatability and instrument calibration.\n\nA measure can be reliable but not valid: a scale that consistently reads 2 kg too heavy is reliable but wrong.\n\nDo not just list these words. Say what you did: 'Two agronomists reviewed the checklist', 'Cronbach's alpha for the trust scale was 0.82'."}, {"t": "Trustworthiness, triangulation and limitations", "b": "Qualitative researchers often use Lincoln and Guba's criteria of trustworthiness, which roughly parallel quantitative ideas:\n• Credibility (like internal validity): are the findings a believable account of participants' views? Strategies: prolonged engagement, member checking, peer debriefing.\n• Transferability (like external validity): can readers judge whether findings apply elsewhere? Provide thick description of the setting and participants.\n• Dependability (like reliability): is the process consistent and documented? Keep an audit trail of decisions.\n• Confirmability (like objectivity): are findings grounded in the data, not only the researcher's views? Use reflexive notes and show evidence.\n\nTriangulation means using more than one source, method, researcher or theory to examine the same question. If interviews, records and observation point the same way, confidence grows; if they conflict, that is a finding worth explaining.\n\nLimitations are weaknesses that affect how far your conclusions reach. Good limitation statements:\n• are specific (a sample from two private hospitals only)\n• explain the effect on findings (may overstate access to equipment)\n• say what you did to reduce the problem\n• suggest how future work could address it\n\nHonest limitations build trust. Examiners worry more when no limitations are mentioned."}], "examples": [{"label": "Describing a sampling strategy precisely", "weak": "Random sampling was used to select 200 farmers from the area.", "strong": "A two-stage cluster sample was used. Ten villages were randomly selected from the list of 46 villages in Lafia Local Government Area held by the state agricultural agency; in each village, 20 households were selected by systematic sampling from the village head's register (every fourth household after a random start). The target of 200 allowed for a 15% non-response from a calculated minimum of 170.", "why": "The strong version names the frame, both stages, the actual selection procedure and the reasoning behind the number. 'Random sampling' alone is vague and often inaccurate."}, {"label": "Justifying a qualitative sample", "weak": "Twelve interviews were done until saturation was reached.", "strong": "Twelve head teachers were purposively selected to vary by school type (public and private), location (urban and rural) and gender. After each interview, new codes were logged; interviews 10 to 12 produced no new codes relevant to the research question, so recruitment stopped. The narrow focus on one policy and the homogeneous professional group supported this sample size.", "why": "The strong version explains selection criteria, how saturation was judged and why the sample was sufficient. The weak version asserts saturation without evidence."}, {"label": "Writing a useful limitation", "weak": "The study has some limitations such as small sample size and time constraints.", "strong": "The survey reached only nurses working day shifts in two public hospitals in Hyderabad. Night-shift nurses, who may experience greater fatigue, are under-represented, so the results may underestimate burnout. Future studies should sample across shifts and include private hospitals.", "why": "The strong version names the specific limitation, explains its likely effect on findings and points to future work. 'Time constraints' is not a methodological limitation in itself."}], "checks": [{"q": "A researcher wants to compare urban and rural households and makes sure both are represented by randomly sampling within each group. Which method is this?", "o": ["Snowball sampling", "Stratified random sampling", "Convenience sampling", "Quota sampling"], "a": 1, "why": "Stratified random sampling divides the population into groups and samples randomly within each. Quota sampling also fills groups but selects without randomisation."}, {"q": "A study of informal e-waste recyclers, who have no register and may avoid officials, needs participants. Which strategy is most practical?", "o": ["Simple random sampling from a national list", "Systematic sampling", "Snowball sampling, starting from several different initial contacts", "Cluster sampling from census tracts"], "a": 2, "why": "With no sampling frame and a hard-to-reach group, snowball sampling through trusted referrals is practical. Starting from several contacts reduces the risk of reaching only one network."}, {"q": "Which statement about saturation is most accurate?", "o": ["Saturation is always reached at exactly 12 interviews", "Saturation applies only to quantitative surveys", "Saturation means participants are tired of the interview", "Saturation is the point where new data add little new insight for the question, and researchers should explain how they judged it"], "a": 3, "why": "Saturation depends on the question, sample and data richness; there is no fixed number. Good reports explain how it was assessed."}, {"q": "A student finds p = 0.03 for the difference in yields between two maize varieties. What can she correctly conclude?", "o": ["The difference is large and practically important", "The difference is unlikely to be due to chance alone, but she should also report the effect size to show how big it is", "The new variety is proven better everywhere", "There is a 3% chance the hypothesis is true"], "a": 1, "why": "A p-value indicates how surprising the result would be if no real effect existed. It does not measure size or importance, and it is not the probability that a hypothesis is true."}, {"q": "Which test is most appropriate for examining whether gender (male/female) is related to mobile money use (yes/no)?", "o": ["Chi-square test", "Paired t-test", "Linear regression", "Cronbach's alpha"], "a": 0, "why": "Both variables are categorical, so a chi-square test of association fits. Cronbach's alpha measures scale reliability, not relationships."}, {"q": "A weighing scale always shows 2 kg more than the true weight. The scale is:", "o": ["Valid but not reliable", "Neither reliable nor consistent", "Reliable but not valid", "Both reliable and valid"], "a": 2, "why": "It gives consistent readings (reliable) but they are wrong (not valid). Reliability is necessary but not sufficient for validity."}, {"q": "A qualitative researcher provides detailed descriptions of the schools, communities and participants so readers can judge whether findings apply to their own setting. This supports:", "o": ["Confirmability", "Internal consistency", "Statistical power", "Transferability"], "a": 3, "why": "Thick description supports transferability by letting readers judge fit with other contexts. Confirmability concerns whether findings are grounded in the data rather than researcher bias."}, {"q": "Which is the best example of a theme in thematic analysis?", "o": ["Challenges", "Responses to question 4", "Rainfall as a test of faith: farmers frame crop loss as moral as well as economic", "Demographics"], "a": 2, "why": "A good theme expresses a central organising idea about the data. 'Challenges' and 'responses to question 4' are topic labels, not interpretations."}, {"q": "A researcher compares interview data from patients, clinic records and her own observation notes to check whether waiting times are a major barrier. This is an example of:", "o": ["Triangulation", "Quota sampling", "Back-translation", "Test-retest reliability"], "a": 0, "why": "Using several sources or methods to examine the same question is triangulation. Agreement increases confidence; disagreement needs explanation."}, {"q": "Before the main survey, a student tests her Swahili questionnaire with eight teachers and finds two questions are understood differently from her intention. What should she do?", "o": ["Ignore it, since eight is a small number", "Revise the questions, check them again, and report the pilot and changes in her methods section", "Delete the whole questionnaire", "Include the eight pilot responses in the final results without changes"], "a": 1, "why": "The purpose of piloting is to find and fix problems. Reporting what was changed shows rigour. Pilot data collected with a different version are usually kept out of the main analysis."}, {"q": "A student uses five years of national Demographic and Health Survey data for her analysis. Which point must her methods section address?", "o": ["How she personally interviewed each respondent", "Why she did not use focus groups", "Her inter-rater reliability for interviews", "The data source, sampling design of the original survey, the variables used and any limitations of the data"], "a": 3, "why": "With secondary data, you did not control collection, so you must describe the source and its design, explain variable choices and cleaning, and acknowledge limits."}, {"q": "Which limitation statement is strongest?", "o": ["The study was limited by time.", "The study had limitations like every study.", "Because the sample came only from urban pharmacies in Accra, the findings may overstate access to medicines compared with rural areas.", "The researcher did her best despite limitations."], "a": 2, "why": "The strong statement is specific and explains how the limitation could affect the findings. The others are vague and give the reader nothing to judge."}], "checklist": ["Write one sentence each defining your population, sampling frame and sample.", "Name your sampling method precisely and describe how selection was actually done, step by step.", "Justify your sample size with a calculation, power analysis or a clear qualitative rationale.", "Pilot each instrument with a few people like your participants and record what you changed.", "Match each research question or hypothesis to a specific analysis technique and the software you will use.", "List at least two concrete steps you will take to support validity and reliability, or trustworthiness.", "Draft two specific limitations, each with its likely effect on your findings and how you reduced it."], "practice": "Make a three-column table for your project: research question, data source and instrument, analysis method. Then write a 100-word paragraph explaining how you will check the quality of your data, using either validity and reliability or the four trustworthiness criteria, with at least one specific action for each.", "reading": [{"book": "Clark, T., Foster, L., Sloan, L. and Bryman, A. (2021) Bryman's Social Research Methods. 6th edn. Oxford: Oxford University Press.", "why": "Read the chapters on sampling, structured interviewing and questionnaire design, qualitative interviewing and focus groups, and quantitative and qualitative data analysis. Clear examples and good discussion of research quality criteria."}, {"book": "Kumar, R. (2019) Research Methodology: A Step-by-Step Guide for Beginners. 5th edn. London: SAGE.", "why": "Read the sections on constructing a research instrument, establishing validity and reliability, and selecting a sample. Very accessible, step-by-step and useful if you are new to research methods. A sixth edition is announced by SAGE for late 2026."}, {"book": "Braun, V. and Clarke, V. (2021) Thematic Analysis: A Practical Guide. London: SAGE.", "why": "Read the parts that walk through each phase of reflexive thematic analysis and the discussion of sample size and quality. The clearest practical guide if your study uses interviews or focus groups."}], "links": [{"t": "Research Methods Knowledge Base: Sampling", "u": "https://conjointly.com/kb/sampling-in-research/"}, {"t": "Scribbr: Sampling methods with examples", "u": "https://www.scribbr.com/methodology/sampling-methods/"}, {"t": "Research Methods Knowledge Base: Reliability and validity", "u": "https://conjointly.com/kb/reliability-and-validity/"}, {"t": "University of Connecticut: Trustworthiness in qualitative research", "u": "https://researchbasics.education.uconn.edu/trustworthiness"}, {"t": "Braun and Clarke's thematic analysis resource site (University of Auckland)", "u": "https://www.thematicanalysis.net/"}, {"t": "OpenIntro Statistics: free introductory statistics textbook", "u": "https://www.openintro.org/book/os/"}]}, {"id": "methodsec", "title": "Writing the methods and results", "sub": "Reporting what you did and found", "goals": ["Write a methods section or methodology chapter detailed enough for another researcher to repeat or judge your study", "Justify your methodological choices rather than only describing them", "Present results objectively, with clear tables, figures, statistics and qualitative quotations", "Separate findings from interpretation so that Results and Discussion each do their own job"], "lessons": [{"t": "Methods versus methodology", "b": "The two words are often mixed up, but they mean different things.\n\n• Methods are the specific tools and procedures you used: a questionnaire, a soil sampling protocol, semi-structured interviews, a regression model, a laboratory assay.\n• Methodology is the reasoning behind those choices: your overall research design and approach, and in many social science fields your philosophical position (for example, whether you treat knowledge as measurable and objective or as constructed through interpretation).\n\nIn a journal article in science, engineering or health, the section is usually called Methods (or Materials and Methods) and focuses on procedures, with brief justification. In a thesis, especially in education, business, development studies and other social sciences, there is usually a full Methodology chapter that explains and defends the research design before describing the methods.\n\nA useful way to think about it: methodology answers 'Why this kind of study?' and methods answer 'What exactly did I do?'. A thesis examiner will want both. A journal reviewer mostly wants the second, with enough of the first to be convinced your design suits your question.\n\nCheck your programme handbook: some universities in South Asia and West Africa use the heading 'Research Methodology' even for chapters that mainly describe methods."}, {"t": "What a methods section contains", "b": "Contents vary by field, but most methods sections cover the following, roughly in this order:\n\n• Study design: for example, a randomised trial, cross-sectional survey, case study, field experiment or laboratory experiment.\n• Setting and timing: where and when the study took place, with relevant features (climate zone, school type, plant capacity).\n• Participants, samples or materials: who or what was studied, how they were selected, inclusion and exclusion criteria, and sample size with its justification.\n• Instruments and measures: questionnaires, interview guides, sensors or equipment, with model numbers where relevant, and how variables were defined and measured.\n• Procedures: the steps you followed, in logical or chronological order.\n• Data analysis: software and version, statistical tests or qualitative analysis approach, and how you handled missing data.\n• Ethics: approving committee, reference number where required, and how informed consent was obtained.\n\nIn qualitative research also include your role as researcher (sometimes called positionality) and how you ensured trustworthiness, for example by member checking or keeping an audit trail.\n\nUse sub-headings. Readers often scan methods to find one detail, such as the sample size or test used, and sub-headings make that fast."}, {"t": "Replicability and the right level of detail", "b": "A good methods section lets a competent researcher in your field repeat your study, or at least judge whether your results can be trusted. This is called replicability (or reproducibility). If key details are missing, reviewers cannot evaluate your work, and examiners may question whether you really controlled your study.\n\nHow much detail is enough? Ask: could someone get a different result because they did this step differently? If yes, report it. For example: temperature and duration in a lab procedure; the exact wording of key survey questions; how interviewees were recruited; which software settings were used.\n\nYou do not need to explain routine steps every expert knows ('the beaker was washed'). For established methods, cite the source and report only changes: 'Chlorophyll content was measured following Arnon (1949), with the following modification...'.\n\nWhere word limits are tight, move lengthy detail (full questionnaires, interview guides, calibration data, code) to appendices or supplementary files, and say where it is.\n\nIf your study type has a reporting guideline (CONSORT, STROBE, COREQ and others, available from the EQUATOR Network), use its checklist to test your methods section. It is the quickest way to find missing details."}, {"t": "Justify your choices, do not just describe them", "b": "Weak methods sections read like a list: 'A questionnaire was used. Data were analysed with SPSS.' Strong ones explain why each major choice suits the research question.\n\nKey choices that usually need a reason:\n• Design: why a survey and not interviews, or why a case study.\n• Sampling: why this site, why purposive rather than random sampling, why this sample size (ideally with a power calculation for quantitative studies, or a saturation argument for qualitative ones).\n• Instruments: why this scale, and evidence that it is valid and reliable in a similar population.\n• Analysis: why this test or approach, and why its assumptions are met.\n\nOne or two sentences per choice is usually enough in a paper; a thesis allows more. Link justification to your aim, to methodological literature, or to practical constraints, and be honest about constraints.\n\nSentence patterns (written for this unit):\n• 'A mixed-methods design was chosen because the study sought both to measure ... and to explain ...'\n• 'Purposive sampling was used to include schools that ...'\n• 'This instrument was selected because it has been validated among ...'\n• 'Thematic analysis was appropriate because the aim was to identify patterns across ...'\n\nJustifying also prepares you for viva and reviewer questions."}, {"t": "Tense and voice", "b": "Tense:\n• Use the past simple for what you did: 'Samples were collected weekly.' 'We interviewed 24 nurses.' Your study is finished, so describe it in the past.\n• Use the present simple for things that are generally true or still true: 'The questionnaire consists of 20 items.' 'Table 2 shows...'. 'The study area lies in the semi-arid zone.'\n• In a proposal, use the future: 'Data will be collected...'. Remember to change to past tense when you convert a proposal into a thesis.\n\nVoice:\nThe passive voice ('The soil was sieved') focuses on the action and is traditional in many sciences. The active voice with 'we' or 'I' ('We sieved the soil') is clearer and is now accepted, and often encouraged, by many journals, including in science and medicine. Qualitative research commonly uses 'I' because the researcher's role matters.\n\nMost good writing mixes the two. Use passive when the actor is obvious or unimportant; use active when it makes a sentence shorter or clearer. Check your target journal's style guide and recent papers.\n\nA tip for multilingual writers: avoid long chains of passives ('It was decided that samples should be taken to be analysed'). Rewrite as 'We analysed samples from ...'."}, {"t": "Reporting results objectively", "b": "The Results section reports what you found, clearly and without interpretation. It is not a data dump, and it is not the Discussion.\n\nGuiding principles:\n• Organise by research question, objective or hypothesis, in the same order as your Introduction and Methods. This lets readers map each result to its purpose.\n• Lead with the finding, then the evidence. Write 'Yield was higher on composted plots (Table 2)', not 'Table 2 shows yields'.\n• Report all relevant results, including those that did not support your hypothesis. Hiding non-significant or unexpected results is a form of misreporting.\n• Give enough numbers to support each statement, but do not repeat every number from a table in the text. Highlight the main pattern.\n• Use neutral verbs: increased, decreased, differed, was associated with, did not differ.\n\nKeep interpretation out. Words such as 'because', 'suggests', 'this proves', 'surprisingly' or 'as expected from theory' are signals of interpretation. Move these to the Discussion.\n\nThere are exceptions. A combined Results and Discussion is normal in some fields, and qualitative findings sections may include light interpretation as part of presenting themes. Even then, make it clear which statements are data and which are your reading of them."}, {"t": "Tables and figures", "b": "Tables and figures carry much of your evidence. Each must make sense on its own, because many readers look at them before reading the text.\n\nChoosing:\n• Use a table when readers need exact values or many variables side by side.\n• Use a figure (graph, map, diagram, photo) to show a trend, comparison, relationship or spatial pattern.\n• Use text alone if there are only two or three numbers.\n\nMaking them readable:\n• Number them in the order they are mentioned: Table 1, Table 2; Figure 1, Figure 2.\n• Give a clear, informative title. Many styles put table titles above the table and figure captions below the figure; check your style guide.\n• Label every axis and column, with units: 'Rainfall (mm)', 'Age (years)'.\n• Define abbreviations, symbols and error bars in a note or caption: 'Error bars show standard deviation; n = 12'.\n• Keep design simple: no 3D effects, minimal gridlines, colours that print in greyscale and are readable by colour-blind readers.\n• Cite the source if you reproduce or adapt someone else's figure.\n\nIn the text, refer to every table and figure and say what the reader should notice: 'Infection rates fell after the second month (Figure 3).' Never insert a figure with no mention."}, {"t": "Reporting statistics", "b": "Statistics must be complete enough for readers to judge them. Exact conventions vary by style guide (APA, AMA, journal-specific), so check yours, but these principles are widely shared.\n\n• Describe your data: give means with standard deviations, or medians with interquartile ranges for skewed data, plus sample size: 'mean age 34.2 years (SD 8.1, n = 210)'.\n• For each test, report the test, the test statistic, degrees of freedom where relevant, and the exact p-value: 't(48) = 2.31, p = .025'. Write 'p < .001' for very small values rather than 'p = .000'.\n• Report effect sizes and confidence intervals, not just p-values. A p-value says whether an effect is likely to be zero; an effect size and its interval say how large it is and how precisely you estimated it: 'mean difference 4.2 kg (95% CI 1.1 to 7.3)'.\n• Use percentages with their counts: '62% (124/200)'.\n• Use consistent decimal places, usually two or three for test statistics and one or two for descriptive values.\n• 'Significant' in a results section means statistically significant. Do not use it to mean 'important'.\n\nReport non-significant results too: 'Yield did not differ between varieties (F(2, 33) = 1.04, p = .36).'"}, {"t": "Reporting qualitative findings and quotations", "b": "In qualitative research, findings are usually organised by theme. A theme is a pattern of meaning across the data that answers your research question, not just a topic heading.\n\nFor each theme:\n• Name it in a way that says something: 'Trust built through repeated visits' is better than 'Trust'.\n• Explain what it means and how widely it appeared, using careful words such as 'most', 'several' or 'a few' rather than precise percentages, unless counting fits your approach.\n• Support it with short, well-chosen quotations from participants, and show variation, including views that differ.\n\nUsing quotations well:\n• Introduce each quote and say what it shows. Do not let quotes stand alone.\n• Keep them short; trim with '...' where the meaning is not changed.\n• Label them with a code that protects anonymity: (Teacher 4, rural school) or (P12, female, 45).\n• Avoid over-relying on one articulate participant.\n• If translated, say so, and keep the meaning faithful. Some writers keep a key phrase in the original language with a translation.\n\nAvoid a findings section that is mostly quotations. The analysis, meaning your account of the pattern, should do the work, with quotes as evidence. Detailed comparison with literature still belongs in the Discussion in most formats."}], "examples": [{"label": "Describing versus justifying a sampling choice", "weak": "Ten health facilities were selected for the study.", "strong": "We purposively selected ten primary health facilities, five urban and five rural, in Kisumu County. Including both settings allowed us to compare referral practices where travel distances and staffing differ substantially. Facilities were eligible if they had offered antenatal services for at least two years.", "why": "The strong version says how facilities were chosen, why that approach suits the aim, and what the eligibility criteria were, so readers can judge whether the sample fits the question."}, {"label": "Keeping a results sentence objective and complete", "weak": "As expected, the new filter worked very well and removed significantly more turbidity, proving that it is better than the old design.", "strong": "Mean turbidity after filtration was 1.8 NTU (SD 0.6) with the new filter and 4.9 NTU (SD 1.1) with the conventional design (t(38) = 11.2, p < .001; mean difference 3.1 NTU, 95% CI 2.5 to 3.7) (Table 3).", "why": "The weak version contains judgement ('very well', 'proving', 'as expected') and no evidence. The strong version reports the values, variability, test, effect size and confidence interval, and points to the table, leaving interpretation for the Discussion."}, {"label": "Presenting a qualitative theme with a quotation", "weak": "Theme 2: Cost. \"Fees are too much. We cannot pay.\" \"Money is the problem.\" \"School is expensive.\"", "strong": "Theme 2: Hidden costs, not fees, kept girls at home. Although tuition was free in all three schools, most parents described uniforms, exam levies and transport as the main barrier. One mother explained that the cost was the daily fare, not the school itself: 'The school does not ask for money, but the bus does, every single day' (Parent 7, rural). A few parents, however, said that cost mattered less than safety on the route.", "why": "The strong version names a meaningful theme, explains it, introduces a short anonymised quote with context, and shows variation. The weak version strings quotes together without analysis."}], "checks": [{"q": "What is the best description of 'methodology' as distinct from 'methods'?", "o": ["The software used for analysis", "The reasoning and overall design behind your choice of methods", "The list of references for your methods", "The section where results are interpreted"], "a": 1, "why": "Methods are the specific procedures; methodology is the rationale and design that explain why those procedures suit the question."}, {"q": "Which detail is LEAST necessary in a methods section?", "o": ["How participants were recruited", "The statistical test used for each comparison", "That the laboratory glassware was rinsed before use, a routine step every chemist follows", "The ethics committee that approved the study"], "a": 2, "why": "Routine steps that any competent researcher would follow do not need reporting. Recruitment, analysis and ethics approval all affect how results can be judged."}, {"q": "Which sentence best justifies a method rather than just describing it?", "o": ["'Interviews were conducted.'", "'NVivo 14 was used.'", "'Data were collected in 2024.'", "'Semi-structured interviews were used because the study aimed to explore how farmers explain their own planting decisions.'"], "a": 3, "why": "It links the choice of method to the aim of the study. The others give useful facts but no reason."}, {"q": "Which tense is most appropriate for describing what you did in a completed study?", "o": ["Past simple, e.g. 'Samples were dried at 60 °C for 48 hours.'", "Future, e.g. 'Samples will be dried...'", "Present continuous, e.g. 'Samples are being dried...'", "Conditional, e.g. 'Samples would be dried...'"], "a": 0, "why": "Completed procedures are described in the past. The future tense belongs in a proposal and must be changed when the proposal becomes a thesis."}, {"q": "Which sentence belongs in the Discussion rather than the Results?", "o": ["'Mean waiting time was 47 minutes (SD 12).'", "'Waiting time did not differ by day of the week (p = .41).'", "'The longer waiting times on Mondays may reflect weekend backlogs, as reported in other urban clinics.'", "'Figure 2 shows waiting times by clinic.'"], "a": 2, "why": "It offers an explanation ('may reflect') and compares with other studies, which is interpretation. The other three report findings or point to evidence."}, {"q": "A student writes 'p = .000' in a results table. What should it be?", "o": ["p < .001", "p = 0", "p = .0", "Delete the p-value"], "a": 0, "why": "A p-value is never exactly zero; software rounds it. Most style guides ask you to write p < .001 for very small values."}, {"q": "Why should you report effect sizes and confidence intervals, not only p-values?", "o": ["Because p-values are no longer allowed", "Because they show how large the effect is and how precisely it was estimated", "Because they make the table longer", "Because they replace the need for a sample size"], "a": 1, "why": "A p-value alone does not show whether an effect is large enough to matter. Effect sizes and intervals give magnitude and precision, which readers need to judge practical importance."}, {"q": "Which figure caption is best?", "o": ["'Graph'", "'Results of the study'", "'Figure 3 is very interesting'", "'Figure 3. Monthly rainfall (mm) and maize yield (t/ha) in Kaduna, 2015-2024. Bars show mean ± SD.'"], "a": 3, "why": "It is numbered, states what is shown, gives place, period and units, and explains the error bars, so the figure can be understood on its own."}, {"q": "In a qualitative findings section, what should usually accompany each quotation?", "o": ["The participant's full name and address", "An introduction and a comment explaining what it shows, plus an anonymised label", "A p-value", "Nothing; quotes speak for themselves"], "a": 1, "why": "Quotes are evidence for your analysis. Introducing and explaining them, and labelling them anonymously, shows how they support the theme while protecting participants."}, {"q": "Your hypothesis was not supported. What should you do in Results?", "o": ["Report the result clearly with its statistics, just as you would a supported result", "Leave it out to keep the paper positive", "Move it to the appendix without mention", "Change the hypothesis so it matches the result"], "a": 0, "why": "All relevant results should be reported. Omitting or reframing unsupported hypotheses distorts the evidence and is a research integrity problem."}, {"q": "Which statement about passive and active voice in methods is most accurate?", "o": ["Only passive voice is acceptable in science", "Only active voice is acceptable today", "Both are acceptable; choose the clearer one and follow your journal's style", "Using 'we' is always plagiarism"], "a": 2, "why": "Many journals now accept or encourage 'we', while passive remains common and useful when the actor is unimportant. Clarity and the target journal's conventions decide."}, {"q": "You have only three numbers to report: mean scores for three groups. What is usually best?", "o": ["A full-page table", "A 3D pie chart", "Two separate figures", "A sentence in the text"], "a": 3, "why": "A few values are easiest to read in a sentence. Tables and figures are worth their space when there are many values or a pattern to show."}], "checklist": ["Run your methods section against the reporting-guideline checklist for your design and fill every gap you find.", "Add a one- or two-sentence justification for your design, sampling, instruments and analysis.", "Change any future-tense proposal language to the past tense for procedures you have completed.", "Reorder your Results so they follow the same sequence as your research questions or objectives.", "Search your Results for 'because', 'suggests', 'proves', 'surprisingly' and 'as expected' and move interpretation to the Discussion.", "Check every table and figure for a number, informative title, labelled axes or columns, units and defined abbreviations, and make sure each is referred to in the text.", "For each statistical test, confirm you report the statistic, degrees of freedom, exact p-value, effect size and confidence interval."], "practice": "Pick one key choice in your study, such as your sampling method or analysis approach, and write a short paragraph that describes it and then justifies it in two sentences. Then write one results sentence that leads with the finding and gives complete supporting numbers.", "reading": [{"book": "Gastel, B. and Day, R.A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Read the chapters on writing the materials and methods and the results, and the chapters on preparing tables and illustrations. Practical, field-neutral guidance on detail, clarity and presentation."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "Read the chapters on the methodology and results sections. They break each section into stages and give the grammar and vocabulary (tense, passive, verbs for describing data) that multilingual writers often need."}, {"book": "Swales, J.M. and Feak, C.B. (2012) Academic Writing for Graduate Students: Essential Tasks and Skills. 3rd edn. University of Michigan Press.", "why": "Read the units on data commentary and on methods and results. They show how to write about tables and figures and how much detail different fields expect."}], "links": [{"t": "Manchester Academic Phrasebank: Describing methods", "u": "https://www.phrasebank.manchester.ac.uk/describing-methods/"}, {"t": "Manchester Academic Phrasebank: Reporting results", "u": "https://www.phrasebank.manchester.ac.uk/reporting-results/"}, {"t": "Chalmers Writing Guide: Methods", "u": "https://writing.chalmers.se/method"}, {"t": "UNC Writing Center: Scientific reports (methods, results, tables and figures)", "u": "https://writingcenter.unc.edu/tips-and-tools/scientific-reports/"}, {"t": "EQUATOR Network: find the reporting guideline for your design", "u": "https://www.equator-network.org/reporting-guidelines/"}]}, {"id": "paragraph", "title": "Sentences, paragraphs and flow", "sub": "Building text readers can follow", "goals": ["Write topic sentences that state the paragraph's single controlling idea", "Structure argument paragraphs using a model such as PEEL or MEAL and adapt it to your field", "Order information from given to new and use cohesion devices to connect sentences and sections", "Diagnose and fix long, unclear sentences, run-ons, comma splices and fragments"], "lessons": [{"t": "What a paragraph is for", "b": "A paragraph is a unit of thought, not a unit of length. Each paragraph should develop one main idea, and every sentence in it should help that idea.\n\nIn academic English, paragraphs usually:\n• Open with a sentence that tells the reader what the paragraph is about and what it claims\n• Develop that claim with evidence, explanation, examples or data\n• Close by showing why the point matters or how it connects to the larger argument\n\nAs a rough guide, academic paragraphs often run from about 100 to 250 words. One-sentence paragraphs are rare and usually signal an undeveloped idea. Page-long paragraphs usually contain two or three ideas that should be separated.\n\nSome writing traditions build towards the main point slowly, giving background and context first and stating the conclusion at the end. Readers in the UK, North America and Australia generally expect the reverse: the point first, then the support. This is sometimes called a 'deductive' or 'writer-responsible' style, in which the writer, not the reader, does the work of making the structure obvious.\n\nA simple check: write the main idea of each paragraph in the margin in five words or fewer. If you cannot, the paragraph is unfocused. If two margins say the same thing, merge or cut."}, {"t": "Topic sentences that do real work", "b": "The topic sentence is usually the first sentence. It does two jobs: it names the topic and it states your claim about it. A sentence that only announces a topic is weak because it gives the reader nothing to evaluate.\n\nCompare:\n• Topic only: 'This paragraph discusses irrigation.'\n• Topic plus fact: 'Irrigation is used in many parts of Pakistan.'\n• Topic plus claim: 'Canal irrigation in Punjab has raised wheat yields but has also accelerated soil salinisation.'\n\nThe third version sets up a paragraph with a clear direction: evidence of higher yields, evidence of salinisation, and an explanation of the trade-off.\n\nGood topic sentences:\n• Are specific enough to be argued with\n• Connect to the previous paragraph or to your thesis\n• Avoid quotations; your own words should frame the evidence\n• Are not so broad that they need a whole chapter\n\nIn empirical writing such as results sections, the topic sentence often states the main finding: 'Removal efficiency was highest at a hydraulic retention time of 12 hours.' The rest of the paragraph then gives figures and comparisons.\n\nTry this: read only the first sentence of each paragraph in a section. Together, they should form a coherent summary of the section. This is sometimes called a 'skim test'."}, {"t": "Paragraph models: PEEL, MEAL and their limits", "b": "Many universities teach a paragraph model to help students structure argument paragraphs. The two most common are:\n\n• PEEL: Point, Evidence, Explanation, Link\n• MEAL: Main idea, Evidence, Analysis, Link back\n\nOthers include TEEL (Topic sentence, Explanation, Evidence, Link) and PIE (Point, Illustration, Explanation). They share the same logic:\n1. State your claim.\n2. Support it with evidence from sources or data.\n3. Explain what the evidence means and why it supports your claim. This is where marks for critical thinking are earned.\n4. Link back to your argument or forward to the next point.\n\nThe most common weakness is skipping step 3. Students place a quotation or statistic and move on, assuming the meaning is obvious. It is not. Analysis means saying how and why the evidence supports your point, noting its limits, or comparing it with other evidence.\n\nThese models are scaffolds, not laws. A literature review paragraph might synthesise several sources around one theme. A methods paragraph describes a procedure in order. A discussion paragraph might follow finding, comparison with literature, explanation, implication. Learn the logic, then adapt the pattern to the genre.\n\nA rough proportion to aim for in argument paragraphs: at least as much explanation and analysis as evidence."}, {"t": "Given before new: the secret of smooth flow", "b": "Readers process sentences more easily when each one begins with information they already know (given) and ends with information that is new. The new information at the end of one sentence then becomes the given information at the start of the next. Williams and Bizup's book Style develops this idea in detail.\n\nCompare:\n\nHard to follow: 'Drought tolerance is a key trait for farmers in semi-arid regions. Researchers have developed new sorghum varieties. Breeding programmes in Ethiopia and Sudan produced them.'\n\nBetter: 'Farmers in semi-arid regions need crops that tolerate drought. One such crop is sorghum, for which breeders have developed several drought-tolerant varieties. Many of these varieties came from programmes in Ethiopia and Sudan.'\n\nIn the second version, each sentence picks up an idea from the end of the previous one (drought, sorghum, varieties). The reader never has to search for the connection.\n\nTwo related habits:\n• Keep a consistent topic string. When several sentences are about the same thing, start them with the same subject or a close variant.\n• Put the most important or complex information at the end of the sentence, where readers naturally place emphasis. This is sometimes called end focus.\n\nWhen a paragraph feels choppy, look at the first five or six words of each sentence. Are they familiar to the reader? If not, reorder."}, {"t": "Cohesion devices: the glue between sentences", "b": "Cohesion is the set of language signals that tie sentences together. There are four main types.\n\n• Reference words: this, these, such, it, they. Add a noun after 'this' to avoid ambiguity: 'This increase', 'This approach', not just 'This'.\n• Repetition of key terms: deliberate repetition keeps the reader on track. Academic English tolerates more repetition than school essays.\n• Related words and summary nouns: 'The government cut the fuel subsidy. The decision...' or 'The policy...'.\n• Transition words that show logical relationships:\n  – Addition: in addition, also, similarly\n  – Contrast: however, in contrast, whereas, although\n  – Cause and result: because, therefore, consequently, as a result\n  – Example: for example, for instance, such as\n  – Sequence: first, subsequently, finally\n\nTwo common problems:\n• Overuse: starting every sentence with 'Moreover', 'Furthermore' or 'Additionally'. If the logic is clear from given-new order, you do not need a connector.\n• Wrong logic: using 'Furthermore' before a contrasting point, or 'Therefore' when the second sentence does not follow from the first.\n\nPunctuation matters too. 'However' joining two s
