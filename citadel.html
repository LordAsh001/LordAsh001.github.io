urveys, interviews, focus groups or their personal data, you almost certainly need ethics approval before collecting any data. This includes research in your home country and online surveys. Each country has a framework. Canada uses TCPS 2, and the free TCPS 2 CORE tutorial gives a certificate that many Canadian universities require. In the US, the federal Common Rule governs research with human subjects and Institutional Review Boards (IRBs). Australia uses the National Statement on Ethical Conduct in Human Research (2023), in effect since 1 January 2024. UK universities run their own research ethics committees. You may also need permission from authorities in the country where you collect data. Data collected without approval may be unusable and can be treated as misconduct."}, {"t": "Managing your research data", "b": "Many funders and universities expect a data management plan. The University of Dundee says all its research staff and students are expected to create one. A plan covers what data you will collect, how you will store and back it up, who can access it, how you will protect personal information, and what happens to it at the end. A practical rule many librarians teach is to keep three copies of important files, on two types of storage, with one copy off-site, such as university cloud storage. Do not keep the only copy of your thesis data on a personal laptop or a USB stick. Store identifiable interview data only in university-approved, secure locations, not personal WhatsApp or free cloud accounts. Use clear file names with dates and versions."}], "checks": [{"q": "Which search finds papers containing BOTH 'recycling' and 'Lagos'?", "o": ["recycling AND Lagos", "recycling OR Lagos", "recycling NOT Lagos", "\"recycling Lagos\" only"], "a": 0, "why": "AND requires both terms and narrows the search."}, {"q": "Which Google Scholar feature shows newer papers that cite an older paper?", "o": ["All versions", "My profile", "Related searches", "Cited by"], "a": 3, "why": "'Cited by' lists later works citing the paper."}, {"q": "What should you read first to decide if a paper is relevant?", "o": ["The full methods section", "The acknowledgements", "The abstract", "The references"], "a": 2, "why": "The abstract is a quick overview of the study."}, {"q": "A good literature review is organised mainly by:", "o": ["Author surname", "Themes, debates or methods", "Publication date only", "Journal name"], "a": 1, "why": "Organising by theme supports synthesis and shows gaps."}, {"q": "You plan to interview farmers in Kenya for a UK master's dissertation. When do you need ethics approval?", "o": ["Before you start collecting data", "Never, because it is outside the UK", "After the interviews", "Only if you publish"], "a": 0, "why": "Approval is needed before data collection, wherever it takes place."}, {"q": "Which framework applies to human research ethics in Canada?", "o": ["The Common Rule", "GDPR only", "The National Statement", "TCPS 2"], "a": 3, "why": "Canada uses TCPS 2; the CORE tutorial teaches it."}, {"q": "What is the safest way to store interview recordings with identifiable participants?", "o": ["On your phone only", "In a personal WhatsApp chat", "In university-approved secure storage with backups", "On a shared USB stick"], "a": 2, "why": "Personal data must be stored securely in approved locations."}], "checklist": ["Book a library induction or a session with your subject librarian.", "Set your university library in Google Scholar settings.", "Install Zotero or Mendeley and the browser connector in week one.", "Keep a search log with databases, dates and search strings.", "Use a note template for every paper: question, method, findings, limits, relevance.", "Check whether your project needs ethics approval and how long it takes.", "Write a simple data management plan and set up automatic backups."], "links": [{"t": "Google Scholar: Search help", "u": "https://scholar.google.com/intl/en/scholar/help.html"}, {"t": "Curtin University: Reading strategies", "u": "https://uniskills.library.curtin.edu.au/academic-writing/reading-and-note-taking/reading-strategies/"}, {"t": "Zotero", "u": "https://www.zotero.org/"}, {"t": "Panel on Research Ethics (Canada): TCPS 2 CORE tutorial", "u": "https://ethics.gc.ca/eng/education_tutorial-didacticiel.html"}, {"t": "NHMRC: National Statement on Ethical Conduct in Human Research (2023)", "u": "https://www.nhmrc.gov.au/about-us/publications/national-statement-ethical-conduct-human-research-2023"}, {"t": "HHS: The Common Rule", "u": "https://www.hhs.gov/ohrp/regulations-and-policy/regulations/common-rule/index.html"}]}, {"id": "participation", "title": "Seminars, group work and presentations", "goals": ["Prepare for and contribute confidently to seminars.", "Use practical phrases to agree, disagree and ask for clarification politely.", "Organise group work fairly and avoid collusion.", "Give clear, well-timed presentations and understand local classroom etiquette."], "lessons": [{"t": "What seminars are for", "b": "A seminar is a small-group session for in-depth discussion, usually linked to a lecture and based on set reading. The Chevening guide to UK seminars notes that you are expected to share your views, agree or disagree with others and ask for clarification, and that UK universities see this discussion as central to learning. Deakin University reminds students that a seminar is \"a discussion, not a test\". You do not need perfect answers. You need to show you have engaged with the material and can think aloud. Seminar tutors are often looking for thoughtful questions as much as confident statements. If you come from a system where silence showed respect, reframe it. Here, a respectful student is one who prepares and contributes, and silence can be read as lack of preparation."}, {"t": "Preparing to speak", "b": "Most good contributions are prepared. After each reading, write three things on a card: one point you found convincing, one you doubt, and one question. That is enough to speak at least once. Chevening suggests committing to one contribution per seminar and building from there, and practising summaries aloud rather than silently. Speak early. The longer you wait, the harder it gets, and early in the discussion the easy points are still available. Link your point to the reading or to a classmate: \"Building on what Maria said...\" Experience from home is valuable if you connect it to the topic. For example, a student from Kenya could say, \"In Nairobi, informal settlements show a different pattern from the one in this reading, because...\" That kind of comparison is often welcomed."}, {"t": "Speaking up when English is not your first language", "b": "Your accent is not a problem. Universities in these countries are full of accents, including among staff. What matters is being understood, so slow down slightly, pause between ideas and put your main point first. If you need thinking time, use a holding phrase such as \"That's an interesting question. Let me think for a second.\" If you did not understand, ask: \"Sorry, could you say that again?\" or \"Do you mean that...?\" Native speakers do this all the time. If spoken discussion is very hard at first, contribute in other ways. Use the chat in online sessions, speak in small-group tasks, or talk to the tutor after class. Many universities run free conversation groups and English for academic purposes classes for postgraduates, even if your English test score was high."}, {"t": "Disagreeing politely", "b": "Disagreement about ideas is normal and valued, but tone matters. Focus on the argument, not the person, and acknowledge the other view before giving yours. Useful phrases include: \"I see your point, but I wonder whether...\" \"That's true in some contexts. In Ghana, though, the evidence suggests...\" \"I'm not sure I agree, because...\" \"Could we look at it another way?\" \"What evidence would support that?\" Avoid \"You are wrong\" or \"That is nonsense\". Also avoid giving in immediately just to keep the peace. In some cultures, open disagreement with an older person or a teacher is rude. Here, a lecturer will usually be pleased if you challenge their argument with evidence, as long as you are courteous. If someone disagrees with you, it is not an insult. Respond to their reasoning."}, {"t": "Making group work work", "b": "Group projects are common, and they are often assessed. The University of Wolverhampton's group-work guide recommends agreeing ground rules at the start, including the minimum expected participation and how difficulties will be handled. Allocate tasks fairly, using people's strengths while letting others learn new skills. Keep accurate records of meetings and who did what. These are valuable if there is a dispute or if marks are adjusted for contribution. Use a shared document and a simple task list with deadlines. When problems arise, focus on tasks, not personalities, and raise issues early with the group, then with the tutor if needed. Be careful when a group project has individual parts. Wolverhampton warns that working together on individually assessed sections can be collusion."}, {"t": "Presentations that land", "b": "Presentations are assessed on content, structure, delivery and timing. Start by telling the audience your main message in one sentence and your outline. Use slides as visual support, not as a script. A few words, a clear figure or a key number per slide is better than paragraphs. Rehearse aloud with a timer at least three times. Going over time is often penalised, and running out of time means your conclusion is lost. Speak to the audience, not the screen, and slow down. Nervous speakers usually talk too fast. Prepare for questions by listing the three questions you would least like to be asked and drafting answers. If you do not know an answer, say so honestly and suggest how you would find out. That is a strong academic response."}, {"t": "First names, punctuality and other unwritten rules", "b": "Classroom culture can be more informal than at home. Murdoch University notes that many Australian lecturers prefer to be called by their first name, and this is common in the UK and Canada too. In the US, many students use \"Professor\" or \"Dr\" unless invited otherwise. Watch what others do, or ask. Informality does not mean lower standards. Deadlines are firm, and punctuality is expected. Arriving after a seminar starts is noticed, and in some systems a few minutes late is normal, but here it is seen as disrespectful. If you will be late or absent, email beforehand. Other unwritten rules: put phones away, do not hold side conversations during lectures, and do not record classes unless the course allows it or you have an approved accessibility adjustment."}, {"t": "Online and hybrid sessions", "b": "Many postgraduate courses include online seminars, especially for part-time and distance students. The Chevening guide advises following the tutor's instructions on audio, cameras and chat, and participating as you would in person. Do not interrupt. Respond to peers' comments instead of always starting new topics, avoid writing in capital letters, and ask open questions that need more than a yes or no. Test your microphone before class and find a quiet space, which can be hard in shared student housing, so plan ahead. If your internet connection is unreliable, tell the tutor and contribute through the chat. Typing a well-thought-out comment in the chat counts as participation in most online seminars and can be a comfortable first step for students who are nervous about speaking."}], "checks": [{"q": "What is a seminar mainly for?", "o": ["Receiving dictated notes", "Discussing ideas from preparation and readings", "Taking a test", "Watching videos"], "a": 1, "why": "Seminars are discussion-based and rely on preparation."}, {"q": "Which is the most polite way to disagree?", "o": ["I see your point, but the evidence from Ghana suggests something different.", "That is nonsense.", "You are wrong.", "Staying silent and agreeing."], "a": 0, "why": "It acknowledges the other view and gives evidence."}, {"q": "You did not understand a classmate's question. What should you say?", "o": ["Nothing", "Change the topic", "Your English is bad", "Sorry, could you say that again?"], "a": 3, "why": "Asking for repetition is normal and polite."}, {"q": "What does the University of Wolverhampton recommend at the start of group work?", "o": ["Choose a leader who does everything", "Split the mark equally regardless of effort", "Agree ground rules, including expected participation and handling difficulties", "Never meet"], "a": 2, "why": "Ground rules set expectations and reduce conflict."}, {"q": "Your group project includes an individually assessed report. What is safe?", "o": ["Writing each other's sections", "Discussing ideas but writing your own section", "Sharing one report and changing names", "Copying the strongest member's work"], "a": 1, "why": "Working together on individual sections can be collusion."}, {"q": "Your Australian lecturer signs emails 'Cheers, Sam'. What is a reasonable thing to call her in class?", "o": ["Sam", "Madam", "Teacher", "Nothing"], "a": 0, "why": "Many Australian lecturers prefer first names."}, {"q": "You are presenting and do not know the answer to a question. Best response?", "o": ["Make something up", "Blame your group", "Ignore the question", "Say you are not sure and explain how you would find out"], "a": 3, "why": "Honesty with a plan is a strong academic response."}], "checklist": ["Prepare a card for each seminar: one convincing point, one doubt, one question.", "Commit to speaking at least once per seminar.", "Learn five phrases for agreeing, disagreeing and clarifying.", "Agree ground rules and a task list at the first group meeting.", "Keep notes of group meetings and contributions.", "Rehearse presentations aloud with a timer at least three times.", "Arrive on time and email in advance if you will be late or absent.", "Check whether your university offers free conversation groups or academic English classes."], "links": [{"t": "Chevening: A guide to UK university seminars", "u": "https://chevening.org/resource-hub/scholar-support/a-chevening-guide-to-uk-university-seminars/"}, {"t": "Deakin University: Participating in discussion", "u": "https://deakin.edu.au/students/studying/study-support/academic-skills/participating-in-discussion"}, {"t": "Newcastle University: Seminar participation", "u": "https://www.ncl.ac.uk/academic-skills-kit/study-skills/seminar-participation"}, {"t": "University of Wolverhampton: Guide to group work (PDF)", "u": "https://www.wlv.ac.uk/lib/media/departments/lis/skills/study-guides/LS003-Guide-to-Group-Work.pdf"}, {"t": "Murdoch University: Australian academic culture", "u": "https://www.murdoch.edu.au/news/blogs/blog-posts/making-the-move-to-murdoch-and-perth/australian-academic-culture"}]}, {"id": "abstract", "title": "Abstracts, titles and keywords", "sub": "Getting your work found and read", "goals": ["Identify the type of abstract a journal, conference or programme is asking for and follow its word limit", "Write an abstract that moves clearly from background to aim, method, results and conclusion", "Draft a precise title that carries the key terms a reader would search for", "Choose keywords and highlights that help databases and busy readers find and judge your work"], "lessons": [{"t": "Why the abstract matters so much", "b": "Most people who meet your work will only ever read the title and the abstract. Editors use them to decide whether to send a paper for review. Conference committees use them to accept or reject talks. Examiners read the thesis abstract first and form an early impression. Databases such as Scopus, Web of Science and Google Scholar index them, so the words you choose decide whether a search finds you.\n\nAn abstract is a short, self-contained summary of the whole work. Self-contained means a reader should understand it without opening the paper: no undefined abbreviations, no 'see Table 2', and usually no citations.\n\nAn abstract is not an introduction. A common mistake is to spend most of the words on background and stop just before the findings. The reader wants to know what you did and what you found. A useful test: if someone read only your abstract, could they explain your main result to a colleague in one sentence? If not, the abstract is not finished yet."}, {"t": "Types of abstract", "b": "Not every abstract looks the same. Check the instructions before you write.\n\n• Unstructured (paragraph) abstract: one block of text, usually 150 to 300 words. Common in engineering, social science and humanities journals.\n• Structured abstract: the same content under fixed headings such as Background, Objective, Methods, Results, Conclusions. Common in medicine, public health and nursing. Use the exact headings the journal lists.\n• Descriptive abstract: says what the work covers but does not report results. Short, and mostly used for some humanities pieces, reports or proposals.\n• Informative abstract: reports aim, method, key results and conclusion. This is what most research journals want.\n• Conference abstract: often written before all the results are in, and judged on its own. It may be longer (sometimes 300 to 500 words) and may allow a figure. Never promise results you are not sure you will have.\n• Thesis abstract: summarises the whole thesis, often in 300 words or one page, depending on the university.\n• Graphical abstract: a single image that shows the main finding or process at a glance. Many Elsevier, ACS and Cell journals ask for one."}, {"t": "The moves of an abstract", "b": "Genre researchers such as Swales and Feak describe an abstract as a series of 'moves'. A move is a step that does one job for the reader. Most informative abstracts contain five:\n\n• Background: one or two sentences on the problem and why it matters.\n• Aim: what this study set out to do. 'This study examined...', 'We aimed to...'\n• Method: what you did, with whom or what, where and how. Give the design, sample or material, setting and main analysis.\n• Results: your main findings, with numbers where possible.\n• Conclusion: what the findings mean and why someone should care.\n\nA rough word share that works for many papers: background 10 to 15 per cent, aim 5 to 10, method 20 to 25, results 35 to 40, conclusion 15. Notice that results get the largest share.\n\nFields differ. Humanities abstracts may stress the argument rather than a method. Review papers replace 'method' with how the literature was searched and selected. But in every case, ask: does each move get at least one clear sentence?"}, {"t": "Writing the abstract step by step", "b": "Write the abstract last, or at least revise it last. You cannot summarise what you have not finished.\n\nA practical method:\n\n• Step 1: Copy one key sentence from each part of your paper: the gap from the introduction, the aim, the core method, the two or three main results, the main conclusion.\n• Step 2: Rewrite those sentences so they join smoothly. Remove citations and figure numbers.\n• Step 3: Count words. Cut background first, never results.\n• Step 4: Add numbers. 'Yields rose' is weak. 'Yields rose by 18% (from 2.2 to 2.6 t/ha)' is strong.\n• Step 5: Check that every claim in the abstract appears in the paper. An abstract must not say more than the paper does.\n\nUseful tense patterns:\n• Background in present tense: 'Malaria remains a leading cause of child deaths.'\n• Method and results in past tense: 'We surveyed 412 farmers. Adoption was higher among...'\n• Conclusion in present tense: 'These findings suggest that...'\n\nUseful verbs: examines, investigates, compares, evaluates, proposes; found, showed, revealed, increased, reduced; suggest, indicate, highlight, support."}, {"t": "Word limits and cutting", "b": "Word limits are strict. Many online submission systems will not accept an abstract that is one word over. Typical limits: 150 to 250 words for journal articles, 250 to 350 for some structured medical abstracts, and whatever the call says for conferences.\n\nIf you are over the limit, cut in this order:\n\n• Background that any reader in your field already knows.\n• Phrases that announce rather than say: 'In this paper, the authors will attempt to investigate...' becomes 'We investigated...'.\n• Lists of every variable or test. Name the main ones.\n• Repeated ideas between aim and conclusion.\n• Hedging piled on hedging: 'may possibly suggest' becomes 'suggests'.\n\nDo not cut: the main numerical result, the sample or setting, and the one-line conclusion.\n\nAvoid abbreviations unless the term appears several times and is well known. Define any abbreviation you keep at first use, because the abstract is read separately from the paper. If you are under the limit by a large amount, check whether a move is missing, usually the method details or the conclusion."}, {"t": "Writing titles", "b": "A title has two jobs: tell the reader exactly what the work is about, and contain the words they would search for.\n\nThree common title types:\n\n• Descriptive (indicative): names the topic and design. 'Effects of drip irrigation on tomato yield in semi-arid northern Nigeria: a field trial'.\n• Declarative: states the main finding. 'Drip irrigation raises tomato yield by a fifth in semi-arid northern Nigeria'. Popular in biomedical and some science journals, less so in social science.\n• Question: 'Does drip irrigation pay for smallholder tomato farmers?' Can attract readers, but some journals discourage it.\n\nMany titles use a colon to join a topic and a design, place or method: 'Teacher feedback in large classes: a mixed-methods study in Kenyan secondary schools'.\n\nGood practice:\n• Aim for about 10 to 15 words, but follow field norms.\n• Put the most important terms near the start.\n• Name the population, setting, or material when it matters.\n• Avoid empty openers such as 'A study of', 'Investigation into', 'Some aspects of'.\n• Avoid unexplained abbreviations, jokes that hide the topic, and claims the paper cannot support."}, {"t": "Choosing keywords for discovery", "b": "Most journals ask for 3 to 8 keywords. Search engines and databases use them, together with the title and abstract, to match your paper with readers.\n\nHow to choose them:\n\n• Do not repeat words already in your title. The title is indexed anyway, so keywords add extra chances to be found.\n• Think like a searcher. What would a researcher type into Google Scholar to find a paper like yours? Try the search yourself and see what comes up.\n• Include synonyms and spelling variants: 'wastewater' and 'effluent'; 'smallholder' and 'small-scale farmer'.\n• Use short phrases of two or three words, not single vague words. 'Climate change' alone is too broad; 'climate adaptation' with 'maize' and 'Ghana' is better.\n• Include the method or design if it is distinctive: 'life cycle assessment', 'thematic analysis', 'randomised controlled trial'.\n• Include the setting or population if relevant.\n• Check if the journal uses a controlled vocabulary. Health journals often want MeSH (Medical Subject Headings) terms; some engineering and economics journals use classification codes.\n\nThen make sure your key terms also appear naturally in the abstract, ideally more than once."}, {"t": "Highlights and graphical abstracts", "b": "Some publishers, notably Elsevier, ask for highlights: a short bulleted list of the main points. Elsevier's guidance asks for three to five bullets, each no longer than 85 characters including spaces. Check your target journal, because rules differ.\n\nGood highlights:\n• Each bullet makes one point, usually a finding or a new method.\n• Use plain words and avoid jargon.\n• Write full but short statements, not headings.\n\nExample set for a water study:\n• Sand filters removed 92% of E. coli from rural borehole water\n• Removal stayed above 85% after six months without maintenance\n• Filter cost was below 5 USD per household\n\nA graphical abstract is one image that summarises the study, often a simple flow from problem to method to finding. Keep it clean: few words, large labels, a clear left-to-right or top-to-bottom reading order. Do not paste a crowded results figure.\n\nHighlights and graphical abstracts increasingly appear in search results and on social media, so treat them as part of how your work is found and shared."}], "examples": [{"label": "Unstructured abstract that stops before the results", "weak": "Food insecurity is a major global challenge. Many studies have examined it in different contexts. In Africa, it is affected by climate, conflict and poverty. Smallholder farmers are very important for food production. Climate change has made rainfall more variable. This study therefore aims to investigate the relationship between climate adaptation practices and household food security among smallholder farmers in Ghana. A survey was used. The results are discussed and recommendations are made.", "strong": "Rainfall variability threatens household food security among smallholder farmers in northern Ghana, yet evidence on which adaptation practices protect food access is limited. This study examined whether three practices (drought-tolerant maize, crop diversification and water harvesting) were associated with household food security. We surveyed 386 households in two districts and measured food security with the Household Food Insecurity Access Scale. Households using drought-tolerant maize were 1.8 times more likely to be food secure (95% CI 1.2 to 2.7), while water harvesting showed no significant association. Crop diversification helped only when combined with improved seed. Extension services should prioritise improved seed packages over stand-alone water harvesting in this region.", "why": "The weak version spends almost all its words on background and ends with 'results are discussed'. The strong one gives each move a sentence, names the sample, measure and setting, and reports actual numbers and a usable conclusion."}, {"label": "Vague title versus searchable title", "weak": "A study of some aspects of students and technology in a developing country", "strong": "Mobile phone use for self-study among first-year engineering students in Pakistan: a survey of 600 students", "why": "The weak title has no searchable terms and hides the setting. The strong title names the technology, the population, the country and the design, so both readers and databases can match it."}, {"label": "Keywords that repeat the title", "weak": "Title: Biogas production from cassava peel in Nigeria. Keywords: biogas; cassava; Nigeria; production; peel", "strong": "Title: Biogas production from cassava peel in Nigeria. Keywords: anaerobic digestion; agro-processing residues; methane yield; renewable energy; co-digestion; West Africa", "why": "The weak list adds nothing that the title does not already index. The strong list adds the process name, synonyms, a measured outcome and a broader region, so the paper appears in more relevant searches."}], "checks": [{"q": "A journal asks for an abstract of up to 200 words. Your draft is 260 words. Which part should you cut first?", "o": ["The main numerical results", "General background that most readers in your field already know", "The sample size and setting", "The one-sentence conclusion"], "a": 1, "why": "Background is the easiest to shorten without losing what is new. Results, sample and conclusion are what readers most need, so they should be kept."}, {"q": "Which sentence is the clearest 'aim' move in an abstract?", "o": ["Water quality is a big issue in many rural areas.", "Many scholars have looked at boreholes in the past.", "The results show that chlorination is effective.", "This study compared the microbial quality of borehole and hand-dug well water in rural Kenya."], "a": 3, "why": "The aim move states what the study set out to do, and option D does this precisely. A is background, B is a weak literature statement, and C is a result."}, {"q": "A public health journal asks for a structured abstract with the headings Background, Methods, Results, Conclusions. What should you do?", "o": ["Use exactly those headings and put the right content under each", "Write a normal paragraph because content matters more than form", "Add your own extra headings such as 'Literature Review' and 'Theory'", "Use the headings but leave Results short so the paper keeps some surprise"], "a": 0, "why": "Structured abstracts follow the journal's headings exactly. Ignoring the format can lead to the paper being returned before review, and results should never be held back."}, {"q": "Which title is a declarative title?", "o": ["Teacher feedback practices in Indian secondary schools", "Does peer tutoring improve maths scores?", "Peer tutoring raises maths scores among Grade 8 pupils in rural Kerala", "Peer tutoring: a review"], "a": 2, "why": "A declarative title states the main finding, as option C does. A and D are descriptive titles, and B is a question title."}, {"q": "Your title is 'Solar drying of tomatoes in Northern Ghana'. Which keyword set adds the most search value?", "o": ["solar; drying; tomatoes; Ghana", "postharvest loss; food preservation; dehydration; renewable energy; smallholder farmers", "science; research; agriculture; Africa", "tomato drying; solar tomato drying; Ghana tomatoes"], "a": 1, "why": "Option B adds related terms and synonyms that are not in the title. A and D mostly repeat the title, and C is too broad to help anyone find the paper."}, {"q": "What makes an abstract 'self-contained'?", "o": ["It cites at least five sources so readers can check the background", "It refers readers to the key figure for the main result", "It uses the same abbreviations as the paper without defining them, to save words", "It can be understood on its own, without the reader needing the full paper"], "a": 3, "why": "Abstracts are read and indexed separately from the paper. So they avoid references to figures, define any abbreviations, and usually avoid citations."}, {"q": "You are writing a conference abstract three months before the conference, and your data collection is not finished. What is the most honest approach?", "o": ["Report the results you expect, since they will probably be true", "Leave out the method so reviewers focus on the topic", "Describe the aim and method clearly, report any preliminary results as preliminary, and state what the full analysis will show", "Copy the abstract of a similar published study and change the country"], "a": 2, "why": "Conference committees accept work in progress if it is honestly described. Inventing expected results or copying another abstract is misconduct, and leaving out the method makes the abstract weaker."}, {"q": "Which verb tense pattern is most common in an informative abstract in the sciences?", "o": ["Present for background, past for method and results, present for conclusion", "Future tense throughout", "Past tense for background, present for results", "Present continuous throughout ('we are measuring...')"], "a": 0, "why": "General facts and implications are in present tense, while what you did and found in this study is usually in past tense. Future tense belongs mainly in proposals."}, {"q": "Which highlight best fits Elsevier-style guidance?", "o": ["Introduction and background to the problem of plastic waste in Lagos", "In this paper we have attempted to carry out a detailed investigation into a range of different factors affecting plastic waste management in Lagos", "Results", "Household plastic waste in Lagos fell 30% after a deposit-return pilot"], "a": 3, "why": "A good highlight states one clear finding briefly, as D does. A and C are headings, and B is far over 85 characters and says nothing specific."}, {"q": "Which of these is the weakest opening for a title?", "o": ["Microplastic contamination in drinking water sachets in Accra", "A study of some aspects of microplastics", "Microplastics in sachet water: a cross-sectional survey in Accra", "Do drinking water sachets carry microplastics? Evidence from Accra"], "a": 1, "why": "'A study of some aspects of' wastes the most visible words in the title and gives no setting, material or design. The other three are specific and searchable."}, {"q": "Your abstract says 'the intervention reduced dropout rates across all schools', but in the paper the reduction is significant in only two of five schools. What is the problem?", "o": ["None, abstracts are allowed to simplify", "The abstract should not mention dropout at all", "The abstract overstates the findings and must match what the paper actually shows", "It should be moved to the keywords"], "a": 2, "why": "An abstract must never claim more than the paper supports. Simplifying is fine, but changing 'two of five schools' into 'all schools' misleads readers who see only the abstract."}], "checklist": ["Find the exact abstract type, headings and word limit in your target journal's or university's author guidelines and write them at the top of your draft.", "Copy one key sentence from each section of your paper (gap, aim, method, main results, conclusion) and turn them into a first abstract.", "Check that results take the largest share of your words and include at least one real number.", "Remove citations, figure references and undefined abbreviations from your abstract.", "Rewrite your title so the most important search terms appear in the first half and the setting or design is clear.", "Choose 4 to 6 keywords that do not repeat your title, and test two of them in Google Scholar to see what they find.", "Compare every claim in your abstract against the full paper and soften any that go further than your evidence."], "practice": "Take a paper, chapter or proposal you are working on and write a 150-word abstract with one sentence for each of the five moves (background, aim, method, results, conclusion). Then write three possible titles for it: one descriptive, one declarative and one question, and choose the best one for your target journal.", "reading": [{"book": "Swales, J. M. and Feak, C. B. (2009) Abstracts and the Writing of Abstracts. University of Michigan Press.", "why": "A short, practical volume built around the moves of research article abstracts, with tasks on conference abstracts and on how abstracts differ across fields. Ideal if English is your additional language."}, {"book": "Gastel, B. and Day, R. A. (2024) How to Write and Publish a Scientific Paper. 9th edn. Cambridge University Press.", "why": "Read the chapters on how to prepare the title, the abstract and keywords. Clear guidance on what editors and indexers look for, especially for science and engineering papers."}, {"book": "Glasman-Deal, H. (2020) Science Research Writing for Native and Non-Native Speakers of English. 2nd edn. World Scientific.", "why": "The part on writing the abstract breaks it into steps and gives sentence patterns and vocabulary drawn from real scientific papers, which helps multilingual writers build their own sentences."}], "links": [{"t": "UNC Writing Center: Abstracts", "u": "https://writingcenter.unc.edu/tips-and-tools/abstracts/"}, {"t": "Elsevier: guidance on writing highlights", "u": "https://www.elsevier.com/researcher/author/tools-and-resources/highlights"}, {"t": "Manchester Academic Phrasebank: introducing work", "u": "https://www.phrasebank.manchester.ac.uk/introducing-work/"}, {"t": "Manchester Academic Phrasebank: reporting results", "u": "https://www.phrasebank.manchester.ac.uk/reporting-results/"}]}, {"id": "aims", "title": "Aims and objectives", "sub": "Turning purpose into concrete steps", "goals": ["Distinguish a research aim from research objectives and write one clear aim", "Write SMART objectives using precise action verbs suited to each stage of research", "Replace vague verbs such as understand, study and know with verbs that show a definite outcome", "Build an alignment matrix linking objectives to research questions, methods, data and chapters"], "lessons": [{"t": "Aim versus objectives", "b": "The aim is the overall purpose of your study: what you hope to achieve in the end. It is usually one sentence. The objectives are the specific steps you will take to achieve the aim. Each objective is a smaller, concrete piece of work with a definite result.\n\nA simple way to remember it: the aim is the destination; the objectives are the stages of the journey.\n\nExample\nAim: To evaluate the potential of rice husk ash as a partial cement replacement in low-cost housing blocks in Bangladesh.\nObjectives:\n1. To characterise the chemical composition and particle size of locally produced rice husk ash.\n2. To determine the compressive strength of blocks with 0, 10, 20 and 30 per cent ash replacement.\n3. To compare the production cost of ash-blended and conventional blocks.\n4. To assess local builders' willingness to use ash-blended blocks.\n\nNotice that the aim alone cannot be measured directly, but each objective can. When every objective is achieved, the aim should be achieved too.\n\nSome universities and fields use slightly different terms, such as 'purpose statement' (common in North America, following Creswell) or 'specific aims' (common in health sciences funding). The logic is the same."}, {"t": "SMART objectives", "b": "SMART is a checklist borrowed from management and widely used for research objectives. Each objective should be:\n\n• Specific: it says exactly what will be done, to what or whom, and where. 'To measure nitrate concentration in 30 boreholes in Kano metropolis' rather than 'to look at groundwater'.\n• Measurable: you can tell when it is complete and what the output is (a value, a model, a comparison, a set of themes).\n• Achievable: it is possible with your time, skills, data and budget.\n• Relevant: it contributes directly to your aim. If an objective could be removed without weakening the aim, it may not belong.\n• Time-bound: it fits your project timeline. In a proposal, show when each objective will be done in your Gantt chart or work plan.\n\nIn qualitative research, 'measurable' does not mean numerical. It means the output is identifiable: for example, 'a set of themes describing how teachers adapt lessons' is a clear output.\n\nSMART is a test, not a template. Do not force every objective into a long sentence covering all five letters. Check each objective against the five letters, and fix the weakest one."}, {"t": "Action verbs by research stage", "b": "Each objective should start with an action verb that tells the reader what kind of work you will do. Choose verbs that match the stage and type of research.\n\nExploring and describing:\n• identify, describe, document, map, characterise, measure, determine, estimate\n\nAnalysing and explaining:\n• examine, analyse, compare, investigate, explore, explain, establish (a relationship), quantify\n\nDesigning and building:\n• develop, design, formulate, construct, model, simulate, optimise, propose\n\nTesting and judging:\n• test, validate, evaluate, assess, appraise, verify, benchmark\n\nRecommending:\n• recommend, propose (a framework or guidelines), derive (implications)\n\nA well-designed set of objectives often moves through these stages. For example: identify the factors, measure them, analyse the relationship, develop a model, and evaluate its performance.\n\nUse 'explore' for open, qualitative work where you do not yet know the categories. Use 'determine' or 'measure' when you will produce a definite value. Use 'evaluate' or 'assess' when you will judge something against criteria, and say what the criteria are."}, {"t": "Verbs to avoid", "b": "Some verbs describe mental states or general activity, not a definite result. They make objectives impossible to check.\n\nAvoid these as the main verb of an objective:\n• understand: you cannot show when understanding is complete. Replace with explain, identify or describe.\n• know, learn, find out: replace with determine, measure or identify.\n• study, look at, research: these describe the whole project, not a step. Replace with the actual task: compare, measure, analyse.\n• consider, discuss, highlight: these describe writing, not research.\n• appreciate, be aware of: not measurable.\n• improve, solve: usually beyond what a study can promise. A study can develop and test an improved design, not guarantee improvement.\n\nWeak: 'To understand the challenges of e-waste recycling in Accra.'\nStronger: 'To identify the main health and financial risks reported by informal e-waste recyclers in Agbogbloshie.'\n\nWeak: 'To study the effect of temperature on biogas yield.'\nStronger: 'To determine the effect of digester temperature (25, 35 and 45 °C) on biogas yield from cassava peel.'\n\nAlso avoid joining two or three verbs in one objective ('to identify and evaluate and recommend …'). Each verb usually signals a separate objective."}, {"t": "How many objectives?", "b": "There is no single rule, but common practice is:\n• Undergraduate or taught master's dissertation: often three to four objectives.\n• Research master's or PhD: often three to six objectives, sometimes grouped into work packages or studies.\n\nToo few objectives (one or two) may mean the aim is too narrow, or the objectives are just the aim rewritten. Too many (eight or more) usually means some objectives are really tasks ('collect data', 'write chapter 2'), or that the project is too big.\n\nFor PhD projects built as a series of papers, each paper often answers one or two objectives. Discuss this structure with your supervisor early.\n\nConventions differ about whether a literature review counts as an objective. Some UK and Commonwealth programmes accept 'To critically review the literature on …' as the first objective. Others, especially in North America and in science and engineering, see the review as normal background work, not a research objective. If your programme accepts it, make it specific: what will the review produce? For example, 'to identify the variables most often used to measure …'. Check recent theses from your department to see what is expected."}, {"t": "Aligning objectives with research questions", "b": "Objectives and research questions are two ways of describing the same work. Objectives say what you will do. Questions say what you want to know. They must match.\n\nThe simplest approach is one-to-one: each objective has a matching question.\n• Objective 2: To determine the compressive strength of blocks with 0 to 30 per cent rice husk ash.\n• Question 2: How does the percentage of rice husk ash affect the compressive strength of the blocks?\n\nSometimes one objective answers two closely related questions, or one question needs two objectives. That is acceptable, but every objective must link to at least one question, and every question must be addressed by at least one objective.\n\nSome programmes ask for both objectives and questions; others ask for only one. Do not write both if your template does not require them, because repetition adds length without content. If you must write both, make them consistent in scope: an objective about '30 boreholes in Kano' should not match a question about 'groundwater in northern Nigeria'.\n\nWhen your question changes during the project, update the objective, and vice versa. Inconsistency between the introduction, methods and conclusion is a frequent examiner comment."}, {"t": "The alignment (consistency) matrix", "b": "An alignment matrix, also called a consistency matrix, is a table that shows how every part of your study connects. Many supervisors ask for one in the proposal. Even when not required, it is one of the most useful planning tools you can make.\n\nTypical columns:\n• Research problem (one row, or repeated)\n• Objective\n• Research question or hypothesis\n• Data needed\n• Data source and sampling\n• Method of data collection\n• Method of analysis\n• Expected output\n• Thesis chapter or paper\n\nEach row is one objective. Read across each row and ask: does this data actually answer this question? Does this analysis suit this data? Is there a chapter where the result will appear?\n\nRead down each column too. Are all your methods justified in the methodology chapter? Does every chapter have an objective?\n\nThe matrix exposes common problems quickly: an objective with no data source, a survey that answers no question, or a chapter with no clear purpose. Update it as the project develops, and use it again when you write your conclusion, to check that you have answered every objective in turn."}, {"t": "Objectives, tasks and outputs", "b": "Students often mix up three different things.\n\n• An objective is a research step that produces new knowledge or a tested product: 'To compare dropout rates between schools with and without feeding programmes'.\n• A task is an activity needed to complete an objective: 'Obtain ethics approval', 'Recruit participants', 'Collect data from schools', 'Write chapter 4'. Tasks belong in your work plan or Gantt chart, not in the objectives list.\n• An output is what you deliver: a dataset, a model, a framework, a report, a paper. Outputs can be mentioned in objectives ('to develop a decision-support framework') but should come from research, not just be produced.\n\nA test: if anyone could complete the item without thinking or analysing, it is a task. 'To administer questionnaires' is a task. 'To determine the factors associated with …' is an objective.\n\nAnother test is to ask: what will I know after this that I did not know before? If the answer is 'nothing new, but the work is done', it is a task.\n\nKeeping these separate makes your objectives shorter, clearer and easier for examiners to assess."}, {"t": "Writing and revising your aim and objectives", "b": "A practical sequence:\n\n1. Start from your research problem and main question. Write one aim sentence: 'The aim of this study is to … in order to … .'\n2. Ask: what must I find out, build or test to achieve this? List every step.\n3. Group the steps into three to five logical stages. Each stage becomes an objective.\n4. Begin each with 'To' plus a precise verb.\n5. Test each against SMART and against your available data.\n6. Put them in a sensible order, usually the order you will do them.\n7. Build the alignment matrix and fix any gaps.\n\nUseful sentence patterns:\n• 'The overall aim of this research is to … .'\n• 'To achieve this aim, the study has the following objectives: …'\n• 'To determine the extent to which …'\n• 'To compare … between … and … in terms of … .'\n• 'To develop and evaluate a … for … .'\n\nTense: in a proposal, objectives are written with 'to' infinitives or future tense ('This study will …'). In the final thesis many writers switch to past tense ('This study aimed to …'). Check your template. Finally, return to your objectives when writing the conclusion and report the outcome of each one."}], "examples": [{"label": "Replacing vague verbs with precise ones", "weak": "Objectives: 1. To understand the problems of farmers. 2. To know the causes of low yield. 3. To study fertiliser use.", "strong": "Objectives: 1. To identify the main production constraints reported by smallholder sorghum farmers in Katsina State. 2. To determine the association between fertiliser application rate and sorghum yield on sampled farms. 3. To compare yields between farmers with and without access to extension services.", "why": "Understand, know and study cannot be checked. Identify, determine and compare each produce a definite result, and the strong version names crop, place and variables."}, {"label": "Separating an aim from its objectives", "weak": "Aim: To collect data on air pollution in Delhi, analyse it, write a report and help reduce pollution.", "strong": "Aim: To evaluate the contribution of construction dust to roadside PM10 levels in two Delhi neighbourhoods. Objectives: 1. To measure PM10 at four roadside sites near and away from active construction over 12 weeks. 2. To compare PM10 levels between construction and non-construction sites. 3. To assess whether existing dust-control measures at sites are associated with lower PM10.", "why": "The weak aim lists tasks and promises an outcome beyond research. The strong version has one focused aim and three objectives that together achieve it."}, {"label": "A row of an alignment matrix", "weak": "Objective: To examine teacher motivation. Method: Questionnaire. Chapter: 4.", "strong": "Objective 2: To determine which working conditions are associated with intention to leave among public secondary teachers in Nyeri County. RQ2: Which working conditions are associated with teachers' intention to leave? Data: Ratings of working conditions; intention-to-leave scale. Source: Survey of about 200 teachers in 15 schools (stratified sample). Analysis: Logistic regression. Output: Ranked list of associated conditions. Chapter: 5.", "why": "The strong row links a precise objective to its question, data, sample, analysis, output and chapter, so any mismatch is visible at once."}], "checks": [{"q": "What is the best description of the relationship between an aim and objectives?", "o": ["They are the same thing written twice", "The objectives are a summary of the literature review", "The aim states the overall purpose; the objectives are specific steps that together achieve it", "The aim is written after the objectives are achieved"], "a": 2, "why": "Objectives break the aim into measurable steps. If they simply repeat the aim (A), they add nothing."}, {"q": "Which objective is best written?", "o": ["To determine the removal efficiency of a constructed wetland for nitrogen and phosphorus from dairy wastewater over a 6-month period", "To understand wastewater treatment", "To study wetlands", "To know more about pollution"], "a": 0, "why": "Option A has a precise verb, defined outputs, materials and timeframe. The others use vague verbs and have no checkable result."}, {"q": "Which verb is least suitable as the main verb of a research objective?", "o": ["Compare", "Quantify", "Evaluate", "Understand"], "a": 3, "why": "You cannot show when understanding is complete. Compare, quantify and evaluate each produce an identifiable result."}, {"q": "A student lists as an objective: 'To administer questionnaires to 300 respondents.' What is wrong?", "o": ["The sample is too small", "It is a task in the work plan, not a research objective", "It should use the word 'study'", "Questionnaires are not allowed in research"], "a": 1, "why": "Administering questionnaires is an activity. The objective is what the questionnaire data will establish, for example 'to determine factors associated with …'."}, {"q": "In a qualitative study, what does 'measurable' in SMART usually mean?", "o": ["Every objective must produce a number", "Qualitative studies cannot have objectives", "The objective must include a statistical test", "The objective has an identifiable output, such as a set of themes or a typology"], "a": 3, "why": "Measurable means you can tell when the objective is complete. In qualitative work the output is often descriptive, not numerical."}, {"q": "Which verb best fits an objective in the design and building stage?", "o": ["Develop", "Describe", "Identify", "Explore"], "a": 0, "why": "Develop (like design, model or formulate) signals building something new. Describe, identify and explore belong to earlier, descriptive or exploratory stages."}, {"q": "Objective 3 is 'to compare costs of two irrigation systems in Tamil Nadu', but RQ3 asks 'How do farmers across India choose irrigation systems?' What is the problem?", "o": ["Objectives and questions must never match", "The question should be a hypothesis", "The objective and question differ in both scope (Tamil Nadu vs India) and focus (cost vs choice)", "There is no problem"], "a": 2, "why": "Objectives and questions should describe the same work. This pair differs in place and in what is being studied, so the data for one will not answer the other."}, {"q": "What is the main purpose of an alignment (consistency) matrix?", "o": ["To list all references used", "To show, row by row, how each objective links to a question, data, method, analysis and chapter", "To replace the methodology chapter", "To record supervision meeting dates"], "a": 1, "why": "The matrix makes mismatches visible, such as an objective with no data source or a method that answers no question."}, {"q": "A master's student lists ten objectives. What is the most likely issue?", "o": ["Ten is the required number", "The aim is too narrow", "Objectives should always be fewer than two", "Some items are probably tasks, or the project is too large for the time available"], "a": 3, "why": "Three to five objectives is common for a dissertation. Long lists usually mix in tasks or signal an over-ambitious scope."}, {"q": "Which aim is strongest?", "o": ["To assess how well community health worker home visits support the continuation of exclusive breastfeeding to six months in rural Bihar", "To solve the problem of malnutrition in India", "To research breastfeeding", "To understand and know about breastfeeding and its benefits and problems"], "a": 0, "why": "A states a focused purpose with a clear intervention, outcome and setting. B promises more than a study can deliver; C and D are vague."}, {"q": "Which revision best fixes the objective 'To identify and analyse and recommend solutions for traffic congestion in Nairobi'?", "o": ["Add more verbs so it covers everything", "Replace all verbs with 'study'", "Split it into separate objectives, each with one precise verb and a defined scope", "Move it into the abstract"], "a": 2, "why": "Several verbs usually signal several objectives. Splitting them makes each one specific and checkable."}, {"q": "When writing your conclusion chapter, what should you do with your objectives?", "o": ["Ignore them, as they belong to the proposal only", "Report how each objective was met, in turn, and note any that were only partly achieved", "Rewrite them to match the results you obtained", "List new objectives for a different study"], "a": 1, "why": "Examiners check that every objective was addressed. Silently rewriting objectives to fit results (C) is poor practice; changes should be explained."}], "checklist": ["Write one aim sentence beginning 'The aim of this study is to …'.", "List three to five objectives, each starting with 'To' and one precise action verb.", "Circle any vague verbs (understand, study, know, look at) and replace them.", "Test each objective against SMART and fix the weakest letter.", "Move any tasks (collect, administer, write) out of the objectives and into your work plan.", "Pair each objective with a research question and check they match in scope and focus.", "Build an alignment matrix with columns for question, data, source, method, analysis, output and chapter."], "practice": "Write your aim and three to five objectives, then build a simple alignment matrix with one row per objective (question, data, method, analysis, chapter). Highlight any empty or mismatched cell and rewrite that objective or method until the row is complete.", "reading": [{"book": "Kumar, R. (2019) Research Methodology: A Step-by-Step Guide for Beginners. 5th edn. SAGE.", "why": "Read the chapter on formulating a research problem, which shows how to move from a research problem to a main objective and sub-objectives using action-oriented wording."}, {"book": "Creswell, J.W. and Creswell, J.D. (2023) Research Design: Qualitative, Quantitative, and Mixed Methods Approaches. 6th edn. SAGE.", "why": "Read the chapter 'The Purpose Statement' for scripts that show how to state a study's purpose in qualitative, quantitative and mixed methods research, and how it links to questions."}, {"book": "Punch, K.F. (2016) Developing Effective Research Proposals. 3rd edn. SAGE.", "why": "Read the chapters on the general framework for proposals and on writing the proposal for how aims, questions and methods must fit together, and how reviewers check that fit."}], "links": [{"t": "Scribbr: Research objectives, definition and examples", "u": "https://www.scribbr.com/dissertation/research-objectives/"}, {"t": "University of Manchester Library: Research objectives handout (action verbs)", "u": "https://education.library.manchester.ac.uk/downloads/handouts/research-objectives.pdf"}, {"t": "Manchester Academic Phrasebank: Stating the purpose of research", "u": "https://www.phrasebank.manchester.ac.uk/introducing-work/"}]}, {"id": "annot", "title": "Annotated bibliographies", "sub": "Summarise, judge and connect sources", "goals": ["Distinguish descriptive, evaluative and combined annotations and choose the right one for a task", "Write annotations that include citation, summary, evaluation and relevance in about 100 to 200 words", "Evaluate a source's methods, evidence and limitations instead of only describing it", "Turn a set of annotations into themes for a literature review"], "lessons": [{"t": "What an annotated bibliography is", "b": "A bibliography is a list of sources. An annotated bibliography adds a short paragraph, called an annotation, after each source. The annotation tells the reader what the source is about and, usually, how good and how useful it is.\n\nYou may be asked to write one:\n• as a graded assignment, often early in a master's programme;\n• as part of a research proposal or the first months of a PhD, to show you know the field;\n• for yourself, as a working record of your reading.\n\nIt is not the same as an abstract. An abstract is written by the author and only describes the work. Your annotation is written by you and, in most cases, also judges the work and links it to your project. Copying or lightly rewording the abstract is one of the most common mistakes, and markers notice it at once.\n\nIt is also not yet a literature review. An annotated bibliography deals with one source at a time. A literature review groups sources by idea and builds an argument across them. A good annotated bibliography, however, makes the literature review much easier to write, because your thinking about each source is already on paper.\n\nAlways check the assignment brief: number of sources, citation style, annotation length and type."}, {"t": "Types of annotation", "b": "There are three main types.\n\nDescriptive (also called indicative or informative) annotations summarise the source. They say what question it asks, how it was done and what it found. They do not judge. Some guides separate indicative annotations, which describe what topics a work covers, from informative ones, which also report its main argument and findings.\n\nEvaluative (also called critical) annotations judge the source. They comment on the strength of the methods, the quality of the evidence, the author's assumptions or bias, and how it compares with other work.\n\nCombined annotations do both, and usually add a sentence on relevance: how the source helps your own study. This is the most common type at postgraduate level. If a brief simply says \"annotated bibliography\" with no further detail, a combined annotation is usually the safe choice, but ask.\n\nA simple way to remember it:\n• Describe: what does it say?\n• Evaluate: how well does it say it?\n• Relate: why does it matter for my work?\n\nDescriptive annotations are useful when you are building a reading list for others, or when your instructor only wants to check that you can summarise accurately. Evaluative and combined annotations show critical thinking, which is what postgraduate assessment rewards."}, {"t": "What to include in each annotation", "b": "Each entry has two parts: the full reference, then the annotation.\n\n1. Citation. Use the style your department requires, such as APA, Harvard, Chicago or IEEE. Be consistent and complete: authors, year, title, journal, volume, issue, pages and DOI.\n\n2. Summary. In two to four sentences: the purpose or question; the method (design, sample, setting); the main findings or argument.\n\n3. Evaluation. In one to three sentences: strengths and weaknesses. Is the sample large enough and well chosen? Are the methods suitable? Do the conclusions follow from the data? Is the source recent, peer-reviewed and from a credible publisher? Does the author have a clear position or conflict of interest?\n\n4. Relevance. In one or two sentences: how this source helps your study. Does it give you a method, a theory, evidence for your problem statement, or a contrasting result? Does it connect to, support or contradict another source on your list?\n\nNot every annotation needs equal weight on each part. A foundational theory book may need more summary. An empirical study close to your own needs more evaluation.\n\nTip: begin with the author's name and a reporting verb, as in \"Mensah and Owusu (2021) examine...\", so the reader knows at once whose ideas you are reporting."}, {"t": "Length, format and order", "b": "Length depends on the purpose and your instructions.\n\n• Many guides suggest about 150 words per annotation. Typical ranges are 100 to 200 words.\n• A short \"telescopic\" style uses brief, compressed phrases and can be just two or three sentences. It is useful for personal notes.\n• A full paragraph style uses complete sentences and is expected in most graded work.\n\nFormat conventions:\n• The reference is usually formatted with a hanging indent (second and later lines indented).\n• The annotation follows directly below as an indented paragraph, or on the next line, depending on the style guide.\n• Use the third person and present tense for what the source says (\"The authors argue...\") and past tense for what they did (\"They surveyed 400 farmers...\").\n\nOrder:\n• Alphabetical by first author's surname is the default.\n• Thematic order, with short headings, is useful when your bibliography covers several sub-topics, and it prepares you for a literature review.\n• Chronological order can show how a field has developed.\n\nInclude a short introduction if the brief asks for one: your topic or question, how you searched, and why you chose these sources. Conventions vary between institutions, so follow your module handbook over any general guide."}, {"t": "Reading a source for annotation", "b": "You cannot write a good annotation from the abstract alone. But you also do not need to read every word of every paper in order. Use a two-pass method.\n\nFirst pass (10 minutes): read the title, abstract, introduction's last paragraph (where the aim usually is), headings, figures and conclusion. Decide whether the source is relevant enough to read fully.\n\nSecond pass (30 to 60 minutes): read the methods and results carefully. This is where you find the evidence to evaluate.\n\nAs you read, fill a simple note template:\n• Reference details and DOI\n• Question or aim\n• Setting, sample and method\n• Key findings (with page numbers for anything you might quote)\n• Strengths\n• Weaknesses or limitations (including those the authors admit)\n• Links to other sources\n• Use for my study\n\nWrite notes in your own words from the start. Put any exact phrase you copy in quotation marks with a page number, so you never confuse your words with the author's later. This simple habit prevents accidental plagiarism.\n\nThen close the paper and write the annotation from your notes. Writing without looking at the source helps you paraphrase naturally and test whether you really understood it."}, {"t": "How to evaluate a source", "b": "Evaluation is where many students are weakest. Saying \"this is a very good and useful article\" is not evaluation. You need reasons.\n\nAsk questions such as:\n• Design: does the method fit the question? A survey can show associations but not usually cause and effect.\n• Sample: how many, who, and how chosen? Can the results apply beyond this group?\n• Context: where and when was it done? Results from a large commercial farm in Brazil may not transfer to smallholders in Malawi.\n• Measurement: are the instruments valid and reliable? Were variables clearly defined?\n• Analysis: are the statistics or qualitative methods appropriate and clearly reported?\n• Conclusions: do they stay within what the data show, or overreach?\n• Currency and standing: is it recent enough for your field? Is it peer reviewed? Be careful with predatory journals that publish almost anything for a fee.\n• Position: does the author or funder have an interest in a particular result?\n\nBalance strengths and weaknesses. Every study has limitations; naming one does not mean the source is useless. Compare when you can: \"Unlike Patel (2019), this study uses a longitudinal design, which strengthens its claim about change over time.\"\n\nEvaluation should be polite and precise. Criticise the work, not the person."}, {"t": "Language for annotations", "b": "Annotations use a small set of language patterns again and again. Building your own phrase list will speed up your writing.\n\nFor summary (neutral reporting verbs): examines, investigates, reports, describes, compares, outlines, proposes.\n• \"X (2022) investigates how...\"\n• \"Using interviews with 30 nurses, the study explores...\"\n• \"The authors report that...\"\n\nFor stronger claims: argues, demonstrates, shows, establishes (use only if the evidence is strong).\n\nFor evaluation:\n• \"A key strength is the use of...\"\n• \"The small, single-site sample limits how far the findings can be generalised.\"\n• \"The study does not explain how...which makes it difficult to...\"\n• \"The conclusions appear to go beyond the data, because...\"\n\nFor relevance:\n• \"This study provides a validated instrument that I will adapt to...\"\n• \"Its findings contrast with those of Y (2020), suggesting that context may matter.\"\n• \"This source supports the problem statement by showing...\"\n\nGrammar notes:\n• Use present tense for the author's ideas and conclusions, past tense for methods and specific results.\n• Avoid \"I think\" in most fields; instead show your judgement through evidence words such as \"suggests\", \"limits\" or \"strengthens\". Some fields accept \"I\" in the relevance sentence.\n• Vary your verbs. Twenty annotations all starting \"This article talks about\" read poorly."}, {"t": "From annotations to a literature review", "b": "An annotated bibliography is a stepping stone. To turn it into a literature review, you shift from source-by-source to idea-by-idea.\n\nStep 1: Tag. Give each annotation two or three keyword tags, such as \"cost barriers\", \"gender\", \"survey method\", \"East Africa\". A reference manager such as Zotero or Mendeley lets you add tags and notes directly to each entry.\n\nStep 2: Group. Sort sources by tag. Groups that contain several sources often become sections of your review.\n\nStep 3: Build a synthesis matrix. Make a table with sources as rows and themes or questions as columns. Fill each cell with a short note. Reading down a column shows where sources agree, disagree or are silent.\n\nStep 4: Write by theme. Each paragraph starts with a claim about the theme, then brings several sources together as evidence, comparing them. For example: \"Cost is the most frequently reported barrier (A, 2019; B, 2021), although C (2022) found that trust mattered more among younger farmers.\"\n\nStep 5: Identify gaps. Empty or weak cells in the matrix show what is not yet known.\n\nYour evaluation sentences from the annotations become your critical comments. Your relevance sentences show how each theme links to your study. Little of your earlier work is wasted."}], "examples": [{"label": "Descriptive annotation (fictional source, for illustration only)", "weak": "Okafor, C. (2021). This is an article about solar dryers. It is about drying food with solar dryers in Nigeria. It is very interesting and has a lot of information.", "strong": "Okafor, C. (2021) 'Performance of low-cost solar dryers for cassava chips in Enugu State', [journal details]. Okafor compares an indirect solar dryer with open sun drying for cassava chips over a six-week dry season. Moisture content, drying time and visible mould were measured in three batches for each method. The solar dryer reduced drying time by about a third and produced chips with less mould. The author recommends the design for small processing cooperatives.", "why": "The weak version repeats the topic and gives an empty opinion. The strong version gives purpose, method, results and conclusion in neutral reporting language, which is what a descriptive annotation needs."}, {"label": "Evaluative (critical) annotation of the same fictional source", "weak": "This is a good study and I recommend it because it is well written and useful.", "strong": "Okafor (2021) offers useful field data on solar drying under real cooperative conditions, which most laboratory studies lack. However, only three batches per method were tested in one season, and no statistical comparison is reported, so the size of the improvement is uncertain. Energy costs and dryer durability were not assessed, which limits conclusions about affordability. For my study on cassava processing losses, it provides a baseline for drying time and a measurement protocol I can adapt, but I will need stronger evidence on cost.", "why": "The strong version gives reasons for each judgement (sample, analysis, missing variables), balances a strength against weaknesses and ends with clear relevance. The weak version gives an opinion with no evidence."}, {"label": "Relevance sentence that connects sources", "weak": "This article is relevant to my research.", "strong": "Its finding that trust in agro-dealers drives seed choice contrasts with Banda and Phiri's (2020) emphasis on price, suggesting that the importance of cost may differ between subsidised and unsubsidised markets, a comparison my Malawi case study can test.", "why": "The strong version links two sources, states the difference and shows how the writer's own study can use it. This is the start of synthesis. (The sources here are fictional examples.)"}], "checks": [{"q": "What is the main difference between an abstract and an evaluative annotation?", "o": ["An abstract is longer", "An annotation never includes a citation", "An abstract is written by the author and only describes; an evaluative annotation is written by you and also judges the work", "There is no difference"], "a": 2, "why": "Abstracts describe the author's own work. Your annotation adds judgement and, often, relevance. Copying the abstract is not an annotation."}, {"q": "Which sentence is genuine evaluation?", "o": ["The single-school sample of 40 students limits how far the findings apply to other regions", "This article is very interesting", "The author is a famous professor", "The article is about online learning"], "a": 0, "why": "Evaluation gives a specific reason linked to the study's quality. Interest or fame is not evidence of quality, and topic statements are description."}, {"q": "A brief asks for an annotated bibliography but does not specify the type. What is usually the safest choice at postgraduate level?", "o": ["Descriptive only", "Combined: summary, evaluation and relevance", "A list of references with no notes", "A copy of each abstract"], "a": 1, "why": "Combined annotations show both understanding and critical thinking. When in doubt, also ask your instructor."}, {"q": "Which tense pattern is most appropriate in an annotation?", "o": ["Future tense throughout", "Past tense for the author's argument and future tense for methods", "Tense does not matter", "Present tense for the author's argument and past tense for what was done in the study"], "a": 3, "why": "Ideas and conclusions are reported in the present ('argues'), while completed actions such as sampling are in the past ('surveyed')."}, {"q": "Typical length for one annotation in graded postgraduate work is:", "o": ["One word", "About 100 to 200 words, unless the brief says otherwise", "At least 1,000 words", "One full page per source"], "a": 1, "why": "Many guides suggest around 150 words. Always follow the stated length in your brief."}, {"q": "Which annotation opening is strongest?", "o": ["This article talks about water", "In this article, there is discussion of many things", "Adeyemi and Bello (2023) compare chlorine and solar disinfection in 120 rural households in Oyo State", "I read this article for my research"], "a": 2, "why": "It names the authors, uses a precise reporting verb and gives the method, sample and setting in one sentence."}, {"q": "You are reading a paper and want to remember one phrase exactly. What should you do?", "o": ["Put it in quotation marks with the page number in your notes", "Copy it into your notes without marks and paraphrase later", "Change one word so it is your own", "Avoid noting it"], "a": 0, "why": "Marking quotations with page numbers from the start keeps your words and the author's separate, which prevents accidental plagiarism."}, {"q": "A source is a survey of 2,000 households. It finds that income and fertiliser use are correlated. Which evaluative comment is most accurate?", "o": ["It proves income causes fertiliser use", "Surveys are never useful", "The sample is too small", "The large sample is a strength, but a cross-sectional survey shows association, not cause and effect"], "a": 3, "why": "A large sample strengthens precision, but a one-time survey cannot by itself establish causation. Good evaluation names both strength and limitation."}, {"q": "What is the main purpose of a synthesis matrix when moving from annotations to a literature review?", "o": ["To format references", "To compare sources across themes and see agreement, disagreement and gaps", "To count words", "To replace reading"], "a": 1, "why": "Rows are sources and columns are themes. Reading down columns helps you write idea-by-idea paragraphs and spot gaps."}, {"q": "Which ordering is most helpful if you plan to turn your annotated bibliography into a literature review?", "o": ["Random order", "Order of download date", "Thematic groups with headings", "By number of pages"], "a": 2, "why": "Alphabetical order is the default, but thematic grouping already sorts sources into the sections of your future review."}, {"q": "Which relevance statement is best?", "o": ["This study's validated teacher-stress scale can be adapted for my survey of secondary teachers in Kumasi", "This is relevant", "This source is useful for everyone", "I liked this source"], "a": 0, "why": "It states precisely how the source will be used in the writer's own study."}, {"q": "Which is NOT normally part of a combined annotation?", "o": ["A summary of the method and findings", "An evaluation of strengths and weaknesses", "A note on relevance to your study", "A full copy of the paper's results tables"], "a": 3, "why": "Annotations are short. Reproducing results tables is too long and may breach copyright. Summarise the key results instead."}], "checklist": ["Check your brief for number of sources, citation style, annotation type and word limit", "Create a note template with fields for aim, method, findings, strengths, weaknesses, links and use for your study", "Read the methods section of every source you annotate, not only the abstract", "Write each annotation from your notes with the paper closed, then check it for accuracy", "Include at least one specific, reasoned evaluative sentence in every annotation", "Add two or three theme tags to each entry in your reference manager", "Build a simple synthesis matrix from your tags before you start your literature review"], "practice": "Choose one source central to your project and write a 150-word combined annotation: two sentences of summary, two of evaluation with specific reasons, and one on relevance to your study. Then underline every reporting verb and replace any that repeat.", "reading": [{"book": "Wallace, M. and Wray, A. (2021) Critical Reading and Writing for Postgraduates. 4th edn. SAGE.", "why": "Its approach to critical reading and its guidance on writing critical summaries of single texts give you a clear set of questions for evaluating any source, which is the hardest part of annotation."}, {"book": "Ridley, D. (2025) The Literature Review: A Step-by-Step Guide for Students. 3rd edn. SAGE.", "why": "Read the parts on reading strategies, note-taking and recording information. They show how to keep organised records of sources that later feed directly into a literature review."}, {"book": "Hart, C. (2018) Doing a Literature Review: Releasing the Research Imagination. 2nd edn. SAGE.", "why": "The sections on reading for analysis and evaluating arguments go deeper into how to judge a source's reasoning and evidence."}], "links": [{"t": "Annotated bibliographies (Purdue OWL)", "u": "https://owl.purdue.edu/owl/general_writing/common_writing_assignments/annotated_bibliographies/index.html"}, {"t": "How to prepare an annotated bibliography (Cornell University Library)", "u": "https://guides.library.cornell.edu/annotatedbibliography"}, {"t": "Annotated bibliographies (UNC Writing Center)", "u": "https://writingcenter.unc.edu/tips-and-tools/annotated-bibliographies/"}, {"t": "Academic Phrasebank: Being critical (University of Manchester)", "u": "https://www.phrasebank.manchester.ac.uk/being-critical/"}]}, {"id": "design", "title": "Research approaches and designs", "sub": "Choosing a design that fits", "goals": ["Distinguish quantitative, qualitative and mixed methods approaches and explain what kind of question each answers best", "Describe the main research designs, from experiments and surveys to case studies, ethnography and design science", "Choose between a cross-sectional and a longitudinal design and justify the choice", "Justify a design for your own project by showing how it fits the question, the context and your resources"], "lessons": [{"t": "Start from the question, not the method", "b": "A research design is the overall plan that connects your question to your evidence. It answers: what will I compare or examine, with whom or what, when, and how will this let me answer the question?\n\nMany students choose a method first ('I will do a survey') and then look for a question. Examiners notice this. Work the other way: the wording of your question points to the design.\n\n• 'How much', 'how many', 'what is the effect of', 'is X associated with Y' point to quantitative designs: numbers, measurement, statistics.\n• 'How', 'why', 'what is it like', 'how do people make sense of' point to qualitative designs: words, images, meanings.\n• Questions with both parts ('how common is X, and why?') may need mixed methods.\n\nQuantitative research usually aims for precision and generalisation across a population. Qualitative research usually aims for depth and understanding in context. Neither is superior. A design is good when it can actually answer the question you asked, with the time, money, access and skills you have.\n\nA simple test: imagine your final results table or theme list. Would it answer your question? If not, the design needs to change."}, {"t": "Mixed methods designs", "b": "Mixed methods research combines quantitative and qualitative data in one study and, crucially, integrates them. Simply doing a survey and some interviews and reporting them in separate chapters is not enough; you need to show how one informs the other.\n\nCreswell and Creswell describe three core designs:\n\n• Convergent: collect both kinds of data at about the same time, analyse them separately, then compare or merge. Example: survey 400 secondary-school teachers in Ghana on ICT use and interview 15 of them, then compare where the findings agree or conflict.\n\n•
