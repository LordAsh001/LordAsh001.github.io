<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Shagbaor Hycent Amool">
<meta property="og:type" content="website">
<meta property="og:title" content="Shagbaor Hycent Amool">
<meta property="og:description" content="Environmental engineer and PhD student at UNBC, recovering curdlan from aerobic granular sludge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%239E6C14'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23F6F5EE' opacity='.5'/%3E%3C/svg%3E">
<title>Shagbaor Hycent Amool</title>
<meta name="description" content="Environmental engineer and PhD student at UNBC, recovering curdlan from aerobic granular sludge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}

:root{
  --paper:#EEEDE4; --paper-2:#E4E3D6; --card:#F6F5EE;
  --ink:#17201C; --muted:#5B635D; --rule:#CAC9B8;
  --accent:#1D6A5A; --accent-soft:#D3E2DA; --ochre:#9E6C14; --ochre-2:#C99A45;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:clamp(16px,4vw,44px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111613; --paper-2:#171E1A; --card:#19211C;
    --ink:#E6E5DA; --muted:#9BA29B; --rule:#2E3832;
    --accent:#7CC7AF; --accent-soft:#1F3A31; --ochre:#D9A64C; --ochre-2:#8E6A2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111613; --paper-2:#171E1A; --card:#19211C;
  --ink:#E6E5DA; --muted:#9BA29B; --rule:#2E3832;
  --accent:#7CC7AF; --accent-soft:#1F3A31; --ochre:#D9A64C; --ochre-2:#8E6A2A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:var(--gutter)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:60px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:20px;white-space:nowrap}
.mark i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--ochre-2),var(--ochre));box-shadow:5px -4px 0 -3px var(--ochre),-5px 4px 0 -4px var(--accent)}
.nav{margin-left:auto;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap;padding-block:6px}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--accent);margin-right:4px}

/* Hero: a paper's title block */
.hero{padding-block:clamp(40px,7vw,88px) clamp(40px,6vw,72px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start}
.kicker{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);text-transform:uppercase}
.kicker span+span::before{content:"·";margin-right:14px;color:var(--rule)}
.hero h1{font-size:clamp(40px,6.2vw,78px);line-height:1.02;letter-spacing:-.02em;margin-top:22px;font-variation-settings:"opsz" 72}
.hero h1 em{font-style:italic;color:var(--accent)}
.byline{margin-top:28px;font-family:var(--serif);font-size:22px}
.byline sup{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:1px}
.affil{margin-top:6px;color:var(--muted);font-size:13.5px;line-height:1.55}
.affil sup{font-family:var(--mono);font-size:10px;color:var(--accent);margin-right:3px}
.abstract{margin-top:30px;border-top:1px solid var(--rule);padding-top:18px;max-width:62ch}
.abstract .lbl{color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
.abstract p{font-size:18px;line-height:1.62}
.keywords{margin-top:14px;color:var(--muted);font-size:14px}
.keywords b{font-weight:600;color:var(--ink)}

.reader{margin-top:30px;padding:16px 18px;background:var(--paper-2);border-radius:4px;max-width:62ch}
.reader-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.reader-row .mono{color:var(--muted);text-transform:uppercase;margin-right:4px}
.chip{font:500 13.5px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 13px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.reader-note{margin-top:12px;font-size:15px;line-height:1.55}
.reader-note a{font-weight:500}

/* Figure 1 */
.fig{margin:0}
.fig-frame{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--card);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.fig-frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.fig-hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);pointer-events:none}
.fig-ctrl{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:500 13px var(--sans);display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);border-color:var(--rule)}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.btn[aria-pressed="false"] .dot{background:var(--ochre)}
figcaption{margin-top:12px;font-size:13.5px;color:var(--muted);line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}
.sustainatable{margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}
.sustainatable-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sustainatable h3{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1.2;margin:0 0 6px}
.sustainatable p{font-size:14px;color:var(--muted);margin:0 0 12px}
.sustainatable-toggle{font:500 13px var(--sans);white-space:nowrap;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer}
.sustainatable-toggle:hover{border-color:var(--accent)}
.sustainatable iframe{display:block;width:100%;height:760px;border:1px solid var(--rule);border-radius:4px;background:var(--card)}
.sustainatable.is-expanded{position:fixed;inset:0;z-index:100;background:var(--paper);padding:18px var(--gutter);margin:0;overflow:auto}
.sustainatable.is-expanded iframe{height:calc(100vh - 112px);min-height:520px}
body.has-expanded-table{overflow:hidden}
@media (max-width:640px){
  .sustainatable-head{align-items:flex-start}
  .sustainatable-toggle{font-size:12px;padding:6px 9px}
  .sustainatable.is-expanded{padding:12px}
  .sustainatable.is-expanded iframe{height:calc(100vh - 82px);min-height:420px}
}

/* Sections */
.sec{border-top:1px solid var(--rule);padding-block:clamp(48px,7vw,96px);display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(20px,4vw,64px)}
.sec-head{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start}
.sec-num{font-family:var(--mono);font-size:12.5px;color:var(--accent);letter-spacing:.06em}
.sec-head h2{font-size:30px;line-height:1.1;margin-top:6px}
.sec-head p{margin-top:10px;font-size:14px;color:var(--muted);max-width:26ch}
.lede{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);line-height:1.3;max-width:30ch;letter-spacing:-.005em}
.lede em{color:var(--accent)}
.prose{max-width:64ch;display:grid;gap:16px;margin-top:22px}
.prose p{font-size:17.5px}

/* Fig 2 pipeline */
.pipe{margin-top:40px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:3px;background:var(--card)}
.step{padding:18px 16px 20px;position:relative;display:flex;flex-direction:column;gap:10px}
.step+.step{border-left:1px solid var(--rule)}
.step+.step::before{content:"";position:absolute;left:-7px;top:36px;width:12px;height:12px;background:var(--card);border-top:1px solid var(--rule);border-right:1px solid var(--rule);transform:rotate(45deg)}
.step .ico{height:40px;display:flex;align-items:center}
.step h3{font-family:var(--sans);font-size:15px;font-weight:600;line-height:1.3}
.step p{font-size:13.5px;color:var(--muted);line-height:1.45}
.step.last{background:var(--accent-soft)}
.step.last h3{color:var(--accent)}
.step.last::before{background:var(--accent-soft)}
.formula{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

.lineage{margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.lineage article{border-top:2px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.lineage .mono{color:var(--muted);text-transform:uppercase}
.lineage h3{font-size:21px;line-height:1.25}
.lineage p{font-size:14.5px;color:var(--muted)}
.tag{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:3px;background:var(--paper-2);color:var(--ink)}
.tag.prize{background:color-mix(in srgb,var(--ochre) 18%,transparent);color:var(--ochre)}

/* Timeline */
.route{list-style:none;margin:28px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:111px;top:10px;bottom:10px;width:1px;background:var(--rule)}
.stop{display:grid;grid-template-columns:96px 32px minmax(0,1fr);align-items:start;padding-block:16px}
.stop .yr{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.stop .node{width:11px;height:11px;border-radius:50%;margin:9px 0 0 10px;background:var(--paper);border:1.5px solid var(--ink);position:relative;z-index:1}
.stop.now .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stop .place{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--accent)}
.stop h3{font-family:var(--sans);font-size:17px;font-weight:600;line-height:1.35;margin-top:2px}
.stop p{font-size:15px;color:var(--muted);margin-top:4px;max-width:62ch}

/* Work */
.work{margin-top:32px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.proj{grid-column:span 3;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:24px;display:flex;flex-direction:column;gap:12px}
.proj.wide{grid-column:span 6;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center}
.proj.third{grid-column:span 2}
.proj .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted)}
.proj h3{font-size:26px;line-height:1.15}
.proj p{font-size:15px;line-height:1.55}
.proj .role{font-size:13.5px;color:var(--muted)}
.proj ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:4px}
.stats{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.stat{background:var(--paper);padding:18px 16px}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.35}
.speakers{margin-top:14px;font-size:13.5px;color:var(--muted)}
.speakers b{color:var(--ink);font-weight:500}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.status.closed::before{background:transparent;border:1.5px solid var(--muted)}

/* Teaching */
.teach{margin-top:30px;display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:36px}
.teach h3{font-size:22px}
.subjects{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.subjects li{border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:14px}
.teach p{font-size:15.5px;margin-top:10px;color:var(--muted)}
.talk{margin-top:14px;padding-left:16px;border-left:2px solid var(--ochre)}
.talk q{font-family:var(--serif);font-size:20px;font-style:italic;quotes:"“" "”"}
.talk p{font-size:13.5px;margin-top:4px}

/* Recognition table */
.tbl-wrap{margin-top:26px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
caption{text-align:left;font-size:13.5px;color:var(--muted);padding-bottom:10px}
caption b{color:var(--ink)}
th,td{text-align:left;padding:13px 12px 13px 0;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom-color:var(--ink)}
td.y{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;width:70px}
td.k{white-space:nowrap}
.kind{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;background:var(--paper-2)}
.kind.win{background:color-mix(in srgb,var(--ochre) 18%,transparent);color:var(--ochre)}

.toolkit{margin-top:36px;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:28px}
.toolkit h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:500}
.toolkit ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px;font-size:15px}
.toolkit li{padding-bottom:6px;border-bottom:1px dotted var(--rule)}

/* Writing */
.essays{margin-top:28px;display:grid;gap:0;max-width:760px}
.essay{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--rule);text-decoration:none}
.essay:first-child{border-top:1px solid var(--rule)}
.essay .mono{color:var(--muted);padding-top:5px}
.essay h3{font-size:22px;line-height:1.25}
.essay p{font-size:14.5px;color:var(--muted);margin-top:4px}
.essay:hover h3{color:var(--accent)}

/* Contact */
.contact{padding-block:clamp(56px,8vw,110px);border-top:1px solid var(--ink)}
.contact .mono{color:var(--accent)}
.contact h2{font-size:clamp(36px,5.4vw,68px);line-height:1.04;letter-spacing:-.02em;margin-top:12px;max-width:16ch}
.contact h2 a{text-decoration:none;border-bottom:2px solid var(--accent);font-style:italic;word-break:break-word}
.contact-grid{margin-top:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.contact-grid h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.contact-grid ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;font-size:16px}
.copy-btn{margin-left:8px;font:500 12px var(--sans);border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.copy-btn:hover{border-color:var(--accent)}
footer{border-top:1px solid var(--rule);padding-block:22px 40px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Highlight for reader paths */
.nav a.rec::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ochre);margin-left:5px;vertical-align:middle}

@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .fig-frame{aspect-ratio:4/3}
  .sec{grid-template-columns:minmax(0,1fr)}
  .sec-head{position:static}
  .sec-head p{max-width:none}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step+.step{border-left:0;border-top:1px solid var(--rule)}
  .step+.step::before{left:28px;top:-7px;transform:rotate(135deg)}
  .step{flex-direction:row;align-items:flex-start;gap:16px}
  .step .ico{flex:0 0 52px;height:auto;padding-top:2px}
  .lineage,.toolkit,.contact-grid{grid-template-columns:minmax(0,1fr)}
  .proj,.proj.third{grid-column:span 6}
  .proj.wide{grid-template-columns:minmax(0,1fr)}
  .teach{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:16px}
  .top .wrap{gap:14px}
  .mark span{display:none}
  .nav{gap:16px}
  .route::before{left:15px}
  .stop{grid-template-columns:32px minmax(0,1fr);grid-template-areas:"node yr" "node body"}
  .stop .node{grid-area:node}
  .stop .yr{grid-area:yr;padding-top:4px}
  .stop .body{grid-area:body}
  .stat{padding:14px 10px}
  .essay{grid-template-columns:1fr;gap:4px}
  .proj{padding:20px}
}
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
}
/* additions for the content-driven version */
.hero.nofig{grid-template-columns:minmax(0,1fr)}
.who{margin-top:28px;display:flex;align-items:center;gap:16px}
.who .byline{margin-top:0}
.portrait{width:128px;height:128px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);flex:0 0 auto}
.abstract p+p{margin-top:12px}
.md p+p,.md ul+p,.md p+ul{margin-top:12px}
.md ul{margin:0;padding-left:18px}
.proj .md p{font-size:15px}
.text-body{margin-top:22px;max-width:64ch;font-size:17.5px}
.loading{padding-block:120px;color:var(--muted);text-align:center}
.notice{max-width:560px;margin:80px auto;padding:24px;border:1px solid var(--rule);border-radius:4px;background:var(--card)}
.notice h1{font-size:28px;margin-bottom:10px}
.proj.wide > div:first-child{display:flex;flex-direction:column;gap:12px}
.proj.wide .meta{justify-content:flex-start;gap:18px}
.stat b{font-size:clamp(26px,2.6vw,38px);overflow-wrap:anywhere}
@media (max-width:640px){
  .portrait{width:96px;height:96px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="Home"><i aria-hidden="true"></i><span id="wordmark">S. H. Amool</span></a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main id="top" class="wrap"><p class="loading mono">Loading…</p></main>
<script type="application/json" id="content-fallback"></script>
<script>
window.initSim=function(){
/* ---------- Fig. 1: granular sludge simulation ---------- */
  var cv = document.getElementById('sludge'), ctx = cv.getContext('2d');
  var frame = document.getElementById('fig1');
  var hudMode = document.getElementById('hud-mode'), hudCount = document.getElementById('hud-count');
  var btn = document.getElementById('aerate'), btnLbl = document.getElementById('aerate-lbl');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=1, parts=[], bubbles=[], aerated=true, settleT=0, t=0, mouse={x:-999,y:-999,on:false};
  var col={};
  var MAXG=20, FLOCS=190;
  function readColors(){
    var cs=getComputedStyle(document.documentElement);
    ['ink','muted','accent','ochre','ochre-2','card','rule'].forEach(function(k){col[k]=cs.getPropertyValue('--'+k).trim();});
  }
  function rnd(a,b){return a+Math.random()*(b-a);}
  function floc(x,y){return {g:false,x:x,y:y,vx:rnd(-.3,.3),vy:rnd(-.3,.3),r:rnd(1,2.4),m:1,a:rnd(.25,.6),seed:Math.random()*99};}
  function granule(x,y,m){return {g:true,x:x,y:y,vx:rnd(-.2,.2),vy:rnd(-.2,.2),m:m,r:gr(m),seed:Math.random()*99,rot:Math.random()*6.28};}
  function gr(m){return Math.min(MAXG, 3.2+Math.sqrt(m)*1.55);}
  function seed(){
    parts=[]; bubbles=[]; settleT=0;
    var area=W*H, ng=Math.round(Math.max(8,Math.min(18,area/26000)));
    for(var i=0;i<ng;i++) parts.push(granule(rnd(20,W-20),rnd(40,H-60),Math.round(rnd(10,90))));
    var nf=Math.round(Math.max(90,Math.min(FLOCS,area/900)));
    for(var j=0;j<nf;j++) parts.push(floc(rnd(0,W),rnd(0,H)));
  }
  function resize(){
    var r=frame.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
    var nw=Math.round(r.width), nh=Math.round(r.height);
    if(nw===W && nh===H) return;
    var first = W===0; W=nw; H=nh;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    if(first || !parts.length) seed(); else parts.forEach(function(p){p.x=Math.min(p.x,W);p.y=Math.min(p.y,H);});
    draw();
  }
  function step(){
    t+=0.016;
    var floor=H-2, grav;
    if(!aerated) settleT+=0.016;
    var nFloc=0, nGran=0;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      if(aerated){
        p.vx+= (Math.random()-.5)*.12 + Math.sin(p.y*0.012+t*0.7)*0.018;
        p.vy+= (Math.random()-.5)*.12 + Math.cos(p.x*0.01+t*0.5)*0.014 - (p.y>H*0.8?0.02:0);
        if(mouse.on){
          var dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
          if(d2<8100){var d=Math.sqrt(d2)||1, f=(90-d)/90*0.6; p.vx+=dx/d*f; p.vy+=dy/d*f-0.05;}
        }
        p.vx*=0.95; p.vy*=0.95;
      } else {
        grav = p.g ? 0.028+p.r*0.004 : 0.0016+p.r*0.0006;
        p.vy+=grav; p.vx*=0.9; p.vy*=p.g?0.94:0.9;
        p.vx+=(Math.random()-.5)*(p.g?0.01:0.05);
      }
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-10)p.x=W+10; else if(p.x>W+10)p.x=-10;
      var top=34;
      if(p.y<top+p.r){p.y=top+p.r;p.vy=Math.abs(p.vy)*0.5;}
      var bed = floor - p.r - (p.g ? p.seed%6 : p.seed%4);
      if(p.y>bed){p.y=bed; p.vy=aerated? -Math.abs(p.vy)-0.4 : 0;}
      if(p.g){nGran++; p.rot+=p.vx*0.02;} else nFloc++;
    }
    // accretion: flocs join nearby granules while aerated
    if(aerated){
      for(var a=0;a<parts.length;a++){
        var G=parts[a]; if(!G.g) continue;
        for(var b=parts.length-1;b>=0;b--){
          var F=parts[b]; if(F.g) continue;
          var ddx=F.x-G.x, ddy=F.y-G.y, rr=G.r+6;
          if(ddx*ddx+ddy*ddy<rr*rr && Math.random()<0.04){
            G.m+=1; G.r=gr(G.m); parts.splice(b,1); nFloc--;
            if(b<a) a--;
          }
        }
        if(G.m>130 && nGran<26){ // mature granule sheds a daughter
          G.m=Math.round(G.m*0.55); G.r=gr(G.m);
          parts.push(granule(G.x+G.r,G.y,Math.round(G.m*0.6))); nGran++;
        }
      }
      // flocs that stray too long slowly clump into new small granules
      if(Math.random()<0.004 && nGran<22){parts.push(granule(rnd(20,W-20),rnd(60,H-60),3)); nGran++;}
      // influent brings fresh flocs
      var target=Math.round(Math.max(90,Math.min(FLOCS,W*H/900)));
      while(nFloc<target && Math.random()<0.5){parts.push(floc(rnd(-8,0)+(Math.random()<.5?0:W),rnd(40,H-40))); nFloc++;}
      // aeration bubbles
      if(Math.random()<0.6) bubbles.push({x:rnd(0,W),y:H+4,r:rnd(1.5,4),v:rnd(.8,1.8),w:Math.random()*6});
      if(mouse.on && Math.random()<0.5) bubbles.push({x:mouse.x+rnd(-12,12),y:mouse.y,r:rnd(1.5,3.5),v:rnd(1,2),w:Math.random()*6});
    }
    for(var k=bubbles.length-1;k>=0;k--){var bb=bubbles[k]; bb.y-=bb.v; bb.x+=Math.sin(bb.y*0.05+bb.w)*0.3; if(bb.y<30) bubbles.splice(k,1);}
    hudCount.textContent='granules '+nGran+' · flocs '+nFloc;
    hudMode.textContent = aerated ? 'Aerated · mixing' : 'Settling · t = '+(settleT*1.2).toFixed(1)+' min';
  }
  function drawGranule(p){
    var g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.35,p.r*.1,p.x,p.y,p.r);
    g.addColorStop(0,col['ochre-2']); g.addColorStop(1,col.ochre);
    ctx.fillStyle=g;
    ctx.beginPath();
    var n=14;
    for(var i=0;i<=n;i++){
      var ang=p.rot+i/n*6.283, wob=1+Math.sin(ang*3+p.seed)*0.07+Math.sin(ang*5+p.seed*2)*0.04;
      var x=p.x+Math.cos(ang)*p.r*wob, y=p.y+Math.sin(ang)*p.r*wob;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.fill();
    if(p.r>6){
      ctx.fillStyle=col.card; ctx.globalAlpha=.35;
      for(var j=0;j<4;j++){var aa=p.seed*(j+1)+p.rot, rd=p.r*0.5*((j*37+p.seed)%10)/10;
        ctx.beginPath(); ctx.arc(p.x+Math.cos(aa)*rd,p.y+Math.sin(aa)*rd,Math.max(.8,p.r*0.09),0,6.283); ctx.fill();}
      ctx.globalAlpha=1;
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // tank waterline + scale
    ctx.strokeStyle=col.rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,32.5); ctx.lineTo(W,32.5); ctx.stroke();
    ctx.fillStyle=col.muted; ctx.font='10px "IBM Plex Mono", monospace';
    for(var y=60;y<H-50;y+=Math.max(40,(H-100)/6)){ctx.fillRect(W-8,Math.round(y),6,1);}
    // bubbles
    ctx.strokeStyle=col.accent; ctx.globalAlpha=.55;
    for(var k=0;k<bubbles.length;k++){var b=bubbles[k]; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.stroke();}
    ctx.globalAlpha=1;
    // flocs
    ctx.fillStyle=col.muted;
    for(var i=0;i<parts.length;i++){var p=parts[i]; if(p.g) continue;
      ctx.globalAlpha=p.a; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x+p.r*1.2,p.y-p.r*.6,p.r*.6,0,6.283); ctx.fill();}
    ctx.globalAlpha=1;
    for(var j=0;j<parts.length;j++){ if(parts[j].g) drawGranule(parts[j]); }
  }
  var running=false, visible=true, raf=0;
  function loop(){ step(); draw(); if(running && visible) raf=requestAnimationFrame(loop); else raf=0; }
  function start(){ if(!raf && visible){ running=true; raf=requestAnimationFrame(loop);} }
  readColors(); resize();
  // settle a moment so the first frame already shows structure
  for(var s=0;s<30;s++) step(); draw();
  if(!reduce) start();
  if('ResizeObserver' in window) new ResizeObserver(resize).observe(frame); else window.addEventListener('resize',resize);
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es){visible=es[0].isIntersecting; if(visible && running) start();}).observe(frame);
  }
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var recolor=function(){readColors(); draw();};
  if(mq.addEventListener) mq.addEventListener('change',recolor);
  new MutationObserver(recolor).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  btn.addEventListener('click',function(){
    aerated=!aerated; settleT=0;
    btn.setAttribute('aria-pressed',String(aerated));
    btnLbl.textContent = aerated ? 'Stop aeration' : 'Start aeration';
    running=true; start();
  });
  document.getElementById('reseed').addEventListener('click',function(){ seed(); aerated=true; btn.setAttribute('aria-pressed','true'); btnLbl.textContent='Stop aeration'; running=true; start(); draw(); });
  function pos(e){var r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; mouse.on=true;}
  cv.addEventListener('pointermove',pos);
  cv.addEventListener('pointerdown',function(e){pos(e); if(reduce){running=true; start(); setTimeout(function(){running=false;},4000);}});
  cv.addEventListener('pointerleave',function(){mouse.on=false;});
  if(reduce){ btn.addEventListener('click',function(){ setTimeout(function(){running=false;},6000); }); }
};
</script>
<script>
(function(){
  var FALLBACK_EL = document.getElementById('content-fallback');

  /* ---------- tiny, safe markdown ---------- */
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function safeUrl(u){u=String(u||'').trim(); return (/^(https?:|mailto:|tel:)/i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u)) ? u : '#';}
  function isExternal(u){return /^https?:/i.test(u);}
  function inline(s){
    var out=esc(s);
    out=out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){u=safeUrl(u.replace(/&amp;/g,'&'));
      return '<a href="'+esc(u)+'"'+(isExternal(u)?' target="_blank" rel="noopener"':'')+'>'+t+(isExternal(u)?' ↗':'')+'</a>';});
    out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    out=out.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
    return out;
  }
  function md(s){
    if(!s) return '';
    return String(s).replace(/\r/g,'').split(/\n\s*\n/).map(function(block){
      var lines=block.split('\n');
      if(lines.every(function(l){return /^\s*[-*]\s+/.test(l)||!l.trim();})){
        return '<ul>'+lines.filter(function(l){return l.trim();}).map(function(l){return '<li>'+inline(l.replace(/^\s*[-*]\s+/,''))+'</li>';}).join('')+'</ul>';
      }
      return '<p>'+lines.map(inline).join('<br>')+'</p>';
    }).join('');
  }
  function slug(s){return String(s||'section').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'section';}
  function arr(a){return Array.isArray(a)?a:[];}
  function visible(a){return arr(a).filter(function(x){return x && !x.hidden;});}

  /* ---------- icons for Fig. 2 ---------- */
  var ICONS={
    water:'<svg width="44" height="30" viewBox="0 0 44 30"><path d="M2 12c6-6 10 6 16 0s10 6 16 0 8 4 8 4" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M2 22c6-6 10 6 16 0s10 6 16 0 8 4 8 4" fill="none" stroke="var(--muted)" stroke-width="1.2"/></svg>',
    granules:'<svg width="44" height="34" viewBox="0 0 44 34"><circle cx="14" cy="18" r="10" fill="var(--ochre)"/><circle cx="33" cy="12" r="6" fill="var(--ochre)" opacity=".75"/><circle cx="34" cy="27" r="4" fill="var(--ochre)" opacity=".55"/><circle cx="11" cy="15" r="2" fill="var(--card)" opacity=".5"/></svg>',
    matrix:'<svg width="44" height="34" viewBox="0 0 44 34"><circle cx="20" cy="17" r="13" fill="none" stroke="var(--ochre)" stroke-width="1.4" stroke-dasharray="2 3"/><circle cx="20" cy="17" r="7" fill="var(--ochre)"/><path d="M34 6c4 3 4 8 0 11M36 19c3 3 3 7 0 9" fill="none" stroke="var(--accent)" stroke-width="1.4"/></svg>',
    lab:'<svg width="44" height="34" viewBox="0 0 44 34"><path d="M14 3v10l-8 16h24l-8-16V3" fill="none" stroke="var(--ink)" stroke-width="1.4"/><path d="M11 3h14" stroke="var(--ink)" stroke-width="1.4"/><path d="M9 23h18l3 6H6z" fill="var(--accent)" opacity=".6"/><circle cx="36" cy="10" r="5" fill="none" stroke="var(--ink)" stroke-width="1.4"/><path d="M39.5 13.5l3 3" stroke="var(--ink)" stroke-width="1.4"/></svg>',
    polymer:'<svg width="44" height="34" viewBox="0 0 44 34"><path d="M4 26c5-18 11-18 14 0s9 18 14 0 7-12 10-8" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>',
    none:''
  };

  /* ---------- section renderers ---------- */
  function head(s,num){
    return '<div class="sec-head">'+(num?'<div class="sec-num">§'+num+'</div>':'')+
      '<h2 id="h-'+esc(s._id)+'">'+inline(s.heading)+'</h2>'+(s.subtitle?'<p>'+inline(s.subtitle)+'</p>':'')+'</div>';
  }
  function lede(s){ return s.lede?'<p class="lede">'+inline(s.lede)+'</p>':''; }

  var R={};
  R.text=function(s){
    return '<div>'+lede(s)+(s.body?'<div class="md text-body prose">'+md(s.body)+'</div>':'')+'</div>';
  };
  R.research=function(s){
    var h='<div>'+lede(s);
    if(s.body) h+='<div class="prose md">'+md(s.body)+'</div>';
    var steps=visible(s.steps);
    if(steps.length){
      h+='<figure class="fig pipe"><ol class="steps" style="--n:'+steps.length+'">'+steps.map(function(st){
        return '<li class="step'+(st.highlight?' last':'')+'"><div class="ico" aria-hidden="true">'+(ICONS[st.icon]||'')+'</div><div><h3>'+inline(st.title)+'</h3>'+(st.text?'<p>'+inline(st.text)+'</p>':'')+(st.note?'<span class="formula">'+esc(st.note)+'</span>':'')+'</div></li>';
      }).join('')+'</ol>'+(s.steps_caption?'<figcaption>'+inline(s.steps_caption)+'</figcaption>':'')+'</figure>';
    }
    var cards=visible(s.cards);
    if(cards.length){
      h+='<div class="lineage">'+cards.map(function(c){
        return '<article>'+(c.label?'<span class="mono">'+esc(c.label)+'</span>':'')+'<h3>'+inline(c.title)+'</h3>'+(c.text?'<p>'+inline(c.text)+'</p>':'')+(c.tag?'<span class="tag'+(c.tag_style==='prize'?' prize':'')+'">'+esc(c.tag)+'</span>':'')+'</article>';
      }).join('')+'</div>';
    }
    return h+'</div>';
  };
  R.timeline=function(s){
    return '<div>'+lede(s)+'<ol class="route">'+visible(s.entries).map(function(e){
      return '<li class="stop'+(e.current?' now':'')+'"><span class="yr">'+esc(e.years)+'</span><span class="node" aria-hidden="true"></span><div class="body">'+
        (e.place?'<span class="place">'+esc(e.place)+'</span>':'')+'<h3>'+inline(e.title)+'</h3>'+(e.text?'<p>'+inline(e.text)+'</p>':'')+'</div></li>';
    }).join('')+'</ol></div>';
  };
  R.projects=function(s){
    return '<div>'+lede(s)+'<div class="work">'+visible(s.items).map(function(p){
      var size=p.size==='wide'?' wide':p.size==='third'?' third':'';
      var status=p.status==='active'?'<span class="status">Active</span>':p.status==='closed'?'<span class="status closed">Closed</span>':'';
      var metaRow=(p.meta||status)?'<div class="meta mono"><span>'+esc(p.meta)+'</span>'+status+'</div>':'';
      var main=metaRow+'<h3>'+inline(p.name)+'</h3>'+
        (p.role?'<p class="role">'+inline(p.role)+'</p>':'')+
        (p.text?'<div class="md">'+md(p.text)+'</div>':'')+
        (arr(p.bullets).length?'<ul>'+arr(p.bullets).map(function(b){return '<li>'+inline(b)+'</li>';}).join('')+'</ul>':'')+
        (p.link_url?'<p class="speakers"><a href="'+esc(safeUrl(p.link_url))+'"'+(isExternal(p.link_url)?' target="_blank" rel="noopener"':'')+'>'+esc(p.link_label||'Visit')+(isExternal(p.link_url)?' ↗':'')+'</a></p>':'');
      var stats=arr(p.stats).length?'<div class="stats" role="list" style="--n:'+Math.min(arr(p.stats).length,4)+'">'+arr(p.stats).map(function(x){return '<div class="stat" role="listitem"><b>'+esc(x.value)+'</b><span>'+esc(x.label)+'</span></div>';}).join('')+'</div>':'';
      if(size===' wide') return '<article class="proj wide"><div>'+main+'</div>'+stats+'</article>';
      return '<article class="proj'+size+'">'+main+stats+'</article>';
    }).join('')+'</div></div>';
  };
  R.columns=function(s){
    var cols=arr(s.columns);
    return '<div>'+lede(s)+'<div class="teach" style="--n:'+Math.max(1,Math.min(cols.length,3))+'">'+cols.map(function(c){
      return '<div>'+(c.label?'<span class="mono" style="color:var(--muted);text-transform:uppercase">'+esc(c.label)+'</span>':'')+
        (c.title?'<h3 style="margin-top:8px">'+inline(c.title)+'</h3>':'')+
        (arr(c.chips).length?'<ul class="subjects">'+arr(c.chips).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+
        (c.text?'<div class="md">'+md(c.text).replace(/<p>/g,'<p style="font-size:15.5px;margin-top:10px;color:var(--muted)">')+'</div>':'')+
        visible(c.quotes).map(function(q){return '<div class="talk"><q>'+inline(q.title)+'</q>'+(q.text?'<p>'+inline(q.text)+'</p>':'')+'</div>';}).join('')+
      '</div>';
    }).join('')+'</div></div>';
  };
  R.table=function(s){
    var rows=visible(s.rows), h='<div>'+lede(s);
    if(rows.length){
      h+='<div class="tbl-wrap"><table>'+(s.caption?'<caption>'+inline(s.caption)+'</caption>':'')+
        '<thead><tr><th scope="col">'+esc(s.col_year||'Year')+'</th><th scope="col">'+esc(s.col_item||'Item')+'</th><th scope="col">'+esc(s.col_detail||'Details')+'</th><th scope="col">'+esc(s.col_badge||'Type')+'</th></tr></thead><tbody>'+
        rows.map(function(r){return '<tr><td class="y">'+esc(r.year)+'</td><td>'+inline(r.item)+'</td><td>'+inline(r.detail)+'</td><td class="k">'+(r.badge?'<span class="kind'+(r.highlight?' win':'')+'">'+esc(r.badge)+'</span>':'')+'</td></tr>';}).join('')+
        '</tbody></table></div>';
    }
    var groups=arr(s.groups).filter(function(g){return g && arr(g.items).length;});
    if(groups.length){
      h+='<div class="toolkit" style="--n:'+Math.min(groups.length,3)+'">'+groups.map(function(g){
        return '<div><h3>'+esc(g.title)+'</h3><ul>'+arr(g.items).map(function(i){return '<li>'+inline(i)+'</li>';}).join('')+'</ul></div>';
      }).join('')+'</div>';
    }
    return h+'</div>';
  };
  R.links=function(s){
    return '<div>'+lede(s)+'<div class="essays">'+visible(s.items).map(function(i){
      var u=i.url?safeUrl(i.url):'';
      var tag=u?'a':'div';
      return '<'+tag+' class="essay"'+(u?' href="'+esc(u)+'"'+(isExternal(u)?' target="_blank" rel="noopener"':''):'')+'><span class="mono">'+esc(i.label)+'</span><div><h3>'+inline(i.title)+'</h3>'+(i.text?'<p>'+inline(i.text)+'</p>':'')+'</div></'+tag+'>';
    }).join('')+'</div></div>';
  };

  /* ---------- page ---------- */
  function render(c){
    var site=c.site||{}, hero=c.hero||{}, contact=c.contact||{};
    if(site.title) document.title=site.title;
    var sections=arr(c.sections).filter(function(s){return s && s.show!==false && R[s.type];});
    var used={}, n=0;
    sections.forEach(function(s){
      var id=slug(s.id||s.nav_label||s.heading); while(used[id]) id+='-2'; used[id]=1; s._id=id;
      s._num = s.numbered===false ? 0 : ++n;
    });

    // header
    var nav=sections.map(function(s){return '<a href="#'+esc(s._id)+'" data-sec="'+esc(s._id)+'">'+(s._num?'<b>§'+s._num+'</b>':'')+esc(s.nav_label||s.heading)+'</a>';}).join('');
    if(contact.show!==false) nav+='<a href="#contact" data-sec="contact">'+esc(contact.nav_label||'Contact')+'</a>';
    document.getElementById('nav').innerHTML=nav;
    document.getElementById('wordmark').textContent=site.wordmark||site.title||'';

    // hero
    var affs=arr(hero.affiliations).filter(Boolean);
    var sup=affs.map(function(_,i){return i+1;}).join(',')+(hero.email?'*':'');
    var fig=hero.figure||{}, reader=hero.reader||{}, paths=arr(reader.paths).filter(function(p){return p&&p.label;});
    var h='<section class="hero'+(fig.show===false?' nofig':'')+'"><div>';
    if(arr(hero.kicker).length) h+='<div class="kicker mono rise">'+arr(hero.kicker).map(function(k){return '<span>'+esc(k)+'</span>';}).join('')+'</div>';
    h+='<h1 class="rise d1">'+inline(hero.headline)+'</h1>';
    h+='<div class="who rise d2">'+(hero.photo?'<img class="portrait" src="'+esc(safeUrl(hero.photo))+'" alt="Portrait of '+esc(hero.name)+'">':'')+'<p class="byline">'+esc(hero.name)+(sup?'<sup>'+sup+'</sup>':'')+'</p></div>';
    if(affs.length||hero.email){
      h+='<p class="affil rise d2">'+affs.map(function(a,i){return '<sup>'+(i+1)+'</sup>'+esc(a)+'&ensp; ';}).join('')+
        (hero.email?'<sup>*</sup>Correspondence: <a href="mailto:'+esc(hero.email)+'">'+esc(hero.email)+'</a>':'')+'</p>';
    }
    if(hero.abstract||arr(hero.keywords).length){
      h+='<div class="abstract rise d3"><span class="lbl mono">Abstract</span><div class="md">'+md(hero.abstract)+'</div>'+
        (arr(hero.keywords).length?'<p class="keywords"><b>Keywords:</b> '+arr(hero.keywords).map(esc).join(' · ')+'</p>':'')+'</div>';
    }
    if(reader.show!==false && paths.length){
      h+='<div class="reader rise d3" role="group" aria-labelledby="reader-lbl"><div class="reader-row"><span class="mono" id="reader-lbl">Reading as</span>'+
        paths.map(function(p,i){return '<button class="chip" type="button" id="reader-'+i+'" data-i="'+i+'" aria-pressed="false">'+esc(p.label)+'</button>';}).join('')+
        '</div><div class="reader-note md" id="reader-note" aria-live="polite">'+md(reader.intro)+'</div></div>';
    }
    h+='</div>';
    if(fig.show!==false){
      h+='<figure class="fig rise d2"><div class="fig-frame" id="fig1"><canvas id="sludge" role="img" aria-label="Animated simulation: small loose flocs drift through water and cluster into dense granules. Turning aeration off lets the granules settle quickly while the flocs linger."></canvas>'+
        '<div class="fig-hud mono"><span id="hud-mode">Aerated</span><span id="hud-count">granules 0 · flocs 0</span></div>'+
        '<div class="fig-ctrl"><button class="btn" type="button" id="aerate" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span id="aerate-lbl">Stop aeration</span></button><button class="btn ghost" type="button" id="reseed">Reset</button></div></div>'+
        (fig.caption?'<figcaption>'+inline(fig.caption)+'</figcaption>':'')+'</figure>';
    }
    h+='</section>';

    // sections
    sections.forEach(function(s){
      h+='<section class="sec" id="'+esc(s._id)+'" aria-labelledby="h-'+esc(s._id)+'">'+head(s,s._num)+R[s.type](s)+'</section>';
    });

    // contact
    if(contact.show!==false){
      h+='<section class="contact" id="contact" aria-labelledby="h-contact">'+(contact.eyebrow?'<span class="mono" style="text-transform:uppercase">'+esc(contact.eyebrow)+'</span>':'')+
        '<h2 id="h-contact">'+inline(contact.heading)+(hero.email?' <a href="mailto:'+esc(hero.email)+'">'+esc(hero.email)+'</a>':'')+'</h2>'+
        '<div class="contact-grid">'+arr(contact.columns).map(function(col){
          return '<div><h3>'+esc(col.title)+'</h3><ul>'+arr(col.items).map(function(it){
            var li=inline(it), m=/\(mailto:([^)]+)\)/.exec(it||'');
            if(m) li+='<button class="copy-btn" type="button" data-copy="'+esc(m[1])+'">Copy</button>';
            return '<li>'+li+'</li>';
          }).join('')+'</ul></div>';
        }).join('')+'</div></section>';
    }
    h+='<footer class="mono"><span>'+esc(site.footer)+'</span>'+(site.last_revised?'<span>Last revised '+esc(site.last_revised)+'</span>':'')+'</footer>';
    document.getElementById('top').innerHTML=h;

    wire(paths, reader);
    if(fig.show!==false && window.initSim) window.initSim();
    if(location.hash){var t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView();}
  }

  function wire(paths, reader){
    var note=document.getElementById('reader-note');
    var chips=document.querySelectorAll('.chip');
    var navLinks=document.querySelectorAll('.nav a');
    function setReader(i){
      chips.forEach(function(c){c.setAttribute('aria-pressed', String(String(c.dataset.i)===String(i)));});
      var p = i==null ? null : paths[i];
      navLinks.forEach(function(a){a.classList.toggle('rec', !!(p && arr(p.sections).map(slug).indexOf(a.dataset.sec)>-1));});
      if(note) note.innerHTML = md(p ? p.note : reader.intro);
      try{ p ? localStorage.setItem('reader',p.label) : localStorage.removeItem('reader'); }catch(e){}
    }
    chips.forEach(function(c){c.addEventListener('click',function(){
      setReader(c.getAttribute('aria-pressed')==='true' ? null : c.dataset.i);
    });});
    try{ var saved=localStorage.getItem('reader'); paths.forEach(function(p,i){ if(p.label===saved) setReader(i); }); }catch(e){}

    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){
        navLinks.forEach(function(a){a.classList.toggle('on', a.dataset.sec===e.target.id);});
      }});},{rootMargin:'-40% 0px -55% 0px'});
      document.querySelectorAll('main section[id]').forEach(function(s){io.observe(s);});
    }
    document.querySelectorAll('.copy-btn').forEach(function(cb){
      cb.addEventListener('click',function(){
        var done=function(){cb.textContent='Copied';setTimeout(function(){cb.textContent='Copy';},1600);};
        if(navigator.clipboard){navigator.clipboard.writeText(cb.dataset.copy).then(done,function(){cb.textContent='Select & copy';});}
      });
    });
    var table=document.getElementById('sustainatable');
    var toggle=table && table.querySelector('.sustainatable-toggle');
    if(toggle){
      var expanded=false;
      function setExpanded(next){
        expanded=next;
        table.classList.toggle('is-expanded',expanded);
        document.body.classList.toggle('has-expanded-table',expanded);
        toggle.setAttribute('aria-expanded',String(expanded));
        toggle.textContent=expanded?'Return to page':'Expand to full screen';
      }
      toggle.addEventListener('click',function(){
        if(!expanded){
          if(table.requestFullscreen){
            table.requestFullscreen().catch(function(){setExpanded(true);});
          }
          setExpanded(true);
        }else{
          if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
          setExpanded(false);
        }
      });
      document.addEventListener('fullscreenchange',function(){
        if(!document.fullscreenElement && expanded) setExpanded(false);
      });
    }
  }

  function fail(){
    document.getElementById('top').innerHTML='<div class="notice"><h1>This page needs a web server</h1><p>The website reads its words from <code>content.json</code>, which browsers only allow over the web. Upload the folder to GitHub Pages (see README.md) and open it there.</p></div>';
  }

  function fromFallback(){
    try{ if(FALLBACK_EL && FALLBACK_EL.textContent.trim()) { render(JSON.parse(FALLBACK_EL.textContent)); return true; } }catch(e){ console.error(e); }
    return false;
  }

  if(FALLBACK_EL && FALLBACK_EL.textContent.trim()){ fromFallback(); return; }
  fetch('content.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render).catch(function(e){ console.error(e); fail(); });
})();
</script>
</body>
</html>
