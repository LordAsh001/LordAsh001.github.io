# Weekly (Monday, 06:17 UTC): source watcher for pages and sites that publish figures on Nigerians abroad.
name: "Diaspora Atlas bot: source watcher"
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: diaspora-atlas-data
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Watch sources
        run: bash scripts/diaspora_atlas/run_bot.sh watch_sources.py "Source watcher"
