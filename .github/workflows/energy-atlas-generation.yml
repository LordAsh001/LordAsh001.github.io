# Weekly (Mondays 05:23 UTC): electricity generation by source from Our World in Data / Ember.
name: "Energy Atlas bot: electricity generation"
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: energy-atlas-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/energy_atlas/run_bot.sh fetch_generation.py "electricity generation"
