# Keeps the Via Scholaris numbers on the website up to date with the YouTube channel.
# One-time setup: add a repository secret called YT_API_KEY (a YouTube Data API key).
# Until that secret exists this workflow does nothing, and the website keeps the
# numbers written in content.json.
name: Refresh YouTube numbers

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch channel numbers
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_ID: UCT7uDSjVcGoPUHdcY-vvmig
        run: python3 .github/scripts/youtube.py

      - name: Commit if the numbers changed
        run: |
          if [ -z "$(git status --porcelain youtube.json)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          git commit -m "Refresh YouTube numbers"
          git push
