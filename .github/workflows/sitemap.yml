# Builds the generated parts of the site and keeps sitemap.xml current.
# build_site.py: a page per homepage section (/research/ …), feed.xml, and WebP copies of photos in images/w/.
# build_sitemap.py: lists the homepage, its sections, every tool under Open resources and the legal pages.
# Runs when the homepage, its content or a photo changes, and weekly (Sunday 04:47 UTC) to refresh dates.
name: "Site: build pages and sitemap"
on:
  push:
    branches: [main]
    paths: ["content.json", "index.html", "images/**", ".github/scripts/build_site.py", ".github/scripts/build_sitemap.py"]
  schedule:
    - cron: "47 4 * * 0"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history for "last changed" dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build section pages, feed and images
        run: |
          pip install --quiet pillow
          python .github/scripts/build_site.py
      - name: Rebuild sitemap.xml
        run: python .github/scripts/build_sitemap.py
      - name: Commit if changed
        run: |
          git config user.name  "sitemap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml feed.xml assets/sections.json images/w
          for d in $(python -c "import json;print(' '.join(json.load(open('assets/sections.json'))))"); do git add -A "$d"; done
          if ! git diff --cached --quiet; then
            git commit -m "Build section pages, feed, images and sitemap ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break || sleep 10; done
          fi
