name: Literature Landscape bot

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "literature-landscape/data/landscape.json"
      - "literature-landscape/bot/**"

permissions:
  contents: write

concurrency:
  group: literature-landscape-bot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build state-traced directories
        continue-on-error: true
        run: node literature-landscape/bot/build-directory.mjs
      - name: Refresh follower counts and records
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node literature-landscape/bot/update-followers.mjs
      - name: Commit changes
        run: |
          git config user.name "literature-landscape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out/directory
          cp literature-landscape/data/followers.json /tmp/out/
          cp -r literature-landscape/data/directory/. /tmp/out/directory/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p literature-landscape/data/directory
          cp /tmp/out/followers.json literature-landscape/data/
          cp -r /tmp/out/directory/. literature-landscape/data/directory/
          git add literature-landscape/data/followers.json literature-landscape/data/directory
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Literature Landscape: weekly directory and follower refresh"
          git push origin HEAD:main
