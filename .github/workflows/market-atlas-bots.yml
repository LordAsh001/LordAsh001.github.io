name: Market Atlas price bots

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 06:17 Nigeria time
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: market-atlas-bots
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bots/requirements.txt

      - name: Install
        run: pip install -r bots/requirements.txt

      - name: Test parsers
        run: python -m pytest bots/tests -q

      - name: Collect prices
        run: python bots/collect.py --out market-atlas/data
        continue-on-error: true   # one broken site must not block the others' updates

      - name: Build market-day calendar from community reports
        run: python bots/market_days.py market-atlas/data
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          TALLY_FORM_ID: obroDO
        continue-on-error: true

      - name: Collect community fuel-price reports
        run: python bots/fuel_reports.py market-atlas/data
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          TALLY_FUEL_FORM_ID: xXk2Zy
        continue-on-error: true

      - name: Commit updated feed
        run: |
          git config user.name  "market-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-atlas/data
          if git diff --cached --quiet; then
            echo "No price changes today."
          else
            git commit -m "Market Atlas: price feed $(date -u +%Y-%m-%d)"
            git push
          fi
