# Adds the years 1979-1996 to the Water Atlas river-flow archive from the GloFAS v4 consolidated reanalysis
# (Copernicus Emergency Management Service, CEMS Early Warning Data Store). Open-Meteo only serves 1997 onwards.
# Needs the EWDS_API_KEY repository secret and the CEMS-FLOODS licence accepted on the dataset's Download tab.
# Run it once from the Actions tab ("Run workflow"); it can be re-run safely (existing days are never changed).
name: Backfill water atlas river flow (GloFAS)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to add"
        default: "1979"
      end_year:
        description: "Last year to add"
        default: "1996"
      check_only:
        description: "Only compare 1997 with the archive (adds nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: water-atlas-archive
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install helpers
        run: pip install cdsapi xarray netCDF4
      - name: Download GloFAS years and add them to the archive
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
          BF_START: ${{ inputs.start_year }}
          BF_END: ${{ inputs.end_year }}
          BF_CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          python3 .github/scripts/water_atlas_glofas_backfill.py
          python3 -c "import importlib.util as u;s=u.spec_from_file_location('a','.github/scripts/water_atlas_archive.py');a=u.module_from_spec(s);s.loader.exec_module(a);a.catalogue()"
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain water-atlas/archive)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-atlas/archive
          git commit -m "Water atlas archive: GloFAS river flow ${{ inputs.start_year }}-${{ inputs.end_year }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
