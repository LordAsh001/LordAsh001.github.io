# Keeps the Nigeria Water Resources Atlas current without anyone typing anything:
#   - re-downloads dams (Global Dam Watch), the national dam inventory, rivers and lakes (DIVA-GIS),
#     water points (GRID3), flood-risk LGAs, Wikidata/Wikipedia/Commons entries and DHS water indicators
#   - re-downloads major roads (expressways, trunk and primary roads) from OpenStreetMap
#   - refreshes 40-year GloFAS river-flow records for the flood-watch gauges and saves them as CSVs in water-atlas/archive/river_flow
#   - rebuilds water-atlas/data/*.json from those files plus the hand-written profiles in water-atlas/data/curated.json
# Runs every Monday, and on demand from the Actions tab ("Run workflow").
name: Refresh Nigeria Water Resources Atlas

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      keep_raw:
        description: "Also save the downloaded source files to the water-atlas-raw branch"
        type: boolean
        default: false
      steps:
        description: "Only download these sources (comma-separated words, e.g. 'power,sdg' or 'roads'); leave empty for all"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: pip install pyshp shapely openpyxl

      - name: Download sources
        env:
          WA_STEPS: ${{ inputs.steps }}
        run: python3 .github/scripts/water_atlas_fetch.py /tmp/raw

      - name: Update the 40-year river-flow archive
        continue-on-error: true
        run: |
          if [ -f /tmp/raw/glofas_gauges.json ]; then python3 .github/scripts/water_atlas_archive.py --gauges /tmp/raw/glofas_gauges.json; fi

      - name: Rebuild atlas data
        env:
          WA_STEPS: ${{ inputs.steps }}
        run: |
          if [ -n "$WA_STEPS" ]; then echo "Partial download ($WA_STEPS): data left unchanged."; exit 0; fi
          python3 .github/scripts/water_atlas_build.py /tmp/raw

      - name: Major roads (OpenStreetMap)
        if: ${{ inputs.steps == '' || inputs.steps == null || contains(inputs.steps, 'roads') }}
        continue-on-error: true
        run: python3 .github/scripts/water_atlas_roads.py /tmp/raw

      - name: Save source files to the water-atlas-raw branch
        if: ${{ inputs.keep_raw }}
        run: |
          cd /tmp/raw
          git init -q -b water-atlas-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Water atlas source snapshot $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" water-atlas-raw

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain water-atlas/data water-atlas/archive)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-atlas/data water-atlas/archive
          git commit -m "Refresh Nigeria Water Resources Atlas data"
          git pull --rebase
          git push
