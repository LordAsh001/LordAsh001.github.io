/* Layout: full-height workbench — control panel left, map right; stacks on phones */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18202e; --muted:#5b6577; --line:#dde2ea; --soft:#eaeef4;
  --indigo:#2c3e9e;   /* adire indigo: primary accent */
  --sorghum:#b5651d;  /* sorghum/kola: secondary, routes */
  --leaf:#2f7d4f; --warn:#b7791f; --bad:#b4372f;
  --land:#e7ebf1; --land-line:#9aa5b8; --water:#d8e3f0;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --panel:#161b25; --ink:#e6e9f0; --muted:#98a2b5; --line:#2a3141; --soft:#1e2431;
  --indigo:#8fa2ff; --sorghum:#e59a52; --leaf:#5fc28a; --warn:#e6b450; --bad:#f07a70;
  --land:#1b2130; --land-line:#465068; --water:#131a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --panel:#161b25; --ink:#e6e9f0; --muted:#98a2b5; --line:#2a3141; --soft:#1e2431;
  --indigo:#8fa2ff; --sorghum:#e59a52; --leaf:#5fc28a; --warn:#e6b450; --bad:#f07a70;
  --land:#1b2130; --land-line:#465068; --water:#131a26; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.crumbs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:13px}
.crumbs button{background:none;border:0;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--indigo);font-weight:600}
.crumbs button[aria-current="true"]{color:var(--ink);cursor:default}
.crumbs span{color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.main{display:grid;grid-template-columns:var(--pw,420px) 10px minmax(0,1fr);min-height:0}
.splitter{background:var(--soft);border-left:1px solid var(--line);border-right:1px solid var(--line);cursor:col-resize;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;user-select:none;z-index:5}
.splitter:hover,.splitter.drag,.splitter:focus-visible{background:color-mix(in srgb,var(--indigo) 18%,var(--soft))}
.splitter .grip{width:4px;height:40px;border-radius:2px;background:var(--land-line);opacity:.6}
.splbtn{width:18px;height:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font-size:12px;line-height:1;padding:0;cursor:pointer}
.main.panel-closed aside.panel{visibility:hidden;overflow:hidden;min-width:0}
.main.map-closed .mapwrap{visibility:hidden;overflow:hidden;min-width:0}
.mapwrap{isolation:isolate;overflow:hidden}
aside.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:10px 9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--indigo)}
.pane > *{flex-shrink:0}
.pane{overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.mapwrap{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0;background:var(--water)}
h2{font-family:var(--f-display);font-size:16px;margin:0;font-weight:700;text-wrap:balance}
h3{font-family:var(--f-display);font-size:13.5px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:var(--r);padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:18px}
.stat span{font-size:11.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;min-height:110px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{background:var(--indigo);color:var(--panel);border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--muted)}
.item .r{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;background:var(--panel);cursor:pointer;user-select:none}
.chip input{margin:0;accent-color:var(--indigo)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--muted)}
.tag.market{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.tag.state{background:color-mix(in srgb,var(--indigo) 16%,transparent);color:var(--indigo)}
.tag.zone{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.national{background:var(--soft);color:var(--muted)}
.tag.user{background:color-mix(in srgb,var(--sorghum) 18%,transparent);color:var(--sorghum)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-mono);font-size:22px;font-weight:500}
.good{color:var(--leaf)} .bad{color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);background:var(--soft);position:sticky;top:0}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.legend{position:absolute;right:10px;bottom:22px;z-index:900;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;max-width:230px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend .lg{display:flex;align-items:center;gap:7px}
.layerbox{position:absolute;left:10px;top:10px;z-index:900;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.layerbox summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
.layerbox .grp{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.layerbox label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1000;background:var(--ink);color:var(--panel);padding:7px 12px;border-radius:6px;font-size:12.5px}
.leaflet-container{font-family:var(--f-body);background:var(--water)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line)}
.leaflet-bar{border:1px solid var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted)}
.leaflet-control-attribution a{color:var(--indigo)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.25)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:12px}
.pop b{font-family:var(--f-display);font-size:14px}
.pop .small{margin-top:2px}
.pop a{color:var(--indigo);cursor:pointer;font-weight:600}
.spark{width:100%;height:auto;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:6px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--panel)}
.ticker{background:var(--soft);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;font-size:12.5px;position:relative}
.tick-track{display:inline-flex;gap:28px;padding:6px 16px;animation:tick 140s linear infinite}
.ticker:hover .tick-track,.ticker:focus-within .tick-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{display:inline-flex;gap:6px;align-items:baseline}
.tick b{font-weight:600}
.tick .num{font-size:12px}
.tick .w{color:var(--muted);font-size:11.5px}
.feedpill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.feedpill.live{color:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 40%,transparent)}
.fresh{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.fresh.ok{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.fresh.aging{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.fresh.stale{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.conf{font-size:10.5px;color:var(--muted)}
.alertbar{background:color-mix(in srgb,var(--warn) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:8px 10px;font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:118px 1fr 70px;gap:8px;align-items:center;font-size:12px}
.bar .track{height:10px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--indigo);border-radius:3px}
.bar .fill.min{background:var(--leaf)} .bar .fill.max{background:var(--bad)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .num{text-align:right}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;background:none;cursor:pointer;min-width:0}
.wd b{display:block;font-family:var(--f-mono);font-size:16px}
.wd span{display:block;font-size:10.5px;color:var(--muted)}
.wd .cnt{margin-top:3px;font-size:11px;font-weight:600;color:var(--indigo)}
.wd[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo)}
.wd[aria-pressed="true"] b,.wd[aria-pressed="true"] span,.wd[aria-pressed="true"] .cnt{color:var(--panel)}
.wd.today{box-shadow:inset 0 0 0 2px var(--sorghum)}
.cyc{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft)}
.dates{display:flex;flex-wrap:wrap;gap:5px}
.dates span{font-family:var(--f-mono);font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.dates span.hit{background:var(--indigo);color:var(--panel);border-color:var(--indigo)}
.status{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px}
.status.reported{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.status.confirmed{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:var(--leaf)}
.hint{font-size:12px;color:var(--muted)}
.pickbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;background:var(--ink);color:var(--panel);padding:8px 12px;border-radius:8px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.pickbar button{background:var(--panel);color:var(--ink);border:0;border-radius:5px;padding:4px 9px;cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){.tick-track{animation:none}.ticker{overflow-x:auto}}
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:var(--mh,52vh) 14px auto}
  .mapwrap{order:1} .splitter{order:2;cursor:row-resize;flex-direction:row;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)} .splitter .grip{width:40px;height:4px}
  .splbtn{transform:rotate(90deg)}
  aside.panel{order:3;border-right:0}
  .app{height:auto;min-height:100%}
  .pane{overflow:visible}
  .crumbs{margin-left:0;width:100%}
  .layerbox{max-width:200px}
  .legend{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Nigeria Market Atlas</h1>
      <small>Markets, produce prices, storage and weighbridges · distances and haulage costs</small>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <span class="feedpill" id="feedPill" title="Where the prices on this page come from">Snapshot</span>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch light or dark mode">Dark mode</button>
  </header>
  <div class="ticker" id="ticker" aria-label="Latest market prices"><div class="tick-track" id="tickTrack"></div></div>
  <div class="main">
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-explore" aria-selected="true" data-tab="explore">Explore</button>
        <button role="tab" id="t-prices" aria-selected="false" data-tab="prices">Prices</button>

const R = 6371;
function hav(a, b){
  const toR = x => x*Math.PI/180;
  const dLat = toR(b[0]-a[0]), dLng = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mix(a, b, pct){ // pct of colour a over colour b (both #rrggbb)
  const h = x => x.replace("#",""); const pa = h(a), pb = h(b);
  const ch = (s,i) => parseInt(s.substr(i,2),16);
  const out = [0,2,4].map(i => Math.round(ch(pa,i)*pct/100 + ch(pb,i)*(1-pct/100)).toString(16).padStart(2,"0")).join("");
  return "#"+out;
}

// ---------- Geometry ----------
function ringContains(ring, x, y){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function geomContains(g, lng, lat){
  const polys = g.type==="Polygon" ? [g.coordinates] : g.type==="MultiPolygon" ? g.coordinates : [];
  return polys.some(p => ringContains(p[0], lng, lat) && !p.slice(1).some(h => ringContains(h, lng, lat)));
}
function bboxOf(g){
  let a=[180,90,-180,-90];
  const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
  polys.forEach(p=>p[0].forEach(([x,y])=>{ a[0]=Math.min(a[0],x); a[1]=Math.min(a[1],y); a[2]=Math.max(a[2],x); a[3]=Math.max(a[3],y); }));
  return a;
}
function centroidOf(g){
  // area-weighted centroid of the largest polygon
  const polys = g.type==="Polygon" ? [g.coordinates] : g.coordinates;
  let best=null, bestA=0;
  polys.forEach(p=>{
    const r=p[0]; let A=0, cx=0, cy=0;
    for(let i=0,j=r.length-1;i<r.length;j=i++){ const f=r[j][0]*r[i][1]-r[i][0]*r[j][1]; A+=f; cx+=(r[j][0]+r[i][0])*f; cy+=(r[j][1]+r[i][1])*f; }
    A/=2; if (Math.abs(A)>bestA){ bestA=Math.abs(A); best=[cy/(6*A), cx/(6*A)]; }
  });
  return best;
}
// distance (km) from point p to segment a-b, plus position t along it (equirectangular, fine at country scale)
function segInfo(p, a, b){
  const k = Math.cos((a[0]+b[0])/2*Math.PI/180);
  const ax=a[1]*k, ay=a[0], bx=b[1]*k, by=b[0], px=p[1]*k, py=p[0];
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  const tc = Math.max(0, Math.min(1, t));
  const cx=ax+tc*dx, cy=ay+tc*dy;
  return {t, d: Math.hypot(px-cx, py-cy)*111.2};
}

function findLGA(lat, lng, hintState){
  const cand = LGAS_GEO.features.filter(f => lng>=f.bbox2[0] && lng<=f.bbox2[2] && lat>=f.bbox2[1] && lat<=f.bbox2[3]);
  let hit = cand.find(f => geomContains(f.geometry, lng, lat) && (!hintState || f.properties.state===hintState))
         || cand.find(f => geomContains(f.geometry, lng, lat));
  if (!hit){ // nearest LGA centroid within the hinted state
    let best=null, bd=1e9;
    LGAS_GEO.features.forEach(f=>{ if (hintState && f.properties.state!==hintState) return; const d=hav([lat,lng], f.c); if(d<bd){bd=d;best=f;} });
    hit = best;
  }
  return hit;
}

const TRUCKS = {
  t5:  {label:"Small truck (5 t)",          cap:5,  lp100:20},
  t15: {label:"Rigid truck (15 t)",         cap:15, lp100:32},
  t30: {label:"Trailer / 'Dangote' (30 t)", cap:30, lp100:45}

  origin:"dawanau", dest:"mile12", c:"maize", tonnes:30, truck:"t30", diesel:DIESEL.national,
  lp100:45, perkm:450, fixed:60000, speed:45, circuity:1.3, emptyReturn:true, buy:null, sell:null, buffer:15
}, store.get("route", {}));
function routeCalc(a, b, s=RS){
  const straight = hav([a.lat,a.lng],[b.lat,b.lng]);
  const road = straight * s.circuity;
  const trips = Math.max(1, Math.ceil(s.tonnes / TRUCKS[s.truck].cap));
  const legKm = road * (s.emptyReturn ? 2 : 1);
  const fuelL = legKm * s.lp100/100;
  const fuel = fuelL * s.diesel;
  const running = legKm * s.perkm;
  const perTrip = fuel + running + s.fixed;
  const total = perTrip * trips;
  const perT = total / s.tonnes;
  const hours = road / s.speed;
  return {straight, road, trips, fuelL, fuel, running, perTrip, total, perT, perKg: perT/1000, hours};
}
function hrs(h){ const H=Math.floor(h), M=Math.round((h-H)*60); return H ? `${H} h ${M} min` : `${M} min`; }

}

function stateStyle(f){
  const land = cssVar("--land"), line = cssVar("--land-line"), ind = cssVar("--indigo");
  let fill = land, op = 1;
  if (f){
    const st = f.properties.state;
    if (SHADE==="markets" || SHADE==="wh"){
      const max = SHADE==="markets" ? Math.max(...STATE_NAMES.map(shadeValue)) : 11;
      const v = shadeValue(st);
      fill = v ? mix(ind, land, Math.round(10 + 45*v/max)) : land;
    } else if (SHADE==="pms"){
      const o = (typeof FUEL_OBS!=="undefined") ? FUEL_OBS.find(x=>x.nnpc && x.where===st) : null;
      if (o){ const all = FUEL_OBS.filter(x=>x.nnpc).map(x=>x.price); const lo=Math.min(...all), hi=Math.max(...all); const t=(o.price-lo)/(hi-lo||1); fill = t<0.5 ? mix(cssVar("--leaf"), land, Math.round(70-100*t)) : mix(cssVar("--bad"), land, Math.round(100*(t-0.5)+20)); }
    } else if (SHADE==="extreme"){
      const ex = obsFor(PRICE_C).filter(o=>o.scope==="state" && o.where===st && o.ext);
      const latest = ex.sort((a,b)=>b.date.localeCompare(a.date))[0];
      if (latest) fill = latest.ext==="high" ? mix(cssVar("--bad"), land, 55) : mix(cssVar("--leaf"), land, 55);
      const zn = obsFor(PRICE_C).filter(o=>o.scope==="zone" && o.where===ZONE_OF[st]).sort((a,b)=>b.date.localeCompare(a.date))[0];
      if (!latest && zn) fill = zn.ext==="high" ? mix(cssVar("--bad"), land, 22) : mix(cssVar("--leaf"), land, 22);
    }
    const sel = VIEW.state===st;
    const tilesOn = typeof tiles!=='undefined' && map.hasLayer(tiles);
    return {color: sel ? ind : line, weight: sel ? 2.2 : 0.9, fillColor: fill, fillOpacity: (tilesOn ? (SHADE==='none' ? 0 : 0.35) : 1) * (VIEW.state && !sel ? 0.55 : op)};
  }
  return {color:line, weight:0.9, fillColor:land, fillOpacity:1};

    const c = L.circleMarker([m.lat,m.lng], {radius: SEL?.id===m.id ? r+3 : r, color: cssVar("--panel"), weight:1.5, fillColor: MARKET_TYPES[m.type].color, fillOpacity: dim?0.35:0.95, opacity: dim?0.5:1});
    c.bindTooltip(m.name, {direction:"top", offset:[0,-4]});
    c.on("click", ()=> select(m.id));
    c.addTo(marketLayer);
  });
  FACILITIES.forEach(f=>{
    if (!LAYERS[f.type]) return;
    const op = f.conf==="state" ? "opacity:.7;" : "";
    const mk = L.marker([f.lat,f.lng], {icon: facIcon(f.type, op), keyboard:false, zIndexOffset: -100});
    mk.bindTooltip(f.name + (f.conf==="state" ? " (state-level location)" : ""), {direction:"top", offset:[0,-6]});
    mk.on("click", ()=> select(f.id));
    mk.addTo(facLayer);
  });
  if (LAYERS.user) USER_POINTS.forEach(p=>{
    const mk = L.marker([p.lat,p.lng], {icon: L.divIcon({className:"", iconSize:[16,16], iconAnchor:[8,8], html:`<div style="width:14px;height:14px;border-radius:50%;background:${cssVar("--sorghum")};border:3px solid ${cssVar("--panel")};box-shadow:0 0 0 1px ${cssVar("--sorghum")}"></div>`})});
    mk.bindTooltip(p.name + " (added by you)", {direction:"top"});
    mk.on("click", ()=> select(p.id));
    mk.addTo(userLayer);
  });
}
map.on("zoomend", drawPoints);

  if (SHADE==="pms") h += `<div class="lg"><span class="dot" style="background:var(--leaf)"></span>Cheaper petrol (NNPC)</div><div class="lg"><span class="dot" style="background:var(--bad)"></span>Dearer petrol (NNPC)</div><div class="lg muted">NNPC pump prices, 8 Oct 2026</div>`;
  if (SHADE==="extreme") h += `<div class="lg"><span class="dot" style="background:var(--bad)"></span>Highest-price state</div><div class="lg"><span class="dot" style="background:var(--leaf)"></span>Lowest-price state</div><div class="lg muted">${esc(COMMODITIES[PRICE_C].label)} · NBS · pale = zone</div>`;
  $("#legend").innerHTML = h;
}
function drawLayerBox(){

$("#shadeSel").onchange = e => { SHADE = e.target.value; store.set("shade", SHADE); restyleStates(); drawLegend(); };
$("#tilesChk").onchange = e => { if (e.target.checked){ tileErrors=0; tiles.addTo(map); } else { map.removeLayer(tiles); } restyleStates(); };
if (window.matchMedia("(max-width:820px)").matches){ $("#layerbox").open = false; $("#legendBox").open = false; }

// ---------- Navigation ----------
function setCrumbs(){
  const parts = [`<button type="button" data-go="country" ${VIEW.level==="country"?'aria-current="true"':""}>Nigeria</button>`];
  if (VIEW.state) parts.push(`<span>›</span><button type="button" data-go="state" ${VIEW.level==="state"?'aria-current="true"':""}>${esc(VIEW.state)}</button>`);
  if (VIEW.lga) parts.push(`<span>›</span><button type="button" data-go="lga" aria-current="true">${esc(VIEW.lga)} LGA</button>`);
  $("#crumbs").innerHTML = parts.join("");
  $("#crumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.go==="country") goCountry(); if(b.dataset.go==="state") goState(VIEW.state); });
}
function goCountry(){ VIEW={level:"country",state:null,lga:null}; SEL=null; ringLayer.clearLayers(); drawLGAs(); restyleStates(); drawPoints(); map.flyToBounds(stateLayer.getBounds(), {duration:.6}); setCrumbs(); showTab("explore"); renderExplore(); }
function goState(st){
  VIEW={level:"state",state:st,lga:null}; drawLGAs(); restyleStates(); drawPoints();
  const f = STATES_GEO.features.find(x=>x.properties.state===st); const b=f.bbox2;
  map.flyToBounds([[b[1],b[0]],[b[3],b[2]]], {padding:[30,30], duration:.6});
  setCrumbs(); showTab("explore"); renderExplore();
}
function goLGA(lga){
  VIEW.level="lga"; VIEW.lga=lga; restyleStates();
  const f = LGAS_GEO.features.find(x=>x.properties.lga===lga && x.properties.state===VIEW.state); const b=f.bbox2;
  map.flyToBounds([[b[1],b[0]],[b[3],b[2]]], {padding:[40,40], maxZoom:10, duration:.6});
  setCrumbs(); showTab("explore"); renderExplore();
}
function select(id){
  SEL = byId(id); if (!SEL) return;
  if (SEL.state && SEL.state!==VIEW.state && STATE_NAMES.includes(SEL.state)){ VIEW={level:"state",state:SEL.state,lga:null}; drawLGAs(); restyleStates(); setCrumbs(); }
  drawPoints(); drawRings(); showTab("explore"); renderExplore();
  map.panTo([SEL.lat, SEL.lng]);
}
function drawRings(){
  ringLayer.clearLayers();
  if (!SEL) return;
  [50,100,200].forEach(km=>{
    L.circle([SEL.lat,SEL.lng], {radius: km*1000/RS.circuity, color: cssVar("--sorghum"), weight:1, dashArray:"4 5", fill:false, interactive:false}).addTo(ringLayer);
    const lab = L.latLng(SEL.lat + (km/RS.circuity)/111.2, SEL.lng);
    L.marker(lab, {interactive:false, icon:L.divIcon({className:"", iconSize:[70,14], iconAnchor:[35,7], html:`<div style="font:600 10.5px var(--f-mono);color:${cssVar("--sorghum")};text-align:center;text-shadow:0 0 3px ${cssVar("--panel")}">${km} km road</div>`})}).addTo(ringLayer);
  });
}

function showTab(t){

// ---------- Explore pane ----------
function placeRow(p, right=""){
  const isM = p.kind==="market";
  const color = isM ? MARKET_TYPES[p.type].color : (FAC_TYPES[p.type]?.color || cssVar("--sorghum"));
  const sub = isM ? MARKET_TYPES[p.type].label : (FAC_TYPES[p.type]?.label || "Added by you");
  const where = [p.lga && p.lga+" LGA", p.state].filter(Boolean).join(", ");
  return `<button class="item" type="button" data-sel="${p.id}"><span class="dot" style="background:${color};${isM?"":"border-radius:2px"}"></span><span class="t"><b>${esc(p.name)}</b><span>${esc(sub)} · ${esc(where)}</span></span><span class="r">${right}</span></button>`;
}
function wireSel(root){ root.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>select(b.dataset.sel)); root.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>goState(b.dataset.state)); root.querySelectorAll("[data-lga]").forEach(b=>b.onclick=()=>goLGA(b.dataset.lga)); }

function selectedCard(){
  if (!SEL) return "";
  const p = SEL, isM = p.kind==="market";
  let h = `<div class="card">`;
  h += `<div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div style="min-width:0"><h2>${esc(p.name)}</h2><p class="small muted">${esc(isM ? MARKET_TYPES[p.type].label : FAC_TYPES[p.type]?.label || "Place you added")} · ${esc([p.lga && p.lga+" LGA", p.state, ZONE_OF[p.state]].filter(Boolean).join(" · "))}</p></div><button class="iconbtn" type="button" id="closeSel" aria-label="Close">Close</button></div>`;
  if (isM) h += `<p class="small"><b>Trades:</b> ${esc(p.goods)}</p>`;
  if (p.note) h += `<p class="small">${esc(p.note)}</p>`;
  if (p.conf){
    const confTxt = {site:"Specific facility",town:"Town known; pin approximate",corridor:"On a documented corridor; exact km point unknown",state:"Only the state is documented; pin sits at the state capital"}[p.conf];
    h += `<p class="small muted">Location: ${confTxt}. Source: ${SOURCES[p.src]?.url ? `<a href="${SOURCES[p.src].url}" target="_blank" rel="noopener">${esc(SOURCES[p.src].name)}</a>` : esc(SOURCES[p.src]?.name||"")}</p>`;
  }
  // prices
  if (isM || p.type==="market"){
    const rows = Object.keys(COMMODITIES).map(c=>({c, o:bestPrice(c,p)})).filter(r=>r.o && (r.o.scope!=="national" || r.o.user));
    const own = Object.keys(COMMODITIES).map(c=>({c, list: allObs().filter(o=>o.c===c && o.scope==="market" && [].concat(o.where).includes(p.id)).sort((a,b)=>b.date.localeCompare(a.date))})).filter(r=>r.list.length);
    if (own.length){
      h += `<h3>Prices reported at this market</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>Price</th><th>Unit</th><th>Date</th></tr></thead><tbody>`;
      own.forEach(r=>{ const o=r.list[0]; h += `<tr><td>${esc(COMMODITIES[r.c].label)}</td><td>${naira(o.price)}</td><td style="font-family:var(--f-body)">${esc(o.unit)}</td><td>${fmtDate(o.date)}</td></tr>`; });
      h += `</tbody></table></div>`;
    } else if (rows.length){
      h += `<h3>Closest price evidence</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>₦ / unit</th><th>Level</th><th>Date</th></tr></thead><tbody>`;
      rows.forEach(r=>{ h += `<tr><td>${esc(COMMODITIES[r.c].label)}</td><td>${naira(perBase(r.o))}/${COMMODITIES[r.c].base}</td><td>${levelTag(r.o)}</td><td>${fmtDate(r.o.date)}</td></tr>`; });
      h += `</tbody></table></div>`;
    } else h += `<p class="small muted">No market- or state-level prices yet. National NBS averages apply; add your own in the Data tab.</p>`;
  }
  // distances
  const nm = nearest(p, MARKETS, 6);
  h += `<h3>Nearest markets by road</h3><div class="list">` + nm.map(({x,d})=>placeRow(x, `${fmtN(d*RS.circuity)} km<br><span class="muted">${hrs(d*RS.circuity/RS.speed)}</span>`)).join("") + `</div>`;
  const near = t => nearest(p, FACILITIES.filter(f=>f.type===t), 1)[0];
  const fx = ["weighbridge","silo","warehouse","processor"].map(t=>({t, n:near(t)})).filter(r=>r.n);
  h += `<h3>Nearest support facilities</h3><div class="list">` + fx.map(({n})=>placeRow(n.x, `${fmtN(n.d*RS.circuity)} km`)).join("") + `</div>`;
  h += `<p class="small muted">Road km = straight-line distance × ${RS.circuity} (Nigerian road circuity). Drive time at ${RS.speed} km/h average including checkpoints. Change both in Logistics.</p>`;
  h += `<div class="btns"><button class="btn" type="button" id="asOrigin">Start a trip here</button><button class="btn ghost" type="button" id="asDest">Add to trip</button></div>`;
  return h + `</div>`;
}

      zn.forEach(o=>h+=`<li>${esc(ZONE_OF[st])} zone has the ${o.ext==="high"?"highest":"lowest"} ${esc(COMMODITIES[o.c].label.toLowerCase())} price: ${naira(o.price,2)}/kg (${fmtDate(o.date)})</li>`);

// ---------- Prices pane ----------
function spark(series){
  if (series.length<2) return "";
  const W=360,H=120,P={l:52,r:12,t:12,b:24};
  const xs = series.map((_,i)=>P.l + i*(W-P.l-P.r)/(series.length-1));
  const vals = series.map(s=>s.v); let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.15||hi*0.05; lo-=pad; hi+=pad;
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b);
  const pts = series.map((s,i)=>`${xs[i]},${y(s.v)}`).join(" ");
  const ticks = [lo+pad, (lo+hi)/2, hi-pad];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="National average price trend">
    ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${y(t)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${fmtN(t)}</text>`).join("")}
    <polygon points="${P.l},${H-P.b} ${pts} ${W-P.r},${H-P.b}" fill="var(--indigo)" fill-opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="var(--indigo)" stroke-width="2"/>
    ${series.map((s,i)=>`<circle cx="${xs[i]}" cy="${y(s.v)}" r="${i===series.length-1?4:2.5}" fill="var(--indigo)"/><text x="${xs[i]}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${fmtDate(s.d).replace(" 20"," ’")}</text>`).join("")}
  </svg>`;
}
function renderPrices(){
  const el = $("#pane-prices"); const c = PRICE_C;
  const obs = obsFor(c).sort((a,b)=>b.date.localeCompare(a.date) || LEVEL_RANK[a.scope]-LEVEL_RANK[b.scope]);
  const nat = obs.filter(o=>o.scope==="national" && !o.user && o.per===1).sort((a,b)=>a.date.localeCompare(b.date));
  const series = nat.map(o=>({d:o.date, v:o.price}));
  let h = `<div class="field"><label for="pc">Item</label><select id="pc">${Object.entries(COMMODITIES).map(([k,v])=>`<option value="${k}" ${k===c?"selected":""}>${esc(v.label)} (${obsFor(k).length})</option>`).join("")}</select></div>`;
  if (nat.length){

const csvCell = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
function matchCommodity(s){
  s = s.trim().toLowerCase().replace(/s$/,"");
  const alias = {"soybean":"soy","soya":"soy","soya bean":"soy","rice local":"ricel","local rice":"ricel","rice imported":"ricei","imported rice":"ricei","brown bean":"beansb","white bean":"beansw","bean":"beansb","garri":"garriw","white garri":"garriw","yellow garri":"garriy","tomatoe":"tomato","onion":"onion","palm oil":"palmoil","vegetable oil":"vegoil","egusi":"egusi","melon":"egusi","groundnut":"groundnut","pepper":"pepper","ginger":"ginger","maize":"maize","corn":"maize","sorghum":"sorghum","guinea corn":"sorghum","millet":"millet"};
  if (COMMODITIES[s]) return s;
  if (alias[s]) return alias[s];
  return Object.keys(COMMODITIES).find(k=>COMMODITIES[k].label.toLowerCase().startsWith(s)) || null;
}
function importCSV(){
  const lines = $("#csvIn").value.split(/\r?\n/).map(l=>l.trim()).filter(l=>l && !/^place\s*,/i.test(l));
  let ok=0; const bad=[];
  lines.forEach((l,i)=>{
    const p = l.split(",").map(x=>x.trim());
    if (p.length<5){ bad.push(`line ${i+1}: needs at least 5 fields`); return; }
    const [place, com, per, price, date, ...src] = p;
    const c = matchCommodity(com); if(!c){ bad.push(`line ${i+1}: unknown commodity “${com}”`); return; }
    const pr = parseFloat(price.replace(/[₦\s]/g,"")), pe = parseFloat(per);
    if (isNaN(pr)){ bad.push(`line ${i+1}: price is not a number`); return; }
    if (!/^\d{4}-\d{2}$/.test(date)){ bad.push(`line ${i+1}: date must look like 2026-10`); return; }
    const m = allPlaces().find(x=>x.name.toLowerCase()===place.toLowerCase()) || allPlaces().find(x=>x.name.toLowerCase().includes(place.toLowerCase()));
    const st = STATE_NAMES.find(s=>s.toLowerCase()===place.toLowerCase());
    if (!m && !st){ bad.push(`line ${i+1}: no market or state called “${place}”`); return; }
    USER_PRICES.push({c, price:pr, unit: isNaN(pe)?"unit":`${pe} ${COMMODITIES[c].base}`, per: isNaN(pe)?null:pe, date, scope: st && !m ? "state" : "market", where: st && !m ? st : [m.id], user:true, srcText: src.join(", ") || "Your import"});
    ok++;
  });
  store.set("prices", USER_PRICES);
  $("#csvMsg").innerHTML = `<span class="good">${ok} price${ok===1?"":"s"} added.</span> ${bad.length?`<span class="bad">${bad.map(esc).join("; ")}</span>`:""}`;
  if (ok){ restyleStates(); }
}

// ---------- Live feed (written by the bots on the hosted site) ----------
let FEED = {loaded:false, generated:null, status:null};
const daysOld = d => { if (!d) return 9999; const p = d.split("-"); const dt = new Date(+p[0], +p[1]-1, p[2] ? +p[2] : 15); return Math.round((Date.now()-dt)/864e5); };
function freshChip(d, undated){
  if (undated) return `<span class="fresh aging" title="The source shows no date; this is when it was read">undated</span>`;
  const n = daysOld(d); const cls = n<=14 ? "ok" : n<=60 ? "aging" : "stale";
  return `<span class="fresh ${cls}">${n<=1?"today":n<=14?n+" days":n<=60?Math.round(n/7)+" wks":Math.round(n/30)+" mo"}</span>`;
}
async function loadFeed(){
  try {
    const r = await fetch("data/prices-latest.json", {cache:"no-store"});
    if (!r.ok) throw 0;
    const j = await r.json();
    if (!Array.isArray(j.records) || !j.records.length) throw 0;
    const feedSrc = new Set(j.records.map(x=>x.src));
    // feed replaces the hand-captured snapshot for every source it covers
    for (let i=PRICE_OBS.length-1; i>=0; i--) if (feedSrc.has(PRICE_OBS[i].src) && !PRICE_OBS[i].series) PRICE_OBS.splice(i,1);
    j.records.forEach(x=>{ if (COMMODITIES[x.c]) PRICE_OBS.push(Object.assign({feed:true}, x, {where: x.scope==="market" ? [].concat(x.where) : x.where})); });
    FEED = {loaded:true, generated:j.generated, status:null, n:j.records.length};
    try { const s = await fetch("data/status.json", {cache:"no-store"}); if (s.ok) FEED.status = await s.json(); } catch(e){}
  } catch(e){ FEED.loaded = false; }
  const pill = $("#feedPill");
  if (FEED.loaded){ pill.textContent = "Live feed · " + new Date(FEED.generated).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); pill.classList.add("live"); }
  else pill.textContent = "Snapshot · " + fmtDate(SNAPSHOT_DATE);
  renderTicker(); restyleStates(); checkAlerts();
  const t = store.get("tab","explore"); if (!$("#pane-"+t)?.hidden){ if (t==="prices") renderPrices(); if (t==="tracker") renderTracker(); if (t==="route") renderRoute(); }
}

// ---------- Ticker ----------
function latestMarketObs(){
  const m = {};
  allObs().filter(o=>o.scope==="market" && perBase(o)!=null && !o.undated && daysOld(o.date)<=120).forEach(o=>{
    [].concat(o.where).forEach(w=>{ const k = w+"|"+o.c; if (!m[k] || o.date>m[k].date) m[k] = Object.assign({}, o, {w}); });
  });
  return Object.values(m);
}
function prevFor(o){
  return allObs().filter(x=>x.c===o.c && x.src===o.src && x.scope==="market" && [].concat(x.where).includes(o.w) && x.date<o.date && perBase(x)!=null).sort((a,b)=>b.date.localeCompare(a.date))[0];
}
function renderTicker(){
  const items = latestMarketObs().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const html = items.map(o=>{
    const p = prevFor(o); const ch = p ? (perBase(o)/perBase(p)-1)*100 : null;
    const arrow = ch==null ? "" : ch>0.5 ? `<span class="bad">▲${fmtN(ch,1)}%</span>` : ch<-0.5 ? `<span class="good">▼${fmtN(-ch,1)}%</span>` : `<span class="muted">■</span>`;
    return `<span class="tick"><b>${esc(COMMODITIES[o.c].label)}</b><span class="num">${naira(perBase(o))}/${COMMODITIES[o.c].base}</span>${arrow}<span class="w">${esc(byId(o.w)?.name||o.w)} · ${fmtDate(o.date)}</span></span>`;
  }).join("");
  $("#tickTrack").innerHTML = html + html; // doubled for a seamless loop
}

      h += `<h3>Markets in ${esc(st)}</h3>` + (stMk.length ? `<div class="list">${stMk.slice().sort((a,b)=>a.lga.localeCompare(b.lga)||a.name.localeCompare(b.name)).map(m=>placeRow(m)).join("")}</div>` : `<p class="small muted">No market mapped here yet. Report one from the Calendar tab.</p>`);
      h += `<h3>Storage, weighing &amp; trading sites</h3>` + (stFc.length ? `<div class="list">${stFc.map(f=>placeRow(f, f.conf==="state"?'<span class="tag">state-level</span>':"")).join("")}</div>` : `<p class="small muted">None recorded here.</p>`);
      if (stMk.length>=2 && stMk.length<=12){
        h += `<h3>Distances between ${esc(st)} markets (km, estimate)</h3><div class="tablewrap"><table><thead><tr><th></th>${stMk.map((m,i)=>`<th title="${esc(m.name)}">${i+1}</th>`).join("")}</tr></thead><tbody>`;
        stMk.forEach((a,i)=>{ h += `<tr><td>${i+1}. ${esc(a.name)}</td>${stMk.map(b=>`<td>${a===b?"·":fmtN(hav([a.lat,a.lng],[b.lat,b.lng])*RS.circuity)}</td>`).join("")}</tr>`; });
        h += `</tbody></table></div><p class="hint">Straight-line × ${RS.circuity}. Use Logistics for road distances and travel times.</p>`;
      }
    } else {
      const lga = VIEW.lga;
      const f = LGAS_GEO.features.find(x=>x.properties.lga===lga && x.properties.state===st);
      const mk = stMk.filter(m=>m.lga===lga), fc = stFc.filter(x=>x.lga===lga);
      const md = (typeof calEntries==="function") ? calEntries().filter(e=>e.state===st && e.lga===lga) : [];
      h += `<div><h2>${esc(lga)} LGA overview</h2><p class="small muted">${esc(st)} · ${ZONE_OF[st]} zone</p></div>`;
      h += `<div class="stats"><div class="stat"><b>${mk.length}</b><span>markets mapped</span></div><div class="stat"><b>${fc.length}</b><span>storage &amp; weighing sites</span></div><div class="stat"><b>${md.length}</b><span>market days recorded</span></div></div>`;
      h += `<h3>Markets in this LGA</h3>` + (mk.length ? `<div class="list">${mk.map(m=>placeRow(m)).join("")}</div>` : `<p class="small muted">No market mapped in ${esc(lga)} yet.</p>`);
      if (md.length){ const t = todayStr(); h += `<h3>Market days</h3><div class="list">${md.map(e=>`<button class="item" type="button" data-calgo="${esc(e.id)}"><span class="dot" style="background:${meets(e,t)?"var(--indigo)":"var(--line)"}"></span><span class="t"><b>${esc(e.name)}</b><span>${esc(cycleLabel(e.cycle))}</span></span><span class="r">next ${nextDates(e,t,2).map(d=>dow(d)+" "+(+d.slice(8))).join(", ")}</span></button>`).join("")}</div>`; }
      else h += `<p class="small muted">No market day recorded for ${esc(lga)}. <a href="#" id="calLga" style="color:var(--indigo);font-weight:600">Report a market here</a></p>`;
      const pseudo = {id:"_c", lat:f.c[0], lng:f.c[1]};
      h += `<h3>Closest markets to the LGA centre</h3><div class="list">${nearest(pseudo, MARKETS.filter(m=>m.lga!==lga), 5).map(({x,d})=>placeRow(x, `${fmtN(d*RS.circuity)} km`)).join("")}</div>`;
      const fx = ["weighbridge","silo","warehouse","processor"].map(t=>nearest(pseudo, FACILITIES.filter(x=>x.type===t), 1)[0]).filter(Boolean);
      h += `<h3>Nearest support facilities</h3><div class="list">${fx.map(({x,d})=>placeRow(x, `${fmtN(d*RS.circuity)} km`)).join("")}</div>`;
      if (fc.length) h += `<h3>Sites in this LGA</h3><div class="list">${fc.map(x=>placeRow(x)).join("")}</div>`;
      h += `<div class="btns"><button class="btn" type="button" id="tripFromLga">Plan a trip from ${esc(lga)}</button></div>`;
    }
  }
  el.innerHTML = h; wireSel(el);
  $("#exState").onchange = e=>{ e.target.value ? goState(e.target.value) : goCountry(); };
  $("#exLga").onchange = e=>{ e.target.value ? goLGA(e.target.value) : goState(VIEW.state); };
  $("#closeSel") && ($("#closeSel").onclick = ()=>{ SEL=null; ringLayer.clearLayers(); drawPoints(); renderExplore(); });
  $("#asOrigin") && ($("#asOrigin").onclick = ()=>{ RS.stops=[stopFromPlace(SEL)]; saveRS(); showTab("route"); });
  $("#asDest") && ($("#asDest").onclick = ()=>{ (RS.stops ||= []).push(stopFromPlace(SEL)); saveRS(); showTab("route"); });
  $("#tripFromLga") && ($("#tripFromLga").onclick = ()=>{ const f=LGAS_GEO.features.find(x=>x.properties.lga===VIEW.lga && x.properties.state===VIEW.state); RS.stops=[{name:VIEW.lga+" (LGA centre)", sub:VIEW.state, lat:f.c[0], lng:f.c[1], kind:"lga"}]; saveRS(); showTab("route"); });
  $("#calLga") && ($("#calLga").onclick = ev=>{ ev.preventDefault(); openCalForm(null); });
  el.querySelectorAll("[data-calgo]").forEach(b=>b.onclick=()=>{ CAL_SEL=b.dataset.calgo; showTab("calendar"); });
  el.querySelectorAll("[data-mt]").forEach(i=>i.onchange=()=>{ MTYPES[i.dataset.mt]=i.checked; store.set("mtypes",MTYPES); drawPoints(); drawLegend(); });
  const q = $("#q");
  if (q) q.oninput = () => {
    const s = q.value.trim().toLowerCase(); const out = $("#qres");
    if (s.length<2){ out.innerHTML=""; return; }
    const pl = [...MARKETS, ...FACILITIES, ...USER_POINTS].filter(p=>(p.name+" "+(p.goods||"")).toLowerCase().includes(s)).slice(0,8);
    const stt = STATE_NAMES.filter(x=>x.toLowerCase().includes(s)).slice(0,3);
    const lg = LGAS_GEO.features.filter(f=>f.properties.lga.toLowerCase().includes(s)).slice(0,5);
    out.innerHTML = (pl.length||stt.length||lg.length) ? `<div class="list">` +
      stt.map(x=>`<button class="item" type="button" data-state="${esc(x)}"><span class="dot" style="background:var(--indigo)"></span><span class="t"><b>${esc(x)}</b><span>State</span></span><span class="r"></span></button>`).join("") +
      lg.map(f=>`<button class="item" type="button" data-lgajump="${esc(f.properties.state)}|${esc(f.properties.lga)}"><span class="dot" style="background:var(--muted)"></span><span class="t"><b>${esc(f.properties.lga)}</b><span>LGA · ${esc(f.properties.state)}</span></span><span class="r"></span></button>`).join("") +
      pl.map(p=>placeRow(p)).join("") + `</div>` : `<p class="small muted">Nothing matches “${esc(q.value)}”.</p>`;
    wireSel(out);
    out.querySelectorAll("[data-lgajump]").forEach(b=>b.onclick=()=>{ const [s2,l]=b.dataset.lgajump.split("|"); VIEW={level:"state",state:s2,lga:null}; drawLGAs(); goLGA(l); });
  };
};

// ---------- Market-day calendar ----------
// Many rural markets meet on a fixed cycle (every 4, 5, 8 days…) rather than a weekday.
// Each entry stores one known market date (the anchor) and the cycle; every other date follows.
const CYCLES = [
  [1,"Every day"],[2,"Every 2 days"],[3,"Every 3 days"],[4,"Every 4 days"],[5,"Every 5 days"],[6,"Every 6 days"],
  [7,"Every 7 days (same weekday each week)"],[8,"Every 8 days"],[14,"Every 14 days (fortnightly)"]
];
// Optional hand-off for the public website: a Tally form with hidden fields (see bots/README-market-days.md)
const TALLY_FORM_URL = "https://tally.so/r/obroDO";

const dayNum = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const fromNum = n => new Date(n*864e5).toISOString().slice(0,10);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dow = s => WEEKDAYS[new Date(dayNum(s)*864e5).getUTCDay()];
function meets(e, s){ const k = dayNum(s) - dayNum(e.anchor); return ((k % e.cycle) + e.cycle) % e.cycle === 0; }
function nextDates(e, from, n=6){ const out=[]; let k = dayNum(from); const a = dayNum(e.anchor); const off = ((a - k) % e.cycle + e.cycle) % e.cycle; k += off; for (let i=0;i<n;i++){ out.push(fromNum(k)); k += e.cycle; } return out; }
function cycleLabel(c){ return (CYCLES.find(x=>x[0]===c)||[c,`Every ${c} days`])[1].replace(" (same weekday each week)","").replace(" (fortnightly)",""); }

// storage state
let CAL = { db:null, user:null, uid:null, canWrite:null, entries:[], local: store.get("calLocal", []), feed:[], mode:"loading", unsub:null };
const calEntries = () => [...CAL.entries, ...CAL.feed, ...CAL.local];
let CAL_DATE = todayStr(), CAL_VIEW = store.get("calView","day"), CAL_SEL = null, CAL_FORM = null, PICKING = false, PICKED = null, GPS = null;
const calLayer = L.layerGroup().addTo(map);

async function initCalendarStore(){
  try {
    const r = await fetch("data/market-days.json", {cache:"no-store"});
    if (r.ok){ const j = await r.json(); CAL.feed = (j.entries||[]).map(e=>Object.assign({src:"feed", id:"f_"+e.id}, e)); }
  } catch(e){}
  if (!window.claude?.use){ CAL.mode = TALLY_FORM_URL ? "tally" : "local"; afterCalChange(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  CAL.db = db; CAL.user = user;
  if (!db){ CAL.mode = TALLY_FORM_URL ? "tally" : "local"; afterCalChange(); return; }
  CAL.uid = user ? await user.id() : null;
  CAL.canWrite = user ? await user.can("data.write") : null;
  CAL.mode = CAL.canWrite===false ? "readonly" : "shared";
  CAL.unsub = db.collection("market_days").onSnapshot(snap=>{
    CAL.entries = snap.docs.map(d=>Object.assign({id:d.id, src:"db"}, d.data()));
    afterCalChange();
  }, err=>{ if (err.code!=="unavailable"){ CAL.mode = "local"; afterCalChange(); } });
}
function afterCalChange(){
  drawCalendarLayer();
  if (!$("#pane-calendar").hidden) renderCalendar();
}

// calendar scope is its own: state and LGA chosen inside the Calendar tab (starts from the Explore view)
let CAL_SCOPE = {state:null, lga:null}, CAL_SCOPE_SET = false;
function calScope(){ if (!CAL_SCOPE_SET) return {state: VIEW.state, lga: VIEW.lga}; return CAL_SCOPE; }
function inScope(e){ const s = calScope(); if (s.lga) return e.state===s.state && e.lga===s.lga; if (s.state) return e.state===s.state; return true; }
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function periodDays(){
  const d = CAL_DATE, n = dayNum(d);
  if (CAL_VIEW==="day") return [d];
  if (CAL_VIEW==="week"){ const wdi = (new Date(n*864e5).getUTCDay()+6)%7; return [...Array(7)].map((_,i)=>fromNum(n-wdi+i)); }
  const [y,m] = d.split("-").map(Number); const first = dayNum(`${y}-${String(m).padStart(2,"0")}-01`); const len = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return [...Array(len)].map((_,i)=>fromNum(first+i));
}
function periodLabel(){
  const days = periodDays();
  if (CAL_VIEW==="day") return `${dow(days[0])} ${fmtDate(days[0])}`;
  if (CAL_VIEW==="week") return `Week of ${+days[0].slice(8)} ${MONTHS[+days[0].slice(5,7)-1]} – ${+days[6].slice(8)} ${MONTHS[+days[6].slice(5,7)-1]} ${days[6].slice(0,4)}`;
  const [y,m] = days[0].split("-"); return `${MONTHS_LONG[+m-1]} ${y}`;
}
function shiftPeriod(dir){
  if (CAL_VIEW==="day") CAL_DATE = fromNum(dayNum(CAL_DATE)+dir);
  else if (CAL_VIEW==="week") CAL_DATE = fromNum(dayNum(CAL_DATE)+7*dir);
  else { let [y,m] = CAL_DATE.split("-").map(Number); m += dir; if (m<1){m=12;y--;} if (m>12){m=1;y++;} CAL_DATE = `${y}-${String(m).padStart(2,"0")}-01`; }
}
function drawCalendarLayer(){
  calLayer.clearLayers();
  if (!LAYERS.calendar) return;
  const days = periodDays();
  calEntries().filter(inScope).forEach(e=>{
    if (e.lat==null || e.lng==null) return;
    const hits = days.filter(d=>meets(e,d));
    const on = hits.length>0;
    const mk = L.circleMarker([e.lat,e.lng], {radius: on?7+Math.min(4,hits.length-1):5, color: on?cssVar("--indigo"):cssVar("--muted"), weight: on?3:1.5, fillColor: cssVar("--panel"), fillOpacity: 1, dashArray: e.status==="confirmed"?null:"2 2"});
    mk.bindTooltip(`${e.name} · ${on ? (CAL_VIEW==="day" ? "meets "+fmtDate(days[0]) : hits.length+" market day"+(hits.length>1?"s":"")+" in this "+CAL_VIEW) : "next "+fmtDate(nextDates(e,days[0],1)[0])}`, {direction:"top"});
    mk.on("click", ()=>{ CAL_SEL = e.id; showTab("calendar"); });
    mk.addTo(calLayer);
  });
}

// ---------- render ----------
function scopeName(){ const s = calScope(); return s.lga ? `${s.lga} LGA, ${s.state}` : s.state ? `${s.state}${s.state==="FCT"?"":" State"}` : "Nigeria"; }
function storeNote(){
  return {
    loading:`<p class="hint">Connecting to the shared market list…</p>`,
    shared:"",
    readonly:`<div class="note">You can browse market days. Adding or correcting markets here needs Contributor access to this page; ask the owner, or use the community form on the atlas website.</div>`,
    tally:`<div class="note">Your report goes to the atlas team for checking and appears here after the next daily update.</div>`,
    local:`<div class="note">Reports you add are saved in this browser only, because shared saving is not available here. They still appear on your calendar and map.</div>`
  }[CAL.mode] || "";
}
function entryRow(e, date, dates){
  const on = meets(e, date);
  const right = dates ? `<span class="num">${dates.map(d=>+d.slice(8)).join(", ")}</span>` : (on?'<span class="status confirmed" style="background:color-mix(in srgb,var(--indigo) 16%,transparent);color:var(--indigo)">meets</span>':"next "+fmtDate(nextDates(e,date,1)[0]).replace(/ 20\d\d$/,""));
  return `<button class="item" type="button" data-cal="${esc(e.id)}"><span class="dot" style="background:${on||dates?"var(--indigo)":"var(--line)"}"></span><span class="t"><b>${esc(e.name)}${e.localName?` <span class="muted" style="font-weight:400">(${esc(e.localName)})</span>`:""}</b><span>${esc(e.lga)} LGA, ${esc(e.state)} · <span class="cyc">${esc(cycleLabel(e.cycle))}</span></span></span><span class="r">${right}<br><span class="status ${e.status==="confirmed"?"confirmed":"reported"}">${e.status==="confirmed"?"confirmed":"reported"}</span></span></button>`;
}
function renderCalendar(){
  const el = $("#pane-calendar");
  if (CAL_FORM){ renderCalForm(el); return; }
  if (CAL_SEL){ const e = calEntries().find(x=>x.id===CAL_SEL); if (e){ renderCalDetail(el, e); return; } CAL_SEL = null; }
  const sc = calScope();
  const all = calEntries().filter(inScope);
  const t = todayStr(), days = periodDays();
  const lgas = sc.state ? LGAS_GEO.features.filter(f=>f.properties.state===sc.state).map(f=>f.properties.lga).sort() : [];
  let h = `<div><h2>Market days · ${esc(scopeName())}</h2><p class="small muted">Which markets meet on each day. Many local markets run on 4-, 5- or 8-day cycles, so dates are worked out from the last day someone saw each market held.</p></div>`;
  h += storeNote();
  h += `<div class="row"><div class="field"><label for="calState">State</label><select id="calState"><option value="">All of Nigeria</option>${STATE_NAMES.map(s=>`<option ${s===sc.state?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
    <div class="field"><label for="calLga">LGA</label><select id="calLga" ${sc.state?"":"disabled"}><option value="">${sc.state?"All LGAs":"Choose a state first"}</option>${lgas.map(l=>`<option ${l===sc.lga?"selected":""}>${esc(l)}</option>`).join("")}</select></div></div>`;
  h += `<div class="seg" role="group" aria-label="Calendar view"><button type="button" data-cv="day" aria-pressed="${CAL_VIEW==="day"}">Day</button><button type="button" data-cv="week" aria-pressed="${CAL_VIEW==="week"}">Week</button><button type="button" data-cv="month" aria-pressed="${CAL_VIEW==="month"}">Month</button></div>`;
  h += `<div style="display:flex;align-items:center;gap:8px;justify-content:space-between"><button class="iconbtn" type="button" id="calPrev" aria-label="Previous">‹</button><b style="font-family:var(--f-display);text-align:center">${esc(periodLabel())}</b><button class="iconbtn" type="button" id="calNext" aria-label="Next">›</button></div>`;
  h += `<div class="row"><div class="field"><label for="calDate">Go to date</label><input type="date" id="calDate" value="${CAL_DATE}"></div><div class="field"><label>&nbsp;</label><button class="btn ghost" type="button" id="calToday">Today</button></div></div>`;
  // grid
  if (CAL_VIEW!=="month"){
    const wk = CAL_VIEW==="week" ? days : (()=>{ const n=dayNum(CAL_DATE), wdi=(new Date(n*864e5).getUTCDay()+6)%7; return [...Array(7)].map((_,i)=>fromNum(n-wdi+i)); })();
    h += `<div class="week">${wk.map(d=>{ const n = all.filter(e=>meets(e,d)).length; return `<button type="button" class="wd ${d===t?"today":""}" data-day="${d}" aria-pressed="${CAL_VIEW==="day" && d===CAL_DATE}"><span>${dow(d)}</span><b>${+d.slice(8)}</b><span class="cnt">${n?n+" mkt"+(n>1?"s":""):"–"}</span></button>`; }).join("")}</div>`;
  } else {
    const lead = (new Date(dayNum(days[0])*864e5).getUTCDay()+6)%7;
    h += `<div class="week">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="hint" style="text-align:center">${w}</span>`).join("")}${"<span></span>".repeat(lead)}${days.map(d=>{ const n = all.filter(e=>meets(e,d)).length; return `<button type="button" class="wd ${d===t?"today":""}" data-day="${d}" style="padding:4px 2px"><b style="font-size:13px">${+d.slice(8)}</b><span class="cnt">${n||"·"}</span></button>`; }).join("")}</div>`;
  }
  // list
  if (!calEntries().length){
    h += `<div class="card"><h3>No market days recorded yet</h3><p class="small">Start the calendar with a market you know. You need its name, its LGA, one date you know it was held and how many days pass between one market day and the next.</p><div class="btns"><button class="btn" type="button" id="calAdd">Report a market</button></div></div>`;
  } else if (CAL_VIEW==="day"){
    const on = all.filter(e=>meets(e, CAL_DATE)).sort((a,b)=>a.state.localeCompare(b.state)||a.lga.localeCompare(b.lga)||a.name.localeCompare(b.name));
    h += `<h3>${on.length} market${on.length===1?"":"s"} meet${on.length===1?"s":""} on ${dow(CAL_DATE)} ${fmtDate(CAL_DATE)}</h3>`;
    h += on.length ? `<div class="list">${on.map(e=>entryRow(e, CAL_DATE)).join("")}</div>` : `<p class="small muted">No recorded market meets on this day in ${esc(scopeName())}.</p>`;
    const off = all.filter(e=>!meets(e, CAL_DATE));
    if (off.length) h += `<details><summary class="small" style="cursor:pointer">Other markets in ${esc(scopeName())} (${off.length})</summary><div class="list" style="margin-top:6px">${off.map(e=>entryRow(e, CAL_DATE)).join("")}</div></details>`;
  } else if (CAL_VIEW==="week"){
    h += days.map(d=>{ const on = all.filter(e=>meets(e,d)); return `<div><h3>${dow(d)} ${fmtDate(d)}${d===t?" · today":""} · ${on.length}</h3>${on.length?`<div class="list">${on.map(e=>entryRow(e,d)).join("")}</div>`:`<p class="small muted">No recorded market.</p>`}</div>`; }).join("");
  } else {
    const rows = all.map(e=>({e, ds: days.filter(d=>meets(e,d))})).filter(r=>r.ds.length).sort((a,b)=>a.ds[0].localeCompare(b.ds[0])||a.e.name.localeCompare(b.e.name));
    h += `<h3>${rows.length} market${rows.length===1?"":"s"} meet in ${esc(periodLabel())} · dates</h3>`;
    h += rows.length ? `<div class="list">${rows.map(r=>entryRow(r.e, days[0], r.ds)).join("")}</div>` : `<p class="small muted">No recorded market in ${esc(scopeName())} this month.</p>`;
  }
  if (calEntries().length && CAL.mode!=="readonly") h += `<div class="btns"><button class="btn" type="button" id="calAdd">Report a market</button></div>`;
  h += `<p class="hint">${all.length} market${all.length===1?"":"s"} on the calendar in ${esc(scopeName())}, ${calEntries().length} nationwide. The map shows markets meeting in the period you are viewing; dotted pins have one report, solid pins are confirmed.</p>`;
  el.innerHTML = h;
  $("#calState").onchange = e=>{ CAL_SCOPE = {state: e.target.value || null, lga: null}; CAL_SCOPE_SET = true; drawCalendarLayer(); renderCalendar();
    const f = STATES_GEO.features.find(x=>x.properties.state===e.target.value); if (f){ const b=f.bbox2; map.flyToBounds([[b[1],b[0]],[b[3],b[2]]], {padding:[30,30], duration:.6}); } };
  $("#calLga").onchange = e=>{ CAL_SCOPE = {state: sc.state, lga: e.target.value || null}; CAL_SCOPE_SET = true; drawCalendarLayer(); renderCalendar();
    const f = LGAS_GEO.features.find(x=>x.properties.state===sc.state && x.properties.lga===e.target.value); if (f){ const b=f.bbox2; map.flyToBounds([[b[1],b[0]],[b[3],b[2]]], {padding:[30,30], maxZoom:11, duration:.6}); } };
  $("#calDate").onchange = e=>{ if (e.target.value){ CAL_DATE = e.target.value; drawCalendarLayer(); renderCalendar(); } };
  el.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{ CAL_VIEW=b.dataset.cv; store.set("calView",CAL_VIEW); drawCalendarLayer(); renderCalendar(); });
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ CAL_DATE=b.dataset.day; CAL_VIEW="day"; store.set("calView",CAL_VIEW); drawCalendarLayer(); renderCalendar(); });
  $("#calPrev").onclick=()=>{ shiftPeriod(-1); drawCalendarLayer(); renderCalendar(); };
  $("#calNext").onclick=()=>{ shiftPeriod(1); drawCalendarLayer(); renderCalendar(); };
  $("#calToday").onclick=()=>{ CAL_DATE=todayStr(); drawCalendarLayer(); renderCalendar(); };
  el.querySelectorAll("#calAdd").forEach(b=>b.onclick=()=>{ openCalForm(null); const s = calScope(); if (s.state){ CAL_FORM.state = s.state; CAL_FORM.lga = s.lga||""; renderCalendar(); } });
  el.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{ CAL_SEL=b.dataset.cal; renderCalendar(); });
}

function renderCalDetail(el, e){
  const t = todayStr();
  const nd = nextDates(e, t, 8);

  PICKED = e && e.lat!=null ? {lat:e.lat, lng:e.lng, method:e.locMethod} : null; GPS = null;
  showTab("calendar");
}
function lgaOptions(st, sel){ return LGAS_GEO.features.filter(f=>f.properties.state===st).map(f=>f.properties.lga).sort().map(l=>`<option ${l===sel?"selected":""}>${esc(l)}</option>`).join(""); }

function marketPoint(){
  if (PICKED) return PICKED;
  const lf = LGAS_GEO.features.find(x=>x.properties.state===CAL_FORM.state && x.properties.lga===CAL_FORM.lga);
  return lf ? {lat:lf.c[0], lng:lf.c[1], method:"lga"} : null;
}
function shareLocation(){
  const msg = t => { const m = $("#gpsMsg"); if (m) m.textContent = t; };
  if (!navigator.geolocation){ msg("This browser cannot share location. You can skip this step."); return; }
  msg("Asking your browser for your location…");
  navigator.geolocation.getCurrentPosition(p=>{
    const pt = marketPoint();
    GPS = {lat:p.coords.latitude, lng:p.coords.longitude, dist: pt ? hav([pt.lat,pt.lng],[p.coords.latitude,p.coords.longitude]) : null};
    renderCalendar();
  }, ()=>msg("Location is not available on this page. That is fine: skip this step, or pin the market on the map instead."), {timeout:12000, maximumAge:60000});
}
function startPicking(){
  PICKING = true; map.getContainer().classList.add("leaflet-crosshair");
  const bar = document.createElement("div"); bar.className="pickbar"; bar.id="pickBar";
  bar.innerHTML = `<span>Click the market's location on the map</span><button type="button" id="pickCancel">Cancel</button>`;
  $(".mapwrap").appendChild(bar); $("#pickCancel").onclick = ()=>{ stopPicking(); };
  const lf = LGAS_GEO.features.find(x=>x.properties.state===CAL_FORM.state && x.properties.lga===CAL_FORM.lga);
  if (lf){ const b=lf.bbox2; map.flyToBounds([[b[1],b[0]],[b[3],b[2]]], {padding:[30,30], maxZoom:11, duration:.6}); }
  if (window.matchMedia("(max-width:820px)").matches) $("#map").scrollIntoView({behavior:"smooth"});

function stopPicking(){ PICKING=false; map.getContainer().classList.remove("leaflet-crosshair"); $("#pickBar")?.remove(); }
map.on("click", e=>{
  if (!PICKING) return;
  const l = findLGA(e.latlng.lat, e.latlng.lng);
  PICKED = {lat:e.latlng.lat, lng:e.latlng.lng, method:"map"};
  if (l && CAL_FORM){ CAL_FORM.state = l.properties.state; CAL_FORM.lga = l.properties.lga; }
  if (GPS) GPS.dist = hav([PICKED.lat,PICKED.lng],[GPS.lat,GPS.lng]);

function validate(f){
  if (!f.name.trim()) return "Add the market's name.";
  if (!f.state || !f.lga) return "Choose the state and LGA.";
  if (!f.anchor) return "Add a date you know the market was held.";
  if (f.anchor > todayStr()) return "The last known market day cannot be in the future.";
  const c = +f.cycle; if (!(c>=1 && c<=60)) return "Choose how often the market meets.";
  return null;
}
async function saveCalForm(){
  const f = CAL_FORM, msg = t => { $("#formMsg").innerHTML = t; };
  const err = validate(f); if (err){ msg(`<span class="bad">${esc(err)}</span>`); return; }
  const pt = marketPoint(); const now = new Date().toISOString();
  const body = {name:f.name.trim(), localName:(f.localName||"").trim(), state:f.state, lga:f.lga, anchor:f.anchor, cycle:+f.cycle,
    goods:(f.goods||"").trim(), notes:(f.notes||"").trim(), lat: pt? +pt.lat.toFixed(5):null, lng: pt? +pt.lng.toFixed(5):null, locMethod: pt?pt.method:"lga",
    reporterDistanceKm: GPS && GPS.dist!=null ? Math.round(GPS.dist*10)/10 : (f.reporterDistanceKm ?? null), updatedAt: now};
  const editing = !!f.id;
  if (editing){
    const old = calEntries().find(x=>x.id===f.id) || {};
    const changed = ["name","localName","lga","anchor","cycle","goods","notes","lat"].filter(k=>String(old[k]??"")!==String(body[k]??""));
    body.history = [...(old.history||[]), {at:now, by:CAL.uid||null, what: changed.length ? "updated "+changed.map(k=>({anchor:"last market day",lat:"location",localName:"local name"}[k]||k)).join(", ") : "re-checked details"}].slice(-25);
  } else {
    Object.assign(body, {status:"reported", reports:1, reporters: CAL.uid?[CAL.uid]:[], confirmations:[], createdAt:now, createdBy:CAL.uid||null, history:[{at:now, by:CAL.uid||null, what:"first reported"}]});
    const near = MARKETS.find(m=>m.state===body.state && m.name.toLowerCase().includes(body.name.toLowerCase().split(" ")[0]));
    if (near) body.atlasId = near.id;
  }
  try {
    if (CAL.mode==="shared"){
      if (editing) await CAL.db.collection("market_days").doc(f.id).update(body);
      else await CAL.db.collection("market_days").add(body);
    } else if (CAL.mode==="tally"){
      const q = new URLSearchParams(Object.entries(body).filter(([k,v])=>v!=null && typeof v!=="object").map(([k,v])=>[k,String(v)]));
      if (editing) q.set("updates", f.id.replace(/^f_/,""));
      window.open(TALLY_FORM_URL + "?" + q.toString(), "_blank", "noopener");
      CAL.local.push(Object.assign({id:"l"+Date.now(), src:"local", pending:true}, body)); store.set("calLocal", CAL.local);
    } else {
      if (editing && f.src==="local"){ const i = CAL.local.findIndex(x=>x.id===f.id); CAL.local[i] = Object.assign({}, CAL.local[i], body); }
      else CAL.local.push(Object.assign({id:"l"+Date.now(), src:"local"}, body));
      store.set("calLocal", CAL.local);
    }
  } catch(e){
    msg(`<span class="bad">${e && e.code==="invalid_argument" ? "This page could not save your report: your access here is view-only." : e && e.code==="quota_exceeded" ? "The calendar is full. Tell the atlas owner." : "Saving failed. Check your connection and try again."}</span>`);
    if (e && e.code==="invalid_argument"){ CAL.mode="readonly"; }
    return;
  }
  CAL_FORM = null; drawPick(); CAL_DATE = body.anchor > todayStr() ? body.anchor : CAL_DATE; afterCalChange(); renderCalendar();
  toast(editing ? "Market updated" : CAL.mode==="tally" ? "Opening the community form to send your report" : "Market added to the calendar");
}
async function confirmHeld(e, date){
  const m = $("#confMsg");
  if (!date || date > todayStr()){ m.innerHTML = `<span class="bad">Choose a date that has already passed.</span>`; return; }
  const now = new Date().toISOString();
  const fits = meets(e, date);
  const reporters = new Set(e.reporters||[]); const fresh = CAL.uid && !reporters.has(CAL.uid); if (CAL.uid) reporters.add(CAL.uid);
  const upd = { anchor: date > e.anchor ? date : e.anchor, updatedAt: now,
    confirmations: [...(e.confirmations||[]), {date, by:CAL.uid||null, at:now}].slice(-20),
    reporters: [...reporters].slice(-50), reports: (e.reports||1) + (fresh || !CAL.uid ? 1 : 0),
    history: [...(e.history||[]), {at:now, by:CAL.uid||null, what:`confirmed held on ${date}${fits?"":" (off the expected cycle; anchor moved)"}`}].slice(-25) };
  if (upd.reports >= 2) upd.status = "confirmed";
  try {
    if (e.src==="db") await CAL.db.collection("market_days").doc(e.id).update(upd);
    else if (e.src==="local"){ const i = CAL.local.findIndex(x=>x.id===e.id); CAL.local[i] = Object.assign({}, CAL.local[i], upd); store.set("calLocal", CAL.local); afterCalChange(); }
    else if (CAL.mode==="tally"){ window.open(TALLY_FORM_URL + "?" + new URLSearchParams({updates:e.id.replace(/^f_/,""), confirmDate:date}).toString(), "_blank", "noopener"); }
    toast(fits ? "Thanks, market day confirmed" : "Saved. The dates now follow from the day you confirmed");
  } catch(err){ m.innerHTML = `<span class="bad">Could not save the confirmation.</span>`; }
}

// community reports (db on claude.ai, Tally feed on the website, local otherwise)
let FUEL = {db:null, uid:null, mode:"loading", entries:[], feed:[], local: store.get("fuelLocal", [])};
const fuelReports = () => [...FUEL.entries, ...FUEL.feed, ...FUEL.local];
async function initFuelStore(){
  try { const r = await fetch("data/fuel-reports.json", {cache:"no-store"}); if (r.ok){ const j = await r.json(); FUEL.feed = (j.reports||[]).map(x=>Object.assign({src:"feed"}, x)); } } catch(e){}
  if (!window.claude?.use){ FUEL.mode = FUEL_FORM_URL ? "tally" : "local"; afterFuel(); return; }
  const db = await claude.use("db"); const user = await claude.use("user");
  if (!db){ FUEL.mode = FUEL_FORM_URL ? "tally" : "local"; afterFuel(); return; }
  FUEL.db = db; FUEL.uid = user ? await user.id() : null;
  const can = user ? await user.can("data.write") : null;
  FUEL.mode = can===false ? "readonly" : "shared";
  db.collection("fuel_reports").onSnapshot(s=>{ FUEL.entries = s.docs.map(d=>Object.assign({id:d.id, src:"db"}, d.data())); afterFuel(); }, err=>{ if (err.code!=="unavailable"){ FUEL.mode="local"; afterFuel(); } });
}
function afterFuel(){ if (!$("#pane-fuel").hidden) renderFuel(); if (!$("#pane-route").hidden) renderRoute(); }
function median(a){ if (!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function reportsFor(p, kind, state, days=21){
  return fuelReports().filter(r=>r.product===p && r.kind===kind && (!state || r.state===state) && daysOld(r.date)<=days && r.price>0);
}
// best current price for a product in a state, by kind
function fuelPrice(p, kind="pump", state=null){
  if (kind==="black"){
    const rs = reportsFor(p, "black", state); const rn = reportsFor(p, "black", null);
    if (rs.length) return {price: median(rs.map(r=>+r.price)), label:`median of ${rs.length} report${rs.length>1?"s":""} in ${state}`, date: rs.map(r=>r.date).sort().pop(), src:"fuel_reports"};
    if (rn.length) return {price: median(rn.map(r=>+r.price)), label:`median of ${rn.length} report${rn.length>1?"s":""} nationwide`, date: rn.map(r=>r.date).sort().pop(), src:"fuel_reports"};
    return null;
  }
  const rep = state ? reportsFor(p, kind, state, 14) : [];
  if (rep.length>=2) return {price: median(rep.map(r=>+r.price)), label:`median of ${rep.length} reports in ${state}`, date: rep.map(r=>r.date).sort().pop(), src:"fuel_reports"};
  const cand = FUEL_OBS.filter(o=>o.p===p && o.kind===kind && !o.series && ((state && o.scope==="state" && o.where===state) || o.scope==="national")).sort((a,b)=>(a.scope==="state"?0:1)-(b.scope==="state"?0:1) || b.date.localeCompare(a.date));
  const o = cand[0]; if (!o) return null;
  return {price:o.price, label:`${o.label||"price"}${o.scope==="state"?", "+o.where:", national"}`, date:o.date, src:o.src};
}

// trip vehicles and fuel use (editable assumptions)
const FUEL_VEH = {
  car:   {label:"Car",                                fuel:"pms", lp100:9},
  bus:   {label:"18-seater bus (petrol)",             fuel:"pms", lp100:14},
  coach: {label:"Coaster / luxury bus (diesel)",      fuel:"ago", lp100:25},
  truck: {label:"Articulated truck (diesel, loaded)", fuel:"ago", lp100:45}
};
let FS = Object.assign({p:"pms", state:null, calcKm:500, calcVeh:"car", lp:{}, black:{}, roundTrip:false}, store.get("fuel", {}));
const saveFS = () => store.set("fuel", FS);
const lpOf = v => FS.lp[v] ?? FUEL_VEH[v].lp100;
function tripFuel(km, v, state){
  const f = FUEL_VEH[v]; const litres = km * lpOf(v) / 100 * (FS.roundTrip ? 2 : 1);
  const pump = fuelPrice(f.fuel, "pump", state);
  const bm = FS.black[f.fuel] ? {price:+FS.black[f.fuel], label:"your price"} : fuelPrice(f.fuel, "black", state);
  return {litres, pump, bm, pumpCost: pump ? litres*pump.price : null, bmCost: bm ? litres*bm.price : null, fuel:f.fuel};
}

// ----- routing -----
function decode6(str){
  let i=0, lat=0, lng=0; const out=[];
  while (i < str.length){
    let b, s=0, r=0; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20); lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    s=0; r=0; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20); lng += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push([lat/1e6, lng/1e6]);
  }
  return out;
}
function estimateRoute(stops, v){
  const legs = stops.slice(1).map((b,i)=>{ const a = stops[i]; const km = hav([a.lat,a.lng],[b.lat,b.lng]) * RS.circuity; return {km, s: km/VEHICLES[v].speed*3600, shape:[[a.lat,a.lng],[b.lat,b.lng]]}; });

}
async function roadRoute(stops, v){
  const body = {locations: stops.map(s=>({lat:+s.lat.toFixed(5), lon:+s.lng.toFixed(5), type:"break"})), costing: VEHICLES[v].costing, units:"kilometers", directions_options:{units:"kilometers", narrative:false}};
  if (VEHICLES[v].options) body.costing_options = VEHICLES[v].options;
  const key = JSON.stringify(body);
  if (routeCache.has(key)) return routeCache.get(key);
  const r = await fetch(`${VALHALLA}?json=${encodeURIComponent(key)}`);
  const j = await r.json();
  if (!r.ok || !j.trip) throw new Error(j.error || ("HTTP "+r.status));
  const res = {legs: j.trip.legs.map(l=>({km:l.summary.length, s:l.summary.time, shape:decode6(l.shape)})), km:j.trip.summary.length, s:j.trip.summary.time, source:"road"};

async function computeRoutes(){
  const stops = RS.stops.filter(Boolean);
  const key = JSON.stringify(stops.map(s=>[s.lat.toFixed(4), s.lng.toFixed(4)]));
  if (stops.length<2){ ROUTES = {}; ROUTE_KEY = key; drawTrip(); renderRoute(); return; }
  if (key===ROUTE_KEY && Object.keys(ROUTES).length) return;
  ROUTE_KEY = key; const my = ++routeAbort; if (!(PERMS && PERMS.status==='loading')) PERMS = PERMS && PERMS.list && PERMS.list.some(o=>o.stops.length===stops.length && o.stops.every((x,i)=>x===stops[i])) ? PERMS : null; ALTS = null; altLayer.clearLayers();
  ROUTES = Object.fromEntries(Object.keys(VEHICLES).map(v=>[v, Object.assign(estimateRoute(stops, v), {pending:true})]));

  // selected vehicle first, then the others, one request per second (server fair-use)
  const order = [RS.vehicle, ...Object.keys(VEHICLES).filter(v=>v!==RS.vehicle)];
  for (const v of order){
    try { const r = await roadRoute(stops, v); if (my!==routeAbort) return; ROUTES[v] = r; }
    catch(e){ if (my!==routeAbort) return; ROUTES[v] = Object.assign(estimateRoute(stops, v), {err:String(e.message||e)}); }
    drawTrip(); if (!$("#pane-route").hidden) renderRoute();

}

  const total = cum[cum.length-1];
  const buffer = Math.max(4, Math.min(15, total/25));
  const places = [...MARKETS, ...((typeof calEntries==="function") ? calEntries().filter(e=>e.lat!=null).map(e=>({id:"cal_"+e.id, name:e.name, lga:e.lga, state:e.state, lat:e.lat, lng:e.lng, kind:"calendar"})) : [])];

  cands.forEach(c=>L.circleMarker([c.p.lat,c.p.lng], {radius:11, color:cssVar("--sorghum"), weight:2, fill:false, interactive:false}).addTo(drawLayer));

// ----- order suggestion (keeps first and last stop) -----
function suggestOrder(){
  const s = RS.stops.filter(Boolean); if (s.length < 4) return;
  const first = s[0], last = s[s.length-1]; let mid = s.slice(1,-1);
  const d = (a,b)=>hav([a.lat,a.lng],[b.lat,b.lng]);
  // nearest neighbour then 2-opt
  let route = [first]; let rest = mid.slice();
  while (rest.length){ const cur = route[route.length-1]; rest.sort((a,b)=>d(cur,a)-d(cur,b)); route.push(rest.shift()); }
  route.push(last);
  let improved = true;
  while (improved){ improved = false;
    for (let i=1;i<route.length-2;i++) for (let k=i+1;k<route.length-1;k++){
      const delta = d(route[i-1],route[k]) + d(route[i],route[k+1]) - d(route[i-1],route[i]) - d(route[k],route[k+1]);
      if (delta < -0.01){ route = [...route.slice(0,i), ...route.slice(i,k+1).reverse(), ...route.slice(k+1)]; improved = true; }
    }
  }
  RS.stops = route; saveRS(); computeRoutes(); toast("Stops reordered for the shortest drive");
}

function haulCost(km, nStops){
  const stops = RS.stops.filter(Boolean); const tr = TRUCKS[RS.truck], trips = Math.max(1, Math.ceil(RS.tonnes / tr.cap));

function permutations(arr){ if (arr.length<=1) return [arr.slice()]; const out=[]; arr.forEach((x,i)=>permutations([...arr.slice(0,i),...arr.slice(i+1)]).forEach(p=>out.push([x,...p]))); return out; }
async function compareOrders(keepLast){
  const stops = RS.stops.filter(Boolean); if (stops.length<3) return;

  const mids = keepLast ? stops.slice(1,-1) : stops.slice(1);
  if (mids.length>7){ PERMS = {status:"toomany"}; renderRoute(); return; }
  const d = (a,b)=>hav([a.lat,a.lng],[b.lat,b.lng]);
  const orders = permutations(mids).map(p=>{ const seq = [first, ...p, ...(last?[last]:[])]; let km=0; for (let i=1;i<seq.length;i++) km+=d(seq[i-1],seq[i]); return {seq, est:km}; }).sort((a,b)=>a.est-b.est);

    const buy = RS.buy ?? (ob ? Math.round(perBase(ob)) : null), sell = RS.sell ?? (db ? Math.round(perBase(db)) : null);

      <div class="field"><label for="rc">Commodity</label><select id="rc">${Object.entries(COMMODITIES).filter(([k,v])=>v.base==="kg"||v.base==="litre").map(([k,v])=>`<option value="${k}" ${k===RS.c?"selected":""}>${esc(v.label)}</option>`).join("")}</select></div>
      <div class="row"><div class="field"><label for="rbuy">Buy at ${esc(LETTERS[0])} (₦/${COMMODITIES[RS.c].base})</label><input type="number" id="rbuy" value="${buy??""}" placeholder="price"></div><div class="field"><label for="rsell">Sell at ${esc(LETTERS[stops.length-1])} (₦/${COMMODITIES[RS.c].base})</label><input type="number" id="rsell" value="${sell??""}" placeholder="price"></div></div>
      ${margin!=null?`<dl class="kv"><dt>Price gap per tonne</dt><dd>${naira((sell-buy)*1000)}</dd><dt>Haulage per tonne</dt><dd>${naira(perT)}</dd><dt><b>Net per tonne</b></dt><dd class="${margin>=0?"good":"bad"}"><b>${naira(margin)}</b></dd><dt><b>Net on ${fmtN(RS.tonnes)} t</b></dt><dd class="${margin>=0?"good":"bad"}"><b>${naira(margin*RS.tonnes)}</b></dd></dl>`:`<p class="hint">Enter both prices to see the margin. Prices fill in automatically when the first and last stops are markets with price data.</p>`}
      </div></details>`;
    // corridor facilities
    const along = [];
    if (R) { const pts = R.legs.flatMap(l=>l.shape); const step = Math.max(1, Math.floor(pts.length/400)); const sample = pts.filter((_,i)=>i%step===0);
      FACILITIES.filter(f=>f.conf!=="state").forEach(f=>{ let dmin=1e9; for (const p of sample){ const d = hav(p,[f.lat,f.lng]); if (d<dmin) dmin=d; } if (dmin<=8) along.push({f, d:dmin}); }); }

  el.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [RS.stops[i-1],RS.stops[i]]=[RS.stops[i],RS.stops[i-1]]; saveRS(); computeRoutes(); });

    $("#dcAppend").onclick = ()=>{ RS.stops = [...RS.stops, ...take()]; DRAW_CANDS=null; drawLayer.clearLayers(); saveRS(); computeRoutes().then(fitTrip); };

  }
  el.querySelectorAll("[data-veh]").forEach(b=>b.onclick=()=>{ RS.vehicle=b.dataset.veh; saveRS(); drawTrip(); renderRoute(); });

  drawTrip();
};

// ---------- Adjustable panel / map split ----------
(function(){

    main.style.setProperty("--pw", clampW(pw) + "px");
    main.style.setProperty("--mh", clampH(mh) + "vh");
    main.classList.toggle("panel-closed", mode==="map");
    main.classList.toggle("map-closed", mode==="panel");
    if (mode==="map") main.style.setProperty("--pw", "0px");

    else main.style.gridTemplateColumns = "";
    if (mobile()) main.style.gridTemplateRows = mode==="panel" ? "0 14px auto" : mode==="map" ? "85vh 14px 0" : "";
    else main.style.gridTemplateRows = "";
    $("#splPanel").setAttribute("aria-label", mode==="map" ? "Show the panel" : "Widen the panel");
    $("#splMap").setAttribute("aria-label", mode==="panel" ? "Show the map" : "Widen the map");
    setTimeout(()=>map.invalidateSize(), 60);
  }
  function save(){ store.set("panelW", pw); store.set("mapH", mh); store.set("splitMode", mode); }
  let dragging = false, startX = 0, startY = 0, startW = 0, startH = 0;
  const pt = e => e.touches ? e.touches[0] : e;
  sp.addEventListener("pointerdown", e=>{
    if (e.target.closest(".splbtn")) return;
    dragging = true; sp.classList.add("drag"); sp.setPointerCapture?.(e.pointerId);
    startX = e.clientX; startY = e.clientY; startW = mode==="map" ? 0 : $("aside.panel").getBoundingClientRect().width; startH = $(".mapwrap").getBoundingClientRect().height / window.innerHeight * 100;
    if (mode!=="both"){ mode = "both"; if (!mobile()) pw = Math.max(260, startW || 260); }

  });
  window.addEventListener("pointermove", e=>{
    if (!dragging) return;
    if (mobile()){ mh = clampH(startH + (e.clientY - startY) / window.innerHeight * 100); }
    else { pw = clampW((startW||260) + (e.clientX - startX)); }
    apply();
  });
  window.addEventListener("pointerup", ()=>{ if (!dragging) return; dragging = false; sp.classList.remove("drag"); save(); map.invalidateSize(); });
  sp.addEventListener("dblclick", e=>{ if (e.target.closest(".splbtn")) return; pw = 420; mh = 52; mode = "both"; apply(); save(); });
  sp.addEventListener("keydown", e=>{
    const step = e.shiftKey ? 80 : 30;
    if (!mobile() && (e.key==="ArrowLeft" || e.key==="ArrowRight")){ mode="both"; pw = clampW(pw + (e.key==="ArrowRight" ? step : -step)); }
    else if (mobile() && (e.key==="ArrowUp" || e.key==="ArrowDown")){ mode="both"; mh = clampH(mh + (e.key==="ArrowDown" ? 5 : -5)); }
    else return;
    e.preventDefault(); apply(); save();
  });
  // ‹ grows the panel (and finally hides the map); › grows the map (and finally hides the panel)
  $("#splPanel").onclick = ()=>{ if (mode==="map"){ mode="both"; } else if (mobile()){ mh = clampH(mh - 15); if (mh<=20) mode="panel"; } else { const max = window.innerWidth - 220; if (pw >= max - 5) mode="panel"; else pw = clampW(pw + 160); } apply(); save(); };
  $("#splMap").onclick = ()=>{ if (mode==="panel"){ mode="both"; } else if (mobile()){ mh = clampH(mh + 15); if (mh>=85) mode="map"; } else { if (pw <= 265) mode="map"; else pw = clampW(pw - 160); } apply(); save(); };
  window.addEventListener("resize", ()=>apply());
  apply();
})();

// ---------- Boot ----------
drawLayerBox(); setCrumbs(); applyTheme(store.get("theme", null) || (()=>{ try { const t = localStorage.getItem("theme"); return t==="light"||t==="dark" ? t : null; } catch(e){ return null; } })());
map.fitBounds(stateLayer.getBounds(), {padding:[10,10]});
renderExplore(); renderTicker();
$("#feedPill").textContent = "Snapshot · " + fmtDate(SNAPSHOT_DATE);
const startTab = (location.hash||"").replace("#","");
if (["explore","prices","tracker","calendar","route","fuel","data"].includes(startTab)) showTab(startTab);

loadFeed();
initCalendarStore();
initFuelStore();

</script>
