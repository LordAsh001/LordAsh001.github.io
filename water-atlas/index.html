html,body{height:100%}

.status svg{width:12px;height:12px;flex:none}
.status.s0{color:var(--s0)}.status.s1{color:var(--s1)}.status.s2{color:var(--s2)}.status.s3{color:var(--s3)}.status.sx{color:var(--muted);border-style:dashed}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard h3{font-family:var(--f-display);font-size:16px;margin:0;line-height:1.2}
.gcard .meta{font-size:12px;color:var(--muted)}
.gcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gcard .num{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.gcard .num small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.qchart{position:relative}
.qchart svg{display:block;width:100%;height:auto;overflow:visible}
.qchart text{fill:var(--muted);font-size:10.5px;font-family:var(--f-body)}
.qchart .gridl{stroke:var(--line)}
.qkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.qkey i{display:inline-block;width:14px;height:0;border-top:2px solid var(--c);vertical-align:3px;margin-right:4px}
.qkey i.band{height:8px;border:0;background:var(--c);opacity:.35;vertical-align:0}
.qkey i.dash{border-top-style:dashed}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--panel);font-size:13px;max-width:90ch}
.callout.warn{border-left-color:var(--s1)}
.legend .ln{width:16px;height:0;border-top:2.5px solid var(--c);border-radius:2px}
.legend .ar{width:12px;height:10px;border-radius:2px;background:var(--c);opacity:.7}
.legend .sq{width:12px;height:12px;border-radius:2px;background:var(--c)}
.ha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.ha{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ha .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ha h4{font-family:var(--f-display);font-size:16px;margin:2px 0 6px}
.ha p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.ha .kv{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
.wiki{font-size:13px;margin:0;max-width:65ch}
.wiki-src{font-size:11px;color:var(--muted);margin-top:4px}
.minilist{list-style:none;margin:0;padding:0;font-size:12.5px;display:grid;gap:2px}
.minilist li{display:flex;justify-content:space-between;gap:8px}
.minilist a{color:var(--accent);text-decoration:none;cursor:pointer}
.page h3.sh{font-family:var(--f-display);font-size:22px;margin:32px 0 10px}
.seg button.busy{opacity:.6}
#v-map,.mapwrap{overflow:clip}
.facts>.fact:last-child:nth-child(odd){grid-column:1/-1}
.chart svg.smap{max-width:520px;margin:0 auto}
@media (max-width:860px){.maptools .seg,.maptools .note{display:none}.maptools.open .seg{display:flex}.maptools.open .note:not([hidden]){display:block}}
.rcite{font-size:11.5px;color:var(--muted);white-space:nowrap;text-decoration:none}
a.rcite:hover{color:var(--accent);text-decoration:underline}
.rfacts{margin:0 0 8px;padding-left:18px;max-width:90ch;font-size:13.5px}
.rfacts li{margin:0 0 7px}
.box .rfacts{font-size:13px;padding-left:16px}
ol.refs{font-size:12.5px;padding-left:20px;max-width:100ch}
ol.refs li{margin:0 0 6px}
.sm-note{font-size:12px;color:var(--muted);margin:6px 0 0;max-width:90ch}
.tag{display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;vertical-align:2px;white-space:nowrap}
.page h4.h4{font-family:var(--f-display);font-size:15px;margin:0 0 8px}
#fh-host select,#irrig select{width:auto;font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.box dd .rcite{white-space:normal}
.nm-a{border-left:4px solid var(--c);background:var(--bg);border-radius:6px;padding:8px 12px;margin:6px 0}
.nm-a.off{opacity:.6;border-left-style:dashed}
.nm-a summary{cursor:pointer;line-height:1.5}
.nm-a p{margin:6px 0 0}
.nm-sev{display:inline-block;background:var(--c);color:#fff;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.nm-t{font-size:12px;color:var(--muted)}
.nm-h{font-size:13px}
.nm-feat{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:14px;align-items:start;margin:6px 0 12px}
.nm-feat img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.nm-feat p{margin:6px 0}
.nm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.nm-b{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.nm-b img{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff;flex:none}
@media (max-width:640px){.nm-feat{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5C11.5 9.5 7 15 7 20.5a9 9 0 0 0 18 0C25 15 20.5 9.5 16 2.5Z" fill="var(--accent)"/><path d="M10.5 21.5c2-1.6 3.7-1.6 5.5 0s3.5 1.6 5.5 0" stroke="var(--panel)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Nigeria Water Resources Atlas</h1><div class="sub">Rivers, dams, lakes, wetlands, groundwater and flood watch · 36 states and the FCT</div></div>
    </div>
    <nav class="views" aria-label="Sections">
      <a href="#map" data-v="map">Map</a>
      <a href="#flood" data-v="flood">Flood watch</a>
      <a href="#rain" data-v="rain">Rain &amp; harvesting</a>
      <a href="#basins" data-v="basins">Basins &amp; groundwater</a>
      <a href="#irrig" data-v="irrig">Irrigation &amp; power</a>
      <a href="#stats" data-v="stats">Statistics</a>
      <a href="#visit" data-v="visit">Visit</a>
      <a href="#ngo" data-v="ngo">Community hub</a>
      <a href="#data" data-v="data">Data &amp; sources</a>
    </nav>
  </header>
  <main>
    <section class="view" id="v-map">
      <aside class="rail">
        <div class="filters">
          <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="q" type="search" placeholder="Search name, river, state (e.g. Kainji, Benue)" aria-label="Search the atlas"></label>
          <div><div class="lbl">Show</div><div class="chips" id="cats" style="margin-top:6px"></div></div>
          <div class="row2">
            <div><div class="lbl" style="margin-bottom:4px">State</div><select id="state" aria-label="State"></select></div>
            <div><div class="lbl" style="margin-bottom:4px">River basin</div><select id="basin" aria-label="River basin"></select></div>
          </div>
          <div class="row2">
            <div><div class="lbl" style="margin-bottom:4px">Verification</div><select id="lvl" aria-label="Verification level"><option value="">All levels</option><option value="A">A · documented</option><option value="AB">A–B · sourced</option><option value="D">D · location uncertain</option></select></div>
            <div><div class="lbl" style="margin-bottom:4px">Sort</div><select id="sort" aria-label="Sort"><option value="size">Largest first</option><option value="doc">Best documented</option><option value="year">Newest first</option><option value="name">A–Z</option></select></div>
          </div>
        </div>
        <div class="resbar"><span id="count"></span><button id="reset" class="linkbtn" type="button">Reset filters</button></div>
        <div class="listwrap"><ul class="list" id="list"></ul><button class="btn more" id="more" type="button" hidden>Show more</button></div>
      </aside>
      <div class="mapwrap">
        <div id="map" role="region" aria-label="Map of Nigeria's water resources"></div>
        <div class="maptools">
          <div class="seg" id="base" aria-label="Basemap"></div>
          <div class="seg" id="ovl" aria-label="Layers"></div>
          <div style="display:flex;gap:6px"><button type="button" class="btn sm legbtn" id="laybtn" aria-expanded="false">Layers</button><button type="button" class="btn sm legbtn" id="legbtn">Legend</button></div>
          <div class="note" id="tilenote" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
        <section class="sheet" id="sheet" hidden aria-label="Profile">
          <div class="sheet-h"><div id="sh-head"></div><button class="x" id="close" type="button" aria-label="Close profile">×</button><div class="actions" id="sh-act"></div></div>
          <div class="sheet-b" id="sh-body"></div>
        </section>
      </div>
    </section>
    <section class="view" id="v-flood" hidden><div class="page" id="flood"></div></section>
    <section class="view" id="v-rain" hidden><div class="page" id="rain"></div></section>
    <section class="view" id="v-basins" hidden><div class="page" id="basins"></div></section>
    <section class="view" id="v-irrig" hidden><div class="page" id="irrig"></div></section>
    <section class="view" id="v-stats" hidden><div class="page" id="stats"></div></section>
    <section class="view" id="v-visit" hidden><div class="page" id="visit"></div></section>
    <section class="view" id="v-ngo" hidden><div class="page" id="ngo"></div></section>
    <section class="view" id="v-data" hidden><div class="page prose" id="data"></div></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* Nigeria Water Resources Atlas — app script (built on the Nigeria Forest Reserves Atlas framework) */
const CONFIG={
  issuesRepo:'lordash001/lordash001.github.io',   // GitHub repo that receives field reports and corrections
  siteUrl:'https://shagbaor.com/water-atlas/',
  dataUrl:'data/atlas.json',
  forestUrl:'/forest-atlas/'
};
let DATA=/*DATA*/null;
const GROUPS=['Dams and reservoirs','Dams in the UNICEF list','Lakes and lagoons','Waterfalls and springs','Ramsar wetlands','Rivers','Flood-watch gauges','Basin authorities (HQ)'];
const GOF={0:0,9:0,1:1,2:2,3:2,4:3,5:3,6:4,7:5,8:6,10:7};
const LEVELS={A:'Named record (Global Dam Watch, Wikidata or the Ramsar/WDPA register) backed by a Wikipedia article, photographs or a multi-source profile.',
  B:'Named record from Global Dam Watch, Wikidata, the Ramsar/WDPA register, a Wikipedia article or another published source.',
  C:'Location from satellite-mapped reservoirs or a single listing, with no site-specific profile yet.',
  D:'Listed only in the UNICEF Nigeria dam list. Coordinates are rounded to the nearest minute and may be wrong; treat as provisional.'};
const CITIES={Abuja:[9.0765,7.3986],Lagos:[6.5244,3.3792],Ibadan:[7.3775,3.947],'Port Harcourt':[4.8156,7.0498],Kano:[12.0022,8.592],Enugu:[6.4584,7.5464],Calabar:[4.9757,8.3417],'Benin City':[6.335,5.6037],Jos:[9.8965,8.8583],Kaduna:[10.5105,7.4165],Maiduguri:[11.8311,13.151],Yola:[9.2035,12.4954],Sokoto:[13.0059,5.2476],Ilorin:[8.4966,4.5421],Akure:[7.2571,5.2058],Bauchi:[10.3158,9.8442],Makurdi:[7.7322,8.5391],Lokoja:[7.8023,6.7333]};
const STATUS=[{k:'Normal',d:'Below the wettest 10% of flows for this time of year (1991–2020).'},{k:'Elevated',d:'Among the wettest 10% of flows for this time of year.'},{k:'High',d:'Well above normal: past the midpoint between the 90th percentile and the highest flow recorded for this time of year.'},{k:'Exceptional',d:'Above the highest flow modelled for this time of year in 1991–2020.'}];
const SHAPE=['<circle cx="6" cy="6" r="4.5" fill="currentColor"/>','<path d="M6 1.5 11 10.5H1Z" fill="currentColor"/>','<path d="M6 1 11 6 6 11 1 6Z" fill="currentColor"/>','<path d="M4 1h4l3 3v4l-3 3H4L1 8V4Z" fill="currentColor"/>'];
const fmt=new Intl.NumberFormat('en-GB'),fmt1=new Intl.NumberFormat('en-GB',{maximumFractionDigits:1});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const gcol=g=>css('--g'+g);
const today=new Date().toISOString().slice(0,10);
const imgUrl=(p,w)=>p[5]?`https://upload.wikimedia.org/wikipedia/commons/${p[1]}`:`https://upload.wikimedia.org/wikipedia/commons/thumb/${p[1]}/${w}px-${p[1].split('/').pop()}${/\.(tiff?)$/i.test(p[1])?'.jpg':''}`;
const pageUrl=p=>'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(p[0].replace(/ /g,'_'));
const capOf=p=>p[6]||p[0].replace(/\.\w+$/,'').replace(/_/g,' ').replace(/\s+\(\d+\)$/,'');
const imgTag=(p,w,fb,alt,cls)=>`<img src="${imgUrl(p,w)}" data-alt="${imgUrl(p,fb)}" alt="${esc(alt??capOf(p))}" loading="lazy" ${cls?`class="${cls}"`:''} onerror="if(!this.dataset.f&&this.dataset.alt!==this.src){this.dataset.f=1;this.src=this.dataset.alt}else{this.remove()}">`;
const track=(n,t)=>{try{window.SiteTrack&&window.SiteTrack(n,t)}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('ngwra.'+k)||'null');localStorage.setItem('ngwra.'+k,JSON.stringify(v))}catch(e){return null}}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(_){toast('Select the text and copy it manually')}ta.remove()}}
function km(a,b){const R=6371,dl=(b[0]-a[0])*Math.PI/180,dn=(b[1]-a[1])*Math.PI/180;const x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const statusChip=(s,label)=>s==null?`<span class="status sx">${esc(label||'No reading')}</span>`:`<span class="status s${s}" title="${esc(STATUS[s].d)}"><svg viewBox="0 0 12 12" aria-hidden="true">${SHAPE[s]}</svg>${esc(label||STATUS[s].k)}</span>`;
let LIVE=false, CAP={db:null,user:null,downloads:null};

/* ---------- downloads ---------- */
async function saveFile(name,text,type){
  track('download/'+name,'Downloaded '+name);
  if(CAP.downloads){try{await CAP.downloads.save({filename:name,data:new Blob([text],{type})});return}catch(e){if(e&&e.code==='declined')return;}}
  try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}catch(e){toast('Download is not available here; use the Data page on the hosted site')}
}
function toCSV(rows){if(!rows.length)return'';const k=Object.keys(rows[0]);const q=v=>v==null?'':/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);return[k.join(','),...rows.map(r=>k.map(x=>q(r[x])).join(','))].join('\n')}
const lazy={};
async function loadJSON(name){if(lazy[name])return lazy[name];lazy[name]=fetch('data/'+name).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});return lazy[name]}

/* ---------- boot ---------- */
(async function boot(){
  if(!DATA){try{DATA=await (await fetch(CONFIG.dataUrl)).json()}catch(e){document.body.innerHTML='<p style="padding:24px">The atlas data file (data/atlas.json) could not be loaded. Serve this folder over HTTP (for example GitHub Pages) rather than opening the file directly.</p>';return}}
  try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('https://flood-api.open-meteo.com/v1/flood?latitude=7.8&longitude=6.7&daily=river_discharge&forecast_days=1',{signal:c.signal});LIVE=r.ok}catch(e){LIVE=false}
  init();
  if(window.claude&&window.claude.use){
    claude.use('downloads').then(d=>CAP.downloads=d).catch(()=>{});
    Promise.all([claude.use('db'),claude.use('user')]).then(([db,user])=>{CAP.db=db;CAP.user=user;if(db)startReports()}).catch(()=>{});
  }
})();

let F,STATES,BY={},BASINS=[];
function init(){
  F=DATA.f;STATES=[...new Set(DATA.st.map(s=>s.n))].sort();
  F.forEach(f=>{BY[f.i]=f;f.gp=GOF[f.c];f.pics=f.pics||[];
    if(f.ph||f.photo){const P=f.photo;if(P&&!f.pics.some(q=>q[1]===P.path))f.pics.push([P.file,P.path,P.author,P.license,'cur',!!P.orig,P.caption]);(f.ph||[]).forEach(p=>{if(!f.pics.some(q=>q[1]===p[1]))f.pics.push(p)})}
    f.st=f.s?f.s.split(';').map(x=>x.trim()):[];
    f.size=f.cap!=null?f.cap:f.rlen!=null?f.rlen*10:f.akm!=null?f.akm*5:f.a?f.a/100:f.qmean?f.qmean:0;
    f.txt=[f.n,f.alt,f.s,f.river,f.basin,f.sub,f.city,f.use,f.notes,f.wt&&f.wt.t,f.wdname,f.inv,f.hq,f.fauna].filter(Boolean).join(' ').toLowerCase();});
  BASINS=[...new Set(F.map(f=>f.bn).filter(Boolean))].sort();
  initMap();initFilters();renderLegend();update();
  window.addEventListener('hashchange',route);route();
}

/* ---------- routing ---------- */
const VIEWS=['map','flood','rain','basins','irrig','stats','visit','ngo','data'];const built={};
function route(){
  let h=location.hash.slice(1)||'map';let site=null;
  if(!VIEWS.includes(h)){if(BY[h]){site=BY[h];h='map'}else h='map'}
  VIEWS.forEach(v=>{$('#v-'+v).hidden=v!==h});
  $$('nav.views a').forEach(a=>{if(a.dataset.v===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(h==='map'){setTimeout(()=>map.invalidateSize(),50);if(site)select(site,false)}
  track('view/'+h,'Opened section: '+h);
  if(!built[h]){built[h]=1;({flood:buildFlood,rain:buildRain,basins:buildBasins,irrig:buildIrr,stats:buildStats,visit:buildVisit,ngo:buildNgo,data:buildData}[h]||(()=>{}))()}
}
function goSite(id){location.hash=id}

/* ---------- map ---------- */
let map,canvas,statesLayer,labelLayer,siteLayer,netLayer,lakeLayer,tile=null,ovl={},hiState=null;
const BASES={
  outline:{n:'Outline'},
  map:{n:'Map',u:()=>isDark()?'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}':'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',lab:()=>isDark()?'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}':null,a:'Basemap © Esri, HERE, Garmin, © OpenStreetMap contributors',mz:16},
  sat:{n:'Satellite',u:()=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'Imagery © Esri, Maxar, Earthstar Geographics',mz:18},
  topo:{n:'Terrain',u:()=>'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',a:'© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors',mz:17},
  nasa:{n:'NASA daily',u:()=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${new Date(Date.now()-864e5*2).toISOString().slice(0,10)}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,a:'Imagery: NASA GIBS / VIIRS SNPP corrected reflectance (2 days ago)',mz:9}
};
const isDark=()=>document.documentElement.dataset.theme==='dark'||(document.documentElement.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
const OVERLAYS={
  net:{n:'River network',on:1},
  lakes:{n:'Lakes',on:1},
  roads:{n:'Major roads'},
  basins:{n:'Basins'},
  flood:{n:'Flood risk 2024'},
  glofas:{n:'GloFAS alerts',fl:1},
  geoglows:{n:'High river flows',fl:1},
  gdacs:{n:'GDACS floods',fl:1},
  nimet:{n:'NiMet warnings',fl:1},
  nimetfc:{n:'NiMet 3-day forecast',fl:1},
  hazard:{n:'100-year flood zone',wms:'FloodHazard100y',a:'Flood hazard: Copernicus EMS GloFAS, 100-year return period (JRC)',live:1},
  history:{n:'Past floods',fl:1},

  const me=f;

    $('#gauge-now').innerHTML=`<h3>River flow now <small>GloFAS model via Open-Meteo</small></h3><div class="row" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div><b style="font-family:var(--f-display);font-size:24px">${fmt.format(Math.round(sm.now))} m³/s</b> <span style="color:var(--muted);font-size:12px">on ${new Date(sm.nowDate).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}${sm.ratio?` · ${fmt1.format(sm.ratio)}× the normal for the date`:''}</span></div>${statusChip(sm.s)}</div><p style="margin:6px 0;font-size:12.5px">Forecast peak in the next 45 days: <b>${sm.peak!=null?fmt.format(Math.round(sm.peak))+' m³/s':'–'}</b>${sm.peakDate?` around ${new Date(sm.peakDate).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`:''} ${statusChip(sm.ps,sm.ps!=null?STATUS[sm.ps].k+' (forecast)':'')}</p><div id="qc"></div><p class="loading" style="margin:6px 0 0">Modelled, not measured: use it to see patterns and compare with normal; follow NIHSA and NEMA for official warnings.</p>`;
    qchart($('#qc'),j,g);
    if(g&&g.annual&&g.annual.length){$('#gauge-now').insertAdjacentHTML('afterend',`<div class="box"><h3>Yearly peak flow, ${g.annual[0][0]}–${g.annual[g.annual.length-1][0]} <small>GloFAS reanalysis</small></h3><div id="ann" class="chart"></div></div>`);cols($('#ann'),g.annual.map(a=>({l:String(a[0]),v:a[1],c:a===g.record?'var(--s2)':null})),{f:v=>fmt.format(v)+' m³/s',tf:v=>v>=1000?fmt1.format(v/1000)+'k':fmt.format(v)})}
  }catch(e){$('#gauge-now').innerHTML='<h3>River flow now</h3><p class="loading" style="margin:0">The flow service did not respond. Try again later.</p>'}})();
  if($('#qbox'))(async()=>{try{const j=await flow(f.la,f.lo,60,30);if(state.sel!==me)return;const d=j.daily;const ok=d.river_discharge.some(v=>v!=null&&v>0.5);
    if(!ok){$('#qbox').textContent='No modelled river channel at this point (GloFAS cells are about 5 km wide; small streams are not resolved).';return}
    $('#qbox').innerHTML=`<p style="margin:0 0 6px;font-size:12.5px">Nearest GloFAS model cell (${j.latitude.toFixed(2)}° N, ${j.longitude.toFixed(2)}° E). For reservoirs this may show inflow or the lake itself, not dam releases.</p><div id="qc2"></div>`;qchart($('#qc2'),j,null)}catch(e){$('#qbox').textContent='Flow service unavailable.'}})();
  if(f.la!=null)(async()=>{try{
    const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${f.la}&longitude=${f.lo}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=Africa%2FLagos`);
    if(state.sel!==me)return;const d=j.daily;
    $('#wx').className='wx';$('#wx').innerHTML=d.time.map((t,i)=>`<div><span>${new Date(t).toLocaleDateString('en-GB',{weekday:'short'})}</span><b>${Math.round(d.temperature_2m_max[i])}°</b><span>${Math.round(d.temperature_2m_min[i])}°</span><br><span title="Rainfall">${fmt1.format(d.precipitation_sum[i]??0)} mm</span></div>`).join('');
  }catch(e){$('#wx').textContent='Forecast unavailable.'}})();
  if(f.la!=null&&f.c!==10)(async()=>{try{
    const r=f.c===7?20000:8000;
    const com=await jget(`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${f.la}|${f.lo}&ggsradius=${r}&ggsnamespace=6&ggslimit=14&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=320&format=json&origin=*`);
    if(state.sel!==me||!com.query)return;const have=new Set(f.pics.map(p=>p[0]));
    const pics=Object.values(com.query.pages).filter(p=>p.imageinfo&&/\.(jpe?g|png)$/i.test(p.title)&&!have.has(p.title.slice(5))&&!/ISS0|Earth|map|Map|svg|flag|logo/i.test(p.title)).slice(0,8);
    if(pics.length)$('#photos-live').innerHTML=`<div class="box"><h3>Photos taken nearby <small>Wikimedia Commons, within ${r/1000} km</small></h3><div class="thumbs">${pics.map(p=>{const i=p.imageinfo[0],m=i.extmetadata||{};const by=(m.Artist?m.Artist.value:'').replace(/<[^>]+>/g,'').trim();return`<a href="${esc(i.descriptionurl)}" target="_blank" rel="noopener" title="${esc(by)} · ${esc(m.LicenseShortName?m.LicenseShortName.value:'')}"><img src="${esc(i.thumburl)}" alt="${esc(p.title.slice(5))}" loading="lazy" onerror="this.style.visibility='hidden'">${esc(p.title.slice(5,40).replace(/\.\w+$/,''))}</a>`}).join('')}</div><p style="margin:6px 0 0;font-size:11px;color:var(--muted)">Not checked by the atlas: nearby photos may show other places. Hover for author and licence.</p></div>`;
  }catch(e){}})();
}

/* ---------- charts (shared with the forest atlas) ---------- */
let tipEl=null;
function tip(el,html,x,y){if(!tipEl){tipEl=document.createElement('div');tipEl.className='vtip'}el.appendChild(tipEl);tipEl.innerHTML=html;tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.hidden=false}
function hideTip(){if(tipEl)tipEl.hidden=true}
function hbar(el,rows,o={}){
  const W=560,lw=o.lw||140,rh=o.rh||20,H=rows.length*rh+8,max=Math.max(...rows.map(r=>r.v))||1,iw=W-lw-64;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">${rows.map((r,i)=>{const w=Math.max(1,r.v/max*iw),y=i*rh+4;return`<g data-i="${i}" ${r.on?`style="cursor:pointer"`:''}><rect x="0" y="${y-2}" width="${W}" height="${rh}" fill="transparent"/><text x="${lw-8}" y="${y+rh/2+2}" text-anchor="end" class="lab">${esc(r.l)}</text><rect x="${lw}" y="${y+3}" width="${w}" height="${rh-8}" rx="3" fill="${r.c||'var(--bar)'}"/><text x="${lw+w+5}" y="${y+rh/2+2}">${o.f?o.f(r.v):fmt.format(r.v)}</text></g>`}).join('')}</svg>`;
  el.querySelectorAll('g[data-i]').forEach(g=>{const r=rows[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(r.l)}</b> · ${o.f?o.f(r.v):fmt.format(r.v)}${r.t?'<br>'+r.t:''}`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip;if(r.on)g.onclick=r.on});
}
function cols(el,pts,o={}){
  const W=560,H=220,pl=46,pb=24,pt=10,iw=W-pl-10,ih=H-pb-pt,max=o.max||Math.max(...pts.map(p=>p.v))*1.08||1,bw=iw/pts.length;
  const ticks=niceTicks(0,max,4);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  ticks.forEach(t=>{const y=pt+ih-t/max*ih;s+=`<line class="gridl" x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${o.tf?o.tf(t):fmt.format(t)}</text>`});
  pts.forEach((p,i)=>{const h=p.v/max*ih,x=pl+i*bw;s+=`<g data-i="${i}"><rect x="${x}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/><rect x="${x+bw*.15}" y="${pt+ih-h}" width="${bw*.7}" height="${Math.max(0,h)}" rx="2" fill="${p.c||o.c||'var(--bar)'}"/></g>`;
    if(pts.length<=12||i%Math.ceil(pts.length/8)===0||i===pts.length-1)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(p.l)}</text>`});
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('g[data-i]').forEach(g=>{const p=pts[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(p.l)}</b> · ${o.f?o.f(p.v):fmt.format(p.v)}`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip});
}
function line(el,series,o={}){
  // series: [{name,c,pts:[{x,v}]}] or a single pts array
  if(!series[0]||!series[0].pts)series=[{name:o.name||'',c:'var(--bar)',pts:series}];
  const W=560,H=220,pl=52,pb=24,pt=12,iw=W-pl-16,ih=H-pb-pt;const xs=series.flatMap(s=>s.pts.map(p=>p.x)),x0=Math.min(...xs),x1=Math.max(...xs);
  const lo=o.min??0,hi=o.max??Math.max(...series.flatMap(s=>s.pts.map(p=>p.v)))*1.08;const X=x=>pl+(x-x0)/(x1-x0||1)*iw,Y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  niceTicks(lo,hi,4).forEach(t=>{s+=`<line class="gridl" x1="${pl}" x2="${W-16}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):fmt.format(t)}</text>`});
  const yrs=[...new Set(xs)].sort((a,b)=>a-b);const step=Math.ceil(yrs.length/8);yrs.forEach((x,i)=>{if((i%step===0&&(yrs.length-1-i>=step/2||i===0))||i===yrs.length-1)s+=`<text x="${X(x)}" y="${H-6}" text-anchor="middle">${x}</text>`});
  series.forEach((S,si)=>{const d=S.pts.map((p,i)=>(i?'L':'M')+X(p.x)+' '+Y(p.v)).join(' ');
    if(series.length===1)s+=`<path d="${d} L${X(S.pts[S.pts.length-1].x)} ${Y(lo)} L${X(S.pts[0].x)} ${Y(lo)} Z" fill="${S.c}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${S.c}" stroke-width="2"/>`;
    S.pts.forEach((p,i)=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.v)}" r="${i===S.pts.length-1?4.5:3}" fill="${S.c}" stroke="var(--panel)" stroke-width="1.5" data-s="${si}" data-i="${i}"/>`});
    if(series.length===1||o.endLabels){const l=S.pts[S.pts.length-1];s+=`<text x="${X(l.x)-8}" y="${Y(l.v)-9}" text-anchor="end" class="lab">${o.f?o.f(l.v):fmt.format(l.v)}</text>`}});
  el.innerHTML=s+'</svg>'+(series.length>1?`<div class="qkey">${series.map(S=>`<span><i style="--c:${S.c}"></i>${esc(S.name)}</span>`).join('')}</div>`:'');
  el.querySelectorAll('circle[data-i]').forEach(c=>{const S=series[+c.dataset.s],p=S.pts[+c.dataset.i];c.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${p.x}</b>${series.length>1?' · '+esc(S.name):''} · ${o.f?o.f(p.v):fmt.format(p.v)}`,e.clientX-bb.left,e.clientY-bb.top)};c.onmouseleave=hideTip});
}
function niceTicks(lo,hi,n){const span=hi-lo||1,step0=span/n,mag=10**Math.floor(Math.log10(step0)),st=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const out=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out}
function card(o){
  const id='ch'+Math.random().toString(36).slice(2,8);
  return{html:`<article class="card" id="${id}"><div><h3>${o.t}</h3>${o.s?`<div class="sub">${o.s}</div>`:''}</div><div class="chart"></div><div class="tbl-wrap" hidden></div><div class="foot"><span>Source: ${o.src}</span><span class="acts"><button class="btn sm" data-a="tbl" type="button">Table</button><button class="btn sm" data-a="csv" type="button">CSV</button><button class="btn sm" data-a="cite" type="button">Cite</button></span></div></article>`,
    mount(){const el=$('#'+id);o.draw(el.querySelector('.chart'));const tw=el.querySelector('.tbl-wrap');
      el.querySelector('[data-a=tbl]').onclick=e=>{tw.hidden=!tw.hidden;e.target.textContent=tw.hidden?'Table':'Chart only';if(!tw.innerHTML){const r=o.rows();const k=Object.keys(r[0]||{});tw.innerHTML=`<table class="dt"><thead><tr>${k.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${k.map(c=>`<td class="${typeof x[c]==='number'?'n':''}">${typeof x[c]==='number'?fmt1.format(x[c]):esc(x[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}};
      el.querySelector('[data-a=csv]').onclick=()=>saveFile(o.file+'.csv',toCSV(o.rows()),'text/csv');
      el.querySelector('[data-a=cite]').onclick=()=>copy(`${o.t.replace(/<[^>]+>/g,'')}. ${o.src.replace(/<[^>]+>/g,'')}. In: Nigeria Water Resources Atlas (2026), version ${DATA.meta.version}. ${CONFIG.siteUrl}#${o.page||'stats'} (accessed ${today}).`)}};
}
</script>
<script>
/* ---------- flood watch ---------- */
async function buildFlood(){
  const gs=F.filter(f=>f.c===8);const fl=DATA.fl||{bystate:{}};
  const bys=Object.entries(fl.bystate||{}).map(([s,v])=>({s,...v})).sort((a,b)=>b.High-a.High||b.Medium-a.Medium);
  const totH=bys.reduce((a,b)=>a+b.High,0),totM=bys.reduce((a,b)=>a+b.Medium,0),totL=bys.reduce((a,b)=>a+b.lgas,0);
  $('#flood').innerHTML=`<h2 class="title">River flood watch</h2><p class="lede">Modelled river flow at ${gs.length} points on Nigeria’s main rivers, compared with what is normal for the same time of year, with the next 45 days of forecast. Flood season on the Niger and Benue usually peaks between August and October.</p>
  <div class="callout warn" style="margin-bottom:18px"><b>For awareness, not for decisions.</b> These are GloFAS model estimates (Copernicus Emergency Management Service, served by Open-Meteo), not gauge measurements, and they can miss local flash floods and dam releases. Official warnings come from the <a href="https://nihsa.gov.ng" target="_blank" rel="noopener">Nigeria Hydrological Services Agency</a> (Annual Flood Outlook), <a href="https://nema.gov.ng" target="_blank" rel="noopener">NEMA</a> and state emergency agencies; rainfall outlooks from <a href="https://nimet.gov.ng" target="_blank" rel="noopener">NiMet</a>.</div>
  <div id="fw-host"></div>
  <div id="nm-host"></div>
  <h3 class="sh" style="margin-top:4px">Atlas flow gauges</h3>
  <div class="kpis" id="fkpi"><div class="kpi"><b>…</b><span>gauges loading</span></div></div>
  <div class="filterbar"><div><div class="lbl">Order</div><select id="g-sort"><option value="status">Highest status first</option><option value="river">By river, upstream to downstream</option><option value="ratio">Most above normal</option></select></div></div>
  <div class="ggrid" id="ggrid">${gs.map(f=>`<article class="gcard" data-g="${f.gauge}"><div class="row"><h3>${esc(f.n)}</h3><span class="gs">${statusChip(null,LIVE?'Loading…':'Live on website')}</span></div><div class="meta">Average ${fmt.format(f.qmean||0)} m³/s${f.rec?` · record ${fmt.format(f.rec[1])} m³/s (${f.rec[2].slice(0,4)})`:''}</div><div class="gbody"></div><div class="meta ggl"></div><div class="bt" style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn sm" href="#${f.i}">Open on map</a></div></article>`).join('')}</div>
  ${bys.length?`<h3 class="sh">Flood-risk areas, 2024</h3><p class="lede" style="margin-bottom:12px">${fmt.format(totH)} of ${fmt.format(totL)} local government areas were rated high and ${fmt.format(totM)} medium for flooding (riverine, flash or coastal) in UNICEF Nigeria’s 2024 flood risk analysis. <button class="btn sm" id="show-flood" type="button">Show on the map</button></p><div class="grid2" id="fcards"></div>`:''}
  <div id="fh-host"></div>
  <div id="nm-socn"></div>
  <h3 class="sh" id="ev-old-h">Recent major floods</h3><div class="grid2" id="ev-old">${(DATA.ev||[]).map(e=>`<article class="card"><h3>${e.year}: ${esc(e.title)}</h3><p class="wiki">${esc(e.t)}</p><div class="foot"><span>From <a href="${esc(e.u)}" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA 4.0)</span></div></article>`).join('')}
  ${DATA.wiki&&DATA.wiki['Lagdo Dam']?`<article class="card"><h3>Lagdo Dam, Cameroon</h3><p class="wiki">${esc(DATA.wiki['Lagdo Dam'].t)}</p><div class="foot"><span>From <a href="${esc(DATA.wiki['Lagdo Dam'].u)}" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA 4.0). Watch the “Benue at the Cameroon border” gauge for its effect.</span></div></article>`:''}</div>
  <div id="nm-ew4"></div>
  ${floodDashboards()}
  <h3 class="sh">How the status is worked out</h3><ul class="prose" style="padding-left:18px;max-width:80ch">${STATUS.map((s,i)=>`<li>${statusChip(i)} ${esc(s.d)}</li>`).join('')}<li>Normal ranges come from 30 years (1991–2020) of daily GloFAS reanalysis at each point, using a 15-day window around each date. The forecast is the median of the GloFAS ensemble.</li><li>Each point is snapped to the 5 km model cell with the most flow nearby so it sits on the main channel.</li></ul>`;
  addFloodRain();addFloodLive();addFloodHistory();addNimet();
  if($('#show-flood'))$('#show-flood').onclick=()=>{location.hash='map';setTimeout(()=>{if(!ovl.flood)toggleOverlay('flood')},120)};
  if(bys.length){const top=bys.filter(b=>b.High).slice(0,20);const c1=card({t:'States with the most high flood-risk LGAs, 2024',s:'Number of LGAs rated high overall (riverine, flash or coastal).',src:esc(fl.src),file:'flood_risk_lgas_by_state_2024',page:'flood',
      draw:el=>hbar(el,top.map(b=>({l:b.s,v:b.High,c:'var(--s2)',t:`${b.Medium} medium · ${b.lgas} LGAs in total`,on:()=>{location.hash='map';setTimeout(()=>{state.st=b.s;$('#state').value=b.s;update();zoomState(b.s);if(!ovl.flood)toggleOverlay('flood')},120)}})),{rh:17}),
      rows:()=>bys.map(b=>({state:b.s,lgas:b.lgas,high:b.High,medium:b.Medium,low:b.Low,riverine_high:b.riv_high,flash_high:b.flash_high,coastal_high:b.coast_high}))});
    const types=[['Riverine','riv_high'],['Flash','flash_high'],['Coastal','coast_high']].map(([l,k])=>({l,v:bys.reduce((a,b)=>a+b[k],0)}));
    const c2=card({t:'What kind of flooding, 2024',s:'LGAs rated high for each flood type (an LGA can be high for more than one).',src:esc(fl.src),file:'flood_types_2024',page:'flood',draw:el=>hbar(el,types.map(t=>({...t,c:'var(--s2)'})),{lw:90}),rows:()=>types.map(t=>({flood_type:t.l,lgas_high:t.v}))});
    $('#fcards').innerHTML=c1.html+c2.html;c1.mount();c2.mount()}
  $('#g-sort').onchange=sortGauges;
  if(!LIVE){$('#fkpi').innerHTML=`<div class="kpi"><b>${gs.length}</b><span>flood-watch points</span><small>Live readings load on the website</small></div><div class="kpi"><b>${fmt.format(totH)}</b><span>LGAs at high flood risk (2024)</span><small>UNICEF Nigeria analysis</small></div>`;return}
  try{
    const G=await gaugeData();const res={};
    await Promise.all(gs.map(async f=>{try{const j=await flow(f.la,f.lo,30,45);const g=G[f.gauge];const sm=gaugeSummary(j,g);res[f.gauge]=sm;
      const el=$(`.gcard[data-g="${f.gauge}"]`);if(!el)return;el.dataset.s=sm.s??-1;el.dataset.r=sm.ratio||0;
      el.querySelector('.gs').innerHTML=statusChip(sm.s);
      el.querySelector('.gbody').innerHTML=`<div class="row"><span class="num">${fmt.format(Math.round(sm.now))} <small>m³/s on ${new Date(sm.nowDate).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</small></span><span class="meta">${sm.ratio?fmt1.format(sm.ratio)+'× normal':''}</span></div><div class="meta">Forecast peak ${sm.peak!=null?fmt.format(Math.round(sm.peak))+' m³/s':'–'}${sm.peakDate?' around '+new Date(sm.peakDate).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''} ${sm.ps!=null&&sm.ps>0?statusChip(sm.ps,STATUS[sm.ps].k+' expected'):''}</div><div class="qc"></div>`;
      qchart(el.querySelector('.qc'),j,g,{h:150,max:false});
    }catch(e){const el=$(`.gcard[data-g="${f.gauge}"]`);if(el)el.querySelector('.gs').innerHTML=statusChip(null,'No reading')}}));
    const cnt=[0,0,0,0];let fut=0;Object.values(res).forEach(r=>{if(r.s!=null)cnt[r.s]++;if(r.ps!=null&&r.ps>=1)fut++});
    $('#fkpi').innerHTML=STATUS.map((s,i)=>`<div class="kpi"><b>${cnt[i]}</b><span>${statusChip(i)}</span><small>points now</small></div>`).join('')+`<div class="kpi"><b>${fut}</b><span>points forecast to reach Elevated or higher</span><small>next 45 days</small></div>`;
    sortGauges();track('flood-watch','Viewed flood watch');
  }catch(e){$('#fkpi').innerHTML='<div class="kpi"><b>–</b><span>Flow service unavailable; try again later</span></div>'}
}
const UPDOWN=['niger-border','niger-jebba','kaduna-kaduna','niger-baro','benue-border','benue-yola','benue-numan','benue-ibi','katsinaala-town','benue-makurdi','niger-lokoja','anambra-otuocha','niger-onitsha','niger-aboh','rima-sokoto','hadejia-hadejia','yobe-gashua','gongola-dadinkowa','cross-ikom','ogun-abeokuta'];
function sortGauges(){const g=$('#ggrid');if(!g)return;const m=$('#g-sort').value;const cards=[...g.children];
  cards.sort((a,b)=>m==='river'?UPDOWN.indexOf(a.dataset.g)-UPDOWN.indexOf(b.dataset.g):m==='ratio'?(+b.dataset.r||0)-(+a.dataset.r||0):((+b.dataset.s||-1)-(+a.dataset.s||-1))||((+b.dataset.r||0)-(+a.dataset.r||0)));cards.forEach(c=>g.appendChild(c))}

/* ---------- basins & groundwater ---------- */
function buildBasins(){
  const HA=DATA.ha||[],N=DATA.nwrmp||{national:[]};
  const pp=HA.map(h=>({...h,pc:Math.round(h.tot_int*1e9/(h.pop2020*1000))}));
  const cards=[];
  cards.push(card({t:'Renewable water by hydrological area',s:'Billion m³ per year generated inside Nigeria; the lighter tooltip figure includes inflow from neighbouring countries.',src:`<a href="${esc(N.url)}" target="_blank" rel="noopener">National Water Resources Master Plan 2013</a>, Table 14`,file:'renewable_water_by_HA',page:'basins',
    draw:el=>hbar(el,HA.map(h=>({l:h.id+' '+h.name,v:h.tot_int,t:`${fmt1.format(h.tot)} incl. inflow · surface water ${fmt1.format(h.sw_int)}`})),{lw:170,f:v=>fmt1.format(v)+' bn m³'}),rows:()=>HA.map(h=>({area:h.id+' '+h.name,total_incl_inflow_bcm:h.tot,total_internal_bcm:h.tot_int,surface_incl_inflow_bcm:h.sw,surface_internal_bcm:h.sw_int}))}));
  cards.push(card({t:'Groundwater recharge by hydrological area',s:'Millimetres of rain that soak through to aquifers each year. The Lake Chad area gets 24 mm a year; the Niger South area nearly 600.',src:`<a href="${esc(N.url)}" target="_blank" rel="noopener">National Water Resources Master Plan 2013</a>, Table 14`,file:'groundwater_recharge_by_HA',page:'basins',
    draw:el=>hbar(el,HA.map(h=>({l:h.id+' '+h.name,v:h.gwr})),{lw:170,f:v=>fmt.format(v)+' mm/yr'}),rows:()=>HA.map(h=>({area:h.id+' '+h.name,recharge_mm_per_year:h.gwr}))}));
  cards.push(card({t:'Water generated per person, 2020',s:'Internal renewable water divided by projected 2020 population. Below 1,700 m³ per person a year is commonly called water stress; below 1,000, scarcity.',src:'Calculated from the Master Plan 2013, Tables 6 and 14',file:'water_per_person_by_HA',page:'basins',
    draw:el=>hbar(el,[...pp].sort((a,b)=>a.pc-b.pc).map(h=>({l:h.id+' '+h.name,v:h.pc,c:h.pc<1000?'var(--s2)':h.pc<1700?'var(--s1)':'var(--bar)',t:h.pc<1000?'scarcity threshold':h.pc<1700?'stress threshold':''})),{lw:170,f:v=>fmt.format(v)+' m³'}),rows:()=>pp.map(h=>({area:h.id+' '+h.name,internal_bcm:h.tot_int,population_2020_thousand:h.pop2020,m3_per_person:h.pc}))}));
  cards.push(card({t:'Population by hydrological area, 2020 and 2030',s:'Thousands of people (Master Plan projections).',src:`<a href="${esc(N.url)}" target="_blank" rel="noopener">National Water Resources Master Plan 2013</a>, Table 6`,file:'population_by_HA',page:'basins',
    draw:el=>hbar(el,HA.map(h=>({l:h.id+' '+h.name,v:h.pop2030,t:`2020: ${fmt.format(h.pop2020)} k`})),{lw:170,f:v=>fmt.format(v)+' k (2030)'}),rows:()=>HA.map(h=>({area:h.id+' '+h.name,pop_2020_thousand:h.pop2020,pop_2030_thousand:h.pop2030}))}));
  const rb=F.filter(f=>f.c===10);
  $('#basins').innerHTML=`<h2 class="title">River basins and groundwater</h2><p class="lede">How Nigeria’s water is organised: eight hydrological areas used for national planning, twelve River Basin Development Authorities that build and run dams and irrigation, and the aquifers that supply most drinking water.</p>
  <div class="kpis">${(N.national||[]).slice(0,6).map(x=>`<div class="kpi"><b>${fmt1.format(x.value)}</b><span>${esc(x.unit)} · ${esc(x.label)}</span><small>Master Plan 2013</small></div>`).join('')}</div>
  <h3 class="sh" style="margin-top:8px">Eight hydrological areas</h3><p class="lede" style="margin-bottom:12px">${esc(DATA.ha_note||'')} <button class="btn sm" id="show-bas" type="button">Show river basins on the map</button></p>
  <div class="ha-grid">${HA.map(h=>`<div class="ha"><div class="id">${h.id}</div><h4>${esc(h.name)}</h4><p>${esc(h.rivers)}</p><div class="kv"><div><b>${fmt1.format(h.tot_int)}</b><span>bn m³/yr internal</span></div><div><b>${fmt.format(h.gwr)}</b><span>mm/yr recharge</span></div><div><b>${fmt1.format(h.pop2020/1000)} M</b><span>people, 2020</span></div><div><b>${fmt.format(Math.round(h.tot_int*1e9/(h.pop2020*1000)))}</b><span>m³ per person</span></div></div></div>`).join('')}</div>
  <div class="grid2" style="margin-top:18px">${cards.map(c=>c.html).join('')}</div>
  <h3 class="sh">River Basin Development Authorities</h3><p class="lede" style="margin-bottom:12px">Federal agencies under the Ministry of Water Resources and Sanitation that develop dams, irrigation schemes and water supply in their basins. Source: <a href="${esc(DATA.rbda_src.url)}" target="_blank" rel="noopener">${esc(DATA.rbda_src.label)}</a>.</p>
  <div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Authority</th><th>Headquarters</th><th>Area of operation</th><th class="n">Dams in this atlas within 150 km of HQ</th></tr></thead><tbody>${rb.map(f=>`<tr class="click" data-id="${f.i}"><td>${esc(f.n)}</td><td>${esc(f.hq)}</td><td>${esc((f.notes||'').replace(/^Headquarters: [^.]+\. Area of operation: /,''))}</td><td class="n">${F.filter(d=>d.c===0&&km([d.la,d.lo],[f.la,f.lo])<150).length}</td></tr>`).join('')}</tbody></table></div>
  <h3 class="sh">Groundwater</h3><p class="lede" style="margin-bottom:12px">Most Nigerians drink groundwater from boreholes and wells. What a borehole yields depends on the rock beneath it. Source: <a href="${esc(DATA.gw_src.url)}" target="_blank" rel="noopener">${esc(DATA.gw_src.label)}</a>.</p>
  <div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Aquifer setting</th><th>Where</th><th>What to expect</th></tr></thead><tbody>${(DATA.gw||[]).map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.where)}</td><td>${esc(g.aquifer)}</td></tr>`).join('')}</tbody></table></div>
  <div class="tbl-wrap" style="max-height:none;margin-top:12px"><table class="dt"><thead><tr><th>Fact</th><th>Value</th><th>Source</th></tr></thead><tbody>${(DATA.gw_facts||[]).map(g=>`<tr><td>${esc(g.label)}</td><td>${esc(g.value)}</td><td>${esc(g.src)}</td></tr>`).join('')}</tbody></table></div>
  <h3 class="sh">National water figures</h3><div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Indicator</th><th class="n">Value</th><th>Unit</th></tr></thead><tbody>${(N.national||[]).map(x=>`<tr><td>${esc(x.label)}</td><td class="n">${fmt1.format(x.value)}</td><td>${esc(x.unit)}</td></tr>`).join('')}</tbody></table></div><p style="font-size:12.5px;color:var(--muted)">${esc(N.title)}, ${esc(N.by)}, ${esc(N.date)}. <a href="${esc(N.url)}" target="_blank" rel="noopener">Read the report ↗</a>. The report gives demand figures from different tables that cover different sectors; they are shown as published.</p>
  <div id="basin-reports"></div>
  <h3 class="sh">Who manages water</h3><div class="commit">${(DATA.ag||[]).map(a=>`<div><b><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></b><span>${esc(a.role)}</span></div>`).join('')}</div>`;
  cards.forEach(c=>c.mount());
  $$('#basins tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  $('#show-bas').onclick=()=>{location.hash='map';setTimeout(()=>{if(!ovl.basins)toggleOverlay('basins')},120)};
  addBasinReports();
}
</script>
<script>
/* ---------- rainfall: shared helpers ---------- */
const RAMP={seqL:['#e8f1fa','#c4dcf2','#93bfe6','#5c9bd6','#2f73bb','#174f8f'],seqD:['#1c2b3a','#1f4568','#245f98','#2f7fcb','#5aa2e6','#a6cdf3'],
  divL:['#8c510a','#bf812d','#dfc27d','#e4e4e4','#80cdc1','#35978f','#01665e'],divD:['#a6611a','#c99447','#8a7a50','#3d4246','#4f8f87','#2fa396','#7fd3c6']};
const seqC=()=>isDark()?RAMP.seqD:RAMP.seqL,divC=()=>isDark()?RAMP.divD:RAMP.divL;
function binIdx(v,breaks){let i=0;while(i<breaks.length&&v>=breaks[i])i++;return i}
const DIV_BREAKS=[-50,-25,-10,10,25,50];  // % of normal anomaly
function stateMap(el,vals,o){
  const W=560,H=440,S=DATA.st,cos=Math.cos(9*Math.PI/180),k=Math.min(W/((14.7-2.6)*cos),H/(13.95-4.2));
  const X=lo=>(lo-2.6)*cos*k,Y=la=>(13.95-la)*k;
  const path=s=>{const polys=s.t==='Polygon'?[s.g]:s.g;return polys.map(p=>p.map(r=>'M'+r.map(c=>X(c[0]).toFixed(1)+','+Y(c[1]).toFixed(1)).join('L')+'Z').join('')).join('')};
  const col=v=>{if(v==null||isNaN(v))return 'var(--chip)';if(o.div){return divC()[binIdx(v,DIV_BREAKS)]}const c=seqC();return c[binIdx(v,o.breaks)]};
  let s=`<svg viewBox="0 0 ${W} ${H}" class="smap" role="img" aria-label="${esc(o.title||'Map of states')}">`;
  S.forEach((st,i)=>{s+=`<path d="${path(st)}" fill="${col(vals[st.n])}" stroke="var(--panel)" stroke-width="1" data-i="${i}" style="cursor:pointer"/>`});
  s+='</svg>';
  const keys=o.div?['< −50%','−50 to −25%','−25 to −10%','near normal','+10 to +25%','+25 to +50%','> +50%'].map((l,i)=>[divC()[i],l]):seqC().map((c,i)=>[c,i===0?`< ${o.f(o.breaks[0])}`:i===o.breaks.length?`≥ ${o.f(o.breaks[i-1])}`:`${o.f(o.breaks[i-1])}–${o.f(o.breaks[i])}`]);
  el.className='chart';el.innerHTML=s+`<div class="qkey" style="margin-top:6px">${keys.map(([c,l])=>`<span><i class="band" style="--c:${c};opacity:1"></i>${l}</span>`).join('')}<span><i class="band" style="--c:var(--chip);opacity:1"></i>no data</span></div>`;
  el.querySelectorAll('path').forEach(p=>{const st=S[+p.dataset.i];p.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(st.n)}</b><br>${vals[st.n]==null?'no data':o.tip?o.tip(st.n,vals[st.n]):o.f(vals[st.n])}`,e.clientX-bb.left,e.clientY-bb.top)};p.onmouseleave=hideTip;
    p.onclick=()=>{location.hash='map';setTimeout(()=>{state.st=st.n;$('#state').value=st.n;update();zoomState(st.n)},100)}});
}
const DIM=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
function normalFor(stn,dates){const R=(DATA.rain||{}).states||[];const r=R.find(x=>x.n===stn);if(!r)return null;return dates.reduce((a,d)=>{const y=+d.slice(0,4),m=+d.slice(5,7);return a+r.normal[m-1]/DIM(y,m)},0)}
let RAINLIVE=null;
async function rainLive(){
  if(RAINLIVE)return RAINLIVE;
  const S=DATA.st;const lat=S.map(s=>s.c[1].toFixed(3)).join(','),lon=S.map(s=>s.c[0].toFixed(3)).join(',');
  RAINLIVE=(async()=>{const j=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_sum,precipitation_probability_max&past_days=31&forecast_days=16&timezone=Africa%2FLagos`);
    const arr=Array.isArray(j)?j:[j];const out={};arr.forEach((r,i)=>{out[S[i].n]=r.daily});return out})();
  return RAINLIVE;
}
function sumDays(d,from,to){let s=0,n=0;d.time.forEach((t,i)=>{if(t>=from&&t<=to&&d.precipitation_sum[i]!=null){s+=d.precipitation_sum[i];n++}});return n?s:null}
const addDays=(s,n)=>new Date(Date.parse(s+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
function rainWindows(){const t=today;return{p7:[addDays(t,-7),addDays(t,-1)],p30:[addDays(t,-30),addDays(t,-1)],n3:[t,addDays(t,2)],n7:[t,addDays(t,6)],n16:[t,addDays(t,15)]}}
function datesIn(a,b){const out=[];for(let d=a;d<=b;d=addDays(d,1))out.push(d);return out}
async function seasonalLive(){const S=DATA.st;const lat=S.map(s=>s.c[1].toFixed(3)).join(','),lon=S.map(s=>s.c[0].toFixed(3)).join(',');
  const j=await jget(`https://seasonal-api.open-meteo.com/v1/seasonal?latitude=${lat}&longitude=${lon}&monthly=precipitation_mean,precipitation_anomaly`);const arr=Array.isArray(j)?j:[j];const out={};arr.forEach((r,i)=>out[S[i].n]=r.monthly);return out}

/* ---------- flood page: rain panel ---------- */
async function addFloodRain(){
  const host=$('#fkpi');if(!host)return;
  host.insertAdjacentHTML('afterend',`<div class="grid2" style="margin-bottom:18px"><article class="card"><h3>Rain expected in the next 3 days</h3><div class="sub">Millimetres, by state (model forecast at each state’s centre). Heavy rain on saturated ground is what turns into flash floods.</div><div id="fr-map" class="loading">${LIVE?'Loading forecast…':'Live forecasts load on the website.'}</div><div class="foot"><span>Source: Open-Meteo best-match forecast (ECMWF IFS, DWD ICON, NOAA GFS)</span><span class="acts"><a class="btn sm" href="#rain">Rain page</a></span></div></article>
  <article class="card"><h3>Heavy-rain watch</h3><div class="sub">States where the forecast for the next 3 days exceeds 50 mm, or the next 7 days is more than one and a half times the normal for the time of year.</div><div id="fr-watch" class="loading">${LIVE?'Loading…':'Live forecasts load on the website.'}</div><div class="foot"><span>Satellite views: <button class="btn sm" id="fr-sat" type="button">Flood water seen from space (NASA)</button> <button class="btn sm" id="fr-imerg" type="button">Rain yesterday</button></span></div></article></div>`);
  $('#fr-sat').onclick=()=>{location.hash='map';setTimeout(()=>{if(!ovl.satflood)toggleOverlay('satflood');if(LIVE&&(!tile||tile._key!=='sat'))setBase('sat')},150)};
  $('#fr-imerg').onclick=()=>{location.hash='map';setTimeout(()=>{if(!ovl.imerg)toggleOverlay('imerg')},150)};
  if(!LIVE)return;
  try{const L=await rainLive();const w=rainWindows();const n3={},rows=[];
    Object.entries(L).forEach(([s,d])=>{n3[s]=sumDays(d,...w.n3);const n7=sumDays(d,...w.n7),nn7=normalFor(s,datesIn(...w.n7));const r=nn7?n7/nn7:null;if((n3[s]||0)>=50||(r&&r>=1.5&&n7>=20))rows.push({s,n3:n3[s],n7,r})});
    stateMap($('#fr-map'),n3,{breaks:[5,15,30,50,80],f:v=>fmt.format(Math.round(v))+' mm',title:'Rain forecast for the next 3 days by state'});
    rows.sort((a,b)=>b.n3-a.n3);
    $('#fr-watch').className='';$('#fr-watch').innerHTML=rows.length?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>State</th><th class="n">Next 3 days</th><th class="n">Next 7 days</th><th class="n">vs normal</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.s)}</td><td class="n">${fmt.format(Math.round(r.n3))} mm</td><td class="n">${fmt.format(Math.round(r.n7))} mm</td><td class="n">${r.r?fmt1.format(r.r)+'×':'–'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="loading" style="margin:0">No state passes either threshold in the current forecast.</p>';
  }catch(e){$('#fr-map').textContent='The forecast service did not respond. Try again later.'}
}

/* ---------- rain & harvesting view ---------- */
function harvestDefaults(){const nat=(DATA.dhs||{}).nat||{};const hh=nat.HC_MEMB_H_MNM&&Object.values(nat.HC_MEMB_H_MNM).sort((a,b)=>b[0]-a[0])[0];const rw=nat.WS_SRCE_P_RNW&&Object.values(nat.WS_SRCE_P_RNW).sort((a,b)=>b[0]-a[0])[0];const pop=wbS('SP.POP.TOTL');
  return{hh:hh?hh[1]:4.8,hhYr:hh?hh[0]:null,rw:rw?rw[1]:null,rwYr:rw?rw[0]:null,pop:pop?pop.data[pop.data.length-1][1]:null,popYr:pop?pop.data[pop.data.length-1][0]:null}}
async function buildRain(){
  const R=DATA.rain;
  if(!R){$('#rain').innerHTML='<h2 class="title">Rainfall and rainwater harvesting</h2><p class="lede">Rainfall records are being prepared and will appear after the next data refresh.</p>';return}
  const nat=R.nat,avg=nat.ann;const D=harvestDefaults();
  const cru=R.cru||[],era=R.era5||[];const cruN=cru.length?Math.round(cru.filter(a=>a[0]>=1991&&a[0]<=2020).reduce((a,b)=>a+b[1],0)/30):null;const last=cru.length?cru[cru.length-1]:null;
  const cards=[];
  if(cru.length)cards.push(card({t:`Annual rainfall across Nigeria, ${cru[0][0]}–${last[0]}`,s:`National average, mm per year, from rain-gauge records (CRU TS) and the ERA5 reanalysis. The 1991–2020 gauge normal is ${fmt.format(cruN)} mm. The dry 1970s–80s Sahel drought shows clearly.`,src:esc(R.cckp_src||'World Bank CCKP'),file:'nigeria_annual_rainfall',page:'rain',
    draw:el=>line(el,[{name:'Rain gauges (CRU TS)',c:'var(--bar)',pts:cru.map(a=>({x:a[0],v:a[1]}))},{name:'Reanalysis (ERA5)',c:'var(--g1)',pts:era.map(a=>({x:a[0],v:a[1]}))}],{min:600,f:v=>fmt.format(v)+' mm',tf:v=>fmt.format(v)}),rows:()=>cru.map(a=>({year:a[0],cru_ts_mm:a[1],era5_mm:(era.find(e=>e[0]===a[0])||[])[1]??''}))}));
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  cards.push(card({t:'The rainy season, month by month',s:'National average rainfall per month, 1991–2020 normal (mm). The south gets rain from March; the far north mainly from June to September.',src:esc(R.src),file:'nigeria_monthly_rainfall_normal',page:'rain',draw:el=>cols(el,nat.normal.map((v,i)=>({l:MN[i],v})),{f:v=>fmt.format(Math.round(v))+' mm'}),rows:()=>nat.normal.map((v,i)=>({month:MN[i],normal_mm:v}))}));
  const sn=[...R.states].sort((a,b)=>b.ann-a.ann);
  cards.push(card({t:'Normal annual rainfall by state',s:'mm per year, 1991–2020. Click a bar to open the state on the map.',src:esc(R.src),file:'rainfall_normal_by_state',page:'rain',draw:el=>hbar(el,sn.map(r=>({l:r.n,v:r.ann,t:`${r.pts} sample points`,on:()=>{location.hash='map';setTimeout(()=>{state.st=r.n;$('#state').value=r.n;update();zoomState(r.n)},80)}})),{rh:17,f:v=>fmt.format(v)+' mm'}),rows:()=>sn.map(r=>({state:r.n,normal_annual_mm:r.ann,...Object.fromEntries(r.normal.map((v,i)=>[MN[i].toLowerCase()+'_mm',v]))}))}));
  $('#rain').innerHTML=`<h2 class="title">Rainfall and rainwater harvesting</h2><p class="lede">How much rain falls where and when, what the next weeks and months look like, and how much of it could be caught from roofs. Long-term records come from rain-gauge archives (CRU TS), the ERA5 reanalysis and NASA POWER; forecasts from open weather models via Open-Meteo, and seasonal outlooks from ECMWF SEAS5.</p>
  <div class="kpis" id="rkpi"><div class="kpi"><b>${fmt.format(avg)} mm</b><span>normal annual rainfall (1991–2020, national average)</span><small>NASA POWER</small></div><div class="kpi"><b>${fmt.format(Math.round(nat.pvol_km3))} km³</b><span>of rain falls on Nigeria in a normal year</span><small>Calculated: rainfall × state areas</small></div>${last?`<div class="kpi"><b>${last[1]>=cruN?'+':''}${fmt.format(Math.round((last[1]/cruN-1)*100))}%</b><span>rainfall in ${last[0]} compared with the 1991–2020 normal</span><small>CRU TS rain-gauge record</small></div>`:''}<div class="kpi" id="k30"><b>…</b><span>last 30 days compared with normal</span><small>${LIVE?'Loading':'Live on the website'}</small></div></div>
  <h3 class="sh" style="margin-top:4px">Now and the next 16 days</h3>
  <div class="filterbar"><div><div class="lbl">Show</div><select id="rv"><option value="p7">Last 7 days (mm)</option><option value="p30a">Last 30 days vs normal</option><option value="n7" selected>Next 7 days (mm)</option><option value="n16">Next 16 days (mm)</option><option value="n16a">Next 16 days vs normal</option></select></div></div>
  <div class="grid2"><article class="card"><h3 id="rv-t">Rain forecast</h3><div class="sub" id="rv-s"></div><div id="rv-map" class="loading">${LIVE?'Loading…':'Live rainfall loads on the website.'}</div><div class="foot"><span>Source: Open-Meteo (ECMWF IFS, DWD ICON, NOAA GFS and others; recent days are model analyses, not rain-gauge readings). Normals: NASA POWER 1991–2020.</span><span class="acts"><button class="btn sm" id="rv-csv" type="button">CSV</button></span></div></article>
   <article class="card"><h3>Season ahead</h3><div class="sub">ECMWF SEAS5 monthly outlook: expected rainfall compared with the model’s own long-term average, national average of state centres.</div><div id="seas" class="loading">${LIVE?'Loading the seasonal outlook…':'The seasonal outlook loads on the website.'}</div><div class="foot"><span>Source: ECMWF SEAS5 via Open-Meteo Seasonal API. Seasonal outlooks show tendencies, not day-to-day weather.</span></div></article></div>
  <div id="nm-rain"></div>
  <h3 class="sh">Rainfall records</h3><div class="grid2">${cards.map(c=>c.html).join('')}</div>
  <h3 class="sh">Rainwater harvesting potential</h3><p class="lede" style="margin-bottom:12px">Every 1 mm of rain on 1 m² of roof gives 1 litre of water, less what splashes, evaporates or is flushed away. Change the assumptions to see what roofs could supply in each state.</p>
  <div class="card" style="margin-bottom:18px"><div class="filterbar" style="margin:0"><div><div class="lbl">Roof area per household (m²)</div><input type="number" id="h-roof" value="60" min="5" max="1000"></div>
   <div><div class="lbl">Roof type</div><select id="h-c"><option value="0.85">Metal or zinc sheets (0.85)</option><option value="0.75">Tiles or asbestos (0.75)</option><option value="0.6">Concrete or flat (0.6)</option><option value="0.2">Thatch (0.2)</option></select></div>
   <div><div class="lbl">People per household</div><input type="number" id="h-hh" value="${D.hh}" min="1" max="30" step="0.1"></div>
   <div><div class="lbl">Litres per person per day</div><input type="number" id="h-l" value="50" min="5" max="300"></div>
   <div><div class="lbl">Households that could harvest (%)</div><input type="number" id="h-share" value="50" min="0" max="100"></div></div>
   <p class="loading" style="margin:6px 0 0">People per household: Nigeria DHS ${D.hhYr||''} average. 50 litres per person a day covers drinking, cooking and basic hygiene. Losses: the roof-type factor; first-flush diversion and tank overflow are not included.</p></div>
  <div class="kpis" id="hkpi"></div><div class="grid2" id="hcards"></div>
  <h3 class="sh">Where Nigeria’s rain goes</h3><p class="lede" style="margin-bottom:12px">A national water balance for a normal year, putting the rain that falls next to what is stored, used and lost. Volumes in cubic kilometres (1 km³ = 1 billion m³).</p><div class="grid2" id="wbal"></div>`;

  const mg=sdgS('EN_WBE_MANGN');if(mg)facts.push(['Mangroves, '+mg.data[mg.data.length-1][0],fmt.format(Math.round(mg.data[mg.data.length-1][1]))+' km²','SDG 6.6.1, Global Mangrove Watch']);
  const we=sdgS('ER_H2O_WUEYST','Activity=TOTAL');if(we)facts.push(['Water-use efficiency, '+we.data[we.data.length-1][0],'US$ '+fmt1.format(we.data[we.data.length-1][1])+' per m³','SDG 6.4.1, FAO']);
  const all=k=>cards[k].map(c=>c.html).join('');
  host.innerHTML=`${cards.sup.length?`<h3 class="sh">Drinking water and municipal supply</h3><div class="grid2">${all('sup')}</div>`:''}
   ${cards.ww.length?`<h3 class="sh">Wastewater and sanitation</h3><div class="grid2">${all('ww')}</div>`:''}
   ${cards.sw.length||facts.length?`<h3 class="sh">Surface water, wetlands and water stress</h3><div class="grid2">${all('sw')}</div>${facts.length?`<div class="tbl-wrap" style="max-height:none;margin-top:14px"><table class="dt"><thead><tr><th>Indicator</th><th class="n">Latest</th><th>Source</th></tr></thead><tbody>${facts.map(f=>`<tr><td>${esc(f[0])}</td><td class="n">${esc(f[1])}</td><td>${esc(f[2])}</td></tr>`).join('')}</tbody></table></div>`:''}`:''}`;
  Object.values(cards).flat().forEach(c=>c.mount());
}
</script>
<script>
/* ---------- statistics ---------- */
function wbS(id){const s=(DATA.wb||{})[id];return s&&s.data&&s.data.length?s:null}
function dhsSub(ind,sv){const S=(DATA.dhs||{}).sub||{};const id=sv||(S.NG2024DHS?'NG2024DHS':'NG2018DHS');const st=S[id]||{};return{id,yr:id.slice(2,6),rows:Object.entries(st).filter(([s,v])=>v[ind]!=null).map(([s,v])=>({s,v:v[ind]}))}}
const DHS_SRC=id=>`<a href="https://dhsprogram.com/Countries/Country-Main.cfm?ctry_id=30&c=Nigeria" target="_blank" rel="noopener">Nigeria DHS ${id==='NG2024DHS'?'2023–24':'2018'}</a> via the DHS Program API`;
function buildStats(){
  const dams=F.filter(f=>f.c===0),gdw=dams.filter(f=>f.gdw),cap=gdw.reduce((a,f)=>a+(f.cap||0),0),mw=dams.reduce((a,f)=>a+(f.mw||0),0);
  const last=s=>s.data[s.data.length-1];
  const bw=wbS('SH.H2O.BASW.ZS'),sm=wbS('SH.H2O.SMDW.ZS'),bs=wbS('SH.STA.BASS.ZS'),od=wbS('SH.STA.ODFC.ZS'),intr=wbS('ER.H2O.INTR.K3'),pc=wbS('ER.H2O.INTR.PC'),wd=wbS('ER.H2O.FWTL.K3'),stress=wbS('ER.H2O.FWST.ZS');
  const kp=[[fmt.format(gdw.length),'dams and reservoirs mapped by Global Dam Watch','GDW v1.0'],[fmt1.format(cap/1000)+' bn m³','total reservoir storage capacity','Sum of GDW capacities'],
    [fmt.format(F.filter(f=>f.c===1).length),'more dams listed only by UNICEF Nigeria','Location uncertain'],
    [fmt.format(F.filter(f=>[2,3,4,5].includes(f.c)).length),'lakes, lagoons, waterfalls and springs','Wikidata and Wikipedia'],
    bw?[fmt1.format(last(bw)[1])+'%','of Nigerians with at least basic drinking water',`WHO/UNICEF JMP · ${last(bw)[0]}`]:null,
    sm?[fmt1.format(last(sm)[1])+'%','with safely managed drinking water',`WHO/UNICEF JMP · ${last(sm)[0]}`]:null,
    pc?[fmt.format(Math.round(last(pc)[1]))+' m³','renewable internal freshwater per person',`FAO AQUASTAT via World Bank · ${last(pc)[0]}`]:null,
    (()=>{const x=sdgS('ER_H2O_STRESS','Activity=TOTAL');return x?[fmt1.format(x.data[x.data.length-1][1])+'%','water stress (withdrawals ÷ available water)',`SDG 6.4.2, FAO · ${x.data[x.data.length-1][0]}`]:null})()].filter(Boolean);
  const cards=[];
  const byB={};gdw.forEach(f=>{const b=f.bn||f.basin||'Not assigned';byB[b]=byB[b]||{n:0,cap:0};byB[b].n++;byB[b].cap+=f.cap||0});const bb=Object.entries(byB).map(([l,v])=>({l,v:Math.round(v.cap),t:`${v.n} dams`})).sort((a,b)=>b.v-a.v);
  cards.push(card({t:'Reservoir storage by major basin',s:'Million m³ of storage capacity. Kainji, Shiroro and Jebba alone hold most of the Niger basin’s total.',src:'Global Dam Watch v1.0 (Lehner et al. 2024)',file:'storage_by_basin',draw:el=>hbar(el,bb,{lw:250,f:v=>fmt.format(v)+' Mm³'}),rows:()=>bb.map(r=>({basin:r.l,capacity_million_m3:r.v,dams:+r.t.split(' ')[0]}))}));
  const top=gdw.filter(f=>f.cap).sort((a,b)=>b.cap-a.cap).slice(0,15);
  cards.push(card({t:'Largest reservoirs',s:'Storage capacity in million m³. Click a bar to open the dam.',src:'Global Dam Watch v1.0',file:'largest_reservoirs',draw:el=>hbar(el,top.map(f=>({l:f.n.length>24?f.n.slice(0,23)+'…':f.n,v:f.cap,t:[f.river&&f.river+' River',f.y,f.use].filter(Boolean).join(' · '),on:()=>goSite(f.i)})),{lw:170,f:v=>fmt.format(Math.round(v))+' Mm³'}),rows:()=>top.map(f=>({dam:f.n,river:f.river||'',state:f.s,year:f.y||'',capacity_million_m3:f.cap,area_km2:f.akm||'',main_use:f.use||''}))}));
  const dec={};gdw.filter(f=>f.y).forEach(f=>{const d=Math.floor(f.y/10)*10;dec[d]=dec[d]||{n:0,c:0};dec[d].n++;dec[d].c+=f.cap||0});const ds=Object.keys(dec).map(Number).sort();const dp=[];for(let d=ds[0];d<=ds[ds.length-1];d+=10)dp.push({l:d+'s',v:(dec[d]||{}).n||0,c2:(dec[d]||{}).c||0});
  cards.push(card({t:'When the dams were built',s:`Dams completed per decade (${gdw.filter(f=>f.y).length} with a recorded year). Most large dams date from the 1970s–1990s irrigation and hydropower drive.`,src:'Global Dam Watch v1.0',file:'dams_by_decade',draw:el=>cols(el,dp),rows:()=>dp.map(r=>({decade:r.l,dams:r.v,capacity_added_million_m3:Math.round(r.c2)}))}));
  const uses={};gdw.filter(f=>f.use).forEach(f=>{uses[f.use]=(uses[f.use]||0)+1});const us=Object.entries(uses).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
  cards.push(card({t:'Main purpose of each dam',s:'Each dam counted once under its main use.',src:'Global Dam Watch v1.0',file:'dams_by_main_use',draw:el=>hbar(el,us,{lw:130}),rows:()=>us.map(r=>({main_use:r.l,dams:r.v}))}));
  if(bw){const ser=[['SH.H2O.BASW.ZS','National','var(--bar)'],['SH.H2O.BASW.UR.ZS','Urban','var(--g6)'],['SH.H2O.BASW.RU.ZS','Rural','var(--g1)']].map(([id,n,c])=>{const s=wbS(id);return s?{name:n,c,pts:s.data.map(d=>({x:d[0],v:d[1]}))}:null}).filter(Boolean);
    cards.push(card({t:'People with at least basic drinking water',s:'% of population: an improved source within a 30-minute round trip.',src:`<a href="https://washdata.org" target="_blank" rel="noopener">WHO/UNICEF Joint Monitoring Programme</a> via World Bank WDI`,file:'basic_drinking_water',draw:el=>line(el,ser,{min:0,max:100,f:v=>fmt1.format(v)+'%',tf:v=>v+'%'}),rows:()=>bw.data.map(d=>{const r={year:d[0],national_pct:d[1]};ser.slice(1).forEach(S=>{const p=S.pts.find(p=>p.x===d[0]);r[S.name.toLowerCase()+'_pct']=p?p.v:''});return r})}))}
  if(bs||od){const ser=[[bs,'Basic sanitation','var(--bar)'],[od,'Open defecation','var(--s2)']].filter(x=>x[0]).map(([s,n,c])=>({name:n,c,pts:s.data.map(d=>({x:d[0],v:d[1]}))}));
    cards.push(card({t:'Sanitation',s:'% of population with at least basic sanitation, and practising open defecation.',src:'WHO/UNICEF JMP via World Bank WDI',file:'sanitation',draw:el=>line(el,ser,{min:0,max:100,f:v=>fmt1.format(v)+'%',tf:v=>v+'%'}),rows:()=>ser[0].pts.map(p=>{const r={year:p.x};ser.forEach(S=>{const q=S.pts.find(q=>q.x===p.x);r[S.name]=q?q.v:''});return r})}))}
  const sec=['ER.H2O.FWAG.ZS','ER.H2O.FWDM.ZS','ER.H2O.FWIN.ZS'].map((id,i)=>{const s=wbS(id);return s?{l:['Agriculture','Municipal (domestic)','Industry'][i],v:last(s)[1],y:last(s)[0]}:null}).filter(Boolean);
  if(sec.length)cards.push(card({t:'Who uses the water that is withdrawn',s:`Share of annual freshwater withdrawals${wd?` (${fmt1.format(last(wd)[1])} billion m³ in ${last(wd)[0]})`:''}.`,src:'FAO AQUASTAT via World Bank WDI',file:'withdrawals_by_sector',draw:el=>hbar(el,sec,{lw:150,f:v=>fmt1.format(v)+'%'}),rows:()=>sec.map(r=>({sector:r.l,pct_of_withdrawals:r.v,year:r.y}))}));
  const st=(ind,t,s,file,good)=>{const d=dhsSub(ind);if(!d.rows.length)return;const r=d.rows.sort((a,b)=>good?a.v-b.v:b.v-a.v);
    cards.push(card({t:t+` (${d.yr==='2024'?'2023–24':d.yr})`,s,src:DHS_SRC(d.id),file:file+'_'+d.yr,draw:el=>hbar(el,r.map(x=>({l:x.s,v:x.v,on:()=>{location.hash='map';setTimeout(()=>{state.st=x.s;$('#state').value=x.s;update();zoomState(x.s)},80)}})),{rh:17,f:v=>fmt1.format(v)+'%'}),rows:()=>r.map(x=>({state:x.s,pct:x.v}))}))};
  st('WS_SRCE_P_BAS','Basic drinking water by state','% of household population with basic drinking water service. Lowest first.','dhs_basic_water_by_state',true);
  st('WS_SRCE_P_SRF','Drinking surface water by state','% of household population whose main drinking water is a river, stream, pond or dam.','dhs_surface_water_by_state');
  st('WS_SRCE_P_TUB','Boreholes as the main source, by state','% of household population drinking mainly from a tubewell or borehole.','dhs_borehole_by_state');
  st('WS_SRCE_P_SCH','Sachet water by state','% of household population drinking mainly “pure water” sachets.','dhs_sachet_by_state');
  st('WS_TIME_P_M30','Water more than 30 minutes away, by state','% of household population needing over 30 minutes for a round trip to fetch water.','dhs_time_over30_by_state');
  const nat=((DATA.dhs||{}).nat||{}).WS_SRCE_P_IMP;if(nat){const pts=Object.values(nat).sort((a,b)=>a[0]-b[0]).map(p=>({x:p[0],v:p[1]}));if(pts.length>1)cards.push(card({t:'Improved drinking water source, survey by survey',s:'% of household population, from each national DHS or MIS.',src:'Nigeria DHS and MIS surveys via the DHS Program API',file:'dhs_improved_water_trend',draw:el=>line(el,pts,{min:0,max:100,f:v=>fmt1.format(v)+'%',tf:v=>v+'%'}),rows:()=>pts.map(p=>({survey_year:p.x,pct:p.v}))}))}
  if(DATA.wp){const r=Object.entries(DATA.wp.bystate).map(([s,v])=>({l:s,v:Object.values(v).reduce((a,b)=>a+b,0),t:Object.entries(v).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>`${esc(k)} ${fmt.format(n)}`).join(' · ')})).sort((a,b)=>b.v-a.v);
    cards.push(card({t:'Mapped water points by state',s:`${fmt.format(DATA.wp.n)} boreholes, wells, taps and other points surveyed for GRID3. Coverage is uneven: states with few points were not fully surveyed, so this is not a measure of access.`,src:esc(DATA.wp.src),file:'grid3_water_points_by_state',draw:el=>hbar(el,r,{rh:17}),rows:()=>r.map(x=>({state:x.l,water_points:x.v}))}))}
  const lv=['A','B','C','D'].map(l=>({l:'Level '+l,v:F.filter(f=>f.v===l).length,t:LEVELS[l]}));
  cards.push(card({t:'How well each record is verified',s:'A = named and documented; D = listed only, location provisional.',src:'Atlas verification scheme (see Data & sources)',file:'verification_levels',draw:el=>hbar(el,lv,{lw:90}),rows:()=>lv.map(r=>({level:r.l,records:r.v,meaning:r.t}))}));
  const WBT=Object.entries(DATA.wb||{}).filter(([k,s])=>s.data&&s.data.length&&k!=='ER.H2O.FWST.ZS');
  $('#stats').innerHTML=`<h2 class="title">Nigeria’s water in numbers</h2><p class="lede">Headline indicators for researchers, agencies, journalists and students. Every chart names its source and can be shown as a table, downloaded as CSV or copied as a citation. Dam figures come from Global Dam Watch; access figures from the WHO/UNICEF Joint Monitoring Programme and Nigeria’s Demographic and Health Surveys.</p>
  <div class="kpis">${kp.map(([v,l,s])=>`<div class="kpi"><b>${v}</b><span>${l}</span><small>${s}</small></div>`).join('')}</div>
  <div class="grid2">${cards.map(c=>c.html).join('')}</div>
  <div id="stats-extra"></div>
  ${WBT.length?`<h3 class="sh">Reference indicators</h3><div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Indicator</th><th class="n">Latest</th><th>Year</th><th>Source</th></tr></thead><tbody>${WBT.map(([k,s])=>`<tr><td>${esc(s.name)}</td><td class="n">${fmt1.format(last(s)[1])}</td><td>${last(s)[0]}</td><td><a href="https://data.worldbank.org/indicator/${k}?locations=NG" target="_blank" rel="noopener">${esc((s.source||'World Bank WDI').slice(0,80))}</a></td></tr>`).join('')}</tbody></table></div>`:''}`;
  cards.forEach(c=>c.mount());
  buildStatsExtra();
}

/* ---------- visit ---------- */
function buildVisit(){
  const sites=F.filter(f=>f.la!=null&&([2,3,4,5,6].includes(f.c)||(f.c===0&&(f.pics.length||f.wt))));
  const TYPES=[['falls','Waterfalls',f=>f.c===4],['springs','Warm springs and springs',f=>f.c===5],['lakes','Lakes and lagoons',f=>f.c===2||f.c===3],['wet','Ramsar wetlands',f=>f.c===6],['dams','Dams and reservoirs',f=>f.c===0]];
  $('#visit').innerHTML=`<h2 class="title">Plan a visit</h2><p class="lede">Waterfalls, warm springs, lakes, lagoons, wetlands and reservoirs that receive or could receive visitors. Descriptions come from Wikipedia and the Ramsar register. Access, fees and security change often: confirm with the site or state tourism board before you travel, and check your government’s current travel advice. Avoid swimming near dam spillways and in fast water during the rainy season.</p>
  <div class="filterbar"><div><div class="lbl">Travelling from</div><select id="vf-from"><option value="">Anywhere</option>${Object.keys(CITIES).map(c=>`<option>${c}</option>`).join('')}</select></div>
  <div><div class="lbl">Type</div><select id="vf-t"><option value="">All</option>${TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div>
  <div><div class="lbl">Search</div><input type="text" id="vf-q" placeholder="e.g. Plateau, warm spring, boating"></div>
  <label class="toggle" style="align-self:center"><input type="checkbox" id="vf-p" checked> With photos only</label></div><p class="meta" id="vcount" style="margin:-6px 0 12px;font-size:12.5px;color:var(--muted)"></p><div class="vgrid" id="vgrid"></div>`;
  const draw=()=>{const from=$('#vf-from').value,t=$('#vf-t').value,q=$('#vf-q').value.trim().toLowerCase(),onlyP=$('#vf-p').checked;const T=TYPES.find(x=>x[0]===t);
    let L=sites.filter(f=>(!T||T[2](f))&&(!onlyP||f.pics.length)&&(!q||f.txt.includes(q)));
    L.forEach(f=>f._d=from?km(CITIES[from],[f.la,f.lo]):null);
    L.sort((a,b)=>(from?a._d-b._d:0)||((b.pics.length?1:0)-(a.pics.length?1:0))||((b.wt?1:0)-(a.wt?1:0))||([4,5,2,3,6,0].indexOf(a.c)-[4,5,2,3,6,0].indexOf(b.c)));
    $('#vcount').textContent=`${fmt.format(L.length)} places · ${fmt.format(L.filter(f=>f.pics.length).length)} with photographs`;
    $('#vgrid').innerHTML=L.slice(0,150).map(f=>{const P=f.pics[0];const txt=(f.wt?f.wt.t:f.tour||f.notes||'');
      return`<article class="vcard"><div class="ph" style="--c:var(--g${f.gp})">${P&&LIVE?imgTag(P,500,330):''}<span class="ready">${esc(CATN(f))}</span></div><div class="bd"><h3>${esc(f.n)}</h3><div class="meta">${esc(f.s||'')}${f.river&&f.c===0?' · '+esc(f.river)+' River':''}${f._d?` · ${fmt.format(Math.round(f._d))} km from ${esc(from)} (straight line)`:''}</div><p>${esc(txt.slice(0,230))}${txt.length>230?'…':''}</p><div class="bt"><a class="btn sm" href="#${f.i}">Open profile</a><a class="btn sm" href="https://www.google.com/maps/dir/?api=1&destination=${f.la},${f.lo}" target="_blank" rel="noopener">Directions ↗</a></div></div></article>`}).join('')||'<p>No places match these filters.</p>';};
  ['vf-from','vf-t','vf-p'].forEach(i=>$('#'+i).onchange=draw);$('#vf-q').oninput=draw;draw();
}

/* ---------- community hub ---------- */
const RTYPES=['Flooding','Drought or very low water','Pollution or oil spill','Fish kill or algal bloom','Broken borehole or water point','New or repaired water point','Dam or embankment safety concern','Erosion or gully','Sand mining or dredging','Community water initiative','Data correction','Other'];
let reportSite=null,REPORTS=[],unsubR=null;
function buildNgo(){
  const nameIdx={};F.forEach(f=>nameIdx[f.n.toLowerCase()]=f.i);
  const unsure=F.filter(f=>f.c===1).sort((a,b)=>a.s.localeCompare(b.s)||a.n.localeCompare(b.n));
  const unnamed=F.filter(f=>f.c===0&&/^Unnamed/.test(f.n)).sort((a,b)=>(b.cap||0)-(a.cap||0));
  const noprof=F.filter(f=>f.c===0&&f.gdw&&!f.wt&&!/^Unnamed/.test(f.n)).sort((a,b)=>(b.cap||0)-(a.cap||0)).slice(0,20);
  const tbl=(L,cols)=>`<div class="tbl-wrap"><table class="dt"><thead><tr>${cols.map(c=>`<th class="${c[2]?'n':''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${L.map(f=>`<tr class="click" data-id="${f.i}">${cols.map(c=>`<td class="${c[2]?'n':''}">${c[1](f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  $('#ngo').innerHTML=`<h2 class="title">Community hub</h2><p class="lede">For water user associations, NGOs, researchers, journalists and community monitors: log what you see on the ground, keep a watchlist, and find the records that most need checking. Reports are shown as submitted and marked unverified until checked.</p>
  <div class="grid2">
   <article class="card"><h3>Report from the field</h3><div class="sub" id="r-mode"></div>
    <form class="form" id="rform"><label>Place<input type="text" id="r-site" list="r-sites" placeholder="Start typing a dam, river, lake or town" required></label><datalist id="r-sites">${F.map(f=>`<option value="${esc(f.n)}">${esc(f.s)}</option>`).join('')}</datalist>
     <div class="two"><label>What did you observe?<select id="r-type">${RTYPES.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Date observed<input type="date" id="r-date" value="${today}"></label></div>
     <label>Short title<input type="text" id="r-title" maxlength="120" required placeholder="e.g. River overtopped the bank at the market road"></label>
     <label>Details<textarea id="r-body" maxlength="2000" placeholder="What, where (landmark or GPS), how large, who is affected. Avoid naming private individuals."></textarea></label>
     <div class="two"><label>Organisation (optional)<input type="text" id="r-org" maxlength="120"></label><label>Evidence link (optional)<input type="url" id="r-link" placeholder="https://"></label></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" id="r-submit">Publish report</button><button class="btn" type="button" id="r-copy">Copy report text</button></div>
     <p id="r-msg" class="loading" style="margin:0"></p></form>
     <p class="loading" style="margin:0">In an emergency, contact your State Emergency Management Agency or NEMA first.</p></article>
   <article class="card"><h3>Shared field log</h3><div class="sub">Most recent reports from all contributors.</div><div class="row2"><select id="rf-type"><option value="">All report types</option>${RTYPES.map(t=>`<option>${t}</option>`).join('')}</select><select id="rf-state"><option value="">All states</option>${STATES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="feed" id="feed"></div></article>
   <article class="card"><h3>My watchlist</h3><div class="sub">Places you starred in their profiles. Saved in this browser only.</div><div id="watch"></div></article>
   <article class="card"><h3>Large dams with no published profile</h3><div class="sub">Named reservoirs in Global Dam Watch without a Wikipedia article: a gap for students, journalists and RBDAs to fill.</div>${tbl(noprof,[['Dam',f=>esc(f.n)],['River',f=>esc(f.river||'')],['Mm³',f=>f.cap?fmt.format(Math.round(f.cap)):'–',1]])}</article>
   <article class="card"><h3>Reservoirs seen from space but unnamed</h3><div class="sub">${unnamed.length} reservoirs mapped from satellite images (GOODD, GROD, JRC) with no name on record. Know one? Send a “Data correction”.</div>${tbl(unnamed,[['Record',f=>esc(f.n)],['State',f=>esc(f.s)],['Mm³',f=>f.cap?fmt1.format(f.cap):'–',1]])}</article>
   <article class="card"><h3>Listed dams that need locating</h3><div class="sub">${unsure.length} dams in the UNICEF Nigeria list that could not be matched to a mapped reservoir. Their coordinates are rounded, and some fall in a different state from the one listed.</div>${tbl(unsure,[['Dam',f=>esc(f.n)],['Listed state',f=>esc(f.s_listed||'')],['Level',f=>f.v]])}</article>
  </div>`;
  $$('#ngo tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  const siteOf=()=>{const v=$('#r-site').value.trim().toLowerCase();return nameIdx[v]?BY[nameIdx[v]]:null};
  const text=()=>{const f=siteOf();return`Field report — ${$('#r-title').value}\nPlace: ${f?f.n+' ('+f.s+') ['+f.i+']':$('#r-site').value}\nType: ${$('#r-type').value}\nDate observed: ${$('#r-date').value}\nOrganisation: ${$('#r-org').value||'—'}\nEvidence: ${$('#r-link').value||'—'}\n\n${$('#r-body').value}`};
  $('#r-copy').onclick=()=>copy(text());
  if(reportSite&&BY[reportSite])$('#r-site').value=BY[reportSite].n;
