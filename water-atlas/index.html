    if(CAP.db){if(!f){$('#r-msg').textContent='Pick a place from the list so the report can be placed on the map.';return}$('#r-submit').disabled=true;try{const uid=CAP.user&&CAP.user.id?await CAP.user.id():null;
        await CAP.db.collection('reports').add({site:f.i,siteName:f.n,state:f.s,type:$('#r-type').value,date:$('#r-date').value,title:$('#r-title').value.slice(0,120),body:$('#r-body').value.slice(0,2000),org:$('#r-org').value.slice(0,120),link:/^https?:\/\//.test($('#r-link').value)?$('#r-link').value:'',author:uid,created:Date.now(),status:'unverified'});

      catch(err){$('#r-msg').textContent=err&&err.code==='not_granted'?'You can read the log but not add to it. Copy the report text and send it instead.':'The report could not be saved. Copy the text and try again later.'}
      $('#r-submit').disabled=false}
    else{const url=`https://github.com/${CONFIG.issuesRepo}/issues/new?labels=water-report&title=${encodeURIComponent('[Water] ['+$('#r-type').value+'] '+(f?f.n:$('#r-site').value)+': '+$('#r-title').value)}&body=${encodeURIComponent(text())}`;
      const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();$('#r-msg').innerHTML=`Your report opens as a GitHub issue for review (a free GitHub account is needed). If nothing opened, <a href="${esc(url)}" target="_blank" rel="noopener">open it here</a>, or copy the report text and email it to <a href="mailto:amool@unbc.ca">amool@unbc.ca</a>.`}};
  $('#r-mode').textContent=CAP.db?'Reports are saved to this atlas’s shared log and visible to everyone it is shared with.':'On the public website, reports are filed as GitHub issues so maintainers can check them before they are added.';

}
function startReports(){if(unsubR||!CAP.db)return;try{unsubR=CAP.db.collection('reports').orderBy('created','desc').limit(300).onSnapshot(s=>{REPORTS=s.docs.map(d=>({id:d.id,...d.data()}));renderFeed();if(state.sel)renderSiteReports(state.sel)},()=>{})}catch(e){}}

function exportRow(f){return{id:f.i,name:f.n,type:CATN(f),state:f.s||'',lat:f.la??'',lon:f.lo??'',river:f.river||'',basin:f.basin||'',year_completed:f.y||'',dam_height_m:f.hgt??'',crest_length_m:f.len??'',capacity_million_m3:f.cap??'',reservoir_area_km2:f.akm??'',mean_depth_m:f.dep??'',average_inflow_m3s:f.dis??'',catchment_km2:f.catch??'',power_mw:f.mw??'',main_use:f.use||'',uses:(f.uses||[]).join('; '),river_length_km:f.rlen??'',gdw_id:f.gdw||'',grand_id:f.grand||'',wikidata:f.wd||'',wdpa_id:f.w||'',verification_level:f.v,location_basis:f.q||'',location_note:f.loc_note||'',wikipedia:f.wt?f.wt.u:'',sources:(f.src||[]).join(' | ')}}
function buildData(){

   ['Nigeria dam list (Nigeria Dams layer, UNICEF Nigeria GIS, ArcGIS Online)','Names, states and rounded coordinates of 160+ dams','Dams not found in GDW (level C–D)','https://www.arcgis.com/home/search.html?q=Nigeria%20Dams_WFL1','Public layer; no licence stated'],

   ['Wikidata and Wikipedia','Lakes, waterfalls, springs, extra dams, river lengths, descriptions and photographs (Wikimedia Commons)','Profiles and photos','https://www.wikidata.org','CC0 (Wikidata); CC BY-SA (text); per-file licences (photos)'],
   ['Ramsar Sites Information Service and WDPA, via the Nigeria Forest Reserves Atlas','Ramsar wetland boundaries and profiles','Wetlands',CONFIG.forestUrl,'Per source'],
   ['GloFAS v4 river discharge (Copernicus EMS) via the Open-Meteo Flood API','Daily modelled river flow since 1984 and ensemble forecasts','Flood watch and river-flow charts','https://open-meteo.com/en/docs/flood-api','CC BY 4.0'],
   ['National Water Resources Master Plan 2013 (Federal Ministry of Water Resources and JICA)','Hydrological areas, renewable water, recharge, population, demand','Basins page','https://openjicareport.jica.go.jp/pdf/12146585.pdf','Government report'],
   ['British Geological Survey, Africa Groundwater Atlas','Aquifer types, yields, borehole statistics','Groundwater','https://earthwise.bgs.ac.uk/index.php/Hydrogeology_of_Nigeria','© BGS / UKRI'],
   ['Nigeria DHS 2023–24 and 2018 (NPC and ICF), DHS Program API','Drinking water sources, time to water, sanitation by state','Statistics','https://api.dhsprogram.com','Public API; cite the DHS Program'],
   ['World Bank World Development Indicators (JMP, FAO AQUASTAT)','National water access, sanitation, freshwater resources, withdrawals','Statistics','https://data.worldbank.org/country/nigeria','CC BY 4.0'],
   ['GRID3 Nigeria Water Points (eHealth Africa and Proxy Logics, 2020)','Locations and types of about 29,000 water points','Water points layer','https://grid3.gov.ng','CC BY 4.0'],
   ['OpenStreetMap (via the Overpass API)','Expressways, trunk and primary roads','Major roads layer','https://www.openstreetmap.org/copyright','ODbL 1.0, © OpenStreetMap contributors'],
   ['GloFAS, Copernicus Emergency Management Service (web map service)','Official flood alerts at reporting points, flood summary for the next 30 days, 100-year flood hazard map','Flood watch alerts and map layers, refreshed hourly','https://global-flood.emergency.copernicus.eu','Copernicus licence; free with attribution'],
   ['GEOGLOWS, ECMWF (API and ArcGIS live feed)','15-day river flow forecasts for every river reach and return-period flags','Second forecast at the gauges; rivers above flood flows (live)','https://geoglows.ecmwf.int','CC BY 4.0'],
   ['GDACS, European Commission JRC and UN OCHA (API)','Flood events for Nigeria since 1985 with alert levels and reported impacts','Live events and flood history','https://www.gdacs.org','Free with attribution'],
   ['Nigerian Meteorological Agency (NiMet): CAP warning feed','Official weather warnings with areas, timing and advice','Flood watch warnings and map layer','https://nimet.gov.ng/hazardwatch','Public warnings'],
   ['NiMet Weather API: 3-day forecasts','Daily weather and day/night temperatures at 57 NiMet forecast stations','Flood watch table and map layer','https://nimet.gov.ng/weatherapi','Registered API key; credit NiMet'],
   ['NiMet Seasonal Rainfall Prediction (SRP)','Predicted onset, end, season length and annual rainfall for each LGA','Rain page','https://nimet.gov.ng/srp','Public; credit NiMet'],
   ['NiMet, 2025 State of the Climate in Nigeria (2026)','Rainfall anomalies since 1981, extreme rainfall, dry spells and the 2025 floods','Rain page and flood history','https://nimet.gov.ng/SoCN','Cited by page'],
   ['Early Warnings for All Dashboard (WMO, UNDRR, ITU, IFRC)','Country capacity for multi-hazard early warning','Flood watch','https://earlywarningsforall.org/site/early-warnings-all/dashboards/early-warnings-all-dashboard','Public'],
   ['Dartmouth Flood Observatory, Global Active Archive of Large Flood Events (G.R. Brakenridge)','Large floods since 1985 with dates, deaths, displacement and causes','Flood history','https://floodobservatory.colorado.edu/Archives/index.html','Free for non-commercial use with attribution'],
   ['UNICEF Nigeria, 2024 Nigeria Flood Risk Analysis (ArcGIS Online)','Riverine, flash and coastal flood-risk rating for each LGA','Flood risk layer','https://www.arcgis.com/home/search.html?q=2024%20Nigeria%20Flood%20Risk%20Analysis','Public layer; no licence stated'],
   ['geoBoundaries (William & Mary geoLab)','State boundaries','State assignment','https://www.geoboundaries.org','CC BY 4.0'],
   ['NASA POWER (MERRA-2 with satellite-corrected precipitation)','Monthly rainfall at up to 8 points in every state, 1981 onwards; 1991–2020 state normals','Rain page, harvesting calculator, water balance','https://power.larc.nasa.gov','Free, NASA open data'],
   ['World Bank Climate Change Knowledge Portal: CRU TS 4.08 and ERA5','National annual rainfall since 1901 (rain gauges) and 1950 (reanalysis)','Rainfall history','https://climateknowledgeportal.worldbank.org/country/nigeria','CC BY 4.0'],
   ['Open-Meteo forecast and seasonal APIs (ECMWF IFS and SEAS5, DWD ICON, NOAA GFS)','Rain in the last 30 days, 16-day forecasts and 6-month outlooks for every state','Rain page and flood watch, live','https://open-meteo.com','CC BY 4.0'],
   ['NASA GIBS: VIIRS combined flood product and GPM IMERG','Satellite-mapped flood water (3-day composite) and yesterday’s rainfall','Map layers, live','https://www.earthdata.nasa.gov/engage/open-data-services-software/earthdata-developer-portal/gibs-api','Free, NASA open data'],
   ['UN SDG Global Database (WHO, UNICEF, UN-Habitat, FAO, UNEP, JRC)','Safely managed water and sanitation, wastewater treated, water quality, water stress, surface-water and wetland extent','Statistics','https://unstats.un.org/sdgs/dataportal','Open with attribution'],
   ['Jones, van Vliet, Qadir and Bierkens (2021), Earth System Science Data 13, 237–254','Wastewater generated, collected, treated and reused (2015)','Statistics','https://doi.org/10.1594/PANGAEA.918731','CC BY 4.0'],
   ['Live services on the hosted site','Open-Meteo (weather, river flow), Wikimedia Commons (nearby photos), Esri / OpenTopoMap / NASA GIBS (basemaps), JRC Global Surface Water (surface-water tiles)','On demand','https://open-meteo.com','Per service terms']];
  const unnamed=F.filter(f=>/^Unnamed/.test(f.n)).length;
  $('#data').innerHTML=`<h2 class="title">Data, sources and method</h2><p class="lede">This atlas joins global scientific databases with Nigerian government plans, national surveys and open encyclopaedias, and records where every fact came from. It is built to be checked, cited and corrected.</p>
  <h3>Download the dataset</h3><p>${fmt.format(F.length)} records, version ${esc(DATA.meta.version)}, refreshed ${esc(DATA.meta.refreshed)}. CSV opens in Excel or R; GeoJSON opens in QGIS, ArcGIS and most web maps. The full build files (river network, roads, water points, flood-risk LGAs, gauge climatologies) are in the <a href="data/atlas.json">data folder</a>.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="dl-csv" type="button">Download CSV</button><button class="btn" id="dl-geo" type="button">Download GeoJSON</button><button class="btn" id="dl-cite" type="button">Copy dataset citation</button></div>
  <pre class="cite" style="margin-top:10px">${esc(dsCite)}</pre>
  <h3>Sources</h3><div class="tbl-wrap" style="max-height:none"><table class="dt srctbl"><thead><tr><th>Source</th><th>What it provides</th><th>Used for</th><th>Licence / terms</th></tr></thead><tbody>${SRC.map(s=>`<tr><td><a href="${esc(s[3])}" ${s[3].startsWith('/')?'':'target="_blank" rel="noopener"'}>${esc(s[0])}</a></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td>${esc(s[4])}</td></tr>`).join('')}</tbody></table></div>
  <div id="reports-src"></div>
  <h3>Verification levels</h3><ul>${Object.entries(LEVELS).map(([k,v])=>`<li><b>Level ${k}</b> (${F.filter(f=>f.v===k).length} records): ${esc(v)}</li>`).join('')}</ul>
  <h3>Method</h3><ul>
   <li>Global Dam Watch is the backbone for dams. UNICEF-list and Wikidata entries were matched to it by name and distance; unmatched UNICEF-list dams are kept as level D so they can be located.</li>
   <li>Unnamed satellite-mapped reservoirs take a name only when a UNICEF-list or Wikidata entry lies within a few kilometres, and the profile says so.</li>
   <li>Each record is assigned to a state by where its point falls (geoBoundaries). Rivers list the states their mapped line crosses.</li>
   <li>Wikidata duplicates (the same waterfall entered two or three times) were merged when within 2.5 km and of the same kind.</li>
   <li>Flood-watch normals use 1991–2020 GloFAS reanalysis at each point in a 15-day window around each date. GloFAS is a model at about 5 km resolution: it is good at large rivers and seasonal patterns and weak at small streams, urban drainage and dam operations.</li>
   <li>River lines are simplified to about 500 m, reservoir outlines to about 150 m and roads to about 200 m for display.</li>
   <li>Major roads are OpenStreetMap expressways, trunk and primary roads, joined by route number. They show how places connect, not road condition or seasonal access; volunteer mapping is more complete around cities than in rural areas.</li></ul>
  <h3>Updates</h3><p>A scheduled job re-downloads every source each Monday and rebuilds the data; a second job refreshes the flood alerts, forecasts, NiMet warnings and 3-day forecasts, and the flood history every hour (NiMet’s seasonal rainfall prediction daily), and the flood watch page fetches NiMet warnings, GDACS events and GEOGLOWS river forecasts live and re-checks them every 15 minutes while it is open; river flows, weather and nearby photos are fetched live when you open a profile. Hand-written content (basins, groundwater, agencies) lives in <a href="data/curated.json">curated.json</a> with its sources. Each release is versioned; cite the version you used.</p>
  <h3>Known gaps</h3><ul><li>${unnamed} reservoirs are still unnamed and ${F.filter(f=>f.c===1).length} UNICEF-list dams are not precisely located.</li><li>Small earth dams, community ponds and many boreholes are missing; the GRID3 water-point survey did not cover every state.</li><li>Hydropower capacity is not recorded for most dams in GDW; newer schemes such as Zungeru are added from Wikipedia.</li><li>The eight hydrological areas are described but not drawn: their official boundaries are not published as open data. The Basins layer shows HydroBASINS watersheds instead.</li></ul>
  <h3>Corrections</h3><p>Water agencies, RBDAs, researchers and community monitors can send corrections through the Community hub (choose “Data correction”) or on <a href="https://github.com/${CONFIG.issuesRepo}/issues" target="_blank" rel="noopener">GitHub</a>. Please include a source.</p>`;
  addReportSources();
  $('#dl-csv').onclick=()=>saveFile('nigeria_water_atlas.csv',toCSV(F.map(exportRow)),'text/csv');
  $('#dl-geo').onclick=()=>saveFile('nigeria_water_atlas.geojson',JSON.stringify({type:'FeatureCollection',features:F.map(f=>({type:'Feature',properties:exportRow(f),geometry:f.ln?{type:'MultiLineString',coordinates:f.ln}:f.g?{type:'MultiPolygon',coordinates:f.g}:f.la!=null?{type:'Point',coordinates:[f.lo,f.la]}:null}))}),'application/geo+json');
  $('#dl-cite').onclick=()=>copy(dsCite);
}

<script>
/* ---------- reports: irrigation, hydropower and facts from reports and studies ---------- */
let REP=null;
async function reports(){if(REP)return REP;REP=await loadJSON('reports.json');return REP}
function cite(o){if(!REP||!o||!REP.refs[o.r])return'';const R=REP.refs[o.r];const t=`${R.s}, ${/[,–-]/.test(String(o.p))?'pp.':'p.'} ${String(o.p).replace(/-/g,'–')}`;
  return R.u?` <a class="rcite" href="${esc(R.u)}" target="_blank" rel="noopener" title="${esc(R.c)}">(${esc(t)})</a>`:` <span class="rcite" title="${esc(R.c)}">(${esc(t)})</span>`}
function factList(a){return`<ul class="rfacts">${a.map(x=>`<li>${esc(x.t)}${cite(x)}</li>`).join('')}</ul>`}
function refList(ids){return`<ol class="refs">${ids.map(k=>{const R=REP.refs[k];return`<li id="ref-${k}">${esc(R.c)}${R.u?` <a href="${esc(R.u)}" target="_blank" rel="noopener">Link ↗</a>`:''}</li>`}).join('')}</ol><p class="sm-note">${esc(REP.pages)} Facts are quoted as the reports give them; where a report contradicts itself both figures are shown.</p>`}
const haf=v=>v==null?'–':fmt.format(Math.round(v));
function gbars(el,rows,o={}){
  const S=[['pl','Planned','var(--bar2)'],['dv','Developed','var(--bar)'],['ir','Irrigated 2003/04','var(--g2)']];
  const W=560,lw=o.lw||110,rh=30,H=rows.length*rh+8,max=Math.max(...rows.flatMap(r=>S.map(s=>r[s[0]]||0)))||1,iw=W-lw-70;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  rows.forEach((r,i)=>{const y=i*rh+4;s+=`<g data-i="${i}" style="cursor:pointer"><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/><text x="${lw-8}" y="${y+rh/2+3}" text-anchor="end" class="lab">${esc(r.n)}</text>`;
    S.forEach(([k,,c],j)=>{const w=Math.max(r[k]?1:0,(r[k]||0)/max*iw);s+=`<rect x="${lw}" y="${y+3+j*8}" width="${w}" height="7" rx="2" fill="${c}"/>`});
    s+=`<text x="${lw+Math.max(1,(r.pl||0)/max*iw)+5}" y="${y+12}">${fmt.format(r.pl)}</text></g>`});
  el.innerHTML=s+`</svg><div class="qkey">${S.map(([,n,c])=>`<span><i class="band" style="--c:${c};opacity:1"></i>${n}</span>`).join('')}</div>`;
  el.querySelectorAll('g[data-i]').forEach(g=>{const r=rows[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(r.n)} RBDA</b><br>Planned ${haf(r.pl)} ha · developed ${haf(r.dv)} ha · irrigated ${haf(r.ir)} ha`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip;g.onclick=()=>goSite(r.id)});
}

    draw:el=>gbars(el,[...I.rbda].sort((a,b)=>b.pl-a.pl),{lw:120}),rows:()=>I.rbda.map(r=>({rbda:r.n,planned_ha:r.pl,developed_ha:r.dv,irrigated_ha_2003_04:r.ir}))}));
  const rbs=[...new Set(I.schemes.map(s=>s.rbn))].sort();
  const used=['ropisin','ifpri','bfp','uchua','spin','triming','tractebel','lrdc','boka'];
  P.innerHTML=`<h2 class="title">Irrigation and hydropower</h2><p class="lede">How the water stored behind Nigeria’s dams and in its aquifers is used for farming and power: what was built, what actually works, and where the potential lies. Figures come from government reviews, research studies and project documents, each cited to the page.</p>
  <div class="kpis">${I.kpi.map(k=>`<div class="kpi"><b>${esc(k.v)}${k.u?` <small style="display:inline;font-size:14px">${esc(k.u)}</small>`:''}</b><span>${esc(k.l)}</span><small>${esc(REP.refs[k.r].s)}, p. ${esc(k.p)}</small></div>`).join('')}</div>
  <div class="callout warn" style="margin-bottom:18px">The most complete national review of public irrigation dates from 2004. Many schemes have changed since then; treat scheme figures as a 2003/04 snapshot.${cite({r:'ropisin',p:'10-12'})}</div>

  <p class="lede" style="margin-bottom:10px">The 62 schemes reviewed by the Federal Ministry of Water Resources and FAO, plus the Savannah Sugar estate. Dams linked here open on the map.${cite({r:'ropisin',p:'29, 58-73, 136-158'})}</p>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><select id="ir-rb" aria-label="River Basin Development Authority"><option value="">All authorities</option>${rbs.map(r=>`<option>${esc(r)}</option>`).join('')}</select><select id="ir-sort" aria-label="Sort"><option value="pl">Largest planned area</option><option value="ir">Largest irrigated area</option><option value="n">Name</option></select><button class="btn sm" id="ir-csv" type="button">Download CSV</button></div>
  <div class="tbl-wrap" style="max-height:520px"><table class="dt"><thead><tr><th>Scheme</th><th>Authority</th><th>Water source</th><th class="n">Planned ha</th><th class="n">Developed ha</th><th class="n">Irrigated ha</th><th>Status in 2004</th></tr></thead><tbody id="ir-body"></tbody></table></div>
  <h3 class="sh">What the 2004 review found</h3>${factList(I.facts)}

  <h3 class="sh">Hydropower</h3>
  <div class="grid2"><div><h4 class="h4">Large plants</h4><div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Plant</th><th>River</th><th class="n">Installed MW</th></tr></thead><tbody>${H.existing.map(x=>`<tr class="click" data-id="${x.id}"><td>${esc(x.n)}</td><td>${esc(x.river)}</td><td class="n">${fmt.format(x.mw)}</td></tr>`).join('')}</tbody></table></div><p class="sm-note">${cite(H.existing_src).trim()}</p></div>
  <div><h4 class="h4">Sites shortlisted in a 2016 screening study</h4><div class="tbl-wrap" style="max-height:none"><table class="dt"><thead><tr><th>Site</th><th>River</th><th class="n">MW</th><th class="n">GWh/yr</th><th>Result</th></tr></thead><tbody>${H.sites.map(x=>`<tr><td><span class="mono">${esc(x[0])}</span> ${esc(x[1])}</td><td>${esc(x[2])}</td><td class="n">${esc(String(x[3]))}</td><td class="n">${esc(String(typeof x[4]==='number'?fmt.format(x[4]):x[4]))}</td><td>${esc(x[5])}</td></tr>`).join('')}</tbody></table></div><p class="sm-note">Candidate sites from a study, not approved projects.${cite(H.sites_src)}</p></div></div>
  ${factList(H.facts)}
  <h3 class="sh">Earlier studies and methods</h3>${factList(I.history)}
  <h3 class="sh">References</h3>${refList(used)}`;
  cards.forEach(c=>c.mount());
  $$('#irrig tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id));
  const rowsOf=()=>{const rb=$('#ir-rb').value,so=$('#ir-sort').value;return I.schemes.filter(s=>!rb||s.rbn===rb).sort((a,b)=>so==='n'?a.n.localeCompare(b.n):(b[so]??-1)-(a[so]??-1))};
  const render=()=>{$('#ir-body').innerHTML=rowsOf().map(s=>`<tr${s.dams.length?` class="click" data-id="${s.dams[0]}" title="Open ${esc(s.dams.map(d=>BY[d]?BY[d].n:d).join(', '))} on the map"`:''}><td><b>${esc(s.n)}</b>${s.dams.length?' <span class="tag">dam on map</span>':''}</td><td>${esc(s.rbn)}</td><td>${esc(s.src)}</td><td class="n">${haf(s.pl)}</td><td class="n">${haf(s.dv)}</td><td class="n">${haf(s.ir)}</td><td>${esc(s.status)}</td></tr>`).join('');
    $$('#ir-body tr.click').forEach(tr=>tr.onclick=()=>goSite(tr.dataset.id))};
  $('#ir-rb').onchange=render;$('#ir-sort').onchange=render;render();
  $('#ir-csv').onclick=()=>saveFile('nigeria_federal_irrigation_schemes_2004.csv',toCSV(rowsOf().map(s=>({scheme:s.n,rbda:s.rbn,water_source:s.src,planned_ha:s.pl,developed_ha:s.dv,irrigated_ha_2003_04:s.ir,status_2004:s.status,source:REP.refs.ropisin.c+' p. '+s.p}))),'text/csv');
}

}

<script>
/* ---------- flood watch: live alerts (GloFAS, GEOGLOWS, GDACS) and flood history ---------- */
const GDACS_API='https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH';
const GG_FEED='https://livefeeds3.arcgis.com/arcgis/rest/services/GEOGLOWS/GlobalWaterModel_Medium/MapServer/0/query';
const GLOFAS_WMS='https://ows.globalfloods.eu/glofas-ows/ows.py';
const ALERTC={Severe:'var(--s3)',High:'var(--s2)',Medium:'var(--s1)'};
const GDC={Red:'#d93b2b',Orange:'#e8891f',Green:'#2e9e44'};
const rpCol=rp=>rp>=25?'var(--s3)':rp>=5?'var(--s2)':'var(--s1)';
const dshort=d=>d?new Date(d+(d.length===10?'T12:00:00Z':'')).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'–';
let FW=null,FH=null,LIVEFW={gdacs:null,reaches:null,at:null},fwTimer=null;
async function fwData(force){if(FW&&!force)return FW;try{FW=await (await fetch('data/floodwatch.json'+(force?'?t='+Date.now():''),{cache:force?'no-store':'no-cache'})).json()}catch(e){FW=FW||{}}return FW}
async function fhData(){if(FH)return FH;try{FH=await loadJSON('floodhistory.json')}catch(e){FH={}}return FH}
async function liveGdacs(){
  const from=new Date(Date.now()-120*864e5).toISOString().slice(0,10),to=new Date(Date.now()+2*864e5).toISOString().slice(0,10);
  const j=await (await fetch(`${GDACS_API}?eventlist=FL&country=Nigeria&fromDate=${from}&toDate=${to}&alertlevel=Green;Orange;Red&pageSize=100`)).json();
  return (j.features||[]).map(f=>{const p=f.properties,c=(f.geometry||{}).coordinates||[];return{id:+p.eventid,from:p.fromdate.slice(0,10),to:p.todate.slice(0,10),alert:((a=>a.charAt(0).toUpperCase()+a.slice(1))((p.alertlevel||'').toLowerCase())),cur:p.iscurrent===true||p.iscurrent==='true',lo:c[0],la:c[1],url:`https://www.gdacs.org/report.aspx?eventtype=FL&eventid=${p.eventid}`}}).sort((a,b)=>b.from.localeCompare(a.from));
}
async function liveReaches(){
  const q=new URLSearchParams({f:'json',where:"returnperiod>=2 AND rivercountry='Nigeria'",outFields:'comid,returnperiod,meanflow,streamorder,upstreamarea',returnGeometry:'true',outSR:'4326',maxAllowableOffset:'0.01',resultRecordCount:'4000'});
  const j=await (await fetch(GG_FEED+'?'+q)).json();if(j.error)throw new Error(j.error.message);
  return (j.features||[]).map(f=>({rp:f.attributes.returnperiod,q:f.attributes.meanflow,so:f.attributes.streamorder,km2:Math.round((f.attributes.upstreamarea||0)/1e6),paths:(f.geometry||{}).paths||[]}));
}
function stateAt(lo,la){if(lo==null||!statesLayer)return null;let s=null;statesLayer.eachLayer(l=>{if(s)return;const ll=L.latLng(la,lo);if(l.getBounds().contains(ll)&&pip(ll,l))s=l.feature.properties.n});return s}
function pip(ll,poly){const x=ll.lng,y=ll.lat;const rings=poly.getLatLngs().flat(1).filter(r=>Array.isArray(r)&&r.length&&r[0].lat!=null);let inside=false;rings.forEach(r=>{for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i].lng,yi=r[i].lat,xj=r[j].lng,yj=r[j].lat;if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}});return inside}
async function refreshLive(){
  const [fw,gd,rc]=await Promise.allSettled([fwData(!!LIVEFW.at),LIVE?liveGdacs():Promise.reject('offline'),LIVE?liveReaches():Promise.reject('offline')]);
  LIVEFW.gdacs=gd.status==='fulfilled'?gd.value:null;LIVEFW.reaches=rc.status==='fulfilled'?rc.value:null;LIVEFW.at=new Date();
  renderLive();
}
const gname=p=>!p.n||/^not a station$/i.test(p.n)?'GloFAS model point (no gauge)':p.n.replace(/\bA\b/,'at');
function glofasRows(){const P=((FW||{}).glofas||{}).points||[];return P.filter(p=>p.country==='Nigeria'||/niger|benue|benoue|faro|mayo kebi|komadugu|yobe|sokoto|rima|alibori|mekrou/i.test((p.river||'')+' '+(p.basin||'')))}
function renderLive(){
  if(!$('#fw-kpi'))return;const fw=FW||{};const G=fw.glofas||{},GG=fw.geoglows||{};
  const gd=LIVEFW.gdacs||((fw.gdacs||{}).events)||[];const gdLive=!!LIVEFW.gdacs;
  const rch=LIVEFW.reaches;const rcount=rch?rch.length:Object.values(GG.reach_counts||{}).reduce((a,b)=>a+b,0);
  const rbig=rch?rch.filter(r=>r.so>=4).length:null;
  const pts=glofasRows();const al=pts.filter(p=>p.alert&&p.alert!=='Inactive');const any2=pts.filter(p=>(p.p2||0)>0);
  const active=gd.filter(e=>e.cur);
  $('#fw-kpi').innerHTML=`<div class="kpi"><b>${al.length}</b><span>GloFAS reporting points with an official flood alert</span><small>${any2.length} show some chance of a 2-year flood · forecast ${esc((G.time||'').slice(0,10))}</small></div>
   <div class="kpi"><b>${fmt.format(rcount)}</b><span>river stretches in Nigeria forecast above a 2-year flood flow</span><small>GEOGLOWS (ECMWF)${rbig!=null?` · ${fmt.format(rbig)} on larger rivers`:''}${rch?' · live':''}</small></div>
   <div class="kpi"><b>${active.length}</b><span>GDACS flood events active in Nigeria</span><small>${gd.length} in the last 120 days${gdLive?' · live':''}</small></div>`;
  $('#fw-when').textContent=`Live sources checked ${LIVEFW.at.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} your time; the page refreshes them every 15 minutes while open. Stored forecasts updated ${fw.checked?new Date(fw.checked.replace('Z',':00Z')).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'–'}.`;
  const order={Severe:3,High:2,Medium:1};
  const rows=[...pts].sort((a,b)=>(order[b.alert]||0)-(order[a.alert]||0)||(b.p2||0)-(a.p2||0)||(b.area||0)-(a.area||0));
  $('#fw-glofas').innerHTML=rows.length?`<div class="tbl-wrap" style="max-height:420px"><table class="dt"><thead><tr><th>Station</th><th>River</th><th>Where</th><th class="n">2-yr %</th><th class="n">5-yr %</th><th class="n">20-yr %</th><th>Alert</th><th>Highest chance</th></tr></thead><tbody>${rows.map(p=>`<tr class="click" data-ll="${p.la},${p.lo}"><td><b>${esc(gname(p))}</b> <span class="mono" style="font-size:11px;color:var(--muted)">${esc(p.id==='NA'?'':p.id)}</span></td><td>${esc(p.river&&p.river!=='NA'?p.river:'')}</td><td>${esc(p.st||p.country||'')}</td><td class="n">${p.p2??'–'}</td><td class="n">${p.p5??'–'}</td><td class="n">${p.p20??'–'}</td><td>${p.alert&&p.alert!=='Inactive'?`<span class="status s${order[p.alert]||1}">${esc(p.alert)}</span>`:'<span style="color:var(--muted)">None</span>'}</td><td>${esc(p.peak||'')}</td></tr>`).join('')}</tbody></table></div><p class="sm-note">Maximum probability, across the 51-member ECMWF ensemble over the forecast period, of exceeding the 2-, 5- and 20-year flood flow at each official GloFAS reporting point. Click a row to see it on the map.</p>`:'<p class="loading">GloFAS reporting-point alerts are refreshed hourly; none are stored yet.</p>';
  $$('#fw-glofas tr.click').forEach(tr=>tr.onclick=()=>{const [la,lo]=tr.dataset.ll.split(',').map(Number);location.hash='map';setTimeout(()=>{if(!ovl.glofas)toggleOverlay('glofas');map.flyTo([la,lo],9)},150)});
  $('#fw-gdacs').innerHTML=gd.length?`<div class="tbl-wrap" style="max-height:360px"><table class="dt"><thead><tr><th>Dates</th><th>Alert</th><th>Where</th><th>Reported impact</th><th></th></tr></thead><tbody>${gd.slice(0,40).map(e=>{const old=((fw.gdacs||{}).events||[]).find(o=>o.id===e.id)||{};const im=e.impact||old.impact||{};const st=e.st||old.st||stateAt(e.lo,e.la);const IML={death:'dead',missing:'missing',injured:'injured',displaced:'displaced',affected:'affected',houses:'houses damaged',evacuated:'evacuated'};const parts=Object.entries(im).filter(([k,v])=>v).map(([k,v])=>`${fmt.format(v)} ${esc(IML[k]||k)}`);return`<tr><td>${dshort(e.from)} – ${dshort(e.to)}${e.cur?' <span class="tag">active</span>':''}</td><td><span class="status" style="color:${GDC[e.alert]||'var(--muted)'}">${esc(e.alert||'')}</span></td><td>${esc(st||'Nigeria')}</td><td>${parts.join(' · ')||'<span style="color:var(--muted)">–</span>'}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener">GDACS report ↗</a></td></tr>`}).join('')}</tbody></table></div>`:'<p class="loading">No GDACS flood events for Nigeria in the last 120 days.</p>';
  const top=(GG.reaches||[]).slice(0,12);
  $('#fw-gg').innerHTML=top.length?`<div class="tbl-wrap" style="max-height:320px"><table class="dt"><thead><tr><th>Where</th><th class="n">Catchment km²</th><th class="n">Forecast flow m³/s</th><th>Return period</th></tr></thead><tbody>${top.map(r=>`<tr class="click" data-ll="${r.la},${r.lo}"><td>${esc(r.st||'Nigeria')} <span class="mono" style="font-size:11px;color:var(--muted)">${r.comid}</span></td><td class="n">${fmt.format(r.km2)}</td><td class="n">${fmt.format(Math.round(r.q))}</td><td><span class="status" style="color:${rpCol(r.rp)}">${r.rp}-year</span></td></tr>`).join('')}</tbody></table></div><p class="sm-note">Largest rivers among those forecast above a flood flow, from the last hourly refresh. The map layer is fetched live. Very small streams can be flagged by the model when local rain is heavy.</p>`:'';
  $$('#fw-gg tr.click').forEach(tr=>tr.onclick=()=>{const [la,lo]=tr.dataset.ll.split(',').map(Number);location.hash='map';setTimeout(()=>{if(!ovl.geoglows)toggleOverlay('geoglows');map.flyTo([la,lo],9)},150)});
  // GEOGLOWS lines on gauge cards
  Object.entries(GG.gauges||{}).forEach(([k,g])=>{const el=$(`.gcard[data-g="${k}"] .ggl`);if(!el)return;
    el.innerHTML=`Second model, GEOGLOWS (ECMWF): peak ${fmt.format(Math.round(g.peak))} m³/s around ${dshort(g.peakDate)}${g.rp?` <span class="status" style="color:${rpCol(g.rp)}">above ${g.rp}-year flow</span>`:''}`});
}
function startFloodTimer(){if(fwTimer)return;fwTimer=setInterval(()=>{if(!document.hidden&&($('#v-flood')&&!$('#v-flood').hidden||ovl.gdacs||ovl.geoglows||ovl.glofas)){refreshLive();['gdacs','geoglows','glofas'].forEach(k=>{if(ovl[k]){map.removeLayer(ovl[k]);ovl[k]=null;toggleOverlay(k)}})}},15*60e3)}
async function addFloodLive(){
  const host=$('#fw-host');if(!host)return;
  host.innerHTML=`<div class="box" style="margin-bottom:18px"><h3>Live flood alerts <small id="fw-when">Loading…</small></h3>
   <div class="kpis" id="fw-kpi" style="margin-bottom:12px"><div class="kpi"><b>…</b><span>loading</span></div></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button class="btn sm" data-lay="glofas" type="button">GloFAS alerts on map</button><button class="btn sm" data-lay="geoglows" type="button">High river flows on map</button><button class="btn sm" data-lay="gdacs" type="button">GDACS events on map</button><button class="btn sm" data-lay="hazard" type="button">100-year flood zone</button><button class="btn sm" id="fw-now" type="button">Refresh now</button></div>
   <h4 class="h4">Official GloFAS flood alerts at reporting points</h4><div id="fw-glofas"></div>
   <h4 class="h4" style="margin-top:14px">GDACS flood events, last 120 days</h4><div id="fw-gdacs"></div>
   <h4 class="h4" style="margin-top:14px">Rivers forecast above flood flows (GEOGLOWS)</h4><div id="fw-gg"></div></div>`;
  $$('#fw-host [data-lay]').forEach(b=>b.onclick=()=>{const k=b.dataset.lay;location.hash='map';setTimeout(()=>{if(!ovl[k])toggleOverlay(k)},150)});
  $('#fw-now').onclick=()=>{$('#fw-when').textContent='Refreshing…';refreshLive()};
  await refreshLive();startFloodTimer();
}
/* ---------- map overlays ---------- */
async function floodOverlay(k){
  if(k==='nimet')return nimetOverlay();
  if(k==='nimetfc')return nimetFcOverlay();
  if(k==='glofas'){await fwData();const g=L.layerGroup();
    if(LIVE)L.tileLayer.wms(GLOFAS_WMS,{layers:'FloodSummary1_30',format:'image/png',transparent:true,version:'1.3.0',time:((FW.glofas||{}).time||'')+'',opacity:.85,attribution:'Flood forecasts: Copernicus EMS GloFAS'}).addTo(g);
    glofasRows().forEach(p=>{if(p.la==null)return;const c=ALERTC[p.alert]||((p.p2||0)>0?'var(--s1)':'var(--s0)');L.circleMarker([p.la,p.lo],{renderer:canvas,radius:6,color:css('--panel'),weight:1.5,fillColor:css(c.slice(4,-1)),fillOpacity:.95})
      .bindTooltip(`<b>${esc(gname(p))}</b> (${esc(p.river&&p.river!=='NA'?p.river:'')}${p.id!=='NA'?', GloFAS '+esc(p.id):''})<br>Chance of exceeding 2-/5-/20-year flood: ${p.p2??'–'}% / ${p.p5??'–'}% / ${p.p20??'–'}%<br>Alert: ${esc(p.alert||'none')}${p.peak?' · highest chance '+esc(p.peak):''}`,{className:'tip',sticky:true}).addTo(g)});return g}
  if(k==='geoglows'){const g=L.layerGroup();let R=null;try{R=LIVE?await liveReaches():null}catch(e){}
    if(R){LIVEFW.reaches=R;R.forEach(r=>{r.paths.forEach(p=>L.polyline(p.map(c=>[c[1],c[0]]),{renderer:canvas,color:css(rpCol(r.rp).slice(4,-1)),weight:r.so>=6?3.5:r.so>=4?2.5:1.6,opacity:.95}).bindTooltip(`Forecast above the <b>${r.rp}-year</b> flood flow<br>${fmt.format(Math.round(r.q))} m³/s · catchment ${fmt.format(r.km2)} km²`,{className:'tip',sticky:true}).addTo(g))})}
    else{await fwData();((FW.geoglows||{}).reaches||[]).forEach(r=>{if(r.la!=null)L.circleMarker([r.la,r.lo],{renderer:canvas,radius:5,color:css('--panel'),weight:1,fillColor:css(rpCol(r.rp).slice(4,-1)),fillOpacity:.9}).bindTooltip(`Forecast above the ${r.rp}-year flood flow`,{className:'tip'}).addTo(g)})}
    return g}
  if(k==='gdacs'){const g=L.layerGroup();let E=null;try{E=LIVE?await liveGdacs():null}catch(e){}if(!E){await fwData();E=(FW.gdacs||{}).events||[]}
    E.forEach(e=>{if(e.la==null)return;L.circleMarker([e.la,e.lo],{renderer:canvas,radius:e.cur?9:6,color:'#fff',weight:e.cur?2.5:1,fillColor:GDC[e.alert]||'#888',fillOpacity:e.cur?.95:.6}).bindTooltip(`<b>GDACS ${esc(e.alert)} flood</b>${e.cur?' (active)':''}<br>${dshort(e.from)} – ${dshort(e.to)}`,{className:'tip'}).on('click',()=>window.open(e.url,'_blank','noopener')).addTo(g)});return g}

async function addFloodHistory(){

    rows:()=>all.map(y=>({year:y,dfo_floods:y<=dmax?(yrs[y]||{}).dfo||0:null,gdacs_floods:(yrs[y]||{}).gdacs||0}))}));
  cards.push(card({t:'Deaths in large floods each year',s:'People killed, as recorded by the Dartmouth Flood Observatory archive. Hover for people displaced.',src:'<a href="https://floodobservatory.colorado.edu/Archives/index.html" target="_blank" rel="noopener">Dartmouth Flood Observatory</a> (Brakenridge, G.R., Global Active Archive of Large Flood Events)',file:'nigeria_flood_deaths_dfo',page:'flood',
    draw:el=>cols(el,all.filter(y=>y<=dmax).map(y=>({l:String(y),v:(yrs[y]||{}).dead||0,c:'var(--s2)'})),{f:v=>fmt.format(v)+' dead'}),rows:()=>all.filter(y=>y<=dmax).map(y=>({year:y,dead:(yrs[y]||{}).dead||0,displaced:(yrs[y]||{}).disp||0}))}));

    ...G.map(e=>({d:e.from,to:e.to,src:'GDACS',where:e.st||(e.regions||[]).slice(0,3).join(', '),lvl:e.alert,dead:(e.impact||{}).death,disp:(e.impact||{}).displaced??(e.impact||{}).affected,cause:'',url:e.url}))].sort((a,b)=>b.d.localeCompare(a.d));
  const W=Object.entries(H.wiki||{}).map(([title,v])=>({title,ex:v.t,u:v.u,y:+((title.match(/\d{4}/)||(v.t||'').match(/\b(?:19|20)\d{2}\b/)||[0])[0])})).sort((a,b)=>b.y-a.y);
  host.innerHTML=`<h3 class="sh">Flood history of Nigeria, ${y0}–${y1}</h3><p class="lede" style="margin-bottom:12px">${fmt.format(D.length)} large floods in the Dartmouth Flood Observatory archive and ${fmt.format(G.length)} flood events recorded by GDACS. Reported deaths and displacement are as the sources give them and are often incomplete. <button class="btn sm" id="fh-map" type="button">Show past floods on the map</button></p>
  <div class="grid2">${cards.map(c=>c.html).join('')}</div>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px"><select id="fh-src" aria-label="Source"><option value="">Both archives</option><option value="DFO">Dartmouth Flood Observatory</option><option value="GDACS">GDACS</option></select><input id="fh-q" type="text" placeholder="Filter by state or year" style="max-width:220px"><button class="btn sm" id="fh-csv" type="button">Download CSV</button></div>
  <div class="tbl-wrap" style="max-height:440px"><table class="dt"><thead><tr><th>Began</th><th>Ended</th><th>Where</th><th>Source</th><th>Level</th><th class="n">Dead</th><th class="n">Displaced / affected</th><th>Cause</th></tr></thead><tbody id="fh-body"></tbody></table></div>
  ${W.length?`<h3 class="sh">Major floods</h3><div class="grid2">${W.map(w=>`<article class="card"><h3>${esc(w.title)}</h3><p class="wiki">${esc(w.ex||'')}</p><div class="foot"><span>From <a href="${esc(w.u||'')}" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA 4.0)</span></div></article>`).join('')}</div>`:''}`;
  cards.forEach(c=>c.mount());
  if(W.length){const g=$('#ev-old');if(g){[...g.children].forEach(a=>{if(!/Lagdo/.test(a.textContent))a.remove()});if(!g.children.length){g.remove();$('#ev-old-h').remove()}else $('#ev-old-h').textContent='Upstream: Lagdo Dam'}}
  const fil=()=>{const s=$('#fh-src').value,q=$('#fh-q').value.trim().toLowerCase();return ev.filter(e=>(!s||e.src===s)&&(!q||(e.where+' '+e.d).toLowerCase().includes(q)))};

  $('#fh-map').onclick=()=>{location.hash='map';setTimeout(()=>{if(!ovl.history)toggleOverlay('history')},150)};
}

<script>

let NM={alerts:null,live:0,at:null};

async function nimetLive(){
  const t=await (await fetch(NIMET_CAP,{cache:'no-store'})).text();
  const items=[...new DOMParser().parseFromString(t,'text/xml').querySelectorAll('item')].slice(0,12);
  const out=await Promise.all(items.map(async it=>{const u=(it.querySelector('link')||{}).textContent;if(!u)return null;
    try{const x=new DOMParser().parseFromString(await (await fetch(u.trim())).text(),'text/xml');const g=n=>{const e=x.getElementsByTagNameNS('*',n)[0];return e?e.textContent.trim():null};
      const poly=[...x.getElementsByTagNameNS('*','polygon')].map(p=>p.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1]))).filter(p=>p.length>2);
      return{id:u.trim().split('/').pop().replace('.xml',''),u:u.trim(),sent:g('sent'),event:g('event'),head:g('headline')||(it.querySelector('title')||{}).textContent,sev:g('severity'),urg:g('urgency'),cert:g('certainty'),onset:g('onset')||g('effective'),exp:g('expires'),desc:g('description'),instr:g('instruction'),area:g('areaDesc'),poly}}catch(e){return null}}));

function renderBulletins(){

const fcRank=c=>/heavy/i.test(c||'')?3:/rain|shower|drizzle/i.test(c||'')?2:/thunder/i.test(c||'')?1:0;
const FCC=['var(--s0)','var(--s1)','var(--s2)','var(--s3)'],FCL=['Dry or cloudy','Thunderstorms','Rain or thunderstorms with rain','Heavy rain'];

  const act=A.filter(isActive);(act.length?act:A.slice(0,1)).forEach(a=>{const on=isActive(a);(a.poly||[]).forEach(p=>L.polygon(p,{color:css(SEVC[a.sev]||'--s0'),weight:on?2:1.5,dashArray:on?null:'5 5',fillOpacity:on?.25:0,opacity:on?.95:.7})
    .bindTooltip(`<b>${esc(a.event||'')}</b> (${esc(a.sev||'')})${on?'':' – expired'}<br>${dtime(a.onset)} – ${dtime(a.exp)}<br>${esc((a.area||'').slice(0,160))}`,{className:'tip',sticky:true}).addTo(g))});
  if(!act.length)toast(A.length?'No NiMet warning in force; showing the latest, expired one':'No NiMet warning areas to show right now');return g}

const SPI=[[1981,-1.3],[1982,-2.4],[1983,-4.2],[1984,-2.2],[1985,-1.5],[1986,-2.5],[1987,-2.1],[1988,-.9],[1989,-1.4],[1990,-1.1],[1991,-.1],[1992,-1.3],[1993,-1.7],[1994,-.8],[1995,.2],[1996,-.3],[1997,-.2],[1998,-1.0],[1999,.7],[2000,-.9],[2001,-1.4],[2002,-.5],[2003,-.5],[2004,-.7],[2005,-.8],[2006,.1],[2007,.6],[2008,.1],[2009,.1],[2010,.2],[2011,.2],[2012,2.1],[2013,-.1],[2014,.9],[2015,-.3],[2016,.7],[2017,.1],[2018,1.1],[2019,3.3],[2020,.1],[2021,-.1],[2022,1.1],[2023,1.3],[2024,.2],[2025,.5]];
const R100=[['Abeokuta',125.6,1,1813],['Asaba',164.4,3,1388.1],['Bauchi',107.3,1,1554],['Benin',126.7,2,2556.9],['Bida',122.3,1,1076],['Calabar',121.6,4,3135.6],['Eket',128.2,3,3315.2],['Enugu',115,2,1714.2],['Ibadan',136.4,2,1598.4],['Ikom',100.9,1,2770.9],['Ilorin',108.7,1,1073.5],['Lafia',150.5,1,1844.2],['Lagos (Roof)',124.3,2,1454.2],['Maiduguri',140.5,3,1426.9],['Port Harcourt',108.1,1,2363],['Potiskum',114.9,1,875.1],['Shaki',125.6,3,1558.4],['Sokoto',107,2,1851.4],['Umuahia',157.3,2,1921],['Uyo',159.3,5,3833.5],['Warri',114.1,1,2518.6],['Yenagoa',115.3,3,3489.8]];
function pmcols(el,pts,o={}){
  const W=560,H=230,pl=40,pb=24,pt=10,iw=W-pl-10,ih=H-pb-pt,mx=Math.max(...pts.map(p=>Math.abs(p.v)))*1.1||1,bw=iw/pts.length,y0=pt+ih/2,sc=v=>v/mx*ih/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">`;
  [-mx*.9,-mx*.45,0,mx*.45,mx*.9].map(v=>Math.round(v*2)/2).forEach(t=>{const y=y0-sc(t);s+=`<line class="gridl" x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${t>0?'+':''}${fmt1.format(t)}</text>`});
  pts.forEach((p,i)=>{const h=sc(p.v),x=pl+i*bw;s+=`<g data-i="${i}"><rect x="${x}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/><rect x="${x+bw*.15}" y="${h>=0?y0-h:y0}" width="${bw*.7}" height="${Math.max(.5,Math.abs(h))}" rx="1.5" fill="${p.v>=0?'var(--bar)':'var(--s2)'}"/></g>`;
    if(i%5===0||i===pts.length-1)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${esc(p.l)}</text>`});
  el.innerHTML=s+'</svg>';
  el.querySelectorAll('g[data-i]').forEach(g=>{const p=pts[+g.dataset.i];g.onmousemove=e=>{const bb=el.getBoundingClientRect();tip(el,`<b>${esc(p.l)}</b> · ${o.f?o.f(p.v):p.v}`,e.clientX-bb.left,e.clientY-bb.top)};g.onmouseleave=hideTip});
}
async function addRainNimet(){
  const el=$('#nm-rain');if(!el)return;let S=null;try{S=await loadJSON('srp.json')}catch(e){}
  const cards=[];const socnSrc=`<a href="${SOCN.u}" target="_blank" rel="noopener">NiMet, 2025 State of the Climate in Nigeria</a>`;
  const rank=[...SPI].sort((a,b)=>b[1]-a[1]);
  cards.push(card({t:'Wet and dry years since 1981',s:`Standardised rainfall anomaly for Nigeria from 47 NiMet weather stations, against the 1991–2020 normal. Above zero is wetter than normal. 2025 was the ${rank.findIndex(r=>r[0]===2025)+1}th wettest of ${SPI.length} years; 2019 and 2012 were the wettest, 1983 the driest. Pages 19–23.`,src:socnSrc+' (Tables 2.1 and 2.2)',file:'nigeria_standardised_rainfall_anomaly_nimet',page:'rain',
    draw:e=>pmcols(e,SPI.map(r=>({l:String(r[0]),v:r[1]})),{f:v=>(v>0?'+':'')+fmt1.format(v)+' standard deviations'}),rows:()=>SPI.map(r=>({year:r[0],standardised_anomaly:r[1],rank_wettest:rank.findIndex(x=>x[0]===r[0])+1}))}));
  cards.push(card({t:'Heaviest one-day rain at NiMet stations, 2025',s:'Highest rainfall in a single day (mm), where it reached 100 mm or more. Hover for the number of such days and the year’s total. Uyo had five days over 100 mm. Pages 44–45 (the table is headed 2024 in the report; the text describes 2025).',src:socnSrc+' (Table 4.3)',file:'nimet_one_day_rainfall_100mm_2025',page:'rain',
    draw:e=>hbar(e,[...R100].sort((a,b)=>b[1]-a[1]).map(r=>({l:r[0],v:r[1],t:`${r[2]} day${r[2]>1?'s':''} ≥100 mm · ${fmt.format(Math.round(r[3]))} mm in the year`})),{rh:17,f:v=>fmt1.format(v)+' mm'}),rows:()=>R100.map(r=>({station:r[0],highest_1day_mm:r[1],days_100mm_plus:r[2],annual_total_mm:r[3]}))}));
  let srpHtml='';
  if(S&&S.states){
    const st=Object.keys(S.states).sort();const avg=st.map(n=>{const r=S.states[n].filter(x=>x[4]);return{n,v:Math.round(r.reduce((a,b)=>a+b[4],0)/(r.length||1)),k:r.length}}).sort((a,b)=>b.v-a.v);
    cards.unshift(card({t:`NiMet’s rainfall prediction for ${esc(S.year)}, by state`,s:'Average of the predicted annual rainfall across each state’s local government areas (mm). Choose a state below for every LGA’s predicted onset, end and length of the rainy season.',src:`<a href="${esc(S.u)}" target="_blank" rel="noopener">${esc(S.src)}</a>`,file:'nimet_srp_'+S.year+'_by_state',page:'rain',
      draw:e=>hbar(e,avg.map(a=>({l:a.n,v:a.v,t:`${a.k} LGAs`,on:()=>{$('#srp-st').value=a.n;drawSrp()}})),{rh:17,f:v=>fmt.format(v)+' mm'}),
      rows:()=>st.flatMap(n=>S.states[n].map(r=>({state:n,lga:r[0],onset:r[1],end:r[2],season_days:r[3],annual_rainfall_mm:r[4]})))}));
    srpHtml=`<div class="box" style="margin-bottom:18px"><h3>Rainy season ${esc(S.year)} by local government area</h3><div class="filterbar" style="margin:6px 0"><div><div class="lbl">State</div><select id="srp-st">${st.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><div style="align-self:end"><button class="btn sm" id="srp-csv" type="button">Download CSV</button></div></div>
     <div class="tbl-wrap" style="max-height:380px"><table class="dt"><thead><tr><th>LGA</th><th>Rains start</th><th>Rains end</th><th class="n">Season (days)</th><th class="n">Rainfall (mm)</th></tr></thead><tbody id="srp-body"></tbody></table></div>
     <p class="sm-note">Predicted dates and totals from NiMet’s Seasonal Climate Prediction, issued each February and updated during the season. Planting is safest after the onset date. For 2025 NiMet reports 94% accuracy for onset and 88% for annual rainfall.${scite('79–80')} <a href="https://nimet.gov.ng/srp" target="_blank" rel="noopener">NiMet SRP ↗</a></p></div>`;
  }
  el.innerHTML=`<h3 class="sh">From NiMet, Nigeria’s weather service</h3>${srpHtml}<div class="grid2">${cards.map(c=>c.html).join('')}</div>
   <div class="box" style="margin-top:4px"><h3>2025 in NiMet’s State of the Climate report</h3>${sfacts([
    ['Rainfall ranged from about 400 mm in the far north to 3,900 mm on the coast; the lowest station total was 519.3 mm in Yobe and the highest 3,668.7 mm in Akwa Ibom.',10],
    ['Maiduguri had 109% and Sokoto 170% more rain than normal; Uyo +51%, Abeokuta +48%. Abuja (−45%), Kano (−38%), Enugu (−30%) and Ilorin (−26%) were drier than normal.',11],
    ['Calabar had the most rain days (165) and Nguru in Yobe the fewest (32).',12],
    ['The August break (little dry season) began on 9 July in Ilorin and Abeokuta and was weaker than in 2024; Ibadan still recorded 148.6 mm between 23 July and 3 August.',16],
    ['Severe dry spells of 21 days or more hit Kwara and Oyo and parts of Borno, Sokoto, Niger, Kogi, Nasarawa and Plateau, damaging crops; the longest run of dry days was 21 in Kwara and Lagos.','16, 18'],
    ['Since 2006 almost every year has been wetter than normal (except 2013, 2015 and 2021): Nigeria has moved away from the droughts of the 1980s and 1990s, most clearly in the north.','19–21'],
    ['Dry spells lowered reservoirs, cut hydropower and irrigation supply, and caused water rationing; Kwara was among the worst hit.',65],
    ['Nine of the ten years 2016–2025 are among the twelve warmest on record. Nguru had 100 days above 40 °C in 2025; Yola reached 45.0 °C.','iii']])}
    <p class="sm-note">${esc(SOCN.c)} <a href="${SOCN.u}" target="_blank" rel="noopener">Report ↗</a></p></div>`;
  cards.forEach(c=>c.mount());
  if(S&&S.states){$('#srp-st').onchange=drawSrp;$('#srp-csv').onclick=()=>{const n=$('#srp-st').value;saveFile(`nimet_srp_${S.year}_${n.toLowerCase().replace(/\W+/g,'_')}.csv`,toCSV(S.states[n].map(r=>({state:n,lga:r[0],onset:r[1],end:r[2],season_days:r[3],annual_rainfall_mm:r[4]}))),'text/csv')};
    const pref=state.st&&S.states[state.st]?state.st:'FCT';if(S.states[pref])$('#srp-st').value=pref;drawSrp()}
  function drawSrp(){const n=$('#srp-st').value;$('#srp-body').innerHTML=(S.states[n]||[]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]||'–')}</td><td>${esc(r[2]||'–')}</td><td class="n">${r[3]??'–'}</td><td class="n">${r[4]!=null?fmt.format(r[4]):'–'}</td></tr>`).join('')}
}
