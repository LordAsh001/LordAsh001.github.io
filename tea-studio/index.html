<style>
/* Layout: an engineer's cost ledger — step rail across the top, a live KPI strip over the working sheet, a guide/assistant column on the right. Sibling of Lifecycle Studio: same type system, ink-blue and brass instead of teal. */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --panel-2:#F5F7FA; --ink:#16202E; --ink-2:#566175; --line:#D3D9E2; --grid:#EAEEF3;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --accent-soft:#DDE7F2; --brass:#9A6A14; --brass-soft:#F6EEDC;
  --good:#2F7D4F; --warn:#9A6412; --crit:#B23B3B; --warn-soft:#FBF1DF; --good-soft:#E3F1E8; --crit-soft:#F8E5E5;
  --c1:#1F4E79; --c2:#9A6A14; --c3:#2F7D4F; --c4:#8A4B7E; --c5:#3F7F8C; --c6:#7A6555; --c7:#B23B3B; --c8:#5B6B8C;
  --f-disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E3E9F1; --ink-2:#9DA9BB; --line:#2B3647; --grid:#222C3A;
  --accent:#7FAEE0; --accent-ink:#0C1420; --accent-soft:#1C2D42; --brass:#D9A84E; --brass-soft:#33291A;
  --good:#6CC08F; --warn:#E0A94F; --crit:#EC7A7A; --warn-soft:#33291A; --good-soft:#1A3025; --crit-soft:#3A1F22;
  --c1:#7FAEE0; --c2:#D9A84E; --c3:#6CC08F; --c4:#C68AC0; --c5:#6FC0CC; --c6:#B79E86; --c7:#EC7A7A; --c8:#A3B2D6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131B; --panel:#161D28; --panel-2:#1B2330; --ink:#E3E9F1; --ink-2:#9DA9BB; --line:#2B3647; --grid:#222C3A;
  --accent:#7FAEE0; --accent-ink:#0C1420; --accent-soft:#1C2D42; --brass:#D9A84E; --brass-soft:#33291A;
  --good:#6CC08F; --warn:#E0A94F; --crit:#EC7A7A; --warn-soft:#33291A; --good-soft:#1A3025; --crit-soft:#3A1F22;
  --c1:#7FAEE0; --c2:#D9A84E; --c3:#6CC08F; --c4:#C68AC0; --c5:#6FC0CC; --c6:#B79E86; --c7:#EC7A7A; --c8:#A3B2D6; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1} h2{font-size:1.5rem} h3{font-size:1.08rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.875rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:.4em 0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-disp);font-size:1.22rem;white-space:nowrap}
.brand b i{font-style:normal;color:var(--brass)}
.brand span{color:var(--ink-2);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 12px;cursor:pointer;font-size:.86rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.rail{display:flex;overflow-x:auto;padding:0 16px;border-top:1px solid var(--line)}
.rail button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px 8px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap;color:var(--ink-2)}
.rail button .n{font-family:var(--f-mono);font-size:.78rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.rail button.done .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rail button:disabled{opacity:.45;cursor:not-allowed}
.altbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
.altchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.86rem;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.altchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;padding:18px 16px 60px;max-width:1440px;margin:0 auto}
@media (max-width:1040px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.lead{font-size:1.05rem;color:var(--ink-2);max-width:70ch}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--crit);background:var(--crit-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;min-width:0}
label.f .h{font-weight:400;color:var(--ink-2);font-size:.82rem}
input[type=text],input[type=number],select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input.bad{border-color:var(--crit);background:var(--crit-soft)}
textarea{resize:vertical;min-height:60px}
input[type=number],input.expr{font-family:var(--f-mono);font-size:.9rem}
details>summary{cursor:pointer;color:var(--accent);font-weight:600}

/* KPI strip */
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kstrip>div{background:var(--panel);padding:10px 14px;min-width:0}
.kstrip .l{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kstrip .v{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--good)} .neg{color:var(--crit)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel);min-width:0}
.kpi .v{font-family:var(--f-disp);font-size:1.75rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.kpi .u{font-size:.84rem;color:var(--ink-2)}
.verdict{border-radius:var(--r);padding:12px 16px;border:1px solid var(--line);font-size:1.02rem}
.verdict.ok{background:var(--good-soft);border-color:var(--good)} .verdict.no{background:var(--crit-soft);border-color:var(--crit)} .verdict.mid{background:var(--warn-soft);border-color:var(--warn)}

/* Library */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.ledger{font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:12px 14px;display:grid;gap:4px}
.ledger div{display:flex;justify-content:space-between;gap:10px}
.ledger .tot{border-top:1px solid var(--ink-2);padding-top:4px;font-weight:600}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.lib-item{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.lib-item:hover{border-color:var(--accent)}
.lib-item b{font-weight:700}
.lib-item span{font-size:.86rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.brass{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}

/* Options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--panel)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt b{display:block} .opt span{font-size:.86rem;color:var(--ink-2)}

/* Parameters */
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.param{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel);min-width:0}
.param.confirmed{border-left:4px solid var(--good)} .param.pending{border-left:4px solid var(--warn)}
.param .lab{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.param .lab code{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);font-weight:400}
.param .val{display:flex;gap:8px;align-items:center}
.param .val input{flex:1}
.param .u{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.param details{font-size:.88rem;color:var(--ink-2)}
.param .src{display:flex;gap:8px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.param .src select{font-size:.85rem;padding:3px 6px;width:auto}
.rngrow{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.rngrow input{width:90px}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t td.num{white-space:nowrap;font-family:var(--f-mono);font-size:.86rem;text-align:right}
table.t tr.sum td{font-weight:700;border-top:1px solid var(--ink-2);background:var(--panel-2)}
table.t input,table.t select{padding:4px 6px;font-size:.86rem}
table.t .w-n{min-width:170px} table.t .w-e{min-width:120px} table.t .w-s{min-width:74px;max-width:96px}
table.edit{min-width:820px}
table.eqt{min-width:1180px}
.nw{white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.nw input{width:78px} .nw input.w-e{width:104px}
table.eqt td:first-child input{min-width:190px}
@media (max-width:700px){.top{position:static}}
.coach{border-color:var(--brass);border-width:1px 1px 1px 4px;display:flex;flex-direction:column;gap:8px}
.coach[hidden]{display:none}
@media (max-width:640px){ .lgonly{display:none} .top-actions{gap:4px} }
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.coach-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.coach-head .btn{margin-left:auto}
.coach h3{font-size:1.05rem}
.coach-sec{font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.coach-h{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700}
.eqn{font-family:var(--f-mono);font-size:.84rem;background:var(--brass-soft);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:normal;line-height:1.5}
.coach-hl{outline:3px solid var(--brass)!important;outline-offset:3px;border-radius:6px}
[data-coach]{cursor:help}
@media (max-width:1040px){
  .coach{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:46vh;overflow:auto;border-radius:12px 12px 0 0;margin:0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .coach.min{max-height:none}
  body.coach-open .wrap{padding-bottom:48vh}
}
.libr{border-bottom:1px solid var(--grid);padding-bottom:10px}.libr a{color:var(--ink);text-decoration:none}.libr a:hover{color:var(--accent);text-decoration:underline}
.cs-cite{font-size:.84rem;color:var(--ink-2);border-left:3px solid var(--line);padding-left:10px}
.cf td,.cf th{white-space:nowrap}
.minibar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;min-width:50px}
.minibar i{display:block;height:100%;background:var(--accent)}
.warnline{color:var(--warn);font-size:.8rem}

/* Assumptions */
.asm{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.asm.agreed{border-left:4px solid var(--good)} .asm.changed{border-left:4px solid var(--accent)} .asm.pending{border-left:4px solid var(--warn)}
.progress{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);min-width:0;overflow-x:auto}
.chartbox canvas{display:block;max-width:none}
.interp p{max-width:78ch}

aside{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:1040px){.side{position:static;max-height:none}}
.guide p,.guide li{font-size:.93rem}
.guide ul{padding-left:18px;margin:.4em 0}
.chat{display:flex;flex-direction:column;gap:8px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.msg{padding:8px 10px;border-radius:8px;font-size:.92rem;white-space:pre-wrap}
.msg.u{background:var(--accent-soft);align-self:flex-end;max-width:90%}
.msg.a{background:var(--panel-2);border:1px solid var(--line)}
.chg{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;font-size:.86rem}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:.92rem}
.banner.ok{border-color:var(--good);background:var(--good-soft)} .banner.info{border-color:var(--accent);background:var(--accent-soft)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,26,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .body{padding:12px 16px;overflow:auto}
.pick-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--grid);padding:8px 4px;cursor:pointer;font:inherit;color:inherit}
.pick-list button:hover{background:var(--panel-2)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;z-index:60;font-size:.92rem}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.guided-only{} body.expert .guided-only{display:none}
.expert-only{display:none} body.expert .expert-only{display:revert}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Techno-Economic <i>Studio</i></b><span id="studyName"></span></div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Level of detail"><button id="mGuided" aria-pressed="true">Guided</button><button id="mExpert" aria-pressed="false">Expert</button></div>
      <button class="btn sm" id="btnCoach" aria-pressed="true">Coach: on</button>
      <button class="btn sm ghost" id="btnNew">New<span class="lgonly"> study</span></button>
      <button class="btn sm ghost" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
      <button class="btn sm ghost" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>↷</button>
      <button class="btn sm ghost" id="btnHelp" title="Glossary and search (/)">Search</button>
      <button class="btn sm ghost" id="btnSrc" data-go="sources">Sources</button>
      <button class="btn sm ghost" id="btnShare">Share</button>

/* ---------- Depreciation ---------- */
const MACRS = {3:[33.33,44.45,14.81,7.41],5:[20,32,19.2,11.52,11.52,5.76],7:[14.29,24.49,17.49,12.49,8.93,8.92,8.93,4.46],
  10:[10,18,14.4,11.52,9.22,7.37,6.55,6.55,6.56,6.55,3.28],15:[5,9.5,8.55,7.7,6.93,6.23,5.9,5.9,5.91,5.9,5.91,5.9,5.91,5.9,5.91,2.95],
  20:[3.75,7.219,6.677,6.177,5.713,5.285,4.888,4.522,4.462,4.461,4.462,4.461,4.462,4.461,4.462,4.461,4.462,4.461,4.462,4.461,2.231]};
const DEPR = {
  sl:{n:"Straight line",use:"Simple and common in academic TEA. Equal amounts each year."},
  ddb:{n:"Double declining balance",use:"Front-loaded; switches to straight line when that becomes larger."},
  syd:{n:"Sum of the years' digits",use:"Front-loaded, smoother than declining balance."},
  macrs:{n:"MACRS (United States)",use:"US tax depreciation (half-year convention). Most US TEAs (e.g. NREL) use 7-year MACRS for process plants."},
  db:{n:"Declining balance at a fixed rate (e.g. Canada CCA)",use:"Canada's Capital Cost Allowance and similar systems: a % of the remaining balance each year, half in the first year."},
  none:{n:"No depreciation (pre-tax view)",use:"For public-sector or non-taxed projects."}
};
function depSchedule(base, fin, N){
  const out=new Array(N).fill(0); const n=Math.max(1,Math.round(fin.depN||10));
  if(fin.dep==="none"||base<=0) return out;
  if(fin.dep==="sl"){ for(let i=0;i<Math.min(n,N);i++) out[i]=base/n; }
  else if(fin.dep==="macrs"){ const t=MACRS[fin.macrs||7]||MACRS[7]; for(let i=0;i<Math.min(t.length,N);i++) out[i]=base*t[i]/100; }
  else if(fin.dep==="syd"){ const s=n*(n+1)/2; for(let i=0;i<Math.min(n,N);i++) out[i]=base*(n-i)/s; }
  else if(fin.dep==="ddb"){ let bv=base; for(let i=0;i<Math.min(n,N);i++){ const rem=n-i; const d=Math.max(bv*2/n, bv/rem); out[i]=Math.min(bv,d); bv-=out[i]; } }
  else if(fin.dep==="db"){ let bv=base; const r=(fin.dbRate||30)/100; for(let i=0;i<N;i++){ const d=bv*r*(i===0?0.5:1); out[i]=d; bv-=d; } }
  return out;
}

/* ---------- Expressions over inputs ---------- */
const MATH_OK = new Set(["min","max","pow","sqrt","exp","log","log10","abs","round","ceil","floor","PI"]);
const _fn = {};
function identsIn(expr){ return String(expr).match(/(?<![\w.])[A-Za-z_][A-Za-z0-9_]*/g)||[]; }
function checkExpr(expr, keys){
  const s=String(expr);
  if(!/^[\w\s+\-*/().,<>=?:!&|%]*$/.test(s)) return "Only numbers, input keys and + − × ÷ ( ) are allowed.";
  for(const id of identsIn(s)) if(!keys.includes(id)&&!MATH_OK.has(id)&&!/^\d/.test(id)) return `“${id}” is not an input key.`;
  return null;
}
function evalExpr(expr, P){
  if(typeof expr==="number") return expr;
  const s=String(expr==null?"":expr).trim(); if(s==="") return 0;
  if(/^-?\d+(\.\d+)?(e-?\d+)?$/i.test(s)) return +s;
  const keys=Object.keys(P); const err=checkExpr(s,keys); if(err) throw new Error(err);
  const id=keys.join(",")+"|"+s;
  let f=_fn[id]; if(!f){ f=_fn[id]=new Function(...keys,`const {min,max,pow,sqrt,exp,log,log10,abs,round,ceil,floor,PI}=Math; return (${s});`); }
  const v=f(...keys.map(k=>P[k]));
  if(typeof v!=="number"||!isFinite(v)) throw new Error("does not give a number");
  return v;
}
function safeEval(expr,P,fb){ try{ return evalExpr(expr,P); }catch(e){ return fb==null?0:fb; } }
function paramValues(m, over){
  const P={}; for(const p of m.params) P[p.k]=+p.v;
  if(over) for(const k in over) if(k in P) P[k]=over[k];
  for(const d of (m.derived||[])){ P[d[0]]=safeEval(d[1],P,0); }
  return P;
}

/* ---------- Capital cost ---------- */
function eqPurchased(e, P, cepciT){ // USD, US Gulf Coast basis, at target year, per unit × quantity
  const S=safeEval(e.s,P,0), q=Math.max(0,safeEval(e.q==null?1:e.q,P,1));
  let c=0;
  if(e.f==="tw") c=(+e.a + (+e.b)*Math.pow(Math.max(S,0),+e.e))*cepciT/TOWLER_BASE;
  else if(e.f==="lump") c=(+e.c)*cepciT/cepciOf(+e.y||2020);
  else c=(+e.c)*Math.pow(Math.max(S,1e-12)/(+e.r||1),+e.e)*cepciT/cepciOf(+e.y||2020);
  return {S,q,unit:c,tot:c*q};
}
function eqRange(e,P){ if(e.f!=="tw") return null; const S=safeEval(e.s,P,0); return (e.lo!=null&&(S<e.lo||S>e.hi))?`Size ${fmtN(S)} is outside the correlation range ${e.lo}–${e.hi}`:null; }
function capex(m, P, capMult){
  CEPCI_OV = (m.basis&&m.basis.cepciOv)||{};
  const B=m.basis, cx=m.capex, fx=+B.fx||1, lf=+B.lf||1, cT=+B.cepci||800, type=cx.type||"fluid";
  const rows=[]; let FCI=0, ISBL=0, sumPCE=0; const eq=[];
  const meth=cx.method;
  if(["lang","hand","towler","pt"].includes(meth)){
    for(const e of cx.eq){
      const r=eqPurchased(e,P,cT); const pce=r.tot*fx*lf; sumPCE+=pce;
      let inst=pce;
      if(meth==="hand") { const hk=(EQ_TYPES[e.t]||EQ_TYPES.misc)[1]; const hv=cx.handOv&&cx.handOv[hk]!=null&&cx.handOv[hk]!==""?+cx.handOv[hk]:HAND[hk]; inst=pce*(hv||2.5); }
      if(meth==="towler"){ const f=Object.assign({},TOWLER_F[type],cx.tf||{}); const mk=MATERIALS[e.mat]?e.mat:"cs"; const fm=cx.matOv&&cx.matOv[mk]!=null&&cx.matOv[mk]!==""?+cx.matOv[mk]:MATERIALS[mk][1]; inst=pce*((1+f.fp)*fm+f.fer+f.fel+f.fi+f.fc+f.fs+f.fl); }
      eq.push({e,S:r.S,q:r.q,pce,inst,warn:eqRange(e,P)});
    }
  }
  if(meth==="scale"){
    const s=cx.scale, cap=safeEval(s.cap,P,0);
    const base=(+s.c)*Math.pow(Math.max(cap,1e-12)/(+s.r||1),+s.e||0.6)*cT/cepciOf(+s.y||2020)*fx*lf/(+s.lf||1);
    rows.push(["Scaled plant cost (reference "+fmtN(+s.r)+" → "+fmtN(cap)+" "+(s.u||"")+")",base]); FCI=base;
  } else if(meth==="quote"){
    for(const q of cx.quote){ const v=safeEval(q.v,P,0); rows.push([q.n,v]); FCI+=v; }
  } else if(meth==="lang"){
    const del=sumPCE*(1+(+cx.deliv||0)/100); const L=cx.langF!=null&&cx.langF!==""?+cx.langF:LANG[cx.langSet||"lang1948"][type];
    rows.push(["Delivered equipment",del]); rows.push(["Installation, piping, instruments, buildings, engineering, contingency (Lang factor "+L.toFixed(2)+")",del*(L-1)]); FCI=del*L;
  } else if(meth==="pt"){
    const del=sumPCE*(1+(+cx.deliv||0)/100); const col=PT_COL[type];
    for(const it of PT_ITEMS){ const pct=(cx.ptOv&&cx.ptOv[it[0]]!=null)?+cx.ptOv[it[0]]:it[col]; const v=del*pct/100; rows.push([it[0],v,it[1]]); FCI+=v; }
  } else if(meth==="hand"||meth==="towler"){
    const f=Object.assign({},TOWLER_F[type],cx.tf||{});
    ISBL=eq.reduce((a,x)=>a+x.inst,0);
    if(meth==="hand") rows.push(["Installed equipment (ISBL, Hand factors)",ISBL]); else rows.push(["Installed equipment (ISBL)",ISBL]);
    const os=ISBL*f.os, de=(ISBL+os)*f.de, x=(ISBL+os)*f.x;
    rows.push(["Offsites and utilities (OSBL, "+Math.round(f.os*100)+"% of ISBL)",os]);
    rows.push(["Design & engineering ("+Math.round(f.de*100)+"%)",de]);
    rows.push(["Contingency ("+Math.round(f.x*100)+"%)",x]);
    FCI=ISBL+os+de+x;
  }
  const xc=(+cx.xc||0)/100; if(xc){ rows.push(["Additional project contingency ("+(xc*100).toFixed(0)+"%)",FCI*xc]); FCI*=1+xc; }
  const mult=capMult==null?1:capMult;
  FCI*=mult; if(mult!==1) rows.forEach(r=>r[1]*=mult);
  const fin=m.fin;
  const WC=FCI*(+fin.wc||0)/100, SU=FCI*(+fin.su||0)/100, LAND=safeEval(fin.land||0,P,0);
  const reps=(cx.rep||[]).map(r=>({n:r.n,v:safeEval(r.v,P,0)*mult,every:Math.max(1,Math.round(safeEval(r.every,P,10)))}));
  return {FCI,WC,SU,LAND,TCI:FCI+WC+SU+LAND,rows,eq,sumPCE,ISBL,reps,cls:+cx.cls||CAPEX_METHODS[meth].cls};
}

/* ---------- Annual operating cost & revenue at 100% capacity ---------- */
function annual(m, P, cap, ov){
  const lines=[]; let varC=0, fixC=0, labour=0;
  for(const it of m.opex){
    const q=safeEval(it.q,P,0), p=safeEval(it.p,P,0), v=q*p;
    lines.push({it,q,p,v});
    if(it.c==="labour"){ labour+=v; fixC+=v; } else if(it.fix) fixC+=v; else varC+=v;
  }
  const qMain=Math.max(0,safeEval(m.main.out,P,0));
  const pMain=ov&&ov.price!=null?ov.price:safeEval(m.main.price,P,0);
  const rev=[{n:m.main.n,q:qMain,p:pMain,v:qMain*pMain,main:true,fix:false}];
  for(const it of m.rev){ const q=safeEval(it.q,P,0), p=safeEval(it.p,P,0); rev.push({n:it.n,q,p,v:q*p,fix:!!it.fix,it}); }
  const f=m.fin.fx||{}; const pc=k=>(f[k]!=null?+f[k]:FIXED.find(x=>x.k===k).d)/100;
  const maint=cap.FCI*pc("maint"), ins=cap.FCI*pc("ins"), sup=labour*pc("sup"), lab=labour*pc("lab");
  const LSM=labour+sup+maint, ovh=LSM*pc("ovh"), adm=LSM*pc("adm");
  const fixedF={maint,ins,sup,lab,ovh,adm};
  const revPct=pc("sales")+pc("rd");
  return {lines,varC,fixC,labour,fixedF,fixedFTot:maint+ins+sup+lab+ovh+adm,rev,qMain,pMain,revPct};
}

/* ---------- Discounted cash flow ---------- */
function calculate(m, ov){
  ov=ov||{};
  const P=paramValues(m, ov.P);
  const fin=Object.assign({}, m.fin, ov.fin||{});
  const cap=capex(m,P,ov.capMult);
  const A=annual(m,P,cap,ov);

ion) are the likely cause.",

  note:"Rebuilt from the full text. ABE fermentation route at 1,000 t/day (41.7 t/h) of coffee cut stems and orange peel waste, 8,000 h/yr, US dollars of 2018 (Table 2, CEPCI-updated). Entered from the paper: product flows and net electricity export (Table 4), prices (Table 2), CAPEX US$36.88 M and every annual cost line (Table 5: raw materials 25.756, utilities 8.631, maintenance 2.545, labour 0.525, fixed & general 1.642, plant overhead 1.606 M US$/yr). These reproduce Table 5 revenues (US$42.93 M/yr) and cash costs; the paper's US$7.476 M/yr depreciation is approximated by straight-line over 5 years (US$7.38 M/yr, estimate). Because costs plus depreciation exceed revenues, no income tax (25%, p. 1389) is ever paid, so depreciation and tax do not affect the NPV. Cash-flow settings were taken from the NPV profile in Table 5 (p. 1394), digitised: the cumulative NPV curve is fitted best by discounting at 13% (the paper's stated annual interest rate, p. 1389; its 15% 'desired rate of return' gives a worse fit), with the construction outlay at start-up equal to CAPEX × 1.13 (−US$41.7 M), a loss-making first year (the 20-week start-up, p. 1389, modelled as 61.5% output in year 1) and no visible salvage or working-capital recovery at year 15. The tool therefore spends the capital one year before start-up (2-year construction, all in year 1) and uses r = 13%, no working capital and no salvage. The paper reports NPV at start-up (year 0 of its chart), while the tool discounts to the start of construction, so the NPV benchmark moves the tool's NPV forward by the construction period at r. The butanol production cost (Table 6, US$1.537/kg) is the paper's economic allocation of total annual cost (incl. depreciation) by revenue share (allocation factor 0.662 = butanol share of revenue); the benchmark recomputes it the same way. Remaining gap: the paper's steady annual cash flow implied by its chart (≈US$2.57 M/yr) is ≈US$0.34 M/yr higher than revenue minus the Table 5 cash costs /* -------- walkthrough stops -------- */
function entityKey(path){ const m=path.match(/^(params|capex\.eq|capex\.quote|capex\.rep|opex|rev|derived)\.(\d+)/); return m?m[1]+"."+m[2]:path; }
function walkStops(){
  const seen=new Set(), stops=[];
  document.querySelectorAll("#view [data-b], #view [data-coach]").forEach(el=>{ if(!el.offsetParent&&el.type!=="radio") return; const p=el.dataset.coach||el.dataset.b; const k=entityKey(p);
    if(/\.(src|ok|lo|hi)$/.test(p)&&seen.has(entityKey(p))) return; if(seen.has(k)) return; if(!coachFor(p)) return; seen.add(k); stops.push({path:p,el}); });
  return stops;
}
function startWalk(){ COACH.on=true; COACH.min=false; COACH.walk={i:0}; showStop(); }
function showStop(){
  const stops=walkStops(); const w=COACH.walk; if(!w) return;
  if(w.i>=stops.length){ const idx=STEPS.findIndex(s=>s.id===UI.step); if(idx<STEPS.length-1){ COACH.walk={i:0}; go(STEPS[idx+1].id); setTimeout(showStop,60); } else { COACH.walk=null; renderCoach(); toast("Walkthrough finished."); } return; }
  if(w.i<0){ const idx=STEPS.findIndex(s=>s.id===UI.step); if(idx>1){ go(STEPS[idx-1].id); setTimeout(()=>{ COACH.walk={i:walkStops().length-1}; showStop(); },60); } else { w.i=0; showStop(); } return; }
  const s=stops[w.i]; COACH.path=s.path; document.querySelectorAll(".coach-hl").forEach(x=>x.classList.remove("coach-hl"));
  const host=s.el.closest(".param,tr,.opt,label.f,.kpi")||s.el; host.classList.add("coach-hl"); host.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  renderCoach(stops.length);
}
function renderCoach(total){
  const box=$("#coach"); if(!box) return;
  if(!M||UI.step==="choose"||UI.step==="library"||UI.step==="sources"){ box.hidden=true; return; } box.hidden=false;
  box.classList.toggle("min",COACH.min);
  const c=COACH.on&&COACH.path?coachFor(COACH.path):null; const w=COACH.walk;
  const head=`<div class="coach-head"><span class="eyebrow">Coach</span>${w?`<span class="small muted">Stop ${w.i+1}${total?" of "+total:""} · ${esc((STEPS.find(s=>s.id===UI.step)||{}).n)}</span>`:""}<button class="btn sm ghost" id="coachMin" aria-label="${COACH.min?"Expand coach":"Minimise coach"}">${COACH.min?"Show":"Hide"}</button></div>`;
  if(COACH.min){ box.innerHTML=head; $("#coachMin").onclick=()=>{ COACH.min=false; renderCoach(total); }; return; }
  const sec=(h,x)=>x?`<div class="coach-sec"><div class="coach-h">${h}</div><div>${x}</div></div>`:"";

  return `<div class="grid3">

/* ---------- 7. Assumptions ---------- */
function autoAssumptions(){
  if(!R) return [];
  const B=M.basis, f=M.fin, cx=M.capex, cls=AACE[cx.cls]||AACE[4], L=locOf(B.loc);
  const a=[
    ["a_cur",`All costs are in ${B.cur} at ${B.cy} prices (CEPCI ${B.cepci}). Built-in US-dollar data are converted at ${B.fx} ${B.cur} per US$.`],
    ["a_loc",`The plant is built in ${L[1]} with a location factor of ${(+B.lf).toFixed(2)} relative to the US Gulf Coast.`],
    ["a_cap",`Capital cost is estimated with the ${CAPEX_METHODS[cx.method].n} method, a ${cls.n} estimate (${cls.rng}).`],
    ["a_time",`Construction takes ${f.cons} year(s); the plant operates for ${f.life} years at ${f.ramp1}% of capacity in year 1, ${f.ramp2}% in year 2 and 100% after${+f.deg?", declining "+f.deg+"% per year":""}.`],
    ["a_disc",`Cash flows are in ${f.basis==="nominal"?"nominal terms with "+f.esc+"% annual escalation":"real (constant-price) terms"}, discounted at ${f.r}% per year to the start of construction (end-of-year convention).`],
    ["a_tax",`Income tax is ${f.tax}% with ${DEPR[f.dep].n.toLowerCase()} depreciation${f.dep==="sl"?" over "+f.depN+" years":""}; tax losses are ${f.carry===false?"not ":""}carried forward.`],
    ["a_wc",`Working capital is ${f.wc}% of fixed capital and start-up costs ${f.su}%; working capital and land are recovered at the end, with ${f.salv}% salvage value.`],
    ["a_price",`${M.main.n} sells at ${money(R.A.pMain,false)} per ${M.main.u} throughout the plant's life, and all output is sold.`]
  ];
  if(+f.debt>0) a.push(["a_debt",`${f.debt}% of fixed capital is borrowed at ${f.di}% over ${f.dterm} years.`]);
  if(f.cmode!=="none") a.push(["a_c",`Carbon is ${f.cmode==="credit"?"credited for emissions avoided against "+(f.refname||"the replaced product"):"taxed on the product's own emissions"} at ${money(+f.cprice,false)} per tonne CO₂e.`]);
  return a.map(([id,t])=>{ const s=M.autoSt[id]||{}; return {id,t,status:s.status||"pending",note:s.note||"",auto:true}; });
}

/* ---------- 8. Results ---------- */
const eqBasis = () => M.fin.mspBasis==="equity"&&+M.fin.debt>0&&R&&R.eqNpv!=null;
const mainNpv = () => eqBasis()?R.eqNpv:R.npv;
function verdict(){
  const p=R.A.pMain, ms=R.msp, npv=mainNpv(), who=eqBasis()?"the owners' equity":"the project";
  if(!isFinite(ms)) return ["mid","The model has no main-product output, so no minimum selling price can be found."];
  const gap=(p-ms)/Math.abs(ms||1);
  if(npv>=0) return ["ok",`At ${money(p,false)} per ${M.main.u} ${who} earns more than your ${M.fin.r}% required return (NPV ${money(npv)}${isFinite(eqBasis()?R.eqIrr:R.irr)?", IRR "+fmtPct(eqBasis()?R.eqIrr:R.irr):""}). The price could fall to ${money(ms,false)} (${Math.abs(gap*100).toFixed(0)}% lower) before the project stops paying.`];
  return [gap>-0.25?"mid":"no",`At ${money(p,false)} per ${M.main.u} ${who} does not earn the required ${M.fin.r}% (NPV ${money(npv)}). It needs at least ${money(ms,false)} per ${M.main.u}, ${Math.abs(gap*100).toFixed(0)}% above the assumed price.`];
}
function interpret(){
  const out=[]; const [,v]=verdict(); out.push(v);
  const uc=unitCost(M,R).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  if(uc.length){ const tot=uc.reduce((a,x)=>a+x[1],0); out.push(`The largest cost per ${M.main.u} is “${uc[0][0]}” (${money(uc[0][1],false)}, ${(uc[0][1]/tot*100).toFixed(0)}% of gross cost)${uc[1]?`, followed by “${uc[1][0]}” (${(uc[1][1]/tot*100).toFixed(0)}%)`:""}. Improving these gives the biggest return on effort.`); }
  const cls=AACE[M.capex.cls]||AACE[4];
  out.push(`Capital cost is a ${cls.n.toLowerCase()} estimate (${cls.rng}). Total capital investment is ${money(R.cap.TCI)}, of which ${money(R.cap.FCI)} is fixed capital.`);
  if(UI.sens&&UI.sens.items.length){ const t=UI.sens.items.slice(0,3).map(i=>i.n.toLowerCase()); out.push(`The result is most sensitive to ${t.join(", ")}. Better data on these matter most.`); }
  if(UI.mc) out.push(`With the uncertainty in inputs and capital cost, the chance that NPV is positive is ${(UI.mc.pPos*100).toFixed(0)}%; the minimum selling price lies between ${money(UI.mc.msp.p5,false)} and ${money(UI.mc.msp.p95,false)} (90% interval).`);
  if(+M.basis.trl<=5) out.push(`At TRL ${M.basis.trl}, treat these results as a guide to which parameters must improve, not as an investment case.`);
  return out;
}

/* ---------- Guide ---------- */
function renderGuide(){
  const g={
    choose:`<h3>How this works</h3><p>A techno-economic assessment (TEA) asks two things: can the process be built and run, and does it make money? It follows the same order as engineering textbooks (Peters & Timmerhaus; Towler & Sinnott; Turton):</p><ul><li><b>Basis:</b> what you make, where, and when.</li><li><b>Capital cost:</b> the cost of building the plant.</li><li><b>Operating cost and revenue:</b> the yearly running account.</li><li><b>Finance:</b> time value of money, tax and loans.</li><li><b>Results:</b> NPV, IRR, payback, minimum selling price, sensitivity and uncertainty.</li></ul><p class="small muted">Your study is kept in this browser. Use “Save project file” to keep a copy or move it to another computer.</p>`,
    basis:`<h3>Getting the basis right</h3><p><b>Main product.</b> Pick the output whose price decides the business. The minimum selling price is worked out for it.</p><p><b>Capacity.</b> Use output at full capacity; ramp-up and downtime come later.</p><p><b>Maturity.</b> Early-stage (low TRL) processes almost always turn out more expensive than first estimated. The estimate class tells readers how far to trust the numbers.</p>`,
    data:`<h3>Collecting good data</h3><ul><li>Mass and energy balances from your experiments or a process simulator are the best source.</li><li>Prices: use recent invoices, supplier quotes or market reports, and say where they come from.</li><li>Mark each input's source. Measured and quoted values have tighter uncertainty in the Monte Carlo analysis.</li><li>Ranges (Expert mode) drive the sensitivity and uncertainty analysis.</li></ul>`,
    capex:`<h3>Which method?</h3><p><b>No equipment list yet:</b> capacity scaling from a similar plant.</p><p><b>Main equipment known:</b> Lang or Hand factors, or the percentage method for an itemised breakdown.</p><p><b>Equipment sized, materials chosen:</b> detailed factorial (Towler & Sinnott).</p><p><b>Buying packages:</b> vendor quotes.</p><p class="small muted">Fixed capital (FCI) is the plant itself. Total capital (TCI) adds working capital, start-up costs and land.</p>`,
    opex:`<h3>Operating costs</h3><p><b>Variable costs</b> rise with output: feedstock, chemicals, energy, waste.</p><p><b>Fixed costs</b> are paid regardless: labour, maintenance, insurance, overheads.</p><p>Early studies estimate the fixed items as percentages. When you know the real figure (an O&M contract, say), enter it as a line and set its percentage to zero.</p><p><b>Co-products</b> reduce the net cost of the main product. Avoided costs (e.g. disposal fees you no longer pay) count as income.</p>`,
    finance:`<h3>Finance in plain words</h3><p><b>Discounting.</b> Money received later is worth less than money today. The discount rate sets how much less.</p><p><b>NPV</b> adds up all discounted cash flows. Positive means the project beats your required return.</p><p><b>IRR</b> is the discount rate at which NPV is zero.</p><p><b>Depreciation</b> spreads the capital cost for tax purposes. It changes when tax is paid, not the cash spent.</p><p><b>Carbon link.</b> Enter the footprint from Lifecycle Studio to get the cost of each tonne of CO₂ avoided.</p>`,
    assumptions:`<h3>Why agree assumptions?</h3><p>Two assessments of the same process can differ by a factor of two because of assumptions alone: discount rate, prices, plant life, what is inside the boundary. Agreeing them one by one makes the result yours, and makes it easy for a reader to see what drives it.</p>`,
    sources:`<h3>Why this page</h3><p>A TEA is only as good as its numbers. This page lists where every built-in value comes from, how it is cited and the terms it is used under.</p><p>If you have a newer or better figure, replace it where it is used. The report lists every value you changed.</p>`,
    library:`<h3>Using the explorer</h3><p>Every study here reports at least one economic result. The coloured chips under each title are numbers found automatically in the abstract: use them to see the typical range, then open the paper to check scope, scale and cost year before you compare.</p><p><b>Open access</b> papers can be read free. Choose a product to see the spread of published costs.</p>`,
    results:`<h3>Reading the results</h3><p><b>NPV</b> positive: the project pays at your discount rate.</p><p><b>Minimum selling price</b>: the lowest price that still gives NPV = 0 after tax. Compare it with the market price.</p><p><b>Levelised cost</b>: all costs spread per unit, before tax. It is lower than the minimum selling price when tax is paid.</p><p><b>Sensitivity</b> shows which inputs matter; <b>uncertainty</b> gives the odds of success.</p><p><b>Compare</b> appears once you add an alternative at the top.</p>`
  }[UI.step]||"";
  $("#guide").innerHTML=g;
}

function wfData(T,o){ const uc=unitCost(M,R); const sum=uc.reduce((a,s)=>a+s[1],0);
  return Object.assign({steps:uc,totals:[["Cost per "+M.main.u+" (sum of the above)",sum,T.ink2],["Minimum selling price (after tax)",R.msp,T.accent],["Assumed selling price",R.A.pMain,T.brass]],theme:T,fmt:v=>money(v,false)},o); }
/* Two-way sensitivity */
function heatVars(){ const v=M.params.filter(p=>!p.fixed&&isFinite(+p.v)).map(p=>({k:p.k,n:p.l+(p.u?" ("+p.u+")":"")}));
  return [{k:"__cap",n:"Capital cost (× estimate)"},{k:"__r",n:"Discount rate (%)"},{k:"__price",n:"Selling price of "+M.main.n}].concat(v); }
function heatAxis(k){ const n=7;
  if(k==="__cap"){ const c=AACE[M.capex.cls]||AACE[4]; const lo=1+c.lo/100, hi=1+c.hi/100; return pts(lo,1,hi).map(v=>({v,lab:"×"+v.toFixed(2)})); }
  if(k==="__r"){ const b=+M.fin.r||0; return pts(Math.max(0,b-4),b,b+4).map(v=>({v,lab:v.toFixed(1)+"%"})); }
  if(k==="__price"){ const b=R.A.pMain||R.msp||1; return pts(b*0.7,b,b*1.3).map(v=>({v,lab:shortMoney(v,curSym(M))})); }
  const p=M.params.find(x=>x.k===k); const [lo,hi]=paramRange(p); return pts(lo,+p.v,hi).map(v=>({v,lab:fmtN(v)}));
  function pts(lo,b,hi){ return [0,1,2].map(i=>lo+(b-lo)*i/3).concat([b],[1,2,3].map(i=>b+(hi-b)*i/3)); } }
function heatOv(ov,k,v){ if(k==="__cap") ov.capMult=v; else if(k==="__r") ov.fin=Object.assign({},ov.fin||{},{r:v}); else if(k==="__price") ov.price=v; else ov.P=Object.assign({},ov.P||{},{[k]:v}); return ov; }
function runHeat(kx,ky,metric){ const xs=heatAxis(kx), ys=heatAxis(ky);
  const grid=ys.map(yv=>xs.map(xv=>{ const ov=heatOv(heatOv({},kx,xv.v),ky,yv.v); try{ return metric==="msp"?msp(M,ov):calculate(M,ov).npv; }catch(e){ return NaN; } }));
  return {kx,ky,metric,xs,ys,grid}; }

/* ---------- Undo / redo (snapshots of the whole project) ---------- */
const HIST = {undo:[],redo:[],last:null,busy:false,max:60};
const _store = store;
store = function(){
  if(!HIST.busy){ const cur=PROJ?JSON.stringify(PROJ):null;
    if(HIST.last!==null&&cur!==HIST.last){ HIST.undo.push(HIST.last); if(HIST.undo.length>HIST.max) HIST.undo.shift(); HIST.redo=[]; }
    HIST.last=cur; }
  _store(); histButtons();
};
function histApply(snap){ HIST.busy=true; PROJ=snap?JSON.parse(snap):null; M=PROJ?PROJ.alts[PROJ.active||0]:null; if(!M){ UI.step="choose"; } recalc(); HIST.last=snap; _store(); HIST.busy=false; render(); histButtons(); }
function undo(){ if(!HIST.undo.length) return; HIST.redo.push(HIST.last); histApply(HIST.undo.pop()); toast("Undone."); }
function redo(){ if(!HIST.redo.length) return; HIST.undo.push(HIST.last); histApply(HIST.redo.pop()); toast("Redone."); }
function histButtons(){ const u=$("#btnUndo"), r=$("#btnRedo"); if(u) u.disabled=!HIST.undo.length; if(r) r.disabled=!HIST.redo.length; }

async function b64gz(str){ const s=new Blob([str]).stream().pipeThrough(new CompressionStream("gzip")); const buf=new Uint8Array(await new Response(s).arrayBuffer());
  let b=""; for(let i=0;i<buf.length;i+=0x8000) b+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function unb64gz(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const bin=atob(t), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
async function shareLink(){
  if(!PROJ){ toast("Start a study first."); return; }
  if(typeof CompressionStream==="undefined"){ toast("This browser cannot make share links. Use Save project file instead."); return; }

    ${framed?`<p class="small muted">Share links work on the hosted website version of this tool. Inside this preview window, use Save project file.</p>`:""}`,
    r=>{ r.querySelector("#shareCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast("Link copied."); }catch(e){ const t=r.querySelector("#shareTxt"); t.select(); toast("Press Ctrl+C (Cmd+C) to copy."); } }; });
}
async function loadFromHash(){

/* ---------- Glossary and quick search ---------- */
const GLOSSARY = [
  ["TEA (techno-economic assessment)","A study that asks whether a process can be built and run, and whether it makes money, by combining engineering design with cost and cash-flow analysis."],
  ["CAPEX","Capital expenditure: the one-off money spent to design, build and start a plant."],
  ["OPEX","Operating expenditure: the yearly cost of running the plant (feedstock, energy, chemicals, labour, maintenance)."],
  ["Total capital investment (TCI)","Fixed capital plus working capital, start-up costs and land."],
  ["Fixed capital investment (FCI)","Everything needed to build the plant: equipment, installation, buildings, offsites, engineering and contingency."],
  ["ISBL / OSBL","Inside battery limits (the process units) and outside battery limits (utilities, storage, offsites)."],
  ["Working capital","Money tied up in stocks of raw materials and products and in unpaid bills; recovered at the end of the project."],
  ["Lang factor","A single multiplier that turns the total purchased equipment cost into the fixed capital (about 3–5)."],
  ["Hand factors","Separate installation multipliers for each type of equipment."],
  ["Six-tenths rule (capacity scaling)","Cost₂ = Cost₁ × (Size₂/Size₁)^n, with n near 0.6: doubling capacity raises cost by only about 50%."],
  ["CEPCI","Chemical Engineering Plant Cost Index: moves a cost from one year to another."],
  ["Location factor","Adjusts a US Gulf Coast cost to another place (US Gulf Coast = 1.00)."],
  ["AACE estimate class","How accurate a capital estimate is, from Class 5 (concept, −50%/+100%) to Class 1 (definitive)."],
  ["TRL","Technology readiness level, from 1 (basic idea) to 9 (proven commercial operation)."],
  ["Contingency","An allowance for costs that are expected but not yet identified."],
  ["Discount rate","The yearly return the money could earn elsewhere; future cash is divided by (1 + r) for each year of waiting."],
  ["WACC","Weighted average cost of capital: the blended return required by lenders and owners."],
  ["NPV (net present value)","All future cash flows, discounted to today, minus the investment. Positive means the project beats the discount rate."],
  ["IRR (internal rate of return)","The discount rate at which NPV is zero; the project's own rate of return."],
  ["Payback period","Years after start-up until the cumulative cash flow turns positive."],
  ["Minimum selling price (MSP)","The lowest price of the main product that gives NPV = 0 after tax."],
  ["Levelised cost (LCOP, LCOE, LCOH)","Discounted lifetime cost divided by discounted lifetime output, before tax: the average cost per unit."],
  ["Capital recovery factor (CRF)","Turns a capital sum into an equal yearly payment: CRF = r / (1 − (1 + r)^−n)."],
  ["Depreciation","Spreading the capital cost over several years for tax purposes; it lowers taxable profit."],
  ["MACRS","US tax depreciation schedule (e.g. 7-year for process plants)."],
  ["Salvage value","What the plant is worth at the end of its life."],
  ["Ramp-up","Output in the first years is lower while the plant is commissioned and optimised."],
  ["Nominal vs real","Nominal values include inflation; real values remove it. Use real prices with a real discount rate, or nominal with nominal."],
  ["Sensitivity analysis (tornado)","Moving one input at a time to see which ones change the result most."],
  ["Monte Carlo analysis","Running the model many times with random inputs drawn from their ranges to see the spread of possible results."],
  ["Two-way sensitivity","Changing two inputs together to map combinations that make the project work."],
  ["Co-product credit","Revenue from by-products, subtracted from the cost of the main product."],
  ["Capital grant","Public money paying part of the investment."],
  ["Investment tax credit (ITC)","A tax credit equal to a share of the investment."],
  ["Production tax credit (PTC)","A payment per unit produced for a set number of years."],
  ["Cost of CO₂ avoided","Extra cost of the new product ÷ emissions it avoids, per tonne CO₂e."],
  ["First-of-a-kind (FOAK) vs nth-of-a-kind (NOAK)","The first plant costs more than later ones built once the technology is mature; most published MSPs assume an nth plant."],
  ["Break-even utilisation","The share of capacity at which revenue just covers operating costs."]
];

    <p class="small muted" style="margin-top:8px">Shortcuts: <b>/</b> search · <b>Ctrl+Z</b> undo · <b>Ctrl+Y</b> redo · <b>Alt+→ / Alt+←</b> next or previous step.</p>`, r=>{

      const gl=GLOSSARY.filter(g=>hit(g[0])||hit(g[1])).map(g=>`<div style="border-top:1px solid var(--line);padding-top:6px"><b>${esc(g[0])}</b><div class="small">${esc(g[1])}</div></div>`);
      box.innerHTML=(steps.concat(ins).join("")+gl.join(""))||`<p class="muted small">Nothing found.</p>`;
      box.querySelectorAll("[data-hgo]").forEach(b=>b.onclick=()=>{ closeModal(); go(b.dataset.hgo); });
      box.querySelectorAll("[data-hin]").forEach(b=>b.onclick=()=>{ closeModal(); go("data"); const i=M.params.findIndex(p=>p.k===b.dataset.hin); setTimeout(()=>{ const el=document.querySelector(`[data-b="params.${i}.v"]`); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60); }); };
    inp.oninput=draw; draw(); setTimeout(()=>inp.focus(),30); });

const pdfText=s=>String(s==null?"":s).replace(/₦/g,"NGN ").replace(/₹/g,"INR ").replace(/GH₵/g,"GHS ").replace(/₂/g,"2").replace(/₃/g,"3").replace(/³/g,"3").replace(/²/g,"2").replace(/[−‑]/g,"-").replace(/→/g,"->").replace(/≈/g,"~").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/×/g,"x").replace(/[^\x00-\xFF–—‘’“”…•€]/g,"?");

function pdfTable(d,b,C){
  const {ML,CW}=C; const tw=b.wd.reduce((a,c)=>a+c,0); const cw=b.wd.map(w=>CW*w/tw);

  const measure=(cells,bold)=>{ d.setFont("helvetica",bold?"bold":"normal"); d.setFontSize(fs); return cells.map((c,i)=>d.splitTextToSize(pdfText(c),cw[i]-2*pad)); };
  const drawRow=(lines,bold,fill)=>{ const h=Math.max(...lines.map(l=>l.length))*lh+2*pad;
    if(C.y+h>297-C.MB){ C.newPage(); drawHead(); }
    if(fill){ d.setFillColor(...fill); d.rect(ML,C.y,CW,h,"F"); }
    d.setFont("helvetica",bold?"bold":"normal"); d.setFontSize(fs); d.setTextColor(...C.ink);
    let x=ML; lines.forEach((l,i)=>{ d.text(l,x+pad,C.y+pad+lh*0.8); x+=cw[i]; });
    d.setDrawColor(211,217,226); d.setLineWidth(.15); d.line(ML,C.y+h,ML+CW,C.y+h); C.y+=h; };
  const headLines=measure(b.head,true); const drawHead=()=>drawRow(headLines,true,[221,231,242]);

  const cl=d.splitTextToSize(pdfText(b.cap),CW); if(C.y+cl.length*4+14>297-C.MB) C.newPage();
  d.text(cl,ML,C.y+3.5); C.y+=cl.length*4+2;
  drawHead(); b.rows.forEach((r,i)=>drawRow(measure(r,false),false,i%2?[245,247,250]:null)); C.y+=5;
}
async function renderDOCX(blocks){

async function makeReport(kind){

  const wantAI=$("#repAI")&&$("#repAI").checked;
  try{
    if(wantAI&&!UI.discussion){ st.innerHTML=`<span class="spin"></span> Claude is drafting the discussion…`; try{ UI.discussion=await AI.discussion(); }catch(e){ UI.discussion=""; } }
    if(!wantAI) UI.discussion="";
